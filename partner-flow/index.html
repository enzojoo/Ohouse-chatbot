 ○○)", "- 고객 동의: ○○", "이대로 진행할까요?"]}, {"k": "2-2", "id": "2-2", "t": "귀책 변경: 판매자→구매자", "sec": true, "body": ["파트너님, 판매자 귀책으로 접수됐지만 실제로는 구매자 귀책인 경우, 파트너님이 반품불가(또는 교환불가) 처리하면서 사유를 적어 주시면 고객님이 확인 후 올바른 사유로 다시 접수하실 수 있습니다.", "- 경로: 오로라 > 취소/반품/교환 > 반품관리(교환은 교환관리) > 해당 주문 선택 > [반품불가] > 불가 사유 입력", "- 반품불가 처리 시 주문은 반품 요청 이전 상태로 돌아가고, 고객님께 불가 사유가 담긴 알림톡이 발송됩니다.", "- 반품상태가 '수거완료'라면 수거완료일로부터 8영업일째 자동 환불승인되니 그 전에 처리해 주세요.", "- 고객님과 협의 없이 임의로 불가 처리해 분쟁이 생기면 판매자 귀책이 될 수 있으니, 먼저 고객님과 협의해 주세요.", "- 이미 회수한 상품을 고객님께 다시 보내게 되면 재발송 비용 문제가 생길 수 있으니, 고객님이 재접수하시면 그때 처리해 주세요."]}, {"k": "2-2/2-2-1", "id": "2-2-1", "t": "이 경우 오늘의집에서 고객님께 구매자 귀책 처리와 비용 발생을 안내해 드립니다. 고객님이 수긍하지 않으시거나 연락이 닿지 않으면 반품 처리 비용을 파트너님 계좌로 받으실 수 있도록 진행합니다. 반품 처리 비용, 입금받으실 계좌번호와 예금주를 알려주세요.", "sec": false, "body": []}, {"k": "2-3", "id": "2-3", "t": "귀책 변경: 구매자→판매자", "sec": true, "body": ["파트너님, 고객님과 협의해 반품비가 발생하지 않도록 판매자 귀책으로 바꾸시려는 건가요?"]}, {"k": "2-3/2-3-1", "id": "2-3-1", "t": "판매자 귀책으로 바꾸면 고객님께 비용이 발생하지 않아, 기존 접수 건을 반품불가 처리한 뒤 판매자 귀책으로 다시 접수하고 고객님께 안내 문자를 보내 드립니다. 바꾸는 사유를 알려주세요. (예: 출고 전 취소였는데 고객님이 먼저 반품 접수해 배송비가 차감됨, 고객님과 비용 협의 완료)", "sec": false, "body": []}, {"k": "2-4", "id": "2-4", "t": "사유 변경", "sec": true, "body": ["파트너님, 반품·교환 사유는 판매자가 직접 수정할 수 없습니다. 사유가 잘못 선택된 경우 고객님과 협의한 뒤 해당 건을 [반품불가] 또는 [교환불가] 처리하고, 고객님이 올바른 사유로 다시 접수하시도록 안내해 주세요. 처리가 계속 늦어지거나 중재가 필요하시면 다시 문의해 주세요."]}, {"k": "2-5", "id": "2-5", "t": "클레임 철회", "sec": true, "body": ["어떤 철회가 필요하신가요?"]}, {"k": "2-5/2-5-1", "id": "2-5-1", "t": "자동수거 상품은 수거 요청이 택배사로 전달되기 전까지 직접", "sec": false, "body": []}, {"k": "2-5/2-5-2", "id": "2-5-2", "t": "취소·교환 요청 자체를 철회하는 것은 파트너센터에서 처리해 드립니다. 철회는 고객님 동의가 꼭 필요합니다. 고객님께 안내하고 동의를 받으셨나요?", "sec": false, "body": []}, {"k": "2-5/2-5-3", "id": "2-5-3", "t": "고객님께 철회를 안내하고 동의를 받으신 뒤 다시 문의해 주시면 처리해 드리겠습니다. → 상담 종료 (유형: PA002008)", "sec": false, "body": []}, {"k": "2-6", "id": "2-6", "t": "환불승인 완료 건 되돌리기", "sec": true, "body": ["파트너님, 이미 환불승인이 완료된 건은 처리 이전으로 되돌릴 수 없습니다. 고객님이 같은 상품을 다시 구매하신 뒤, 새 주문번호와 함께 배송상태 변경을 요청해 주시면 결제 후 '배송완료'로 상태를 변경해 드립니다."]}, {"k": "2-6/2-7", "id": "2-7", "t": "고객님이 수긍하지 않으시는 경우에는 상담원이 사실관계를 확인하고 중재를 도와드립니다. 고객님 불만 내용과 파트너님 입장을 각각 적어 주세요.", "sec": false, "body": []}], "hocond": "교환→반품 전환·구매자→판매자 귀책 재접수·취소/교환 철회·재구매 건 배송상태 변경(Write) T3-A / 판매자→구매자 귀책 재인입·고객 미수긍 중재 T3-C / 수거철회 실패가 계속되면 T3-B / 공통: 상담원 직접 요청 T1 / 같은 질문 반복·미해결 T2 / 감정·민원 T4 / 복수 용건 T7 / 운영시간 종료 직전 인계 T8", "hoinfo": "주문번호·주문옵션번호, 파트너가 선택한 클레임 유형과 진행 단계(교환 상태를 모르면 '교환 상태 미확인'), 요청 변경 내용, 변경 후 귀책과 사유, 고객 동의 여부, 미수긍·재인입 시 반품 처리 비용·입금 계좌·예금주, 분쟁 시 고객 불만 내용·파트너 입장, 재구매 주문번호. 귀책·수거처리유형 등 현재 클레임 상세는 상담원이 확인", "kms": "051_교환.md, 052_반품.md, 080_파트너센터_교육자료__클레임.md, 063_취소.md, 093_고객센터_협업_유형_및_이관_방법.md, 090_민원_업무_프로세스_.md, 060_상담_태그별_주요_문의유형_.md", "check": "1) 교환→반품 전환은 오로라 미지원이라 어드민에서 교환불가(또는 교환완료) 후 반품 접수: 교환불가는 오로라에서도 가능하지만 반품 접수는 고객·센터만 가능해 전 과정을 상담원 처리로 둠, 파트너 셀프 분기를 둘지 결정 필요. 2) 교환불가 후 반품 재접수 시 회수 상품 처리 기준 없음(051은 '교환불가 시 상품을 구매자에게 재배송'으로 적혀 있음). 3) 취소·교환 철회는 어드민 전용(오로라 미노출)이라 상담원 처리로 둠. 4) 교환불가·반품불가 후 자동 구매확정 8일째/8영업일째 혼재. 5) 판매자→구매자 귀책 재인입 시 계좌 정보를 챗봇이 받아도 되는지(개인정보·보안) 확인 필요. 6) (1차 전환) 클레임 유형·교환 상태를 파트너 선택으로 받고, 오로라 취소관리·반품관리·교환관리 확인 경로를 안내함. 2-5 철회는 클레임 유형을 조회하지 못해 파트너가 '수거 철회'와 '요청 자체 철회'를 고르게 바꿈. 이 구분을 파트너가 이해할 수 있는지 확인 필요. 7) W-03 배송상태 변경은 API 명세상 '상담원 콘솔 우선'이라 챗봇 실행 대상으로 열지 확인 필요.", "api": "R-04, W-04, W-03", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 주문번호와 주문옵션번호: \n· 요청 내용: \n· 현재 진행 단계 (요청됨·수거 전 / 수거중 / 수거완료 / 교환 재배송중 / 완료 / 잘 모름): \n· 변경·철회 사유: \n· 고객 동의 (동의받음 / 못 받음): \n· (해당 시: 귀책 판매자→구매자) 이미 불가 처리했는데 고객이 같은 사유로 다시 접수했는지: \n· (해당 시: 환불승인 완료 건 되돌리기) 재구매 주문번호: \n\n문의 내용: ", "mode": "조건별: 판매자→구매자 귀책·사유 변경·자동수거 철회·환불승인 되돌리기 문의는 자동답변 종결(셀프 경로·불가 안내) / 교환→반품·구매자→판매자 귀책·요청 철회·재접수 반복·재구매 건 상태 변경은 상담원 배정", "segs": [{"c": ["A"], "t": "판매자→구매자 귀책·사유 변경·자동수거 철회·환불승인 되돌리기 문의는 자동답변 종결(셀프 경로·불가 안내)"}, {"c": ["C"], "t": "교환→반품·구매자→판매자 귀책·요청 철회·재접수 반복·재구매 건 상태 변경은 상담원 배정"}], "auto": "(공통 첫인사)\n\n[판매자 귀책으로 접수됐지만 실제로는 구매자 귀책인 경우]\n파트너님이 반품불가(또는 교환불가) 처리하면서 사유를 적어 주시면, 고객님이 확인 후 올바른 사유로 다시 접수하실 수 있습니다.\n- 경로: 오로라 > 취소/반품/교환 > 반품관리(교환은 교환관리) > 해당 주문 선택 > [반품불가] > 불가 사유 입력\n- 반품불가 처리 시 주문은 반품 요청 이전 상태로 돌아가고, 고객님께 불가 사유가 담긴 알림톡이 발송됩니다.\n- 반품상태가 '수거완료'라면 수거완료일로부터 8영업일째 자동 환불승인되니 그 전에 처리해 주세요.\n- 고객님과 협의 없이 임의로 불가 처리해 분쟁이 생기면 판매자 귀책이 될 수 있으니 먼저 고객님과 협의해 주세요.\n- 이미 회수한 상품을 고객님께 다시 보내면 재발송 비용 문제가 생길 수 있으니, 고객님이 재접수하시면 그때 처리해 주세요.\n이미 불가 처리했는데 고객님이 같은 사유로 다시 접수하셨다면 그 내용을 적어 새 문의로 남겨 주세요.\n\n[반품·교환 사유를 바꾸시려는 경우]\n반품·교환 사유는 판매자가 직접 수정할 수 없습니다. 고객님과 협의한 뒤 해당 건을 [반품불가] 또는 [교환불가] 처리하고, 고객님이 올바른 사유로 다시 접수하시도록 안내해 주세요.\n\n[자동수거 상품의 수거를 철회하시려는 경우]\n자동수거 상품은 수거 요청이 택배사로 전달되기 전까지 직접 [수거철회]하실 수 있습니다. 오로라 > 취소/반품/교환 > 반품관리(교환은 교환관리)에서 해당 주문을 선택하고 [수거철회]를 눌러 주세요. 수거철회는 주문 단위로만 되며, 여러 옵션 중 하나라도 수거 요청 이후 단계면 철회되지 않습니다. 철회에 실패하면 택배사에 수거 취소를 요청하신 뒤 반품불가(교환불가) 처리하면 이전 배송 상태로 돌아갑니다.\n\n[이미 환불승인된 건을 되돌리시려는 경우]\n이미 환불승인이 완료된 건은 처리 이전으로 되돌릴 수 없습니다. 고객님이 같은 상품을 다시 구매하신 뒤 새 주문번호와 함께 배송상태 변경을 요청해 주시면, 결제 후 '배송완료'로 상태를 변경해 드립니다.\n(맺음 A)", "ack": "요청하신 변경 내용과 고객님 동의 여부를 확인한 뒤 처리하겠습니다.\n(교환→반품: \"교환 건은 반품으로 바로 바꾸는 기능이 없어, 교환 상태에 따라 교환을 정리한 뒤 반품을 새로 접수하는 방식으로 처리됩니다.\")\n(구매자 귀책으로 바꾸는 건·고객 미수긍 건: \"오늘의집에서 고객님께 처리 내용과 비용 발생을 안내한 뒤 진행하며, 필요한 정보는 상담원이 따로 여쭤보겠습니다.\")\n(요청 철회 중 고객 동의를 못 받은 건: \"철회는 고객님 동의가 꼭 필요해, 동의 확인 후 처리됩니다.\")", "info": "주문번호·주문옵션번호, 현재 클레임 유형과 진행 단계, 요청 변경 내용, 변경 후 귀책과 사유, 고객 동의 여부, 재접수 반복 여부, 재구매 주문번호, 분쟁 시 고객 불만·파트너 입장", "kms": "051_교환.md, 052_반품.md, 080_파트너센터_교육자료__클레임.md, 063_취소.md, 093_고객센터_협업_유형_및_이관_방법.md, 090_민원_업무_프로세스_.md", "check": "1) 판매자→구매자 귀책 재인입 시 반품 처리 비용을 받을 파트너 계좌·예금주는 양식에서 받지 않고 상담원이 따로 받도록 함 — 게시판 양식으로 계좌를 받아도 되는지(보안) 확인\n2) 교환→반품 전환은 오로라 미지원이라 전 과정을 상담원 처리로 둠 — 교환불가는 파트너도 할 수 있어 셀프 분기를 둘지 결정 필요\n3) 교환불가 후 반품 재접수 시 회수 상품 처리 기준 없음\n4) 취소·교환 요청 철회는 오로라 미노출이라 상담원 처리"}}, {"code": "PA002009", "draft": true, "name": "구매확정 후 취소·환불", "mid": "반품/교환", "vol": "264", "mode": "안내 후 조건부 상담원 연결", "utter": "구매확정된 주문인데 환불해야 해요\n구매확정 취소하려는데 정산금액이 마이너스라 환불할 수 없다고 떠요\n구매확정 후에 불량 발견됐다는데 교환은 어떻게 해요?", "raw": "1. 네, 파트너님. 구매확정된 주문의 취소·환불을 도와드리겠습니다.\n(파트너가 구매확정 전 주문이라고 하면 → 주문 상태에 맞춰 취소·반품 유형(PA002005·PA002006·PA002007)으로 전환)\n2. 어떤 도움이 필요하신가요?\n[구매확정 주문 취소 방법] / [취소하려는데 정산 마이너스 문구가 떠요] / [구매확정 후 교환하고 싶어요]\n\n2-1. [구매확정 주문 취소 방법]\n파트너님, 구매확정 주문 취소는 파트너님이 오로라에서 직접 처리하실 수 있습니다.\n- 경로 1: 오로라 > 주문배송 > 구매확정 내역 > 취소할 주문번호 검색·선택 > [구매확정주문 취소]\n- 경로 2: 오로라 > 취소/반품/교환 > 취소관리 > [구매확정주문 취소하기] > 구매확정 내역에서 주문 선택 > [구매확정주문 취소]\n처리 전 확인해 주세요.\n- 취소 사유를 꼭 선택하고 상세 사유를 입력해야 하며, 고객님 확인이 된 주문만 처리할 수 있습니다.\n- 접수가 아니라 즉시 승인되므로, 상품 회수와 배송비 등 반품 관련 정리를 먼저 끝낸 뒤 처리해 주세요.\n- 필수 옵션 상품을 취소하면 추가 구성 상품도 함께 취소해야 합니다.\n- 구매자 귀책이면 선불 배송비는 고객님께 환불되지 않고 파트너님께 정산되며, 반송(회수)이 필요하면 반송비는 고객님께 별도로 받으셔야 합니다.\n- 구매확정 취소금액이 정산 예정 금액보다 크거나, '환불금액 - 취소비용'이 0원 미만이면 직접 취소가 되지 않습니다.\n3. 고객님 확인은 받으셨나요?\n[네, 직접 처리할게요] → 상담 종료 (유형: PA002009)\n[아직이에요] → 3-1\n[해 봤는데 안 돼요] → 2-2\n3-1. 구매확정 주문 취소는 고객님 확인이 꼭 필요합니다. 고객님과 협의하신 뒤 처리해 주세요. → 상담 종료 (유형: PA002009)\n\n2-2. [정산 마이너스 문구]\n파트너님, 직접 처리 중 '정산금액이 마이너스가 되어 환불할 수 없습니다' 문구가 나오면 파트너센터에서 환불 처리를 지원해 드립니다. 몇 가지 정보를 확인하겠습니다.\n4. 주문번호와 주문옵션번호, 취소 사유를 알려주세요. [주문번호·주문옵션번호·사유 입력]\n5. 귀책을 선택해 주세요. [구매자 귀책] / [파트너 귀책]\n6. 상품 회수 여부를 선택해 주세요. [회수완료] / [회수 불필요] / [아직 회수 전]\n([아직 회수 전] → 6-1. 구매확정 주문 취소는 즉시 승인되므로 상품 회수를 먼저 마치신 뒤 다시 요청해 주세요. 회수가 필요 없는 건이면 '회수 불필요'를 선택해 주세요. → [회수 후 다시 할게요] → 상담 종료 (유형: PA002009) / [회수 불필요예요] → 7)\n7. 배송비 수취 여부를 선택해 주세요. [수취완료] / [수취 불필요] / [아직 못 받았어요]\n([아직 못 받았어요] → 7-1. 구매자 귀책으로 반송비 등 받으셔야 할 배송비가 있다면, 먼저 받으신 뒤 요청해 주세요. 수취 과정에서 분쟁이 생기면 말씀해 주세요. → [분쟁이 있어요] → 고객 주장·파트너 입장 입력 → 상담원 인계 (T3-C) / [받고 다시 할게요] → 상담 종료 (유형: PA002009))\n8. 고객님도 취소·환불에 동의하셨나요? [네] / [아니요]\n([아니요] → '구매확정 주문 취소는 고객님 동의가 필요합니다. 고객님과 협의하신 뒤 다시 문의해 주세요.' → 상담 종료 (유형: PA002009))\n9. 접수 내용을 확인해 주세요.\n- 주문번호 / 주문옵션번호: ○○\n- 취소 사유: ○○ / 귀책: ○○\n- 회수 여부: ○○ / 배송비 수취 여부: ○○ / 고객 동의: 확인\n이 내용으로 담당 부서에 전달하겠습니다. 처리되면 고객님께 취소 안내 문자가 발송됩니다. 상담원에게 연결해 드릴게요.\n→ 상담원 인계 (T3-C)\n\n2-3. [구매확정 후 교환]\n파트너님, 구매확정된 주문은 교환 개념이 없어 교환 접수가 되지 않습니다. 상품 불량 등 파트너님 사유로 교환이 필요하면 아래 방법 중 하나로 고객님과 조율해 주세요.\n- 구매확정 취소 후 고객님께 재구매 안내 (재결제된 주문이 중복 발송되지 않도록 관리 부탁드립니다)\n- 파트너님이 상품을 회수하고 재발송하는 수기 교환\n정확한 귀책 확인이 필요하니 고객님과 먼저 사유를 확인해 주세요.\n[구매확정 취소로 진행할게요] → 2-1\n[알겠어요] → 상담 종료 (유형: PA002009)\n\n(구매확정 후 1년이 지난 주문이거나 고객이 탈퇴한 경우 → 상담원 인계 (T5))", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 구매확정된 주문의<br/>취소·환불을 도와드리겠습니다.\"]:::bot\nN2[\"<b>2<\/b> 어떤 도움이 필요하신가요?\"]:::bot\nN2_1{{\"구매확정 주문 취소 방법\"}}:::sec\nN2_1_3[\"<b>3<\/b> 고객님 확인은 받으셨나요?\"]:::bot\nN2_1_3_1[\"<b>3-1<\/b> 구매확정 주문 취소는 고객님 확인이 꼭<br/>필요합니다. 고객님과 협의하신 뒤 처리해<br/>주세요.\"]:::bot\nN2_2{{\"정산 마이너스 문구\"}}:::sec\nN2_2_4[\"<b>4<\/b> 주문번호와 주문옵션번호, 취소 사유를<br/>알려주세요.\"]:::bot\nN2_2_5[\"<b>5<\/b> 귀책을 선택해 주세요.\"]:::bot\nN2_2_6[\"<b>6<\/b> 상품 회수 여부를 선택해 주세요.\"]:::bot\nN2_2_7[\"<b>7<\/b> 배송비 수취 여부를 선택해 주세요.\"]:::bot\nN2_2_8[\"<b>8<\/b> 고객님도 취소·환불에 동의하셨나요?\"]:::bot\nN2_2_9[\"<b>9<\/b> 접수 내용을 확인해 주세요.\"]:::bot\nN2_3{{\"구매확정 후 교환\"}}:::sec\nS --> N1\nN1 -->|\"파트너가 구매확정 전 주문이라고 하면 ·<br/>주문 상태에 맞춰 취소·반품\"| SW_PA002005\nN1 -->|\"파트너가 구매확정 전 주문이라고 하면 ·<br/>주문 상태에 맞춰 취소·반품<br/>「품절·재고부족 취소」·\"| SW_PA002006\nN1 -->|\"파트너가 구매확정 전 주문이라고 하면 ·<br/>주문 상태에 맞춰 취소·반품<br/>「품절·재고부족 취소」·「기타 사유 취소」·\"| SW_PA002007\nN2 -->|\"구매확정 주문 취소 방법\"| N2_1\nN2_1_3 -->|\"네, 직접 처리할게요\"| END\nN2_1_3 -->|\"아직이에요\"| N2_1_3_1\nN2_1_3 -->|\"해 봤는데 안 돼요\"| N2_2\nN2_1_3_1 --> END\nN2 -->|\"정산 마이너스 문구\"| N2_2\nN2_2_4 -->|\"주문번호·주문옵션번호·사유 입력\"| N2_2_5\nN2_2_5 -->|\"구매자 귀책 / 파트너 귀책\"| N2_2_6\nN2_2_6 -->|\"아직 회수 전\"| IN_6_1\nN2_2_6 -->|\"회수 불필요예요\"| N2_2_7\nN2_2_6 -->|\"회수완료 / 회수 불필요 / 아직 회수 전\"| N2_2_7\nN2_2_7 -->|\"아직 못 받았어요\"| IN_7_1\nN2_2_7 -->|\"받고 다시 할게요\"| END\nN2_2_7 -->|\"수취완료 / 수취 불필요 / 아직 못<br/>받았어요\"| N2_2_8\nN2_2_8 -->|\"아니요\"| END\nN2_2_8 -->|\"네 / 아니요\"| N2_2_9\nN2_2_9 --> HO_T3C\nN2 -->|\"구매확정 후 교환\"| N2_3\nN2_3 -->|\"구매확정 취소로 진행할게요\"| N2_1\nN2_3 -->|\"알겠어요\"| END\nN2_3 -->|\"구매확정 후 1년이 지난 주문이거나 고객이<br/>탈퇴한 경우\"| HO_T5\nN2_1 --> N2_1_3\nN2_2 --> N2_2_4\nN1 -.-> N2\nSW_PA002005[/\"「품절·재고부족 취소」로 전환\"/]:::sw\nSW_PA002006[/\"「기타 사유 취소」로 전환\"/]:::sw\nSW_PA002007[/\"「반품 대리접수」로 전환\"/]:::sw\nEND([\"상담 종료\"]):::fin\nIN_6_1[\"<b>6-1<\/b> 구매확정 주문 취소는 즉시 승인되므로 상품<br/>회수를 먼저 마치신 뒤 다시 요청해 주세요.<br/>회수가 필요 없는 건이면 '회수 불필요'를<br/>선택해 주세요.\"]:::bot\nIN_7_1[\"<b>7-1<\/b> 구매자 귀책으로 반송비 등 받으셔야 할<br/>배송비가 있다면, 먼저 받으신 뒤 요청해<br/>주세요. 수취 과정에서 분쟁이 생기면 말씀해<br/>주세요.\"]:::bot\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nHO_T5([\"상담원 인계<br/>답변 불가\"]):::ho\nIN_6_1 -.-> N2_2_7\nIN_7_1 -.-> N2_2_8", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 구매확정된 주문의 취소·환불을 도와드리겠습니다.", "sec": false, "body": []}, {"k": "2", "id": "2", "t": "어떤 도움이 필요하신가요?", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "구매확정 주문 취소 방법", "sec": true, "body": ["파트너님, 구매확정 주문 취소는 파트너님이 오로라에서 직접 처리하실 수 있습니다.", "- 경로 1: 오로라 > 주문배송 > 구매확정 내역 > 취소할 주문번호 검색·선택 > [구매확정주문 취소]", "- 경로 2: 오로라 > 취소/반품/교환 > 취소관리 > [구매확정주문 취소하기] > 구매확정 내역에서 주문 선택 > [구매확정주문 취소]", "처리 전 확인해 주세요.", "- 취소 사유를 꼭 선택하고 상세 사유를 입력해야 하며, 고객님 확인이 된 주문만 처리할 수 있습니다.", "- 접수가 아니라 즉시 승인되므로, 상품 회수와 배송비 등 반품 관련 정리를 먼저 끝낸 뒤 처리해 주세요.", "- 필수 옵션 상품을 취소하면 추가 구성 상품도 함께 취소해야 합니다.", "- 구매자 귀책이면 선불 배송비는 고객님께 환불되지 않고 파트너님께 정산되며, 반송(회수)이 필요하면 반송비는 고객님께 별도로 받으셔야 합니다.", "- 구매확정 취소금액이 정산 예정 금액보다 크거나, '환불금액 - 취소비용'이 0원 미만이면 직접 취소가 되지 않습니다."]}, {"k": "2-1/3", "id": "3", "t": "고객님 확인은 받으셨나요?", "sec": false, "body": []}, {"k": "2-1/3-1", "id": "3-1", "t": "구매확정 주문 취소는 고객님 확인이 꼭 필요합니다. 고객님과 협의하신 뒤 처리해 주세요. → 상담 종료 (유형: PA002009)", "sec": false, "body": []}, {"k": "2-2", "id": "2-2", "t": "정산 마이너스 문구", "sec": true, "body": ["파트너님, 직접 처리 중 '정산금액이 마이너스가 되어 환불할 수 없습니다' 문구가 나오면 파트너센터에서 환불 처리를 지원해 드립니다. 몇 가지 정보를 확인하겠습니다."]}, {"k": "2-2/4", "id": "4", "t": "주문번호와 주문옵션번호, 취소 사유를 알려주세요.", "sec": false, "body": []}, {"k": "2-2/5", "id": "5", "t": "귀책을 선택해 주세요.", "sec": false, "body": []}, {"k": "2-2/6", "id": "6", "t": "상품 회수 여부를 선택해 주세요.", "sec": false, "body": []}, {"k": "2-2/7", "id": "7", "t": "배송비 수취 여부를 선택해 주세요.", "sec": false, "body": []}, {"k": "2-2/8", "id": "8", "t": "고객님도 취소·환불에 동의하셨나요?", "sec": false, "body": []}, {"k": "2-2/9", "id": "9", "t": "접수 내용을 확인해 주세요.", "sec": false, "body": ["- 주문번호 / 주문옵션번호: ○○", "- 취소 사유: ○○ / 귀책: ○○", "- 회수 여부: ○○ / 배송비 수취 여부: ○○ / 고객 동의: 확인", "이 내용으로 담당 부서에 전달하겠습니다. 처리되면 고객님께 취소 안내 문자가 발송됩니다. 상담원에게 연결해 드릴게요."]}, {"k": "2-3", "id": "2-3", "t": "구매확정 후 교환", "sec": true, "body": ["파트너님, 구매확정된 주문은 교환 개념이 없어 교환 접수가 되지 않습니다. 상품 불량 등 파트너님 사유로 교환이 필요하면 아래 방법 중 하나로 고객님과 조율해 주세요.", "- 구매확정 취소 후 고객님께 재구매 안내 (재결제된 주문이 중복 발송되지 않도록 관리 부탁드립니다)", "- 파트너님이 상품을 회수하고 재발송하는 수기 교환", "정확한 귀책 확인이 필요하니 고객님과 먼저 사유를 확인해 주세요."]}], "hocond": "정산 마이너스로 직접 취소 불가 시 양식 수집 후 다른 부서 이관 T3-C / 배송비 수취 분쟁 T3-C / 1년 경과·탈퇴 회원 등 기준 없음 T5 / 공통: 상담원 직접 요청 T1 / 같은 질문 반복·미해결 T2 / 감정·민원 T4 / 복수 용건 T7 / 운영시간 종료 직전 인계 T8", "hoinfo": "주문번호·주문옵션번호, 취소 사유, 귀책(구매자/파트너), 회수 여부(회수완료/회수 불필요), 배송비 수취 여부(수취완료/수취 불필요), 고객 동의 여부, 오류 문구, 분쟁 시 고객 주장·파트너 입장. 구매확정일·정산 예정 금액은 상담원이 확인", "kms": "063_취소.md, 092_관리자_이관_유형_및_방법.md, 086_상담_양식___첨부_파일__.md, 081_파트너센터_교육자료__주문_배송.md, 052_반품.md, 051_교환.md, 088_프로세스_기준_정리_.md", "check": "1) 구매확정 후 1년 경과 건·탈퇴 회원 환불 기준 KMS 없음(T5로 둠). 2) 063 구매확정 취소 조건 예시에 오기('30,000원 ≤ 10,000원 이므로 불가') 있음: 원문 정정 필요. 3) 081은 '잔여 환불건 0원 이하면 직접 취소 불가', 063은 '취소금액이 정산 예정 금액보다 작은 경우만 가능'으로 표현이 달라 같은 조건인지 확인 필요. 4) 정산 마이너스 처리 소요 기간 안내 문구 없음. 5) 오로라 구매확정 내역 조회 가능 기간 KMS 명시 없음. 6) (1차 전환) 구매확정 여부를 조회하지 못해 파트너가 구매확정 전 주문이라고 말할 때만 다른 유형으로 보냄. 7) (1차 전환) 주문번호는 정산 마이너스 처리(2-2) 단계에서만 받음. 1년 경과 건 판별은 파트너 말에 의존함. 8) 정산 예정 금액 조회는 R-04 출력에 있으나 정산 데이터라 R-08과 같은 보안 판단이 필요한지 확인 필요.", "api": "R-02, R-04", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 주문번호와 주문옵션번호: \n· 요청 내용: \n· (해당 시: 마이너스 문구로 취소 안 됨) 취소 사유: \n· (해당 시: 마이너스 문구로 취소 안 됨) 귀책 (구매자 / 파트너): \n· (해당 시: 마이너스 문구로 취소 안 됨) 회수 여부 (회수 완료 / 회수 불필요 / 아직 회수 전): \n· (해당 시: 마이너스 문구로 취소 안 됨) 배송비 수취 여부 (수취 완료 / 수취 불필요 / 아직 못 받음): \n· (해당 시: 마이너스 문구로 취소 안 됨) 고객 동의 (동의받음 / 못 받음): \n· 오류 화면 캡처 (선택): 첨부파일로 올려 주세요\n\n문의 내용: ", "mode": "조건별: 취소 방법·구매확정 후 교환 문의와 회수 전·배송비 미수취·고객 미동의 건은 자동답변 종결 / 정산 마이너스로 직접 취소가 안 되는 건(조건 충족)은 상담원 배정", "segs": [{"c": ["A"], "t": "취소 방법·구매확정 후 교환 문의와 회수 전·배송비 미수취·고객 미동의 건은 자동답변 종결"}, {"c": ["C"], "t": "정산 마이너스로 직접 취소가 안 되는 건(조건 충족)은 상담원 배정"}], "auto": "(공통 첫인사)\n\n[구매확정 주문 취소 방법]\n구매확정 주문 취소는 파트너님이 오로라에서 직접 처리하실 수 있습니다.\n- 경로 1: 오로라 > 주문배송 > 구매확정 내역 > 취소할 주문번호 검색·선택 > [구매확정주문 취소]\n- 경로 2: 오로라 > 취소/반품/교환 > 취소관리 > [구매확정주문 취소하기] > 구매확정 내역에서 주문 선택 > [구매확정주문 취소]\n처리 전 확인해 주세요.\n- 취소 사유를 꼭 선택하고 상세 사유를 입력해야 하며, 고객님 확인이 된 주문만 처리할 수 있습니다.\n- 접수가 아니라 즉시 승인되므로, 상품 회수와 배송비 등 반품 관련 정리를 먼저 끝낸 뒤 처리해 주세요.\n- 필수 옵션 상품을 취소하면 추가 구성 상품도 함께 취소해야 합니다.\n- 구매자 귀책이면 선불 배송비는 고객님께 환불되지 않고 파트너님께 정산되며, 반송(회수)이 필요하면 반송비는 고객님께 별도로 받으셔야 합니다.\n- 구매확정 취소금액이 정산 예정 금액보다 크거나 '환불금액 - 취소비용'이 0원 미만이면 직접 취소가 되지 않습니다. 이때 '정산금액이 마이너스가 되어 환불할 수 없습니다' 문구가 나오면 파트너센터에서 환불 처리를 지원해 드립니다.\n\n[마이너스 문구가 떴지만 아직 회수 전이거나 배송비를 받지 못한 경우]\n구매확정 주문 취소는 즉시 승인되므로, 상품 회수와 받으셔야 할 배송비 정리를 먼저 마치신 뒤 새 문의로 남겨 주세요. 수취 과정에서 고객님과 분쟁이 생기면 그 내용을 적어 남겨 주시면 됩니다.\n\n[고객님 동의를 받지 못한 경우]\n구매확정 주문 취소는 고객님 동의가 필요합니다. 고객님과 협의하신 뒤 새 문의로 남겨 주세요.\n\n[구매확정 후 교환이 필요한 경우]\n구매확정된 주문은 교환 접수가 되지 않습니다. 상품 불량 등 파트너님 사유로 교환이 필요하면 아래 방법 중 하나로 고객님과 조율해 주세요.\n- 구매확정 취소 후 고객님께 재구매 안내 (재결제된 주문이 중복 발송되지 않도록 관리 부탁드립니다)\n- 파트너님이 상품을 회수하고 재발송하는 수기 교환\n(맺음 A)", "ack": "남겨 주신 취소 정보로 담당 부서에 환불 처리를 요청드리겠습니다. 처리되면 고객님께 취소 안내 문자가 발송됩니다.", "info": "주문번호·주문옵션번호, 취소 사유, 귀책, 회수 여부, 배송비 수취 여부, 고객 동의 여부, 오류 화면 캡처 유무, 배송비 분쟁이면 고객 주장·파트너 입장", "kms": "063_취소.md, 092_관리자_이관_유형_및_방법.md, 086_상담_양식___첨부_파일__.md, 081_파트너센터_교육자료__주문_배송.md, 052_반품.md, 051_교환.md, 088_프로세스_기준_정리_.md", "check": "1) 구매확정 후 1년 경과 건·탈퇴 회원 환불 기준 KMS 없음 (본문에 해당하면 상담원 배정)\n2) 063 구매확정 취소 조건 예시에 오기('30,000원 ≤ 10,000원 이므로 불가') — 원문 정정 필요\n3) 정산 마이너스 처리 소요 기간 안내 문구 없음"}}, {"code": "PA002011", "draft": true, "name": "반품/교환 기타", "mid": "반품/교환", "vol": "", "mode": "AI 안내 종결", "utter": "반품 배송비는 어떻게 차감되나요?\n부분 반품하면 무료배송 조건 깨지는데 배송비는 누가 내요?", "raw": "1. 네, 파트너님. 반품·교환 정책을 안내해 드리겠습니다. 궁금하신 내용을 선택해 주세요.\n[반품·교환 가능한 주문 상태] / [반품·교환 배송비] / [부분 반품 시 배송비] / [자동 환불승인·구매확정 기준] / [정산 시점] / [포인트·쿠폰 원복] / [수량 일부만 반품·교환]\n(특정 주문 건의 금액·상태를 묻는 경우 → 유형 PA002010으로 전환(1차에는 주문번호를 받아 상담원이 확인, T3-D) / 처리(접수·변경) 요청이면 → 해당 처리 유형 PA002007~PA002009로 전환 / 취소 정책 질문이면 → 유형 PA002002로 전환)\n\n2-1. [반품·교환 가능한 주문 상태]\n파트너님, 주문 상태에 따라 처리 방식이 다릅니다.\n- 입금대기·결제완료: 고객님이 직접 주문 취소할 수 있습니다.\n- 배송준비중: 고객님이 직접 취소할 수 없고, 파트너님 확인 후 처리가 필요합니다.\n- 배송중부터: 취소가 아닌 반품·교환으로 요청됩니다.\n- 구매확정: 반품·교환 접수가 되지 않으며, 구매확정 후 취소로 처리합니다.\n취소·반품·교환 접수는 고객님이 진행하는 항목이라 파트너님이 직접 접수하실 수는 없습니다. 접수가 필요하면 고객님께 접수를 안내해 주시고, 안내 과정에서 분쟁 등으로 도움이 필요하시면 파트너센터로 문의해 주세요.\n→ 3\n\n2-2. [반품·교환 배송비]\n파트너님, 고객님이 반품·교환을 요청할 때 선택한 사유로 귀책 대상이 정해지고 배송비가 자동 계산됩니다.\n- 반품(구매자 귀책): 고객님이 '환불금액에서 자동 차감' 또는 '반품배송비 추가 결제' 중 선택합니다. 파트너님이 따로 받으실 필요 없이, 청구된 금액은 반품 종료 후 정산 대금에 포함됩니다.\n- 교환(구매자 귀책): 고객님이 교환배송비를 추가 결제한 뒤 교환이 요청됩니다. 단, 파트너센터·고객센터에서 대신 교환을 접수한 경우에는 차감·결제가 되지 않아 고객님께 별도로 받으셔야 합니다.\n- 판매자 귀책: 반품·교환 배송비가 발생하지 않습니다.\n- 앱 업데이트 전 방식(구클레임)으로 요청된 건은 자동 계산되지 않아 고객님께 별도로 받으셔야 합니다.\n차감 여부는 오로라 > 취소/반품/교환 > 반품관리에서 반품번호를 누르면 환불정보와 반품비용으로 확인하실 수 있습니다.\n(파트너가 옵션별 반품비가 다르다고 하면 → 2-2-1 / 추가구매옵션 반품비를 물으면 → 2-2-2)\n2-2-1. 시스템에는 상품에 설정한 반품배송비만 반영됩니다. 옵션별 반품배송비가 다르면 최소 반품배송비를 상품에 설정하고, 차액은 고객님께 별도로 받으셔야 합니다. 이 경우 고객님이 구매할 때 알 수 있도록 상세페이지에 미리 안내해 주세요.\n2-2-2. 추가구매옵션은 본품과 함께 제공되는 옵션이라 배송비·반품비를 따로 설정하거나 차감할 수 없습니다. 비용이 필요하면 상세페이지에 미리 안내하시고 고객님께 별도로 받아 주세요.\n→ 3\n\n2-3. [부분 반품 시 배송비]\n파트너님, 부분 취소·반품으로 무료배송 조건이 깨지면 귀책 대상이 비용을 부담합니다. 구매자 귀책이면 고객님이, 판매자 귀책이면 파트너님이 부담합니다.\n구매자 귀책일 때 결제완료 상태라면 초도 배송비가 자동 차감된 뒤 환불되고, 배송준비중~배송완료 상태라면 고객님이 요청 시점에 배송비 결제 방식을 선택합니다. 이 경우 파트너님이 고객님께 따로 받으실 필요는 없습니다.\n예를 들어 30,000원 이상 무료배송 상품(10,000원)을 3개 구매한 고객님이 단순변심으로 1개를 취소·반품하면, 초도 배송비 3,000원을 차감한 7,000원이 환불되고 파트너님께는 23,000원이 정산됩니다.\n초도 배송비는 환불할 때 1회만 부과되며, 제주·도서산간 등 지역별 추가 배송비는 포함되지 않습니다.\n→ 3\n\n2-4. [자동 환불승인·구매확정 기준]\n파트너님, 처리하지 않은 클레임은 아래 기준으로 자동 처리됩니다.\n- 반품: 수거완료일로부터 8영업일째 자동 환불승인\n- 교환: 교환재배송 후 배송추적이 안 되는 건에 한해 교환요청일로부터 181영업일째 자동 교환완료\n- 구매확정: 배송완료 후 고객님이 직접 구매확정하지 않으면 배송완료일 다음 날부터 주말·공휴일 포함 8일째에 자동 구매확정\n- 반품불가·교환불가 처리 후 이전 상태가 배송완료였다면 처리일로부터 {확인 필요: 8일째 vs 8영업일째}에 자동 구매확정\n→ 3\n\n2-5. [정산 시점]\n파트너님, 클레임별 정산 반영 시점은 아래와 같습니다.\n- 반품승인: 정산 대상이 아니며, 발생한 클레임 비용은 클레임 완료 즉시 정산에 반영됩니다.\n- 반품불가·교환불가: 이전 주문 상태로 돌아간 뒤 배송 상태에 따라 반영되며, 이전 상태가 배송완료였다면 자동 구매확정 후 정산 차수에 반영됩니다.\n- 교환완료: 교환완료 시점부터 8일 뒤에 자동 구매확정되어 정산 차수에 반영됩니다. 교환재배송 후 [직접 교환완료]를 누르지 않았다면 꼭 눌러 주세요.\n→ 3\n\n2-6. [포인트·쿠폰 원복]\n파트너님, 취소나 반품이 처리되면 고객님이 사용한 오늘의집 포인트와 쿠폰은 기본적으로 원복됩니다. 포인트·쿠폰의 자세한 내역은 파트너센터에서 확인이 어려워, 고객님께 오늘의집 고객센터(1670-0876)로 문의하시도록 안내 부탁드립니다.\n→ 3\n\n2-7. [수량 일부만 반품·교환]\n파트너님, 같은 옵션의 수량 일부만 취소·반품·교환하는 것은 불가하며, 옵션 전체 수량 단위로만 가능합니다. 서로 다른 옵션을 구매했다면 필요한 옵션만 처리할 수 있습니다.\n실제 처리가 필요하시면 주문번호를 알려주세요.\n[주문번호 입력] → 유형 PA002007로 전환\n→ 3\n\n(KMS에 근거가 없는 정책 질문이면 → 2-8)\n2-8. 보다 정확한 안내를 위해 상담원이 확인 후 안내드리겠습니다. → 상담원 인계 (T5)\n(고객이 반품비·귀책을 수긍하지 않아 중재가 필요하다고 하면 → 유형 PA002007 또는 PA002008로 전환 후 분쟁 분기)\n(정산이 마이너스라 구매확정 주문을 취소할 수 없다고 하면 → 유형 PA002009로 전환)\n\n3. 더 궁금하신 내용이 있으신가요?\n[다른 정책도 궁금해요] → 1\n[아니요] → 상담 종료 (유형: PA002011)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 반품·교환 정책을 안내해<br/>드리겠습니다. 궁금하신 내용을 선택해<br/>주세요.\"]:::bot\nN2_1{{\"반품·교환 가능한 주문<br/>상태\"}}:::sec\nN2_2{{\"반품·교환 배송비\"}}:::sec\nN2_2_2_2_1[\"<b>2-2-1<\/b> 시스템에는 상품에 설정한 반품배송비만<br/>반영됩니다. 옵션별 반품배송비가 다르면 최소<br/>반품배송비를 상품에 설정하고, 차액은<br/>고객님께 별도로 받으셔야 합니다. 이 경우<br/>고객님이 구매할 때 알 수 있도록<br/>상세페이지에 미리 안내해 주세요.\"]:::bot\nN2_2_2_2_2[\"<b>2-2-2<\/b> 추가구매옵션은 본품과 함께 제공되는 옵션이라<br/>배송비·반품비를 따로 설정하거나 차감할 수<br/>없습니다. 비용이 필요하면 상세페이지에 미리<br/>안내하시고 고객님께 별도로 받아 주세요.\"]:::bot\nN2_3{{\"부분 반품 시 배송비\"}}:::sec\nN2_4{{\"자동 환불승인·구매확정<br/>기준\"}}:::sec\nN2_5{{\"정산 시점\"}}:::sec\nN2_6{{\"포인트·쿠폰 원복\"}}:::sec\nN2_7{{\"수량 일부만 반품·교환\"}}:::sec\nN2_7_2_8[\"<b>2-8<\/b> 보다 정확한 안내를 위해 상담원이 확인 후<br/>안내드리겠습니다.\"]:::bot\nN2_7_3[\"<b>3<\/b> 더 궁금하신 내용이 있으신가요?\"]:::bot\nS --> N1\nN1 -->|\"특정 주문 건의 금액·상태를 묻는 경우\"| SW_PA002010\nN1 -->|\"처리(접수·변경) 요청이면\"| SWX1\nN1 -->|\"취소 정책 질문이면\"| SW_PA002002\nN1 -->|\"반품·교환 가능한 주문 상태\"| N2_1\nN2_1 --> N2_7_3\nN1 -->|\"반품·교환 배송비\"| N2_2\nN2_2 -->|\"파트너가 옵션별 반품비가 다르다고 하면\"| N2_2_2_2_1\nN2_2 -->|\"추가구매옵션 반품비를 물으면\"| N2_2_2_2_2\nN2_2_2_2_2 --> N2_7_3\nN1 -->|\"부분 반품 시 배송비\"| N2_3\nN2_3 --> N2_7_3\nN1 -->|\"자동 환불승인·구매확정 기준\"| N2_4\nN2_4 --> N2_7_3\nN1 -->|\"정산 시점\"| N2_5\nN2_5 --> N2_7_3\nN1 -->|\"포인트·쿠폰 원복\"| N2_6\nN2_6 --> N2_7_3\nN1 -->|\"수량 일부만 반품·교환\"| N2_7\nN2_7 -->|\"주문번호 입력\"| SW_PA002007\nN2_7 --> N2_7_3\nN2_7 -->|\"KMS에 근거가 없는 정책 질문이면\"| N2_7_2_8\nN2_7_2_8 --> HO_T5\nN2_7_2_8 -->|\"고객이 반품비·귀책을 수긍하지 않아 중재가<br/>필요하다고 하면 ·\"| SW_PA002007\nN2_7_2_8 -->|\"고객이 반품비·귀책을 수긍하지 않아 중재가<br/>필요하다고 하면 · 「반품 대리접수」 또는\"| SW_PA002008\nN2_7_2_8 -->|\"정산이 마이너스라 구매확정 주문을 취소할 수<br/>없다고 하면\"| SW_PA002009\nN2_7_3 -->|\"다른 정책도 궁금해요\"| N1\nN2_7_3 -->|\"아니요\"| END\nN2_2_2_2_1 --> N2_2_2_2_2\nSW_PA002010[/\"「주문·결제 금액 조회」로 전환\"/]:::sw\nSWX1[/\"「반품 대리접수」~「구매확정 후 취소·환불」<br/>중 해당 처리 유형으로<br/>전환\"/]:::sw\nSW_PA002002[/\"「주문/취소 기타」로 전환\"/]:::sw\nSW_PA002007[/\"「반품 대리접수」로 전환\"/]:::sw\nHO_T5([\"상담원 인계<br/>답변 불가\"]):::ho\nSW_PA002008[/\"「클레임 상태 변경」로 전환\"/]:::sw\nSW_PA002009[/\"「구매확정 후 취소·환불」로 전환\"/]:::sw\nEND([\"상담 종료\"]):::fin", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 반품·교환 정책을 안내해 드리겠습니다. 궁금하신 내용을 선택해 주세요.", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "반품·교환 가능한 주문 상태", "sec": true, "body": ["파트너님, 주문 상태에 따라 처리 방식이 다릅니다.", "- 입금대기·결제완료: 고객님이 직접 주문 취소할 수 있습니다.", "- 배송준비중: 고객님이 직접 취소할 수 없고, 파트너님 확인 후 처리가 필요합니다.", "- 배송중부터: 취소가 아닌 반품·교환으로 요청됩니다.", "- 구매확정: 반품·교환 접수가 되지 않으며, 구매확정 후 취소로 처리합니다.", "취소·반품·교환 접수는 고객님이 진행하는 항목이라 파트너님이 직접 접수하실 수는 없습니다. 접수가 필요하면 고객님께 접수를 안내해 주시고, 안내 과정에서 분쟁 등으로 도움이 필요하시면 파트너센터로 문의해 주세요."]}, {"k": "2-2", "id": "2-2", "t": "반품·교환 배송비", "sec": true, "body": ["파트너님, 고객님이 반품·교환을 요청할 때 선택한 사유로 귀책 대상이 정해지고 배송비가 자동 계산됩니다.", "- 반품(구매자 귀책): 고객님이 '환불금액에서 자동 차감' 또는 '반품배송비 추가 결제' 중 선택합니다. 파트너님이 따로 받으실 필요 없이, 청구된 금액은 반품 종료 후 정산 대금에 포함됩니다.", "- 교환(구매자 귀책): 고객님이 교환배송비를 추가 결제한 뒤 교환이 요청됩니다. 단, 파트너센터·고객센터에서 대신 교환을 접수한 경우에는 차감·결제가 되지 않아 고객님께 별도로 받으셔야 합니다.", "- 판매자 귀책: 반품·교환 배송비가 발생하지 않습니다.", "- 앱 업데이트 전 방식(구클레임)으로 요청된 건은 자동 계산되지 않아 고객님께 별도로 받으셔야 합니다.", "차감 여부는 오로라 > 취소/반품/교환 > 반품관리에서 반품번호를 누르면 환불정보와 반품비용으로 확인하실 수 있습니다."]}, {"k": "2-2/2-2-1", "id": "2-2-1", "t": "시스템에는 상품에 설정한 반품배송비만 반영됩니다. 옵션별 반품배송비가 다르면 최소 반품배송비를 상품에 설정하고, 차액은 고객님께 별도로 받으셔야 합니다. 이 경우 고객님이 구매할 때 알 수 있도록 상세페이지에 미리 안내해 주세요.", "sec": false, "body": []}, {"k": "2-2/2-2-2", "id": "2-2-2", "t": "추가구매옵션은 본품과 함께 제공되는 옵션이라 배송비·반품비를 따로 설정하거나 차감할 수 없습니다. 비용이 필요하면 상세페이지에 미리 안내하시고 고객님께 별도로 받아 주세요.", "sec": false, "body": []}, {"k": "2-3", "id": "2-3", "t": "부분 반품 시 배송비", "sec": true, "body": ["파트너님, 부분 취소·반품으로 무료배송 조건이 깨지면 귀책 대상이 비용을 부담합니다. 구매자 귀책이면 고객님이, 판매자 귀책이면 파트너님이 부담합니다.", "구매자 귀책일 때 결제완료 상태라면 초도 배송비가 자동 차감된 뒤 환불되고, 배송준비중~배송완료 상태라면 고객님이 요청 시점에 배송비 결제 방식을 선택합니다. 이 경우 파트너님이 고객님께 따로 받으실 필요는 없습니다.", "예를 들어 30,000원 이상 무료배송 상품(10,000원)을 3개 구매한 고객님이 단순변심으로 1개를 취소·반품하면, 초도 배송비 3,000원을 차감한 7,000원이 환불되고 파트너님께는 23,000원이 정산됩니다.", "초도 배송비는 환불할 때 1회만 부과되며, 제주·도서산간 등 지역별 추가 배송비는 포함되지 않습니다."]}, {"k": "2-4", "id": "2-4", "t": "자동 환불승인·구매확정 기준", "sec": true, "body": ["파트너님, 처리하지 않은 클레임은 아래 기준으로 자동 처리됩니다.", "- 반품: 수거완료일로부터 8영업일째 자동 환불승인", "- 교환: 교환재배송 후 배송추적이 안 되는 건에 한해 교환요청일로부터 181영업일째 자동 교환완료", "- 구매확정: 배송완료 후 고객님이 직접 구매확정하지 않으면 배송완료일 다음 날부터 주말·공휴일 포함 8일째에 자동 구매확정", "- 반품불가·교환불가 처리 후 이전 상태가 배송완료였다면 처리일로부터 {확인 필요: 8일째 vs 8영업일째}에 자동 구매확정"]}, {"k": "2-5", "id": "2-5", "t": "정산 시점", "sec": true, "body": ["파트너님, 클레임별 정산 반영 시점은 아래와 같습니다.", "- 반품승인: 정산 대상이 아니며, 발생한 클레임 비용은 클레임 완료 즉시 정산에 반영됩니다.", "- 반품불가·교환불가: 이전 주문 상태로 돌아간 뒤 배송 상태에 따라 반영되며, 이전 상태가 배송완료였다면 자동 구매확정 후 정산 차수에 반영됩니다.", "- 교환완료: 교환완료 시점부터 8일 뒤에 자동 구매확정되어 정산 차수에 반영됩니다. 교환재배송 후 [직접 교환완료]를 누르지 않았다면 꼭 눌러 주세요."]}, {"k": "2-6", "id": "2-6", "t": "포인트·쿠폰 원복", "sec": true, "body": ["파트너님, 취소나 반품이 처리되면 고객님이 사용한 오늘의집 포인트와 쿠폰은 기본적으로 원복됩니다. 포인트·쿠폰의 자세한 내역은 파트너센터에서 확인이 어려워, 고객님께 오늘의집 고객센터(1670-0876)로 문의하시도록 안내 부탁드립니다."]}, {"k": "2-7", "id": "2-7", "t": "수량 일부만 반품·교환", "sec": true, "body": ["파트너님, 같은 옵션의 수량 일부만 취소·반품·교환하는 것은 불가하며, 옵션 전체 수량 단위로만 가능합니다. 서로 다른 옵션을 구매했다면 필요한 옵션만 처리할 수 있습니다.", "실제 처리가 필요하시면 주문번호를 알려주세요."]}, {"k": "2-7/2-8", "id": "2-8", "t": "보다 정확한 안내를 위해 상담원이 확인 후 안내드리겠습니다. → 상담원 인계 (T5)", "sec": false, "body": []}, {"k": "2-7/3", "id": "3", "t": "더 궁금하신 내용이 있으신가요?", "sec": false, "body": []}], "hocond": "KMS 근거 없는 정책 질문 T5 / 특정 주문의 금액·상태 확인은 PA002010 전환 후 T3-D / 고객 미수긍 중재 요청은 PA002007·PA002008 전환 후 T3-C / 공통: 상담원 직접 요청 T1 / 같은 질문 반복·미해결 T2 / 감정·민원 T4 / 복수 용건 T7 / 운영시간 종료 직전 인계 T8", "hoinfo": "문의한 정책 항목, 챗봇이 안내한 내용, 관련 주문번호(있으면)", "kms": "052_반품.md, 051_교환.md, 065__주문_.md, 055_정산.md, 080_파트너센터_교육자료__클레임.md, 060_상담_태그별_주요_문의유형_.md", "check": "1) 구매확정 자동 전환: 065·055·048·078은 '배송완료 후 주말·공휴일 포함 8일째', 052·051 본문은 반품불가·교환불가 후 '8일째', 같은 문서의 정산 시점 항목은 '8영업일째'로 혼재. 2) 교환완료 후 자동 구매확정도 051 안에서 8일째/8영업일째 혼재. 3) 정책 문의 범위 중 자동수거·반품주소 등 배송 설정 문의를 이 유형에 둘지, 배송 유형으로 보낼지 정리 필요. 4) 10/20 중분류 분리로 PA002002에서 나눈 유형. 월 인입은 PA002002 389건에 포함되어 있어 따로 없음", "api": "R-02, R-04", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 궁금한 항목 (선택): \n· 관련 주문번호 (선택): \n\n문의 내용: ", "mode": "조건별: 기준·방법 문의는 자동답변 종결 / 특정 주문 처리·중재 요청이면 해당 처리 유형으로 바꿔 판정 / KMS에 없는 기준 질문은 상담원 배정", "segs": [{"c": ["A"], "t": "기준·방법 문의는 자동답변 종결"}, {"c": ["SW"], "t": "특정 주문 처리·중재 요청이면 해당 처리 유형으로 바꿔 판정"}, {"c": ["C"], "t": "KMS에 없는 기준 질문은 상담원 배정"}], "auto": "(공통 첫인사)\n(문의에 해당하는 항목만 골라 안내. 두 항목 이상이면 순서대로 함께 안내)\n\n[주문 상태별 처리 방식]\n주문 상태에 따라 처리 방식이 다릅니다.\n- 입금대기·결제완료: 고객님이 직접 주문을 취소하실 수 있습니다.\n- 배송준비중: 고객님이 직접 취소하실 수 없어 파트너님 확인 후 처리가 필요합니다.\n- 배송중부터: 취소가 아닌 반품·교환으로 요청됩니다.\n- 구매확정: 반품·교환 접수가 되지 않으며, 구매확정 후 취소로 처리합니다.\n취소·반품·교환 접수는 고객님이 진행하는 항목이라 파트너님이 직접 접수하실 수는 없습니다. 접수가 필요하면 고객님께 접수를 안내해 주시고, 안내 과정에서 분쟁 등으로 중재가 필요하시면 파트너센터로 문의해 주세요.\n\n[반품·교환 배송비]\n고객님이 반품·교환을 요청할 때 선택한 사유로 귀책 대상이 정해지고 배송비가 자동 계산됩니다.\n- 반품(구매자 귀책): 고객님이 '환불금액에서 자동 차감' 또는 '반품배송비 추가 결제' 중 선택합니다. 청구된 금액은 반품 종료 후 정산 대금에 포함되어 파트너님이 따로 받으실 필요가 없습니다.\n- 교환(구매자 귀책): 고객님이 교환배송비를 추가 결제한 뒤 교환이 요청됩니다. 다만 파트너센터·고객센터에서 대신 교환을 접수한 건은 차감·결제가 되지 않아 고객님께 별도로 받으셔야 합니다.\n- 판매자 귀책: 반품·교환 배송비가 발생하지 않습니다.\n- 앱 업데이트 전 방식(구클레임)으로 요청된 건은 자동 계산되지 않아 고객님께 별도로 받으셔야 합니다.\n차감 여부는 오로라 > 취소/반품/교환 > 반품관리에서 반품번호를 누르면 환불정보와 반품비용에서 확인하실 수 있습니다.\n옵션별로 반품배송비가 다른 경우, 시스템에는 상품에 설정한 반품배송비만 반영되므로 최소 반품배송비를 상품에 설정하고 차액은 고객님께 별도로 받아 주세요. 이 경우 고객님이 구매 전에 알 수 있도록 상세페이지에 미리 안내해 주셔야 합니다. 추가구매옵션은 배송비·반품비를 따로 설정하거나 차감할 수 없어, 비용이 필요하면 상세페이지에 안내하신 뒤 고객님께 별도로 받아 주세요.\n\n[부분 반품 배송비]\n부분 취소·반품으로 무료배송 조건이 깨지면 귀책 대상이 비용을 부담합니다. 구매자 귀책이면 고객님이, 판매자 귀책이면 파트너님이 부담합니다.\n구매자 귀책일 때 결제완료 상태라면 초도 배송비가 자동 차감된 뒤 환불되고, 배송준비중~배송완료 상태라면 고객님이 요청 시점에 배송비 결제 방식을 선택합니다. 이 경우 파트너님이 따로 받으실 필요는 없습니다.\n예를 들어 30,000원 이상 무료배송 상품(10,000원)을 3개 구매한 고객님이 단순변심으로 1개를 취소·반품하면, 초도 배송비 3,000원을 차감한 7,000원이 환불되고 파트너님께는 23,000원이 정산됩니다. 초도 배송비는 환불할 때 1회만 부과되며 제주·도서산간 등 지역별 추가 배송비는 포함되지 않습니다.\n\n[자동 환불승인·자동 구매확정 기준]\n처리하지 않은 클레임은 아래 기준으로 자동 처리됩니다.\n- 반품: 수거완료일로부터 8영업일째 자동 환불승인\n- 교환: 교환재배송 후 배송추적이 안 되는 건에 한해 교환요청일로부터 181영업일째 자동 교환완료\n- 구매확정: 배송완료 후 고객님이 직접 구매확정하지 않으면 배송완료일 다음 날부터 주말·공휴일 포함 8일째에 자동 구매확정\n- 반품불가·교환불가 처리 후 이전 상태가 배송완료였다면 처리일로부터 {확인 필요: 8일째 vs 8영업일째}에 자동 구매확정\n\n[클레임 정산 시점]\n- 반품승인: 정산 대상이 아니며, 발생한 클레임 비용은 클레임 완료 즉시 정산에 반영됩니다.\n- 반품불가·교환불가: 이전 주문 상태로 돌아간 뒤 배송 상태에 따라 반영되며, 이전 상태가 배송완료였다면 자동 구매확정 후 정산 차수에 반영됩니다.\n- 교환완료: 교환완료 시점부터 8일 뒤에 자동 구매확정되어 정산 차수에 반영됩니다. 교환재배송 후 [직접 교환완료]를 누르지 않으셨다면 꼭 눌러 주세요.\n\n[포인트·쿠폰 원복]\n취소나 반품이 처리되면 고객님이 사용한 오늘의집 포인트와 쿠폰은 기본적으로 원복됩니다. 포인트·쿠폰의 자세한 내역은 파트너센터에서 확인이 어려워, 고객님께 오늘의집 고객센터(1670-0876)로 문의하시도록 안내 부탁드립니다.\n\n[수량 일부만 반품·교환]\n같은 옵션의 수량 일부만 취소·반품·교환하는 것은 불가하며, 옵션 전체 수량 단위로만 가능합니다. 서로 다른 옵션을 구매했다면 필요한 옵션만 처리할 수 있습니다.\n실제 처리가 필요하시면 세부 유형 '반품 대신 접수'로 주문번호와 함께 새 문의를 남겨 주세요.\n(맺음 A)", "ack": "문의하신 기준은 담당 상담원이 확인해 정확히 안내드리겠습니다.", "info": "문의한 기준 항목, AI가 답하지 못한 사유(KMS 근거 없음 등), 관련 주문번호(있으면)", "kms": "052_반품.md, 051_교환.md, 065__주문_.md, 055_정산.md, 080_파트너센터_교육자료__클레임.md", "check": "1) 자동 구매확정: 065·055·048·078은 '배송완료 후 주말·공휴일 포함 8일째', 052·051 정산 항목은 '8영업일째'로 혼재 — 확정 전에는 해당 단락 자동답변 보류 필요\n2) 교환완료 후 자동 구매확정도 051 안에서 8일째/8영업일째 혼재\n3) 자동수거·반품주소 같은 배송 설정 문의를 이 유형에 둘지 배송 유형(PA001002)으로 보낼지 정리 필요\n4) 10/20 중분류 분리로 PA002002에서 나눈 유형"}}, {"code": "PA001002", "draft": false, "name": "배송기타", "mid": "배송", "vol": "198", "mode": "AI 안내 종결", "utter": "연휴 기간에 배송지연 설정 어떻게 하나요?\n출고소요일 바꾸고 싶은데 어디서 해요? 예약판매라 20일 넘게 걸려요\n송장번호를 잘못 넣었는데 수정이 안 돼요", "raw": "1. 네, 파트너님. 배송 관련 문의 주셔서 감사합니다. 어떤 내용이 궁금하신지 선택하시거나 말씀해 주세요.\n[배송지연·연휴 안내] [출고소요일 설정] [휴무일 설정] [송장 등록·수정] [오늘출발] [배송비 설정] [기타 배송 문의]\n(배송상태 변경 요청이면 → 유형 PA001003 시나리오로 전환)\n(고객에게 연락해 달라는 요청이면 → 유형 PA010001 시나리오로 전환)\n\n2-1. [배송지연·연휴 안내]\n2. 출고예정일 안에 발송이 어려우시면 고객님이 미리 아실 수 있도록 아래 방법으로 안내해 주세요.\n- 출고소요일 변경: 오로라 > 상품관리 > 상품조회/수정 > 상품ID > 배송기간 > 출고소요일 입력 > 저장하기\n- 배송지연 배너 등록: 전 상품은 오로라 > 상품관리 > 공지이미지 관리, 일부 상품은 오로라 > 상품관리 > 상품조회/수정 > 상품코드 클릭 > 상세페이지 상단에 이미지 추가\n- 상품명/옵션명에 [예약판매] 기재\n- 이미 주문하신 고객님께는 전화나 문자로 개별 안내 (오로라 내 배송지연 알림 기능은 준비 중입니다)\n명절 연휴에는 연휴 전 출고 가능한 마지막 주문일, 연휴 이후 출고 시작일, 파트너님의 연휴 기간을 배너로 안내해 주세요. 오늘의집에서 제공하는 배송지연 배너 양식(배송지연안내, 단일상품 예약판매, 옵션별 예약판매, 기간별 예약판매)도 사용하실 수 있습니다.\n(배너 양식 파일 제공 방법 → {확인 필요: 챗봇에서 배너 양식·폰트 파일 첨부 가능 여부})\n3. 출고소요일을 실제 출고일에 맞게 바꾸셨다면 배너는 게시하지 않으셔도 됩니다. 다만 재고 부족, 주문 폭주 등으로 지연이 예상되면 배너로 미리 안내 부탁드립니다. 더 궁금하신 점 있으신가요?\n[패널티가 있나요?] → 4\n[아니요] → 상담 종료 (유형: PA001002)\n4. 배송지연으로 인한 패널티 정책은 현재 없습니다. 다만 오늘출발 상품은 최근 7일간 이행률이 95% 미만이면 오늘출발 뱃지가 제외될 수 있고, 출고·배송예정일 안에 출고·배송완료가 되지 않으면 심각도에 따라 상품 품절, 오늘출발 서비스 이용 제한, 고객 동의 하에 주문 취소·환불이 진행될 수 있습니다.\n→ 상담 종료 (유형: PA001002)\n\n2-2. [출고소요일 설정]\n2. 출고소요일은 고객이 주문한 상품을 확인·포장해 택배사에 전달하기까지 걸리는 기간으로, 본품 출고일 기준으로 입력해 주세요. 영업일(공휴일 제외 월~금) 기준입니다.\n- 상품별 수정: 오로라 > 상품관리 > 상품조회/수정 > 상품ID > 배송기간 > 출고소요일 입력 > 저장하기\n- 대량 수정: 오로라 > 상품관리 > 상품조회/수정 > 엑셀 양식 다운로드에서 '배송비정보 수정 양식' 다운로드 → 상품코드와 출고소요일 입력 → 엑셀 일괄 업로드에서 양식 유형 '배송비' 선택 후 업로드\n- 배송비 관련 변경은 영업일 기준 5일 이내 처리되며, 오로라 > 상품관리 > 상품 검수현황 > 수정검수요청 현황에서 결과를 확인하실 수 있습니다.\n상한 기준을 넘는 기간이 필요하신가요?\n[네, 예약판매라 더 길어요] → 3\n[아니요] → 상담 종료 (유형: PA001002)\n3. 출고소요일 상한은 일반택배 표준 4일, 화물택배 표준 7일, 직접배송 표준 20일이며, 해외배송·주문제작은 배송유형과 관계없이 20일입니다. 상한을 지키기 어려운 경우(타사에서도 상한을 넘겨 판매 중인 상품, 프리미엄 일부, 예약판매, 예약배송 등)에는 아래 링크로 상담·예외 처리를 신청하실 수 있으며, 심사 후 설정이 진행됩니다.\nhttps://tally.so/r/wA8YZW\n예외 처리 시 상품페이지에 배송예정일·배송예정확률이 노출되지 않으므로, 고객님께 배송 시기를 별도로 정확히 안내해 주셔야 합니다.\n→ 상담 종료 (유형: PA001002)\n(출고소요일 조정 안내 메일을 받았다는 문의면 → 2-2-1)\n2-2-1. 해당 메일은 설정하신 출고소요일과 실제 출고 기간에 차이가 있어 실제 기간에 맞게 다시 설정해 달라는 안내입니다. 매월 최근 3개월 출고 100건 이상 상품 중 ±2일 이상 차이 나는 상품은 조정 요청 후 5영업일 안에 조정되지 않으면 오늘의집에서 자동 조정하며, 매주 지연 상품은 지연 주차의 평균 출고일 기준으로 자동 조정됩니다. 천재지변 등 불가항력 사유는 제외됩니다.\n→ 상담 종료 (유형: PA001002)\n\n2-3. [휴무일 설정]\n2. 현재 휴무일 설정 기능은 없습니다. 파트너사·물류사 휴무로 평일에 출고되지 않는 경우, 고객님이 미리 아실 수 있도록 상품 상세페이지 최상단에 배송지연 배너로 휴무일을 공지해 주세요. 전 상품 일괄 공지는 오로라 > 상품관리 > 공지이미지 관리에서 등록하실 수 있습니다. 공지이미지는 1개만 등록되며, 파일을 선택하면 즉시 반영되고 이전 파일은 확인할 수 없으니 미리 보관해 주세요.\n'택배 없는 날'은 출고·배송예정일 계산에서 자동 제외되어 출고소요일을 바꾸지 않으셔도 됩니다.\n→ 상담 종료 (유형: PA001002)\n\n2-4. [송장 등록·수정]\n2. 송장은 주문 상태와 상품의 배송방법에 따라 처리 방법이 다릅니다. 해당 주문의 현재 주문 상태를 선택해 주세요. 업체직접배송으로 설정된 상품이면 [업체직접배송 상품이에요]를 선택해 주세요.\n[결제완료] [배송준비중·배송중] [배송완료] [구매확정] [업체직접배송 상품이에요] [잘 모르겠어요]\n(배송준비중·배송중 → 3-1 / 배송완료 → 3-2 / 구매확정 → 3-3 / 결제완료 → 3-4 / 업체직접배송 상품 → 3-5 / 잘 모르겠어요 → 3-6)\n3-1. 송장은 배송준비중·배송중 상태에서 입력·수정하실 수 있습니다.\n- 등록: 오로라 > 주문배송 > 주문배송현황 > 배송정보 항목의 송장 등록 (배송준비중 → 배송중으로 바뀝니다)\n- 일괄 등록: 엑셀 다운로드 후 주문옵션번호, 택배사(코드), 송장번호 입력 → 엑셀 일괄 업로드\n- 수정: 오로라 > 주문배송 > 주문배송현황 > 배송정보 항목의 택배정보 송장 수정 (수정은 일괄 처리가 안 되어 한 건씩 진행해 주세요)\n엑셀 업로드가 안 된다면 주문번호가 아닌 주문옵션번호를 넣으셨는지 확인 부탁드립니다.\n→ 상담 종료 (유형: PA001002)\n3-2. 배송완료 상태에서는 송장 수정이 되지 않아 배송준비중으로 상태를 되돌린 뒤 수정해야 합니다. 상태를 되돌리는 변경은 고객님께 먼저 확인이 필요해 파트너센터에서 처리해 드립니다.\n→ 유형 PA001003 시나리오의 3-4(역방향)로 전환\n3-3. 구매확정 상태인 주문은 송장 수정이 불가합니다.\n→ 상담 종료 (유형: PA001002)\n3-4. 결제완료 상태에서는 송장을 입력할 수 없습니다. 오로라 > 주문배송 > 주문배송현황에서 주문옵션번호 체크 후 주문 확인을 먼저 눌러 배송준비중으로 바꾼 뒤 송장을 입력해 주세요.\n→ 상담 종료 (유형: PA001002)\n3-6. 주문 상태 확인이 필요해 상담원이 이어서 도와드리겠습니다. 해당 주문의 주문옵션번호를 알려 주세요.\n[주문옵션번호]\n→ 상담원 인계 (T3-D)\n3-5. 업체직접배송으로 설정된 상품은 오로라에서 송장 등록이 되지 않습니다. 택배로 보내셨다면 오로라 > 주문배송 > 주문배송현황에서 주문 건 체크 후 주문상태 변경에서 배송완료를 선택해 주시고, 송장번호는 고객님께 따로 전달해 주세요.\n※ 배송은 설정하신 배송방식에 맞추어 해 주셔야 하며, 배송방식을 잘못 설정하신 경우 실제 배송 방식에 맞게 수정 바랍니다. 배송방식이 달라 분쟁이 생기면 오늘의집에서 별도 도움드리기 어려울 수 있는 점 참고 부탁드립니다.\n→ 상담 종료 (유형: PA001002)\n\n2-5. [오늘출발]\n2. 오늘출발은 일반택배 상품이면서 출고소요일이 1일인 상품에 설정할 수 있고, 주문제작·해외직구 상품은 적용되지 않습니다. 상품 등록·수정 화면의 배송 > 배송기간에서 당일 출고 마감시간(12:00~23:30, 30분 단위)을 확인하신 뒤 오늘출발에 체크해 주세요.\n뱃지는 최근 7일(평일·주말 포함) 이행률이 95% 이상이면 붙고 95% 미만이면 제외됩니다. 매일 자정 기준으로 갱신되며 반영까지 최대 6시간 걸릴 수 있고, 주말·공휴일에는 갱신되지 않고 금요일 상태를 따릅니다. 주말 주문은 다음 영업일 출고로 잡혀 이행률에 영향을 주지 않습니다. 한 주문에 옵션이 여러 개면 모든 옵션이 오늘출발되어야 성공으로 계산됩니다.\n이행률은 오로라 > 상품관리 > 오늘출발 관리에서 확인하실 수 있습니다.\n[고객 요청으로 지정일에 보냈는데 뱃지가 빠졌어요] → 3\n[아니요] → 상담 종료 (유형: PA001002)\n3. 오늘출발 이행률은 전산에서 자동 반영되어, 고객 요청 건이라도 예외 처리가 되지 않는 점 양해 부탁드립니다. 지정일 발송이 필요한 주문은 지정일 발송 불가 사유로 취소한 뒤, 고객님께 원하시는 수령일 전날 주문하시도록 안내해 주세요.\n→ 상담 종료 (유형: PA001002)\n\n2-6. [배송비 설정]\n2. 어떤 내용이 궁금하신가요?\n[선불·제주/도서산간 배송비 결제 확인] → 3-1\n[수량만큼 배송비 부과] → 3-2\n[제주/도서산간 비용 따로 설정] → 3-3\n[배송비 상한] → 3-4\n3-1. 오로라 > 주문배송 > 주문배송현황 > 주문번호 클릭 > 주문상세 페이지 오른쪽 배송정보에서 선불배송비와 제주/도서산간 금액을 확인하실 수 있습니다.\n→ 상담 종료 (유형: PA001002)\n3-2. '제품당 비례배송비'를 설정해 주세요. 배송비 유형이 유료일 때만, 필수 옵션에만 적용되며 추가구매 옵션에는 적용되지 않습니다. 예를 들어 배송비 3,000원 상품 2개를 주문하면 배송비 6,000원이 부과됩니다.\n→ 상담 종료 (유형: PA001002)\n3-3. 제주와 도서산간 비용은 같은 금액으로만 설정할 수 있습니다. 금액을 다르게 받아야 하면 상세페이지에 명시한 뒤 개별로 받아 주세요. 도서산간 기준은 CJ대한통운 기준이며, 우편번호 목록은 아래 공지에서 확인하실 수 있습니다.\nhttps://www.partnerbucketplace.com/hc/ko/articles/38450697155609\n→ 상담 종료 (유형: PA001002)\n3-4. 제주·도서산간 배송비 상한은 일반택배 20,000원, 화물택배 40,000원, 직접배송 40,000원입니다. 반품배송비는 초도배송비의 1배, 교환배송비는 2배까지 설정하실 수 있고, 상품 등록·수정 시 상한을 넘는 금액은 입력되지 않습니다. 기존 상품이 상한을 넘는 경우 상한 이내로 수정해야 수정이 완료됩니다.\n→ 상담 종료 (유형: PA001002)\n\n2-7. [기타 배송 문의]\n2. 어떤 상황인지 조금 더 말씀해 주시겠어요?\n[배송지연 안내 메일을 받았어요] → 3-1\n[택배 분실·파손] → 3-2\n[반품 회수가 계속 안 돼요] → 3-3\n[부분 반품 재주문 건을 잘못 출고했어요] → 3-4\n(KMS에 없는 내용 → 상담원 인계 (T5))\n3-1. 배송지연 안내 메일은 주문일 기준으로 추출해 메일 발송일 기준 9일 내 배송지연 건을 자동 발송하며, 이전 안내와 중복될 수 있습니다. 9일이 지난 건은 제외되니 따로 관리 부탁드립니다. 메일에 회신이 안 된다고 되어 있으면, 해당 메일 주소로 지연 사유나 처리 상황을 적어 보내 주시면 담당 부서에서 확인합니다.\n[예약배송이라 고객과 협의해서 늦춘 건이에요] → 상담원 인계 (T3-B)\n[아니요] → 상담 종료 (유형: PA001002)\n3-2. 정상 출고 후 배송 과정에서 생긴 분실·파손 등 택배사 귀책은 오늘의집에서 중재·지원이 어려워, 해당 택배사로 문의 부탁드립니다.\n→ 상담 종료 (유형: PA001002)\n3-3. 확인을 위해 주문번호, 주문옵션번호, 회수가 안 되는 상황(고객 부재, 거부 등)과 지금까지 진행하신 내용을 알려 주세요.\n[주문번호, 주문옵션번호, 상황]\n4. 말씀해 주신 내용으로 담당 부서 확인을 요청드리겠습니다. 상담원이 이어서 도와드리겠습니다.\n→ 상담원 인계 (T3-C)\n3-4. 처리 방법은 유관 부서 확인 후 안내드리겠습니다. 주문번호와 재주문 주문번호, 상황을 알려 주세요.\n[주문번호, 재주문 주문번호, 상황]\n→ 상담원 인계 (T3-C)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 배송 관련 문의 주셔서<br/>감사합니다. 어떤 내용이 궁금하신지<br/>선택하시거나 말씀해 주세요.\"]:::bot\nN2_1{{\"배송지연·연휴 안내\"}}:::sec\nN2_1_2[\"<b>2<\/b> 출고예정일 안에 발송이 어려우시면 고객님이<br/>미리 아실 수 있도록 아래 방법으로 안내해<br/>주세요.\"]:::bot\nN2_1_3[\"<b>3<\/b> 출고소요일을 실제 출고일에 맞게 바꾸셨다면<br/>배너는 게시하지 않으셔도 됩니다. 다만 재고<br/>부족, 주문 폭주 등으로 지연이 예상되면<br/>배너로 미리 안내 부탁드립니다. 더 궁금하신<br/>점 있으신가요?\"]:::bot\nN2_1_4[\"<b>4<\/b> 배송지연으로 인한 패널티 정책은 현재<br/>없습니다. 다만 오늘출발 상품은 최근 7일간<br/>이행률이 95% 미만이면 오늘출발 뱃지가<br/>제외될 수 있고, 출고·배송예정일 안에<br/>출고·배송완료가 되지 않으면 심각도에 따라<br/>상품 품절, 오늘출발 서비스 이용 제한,<br/>고객 동의 하에 주문 취소·환불이 진행될 수<br/>있습니다.\"]:::bot\nN2_2{{\"출고소요일 설정\"}}:::sec\nN2_2_2[\"<b>2<\/b> 출고소요일은 고객이 주문한 상품을<br/>확인·포장해 택배사에 전달하기까지 걸리는<br/>기간으로, 본품 출고일 기준으로 입력해<br/>주세요. 영업일(공휴일 제외 월~금)<br/>기준입니다.\"]:::bot\nN2_2_3[\"<b>3<\/b> 출고소요일 상한은 일반택배 표준 4일,<br/>화물택배 표준 7일, 직접배송 표준<br/>20일이며, 해외배송·주문제작은 배송유형과<br/>관계없이 20일입니다. 상한을 지키기 어려운<br/>경우(타사에서도 상한을 넘겨 판매 중인<br/>상품, 프리미엄 일부, 예약판매, 예약배송<br/>등)에는 아래 링크로 상담·예외 처리를<br/>신청하실 수 있으며, 심사 후 설정이<br/>진행됩니다.\"]:::bot\nN2_2_2_2_1[\"<b>2-2-1<\/b> 해당 메일은 설정하신 출고소요일과 실제 출고<br/>기간에 차이가 있어 실제 기간에 맞게 다시<br/>설정해 달라는 안내입니다. 매월 최근 3개월<br/>출고 100건 이상 상품 중 ±2일 이상<br/>차이 나는 상품은 조정 요청 후 5영업일<br/>안에 조정되지 않으면 오늘의집에서 자동<br/>조정하며, 매주 지연 상품은 지연 주차의<br/>평균 출고일 기준으로 자동 조정됩니다.<br/>천재지변 등 불가항력 사유는 제외됩니다.\"]:::bot\nN2_3{{\"휴무일 설정\"}}:::sec\nN2_3_2[\"<b>2<\/b> 현재 휴무일 설정 기능은 없습니다.<br/>파트너사·물류사 휴무로 평일에 출고되지 않는<br/>경우, 고객님이 미리 아실 수 있도록 상품<br/>상세페이지 최상단에 배송지연 배너로 휴무일을<br/>공지해 주세요. 전 상품 일괄 공지는 오로라<br/>› 상품관리 › 공지이미지 관리에서 등록하실<br/>수 있습니다. 공지이미지는 1개만 등록되며,<br/>파일을 선택하면 즉시 반영되고 이전 파일은<br/>확인할 수 없으니 미리 보관해 주세요.\"]:::bot\nN2_4{{\"송장 등록·수정\"}}:::sec\nN2_4_2[\"<b>2<\/b> 송장은 주문 상태와 상품의 배송방법에 따라<br/>처리 방법이 다릅니다. 해당 주문의 현재<br/>주문 상태를 선택해 주세요. 업체직접배송으로<br/>설정된 상품이면\"]:::bot\nN2_4_3_1[\"<b>3-1<\/b> 송장은 배송준비중·배송중 상태에서<br/>입력·수정하실 수 있습니다.\"]:::bot\nN2_4_3_2[\"<b>3-2<\/b> 배송완료 상태에서는 송장 수정이 되지 않아<br/>배송준비중으로 상태를 되돌린 뒤 수정해야<br/>합니다. 상태를 되돌리는 변경은 고객님께<br/>먼저 확인이 필요해 파트너센터에서 처리해<br/>드립니다.\"]:::bot\nN2_4_3_3[\"<b>3-3<\/b> 구매확정 상태인 주문은 송장 수정이<br/>불가합니다.\"]:::bot\nN2_4_3_4[\"<b>3-4<\/b> 결제완료 상태에서는 송장을 입력할 수<br/>없습니다. 오로라 › 주문배송 ›<br/>주문배송현황에서 주문옵션번호 체크 후 주문<br/>확인을 먼저 눌러 배송준비중으로 바꾼 뒤<br/>송장을 입력해 주세요.\"]:::bot\nN2_4_3_6[\"<b>3-6<\/b> 주문 상태 확인이 필요해 상담원이 이어서<br/>도와드리겠습니다. 해당 주문의 주문옵션번호를<br/>알려 주세요.\"]:::bot\nN2_4_3_5[\"<b>3-5<\/b> 업체직접배송으로 설정된 상품은 오로라에서<br/>송장 등록이 되지 않습니다. 택배로<br/>보내셨다면 오로라 › 주문배송 ›<br/>주문배송현황에서 주문 건 체크 후 주문상태<br/>변경에서 배송완료를 선택해 주시고,<br/>송장번호는 고객님께 따로 전달해 주세요.\"]:::bot\nN2_5{{\"오늘출발\"}}:::sec\nN2_5_2[\"<b>2<\/b> 오늘출발은 일반택배 상품이면서 출고소요일이<br/>1일인 상품에 설정할 수 있고,<br/>주문제작·해외직구 상품은 적용되지 않습니다.<br/>상품 등록·수정 화면의 배송 › 배송기간에서<br/>당일 출고 마감시간(12:00~23:30,<br/>30분 단위)을 확인하신 뒤 오늘출발에<br/>체크해 주세요.\"]:::bot\nN2_5_3[\"<b>3<\/b> 오늘출발 이행률은 전산에서 자동 반영되어,<br/>고객 요청 건이라도 예외 처리가 되지 않는<br/>점 양해 부탁드립니다. 지정일 발송이 필요한<br/>주문은 지정일 발송 불가 사유로 취소한 뒤,<br/>고객님께 원하시는 수령일 전날 주문하시도록<br/>안내해 주세요.\"]:::bot\nN2_6{{\"배송비 설정\"}}:::sec\nN2_6_2[\"<b>2<\/b> 어떤 내용이 궁금하신가요?\"]:::bot\nN2_6_3_1[\"<b>3-1<\/b> 오로라 › 주문배송 › 주문배송현황 ›<br/>주문번호 클릭 › 주문상세 페이지 오른쪽<br/>배송정보에서 선불배송비와 제주/도서산간<br/>금액을 확인하실 수 있습니다.\"]:::bot\nN2_6_3_2[\"<b>3-2<\/b> '제품당 비례배송비'를 설정해 주세요.<br/>배송비 유형이 유료일 때만, 필수 옵션에만<br/>적용되며 추가구매 옵션에는 적용되지<br/>않습니다. 예를 들어 배송비 3,000원<br/>상품 2개를 주문하면 배송비 6,000원이<br/>부과됩니다.\"]:::bot\nN2_6_3_3[\"<b>3-3<\/b> 제주와 도서산간 비용은 같은 금액으로만<br/>설정할 수 있습니다. 금액을 다르게 받아야<br/>하면 상세페이지에 명시한 뒤 개별로 받아<br/>주세요. 도서산간 기준은 CJ대한통운<br/>기준이며, 우편번호 목록은 아래 공지에서<br/>확인하실 수 있습니다.\"]:::bot\nN2_6_3_4[\"<b>3-4<\/b> 제주·도서산간 배송비 상한은 일반택배<br/>20,000원, 화물택배 40,000원,<br/>직접배송 40,000원입니다. 반품배송비는<br/>초도배송비의 1배, 교환배송비는 2배까지<br/>설정하실 수 있고, 상품 등록·수정 시<br/>상한을 넘는 금액은 입력되지 않습니다. 기존<br/>상품이 상한을 넘는 경우 상한 이내로<br/>수정해야 수정이 완료됩니다.\"]:::bot\nN2_7{{\"기타 배송 문의\"}}:::sec\nN2_7_2[\"<b>2<\/b> 어떤 상황인지 조금 더 말씀해 주시겠어요?\"]:::bot\nN2_7_3_1[\"<b>3-1<\/b> 배송지연 안내 메일은 주문일 기준으로 추출해<br/>메일 발송일 기준 9일 내 배송지연 건을<br/>자동 발송하며, 이전 안내와 중복될 수<br/>있습니다. 9일이 지난 건은 제외되니 따로<br/>관리 부탁드립니다. 메일에 회신이 안 된다고<br/>되어 있으면, 해당 메일 주소로 지연 사유나<br/>처리 상황을 적어 보내 주시면 담당 부서에서<br/>확인합니다.\"]:::bot\nN2_7_3_2[\"<b>3-2<\/b> 정상 출고 후 배송 과정에서 생긴 분실·파손<br/>등 택배사 귀책은 오늘의집에서 중재·지원이<br/>어려워, 해당 택배사로 문의 부탁드립니다.\"]:::bot\nN2_7_3_3[\"<b>3-3<\/b> 확인을 위해 주문번호, 주문옵션번호, 회수가<br/>안 되는 상황(고객 부재, 거부 등)과<br/>지금까지 진행하신 내용을 알려 주세요.\"]:::bot\nN2_7_4[\"<b>4<\/b> 말씀해 주신 내용으로 담당 부서 확인을<br/>요청드리겠습니다. 상담원이 이어서<br/>도와드리겠습니다.\"]:::bot\nN2_7_3_4[\"<b>3-4<\/b> 처리 방법은 유관 부서 확인 후<br/>안내드리겠습니다. 주문번호와 재주문<br/>주문번호, 상황을 알려 주세요.\"]:::bot\nS --> N1\nN1 -->|\"배송상태 변경 요청이면\"| SW_PA001003\nN1 -->|\"고객에게 연락해 달라는 요청이면\"| SW_PA010001\nN1 -->|\"배송지연·연휴 안내\"| N2_1\nN2_1_2 -->|\"배너 양식 파일 제공 방법\"| TX2\nN2_1_3 -->|\"패널티가 있나요?\"| N2_1_4\nN2_1_3 -->|\"아니요\"| END\nN2_1_4 --> END\nN1 -->|\"출고소요일 설정\"| N2_2\nN2_2_2 -->|\"네, 예약판매라 더 길어요\"| N2_2_3\nN2_2_2 -->|\"아니요\"| END\nN2_2_3 --> END\nN2_2_3 -->|\"출고소요일 조정 안내 메일을 받았다는 문의면\"| N2_2_2_2_1\nN2_2_2_2_1 --> END\nN1 -->|\"휴무일 설정\"| N2_3\nN2_3_2 --> END\nN1 -->|\"송장 등록·수정\"| N2_4\nN2_4_2 -->|\"배송준비중·배송중\"| N2_4_3_1\nN2_4_2 -->|\"배송완료\"| N2_4_3_2\nN2_4_2 -->|\"구매확정\"| N2_4_3_3\nN2_4_2 -->|\"결제완료\"| N2_4_3_4\nN2_4_2 -->|\"업체직접배송 상품\"| N2_4_3_5\nN2_4_2 -->|\"잘 모르겠어요\"| N2_4_3_6\nN2_4_2 -->|\"결제완료 / 배송준비중·배송중 / 배송완료<br/>/ 구매확정 / 업체직접배송 상품이에요 /<br/>잘 모르겠어요\"| N2_4_3_1\nN2_4_3_1 --> END\nN2_4_3_2 --> SW_PA001003\nN2_4_3_3 --> END\nN2_4_3_4 --> END\nN2_4_3_6 --> HO_T3D\nN2_4_3_6 -->|\"주문옵션번호\"| N2_4_3_5\nN2_4_3_5 --> END\nN1 -->|\"오늘출발\"| N2_5\nN2_5_2 -->|\"고객 요청으로 지정일에 보냈는데 뱃지가<br/>빠졌어요\"| N2_5_3\nN2_5_2 -->|\"아니요\"| END\nN2_5_3 --> END\nN1 -->|\"배송비 설정\"| N2_6\nN2_6_2 -->|\"선불·제주/도서산간 배송비 결제 확인\"| N2_6_3_1\nN2_6_2 -->|\"수량만큼 배송비 부과\"| N2_6_3_2\nN2_6_2 -->|\"제주/도서산간 비용 따로 설정\"| N2_6_3_3\nN2_6_2 -->|\"배송비 상한\"| N2_6_3_4\nN2_6_3_1 --> END\nN2_6_3_2 --> END\nN2_6_3_3 --> END\nN2_6_3_4 --> END\nN1 -->|\"기타 배송 문의\"| N2_7\nN2_7_2 -->|\"배송지연 안내 메일을 받았어요\"| N2_7_3_1\nN2_7_2 -->|\"택배 분실·파손\"| N2_7_3_2\nN2_7_2 -->|\"반품 회수가 계속 안 돼요\"| N2_7_3_3\nN2_7_2 -->|\"부분 반품 재주문 건을 잘못 출고했어요\"| N2_7_3_4\nN2_7_2 -->|\"KMS에 없는 내용\"| HO_T5\nN2_7_3_1 -->|\"예약배송이라 고객과 협의해서 늦춘 건이에요\"| HO_T3B\nN2_7_3_1 -->|\"아니요\"| END\nN2_7_3_2 --> END\nN2_7_3_3 -->|\"주문번호, 주문옵션번호, 상황\"| N2_7_4\nN2_7_4 --> HO_T3C\nN2_7_3_4 --> HO_T3C\nN2_1 --> N2_1_2\nN2_2 --> N2_2_2\nN2_3 --> N2_3_2\nN2_4 --> N2_4_2\nN2_5 --> N2_5_2\nN2_6 --> N2_6_2\nN2_7 --> N2_7_2\nN2_1_2 -.-> N2_1_3\nSW_PA001003[/\"「배송상태 변경」로 전환\"/]:::sw\nSW_PA010001[/\"「고객 OB」로 전환\"/]:::sw\nTX2[\"(확인 필요: 챗봇에서<br/>배너 양식·폰트 파일 첨부<br/>가능 여부)\"]:::txt\nEND([\"상담 종료\"]):::fin\nHO_T3D([\"상담원 인계<br/>개별 조회 필요\"]):::ho\nHO_T5([\"상담원 인계<br/>답변 불가\"]):::ho\nHO_T3B([\"상담원 인계<br/>셀프 처리 실패\"]):::ho\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 배송 관련 문의 주셔서 감사합니다. 어떤 내용이 궁금하신지 선택하시거나 말씀해 주세요.", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "배송지연·연휴 안내", "sec": true, "body": []}, {"k": "2-1/2", "id": "2", "t": "출고예정일 안에 발송이 어려우시면 고객님이 미리 아실 수 있도록 아래 방법으로 안내해 주세요.", "sec": false, "body": ["- 출고소요일 변경: 오로라 > 상품관리 > 상품조회/수정 > 상품ID > 배송기간 > 출고소요일 입력 > 저장하기", "- 배송지연 배너 등록: 전 상품은 오로라 > 상품관리 > 공지이미지 관리, 일부 상품은 오로라 > 상품관리 > 상품조회/수정 > 상품코드 클릭 > 상세페이지 상단에 이미지 추가", "- 상품명/옵션명에 [예약판매] 기재", "- 이미 주문하신 고객님께는 전화나 문자로 개별 안내 (오로라 내 배송지연 알림 기능은 준비 중입니다)", "명절 연휴에는 연휴 전 출고 가능한 마지막 주문일, 연휴 이후 출고 시작일, 파트너님의 연휴 기간을 배너로 안내해 주세요. 오늘의집에서 제공하는 배송지연 배너 양식(배송지연안내, 단일상품 예약판매, 옵션별 예약판매, 기간별 예약판매)도 사용하실 수 있습니다."]}, {"k": "2-1/3", "id": "3", "t": "출고소요일을 실제 출고일에 맞게 바꾸셨다면 배너는 게시하지 않으셔도 됩니다. 다만 재고 부족, 주문 폭주 등으로 지연이 예상되면 배너로 미리 안내 부탁드립니다. 더 궁금하신 점 있으신가요?", "sec": false, "body": []}, {"k": "2-1/4", "id": "4", "t": "배송지연으로 인한 패널티 정책은 현재 없습니다. 다만 오늘출발 상품은 최근 7일간 이행률이 95% 미만이면 오늘출발 뱃지가 제외될 수 있고, 출고·배송예정일 안에 출고·배송완료가 되지 않으면 심각도에 따라 상품 품절, 오늘출발 서비스 이용 제한, 고객 동의 하에 주문 취소·환불이 진행될 수 있습니다.", "sec": false, "body": []}, {"k": "2-2", "id": "2-2", "t": "출고소요일 설정", "sec": true, "body": []}, {"k": "2-2/2", "id": "2", "t": "출고소요일은 고객이 주문한 상품을 확인·포장해 택배사에 전달하기까지 걸리는 기간으로, 본품 출고일 기준으로 입력해 주세요. 영업일(공휴일 제외 월~금) 기준입니다.", "sec": false, "body": ["- 상품별 수정: 오로라 > 상품관리 > 상품조회/수정 > 상품ID > 배송기간 > 출고소요일 입력 > 저장하기", "- 대량 수정: 오로라 > 상품관리 > 상품조회/수정 > 엑셀 양식 다운로드에서 '배송비정보 수정 양식' 다운로드 → 상품코드와 출고소요일 입력 → 엑셀 일괄 업로드에서 양식 유형 '배송비' 선택 후 업로드", "- 배송비 관련 변경은 영업일 기준 5일 이내 처리되며, 오로라 > 상품관리 > 상품 검수현황 > 수정검수요청 현황에서 결과를 확인하실 수 있습니다.", "상한 기준을 넘는 기간이 필요하신가요?"]}, {"k": "2-2/3", "id": "3", "t": "출고소요일 상한은 일반택배 표준 4일, 화물택배 표준 7일, 직접배송 표준 20일이며, 해외배송·주문제작은 배송유형과 관계없이 20일입니다. 상한을 지키기 어려운 경우(타사에서도 상한을 넘겨 판매 중인 상품, 프리미엄 일부, 예약판매, 예약배송 등)에는 아래 링크로 상담·예외 처리를 신청하실 수 있으며, 심사 후 설정이 진행됩니다.", "sec": false, "body": ["https://tally.so/r/wA8YZW", "예외 처리 시 상품페이지에 배송예정일·배송예정확률이 노출되지 않으므로, 고객님께 배송 시기를 별도로 정확히 안내해 주셔야 합니다."]}, {"k": "2-2/2-2-1", "id": "2-2-1", "t": "해당 메일은 설정하신 출고소요일과 실제 출고 기간에 차이가 있어 실제 기간에 맞게 다시 설정해 달라는 안내입니다. 매월 최근 3개월 출고 100건 이상 상품 중 ±2일 이상 차이 나는 상품은 조정 요청 후 5영업일 안에 조정되지 않으면 오늘의집에서 자동 조정하며, 매주 지연 상품은 지연 주차의 평균 출고일 기준으로 자동 조정됩니다. 천재지변 등 불가항력 사유는 제외됩니다.", "sec": false, "body": []}, {"k": "2-3", "id": "2-3", "t": "휴무일 설정", "sec": true, "body": []}, {"k": "2-3/2", "id": "2", "t": "현재 휴무일 설정 기능은 없습니다. 파트너사·물류사 휴무로 평일에 출고되지 않는 경우, 고객님이 미리 아실 수 있도록 상품 상세페이지 최상단에 배송지연 배너로 휴무일을 공지해 주세요. 전 상품 일괄 공지는 오로라 > 상품관리 > 공지이미지 관리에서 등록하실 수 있습니다. 공지이미지는 1개만 등록되며, 파일을 선택하면 즉시 반영되고 이전 파일은 확인할 수 없으니 미리 보관해 주세요.", "sec": false, "body": ["'택배 없는 날'은 출고·배송예정일 계산에서 자동 제외되어 출고소요일을 바꾸지 않으셔도 됩니다."]}, {"k": "2-4", "id": "2-4", "t": "송장 등록·수정", "sec": true, "body": []}, {"k": "2-4/2", "id": "2", "t": "송장은 주문 상태와 상품의 배송방법에 따라 처리 방법이 다릅니다. 해당 주문의 현재 주문 상태를 선택해 주세요. 업체직접배송으로 설정된 상품이면", "sec": false, "body": []}, {"k": "2-4/3-1", "id": "3-1", "t": "송장은 배송준비중·배송중 상태에서 입력·수정하실 수 있습니다.", "sec": false, "body": ["- 등록: 오로라 > 주문배송 > 주문배송현황 > 배송정보 항목의 송장 등록 (배송준비중 → 배송중으로 바뀝니다)", "- 일괄 등록: 엑셀 다운로드 후 주문옵션번호, 택배사(코드), 송장번호 입력 → 엑셀 일괄 업로드", "- 수정: 오로라 > 주문배송 > 주문배송현황 > 배송정보 항목의 택배정보 송장 수정 (수정은 일괄 처리가 안 되어 한 건씩 진행해 주세요)", "엑셀 업로드가 안 된다면 주문번호가 아닌 주문옵션번호를 넣으셨는지 확인 부탁드립니다."]}, {"k": "2-4/3-2", "id": "3-2", "t": "배송완료 상태에서는 송장 수정이 되지 않아 배송준비중으로 상태를 되돌린 뒤 수정해야 합니다. 상태를 되돌리는 변경은 고객님께 먼저 확인이 필요해 파트너센터에서 처리해 드립니다.", "sec": false, "body": []}, {"k": "2-4/3-3", "id": "3-3", "t": "구매확정 상태인 주문은 송장 수정이 불가합니다.", "sec": false, "body": []}, {"k": "2-4/3-4", "id": "3-4", "t": "결제완료 상태에서는 송장을 입력할 수 없습니다. 오로라 > 주문배송 > 주문배송현황에서 주문옵션번호 체크 후 주문 확인을 먼저 눌러 배송준비중으로 바꾼 뒤 송장을 입력해 주세요.", "sec": false, "body": []}, {"k": "2-4/3-6", "id": "3-6", "t": "주문 상태 확인이 필요해 상담원이 이어서 도와드리겠습니다. 해당 주문의 주문옵션번호를 알려 주세요.", "sec": false, "body": []}, {"k": "2-4/3-5", "id": "3-5", "t": "업체직접배송으로 설정된 상품은 오로라에서 송장 등록이 되지 않습니다. 택배로 보내셨다면 오로라 > 주문배송 > 주문배송현황에서 주문 건 체크 후 주문상태 변경에서 배송완료를 선택해 주시고, 송장번호는 고객님께 따로 전달해 주세요.", "sec": false, "body": ["※ 배송은 설정하신 배송방식에 맞추어 해 주셔야 하며, 배송방식을 잘못 설정하신 경우 실제 배송 방식에 맞게 수정 바랍니다. 배송방식이 달라 분쟁이 생기면 오늘의집에서 별도 도움드리기 어려울 수 있는 점 참고 부탁드립니다."]}, {"k": "2-5", "id": "2-5", "t": "오늘출발", "sec": true, "body": []}, {"k": "2-5/2", "id": "2", "t": "오늘출발은 일반택배 상품이면서 출고소요일이 1일인 상품에 설정할 수 있고, 주문제작·해외직구 상품은 적용되지 않습니다. 상품 등록·수정 화면의 배송 > 배송기간에서 당일 출고 마감시간(12:00~23:30, 30분 단위)을 확인하신 뒤 오늘출발에 체크해 주세요.", "sec": false, "body": ["뱃지는 최근 7일(평일·주말 포함) 이행률이 95% 이상이면 붙고 95% 미만이면 제외됩니다. 매일 자정 기준으로 갱신되며 반영까지 최대 6시간 걸릴 수 있고, 주말·공휴일에는 갱신되지 않고 금요일 상태를 따릅니다. 주말 주문은 다음 영업일 출고로 잡혀 이행률에 영향을 주지 않습니다. 한 주문에 옵션이 여러 개면 모든 옵션이 오늘출발되어야 성공으로 계산됩니다.", "이행률은 오로라 > 상품관리 > 오늘출발 관리에서 확인하실 수 있습니다."]}, {"k": "2-5/3", "id": "3", "t": "오늘출발 이행률은 전산에서 자동 반영되어, 고객 요청 건이라도 예외 처리가 되지 않는 점 양해 부탁드립니다. 지정일 발송이 필요한 주문은 지정일 발송 불가 사유로 취소한 뒤, 고객님께 원하시는 수령일 전날 주문하시도록 안내해 주세요.", "sec": false, "body": []}, {"k": "2-6", "id": "2-6", "t": "배송비 설정", "sec": true, "body": []}, {"k": "2-6/2", "id": "2", "t": "어떤 내용이 궁금하신가요?", "sec": false, "body": []}, {"k": "2-6/3-1", "id": "3-1", "t": "오로라 > 주문배송 > 주문배송현황 > 주문번호 클릭 > 주문상세 페이지 오른쪽 배송정보에서 선불배송비와 제주/도서산간 금액을 확인하실 수 있습니다.", "sec": false, "body": []}, {"k": "2-6/3-2", "id": "3-2", "t": "'제품당 비례배송비'를 설정해 주세요. 배송비 유형이 유료일 때만, 필수 옵션에만 적용되며 추가구매 옵션에는 적용되지 않습니다. 예를 들어 배송비 3,000원 상품 2개를 주문하면 배송비 6,000원이 부과됩니다.", "sec": false, "body": []}, {"k": "2-6/3-3", "id": "3-3", "t": "제주와 도서산간 비용은 같은 금액으로만 설정할 수 있습니다. 금액을 다르게 받아야 하면 상세페이지에 명시한 뒤 개별로 받아 주세요. 도서산간 기준은 CJ대한통운 기준이며, 우편번호 목록은 아래 공지에서 확인하실 수 있습니다.", "sec": false, "body": ["https://www.partnerbucketplace.com/hc/ko/articles/38450697155609"]}, {"k": "2-6/3-4", "id": "3-4", "t": "제주·도서산간 배송비 상한은 일반택배 20,000원, 화물택배 40,000원, 직접배송 40,000원입니다. 반품배송비는 초도배송비의 1배, 교환배송비는 2배까지 설정하실 수 있고, 상품 등록·수정 시 상한을 넘는 금액은 입력되지 않습니다. 기존 상품이 상한을 넘는 경우 상한 이내로 수정해야 수정이 완료됩니다.", "sec": false, "body": []}, {"k": "2-7", "id": "2-7", "t": "기타 배송 문의", "sec": true, "body": []}, {"k": "2-7/2", "id": "2", "t": "어떤 상황인지 조금 더 말씀해 주시겠어요?", "sec": false, "body": []}, {"k": "2-7/3-1", "id": "3-1", "t": "배송지연 안내 메일은 주문일 기준으로 추출해 메일 발송일 기준 9일 내 배송지연 건을 자동 발송하며, 이전 안내와 중복될 수 있습니다. 9일이 지난 건은 제외되니 따로 관리 부탁드립니다. 메일에 회신이 안 된다고 되어 있으면, 해당 메일 주소로 지연 사유나 처리 상황을 적어 보내 주시면 담당 부서에서 확인합니다.", "sec": false, "body": []}, {"k": "2-7/3-2", "id": "3-2", "t": "정상 출고 후 배송 과정에서 생긴 분실·파손 등 택배사 귀책은 오늘의집에서 중재·지원이 어려워, 해당 택배사로 문의 부탁드립니다.", "sec": false, "body": []}, {"k": "2-7/3-3", "id": "3-3", "t": "확인을 위해 주문번호, 주문옵션번호, 회수가 안 되는 상황(고객 부재, 거부 등)과 지금까지 진행하신 내용을 알려 주세요.", "sec": false, "body": []}, {"k": "2-7/4", "id": "4", "t": "말씀해 주신 내용으로 담당 부서 확인을 요청드리겠습니다. 상담원이 이어서 도와드리겠습니다.", "sec": false, "body": []}, {"k": "2-7/3-4", "id": "3-4", "t": "처리 방법은 유관 부서 확인 후 안내드리겠습니다. 주문번호와 재주문 주문번호, 상황을 알려 주세요.", "sec": false, "body": []}], "hocond": "택배사 외 처리 필요(반품 회수 지속 실패·부분반품 재주문 이중출고) 시 T3-C, 예약배송 협의건 배송지연 메일 문의 T3-B, 송장 문의에서 파트너가 주문 상태를 모르면 주문옵션번호를 받아 T3-D, KMS 없는 배송 문의 T5, 배송완료 건 송장 수정은 PA001003 역방향으로 전환", "hoinfo": "주문번호·주문옵션번호, 파트너가 선택한 주문 상태(송장 문의), 문의 항목(배송지연/출고소요일/송장 등), 반품 회수 실패 상황(고객 부재·거부 등)과 기존 진행 내역, 재주문 주문번호, 예약배송 협의 내용", "kms": "048_배송.md, 081_파트너센터_교육자료__주문_배송.md, 065__주문_.md, 043_상품수정.md, 093_고객센터_협업_유형_및_이관_방법.md, 060_상담_태그별_주요_문의유형_.md", "check": "1) 대량 출고소요일 수정 양식명: 048은 '배송비관련 수정 양식', 043·081은 '배송비정보 수정 양식'으로 표기 상충. 2) 배송비 관련 수정 처리 기간: 043은 평균 5영업일, 1~3영업일 기준은 KMS 원문에서 찾지 못함(입력 issue 기준). 어느 쪽으로 안내할지 확인 필요. 3) 배송지연 배너 양식·폰트 파일을 챗봇에서 첨부할 수 있는지. 4) 반품 회수 지속 실패는 ECA 교환/반품 확인요청 이관인데 반품 유형으로 바꿔 찍을지 PA001002로 둘지 확인 필요 5) (1차 전환) 송장 분기를 파트너가 고른 주문 상태로 판단하므로, 잘못 고르면 안내가 달라질 수 있음. 상태를 모르는 파트너를 상담원에게 넘기는(T3-D) 대신 오로라 확인 경로를 먼저 안내할지 확인 필요", "api": "R-02", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 궁금한 항목: \n· (해당 시: 송장 등록·수정, 반품 회수, 잘못 출고) 주문옵션번호: \n· (해당 시: 송장 등록·수정) 현재 주문 상태 (결제완료 / 배송준비중 / 배송중 / 배송완료 / 구매확정): \n· (해당 시: 송장 등록·수정) 상품의 배송방법 (일반택배 / 화물택배 / 업체직접배송): \n· (해당 시: 반품 회수) 회수가 안 되는 상황과 지금까지 진행한 내용: \n· (해당 시: 잘못 출고) 재주문 주문번호: \n\n문의 내용: ", "mode": "조건별: 설정·기준 안내(지연·출고소요일·휴무·송장·오늘출발·배송비·안내 메일·택배사 귀책)는 자동답변 종결 / 반품 회수 지속 실패·재주문 이중출고·예약배송 협의 지연 건은 상담원 배정 / 배송완료 건 송장 수정은 PA001003으로 바꿔 판정", "segs": [{"c": ["A"], "t": "설정·기준 안내(지연·출고소요일·휴무·송장·오늘출발·배송비·안내 메일·택배사 귀책)는 자동답변 종결"}, {"c": ["C"], "t": "반품 회수 지속 실패·재주문 이중출고·예약배송 협의 지연 건은 상담원 배정"}, {"c": ["SW"], "t": "배송완료 건 송장 수정은 PA001003으로 바꿔 판정"}], "auto": "(공통 첫인사)\n\n[배송지연·연휴 안내]\n출고예정일 안에 발송이 어려우시면 고객님이 미리 아실 수 있도록 아래 방법으로 안내해 주세요.\n- 출고소요일 변경: 오로라 > 상품관리 > 상품조회/수정 > 상품ID > 배송기간 > 출고소요일 입력 > 저장하기\n- 배송지연 배너 등록: 전 상품은 오로라 > 상품관리 > 공지이미지 관리, 일부 상품은 오로라 > 상품관리 > 상품조회/수정 > 상품코드 클릭 > 상세페이지 상단에 이미지 추가\n- 상품명·옵션명에 [예약판매] 기재\n- 이미 주문하신 고객님께는 전화나 문자로 개별 안내 (오로라 내 배송지연 알림 기능은 준비 중입니다)\n명절 연휴에는 연휴 전 출고 가능한 마지막 주문일, 연휴 이후 출고 시작일, 파트너님의 연휴 기간을 배너로 안내해 주세요. 출고소요일을 실제 출고일에 맞게 바꾸셨다면 배너는 게시하지 않으셔도 되지만, 재고 부족·주문 폭주 등으로 지연이 예상되면 배너로 미리 안내 부탁드립니다.\n배송지연에 대한 패널티 정책은 현재 없습니다. 다만 오늘출발 상품은 최근 7일간 이행률이 95% 미만이면 오늘출발 뱃지가 제외될 수 있고, 출고·배송예정일 안에 출고·배송완료가 되지 않으면 심각도에 따라 상품 품절, 오늘출발 서비스 이용 제한, 고객 동의 하에 주문 취소·환불이 진행될 수 있습니다.\n\n[출고소요일 설정]\n출고소요일은 주문 상품을 확인·포장해 택배사에 전달하기까지 걸리는 기간으로, 본품 출고일 기준 영업일(공휴일 제외 월~금)로 입력해 주세요.\n- 상품별 수정: 오로라 > 상품관리 > 상품조회/수정 > 상품ID > 배송기간 > 출고소요일 입력 > 저장하기\n- 대량 수정: 오로라 > 상품관리 > 상품조회/수정 > 엑셀 양식 다운로드에서 '배송비정보 수정 양식' 다운로드 → 상품코드와 출고소요일 입력 → 엑셀 일괄 업로드에서 양식 유형 '배송비' 선택 후 업로드\n- 배송비 관련 변경은 영업일 기준 5일 이내 처리되며, 오로라 > 상품관리 > 상품 검수현황 > 수정검수요청 현황에서 결과를 확인하실 수 있습니다.\n출고소요일 상한은 일반택배 표준 4일, 화물택배 표준 7일, 직접배송 표준 20일이며, 해외배송·주문제작은 배송유형과 관계없이 20일입니다. 상한을 지키기 어려운 경우(타사에서도 상한을 넘겨 판매 중인 상품, 프리미엄 일부, 예약판매, 예약배송 등)에는 아래 링크로 상담·예외 처리를 신청하실 수 있으며, 심사 후 설정이 진행됩니다.\nhttps://tally.so/r/wA8YZW\n예외 처리 시 상품페이지에 배송예정일·배송예정확률이 노출되지 않으므로, 고객님께 배송 시기를 별도로 정확히 안내해 주셔야 합니다.\n\n[출고소요일 조정 안내 메일을 받으신 경우]\n설정하신 출고소요일과 실제 출고 기간에 차이가 있어 실제 기간에 맞게 다시 설정해 달라는 안내입니다. 매월 최근 3개월 출고 100건 이상 상품 중 ±2일 이상 차이 나는 상품은 조정 요청 후 5영업일 안에 조정되지 않으면 오늘의집에서 자동 조정하며, 매주 지연 상품은 지연 주차의 평균 출고일 기준으로 자동 조정됩니다. 천재지변 등 불가항력 사유는 제외됩니다.\n\n[휴무일 설정]\n현재 휴무일 설정 기능은 없습니다. 파트너사·물류사 휴무로 평일에 출고되지 않는 경우 상품 상세페이지 최상단에 배송지연 배너로 휴무일을 공지해 주세요. 전 상품 일괄 공지는 오로라 > 상품관리 > 공지이미지 관리에서 등록하실 수 있습니다. 공지이미지는 1개만 등록되며, 파일을 선택하면 즉시 반영되고 이전 파일은 확인할 수 없으니 미리 보관해 주세요. '택배 없는 날'은 출고·배송예정일 계산에서 자동 제외되어 출고소요일을 바꾸지 않으셔도 됩니다.\n\n[송장 등록·수정] (파트너가 적은 주문 상태·배송방법에 해당하는 단락만)\n- 배송준비중·배송중: 등록은 오로라 > 주문배송 > 주문배송현황 > 배송정보 항목의 송장 등록(배송준비중 → 배송중으로 바뀝니다), 일괄 등록은 엑셀 다운로드 후 주문옵션번호·택배사(코드)·송장번호 입력 → 엑셀 일괄 업로드, 수정은 같은 화면 택배정보의 송장 수정(일괄 수정 불가, 한 건씩). 엑셀 업로드가 안 되면 주문번호가 아닌 주문옵션번호를 넣으셨는지 확인해 주세요.\n- 결제완료: 송장을 입력할 수 없습니다. 오로라 > 주문배송 > 주문배송현황에서 주문옵션번호 체크 후 주문 확인을 눌러 배송준비중으로 바꾼 뒤 입력해 주세요.\n- 구매확정: 송장 수정이 불가합니다.\n- 업체직접배송 상품: 오로라에서 송장 등록이 되지 않습니다. 택배로 보내셨다면 오로라 > 주문배송 > 주문배송현황에서 주문 건 체크 후 주문상태 변경에서 배송완료를 선택하시고, 송장번호는 고객님께 따로 전달해 주세요. 배송은 설정하신 배송방식에 맞추어 해 주셔야 하며, 배송방식이 달라 분쟁이 생기면 오늘의집에서 별도 도움드리기 어려울 수 있습니다.\n\n[오늘출발]\n오늘출발은 일반택배 상품이면서 출고소요일이 1일인 상품에 설정할 수 있고, 주문제작·해외직구 상품은 적용되지 않습니다. 상품 등록·수정 화면의 배송 > 배송기간에서 당일 출고 마감시간(12:00~23:30, 30분 단위)을 확인하신 뒤 오늘출발에 체크해 주세요.\n뱃지는 최근 7일(평일·주말 포함) 이행률이 95% 이상이면 붙고 95% 미만이면 제외됩니다. 매일 자정 기준으로 갱신되며 반영까지 최대 6시간 걸릴 수 있고, 주말·공휴일에는 갱신되지 않고 금요일 상태를 따릅니다. 주말 주문은 다음 영업일 출고로 잡혀 이행률에 영향을 주지 않으며, 한 주문에 옵션이 여러 개면 모든 옵션이 오늘출발되어야 성공으로 계산됩니다. 이행률은 오로라 > 상품관리 > 오늘출발 관리에서 확인하실 수 있습니다.\n고객 요청으로 지정일에 보낸 건도 이행률은 전산에서 자동 반영되어 예외 처리가 되지 않습니다. 지정일 발송이 필요한 주문은 지정일 발송 불가 사유로 취소한 뒤, 고객님께 원하시는 수령일 전날 주문하시도록 안내해 주세요.\n\n[배송비 설정]\n- 선불·제주/도서산간 배송비 결제 확인: 오로라 > 주문배송 > 주문배송현황 > 주문번호 클릭 > 주문상세 페이지 오른쪽 배송정보\n- 수량만큼 배송비 부과: '제품당 비례배송비'를 설정해 주세요. 배송비 유형이 유료일 때만, 필수 옵션에만 적용됩니다. (예: 배송비 3,000원 상품 2개 주문 시 6,000원)\n- 제주·도서산간 비용은 같은 금액으로만 설정할 수 있습니다. 금액을 다르게 받아야 하면 상세페이지에 명시한 뒤 개별로 받아 주세요. 도서산간 기준은 CJ대한통운 기준이며 우편번호 목록은 https://www.partnerbucketplace.com/hc/ko/articles/38450697155609 에서 확인하실 수 있습니다.\n- 상한: 제주·도서산간 배송비는 일반택배 20,000원, 화물택배 40,000원, 직접배송 40,000원이며, 반품배송비는 초도배송비의 1배, 교환배송비는 2배까지 설정하실 수 있습니다. 상한을 넘는 금액은 입력되지 않으며, 기존 상품이 상한을 넘으면 상한 이내로 수정해야 수정이 완료됩니다.\n\n[배송지연 안내 메일을 받으신 경우]\n배송지연 안내 메일은 주문일 기준으로 추출해 메일 발송일 기준 9일 내 배송지연 건에 자동 발송되며, 이전 안내와 중복될 수 있습니다. 9일이 지난 건은 제외되니 따로 관리 부탁드립니다. 메일에 회신이 안 된다고 되어 있으면, 해당 메일 주소로 지연 사유나 처리 상황을 적어 보내 주시면 담당 부서에서 확인합니다.\n\n[택배 분실·파손]\n정상 출고 후 배송 과정에서 생긴 분실·파손 등 택배사 귀책은 오늘의집에서 중재·지원이 어려워 해당 택배사로 문의 부탁드립니다.\n(맺음 A)", "ack": "남겨 주신 주문 정보와 진행 내용을 담당 부서에 전달해 확인하겠습니다.\n(반품 회수 지속 실패: \"고객님 부재·거부 등으로 회수가 계속 안 되는 건으로 확인되어, 오늘의집에서 고객님 확인을 진행한 뒤 안내드리겠습니다.\")", "info": "주문번호·주문옵션번호, 문의 항목, 파트너가 고른 주문 상태·배송방법, 반품 회수 실패 상황과 기존 진행 내역, 재주문 주문번호, 예약배송 협의 내용", "kms": "048_배송.md, 081_파트너센터_교육자료__주문_배송.md, 065__주문_.md, 043_상품수정.md, 093_고객센터_협업_유형_및_이관_방법.md", "check": "1) 대량 출고소요일 수정 양식명: 048 '배송비관련 수정 양식' vs 043·081 '배송비정보 수정 양식'\n2) 배송비 관련 수정 처리 기간: 043 평균 5영업일, 1~3영업일 기준은 KMS 원문에서 못 찾음\n3) 배송지연 배너 양식·폰트 파일을 AI 답변에 첨부할 수 있는지 (양식 4종 제공 문장은 첨부 가능할 때만 추가)\n4) 반품 회수 지속 실패 건을 반품 유형으로 바꿔 찍을지 PA001002로 둘지"}}, {"code": "PA001003", "draft": true, "name": "배송상태 변경", "mid": "배송", "vol": "796", "mode": "안내 후 조건부 상담원 연결", "utter": "직접배송 건 배송완료로 바꿔주세요\n택배로 등록된 상품인데 저희가 직접 갖다 드렸어요. 배송완료 처리 좀 해주세요\n배송완료로 잘못 눌렀어요. 배송중으로 돌려주세요", "raw": "1. 네, 파트너님. 배송상태 변경을 도와드리겠습니다. 변경이 필요한 주문옵션번호와 현재 상태, 바꾸고 싶은 상태를 알려 주세요. 여러 건이면 건수도 함께 알려 주세요.\n[주문옵션번호, 현재 상태, 변경 희망 상태, 건수]\n(주문번호만 받은 경우 → \"배송상태는 주문옵션번호 기준으로 변경됩니다. 오로라 > 주문배송 > 주문배송현황에서 주문번호를 검색하시면 주문옵션번호를 확인하실 수 있습니다.\"로 재요청)\n2. 상품에 설정된 배송방법과 실제로 배송하신 방법을 확인하겠습니다. 상품에 설정된 배송방법을 선택해 주시고, 실제로도 그 방법으로 배송하셨는지 알려 주세요.\n[업체직접배송] [일반택배] [화물택배] [잘 모르겠어요]\n[네, 같아요] [아니요, 다르게 보냈어요]\n(변경 방향 판단: 1에서 파트너가 알려 주신 현재 상태와 변경 희망 상태로 판단. 결제완료(1) → 배송준비중(2) → 배송중(3) → 배송완료(4) 순서대로면 순방향, 반대면 역방향)\n(순방향 + 업체직접배송 + 설정=실제 → 3-1 / 순방향 + 일반·화물택배 + 설정=실제 → 3-2 / 설정≠실제 → 3-3 / 역방향 → 3-4 / 오로라에서 변경 자체가 안 됨 → 3-5 / 현재 상태가 구매확정 → 3-6)\n(역방향이면 배송방법 확인 없이 → 3-4)\n(설정 배송방법 [잘 모르겠어요] + 순방향 → 3-7)\n\n3-1. 업체직접배송 순방향 (배송준비중 → 배송중 → 배송완료)\n3. 업체직접배송 주문은 파트너님께서 오로라에서 직접 변경하실 수 있습니다.\n- 오로라 > 주문/배송 > 주문 배송 현황에서 변경할 주문 체크 > 주문상태 변경 > 배송완료 선택\n- 한 페이지에 최대 200건까지 표시되어 페이지 단위로 한 번에 처리하실 수 있습니다.\n- 배송준비중 → 배송중은 엑셀 일괄 업로드로도 변경하실 수 있습니다(엑셀은 배송준비중 → 배송중만 가능).\n배송준비중에서 배송완료로 한 번에 바꿀 수는 없습니다. [오로라 > 주문배송 > 주문배송현황]에서 주문을 선택해 배송중으로 먼저 변경한 뒤 배송완료로 변경해 주세요.\n배송완료는 상품이 고객님께 실제로 전달된 주문에만 처리해 주세요.\n(파트너가 처리할 건이 많다고 하면 → 3-1-1, 정해진 건수 기준 없음)\n[해결됐어요] → 상담 종료 (유형: PA001003)\n[해 봤는데 안 돼요] → 3-5\n3-1-1. 배송중 → 배송완료를 대량으로 처리하셔야 하면 '배송_배송상태 변경 요청서' 엑셀 양식에 맞춰 보내 주시면 파트너센터에서 처리해 드립니다. 양식에는 주문옵션번호 기준으로 적어 주세요.\n(양식 파일 제공 → {확인 필요: 챗봇 양식 첨부·파일 수신 가능 여부} (요청서는 주문옵션번호 기준))\n[요청서 첨부]\n4. 보내 주신 요청서로 처리를 접수하겠습니다. 상담원이 확인 후 처리해 드리겠습니다.\n→ 상담원 인계 (T3-A)\n\n3-2. 일반택배·화물택배 순방향\n3. 택배 주문은 송장을 등록하시면 배송 현황이 자동 추적되어 배송상태가 반영됩니다.\n- 배송준비중 → 배송중: 오로라 > 주문배송 > 주문배송현황에서 송장 등록, 또는 엑셀 일괄 업로드(주문옵션번호, 택배사 코드, 송장번호 입력)\n- 배송중 → 배송완료: 유효한 송장이 등록되고 택배사에 인계되었다면 배달완료 후 자동으로 배송완료로 바뀝니다. 간혹 실제 배달이 끝났는데도 바뀌지 않는 경우, 배달 완료된 주문에 한해 오로라 주문배송 배송중 메뉴에서 기간 설정 후 검색 > 주문 선택 > '선택배송완료'로 처리해 주세요.\n- 송장 등록일 기준 20영업일이 지나면(21영업일째) 자동으로 배송완료 처리됩니다.\n[해결됐어요] → 상담 종료 (유형: PA001003)\n[직접 처리가 어려워요 / 대량이에요] → 4\n4. 파트너센터에서 변경을 도와드릴 수 있으며, 이 경우 고객님께 안내 문자가 발송됩니다. 주문옵션번호 목록과 변경 사유를 알려 주세요.\n[주문옵션번호, 사유]\n→ 상담원 인계 (T3-A)\n\n3-3. 설정된 배송방법과 실제 배송방법이 다른 경우\n3. 어떻게 배송하셨는지 선택해 주세요.\n[택배로 설정했는데 직접 배송했어요] → 3-3-1\n[직접배송으로 설정했는데 택배로 보냈어요] → 3-3-2\n3-3-1. 택배 설정 상품을 직접 배송하신 경우, 배송중·배송완료 변경은 파트너님께서 직접 하실 수 없어 파트너센터에서 처리해 드리며 고객님께 안내 문자가 발송됩니다. 확인을 위해 아래 내용을 알려 주세요.\n- 주문옵션번호(건수)\n- 배송방식이 바뀐 사유\n(이미 배송중인 건의 배송중 → 배송완료만 필요하면 → \"배송중 → 배송완료는 오로라 > 주문배송 > 주문배송현황에서 주문옵션번호 체크 후 배송완료를 선택해 직접 처리하실 수 있습니다.\" 안내 후 [해결됐어요] → 상담 종료 (유형: PA001003))\n[주문옵션번호, 사유]\n4. ※ 배송은 설정하신 배송방식에 맞추어 해 주셔야 하며, 배송방식을 잘못 설정하신 경우 실제 배송 방식에 맞게 수정 바랍니다. 배송방식이 달라 분쟁이 생기면 오늘의집에서 별도 도움드리기 어려울 수 있는 점 참고 부탁드립니다. 상담원이 이어서 변경을 도와드리겠습니다.\n→ 상담원 인계 (T3-A)\n3-3-2. 직접배송 설정 상품을 택배로 보내신 경우, 배송유형 변경과 운송장 입력은 되지 않지만 배송상태 변경은 파트너님께서 직접 하실 수 있습니다.\n- 오로라 > 주문배송 > 주문배송현황 > 주문 건 체크 > 주문상태 변경 > 배송완료 선택\n- 운송장 번호는 고객님께 문자로 따로 안내해 주세요.\n혹시 주문번호나 상품을 다르게 보신 건 아닌지 한 번 더 확인 부탁드립니다.\n※ 배송은 설정하신 배송방식에 맞추어 해 주셔야 하며, 배송방식을 잘못 설정하신 경우 실제 배송 방식에 맞게 수정 바랍니다. 배송방식이 달라 분쟁이 생기면 오늘의집에서 별도 도움드리기 어려울 수 있는 점 참고 부탁드립니다.\n[해결됐어요] → 상담 종료 (유형: PA001003)\n[안 돼요] → 3-5\n\n3-4. 역방향 (배송완료 → 배송중·배송준비중, 배송중 → 배송준비중)\n3. 상태를 되돌리는 변경은 파트너님께서 직접 하실 수 없고, 파트너센터에서 고객님께 먼저 안내하고 동의를 확인한 뒤 처리해 드립니다. 고객님과 연락이 닿지 않으면 고객센터로 문의하시도록 문자로 안내드리고 상태 변경은 진행되지 않는 점 양해 부탁드립니다. 확인을 위해 아래 내용을 알려 주세요.\n- 주문옵션번호(건수)\n- 되돌려야 하는 사유 (예: 송장 수정 필요, 잘못 처리)\n- 상품 배송 가능일(아직 배송 전이라면)\n[주문옵션번호, 사유, 배송 가능일]\n(파트너가 알려 주신 현재 상태가 구매확정이면 → 3-6)\n4. 말씀해 주신 내용으로 접수하겠습니다. 상담원이 고객님 확인 후 처리해 드리겠습니다.\n→ 상담원 인계 (T3-A)\n\n3-5. 오로라에서 주문이 안 보이거나 변경이 안 되는 경우\n3. 어떤 상황인지 선택해 주세요.\n[오로라 홈 건수랑 실제 목록이 달라요] → 3-5-1\n[주문배송현황에서도 안 보이거나 변경이 안 돼요] → 3-5-2\n3-5-1. 오로라 홈 화면의 현황 건수는 부득이 정합성이 맞지 않을 수 있는 점 양해 부탁드립니다. 개발팀에서도 인지하고 있어 개선 예정이지만 반영까지 시일이 걸릴 수 있어, 주문배송현황 메뉴의 필터로 주문을 확인·관리해 주세요.\n→ 상담 종료 (유형: PA001003)\n3-5-2. 주문상태는 순서대로만 바뀌어 결제완료 → 배송중처럼 단계를 건너뛰면 버튼이 비활성화됩니다. 순서대로 진행하셨는데도 안 되신다면 확인이 필요합니다. 주문옵션번호와 화면 캡처, 어떤 버튼에서 안 되는지 알려 주세요.\n[주문옵션번호, 캡처, 증상]\n→ 상담원 인계 (T5)\n\n3-6. 구매확정 건\n3. 구매확정된 주문은 송장 수정 등 배송정보 변경이 제한됩니다. 상담원이 확인해 드리겠습니다.\n→ 상담원 인계 (T5)\n\n3-7. 설정된 배송방법을 모르시는 경우\n3. 상품에 설정된 배송방법에 따라 변경 방법이 달라 확인이 필요합니다. 1에서 알려 주신 주문옵션번호와 현재 상태, 바꾸고 싶은 상태로 확인을 요청드리겠습니다. 실제로 어떻게 배송하셨는지도 함께 알려 주세요.\n[실제 배송 방법]\n4. 상담원이 이어서 도와드리겠습니다.\n→ 상담원 인계 (T3-D)\n\n(공통) 일반택배 상품이 실제로 배송되지 않았는데 자동 배송완료되었다는 문의 → \"송장 등록 후 일정 기간이 지나도 배송완료가 되지 않으면 시스템에서 자동 배송완료될 수 있으며, 일반택배는 송장 등록일 기준 20영업일 이후(21영업일째)입니다.\" 안내 후 되돌리기를 원하면 → 3-4\n(공통) 업체직접배송 자동 배송완료 문의 → \"업체직접배송 주문은 주문 확인일 기준 60영업일이 지나면 시스템에서 자동으로 배송완료됩니다.\"", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 배송상태 변경을<br/>도와드리겠습니다. 변경이 필요한<br/>주문옵션번호와 현재 상태, 바꾸고 싶은<br/>상태를 알려 주세요. 여러 건이면 건수도<br/>함께 알려 주세요.\"]:::bot\nN2[\"<b>2<\/b> 상품에 설정된 배송방법과 실제로 배송하신<br/>방법을 확인하겠습니다. 상품에 설정된<br/>배송방법을 선택해 주시고, 실제로도 그<br/>방법으로 배송하셨는지 알려 주세요.\"]:::bot\nN3_1[\"<b>3-1<\/b> 업체직접배송 순방향 (배송준비중\"]:::bot\nN3[\"<b>3<\/b> 상품에 설정된 배송 T3A([\"상담원 인계<br/>실행 요청\"]):::ho\nTX7[\"배송중·배송준비중, 배송중<br/>→ 배송준비중)\"]:::txt\nTX8[\"배송중처럼 단계를 건너뛰면<br/>버튼이 비활성화됩니다.<br/>순서대로 진행하셨는데도 안<br/>되신다면 확인이<br/>필요합니다. 주문옵션번호와<br/>화면 캡처, 어떤 버튼에서<br/>안 되는지 알려 주세요.\"]:::txt\nHO_T5([\"상담원 인계<br/>답변 불가\"]):::ho\nHO_T3D([\"상담원 인계<br/>개별 조회 필요\"]):::ho\nTX11[\"'송장 등록 후 일정<br/>기간이 지나도 배송완료가<br/>되지 않으면 시스템에서<br/>자동 배송완료될 수<br/>있으며, 일반택배는 송장<br/>등록일 기준 20영업일<br/>이후(21영업일째)입니다.'<br/>안내 후 되돌리기를 원하면<br/>→ 3-4\"]:::txt\nTX12[\"'업체직접배송 주문은 주문<br/>확인일 기준 60영업일이<br/>지나면 시스템에서 자동으로<br/>배송완료됩니다.'\"]:::txt", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 배송상태 변경을 도와드리겠습니다. 변경이 필요한 주문옵션번호와 현재 상태, 바꾸고 싶은 상태를 알려 주세요. 여러 건이면 건수도 함께 알려 주세요.", "sec": false, "body": []}, {"k": "2", "id": "2", "t": "상품에 설정된 배송방법과 실제로 배송하신 방법을 확인하겠습니다. 상품에 설정된 배송방법을 선택해 주시고, 실제로도 그 방법으로 배송하셨는지 알려 주세요.", "sec": false, "body": []}, {"k": "3-1", "id": "3-1", "t": "업체직접배송 순방향 (배송준비중 → 배송중 → 배송완료)", "sec": false, "body": []}, {"k": "3", "id": "3", "t": "상품에 설정된 배송방법에 따라 변경 방법이 달라 확인이 필요합니다. 1에서 알려 주신 주문옵션번호와 현재 상태, 바꾸고 싶은 상태로 확인을 요청드리겠습니다. 실제로 어떻게 배송하셨는지도 함께 알려 주세요.", "sec": false, "body": []}, {"k": "3-1-1", "id": "3-1-1", "t": "배송중 → 배송완료를 대량으로 처리하셔야 하면 '배송_배송상태 변경 요청서' 엑셀 양식에 맞춰 보내 주시면 파트너센터에서 처리해 드립니다. 양식에는 주문옵션번호 기준으로 적어 주세요.", "sec": false, "body": []}, {"k": "4", "id": "4", "t": "상담원이 이어서 도와드리겠습니다.", "sec": false, "body": []}, {"k": "3-2", "id": "3-2", "t": "일반택배·화물택배 순방향", "sec": false, "body": []}, {"k": "3", "id": "3", "t": "상품에 설정된 배송방법에 따라 변경 방법이 달라 확인이 필요합니다. 1에서 알려 주신 주문옵션번호와 현재 상태, 바꾸고 싶은 상태로 확인을 요청드리겠습니다. 실제로 어떻게 배송하셨는지도 함께 알려 주세요.", "sec": false, "body": []}, {"k": "4", "id": "4", "t": "상담원이 이어서 도와드리겠습니다.", "sec": false, "body": []}, {"k": "3-3", "id": "3-3", "t": "설정된 배송방법과 실제 배송방법이 다른 경우", "sec": false, "body": []}, {"k": "3", "id": "3", "t": "상품에 설정된 배송방법에 따라 변경 방법이 달라 확인이 필요합니다. 1에서 알려 주신 주문옵션번호와 현재 상태, 바꾸고 싶은 상태로 확인을 요청드리겠습니다. 실제로 어떻게 배송하셨는지도 함께 알려 주세요.", "sec": false, "body": []}, {"k": "3-3-1", "id": "3-3-1", "t": "택배 설정 상품을 직접 배송하신 경우, 배송중·배송완료 변경은
