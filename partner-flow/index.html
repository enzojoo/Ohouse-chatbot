<script>
const D=JSON.parse(document.getElementById('data').textContent);
const T=D.types;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MODE={'AI 안내 종결':['m-close','AI 안내 종결','end'],'안내 후 조건부 상담원 연결':['m-cond','안내 후 조건부 연결','sec'],'정보 수집 후 상담원 연결':['m-collect','정보 수집 후 연결','ho']};
const BC={A:['end','AI 답변 종결'],B:['sec','AI 답변 + 상담원 확인'],C:['ho','상담원 배정'],SW:['sw','유형 전환'],NA:['','해당 없음']};
const slug=c=>'t-'+c.toLowerCase();
const TH={T4:['감정·민원',1],T1:['직접 요청',2],T8:['운영시간 경계',3],T6:['조회 실패',4],'T3-A':['실행 요청',5],'T3-C':['담당 부서 이관',6],'T3-B':['셀프 처리 실패',7],'T3-D':['개별 조회 필요',8],T7:['복수 용건',9],T2:['반복·미해결',10],T5:['답변 불가',11]};
const NM=Object.fromEntries(T.map(t=>[t.code,t.name]));
const tn=c=>TH[c]?TH[c][0]:c;
function human(s){ /* esc 처리된 문자열에서 코드를 이름으로 */
  return s.replace(/(PA\d{6})(?:\s*\(안\))?(?:~(PA\d{6}))?/g,(m,a,b)=>'「'+(NM[a]||a)+'」'+(b?'~「'+(NM[b]||b)+'」':''))
          .replace(/\b(T\d(?:-[A-D])?)\b/g,(m,c)=>TH[c]?'[인계 사유: '+TH[c][0]+']':m);
}

function buildNav(){
  const groups=[];T.forEach(t=>{let g=groups.find(x=>x.mid===t.mid);if(!g)groups.push(g={mid:t.mid,items:[]});g.items.push(t)});
  let h=`<h1>파트너센터 상담 흐름도</h1><div class="sub">시나리오 시트 4-1·4-2 기준 · 1차(KMS·FAQ)</div>
  <div class="grp">전체 흐름</div>
  <a href="#chat-flow">채팅 전체 흐름</a><a href="#board-flow">게시판 전체 흐름</a><a href="#handover">상담원 인계 기준</a>`;
  groups.forEach(g=>{h+=`<div class="grp">${esc(g.mid)} · ${g.items.length}</div>`;g.items.forEach(t=>{const m=MODE[t.mode]||['','',''];h+=`<a href="#${slug(t.code)}"><span class="dot ${m[0]}" title="${esc(t.mode)}"></span>${esc(t.name)}<span class="code">${t.code.slice(2)}</span></a>`})});
  $('#nav').innerHTML=h;
  let o=`<option value="chat-flow">채팅 전체 흐름</option><option value="board-flow">게시판 전체 흐름</option><option value="handover">상담원 인계 기준</option>`;
  groups.forEach(g=>{o+=`<optgroup label="${esc(g.mid)}">`+g.items.map(t=>`<option value="${slug(t.code)}">${esc(t.name)}</option>`).join('')+`</optgroup>`});
  $('#pick').innerHTML=o; $('#pick').onchange=e=>{location.hash=e.target.value};
}

/* ---------- 대사 원문 렌더 ---------- */
function script(raw){
  const out=[];
  raw.split('\n').forEach(l=>{
    l=l.trim(); if(!l) return;
    let m=l.match(/^(\d+(?:-\d+)*)\.\s*(.*)$/);
    if(m){
      if(/^\[[^\]]+\]\s*$/.test(m[2])&&m[1].includes('-')){out.push(`<div class="secline">${esc(m[1])} · ${esc(m[2].replace(/^\[|\]$/g,''))}</div>`);return}
      out.push(`<div class="node"><span class="nid">${esc(m[1])}</span><div class="bubble">${fmtInline(m[2])}</div></div>`);return}
    if(l.startsWith('[')){
      if(/\]\s*→/.test(l)){out.push(`<div class="arrow">${fmtInline(l)}</div>`);return}
      const b=[...l.matchAll(/\[([^\]]+)\]/g)].map(x=>`<span class="btn">${esc(x[1])}</span>`).join('');out.push(`<div class="btns">${b}</div>`);return}
    if(l.startsWith('- 버튼')){const b=l.replace(/^- 버튼:\s*/,'').split(/,\s*/).map(x=>`<span class="btn">${esc(x)}</span>`).join('');out.push(`<div class="btns">${b}</div>`);return}
    if(l.startsWith('(')){out.push(`<div class="note">${fmtInline(l)}</div>`);return}
    if(l.startsWith('→')){out.push(`<div class="arrow">${fmtInline(l)}</div>`);return}
    out.push(`<div class="ln" style="margin-left:44px">${fmtInline(l)}</div>`);
  });
  return `<div class="script">${out.join('')}</div>`;
}
function fmtInline(s){
  return human(esc(s)
   .replace(/상담원 인계\s*\((T\d(?:-[A-D])?)\)/g,(m,c)=>'<span class="pill ho">상담원 인계 · '+tn(c)+'</span>')
   .replace(/유형 (PA\d{6})(?:\s*\([^)]*\))?\s*(?:시나리오)?(?:의 [\d-]+(?:\([^)]*\))?)?(?:로|으로)? 전환/g,(m,c)=>'<span class="pill sw">「'+(NM[c]||c)+'」로 전환</span>')
   .replace(/상담 종료(?: \(유형: PA\d{6}\))?/g,'<span class="pill end">상담 종료</span>')
   .replace(/\[([^\]]+)\]/g,'<span class="btn">$1</span>'));
}
const hoBadges=s=>[...new Set((s||'').match(/\bT\d(?:-[A-D])?\b/g)||[])].filter(c=>TH[c]).sort((a,b)=>TH[a][1]-TH[b][1]).map(c=>`<span class="pill ho" title="시트 코드 ${c}">인계 · ${esc(TH[c][0])}</span>`).join('');

   ['T8','운영시간 경계','3','운영시간 밖, 종료 10분 전','회원은 게시판 안내(대화 첨부), 비회원은 운영시간 재문의 안내','해당 없음'],
   ['T6','조회 실패','4','조회 API 오류·지연, 샵 식별 불가 (API 확보 후 적용)','1회 재시도 후 인계','상담원 배정'],
   ['T3-A','실행 요청','5','취소·반품 접수, 클레임 변경, 배송상태 변경 등 Write가 필요한 요청','셀프 가능 여부 확인 → 필수 정보 수집(빠지면 2회까지 재요청) → 인계','양식 필수 항목 확인 → 배정'],
   ['T3-C','이관 대상','6','옵션명 수정, 정산 마이너스 취소, 리뷰 블라인드, 판매정지 소명, 대량취소 등','이관 양식 항목 수집 → 인계','양식 필수 항목 확인 → 배정'],
   ['T3-B','셀프 처리 실패·예외','7','셀프 경로 오류, 오늘의집이 고객에게 직접 연락해야 하는 건, KMS 밖 예외','셀프 경로 안내 → 안 되면 오류 문구·대상 번호 받아 인계','본문에 오류·예외가 있으면 배정'],
   ['T3-D','조회 필요','8','개별 주문·상품·정산 확인 (조회 API 없음, 월 약 1,400건)','일반 기준 안내 → 개별 확인 원하면 식별 정보 받아 인계','AI 답변 + 상담원 확인'],
   ['T7','복수 용건','9','처리 가능한 용건과 불가한 용건이 섞임','가능한 것 먼저 응대 → 나머지만 모아 인계','안내 가능한 부분은 답변에 담고 상담원 확인'],
   ['T2','반복·미해결','10','같은 의도 2회, 부정 표현 1회','[상담원 연결] 버튼만 노출, 눌러야 연결','48시간 재문의 규칙으로 대체'],
   ['T5','응답 불가','11','KMS 근거 없음, 유형 판단 불가, 신뢰도 미달','되묻기 1회 → 실패하면 인계','상담원 배정']];
  return `<h2>상담원 인계 기준</h2><p class="lead">시트 「3. 상담원 인계 기준」 탭을 우선순위 순서로 옮겼습니다. 시트에는 T1~T8 코드로 적혀 있고, 이 페이지는 사유 이름으로 표시합니다. 사유가 여러 개면 우선순위가 가장 높은 하나로 기록하고 나머지는 메모로 남깁니다.</p>
  <div class="tablewrap"><table><tr><th class="tnum">순위</th><th>인계 사유</th><th>조건</th><th>채팅 처리</th><th>게시판 처리</th><th>쓰는 유형</th></tr>
  ${rows.map(r=>{const used=T.filter(t=>(t.hocond+t.raw).includes(r[0])).length;return `<tr><td class="tnum">${r[2]}</td><td><span class="pill ho">${tn(r[0])}</span><div class="muted" style="font-size:11px;margin-top:4px">시트 코드 ${r[0]}</div></td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td class="tnum">${used}개</td></tr>`}).join('')}</table></div>
  <h3>억제 규칙</h3>
  <div class="grid2">
   <div class="card"><h4>억제 1</h4><p>KMS 답변으로 처리했으면 「상담원 연결 도와드릴까요?」를 덧붙이지 않습니다. 고객 챗봇에서 상담원 연결이 늘어난 원인이었습니다.</p></div>
   <div class="card"><h4>억제 2</h4><p>오로라에서 직접 처리할 수 있는 건은 셀프 경로를 먼저 안내하고, 안 될 때만 인계합니다. T1·T4는 예외입니다.</p></div>
   <div class="card"><h4>억제 3</h4><p>같은 상담에서 파트너가 인계 제안을 거절했으면 같은 사유로 다시 제안하지 않습니다.</p></div>
   <div class="card"><h4>인계 이후</h4><p>대기열 전환 후 챗봇은 응답을 멈춥니다. 대기 5분을 넘으면 [계속 기다리기] / [게시판에 남기기]를 보여 줍니다(회원만).</p></div>
  </div>`;
}

/* ---------- 유형 상세 ---------- */
function viewType(t){
  const m=MODE[t.mode]||['','',''];
  const b=t.board, ac=t.aicx_chat, ab=t.aicx_board;
  const segs=b?b.segs.map(s=>`<div class="seg"><div class="tags">${s.c.map(c=>`<span class="pill ${BC[c][0]}">${BC[c][1]}</span>`).join('')}</div><div>${human(esc(s.t))}</div></div>`).join(''):'';
  const nodesN=t.nodes.filter(n=>!n.sec).length, secN=t.nodes.filter(n=>n.sec).length;
  const chips=(arr)=>arr.map(x=>`<span class="pill${x==='비회원'?' bad':''}">${esc(x)}</span>`).join(' ');
  return `<div class="muted mono" style="font-family:var(--f-mono);font-size:12px">${esc(t.mid)} · ${t.code}${t.draft?' (추가안)':''}</div>
  <h2>${esc(t.name)}</h2>
  <div class="strip"><span class="pill ${m[2]}">${m[1]}</span>${t.vol?`<span class="pill tnum">월 인입 ${esc(t.vol)}건 (7~9월)</span>`:''}<span class="pill tnum">챗봇 발화 ${nodesN}개</span>${secN?`<span class="pill sec tnum">세부 상황 ${secN}개</span>`:''}${hoBadges(t.hocond+' '+t.raw)}</div>
  ${t.utter?`<div class="card" style="margin:14px 0"><h4>대표 발화</h4><p class="pre">${esc(t.utter)}</p></div>`:''}
  <h3>채팅 흐름도</h3>${LEGEND}${diagram('d-'+t.code,t.mmd)}
  <details><summary>채팅 대사 전체 (시트 4-1 원문)</summary><div class="body">${script(t.raw)}</div></details>
  <div class="grid2" style="margin-top:12px">
   <div class="card"><h4>상담원 인계 조건</h4><p class="pre">${human(esc(t.hocond))}</p></div>
   <div class="card"><h4>인계 시 전달 정보</h4><p class="pre">${human(esc(t.hoinfo))}</p></div>
  </div>
  <h3>게시판</h3>
  ${b?`<div class="card"><h4>판정 갈래</h4>${segs}</div>
  <div class="grid2" style="margin-top:12px">
   ${b.guide?`<div class="card"><h4>작성 안내문 (세부 유형 선택 시 채워짐)</h4><p class="pre">${human(esc(b.guide))}</p></div>`:''}
   ${b.info?`<div class="card"><h4>상담원에게 넘길 정보</h4><p class="pre">${human(esc(b.info))}</p></div>`:''}
  </div>
  ${b.auto?`<details><summary>자동답변 문구</summary><div class="body"><p class="pre">${human(esc(b.auto))}</p></div></details>`:''}
  ${b.ack?`<details><summary>상담원 배정 시 접수 확인 문구</summary><div class="body"><p class="pre">${human(esc(b.ack))}</p></div></details>`:''}`:'<p class="muted">게시판 시나리오 없음</p>'}
    ${t.check?`<h3>확인 필요 (시트)</h3><div class="card"><p class="pre">${human(esc(t.check))}</p></div>`:''}
  ${b&&b.check?`<details><summary>게시판 확인 필요</summary><div class="body"><p class="pre">${human(esc(b.check))}</p></div></details>`:''}`;
}

/* ---------- 라우팅 ---------- */
function route(){
  const h=(location.hash||'#chat-flow').slice(1);
  let html;
  if(h==='board-flow')html=viewBoard();else if(h==='handover')html=viewHandover();
  else{const t=T.find(x=>slug(x.code)===h);html=t?viewType(t):viewChat()}
  $('#view').innerHTML=html;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h||(h===''&&a.getAttribute('href')==='#chat-flow')));
  $('#pick').value=h||'chat-flow';
  const on=document.querySelector('nav a.on');if(on)on.scrollIntoView({block:'nearest'});
  window.scrollTo(0,0);
  drawAll();
}
buildNav();window.addEventListener('hashchange',route);route();
const mq=window.matchMedia('(prefers-color-scheme: dark)');mq.addEventListener&&mq.addEventListener('change',()=>{mmdReady=false;route()});
new MutationObserver(()=>{mmdReady=false;route()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
