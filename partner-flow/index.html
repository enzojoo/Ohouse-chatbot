3-C / 오로라 경로로 확인한 뒤에도 특정 정산건 수수료 금액 확인을 원하면 T3-D / 기타정산 상세 사유는 정산 담당자 메일 안내로 종결(재문의·미수긍 시 T2) / 상담원 직접 요청 T1", "hoinfo": "상품번호, 합의 수수료율, 합의 방식(담당 MD 협의/협의 요청서), 합의 시점, 문의 대상 구매확정일 또는 주문번호, 궁금한 수수료 항목. 현재 적용 수수료율과 정산 상세 금액은 상담원이 직접 확인합니다.", "kms": "055_정산.md, 078_파트너센터_교육자료_정산__수수료.md, 095_커머스_정책_이관_유형_및_이관_방법.md", "check": "1) 합의 수수료와 등록 수수료가 다를 때 이관처: 078은 담당 MD가 있으면 영업팀 2차 이관, Partners면 내부 일반대응 채널 공유라고 하고, 095는 MD 확인 요청 후 5영업일 경과 또는 GP면 정책 이관(수수료율)이라고 함. 078의 'Partners'가 GP를 뜻하는지도 확인 필요 2) 상품별 수수료 확인 경로: 055는 오로라 > 상품관리 > 상품 조회/수정, 078은 어드민 > 판매상품리스트(내부 경로)로 적혀 있음. 파트너 안내에는 오로라 경로를 씀 3) 078의 '수수료는 담당 카테고리 MD만 변경 가능' 문구를 파트너에게 그대로 안내해도 되는지 확인 4) (1차 전환) 2-4의 '기타정산 수수료' 정의 문구는 기존 2-4-1(조회 성공 분기)에 있던 KMS 문구를 경로 안내 쪽으로 옮긴 것 5) (1차 전환) R-08은 'AI 노출은 보안 판단 후'라, API가 생겨도 챗봇이 금액을 직접 안내할 수 있는지 별도 결정 필요", "api": "R-08", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 궁금한 항목: \n· (해당 시: 상품별 수수료율, 합의와 다름) 상품번호: \n· (해당 시: 특정 정산건) 구매확정일 또는 주문번호: \n· (해당 시: 합의와 다름) 합의한 수수료율, 합의 방식(담당 MD와 협의 / 수수료 협의 요청서 제출), 합의 시점: 첨부파일로 올려 주세요\n\n문의 내용: ", "mode": "조건별: 수수료 확인 경로·적용 순서·배송비 수수료·부가세·계산식·기타정산 문의처는 자동답변 종결 / 합의 수수료율과 다르게 적용된 건은 상담원 배정 / 협의·변경 요청은 PA012002로 바꿔 판정", "segs": [{"c": ["A"], "t": "수수료 확인 경로·적용 순서·배송비 수수료·부가세·계산식·기타정산 문의처는 자동답변 종결"}, {"c": ["C"], "t": "합의 수수료율과 다르게 적용된 건은 상담원 배정"}, {"c": ["SW"], "t": "협의·변경 요청은 PA012002로 바꿔 판정"}], "auto": "(공통 첫인사)\n\n[상품별 적용 수수료율]\n상품별로 적용되는 수수료는 오로라 > 상품관리 > 상품 조회/수정 탭에서 확인하실 수 있습니다. 수수료율은 상품 수수료 > 샵 수수료 > 카테고리 수수료 순으로 우선 적용되며, 파트너님께서 직접 상품 단위로 입력하거나 변경하실 수는 없습니다.\n\n[배송비·조립비 수수료와 부가세]\n오늘의집 상품 판매 시 책정된 수수료는 판매금액에서 공제되며, 수수료에는 부가세가 포함되어 있습니다. 선결제 배송비/조립비와 클레임 배송비에는 상품 수수료와 별도로 발생 건당 3.3%(VAT 포함)의 수수료가 부과됩니다. 자세한 내용은 [정책] 정산 가이드(https://www.partnerbucketplace.com/hc/ko/articles/26019195503641)에서 확인하실 수 있습니다.\n\n[특정 정산건의 수수료 금액]\n정산건별 수수료는 오로라 > 정산관리 > 정산내역 상세 탭에서 구매확정일로 검색하시면 확인하실 수 있습니다.\n최종 수수료는 상품 수수료 + 선결제 배송/조립비 수수료 + 클레임 배송비 수수료 + 기타정산 수수료 + 매출할인(오늘의집 부담 할인금액)으로 계산됩니다.\n- 상품 수수료: 정산 기준금액 X 상품별로 협의한 수수료율\n- 선결제 배송/조립비 수수료, 클레임 배송비 수수료: 해당 금액 X 3.3%(VAT 포함)\n- 기타정산 수수료: 시스템 오류 등으로 수수료에 가감이 필요한 금액\n오늘의집이 부담하는 각종 쿠폰, 포인트 등 할인금액은 최종 수수료에서 차감됩니다.\n기타정산은 정산내역 상세 탭 > 엑셀 다운로드 후 상품명에서 사유를 확인하실 수 있으며, 자세한 내용은 정산 담당자 메일(settlement@bucketplace.org)로 문의해 주세요.\n(궁금한 항목에 해당하는 단락만, 맺음 A)", "ack": "합의하신 수수료율과 실제 적용된 수수료율을 확인한 뒤 안내드리겠습니다. 확인에 시간이 소요될 수 있는 점 양해 부탁드립니다.", "info": "상품번호, 합의 수수료율, 합의 방식(담당 MD 협의 / 협의 요청서), 합의 시점, 문의 대상 구매확정일 또는 주문번호", "kms": "055_정산.md, 078_파트너센터_교육자료_정산__수수료.md, 095_커머스_정책_이관_유형_및_이관_방법.md", "check": "1) 합의 수수료와 등록 수수료가 다를 때 처리 부서 상충(078 담당 MD 있으면 영업팀 / 095 MD 확인 요청 후 5영업일 경과 시 정책)\n2) 상품별 수수료 확인 경로: 055 오로라 > 상품관리 > 상품 조회/수정 vs 078 내부 경로 — 파트너 안내는 055 기준\n3) 078 '수수료는 담당 카테고리 MD만 변경 가능' 문구를 파트너에게 안내해도 되는지"}}, {"code": "PA008002", "draft": false, "name": "세금계산서 / 부가세신고", "mid": "정산", "vol": "97", "mode": "AI 안내 종결", "utter": "세금계산서는 언제 발행되나요? 저희가 오늘의집에 발행해야 하나요?\n이번 달 세금계산서가 0원으로 왔는데 왜 그런 거예요?\n부가세 신고할 때 카드랑 현금 금액을 나눠서 봐야 하는데 어디서 확인하나요?", "raw": "1. 네, 파트너님. 세금계산서·부가세 신고 관련 문의 주셨네요. 어떤 내용이 궁금하신가요?\n[세금계산서 발행 시기·주체] / [세금계산서 금액 확인] / [세금계산서 0원 발행] / [수수료 금액과 세금계산서 금액이 다름] / [세금계산서 메일 미수신] / [주문이 있는데 세금계산서 미발행] / [부가세 신고 자료] / [거래명세서·사업자등록증·통장사본 요청]\n\n(발행 시기·주체 → 2-1 / 금액 확인 → 2-2 / 0원 → 2-3 / 금액 상이 → 2-4 / 메일 미수신 → 2-5 / 미발행 → 2-6 / 부가세 신고 → 2-7 / 서류 요청 → 2-8)\n\n2-1. 세금계산서는 오늘의집에서 상품 수수료 + 선결제 배송/조립비 수수료 + 클레임 배송비 수수료 + 기타정산 수수료 + 매출할인(오늘의집 부담 할인금액)에 대해 발행하며, 파트너님께서 오늘의집을 대상으로 발행하실 세금계산서는 없습니다.\n당월분에 대해 익월 1일 ~ 10일 중 발행되며, 오로라에 등록된 회계담당자 이메일로 발송됩니다. 발행 법인명은 [주식회사 버킷플레이스]로 확인하실 수 있습니다.\n→ 3\n\n2-2. 세금계산서 발행 금액은 오로라 > 정산관리 > 세금계산서 탭에서 매월 1일 이후 전월분을 확인하실 수 있습니다.\n발행 금액은 귀속월 내 구매확정 및 구매확정주문 취소건에 대한 판매대행 수수료(A) + 할인금액(B)입니다.\n- 판매대행 수수료(A): 상품 수수료 + 선결제 배송/조립비 수수료 + 클레임 배송비 수수료 + 기타정산 수수료\n- 할인금액(B): 고객이 결제 시 사용한 오늘의집 부담 할인금액\n→ 3\n\n2-3. 판매수수료보다 오늘의집 부담 할인금액이 더 커서 최종 수수료가 음수(-)로 계산되면, 파트너님께 0원의 세금계산서가 발행됩니다.\n이때 판매대행 수수료를 초과한 할인금액은 파트너님의 매출금액에 (+)로 합산되며, 오로라 > 정산관리 > 정산내역 상세 / 부가세신고 / 세금계산서 탭 > 엑셀 다운로드에서 '수수료 초과 할인' 항목으로 확인하실 수 있습니다.\n오늘의집 부담 할인금액은 매월 말일에 일괄 반영되며 파트너님의 정산금액에는 영향을 주지 않습니다.\n→ 3\n\n2-4. 세금계산서는 매월 1일 ~ 말일까지 구매확정 및 구매확정주문 취소건의 수수료 합계와 혜택정산 수수료, 기타정산 수수료에 대해 발행되며, 오늘의집 부담 할인금액이 있으면 그만큼 수수료에서 차감됩니다.\n오로라 > 정산관리 > 정산내역 탭에서 구매확정일을 1일 ~ 말일로 검색하신 뒤 비교해 주세요.\n[비교해도 차이를 모르겠어요] → 2-4-1 / [알겠어요] → 3\n2-4-1. 확인하실 귀속월과 차이가 나는 금액을 알려 주시겠어요?\n[귀속월, 금액 입력]\n해당 월 세금계산서 발행 금액 확인을 위해 담당 상담원에게 연결해 드릴게요.\n→ 상담원 인계 (T3-D)\n\n2-5. 세금계산서는 오로라에 등록된 회계담당자 이메일 주소로 발송됩니다.\n오로라 > 판매자 정보 > 담당자 정보 하단 회계담당자 정보의 이메일 주소가 올바르게 등록되어 있는지 확인해 주세요.\n→ 3\n\n2-6. 세금계산서는 매월 1일 ~ 말일까지 구매확정 및 구매확정주문 취소건을 기준으로 발행되므로, 아직 구매확정되지 않은 주문건은 발행 대상이 아닙니다. 오로라 > 정산관리 > 정산내역 상세 탭에서 주문번호로 구매확정 여부를 확인해 주세요.\n배송완료 후 고객이 직접 구매확정하지 않으면 주말과 공휴일을 포함해 8일째 되는 날 자동으로 구매확정됩니다. 구매확정된 주문건은 구매확정월 귀속분으로 익월 1일 ~ 10일 중 발행되는 세금계산서에 포함됩니다.\n[구매확정됐는데 세금계산서에 없어요] → 2-6-1 / [알겠어요] → 3\n2-6-1. 확인하실 주문번호를 알려 주시겠어요?\n[주문번호 입력]\n해당 주문건의 구매확정일 확인을 위해 담당 상담원에게 연결해 드릴게요.\n→ 상담원 인계 (T3-D)\n\n2-7. 부가세 신고는 파트너님께서 직접 진행하시며, 오로라 > 정산관리 > 부가세신고 탭에서 기간을 검색해 확인하실 수 있습니다. 해당 금액은 부가세가 포함된 금액이며 구매확정 기준입니다.\n- 오늘의집은 분기마다 파트너님의 구매확정 기준 매출내역을 국세청에 제출하고 있어, 파트너님께서도 구매확정 기준으로 신고하시길 권장드립니다.\n- 카드/현금 결제수단 구분 없이 총 합계 금액을 기타 건별 매출로 신고하시면 됩니다.\n- 기타 항목에는 휴대폰 결제, 수기정산 등 기타 결제수단 + 할인금액 + 수수료 초과 할인이 포함되어 있으며, 엑셀 다운로드 시 파일 하단에서 할인금액을 확인하실 수 있습니다.\n- 검색일 기준 최근 5년 이내 매출 내역만 조회하실 수 있습니다.\n결제일·배송완료일 기준 세부 내역이 필요하시면 오로라 > 정산관리 > 정산내역 상세 탭에서 확인하실 수 있습니다. 과세/면세 상품의 매출은 파트너님께서 직접 구분하셔야 하며, 신고 방법은 세무대리인께 문의해 주세요.\n(다른 사업자의 자료를 대신 요청하는 경우 → 2-7-1 / 그 외 → 3)\n2-7-1. 오늘의집에서는 다른 파트너사를 대신해 자료를 요청할 수 있는 법적 권한을 확인할 수 없어 대리 요청은 어려운 점 양해 부탁드립니다.\n폐업하시는 파트너사의 세무사께서 오늘의집에 공문으로 부가세 신고 자료를 요청해 주시면, 내부 확인 후 세무사께 직접 전달하는 방향으로 진행할 수 있습니다.\n→ 3\n\n2-8. 어떤 서류가 필요하신가요?\n[거래명세서] / [오늘의집 사업자등록증] / [오늘의집 통장사본]\n2-8-1. (거래명세서) 거래명세서는 주문한 전체 수량에 대해서만 발급할 수 있습니다. 발급할 주문번호와 필요하신 사유를 알려 주시겠어요?\n[주문번호, 사유 입력]\n→ 상담원 인계 (T3-C)\n2-8-2. (사업자등록증) 필요하신 사유를 알려 주시면 담당 상담원에게 전달해 드릴게요.\n[사유 입력]\n→ 상담원 인계 (T3-C)\n2-8-3. (통장사본) 통장사본은 필요하신 상세 사유와 함께 정산 담당자 메일(settlement@bucketplace.org)로 요청해 주시면, 사유 확인 후 전달드리고 있습니다.\n→ 3\n\n3. 더 궁금하신 점이 있으신가요?\n[아니요] → 상담 종료 (유형: PA008002)\n[네] → 1", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 세금계산서·부가세 신고 관련<br/>문의 주셨네요. 어떤 내용이 궁금하신가요?\"]:::bot\nN2_1[\"<b>2-1<\/b> 세금계산서는 오늘의집에서 상품 수수료 +<br/>선결제 배송/조립비 수수료 + 클레임 배송비<br/>수수료 + 기타정산 수수료 +<br/>매출할인(오늘의집 부담 할인금액)에 대해<br/>발행하며, 파트너님께서 오늘의집을 대상으로<br/>발행하실 세금계산서는 없습니다.\"]:::bot\nN2_2[\"<b>2-2<\/b> 세금계산서 발행 금액은 오로라 › 정산관리<br/>› 세금계산서 탭에서 매월 1일 이후<br/>전월분을 확인하실 수 있습니다.\"]:::bot\nN2_3[\"<b>2-3<\/b> 판매수수료보다 오늘의집 부담 할인금액이 더<br/>커서 최종 수수료가 음수(-)로 계산되면,<br/>파트너님께 0원의 세금계산서가 발행됩니다.\"]:::bot\nN2_4[\"<b>2-4<\/b> 세금계산서는 매월 1일 ~ 말일까지 구매확정<br/>및 구매확정주문 취소건의 수수료 합계와<br/>혜택정산 수수료, 기타정산 수수료에 대해<br/>발행되며, 오늘의집 부담 할인금액이 있으면<br/>그만큼 수수료에서 차감됩니다.\"]:::bot\nN2_4_1[\"<b>2-4-1<\/b> 확인하실 귀속월과 차이가 나는 금액을 알려<br/>주시겠어요?\"]:::bot\nN2_5[\"<b>2-5<\/b> 세금계산서는 오로라에 등록된 회계담당자<br/>이메일 주소로 발송됩니다.\"]:::bot\nN2_6[\"<b>2-6<\/b> 세금계산서는 매월 1일 ~ 말일까지 구매확정<br/>및 구매확정주문 취소건을 기준으로<br/>발행되므로, 아직 구매확정되지 않은 주문건은<br/>발행 대상이 아닙니다. 오로라 › 정산관리<br/>› 정산내역 상세 탭에서 주문번호로 구매확정<br/>여부를 확인해 주세요.\"]:::bot\nN2_6_1[\"<b>2-6-1<\/b> 확인하실 주문번호를 알려 주시겠어요?\"]:::bot\nN2_7[\"<b>2-7<\/b> 부가세 신고는 파트너님께서 직접 진행하시며,<br/>오로라 › 정산관리 › 부가세신고 탭에서<br/>기간을 검색해 확인하실 수 있습니다. 해당<br/>금액은 부가세가 포함된 금액이며 구매확정<br/>기준입니다.\"]:::bot\nN2_7_1[\"<b>2-7-1<\/b> 오늘의집에서는 다른 파트너사를 대신해 자료를<br/>요청할 수 있는 법적 권한을 확인할 수 없어<br/>대리 요청은 어려운 점 양해 부탁드립니다.\"]:::bot\nN2_8[\"<b>2-8<\/b> 어떤 서류가 필요하신가요?\"]:::bot\nN2_8_1[\"<b>2-8-1<\/b> (거래명세서) 거래명세서는 주문한 전체<br/>수량에 대해서만 발급할 수 있습니다. 발급할<br/>주문번호와 필요하신 사유를 알려 주시겠어요?\"]:::bot\nN2_8_2[\"<b>2-8-2<\/b> (사업자등록증) 필요하신 사유를 알려 주시면<br/>담당 상담원에게 전달해 드릴게요.\"]:::bot\nN2_8_3[\"<b>2-8-3<\/b> (통장사본) 통장사본은 필요하신 상세 사유와<br/>함께 정산 담당자<br/>메일(settlement@bucketplace.org)로<br/>요청해 주시면, 사유 확인 후 전달드리고<br/>있습니다.\"]:::bot\nN3[\"<b>3<\/b> 더 궁금하신 점이 있으신가요?\"]:::bot\nS --> N1\nN1 -->|\"발행 시기·주체\"| N2_1\nN1 -->|\"금액 확인\"| N2_2\nN1 -->|\"0원\"| N2_3\nN1 -->|\"금액 상이\"| N2_4\nN1 -->|\"메일 미수신\"| N2_5\nN1 -->|\"미발행\"| N2_6\nN1 -->|\"부가세 신고\"| N2_7\nN1 -->|\"서류 요청\"| N2_8\nN1 -->|\"세금계산서 발행 시기·주체 / 세금계산서<br/>금액 확인 / 세금계산서 0원 발행 /<br/>수수료 금액과 세금계산서 금액이 다름 /<br/>세금계산서 메일 미수신 / 주문이 있는데<br/>세금계산서 미발행 / 부가세 신고 자료 /<br/>거래명세서·사업자등록증·통장사본 요청\"| N2_1\nN2_1 --> N3\nN2_2 --> N3\nN2_3 --> N3\nN2_4 -->|\"비교해도 차이를 모르겠어요\"| N2_4_1\nN2_4 -->|\"알겠어요\"| N3\nN2_4_1 --> HO_T3D\nN2_4_1 -->|\"귀속월, 금액 입력\"| N2_5\nN2_5 --> N3\nN2_6 -->|\"구매확정됐는데 세금계산서에 없어요\"| N2_6_1\nN2_6 -->|\"알겠어요\"| N3\nN2_6_1 --> HO_T3D\nN2_6_1 -->|\"주문번호 입력\"| N2_7\nN2_7 -->|\"다른 사업자의 자료를 대신 요청하는 경우\"| N2_7_1\nN2_7 -->|\"그 외\"| N3\nN2_7_1 --> N3\nN2_8_1 --> HO_T3C\nN2_8_1 -->|\"주문번호, 사유 입력\"| N2_8_2\nN2_8_2 --> HO_T3C\nN2_8_2 -->|\"사유 입력\"| N2_8_3\nN2_8_3 --> N3\nN3 -->|\"아니요\"| END\nN3 -->|\"네\"| N1\nN2_8 --> N2_8_1\nHO_T3D([\"상담원 인계<br/>개별 조회 필요\"]):::ho\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nEND([\"상담 종료\"]):::fin", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 세금계산서·부가세 신고 관련 문의 주셨네요. 어떤 내용이 궁금하신가요?", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "세금계산서는 오늘의집에서 상품 수수료 + 선결제 배송/조립비 수수료 + 클레임 배송비 수수료 + 기타정산 수수료 + 매출할인(오늘의집 부담 할인금액)에 대해 발행하며, 파트너님께서 오늘의집을 대상으로 발행하실 세금계산서는 없습니다.", "sec": false, "body": ["당월분에 대해 익월 1일 ~ 10일 중 발행되며, 오로라에 등록된 회계담당자 이메일로 발송됩니다. 발행 법인명은 [주식회사 버킷플레이스]로 확인하실 수 있습니다."]}, {"k": "2-2", "id": "2-2", "t": "세금계산서 발행 금액은 오로라 > 정산관리 > 세금계산서 탭에서 매월 1일 이후 전월분을 확인하실 수 있습니다.", "sec": false, "body": ["발행 금액은 귀속월 내 구매확정 및 구매확정주문 취소건에 대한 판매대행 수수료(A) + 할인금액(B)입니다.", "- 판매대행 수수료(A): 상품 수수료 + 선결제 배송/조립비 수수료 + 클레임 배송비 수수료 + 기타정산 수수료", "- 할인금액(B): 고객이 결제 시 사용한 오늘의집 부담 할인금액"]}, {"k": "2-3", "id": "2-3", "t": "판매수수료보다 오늘의집 부담 할인금액이 더 커서 최종 수수료가 음수(-)로 계산되면, 파트너님께 0원의 세금계산서가 발행됩니다.", "sec": false, "body": ["이때 판매대행 수수료를 초과한 할인금액은 파트너님의 매출금액에 (+)로 합산되며, 오로라 > 정산관리 > 정산내역 상세 / 부가세신고 / 세금계산서 탭 > 엑셀 다운로드에서 '수수료 초과 할인' 항목으로 확인하실 수 있습니다.", "오늘의집 부담 할인금액은 매월 말일에 일괄 반영되며 파트너님의 정산금액에는 영향을 주지 않습니다."]}, {"k": "2-4", "id": "2-4", "t": "세금계산서는 매월 1일 ~ 말일까지 구매확정 및 구매확정주문 취소건의 수수료 합계와 혜택정산 수수료, 기타정산 수수료에 대해 발행되며, 오늘의집 부담 할인금액이 있으면 그만큼 수수료에서 차감됩니다.", "sec": false, "body": ["오로라 > 정산관리 > 정산내역 탭에서 구매확정일을 1일 ~ 말일로 검색하신 뒤 비교해 주세요."]}, {"k": "2-4-1", "id": "2-4-1", "t": "확인하실 귀속월과 차이가 나는 금액을 알려 주시겠어요?", "sec": false, "body": ["해당 월 세금계산서 발행 금액 확인을 위해 담당 상담원에게 연결해 드릴게요."]}, {"k": "2-5", "id": "2-5", "t": "세금계산서는 오로라에 등록된 회계담당자 이메일 주소로 발송됩니다.", "sec": false, "body": ["오로라 > 판매자 정보 > 담당자 정보 하단 회계담당자 정보의 이메일 주소가 올바르게 등록되어 있는지 확인해 주세요."]}, {"k": "2-6", "id": "2-6", "t": "세금계산서는 매월 1일 ~ 말일까지 구매확정 및 구매확정주문 취소건을 기준으로 발행되므로, 아직 구매확정되지 않은 주문건은 발행 대상이 아닙니다. 오로라 > 정산관리 > 정산내역 상세 탭에서 주문번호로 구매확정 여부를 확인해 주세요.", "sec": false, "body": ["배송완료 후 고객이 직접 구매확정하지 않으면 주말과 공휴일을 포함해 8일째 되는 날 자동으로 구매확정됩니다. 구매확정된 주문건은 구매확정월 귀속분으로 익월 1일 ~ 10일 중 발행되는 세금계산서에 포함됩니다."]}, {"k": "2-6-1", "id": "2-6-1", "t": "확인하실 주문번호를 알려 주시겠어요?", "sec": false, "body": ["해당 주문건의 구매확정일 확인을 위해 담당 상담원에게 연결해 드릴게요."]}, {"k": "2-7", "id": "2-7", "t": "부가세 신고는 파트너님께서 직접 진행하시며, 오로라 > 정산관리 > 부가세신고 탭에서 기간을 검색해 확인하실 수 있습니다. 해당 금액은 부가세가 포함된 금액이며 구매확정 기준입니다.", "sec": false, "body": ["- 오늘의집은 분기마다 파트너님의 구매확정 기준 매출내역을 국세청에 제출하고 있어, 파트너님께서도 구매확정 기준으로 신고하시길 권장드립니다.", "- 카드/현금 결제수단 구분 없이 총 합계 금액을 기타 건별 매출로 신고하시면 됩니다.", "- 기타 항목에는 휴대폰 결제, 수기정산 등 기타 결제수단 + 할인금액 + 수수료 초과 할인이 포함되어 있으며, 엑셀 다운로드 시 파일 하단에서 할인금액을 확인하실 수 있습니다.", "- 검색일 기준 최근 5년 이내 매출 내역만 조회하실 수 있습니다.", "결제일·배송완료일 기준 세부 내역이 필요하시면 오로라 > 정산관리 > 정산내역 상세 탭에서 확인하실 수 있습니다. 과세/면세 상품의 매출은 파트너님께서 직접 구분하셔야 하며, 신고 방법은 세무대리인께 문의해 주세요."]}, {"k": "2-7-1", "id": "2-7-1", "t": "오늘의집에서는 다른 파트너사를 대신해 자료를 요청할 수 있는 법적 권한을 확인할 수 없어 대리 요청은 어려운 점 양해 부탁드립니다.", "sec": false, "body": ["폐업하시는 파트너사의 세무사께서 오늘의집에 공문으로 부가세 신고 자료를 요청해 주시면, 내부 확인 후 세무사께 직접 전달하는 방향으로 진행할 수 있습니다."]}, {"k": "2-8", "id": "2-8", "t": "어떤 서류가 필요하신가요?", "sec": false, "body": []}, {"k": "2-8-1", "id": "2-8-1", "t": "(거래명세서) 거래명세서는 주문한 전체 수량에 대해서만 발급할 수 있습니다. 발급할 주문번호와 필요하신 사유를 알려 주시겠어요?", "sec": false, "body": []}, {"k": "2-8-2", "id": "2-8-2", "t": "(사업자등록증) 필요하신 사유를 알려 주시면 담당 상담원에게 전달해 드릴게요.", "sec": false, "body": []}, {"k": "2-8-3", "id": "2-8-3", "t": "(통장사본) 통장사본은 필요하신 상세 사유와 함께 정산 담당자 메일(settlement@bucketplace.org)로 요청해 주시면, 사유 확인 후 전달드리고 있습니다.", "sec": false, "body": []}, {"k": "3", "id": "3", "t": "더 궁금하신 점이 있으신가요?", "sec": false, "body": []}], "hocond": "거래명세서 발급 요청 T3-C / 오늘의집 사업자등록증 요청 T3-C / 오로라 경로로 비교한 뒤에도 세금계산서 금액 차이를 모르겠다는 요청·구매확정 후 세금계산서 미포함 주문 확인 T3-D / 그 외 세금계산서·부가세 안내는 KMS로 종결 / 상담원 직접 요청 T1", "hoinfo": "요청 서류 종류(거래명세서/사업자등록증), 거래명세서 대상 주문번호, 요청 사유, 금액 차이 문의 귀속월과 파트너가 본 금액, 미발행 문의 주문번호. 주문 구매확정일과 월별 세금계산서 발행 금액은 상담원이 직접 확인합니다.", "kms": "055_정산.md, 078_파트너센터_교육자료_정산__수수료.md, 092_관리자_이관_유형_및_방법.md, 096_심층문의_이관_유형_및_이관_방법.md", "check": "1) 결제일·배송완료일 기준 내역 경로: 078은 '매출현황 메뉴'로, 055는 (구)매출현황이 2025.12.16 중단되어 정산내역 상세에서 확인한다고 함. 시나리오는 055(정산내역 상세) 기준으로 씀 2) 세금계산서 발행 대상: 055 FAQ는 '수수료 합계와 혜택정산 수수료, 기타정산 수수료', 055 본문·정책은 '수수료 합계와 기타정산 수수료'로 혜택정산 수수료 포함 여부가 다름 3) 세금계산서 미발행 확인 시 KMS는 어드민 주문상태 변경이력을 보라고 함, 챗봇은 주문 상태 조회 API가 필요 4) 오늘의집 사업자등록증 요청은 092 관리자 이관 유형에만 있고 파트너 안내 문구가 없음 5) (1차 전환) 2-6은 구매확정 여부를 파트너가 정산내역 상세에서 직접 확인하도록 안내하고, 구매확정 후에도 미포함이면 T3-D로 인계 6) (1차 전환) 게시판 2차 후보의 '오늘의집 사업자등록증(국문·영문) 파일 첨부 자동답변'은 조회 API가 아니라 파일 첨부 기능 문제라 api_cases에 넣지 않음. 채팅에서도 파일 첨부로 종결할지 결정 필요", "api": "R-08, R-02", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 궁금한 항목: \n· (해당 시: 금액 확인·금액 다름) 귀속월: \n· (해당 시: 미발행·거래명세서) 주문번호: \n· (해당 시: 미발행) 구매확정 여부 (구매확정됨 / 구매확정 전 / 모름): \n· (해당 시: 거래명세서·사업자등록증·통장사본) 필요 사유: \n· (해당 시: 사업자등록증) 사업자등록증 국문/영문: \n\n문의 내용: ", "mode": "조건별: 발행 시기·금액·0원·차이·메일 미수신·미발행 기준·부가세 신고·통장사본 요청 방법·대리 요청 불가는 자동답변 종결 / 거래명세서 발급·오늘의집 사업자등록증 요청은 상담원 배정", "segs": [{"c": ["A"], "t": "발행 시기·금액·0원·차이·메일 미수신·미발행 기준·부가세 신고·통장사본 요청 방법·대리 요청 불가는 자동답변 종결"}, {"c": ["C"], "t": "거래명세서 발급·오늘의집 사업자등록증 요청은 상담원 배정"}], "auto": "(공통 첫인사)\n\n[발행 시기·주체]\n세금계산서는 오늘의집에서 상품 수수료 + 선결제 배송/조립비 수수료 + 클레임 배송비 수수료 + 기타정산 수수료 + 매출할인(오늘의집 부담 할인금액)에 대해 발행하며, 파트너님께서 오늘의집을 대상으로 발행하실 세금계산서는 없습니다. 당월분에 대해 익월 1일 ~ 10일 중 발행되며, 오로라에 등록된 회계담당자 이메일로 발송됩니다. 발행 법인명은 [주식회사 버킷플레이스]입니다.\n\n[발행 금액 확인·수수료 금액과 다른 경우]\n세금계산서 발행 금액은 오로라 > 정산관리 > 세금계산서 탭에서 매월 1일 이후 전월분을 확인하실 수 있습니다. 발행 금액은 귀속월 내 구매확정 및 구매확정주문 취소건에 대한 판매대행 수수료(A) + 할인금액(B)입니다.\n- 판매대행 수수료(A): 상품 수수료 + 선결제 배송/조립비 수수료 + 클레임 배송비 수수료 + 기타정산 수수료\n- 할인금액(B): 고객이 결제 시 사용한 오늘의집 부담 할인금액\n금액을 비교하실 때는 오로라 > 정산관리 > 정산내역 탭에서 구매확정일을 1일 ~ 말일로 검색해 주세요. 혜택정산 금액은 할인금액(B)에 포함됩니다.\n\n[0원으로 발행된 경우]\n판매수수료보다 오늘의집 부담 할인금액이 더 커서 최종 수수료가 음수(-)로 계산되면 0원의 세금계산서가 발행됩니다. 이때 판매대행 수수료를 초과한 할인금액은 파트너님의 매출금액에 (+)로 합산되며, 오로라 > 정산관리 > 정산내역 상세 / 부가세신고 / 세금계산서 탭 > 엑셀 다운로드에서 '수수료 초과 할인' 항목으로 확인하실 수 있습니다. 오늘의집 부담 할인금액은 매월 말일에 일괄 반영되며 파트너님의 정산금액에는 영향을 주지 않습니다.\n\n[세금계산서 메일을 받지 못한 경우]\n세금계산서는 오로라에 등록된 회계담당자 이메일 주소로 발송됩니다. 오로라 > 판매자 정보 > 담당자 정보 하단 회계담당자 정보의 이메일 주소가 올바르게 등록되어 있는지 확인해 주세요.\n\n[주문이 있는데 세금계산서에 포함되지 않은 경우]\n세금계산서는 매월 1일 ~ 말일까지 구매확정 및 구매확정주문 취소건을 기준으로 발행되므로, 아직 구매확정되지 않은 주문은 발행 대상이 아닙니다. 구매확정된 주문은 구매확정일이 속한 달 귀속분으로 익월 1일 ~ 10일 중 발행되는 세금계산서에 포함됩니다. 구매확정 여부는 오로라 > 정산관리 > 정산내역 상세 탭에서 주문번호로 확인하실 수 있습니다.\n\n[부가세 신고 자료]\n부가세 신고는 파트너님께서 직접 진행하시며, 오로라 > 정산관리 > 부가세신고 탭에서 기간을 검색해 확인하실 수 있습니다. 해당 금액은 부가세가 포함된 금액이며 구매확정 기준입니다.\n- 오늘의집은 분기마다 파트너님의 구매확정 기준 매출내역을 국세청에 제출하고 있어, 파트너님께서도 구매확정 기준으로 신고하시길 권장드립니다.\n- 카드/현금 결제수단 구분 없이 총 합계 금액을 기타 건별 매출로 신고하시면 됩니다.\n- 기타 항목에는 휴대폰 결제, 수기정산 등 기타 결제수단 + 할인금액 + 수수료 초과 할인이 포함되어 있으며, 엑셀 다운로드 시 파일 하단에서 할인금액을 확인하실 수 있습니다.\n- 검색일 기준 최근 5년 이내 매출 내역만 조회하실 수 있습니다.\n결제일·배송완료일 기준 세부 내역은 오로라 > 정산관리 > 정산내역 상세 탭에서 확인하실 수 있습니다. 과세/면세 상품의 매출은 파트너님께서 직접 구분하셔야 하며, 신고 방법은 세무대리인께 문의해 주세요.\n\n[다른 사업자의 자료를 대신 요청하시는 경우]\n오늘의집에서는 다른 파트너사를 대신해 자료를 요청할 수 있는 법적 권한을 확인할 수 없어 대리 요청은 어려운 점 양해 부탁드립니다. 폐업하시는 파트너사의 세무사께서 오늘의집에 공문으로 부가세 신고 자료를 요청해 주시면, 내부 확인 후 세무사께 직접 전달하는 방향으로 진행할 수 있습니다.\n\n[오늘의집 통장사본이 필요한 경우]\n통장사본은 필요하신 상세 사유와 함께 정산 담당자 메일(settlement@bucketplace.org)로 요청해 주시면, 사유 확인 후 전달드리고 있습니다.\n(궁금한 항목에 해당하는 단락만, 맺음 A)", "ack": "요청하신 서류를 확인해 전달드리겠습니다.\n(거래명세서: \"거래명세서는 주문한 전체 수량에 대해서만 발급할 수 있는 점 참고 부탁드립니다.\")", "info": "요청 서류 종류(거래명세서 / 사업자등록증 국문·영문), 거래명세서 대상 주문번호, 요청 사유", "kms": "055_정산.md, 078_파트너센터_교육자료_정산__수수료.md, 092_관리자_이관_유형_및_방법.md, 096_심층문의_이관_유형_및_이관_방법.md, 086_상담_양식___첨부_파일__.md", "check": "1) 결제일·배송완료일 기준 내역 경로: 078 '매출현황 메뉴' vs 055 '(구)매출현황 2025.12.16 중단, 정산내역 상세' — 055 기준으로 씀\n2) 세금계산서 발행 대상에 혜택정산 수수료 포함 여부 055 안에서 상충\n3) 오늘의집 사업자등록증 요청은 092 관리자 처리 유형으로만 있음 — AI 파일 첨부로 바꿔도 되는지"}}, {"code": "PA008003", "draft": false, "name": "정산/매출 현황", "mid": "정산", "vol": "73", "mode": "안내 후 조건부 상담원 연결", "utter": "정산금이 오늘 들어와야 하는데 아직 안 들어왔어요\n이번 달 결제된 주문이 정산 금액에 빠져 있어요\n정산내역에 지급이월_보류라고 떠 있는데 왜 그런 거예요?", "raw": "1. 네, 파트너님. 정산 관련 문의 주셨네요. 어떤 내용이 궁금하신가요?\n[정산 지급 일정] / [정산 예정 금액] / [정산금 미입금·지급 보류] / [정산 금액이 예상과 다름] / [해외사업자 정산] / [매출 현황·과거 정산내역] / [출처를 모르는 입금 내역]\n\n(지급 일정 → 2-1 / 예정 금액 → 2-2 / 미입금·보류 → 2-3 / 금액 다름 → 2-4 / 해외사업자 → 2-5 / 매출·과거 내역 → 2-6 / 출처 불명 입금 → 2-7)\n\n2-1. 오늘의집은 일정산으로 진행되며, 구매확정일로부터 +2영업일에 정산금이 지급됩니다.\n- 지급 시간: 영업일 16시 ~ 18시 사이 (은행별 입금 처리 시간은 다를 수 있습니다)\n- 지급일이 주말·공휴일이면 다음 영업일에 지급되며, 여러 구매확정일분이 합산되어 1회 지급될 수 있습니다.\n- 반품/교환 클레임 배송비는 클레임 완료일 +2영업일 정산에 포함됩니다.\n- 구매확정은 배송완료 후 고객이 직접 하거나, 하지 않으면 주말과 공휴일을 포함해 8일째 되는 날 자동으로 처리됩니다.\n이번 달 상세 지급 일정은 오로라 공지사항의 '[정산] 해당 월 일정산 일정 안내'에서 확인하실 수 있습니다.\n(특정 주문건의 지급일을 물으면 → 2-1-1 / 그 외 → 3)\n2-1-1. 특정 주문건의 지급 예정일은 오로라 > 정산관리 > 정산내역 상세 탭에서 주문번호로 검색하시면 확인하실 수 있습니다.\n[확인이 안 돼요] → 2-1-2 / [알겠어요] → 3\n2-1-2. 확인하실 주문번호를 알려 주시겠어요?\n[주문번호 입력]\n지급 예정일 확인을 위해 담당 상담원에게 연결해 드릴게요.\n→ 상담원 인계 (T3-D)\n\n2-2. 확인하실 기준을 알려 주세요.\n[구매확정된 주문] / [아직 구매확정 전인 주문]\n2-2-1. (구매확정된 주문) 오로라 > 정산관리 > 정산내역 상세 탭에서 구매확정일로 검색하시면 확인하실 수 있습니다. 구매확정일 다음날부터 확인 가능하며, 아직 지급되지 않은 구매확정일의 정산금액은 변동될 수 있습니다.\n→ 3\n2-2-2. (구매확정 전 주문) 오로라 > 정산관리 > 정산내역 상세 탭에서 '결제일' 기준으로 검색 > 엑셀 다운로드 후 G열 정산 예정금액을 확인해 주세요. 확인 시점에 따라 반품 등의 사유로 금액이 달라질 수 있어 참고용으로만 봐 주세요.\n→ 3\n\n2-3. 정산 지급 상태는 오로라 > 정산관리 > 정산내역에서 구매확정일별 '상태' 항목으로 확인하실 수 있습니다.\n- 지급확정: 지급 금액이 확정된 상태\n- 지급완료: 지급일에 최종 지급 완료된 상태\n- 지급이월_마이너스정산: 최종 정산금액이 마이너스인 상태\n- 지급이월_보류 / 지급이월_실패: 계좌 오류, 사업자 이슈 등으로 지급이 보류된 상태\n확인하신 상태를 선택해 주세요.\n[지급확정] → 2-3-1 / [지급완료] → 2-3-2 / [지급이월_마이너스정산] → 2-3-3 / [지급이월_보류·지급이월_실패] → 2-3-4 / [상태 확인이 어려워요] → 2-3-5\n2-3-1. 지급확정 상태라면 영업일 16시 ~ 18시 사이에 지급됩니다. 은행별 처리 시간이 다를 수 있어 익일 오전까지 확인해 보시고, 그때도 입금되지 않았다면 다시 문의 부탁드립니다.\n→ 3\n2-3-2. 지급완료 상태라면 정산대금은 '오늘의집정산'으로 표기되어 입금되니 통장 내역을 확인해 주세요.\n→ 3\n2-3-3. 지급이월_마이너스정산은 구매확정주문 취소 또는 혜택정산, 기타정산 등의 사유로 최종 정산금액이 마이너스여서 이월된 상태입니다. 정산조정 항목에는 마이너스 정산 상계, 지급이월 금액 합산 등이 반영되며, 오로라 > 정산관리 > 정산내역의 정산조정 금액을 클릭하시면 사유를 확인하실 수 있습니다.\n→ 3\n2-3-4. 지급이월_보류·지급이월_실패는 계좌 오류, 사업자 이슈 등으로 지급이 보류된 상태이며, 보류 시 셀러샵 대표 계정과 회계담당자 휴대폰 번호로 알림톡이 안내됩니다.\n먼저 오로라 > 판매자정보 > 판매자정보에서 정산 계좌 정보가 맞는지 확인해 주세요.\n- 계좌 정보가 틀렸다면 오로라 > 판매자 정보 > 판매자 정보 수정에서 직접 수정하실 수 있습니다. (정보변경 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29543329706521)\n- 정산팀에서 계좌변경 관련 메일을 받고 변경하신 경우라면 받으신 메일로 회신해 주세요.\n- 계좌 정보에 이상이 없다면 정산 담당자 메일(settlement@bucketplace.org)로 지급보류 해제 요청을 문의해 주세요. 파트너센터에서는 정확한 보류 사유 확인이 어려운 점 양해 부탁드립니다.\n(양도양수 진행 중이라고 하면 → 2-3-6 / 그 외 → 3)\n2-3-5. 확인하실 구매확정일을 알려 주시겠어요?\n[구매확정일 입력]\n지급 상태 확인을 위해 담당 상담원에게 연결해 드릴게요.\n→ 상담원 인계 (T3-D)\n2-3-6. 양도양수 진행 시 서류 미비 등으로 진행이 어려우면 정산 지급도 보류될 수 있습니다.\n기존 양도인 계좌로 정산 입금을 원하시면 안내받으신 메일을 통해 양도양수 해지통지서를 작성해 제출해 주세요. 이후 양도양수를 다시 진행하시려면 서류를 보완해 재진행해 주시면 됩니다.\n(보류 안내 메일을 받지 못했다고 하면 → 2-3-7 / 그 외 → 3)\n2-3-7. 보류 사유 확인을 위해 담당 상담원에게 연결해 드릴게요.\n→ 상담원 인계 (T3-C)\n\n2-4. 정산금액은 정산 기준금액 + 선결제 배송/조립비 + 클레임 배송비 - 상품 수수료 - 선결제 배송/조립비 수수료 - 클레임 배송비 수수료 + 혜택정산 + 기타정산으로 계산됩니다.\n오로라 > 정산관리 > 정산내역 상세 탭에서 구매확정일로 검색하시면 주문정산 / 혜택정산 / 기타정산 내역을 각 탭에서 확인하실 수 있으며, 엑셀 다운로드 시 하나의 파일로 받으실 수 있습니다. 할인 내역은 혜택정산 > 혜택 상세 엑셀 다운로드에서 확인하실 수 있습니다.\n혜택정산은 파트너님 부담 쿠폰 등 할인금액이 차감된 금액이며, 정산조정은 마이너스 정산 상계, 정산차감형 광고매출, 지급이월 금액 합산 등이 반영된 금액입니다. 정산조정 사유는 오로라 > 정산관리 > 정산내역에서 정산조정 금액을 클릭하시면 확인하실 수 있습니다.\n[결제월과 정산월이 달라 빠진 것 같아요] → 2-4-3 / [기타정산 사유가 궁금해요] → 2-4-4 / [특정 정산건 금액을 확인받고 싶어요] → 2-4-1 / [알겠어요] → 3\n2-4-1. 확인하실 구매확정일 또는 주문번호와 예상하신 금액을 알려 주시겠어요?\n[구매확정일 또는 주문번호, 예상 금액 입력]\n정산 내역 확인을 위해 담당 상담원에게 연결해 드릴게요.\n→ 상담원 인계 (T3-D)\n2-4-3. 정산은 구매확정이 완료된 주문건을 대상으로 하므로 결제월과 정산월은 다를 수 있습니다. 구매확정주문 취소건은 환불 승인 일자 기준으로 정산에 반영됩니다. 오로라 > 정산관리 > 정산내역 상세 탭에서 주문번호로 검색하시면 지급 예정일을 확인하실 수 있습니다.\n→ 3\n2-4-4. 기타정산은 기타 사유로 정산금액에 가감되는 금액입니다. 오로라 > 정산관리 > 정산내역 상세 탭 > 엑셀 다운로드 후 상품명에서 확인하실 수 있으며, 자세한 내용은 정산 담당자 메일(settlement@bucketplace.org)로 문의해 주세요.\n→ 3\n\n2-5. 해외사업자는 구매확정일 기준으로 매월 2회 정산대금이 지급되며, 지급일이 주말·공휴일이면 다음 영업일에 지급됩니다.\n- 1차: 전월 15일 ~ 말일 구매확정건 → 5일 지급\n- 2차: 당월 1일 ~ 14일 구매확정건 → 20일 지급\n- 지급 통화는 USD/유로/엔화 중 선택하실 수 있으며, 정산대금 확정일의 서울외국환중개 매매기준율이 적용됩니다.\n- 정산금액이 원화 기준 10만원 미만이면 다음 차수 정산금액과 합산해 지급됩니다.\n- 지급을 위해 인보이스를 반드시 제출해 주셔야 하며, 지급일 전일 15시까지 보내 주셔야 해당 차수 지급일에 지급됩니다. 제출이 늦어지면 제출일이 속한 차수의 지급일에 지급됩니다.\n- 인보이스에는 발행인, 품목명, 정산금액, 날인이 모두 기재되어 있어야 합니다.\n→ 3\n\n2-6. 어떤 내역이 필요하신가요?\n[최종 매출금액] / [2022년 6월 이전 정산내역] / [퇴점 후 판매내역]\n2-6-1. (최종 매출금액) 오로라 > 정산관리 > 부가세신고 탭에서 기간을 검색하신 뒤 합계 금액으로 확인하시면 됩니다. (구)매출현황 메뉴는 2025년 12월 16일부터 이용이 중단되었으며, 구매확정일·결제일·배송완료일 기준 세부 내역은 정산내역 상세 메뉴에서 2022년 6월 이후분을 확인하실 수 있습니다.\n→ 3\n2-6-2. (2022년 6월 이전) 해당 기간 정산내역은 파트너센터에서 바로 안내드리기 어려워 담당부서에 요청해 드릴게요. 필요하신 정산내역 기간과 사유를 알려 주시겠어요?\n[기간, 사유 입력]\n→ 상담원 인계 (T3-C)\n2-6-3. (퇴점 후 판매내역) 판매 내역에는 고객 개인정보가 포함되어 있어 전달드리기 어려운 점 양해 부탁드립니다. 정산 내역으로 대체해 전달드릴 수 있는데, 정산 내역으로 요청하시겠어요?\n[네] → 필요하신 기간과 사유를 알려 주시겠어요? [기간, 사유 입력] → 상담원 인계 (T3-C)\n[아니요] → 3\n\n2-7. 주식회사 버킷플레이스 이름으로 입금된 내역은 번거로우시겠지만 정산 담당자 메일(settlement@bucketplace.org)로 문의 부탁드립니다. 참고로 정산대금은 '오늘의집정산'으로 표기되어 입금됩니다.\n→ 3\n\n3. 더 궁금하신 점이 있으신가요?\n[아니요] → 상담 종료 (유형: PA008003)\n[네] → 1", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 정산 관련 문의 주셨네요.<br/>어떤 내용이 궁금하신가요?\"]:::bot\nN2_1[\"<b>2-1<\/b> 오늘의집은 일정산으로 진행되며,<br/>구매확정일로부터 +2영업일에 정산금이<br/>지급됩니다.\"]:::bot\nN2_1_1[\"<b>2-1-1<\/b> 특정 주문건의 지급 예정일은 오로라 ›<br/>정산관리 › 정산내역 상세 탭에서 주문번호로<br/>검색하시면 확인하실 수 있습니다.\"]:::bot\nN2_1_2[\"<b>2-1-2<\/b> 확인하실 주문번호를 알려 주시겠어요?\"]:::bot\nN2_2[\"<b>2-2<\/b> 확인하실 기준을 알려 주세요.\"]:::bot\nN2_2_1[\"<b>2-2-1<\/b> (구매확정된 주문) 오로라 › 정산관리 ›<br/>정산내역 상세 탭에서 구매확정일로 검색하시면<br/>확인하실 수 있습니다. 구매확정일 다음날부터<br/>확인 가능하며, 아직 지급되지 않은<br/>구매확정일의 정산금액은 변동될 수 있습니다.\"]:::bot\nN2_2_2[\"<b>2-2-2<\/b> (구매확정 전 주문) 오로라 › 정산관리 ›<br/>정산내역 상세 탭에서 '결제일' 기준으로<br/>검색 › 엑셀 다운로드 후 G열 정산<br/>예정금액을 확인해 주세요. 확인 시점에 따라<br/>반품 등의 사유로 금액이 달라질 수 있어<br/>참고용으로만 봐 주세요.\"]:::bot\nN2_3[\"<b>2-3<\/b> 정산 지급 상태는 오로라 › 정산관리 ›<br/>정산내역에서 구매확정일별 '상태' 항목으로<br/>확인하실 수 있습니다.\"]:::bot\nN2_3_1[\"<b>2-3-1<\/b> 지급확정 상태라면 영업일 16시 ~ 18시<br/>사이에 지급됩니다. 은행별 처리 시간이 다를<br/>수 있어 익일 오전까지 확인해 보시고,<br/>그때도 입금되지 않았다면 다시 문의<br/>부탁드립니다.\"]:::bot\nN2_3_2[\"<b>2-3-2<\/b> 지급완료 상태라면 정산대금은<br/>'오늘의집정산'으로 표기되어 입금되니 통장<br/>내역을 확인해 주세요.\"]:::bot\nN2_3_3[\"<b>2-3-3<\/b> 지급이월_마이너스정산은 구매확정주문 취소<br/>또는 혜택정산, 기타정산 등의 사유로 최종<br/>정산금액이 마이너스여서 이월된 상태입니다.<br/>정산조정 항목에는 마이너스 정산 상계,<br/>지급이월 금액 합산 등이 반영되며, 오로라<br/>› 정산관리 › 정산내역의 정산조정 금액을<br/>클릭하시면 사유를 확인하실 수 있습니다.\"]:::bot\nN2_3_4[\"<b>2-3-4<\/b> 지급이월_보류·지급이월_실패는 계좌 오류,<br/>사업자 이슈 등으로 지급이 보류된 상태이며,<br/>보류 시 셀러샵 대표 계정과 회계담당자<br/>휴대폰 번호로 알림톡이 안내됩니다.\"]:::bot\nN2_3_5[\"<b>2-3-5<\/b> 확인하실 구매확정일을 알려 주시겠어요?\"]:::bot\nN2_3_6[\"<b>2-3-6<\/b> 양도양수 진행 시 서류 미비 등으로 진행이<br/>어려우면 정산 지급도 보류될 수 있습니다.\"]:::bot\nN2_3_7[\"<b>2-3-7<\/b> 보류 사유 확인을 위해 담당 상담원에게<br/>연결해 드릴게요.\"]:::bot\nN2_4[\"<b>2-4<\/b> 정산금액은 정산 기준금액 + 선결제<br/>배송/조립비 + 클레임 배송비 - 상품<br/>수수료 - 선결제 배송/조립비 수수료 -<br/>클레임 배송비 수수료 + 혜택정산 +<br/>기타정산으로 계산됩니다.\"]:::bot\nN2_4_1[\"<b>2-4-1<\/b> 확인하실 구매확정일 또는 주문번호와 예상하신<br/>금액을 알려 주시겠어요?\"]:::bot\nN2_4_3[\"<b>2-4-3<\/b> 정산은 구매확정이 완료된 주문건을 대상으로<br/>하므로 결제월과 정산월은 다를 수 있습니다.<br/>구매확정주문 취소건은 환불 승인 일자<br/>기준으로 정산에 반영됩니다. 오로라 ›<br/>정산관리 › 정산내역 상세 탭에서 주문번호로<br/>검색하시면 지급 예정일을 확인하실 수<br/>있습니다.\"]:::bot\nN2_4_4[\"<b>2-4-4<\/b> 기타정산은 기타 사유로 정산금액에 가감되는<br/>금액입니다. 오로라 › 정산관리 › 정산내역<br/>상세 탭 › 엑셀 다운로드 후 상품명에서<br/>확인하실 수 있으며, 자세한 내용은 정산<br/>담당자<br/>메일(settlement@bucketplace.org)로<br/>문의해 주세요.\"]:::bot\nN2_5[\"<b>2-5<\/b> 해외사업자는 구매확정일 기준으로 매월 2회<br/>정산대금이 지급되며, 지급일이<br/>주말·공휴일이면 다음 영업일에 지급됩니다.\"]:::bot\nN2_6[\"<b>2-6<\/b> 어떤 내역이 필요하신가요?\"]:::bot\nN2_6_1[\"<b>2-6-1<\/b> (최종 매출금액) 오로라 › 정산관리 ›<br/>부가세신고 탭에서 기간을 검색하신 뒤 합계<br/>금액으로 확인하시면 됩니다. (구)매출현황<br/>메뉴는 2025년 12월 16일부터 이용이<br/>중단되었으며, 구매확정일·결제일·배송완료일<br/>기준 세부 내역은 정산내역 상세 메뉴에서<br/>2022년 6월 이후분을 확인하실 수<br/>있습니다.\"]:::bot\nN2_6_2[\"<b>2-6-2<\/b> (2022년 6월 이전) 해당 기간<br/>정산내역은 파트너센터에서 바로 안내드리기<br/>어려워 담당부서에 요청해 드릴게요. 필요하신<br/>정산내역 기간과 사유를 알려 주시겠어요?\"]:::bot\nN2_6_3[\"<b>2-6-3<\/b> (퇴점 후 판매내역) 판매 내역에는 고객<br/>개인정보가 포함되어 있어 전달드리기 어려운<br/>점 양해 부탁드립니다. 정산 내역으로 대체해<br/>전달드릴 수 있는데, 정산 내역으로<br/>요청하시겠어요?\"]:::bot\nN2_7[\"<b>2-7<\/b> 주식회사 버킷플레이스 이름으로 입금된 내역은<br/>번거로우시겠지만 정산 담당자<br/>메일(settlement@bucketplace.org)로<br/>문의 부탁드립니다. 참고로 정산대금은<br/>'오늘의집정산'으로 표기되어 입금됩니다.\"]:::bot\nN3[\"<b>3<\/b> 더 궁금하신 점이 있으신가요?\"]:::bot\nS --> N1\nN1 -->|\"지급 일정\"| N2_1\nN1 -->|\"예정 금액\"| N2_2\nN1 -->|\"미입금·보류\"| N2_3\nN1 -->|\"금액 다름\"| N2_4\nN1 -->|\"해외사업자\"| N2_5\nN1 -->|\"매출·과거 내역\"| N2_6\nN1 -->|\"출처 불명 입금\"| N2_7\nN1 -->|\"정산 지급 일정 / 정산 예정 금액 /<br/>정산금 미입금·지급 보류 / 정산 금액이<br/>예상과 다름 / 해외사업자 정산 / 매출<br/>현황·과거 정산내역 / 출처를 모르는 입금<br/>내역\"| N2_1\nN2_1 -->|\"특정 주문건의 지급일을 물으면\"| N2_1_1\nN2_1 -->|\"그 외\"| N3\nN2_1_1 -->|\"확인이 안 돼요\"| N2_1_2\nN2_1_1 -->|\"알겠어요\"| N3\nN2_1_2 --> HO_T3D\nN2_1_2 -->|\"주문번호 입력\"| N2_2\nN2_2_1 --> N3\nN2_2_2 --> N3\nN2_2 -->|\"구매확정된 주문 / 아직 구매확정 전인 주문\"| N2_3\nN2_3 -->|\"지급확정\"| N2_3_1\nN2_3 -->|\"지급완료\"| N2_3_2\nN2_3 -->|\"지급이월_마이너스정산\"| N2_3_3\nN2_3 -->|\"지급이월_보류·지급이월_실패\"| N2_3_4\nN2_3 -->|\"상태 확인이 어려워요\"| N2_3_5\nN2_3_1 --> N3\nN2_3_2 --> N3\nN2_3_3 --> N3\nN2_3_4 -->|\"양도양수 진행 중이라고 하면\"| N2_3_6\nN2_3_4 -->|\"그 외\"| N3\nN2_3_5 --> HO_T3D\nN2_3_5 -->|\"구매확정일 입력\"| N2_3_6\nN2_3_6 -->|\"보류 안내 메일을 받지 못했다고 하면\"| N2_3_7\nN2_3_6 -->|\"그 외\"| N3\nN2_3_7 --> HO_T3C\nN2_4 -->|\"결제월과 정산월이 달라 빠진 것 같아요\"| N2_4_3\nN2_4 -->|\"기타정산 사유가 궁금해요\"| N2_4_4\nN2_4 -->|\"특정 정산건 금액을 확인받고 싶어요\"| N2_4_1\nN2_4 -->|\"알겠어요\"| N3\nN2_4_1 --> HO_T3D\nN2_4_1 -->|\"구매확정일 또는 주문번호, 예상 금액 입력\"| N2_4_3\nN2_4_3 --> N3\nN2_4_4 --> N3\nN2_5 --> N3\nN2_6_1 --> N3\nN2_6_2 --> HO_T3C\nN2_6_2 -->|\"기간, 사유 입력\"| N2_6_3\nN2_6_3 -->|\"네\"| HO_T3C\nN2_6_3 -->|\"아니요\"| N3\nN2_7 --> N3\nN3 -->|\"아니요\"| END\nN3 -->|\"네\"| N1\nN2_6 --> N2_6_1\nN2_2 -.-> N2_2_1\nN2_2_1 -.-> N2_2_2\nN2_6_1 -.-> N2_6_2\nHO_T3D([\"상담원 인계<br/>개별 조회 필요\"]):::ho\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nEND([\"상담 종료\"]):::fin", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 정산 관련 문의 주셨네요. 어떤 내용이 궁금하신가요?", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "오늘의집은 일정산으로 진행되며, 구매확정일로부터 +2영업일에 정산금이 지급됩니다.", "sec": false, "body": ["- 지급 시간: 영업일 16시 ~ 18시 사이 (은행별 입금 처리 시간은 다를 수 있습니다)", "- 지급일이 주말·공휴일이면 다음 영업일에 지급되며, 여러 구매확정일분이 합산되어 1회 지급될 수 있습니다.", "- 반품/교환 클레임 배송비는 클레임 완료일 +2영업일 정산에 포함됩니다.", "- 구매확정은 배송완료 후 고객이 직접 하거나, 하지 않으면 주말과 공휴일을 포함해 8일째 되는 날 자동으로 처리됩니다.", "이번 달 상세 지급 일정은 오로라 공지사항의 '[정산] 해당 월 일정산 일정 안내'에서 확인하실 수 있습니다."]}, {"k": "2-1-1", "id": "2-1-1", "t": "특정 주문건의 지급 예정일은 오로라 > 정산관리 > 정산내역 상세 탭에서 주문번호로 검색하시면 확인하실 수 있습니다.", "sec": false, "body": []}, {"k": "2-1-2", "id": "2-1-2", "t": "확인하실 주문번호를 알려 주시겠어요?", "sec": false, "body": ["지급 예정일 확인을 위해 담당 상담원에게 연결해 드릴게요."]}, {"k": "2-2", "id": "2-2", "t": "확인하실 기준을 알려 주세요.", "sec": false, "body": []}, {"k": "2-2-1", "id": "2-2-1", "t": "(구매확정된 주문) 오로라 > 정산관리 > 정산내역 상세 탭에서 구매확정일로 검색하시면 확인하실 수 있습니다. 구매확정일 다음날부터 확인 가능하며, 아직 지급되지 않은 구매확정일의 정산금액은 변동될 수 있습니다.", "sec": false, "body": []}, {"k": "2-2-2", "id": "2-2-2", "t": "(구매확정 전 주문) 오로라 > 정산관리 > 정산내역 상세 탭에서 '결제일' 기준으로 검색 > 엑셀 다운로드 후 G열 정산 예정금액을 확인해 주세요. 확인 시점에 따라 반품 등의 사유로 금액이 달라질 수 있어 참고용으로만 봐 주세요.", "sec": false, "body": []}, {"k": "2-3", "id": "2-3", "t": "정산 지급 상태는 오로라 > 정산관리 > 정산내역에서 구매확정일별 '상태' 항목으로 확인하실 수 있습니다.", "sec": false, "body": ["- 지급확정: 지급 금액이 확정된 상태", "- 지급완료: 지급일에 최종 지급 완료된 상태", "- 지급이월_마이너스정산: 최종 정산금액이 마이너스인 상태", "- 지급이월_보류 / 지급이월_실패: 계좌 오류, 사업자 이슈 등으로 지급이 보류된 상태", "확인하신 상태를 선택해 주세요."]}, {"k": "2-3-1", "id": "2-3-1", "t": "지급확정 상태라면 영업일 16시 ~ 18시 사이에 지급됩니다. 은행별 처리 시간이 다를 수 있어 익일 오전까지 확인해 보시고, 그때도 입금되지 않았다면 다시 문의 부탁드립니다.", "sec": false, "body": []}, {"k": "2-3-2", "id": "2-3-2", "t": "지급완료 상태라면 정산대금은 '오늘의집정산'으로 표기되어 입금되니 통장 내역을 확인해 주세요.", "sec": false, "body": []}, {"k": "2-3-3", "id": "2-3-3", "t": "지급이월_마이너스정산은 구매확정주문 취소 또는 혜택정산, 기타정산 등의 사유로 최종 정산금액이 마이너스여서 이월된 상태입니다. 정산조정 항목에는 마이너스 정산 상계, 지급이월 금액 합산 등이 반영되며, 오로라 > 정산관리 > 정산내역의 정산조정 금액을 클릭하시면 사유를 확인하실 수 있습니다.", "sec": false, "body": []}, {"k": "2-3-4", "id": "2-3-4", "t": "지급이월_보류·지급이월_실패는 계좌 오류, 사업자 이슈 등으로 지급이 보류된 상태이며, 보류 시 셀러샵 대표 계정과 회계담당자 휴대폰 번호로 알림톡이 안내됩니다.", "sec": false, "body": ["먼저 오로라 > 판매자정보 > 판매자정보에서 정산 계좌 정보가 맞는지 확인해 주세요.", "- 계좌 정보가 틀렸다면 오로라 > 판매자 정보 > 판매자 정보 수정에서 직접 수정하실 수 있습니다. (정보변경 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29543329706521)", "- 정산팀에서 계좌변경 관련 메일을 받고 변경하신 경우라면 받으신 메일로 회신해 주세요.", "- 계좌 정보에 이상이 없다면 정산 담당자 메일(settlement@bucketplace.org)로 지급보류 해제 요청을 문의해 주세요. 파트너센터에서는 정확한 보류 사유 확인이 어려운 점 양해 부탁드립니다."]}, {"k": "2-3-5", "id": "2-3-5", "t": "확인하실 구매확정일을 알려 주시겠어요?", "sec": false, "body": ["지급 상태 확인을 위해 담당 상담원에게 연결해 드릴게요."]}, {"k": "2-3-6", "id": "2-3-6", "t": "양도양수 진행 시 서류 미비 등으로 진행이 어려우면 정산 지급도 보류될 수 있습니다.", "sec": false, "body": ["기존 양도인 계좌로 정산 입금을 원하시면 안내받으신 메일을 통해 양도양수 해지통지서를 작성해 제출해 주세요. 이후 양도양수를 다시 진행하시려면 서류를 보완해 재진행해 주시면 됩니다."]}, {"k": "2-3-7", "id": "2-3-7", "t": "보류 사유 확인을 위해 담당 상담원에게 연결해 드릴게요.", "sec": false, "body": []}, {"k": "2-4", "id": "2-4", "t": "정산금액은 정산 기준금액 + 선결제 배송/조립비 + 클레임 배송비 - 상품 수수료 - 선결제 배송/조립비 수수료 - 클레임 배송비 수수료 + 혜택정산 + 기타정산으로 계산됩니다.", "sec": false, "body": ["오로라 > 정산관리 > 정산내역 상세 탭에서 구매확정일로 검색하시면 주문정산 / 혜택정산 / 기타정산 내역을 각 탭에서 확인하실 수 있으며, 엑셀 다운로드 시 하나의 파일로 받으실 수 있습니다. 할인 내역은 혜택정산 > 혜택 상세 엑셀 다운로드에서 확인하실 수 있습니다.", "혜택정산은 파트너님 부담 쿠폰 등 할인금액이 차감된 금액이며, 정산조정은 마이너스 정산 상계, 정산차감형 광고매출, 지급이월 금액 합산 등이 반영된 금액입니다. 정산조정 사유는 오로라 > 정산관리 > 정산내역에서 정산조정 금액을 클릭하시면 확인하실 수 있습니다."]}, {"k": "2-4-1", "id": "2-4-1", "t": "확인하실 구매확정일 또는 주문번호와 예상하신 금액을 알려 주시겠어요?", "sec": false, "body": ["정산 내역 확인을 위해 담당 상담원에게 연결해 드릴게요."]}, {"k": "2-4-3", "id": "2-4-3", "t": "정산은 구매확정이 완료된 주문건을 대상으로 하므로 결제월과 정산월은 다를 수 있습니다. 구매확정주문 취소건은 환불 승인 일자 기준으로 정산에 반영됩니다. 오로라 > 정산관리 > 정산내역 상세 탭에서 주문번호로 검색하시면 지급 예정일을 확인하실 수 있습니다.", "sec": false, "body": []}, {"k": "2-4-4", "id": "2-4-4", "t": "기타정산은 기타 사유로 정산금액에 가감되는 금액입니다. 오로라 > 정산관리 > 정산내역 상세 탭 > 엑셀 다운로드 후 상품명에서 확인하실 수 있으며, 자세한 내용은 정산 담당자 메일(settlement@bucketplace.org)로 문의해 주세요.", "sec": false, "body": []}, {"k": "2-5", "id": "2-5", "t": "해외사업자는 구매확정일 기준으로 매월 2회 정산대금이 지급되며, 지급일이 주말·공휴일이면 다음 영업일에 지급됩니다.", "sec": false, "body": ["- 1차: 전월 15일 ~ 말일 구매확정건 → 5일 지급", "- 2차: 당월 1일 ~ 14일 구매확정건 → 20일 지급", "- 지급 통화는 USD/유로/엔화 중 선택하실 수 있으며, 정산대금 확정일의 서울외국환중개 매매기준율이 적용됩니다.", "- 정산금액이 원화 기준 10만원 미만이면 다음 차수 정산금액과 합산해 지급됩니다.", "- 지급을 위해 인보이스를 반드시 제출해 주셔야 하며, 지급일 전일 15시까지 보내 주셔야 해당 차수 지급일에 지급됩니다. 제출이 늦어지면 제출일이 속한 차수의 지급일에 지급됩니다.", "- 인보이스에는 발행인, 품목명, 정산금액, 날인이 모두 기재되어 있어야 합니다."]}, {"k": "2-6", "id": "2-6", "t": "어떤 내역이 필요하신가요?", "sec": false, "body": []}, {"k": "2-6-1", "id": "2-6-1", "t": "(최종 매출금액) 오로라 > 정산관리 > 부가세신고 탭에서 기간을 검색하신 뒤 합계 금액으로 확인하시면 됩니다. (구)매출현황 메뉴는 2025년 12월 16일부터 이용이 중단되었으며, 구매확정일·결제일·배송완료일 기준 세부 내역은 정산내역 상세 메뉴에서 2022년 6월 이후분을 확인하실 수 있습니다.", "sec": false, "body": []}, {"k": "2-6-2", "id": "2-6-2", "t": "(2022년 6월 이전) 해당 기간 정산내역은 파트너센터에서 바로 안내드리기 어려워 담당부서에 요청해 드릴게요. 필요하신 정산내역 기간과 사유를 알려 주시겠어요?", "sec": false, "body": []}, {"k": "2-6-3", "id": "2-6-3", "t": "(퇴점 후 판매내역) 판매 내역에는 고객 개인정보가 포함되어 있어 전달드리기 어려운 점 양해 부탁드립니다. 정산 내역으로 대체해 전달드릴 수 있는데, 정산 내역으로 요청하시겠어요?", "sec": false, "body": []}, {"k": "2-7", "id": "2-7", "t": "주식회사 버킷플레이스 이름으로 입금된 내역은 번거로우시겠지만 정산 담당자 메일(settlement@bucketplace.org)로 문의 부탁드립니다. 참고로 정산대금은 '오늘의집정산'으로 표기되어 입금됩니다.", "sec": false, "body": []}, {"k": "3", "id": "3", "t": "더 궁금하신 점이 있으신가요?", "sec": false, "body": []}], "hocond": "양도양수 보류 안내 메일 미수신 T3-C / 2022년 6월 이전 정산내역 요청 T3-C / 퇴점 후 정산내역 요청 T3-C / 오로라 경로로 확인한 뒤에도 주문별 지급 예정일·구매확정일별 지급 상태·정산 금액 개별 확인을 원하면 T3-D / 지급 보류는 계좌 확인과 정산 담당자 메일 안내로 종결하되 반복 미해결이면 T2 / 상담원 직접 요청 T1", "hoinfo": "문의 구매확정일 또는 주문번호, 파트너가 오로라에서 본 지급 상태(지급이월_보류/실패 등)와 예상 금액, 양도양수 진행 여부, 요청 정산내역 기간·사유, 퇴점 여부. 지급 예정일·지급 상태·정산 상세(A~F)·정산조정은 상담원이 직접 확인합니다.", "kms": "055_정산.md, 078_파트너센터_교육자료_정산__수수료.md, 005__정산__26년_10월_일정산_일정_안내_.md, 017__정산__26년_9월_일정산_일정_안내.md, 031__정산__26년_8월_일정산_일정_안내.md, 037__정산__26년_7월_일정산_일정_안내.md, 092_관리자_이관_유형_및_방법.md, 096_심층문의_이관_유형_및_이관_방법.md", "check": "1) 해외사업자 인보이스 마감: 055는 지급일 전일 15시, 078은 17시 2) 월별 일정산 일정(005·017·031·037)은 본문이 이미지라 날짜를 시나리오에 넣지 않았음. 챗봇이 그달 지급일을 답하려면 매월 공지 내용을 KMS에 텍스트로 반영하거나 지급예정일 조회 API가 필요. 공지 위치를 '오로라 공지사항'으로 썼는데 KMS에 일정산 공지 경로가 명시돼 있지 않음 3) 2022년 6월 이전 정산내역: 055는 심층 전달, 078은 '(구)정산현황 메뉴에서 확인'으로 셀프 안내. (구)정산현황 메뉴가 지금도 쓸 수 있는지 확인 필요. 입력의 '2022년 이전 → 관리자'는 092 '2022년 이전 주문건 조회'(주문 조회) 기준이라 정산내역과는 구분함 4) 정산 상태 조회 API가 없으면 지급 보류·금액 문의 대부분이 경로 안내로만 끝나 단독 종결률이 낮아짐 5) (1차 전환) 2-3은 파트너가 정산내역 화면에서 본 상태를 고르는 방식이라, 화면 상태명(지급확정/지급완료/지급이월_마이너스정산/지급이월_보류/지급이월_실패)이 버튼과 같은지 확인 필요 6) (1차 전환) 2-4의 혜택정산·정산조정 설명은 기존 2-4-1(조회 성공 분기)에 있던 KMS 문구를 경로 안내 쪽으로 옮긴 것 7) (1차 전환) T3-D 인계 건이 많아질 수 있어(확인 필요 4와 같은 쟁점), 1차 오픈 후 정산 유형 인계 비율 모니터링 필요", "api": "R-08", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 궁금한 항목: \n· 구매확정일 또는 주문번호 (선택): \n· (해당 시: 미입금·지급 보류) 오로라 정산내역에 보이는 상태 (지급확정 / 지급완료 / 지급이월_마이너스정산 / 지급이월_보류 / 지급이월_실패 / 모름): \n· (해당 시: 지급 보류) 양도양수 진행 중인지 (예 / 아니요): \n· (해당 시: 양도양수 진행 중) 보류 안내 메일을 받았는지 (받음 / 못 받음): \n· (해당 시: 2022년 6월 이전, 퇴점 후 내역) 필요한 기간과 사유: \n\n문의 내용: ", "mode": "조건별: 지급 일정·예정 금액·상태별 의미와 보류 시 조치·금액 계산식·해외사업자·최종 매출·출처 불명 입금 문의처는 자동답변 종결 / 양도양수 보류 안내 메일 미수신·2022년 6월 이전 정산내역·퇴점 후 정산 내역 요청은 상담원 배정", "segs": [{"c": ["A"], "t": "지급 일정·예정 금액·상태별 의미와 보류 시 조치·금액 계산식·해외사업자·최종 매출·출처 불명 입금 문의처는 자동답변 종결"}, {"c": ["C"], "t": "양도양수 보류 안내 메일 미수신·2022년 6월 이전 정산내역·퇴점 후 정산 내역 요청은 상담원 배정"}], "auto": "(공통 첫인사)\n\n[정산 지급 일정]\n오늘의집은 일정산으로 진행되며, 구매확정일로부터 +2영업일에 정산금이 지급됩니다.\n- 지급 시간: 영업일 16시 ~ 18시 사이 (은행별 입금 처리 시간은 다를 수 있습니다)\n- 지급일이 주말·공휴일이면 다음 영업일에 지급되며, 여러 구매확정일분이 합산되어 1회 지급될 수 있습니다.\n- 반품/교환 클레임 배송비는 클레임 완료일 +2영업일 정산에 포함됩니다.\n- 구매확정은 배송완료 후 고객이 직접 하거나, 하지 않으면 배송완료일 다음 날부터 주말·공휴일 포함 8일째에 자동 처리됩니다.\n특정 주문의 지급 예정일은 오로라 > 정산관리 > 정산내역 상세 탭에서 주문번호로 검색하시면 확인하실 수 있습니다.\n\n[정산 예정 금액]\n- 구매확정된 주문: 오로라 > 정산관리 > 정산내역 상세 탭에서 구매확정일로 검색하시면 확인하실 수 있습니다. 구매확정일 다음날부터 확인 가능하며, 아직 지급되지 않은 구매확정일의 정산금액은 변동될 수 있습니다.\n- 구매확정 전 주문: 같은 탭에서 '결제일' 기준으로 검색 > 엑셀 다운로드 후 G열 정산 예정금액을 확인해 주세요. 확인 시점에 따라 반품 등의 사유로 금액이 달라질 수 있어 참고용으로만 봐 주세요.\n\n[정산금이 들어오지 않았거나 지급이 보류된 경우] (파트너가 고른 상태의 줄만 안내, '모름'이면 전체)\n정산 지급 상태는 오로라 > 정산관리 > 정산내역에서 구매확정일별 '상태' 항목으로 확인하실 수 있습니다.\n- 지급확정: 지급 금액이 확정된 상태로 영업일 16시 ~ 18시 사이에 지급됩니다. 은행별 처리 시간이 다를 수 있어 익일 오전까지 확인해 보시고, 그때도 입금되지 않았다면 다시 문의 부탁드립니다.\n- 지급완료: 지급일에 최종 지급 완료된 상태입니다. 정산대금은 '오늘의집정산'으로 표기되어 입금되니 통장 내역을 확인해 주세요.\n- 지급이월_마이너스정산: 구매확정주문 취소 또는 혜택정산, 기타정산 등의 사유로 최종 정산금액이 마이너스여서 이월된 상태입니다. 오로라 > 정산관리 > 정산내역의 정산조정 금액을 클릭하시면 사유를 확인하실 수 있습니다.\n- 지급이월_보류 / 지급이월_실패: 계좌 오류, 사업자 이슈 등으로 지급이 보류된 상태이며, 보류 시 셀러샵 대표 계정과 회계담당자 휴대폰 번호로 알림톡이 안내됩니다. 먼저 오로라 > 판매자정보 > 판매자정보에서 정산 계좌 정보가 맞는지 확인해 주세요. 계좌 정보가 틀렸다면 오로라 > 판매자 정보 > 판매자 정보 수정에서 직접 수정하실 수 있고(정보변경 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29543329706521), 정산팀에서 계좌변경 관련 메일을 받고 변경하신 경우라면 받으신 메일로 회신해 주세요. 계좌 정보에 이상이 없다면 정산 담당자 메일(settlement@bucketplace.org)로 지급보류 해제 요청을 문의해 주세요. 파트너센터에서는 정확한 보류 사유 확인이 어려운 점 양해 부탁드립니다.\n양도양수를 진행 중이시라면, 서류 미비 등으로 진행이 어려우면 정산 지급도 보류될 수 있습니다. 기존 양도인 계좌로 정산 입금을 원하시면 안내받으신 메일을 통해 양도양수 해지통지서를 작성해 제출해 주시고, 이후 양도양수를 다시 진행하시려면 서류를 보완해 재진행해 주세요.\n\n[정산 금액이 예상과 다른 경우]\n정산금액은 정산 기준금액 + 선결제 배송/조립비 + 클레임 배송비 - 상품 수수료 - 선결제 배송/조립비 수수료 - 클레임 배송비 수수료 + 혜택정산 + 기타정산으로 계산됩니다. 오로라 > 정산관리 > 정산내역 상세 탭에서 구매확정일로 검색하시면 주문정산 / 혜택정산 / 기타정산 내역을 각 탭에서 확인하실 수 있으며, 엑셀 다운로드 시 하나의 파일로 받으실 수 있습니다. 할인 내역은 혜택정산 > 혜택 상세 엑셀 다운로드에서 확인하실 수 있습니다.\n- 혜택정산은 파트너님 부담 쿠폰 등 할인금액이 차감된 금액이고, 정산조정은 마이너스 정산 상계, 정산차감형 광고매출, 지급이월 금액 합산 등이 반영된 금액입니다.\n- 정산은 구매확정이 완료된 주문을 대상으로 하므로 결제월과 정산월은 다를 수 있고, 구매확정주문 취소건은 환불 승인 일자 기준으로 정산에 반영됩니다.\n- 기타정산은 기타 사유로 정산금액에 가감되는 금액으로, 정산내역 상세 탭 > 엑셀 다운로드 후 상품명에서 확인하실 수 있으며 자세한 내용은 정산 담당자 메일(settlement@bucketplace.org)로 문의해 주세요.\n\n[해외사업자 정산]\n해외사업자는 구매확정일 기준으로 매월 2회 정산대금이 지급되며, 지급일이 주말·공휴일이면 다음 영업일에 지급됩니다.\n- 1차: 전월 15일 ~ 말일 구매확정건 → 5일 지급\n- 2차: 당월 1일 ~ 14일 구매확정건 → 20일 지급\n- 지급 통화는 USD/유로/엔화 중 선택하실 수 있으며, 정산대금 확정일의 서울외국환중개 매매기준율이 적용됩니다.\n- 정산금액이 원화 기준 10만원 미만이면 다음 차수 정산금액과 합산해 지급됩니다.\n- 지급을 위해 인보이스를 반드시 제출해 주셔야 하며, 지급일 전일 15시까지 보내 주셔야 해당 차수 지급일에 지급됩니다. 제출이 늦어지면 제출일이 속한 차수의 지급일에 지급됩니다. 인보이스에는 발행인, 품목명, 정산금액, 날인이 모두 기재되어 있어야 합니다.\n\n[최종 매출금액]\n오로라 > 정산관리 > 부가세신고 탭에서 기간을 검색하신 뒤 합계 금액으로 확인하시면 됩니다. (구)매출현황 메뉴는 2025년 12월 16일부터 이용이 중단되었으며, 구매확정일·결제일·배송완료일 기준 세부 내역은 정산내역 상세 메뉴에서 2022년 6월 이후분을 확인하실 수 있습니다.\n\n[출처를 모르는 입금 내역]\n주식회사 버킷플레이스 이름으로 입금된 내역은 번거로우시겠지만 정산 담당자 메일(settlement@bucketplace.org)로 문의 부탁드립니다. 정산대금은 '오늘의집정산'으로 표기되어 입금됩니다.\n(궁금한 항목에 해당하는 단락만, 맺음 A)", "ack": "요청하신 내용은 담당 부서에 확인을 요청드리겠습니다. 확인에 시간이 소요될 수 있는 점 양해 부탁드립니다.\n(퇴점 후 판매 내역: \"판매 내역에는 고객 개인정보가 포함되어 있어 전달드리기 어렵고, 정산 내역으로 대체해 전달드리겠습니다.\")", "info": "구매확정일 또는 주문번호, 파트너가 고른 지급 상태, 양도양수 진행 여부·보류 안내 메일 수신 여부, 요청 정산내역 기간·사유, 퇴점 여부", "kms": "055_정산.md, 078_파트너센터_교육자료_정산__수수료.md, 092_관리자_이관_유형_및_방법.md, 096_심층문의_이관_유형_및_이관_방법.md", "check": "1) 해외사업자 인보이스 마감: 055 지급일 전일 15시 vs 078 17시\n2) 월별 일정산 일정 공지(005·017·031·037)는 본문이 이미지라 날짜를 답변에 넣지 않음 — 이번 달 지급일 문의에 답하려면 매월 공지를 텍스트로 KMS에 반영 필요. 공지 위치 경로도 KMS 명시 없음\n3) 2022년 6월 이전 정산내역: 055 담당 부서 확인 vs 078 '(구)정산현황 메뉴에서 확인' — (구)정산현황 메뉴 사용 가능 여부 확인\n4) 자동 구매확정 8일째/8영업일째 혼재 (PA002002와 같은 쟁점)"}}, {"code": "PA012001", "draft": false, "name": "담당 MD 관련", "mid": "운영", "vol": "110", "mode": "정보 수집 후 상담원 연결", "utter": "우리 샵 담당 MD가 누구예요?\nMD님 연락처 좀 알 수 있을까요?\n담당 MD님한테 메일 보냈는데 일주일째 답이 없어요", "raw": "1. 네, 파트너님. 담당 MD 관련 문의 주셨네요. 어떤 내용이 필요하신가요?\n[담당 MD 확인·연락 방법] / [MD 배정 요청·배정 기준] / [담당 MD와 연락이 안 됨]\n\n(확인·연락 → 2-1 / 배정 요청·기준 → 2-2 / 연락 안 됨 → 2-3)\n\n2-1. 담당 MD의 이름이나 개별 연락처는 안내가 어려운 점 양해 부탁드립니다.\n담당 MD 배정 여부와 문의 경로는 파트너님 샵의 담당 MD 확인이 필요해 상담원이 확인해 드릴게요. 어떤 카테고리(또는 상품번호) 관련 문의이신지, 문의하실 내용과 함께 알려 주시겠어요?\n[카테고리 또는 상품번호, 문의 내용 입력]\n→ 상담원 인계 (T3-D)\n\n2-2. 담당 MD 배정 기준은 별도로 안내드리기 어려운 점 양해 부탁드립니다.\n[알겠습니다] → 3\n[우리 샵에 담당 MD가 있는지 알고 싶어요] → 2-1\n[납득할 수 없다·계속 요청] → 2-2-1\n2-2-1. 불편을 드려 죄송합니다. 말씀해 주신 내용은 담당 상담원이 이어서 확인해 드릴게요.\n→ 상담원 인계 (T4)\n\n2-3. 확인을 위해 몇 가지 여쭤볼게요.\n1) 담당 MD에게 요청하신 내용\n2) 연락하신 날짜와 방법(메일 등)\n3) 관련 상품번호(있는 경우)\n[내용 입력]\n4. 말씀해 주신 내용을 담당부서에 전달할 수 있도록 상담원에게 연결해 드릴게요. 확인까지 시간이 다소 걸릴 수 있는 점 양해 부탁드립니다.\n→ 상담원 인계 (T3-C)\n\n(대화 중 MD를 통한 실제 용건이 확인되면 해당 유형으로 전환: 수수료율 협의 → PA012002 / 기획전·쿠폰·키워드·광고 → PA012004)\n\n3. 더 궁금하신 점이 있으신가요?\n[아니요] → 상담 종료 (유형: PA012001)\n[네] → 1", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 담당 MD 관련 문의<br/>주셨네요. 어떤 내용이 필요하신가요?\"]:::bot\nN2_1[\"<b>2-1<\/b> 담당 MD의 상 관리자 보고·민원 처리 — 재문의 시 상담원 배정(B-05)으로 흡수"}}, {"code": "PA012002", "draft": false, "name": "표준 수수료", "mid": "운영", "vol": "", "mode": "안내 후 조건부 상담원 연결", "utter": "수수료 협의하고 싶어요\n저희 카테고리 표준 수수료율이 몇 %인가요?\n수수료 협의 요청서 냈는데 2주째 연락이 없어요", "raw": "1. 네, 파트너님. 수수료율 관련 문의 주셨네요. 어떤 내용이 궁금하신가요?\n[표준 수수료율 확인] / [수수료율 협의·조정 요청] / [협의 요청서 제출 후 결과 문의] / [협의 요청 거절 사유 문의]\n\n(표준 수수료율 → 2-1 / 협의 요청 → 2-2 / 결과 문의 → 2-3 / 거절 사유 → 2-4)\n(예비파트너(비회원)가 입점 전 협의를 문의하면 → 2-5)\n\n2-1. 표준 수수료율은 판매하시는 상품이 속한 카테고리를 기준으로 적용되며, 카테고리별 수수료율은 아래 가이드에서 확인하실 수 있습니다.\n[정책] 카테고리별 표준수수료율 상세: https://www.partnerbucketplace.com/hc/ko/articles/19792543852697\n신상품에는 카테고리 표준 수수료가 기본으로 적용되며, 오늘의집과 별도로 합의한 수수료율이 있다면 표준 수수료율보다 우선 적용됩니다.\n→ 3\n\n2-2. 기존에 오늘의집 수수료를 별도로 협의하지 않으셨다면 표준 수수료율이 적용되며, 적용된 수수료율은 협의를 요청하실 수 있습니다.\n담당 MD가 배정되어 있으신가요?\n[네, 담당 MD가 있어요] → 2-2-1 / [아니요, 담당 MD가 없어요] → 2-2-2 / [잘 모르겠어요] → 2-2-4\n2-2-1. 담당 MD가 배정되어 있으시면 수수료율 협의는 담당 MD 대표 메일로 문의해 주시면 됩니다.\n담당 MD에게 요청하셨는데 진행되지 않았다면 다시 말씀해 주세요. (담당 MD는 개인 연락처가 아닌 MD 그룹 대표 메일만 안내, 「요청 후 5영업일」은 내부 기준이라 파트너에게 안내하지 않음)\n[5영업일 지났어요] → 2-2-3\n[담당 MD 메일을 몰라요] → 2-2-4\n[알겠습니다] → 3\n2-2-2. 수수료 협의는 아래 요청서를 작성해 제출해 주시면 됩니다.\n수수료 협의 요청서: https://dailyhouse.typeform.com/to/vkxsx0DU\n수수료 별도 협의 요청은 영업일 기준 최대 10일 소요될 수 있으며, 협의 요청 시에도 오늘의집 내부 논의 후 조정이 어려울 수 있는 점 참고 부탁드립니다.\n→ 3\n2-2-3. 확인을 위해 담당 MD에게 요청하신 날짜와 협의를 원하시는 상품번호(또는 카테고리), 희망 수수료율을 알려 주시겠어요?\n[내용 입력]\n→ 상담원 인계 (T3-C)\n2-2-4. 담당 MD 배정 여부 확인이 필요해 상담원에게 연결해 드리겠습니다. 협의를 원하시는 상품번호(또는 카테고리)와 희망 수수료율을 알려 주시겠어요?\n[내용 입력]\n→ 상담원 인계 (T3-D)\n\n2-3. 수수료 협의 요청서를 제출하신 날짜를 알려 주시겠어요?\n[제출일 입력]\n(제출일로부터 영업일 기준 10일 경과 → 2-3-2 / 미경과 → 2-3-1)\n2-3-1. 수수료 별도 협의 요청은 영업일 기준 최대 10일 소요될 수 있습니다. 결과는 메일로 안내되니 스팸메일함도 함께 확인해 주시고, {제출일 + 10영업일} 이후에도 회신이 없으면 다시 문의 부탁드립니다.\n→ 3\n2-3-2. 기다리시게 해 죄송합니다. 스팸메일함에도 결과 메일이 없는지 확인 부탁드립니다.\n[없어요] → 확인을 위해 요청서에 기재하신 상품번호(또는 카테고리)와 희망 수수료율을 알려 주시겠어요? [내용 입력] → 상담원 인계 (T3-C)\n[찾았어요] → 3\n\n2-4. 거절 사유 확인을 위해 담당부서에 전달해 드릴게요. 요청서 제출일과 거절 안내를 받으신 날짜를 알려 주시겠어요?\n[내용 입력]\n→ 상담원 인계 (T3-C)\n\n2-5. 입점 전에는 수수료 협의가 어렵습니다. 입점 후 별도 신청을 통해 수수료 협의를 요청하실 수 있으며, 협의 요청 시에도 오늘의집 내부 논의 후 불가할 수 있는 점 참고 부탁드립니다. 카테고리별 표준수수료율은 [정책] 카테고리별 표준수수료율 상세(https://www.partnerbucketplace.com/hc/ko/articles/19792543852697)에서 확인하실 수 있습니다.\n→ 3\n\n(정산에 실제로 적용된 수수료 금액 확인이면 → 유형 전환 (유형: PA008001))\n\n3. 더 궁금하신 점이 있으신가요?\n[아니요] → 상담 종료 (유형: PA012002)\n[네] → 1", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 수수료율 관련 문의<br/>주셨네요. 어떤 내용이 궁금하신가요?\"]:::bot\nN2_1[\"<b>2-1<\/b> 표준 수수료율은 판매하시는 상품이 속한<br/>카테고리를 기준으로 적용되며, 카테고리별<br/>수수료율은 아래 가이드에서 확인하실 수<br/>있습니다.\"]:::bot\nN2_2[\"<b>2-2<\/b> 기존에 오늘의집 수수료를 별도로 협의하지<br/>않으셨다면 표준 수수료율이 적용되며, 적용된<br/>수수료율은 협의를 요청하실 수 있습니다.\"]:::bot\nN2_2_1[\"<b>2-2-1<\/b> 담당 MD가 배정되어 있으시면 수수료율<br/>협의는 담당 MD 대표 메일로 문의해 주시면<br/>됩니다.\"]:::bot\nN2_2_2[\"<b>2-2-2<\/b> 수수료 협의는 아래 요청서를 작성해 제출해<br/>주시면 됩니다.\"]:::bot\nN2_2_3[\"<b>2-2-3<\/b> 확인을 위해 담당 MD에게 요청하신 날짜와<br/>협의를 원하시는 상품번호(또는 카테고리),<br/>희망 수수료율을 알려 주시겠어요?\"]:::bot\nN2_2_4[\"<b>2-2-4<\/b> 담당 MD 배정 여부 확인이 필요해<br/>상담원에게 연결해 드리겠습니다. 협의를<br/>원하시는 상품번호(또는 카테고리)와 희망<br/>수수료율을 알려 주시겠어요?\"]:::bot\nN2_3[\"<b>2-3<\/b> 수수료 협의 요청서를 제출하신 날짜를 알려<br/>주시겠어요?\"]:::bot\nN2_3_1[\"<b>2-3-1<\/b> 수수료 별도 협의 요청은 영업일 기준 최대<br/>10일 소요될 수 있습니다. 결과는 메일로<br/>안내되니 스팸메일함도 함께 확인해 주시고,<br/>(제출일 + 10영업일) 이후에도 회신이<br/>없으면 다시 문의 부탁드립니다.\"]:::bot\nN2_3_2[\"<b>2-3-2<\/b> 기다리시게 해 죄송합니다. 스팸메일함에도<br/>결과 메일이 없는지 확인 부탁드립니다.\"]:::bot\nN2_4[\"<b>2-4<\/b> 거절 사유 확인을 위해 담당부서에 전달해<br/>드릴게요. 요청서 제출일과 거절 안내를<br/>받으신 날짜를 알려 주시겠어요?\"]:::bot\nN2_5[\"<b>2-5<\/b> 입점 전에는 수수료 협의가 어렵습니다. 입점<br/>후 별도 신청을 통해 수수료 협의를 요청하실<br/>수 있으며, 협의 요청 시에도 오늘의집 내부<br/>논의 후 불가할 수 있는 점 참고<br/>부탁드립니다. 카테고리별 표준수수료율은\"]:::bot\nN3[\"<b>3<\/b> 더 궁금하신 점이 있으신가요?\"]:::bot\nS --> N1\nN1 -->|\"표준 수수료율\"| N2_1\nN1 -->|\"협의 요청\"| N2_2\nN1 -->|\"결과 문의\"| N2_3\nN1 -->|\"거절 사유\"| N2_4\nN1 -->|\"예비파트너(비회원)가 입점 전 협의를<br/>문의하면\"| N2_5\nN1 -->|\"표준 수수료율 확인 / 수수료율 협의·조정<br/>요청 / 협의 요청서 제출 후 결과 문의 /<br/>협의 요청 거절 사유 문의\"| N2_1\nN2_1 --> N3\nN2_1 -->|\"정책\"| N2_2\nN2_2 -->|\"네, 담당 MD가 있어요\"| N2_2_1\nN2_ 수수료 협의 요청서를 제출하신 날짜를 알려 주시겠어요?", "sec": false, "body": []}, {"k": "2-3-1", "id": "2-3-1", "t": "수수료 별도 협의 요청은 영업일 기준 최대 10일 소요될 수 있습니다. 결과는 메일로 안내되니 스팸메일함도 함께 확인해 주시고, {제출일 + 10영업일} 이후에도 회신이 없으면 다시 문의 부탁드립니다.", "sec": false, "body": []}, {"k": "2-3-2", "id": "2-3-2", "t": "기다리시게 해 죄송합니다. 스팸메일함에도 결과 메일이 없는지 확인 부탁드립니다.", "sec": false, "body": []}, {"k": "2-4", "id": "2-4", "t": "거절 사유 확인을 위해 담당부서에 전달해 드릴게요. 요청서 제출일과 거절 안내를 받으신 날짜를 알려 주시겠어요?", "sec": false, "body": []}, {"k": "2-5", "id": "2-5", "t": "입점 전에는 수수료 협의가 어렵습니다. 입점 후 별도 신청을 통해 수수료 협의를 요청하실 수 있으며, 협의 요청 시에도 오늘의집 내부 논의 후 불가할 수 있는 점 참고 부탁드립니다. 카테고리별 표준수수료율은", "sec": false, "body": []}, {"k": "3", "id": "3", "t": "더 궁금하신 점이 있으신가요?", "sec": false, "body": []}], "hocond": "협의 요청서 제출 후 10영업일 경과·결과 미수신 T3-C / 협의 거절 사유 문의 T3-C / 담당 MD 요청 후 5영업일 경과·빠른 처리 요청 T3-C / 담당 MD 유무를 모르거나 담당 MD 메일을 모르는 수수료 협의 문의 T3-D / 상담원 직접 요청 T1", "hoinfo": "파트너가 답한 담당 MD 유무(있음/없음/모름), 협의 대상 상품번호 또는 카테고리, 희망 수수료율, 협의 요청서 제출일 또는 담당 MD 요청일, 거절 안내 수신일, 스팸메일함 확인 여부. GP 여부와 MD 그룹 대표 메일은 상담원이 직접 확인합니다.", "kms": "055_정산.md, 078_파트너센터_교육자료_정산__수수료.md, 054_기획전___MD.md, 095_커머스_정책_이관_유형_및_이관_방법.md, 049_예비_파트너.md, 056_상품_관리.md", "check": "1) GP 외 파트너의 수수료 협의 경로: 055는 '담당 MD 메일 주소 안내', 054는 '담당 MD 연락처 공개 불가'로 상충(PA012001과 같은 쟁점) 2) 'GP 외 MD 요청 후 5영업일 경과' 기준은 095 정책 이관(수수료율) 절차에서 가져옴. 파트너에게 5영업일을 안내해도 되는지 확인 3) 협의 요청서 10영업일 경과 건(095 정책2)과 수수료율 조정 지연 건(095 정책4)의 이관처가 다름. 인계 후 상담원이 나눠야 함 4) 088에 '25년 12월 표준수수료 변경 대응' 시트가 있지만 KMS 본문에 변경 내용이 없어 시나리오에 넣지 않음. 변경 관련 문의 응대 기준 필요 5) (1차 전환) 2-2는 담당 MD 유무를 파트너 응답으로 나누므로, 담당 MD가 없는(GP) 파트너가 '있어요'로 답하거나 그 반대인 오응답이 생길 수 있음. 오응답 시 상담원이 바로잡도록 인계 정보에 파트너 응답을 남김 6) (1차 전환) 1차에는 챗봇이 MD 그룹 대표 메일을 알려줄 수 없어, 메일을 모르는 파트너는 T3-D로 인계됨", "api": "R-07", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 요청 (표준 수수료율 확인 / 수수료율 협의·조정 요청 / 협의 요청서 제출 후 결과 문의 / 협의 거절 사유 문의): \n· (해당 시: 협의·조정 요청) 담당 MD 유무 (있음 / 없음 / 모름): \n· (해당 시: 결과 문의·거절 사유) 협의 요청서 제출일: 첨부파일로 올려 주세요\n· (해당 시: 담당 MD 있음) 담당 MD에게 요청한 날짜: \n· (해당 시: 결과 문의·거절 사유·MD 요청 5영업일 경과) 협의 대상 상품번호 또는 카테고리, 희망 수수료율: \n· (해당 시: 거절 사유) 거절 안내를 받은 날짜: \n\n문의 내용: ", "mode": "조건별: 표준 수수료율 확인·협의 경로(담당 MD 있음/없음)·요청서 제출 10영업일 이내 결과 대기는 자동답변 종결 / 요청서 10영업일 경과·거절 사유·담당 MD 요청 5영업일 경과·담당 MD 유무 모름은 상담원 배정 / 적용된 수수료 금액 확인은 PA008001로 바꿔 판정", "segs": [{"c": ["A"], "t": "표준 수수료율 확인·협의 경로(담당 MD 있음/없음)·요청서 제출 10영업일 이내 결과 대기는 자동답변 종결"}, {"c": ["C"], "t": "요청서 10영업일 경과·거절 사유·담당 MD 요청 5영업일 경과·담당 MD 유무 모름은 상담원 배정"}, {"c": ["SW"], "t": "적용된 수수료 금액 확인은 PA008001로 바꿔 판정"}], "auto": "(공통 첫인사)\n\n[표준 수수료율 확인]\n표준 수수료율은 판매하시는 상품이 속한 카테고리를 기준으로 적용되며, 카테고리별 수수료율은 [정책] 카테고리별 표준수수료율 상세(https://www.partnerbucketplace.com/hc/ko/articles/19792543852697)에서 확인하실 수 있습니다. 신상품에는 카테고리 표준 수수료가 기본으로 적용되며, 오늘의집과 별도로 합의한 수수료율이 있다면 표준 수수료율보다 우선 적용됩니다.\n\n[수수료율 협의·조정을 원하시는 경우]\n기존에 오늘의집 수수료를 별도로 협의하지 않으셨다면 표준 수수료율이 적용되며, 적용된 수수료율은 협의를 요청하실 수 있습니다.\n- 담당 MD가 있는 파트너님: 담당 MD께 협의를 요청해 주세요. 요청하신 지 5영업일이 지나도 진행되지 않으면 요청일과 협의 대상 상품번호(또는 카테고리), 희망 수수료율을 적어 새 문의로 남겨 주세요.\n- 담당 MD가 없는 파트너님: 수수료 협의 요청서(https://dailyhouse.typeform.com/to/vkxsx0DU)를 작성해 제출해 주세요. 수수료 별도 협의 요청은 영업일 기준 최대 10일 소요될 수 있으며, 협의 요청 시에도 오늘의집 내부 논의 후 조정이 어려울 수 있는 점 참고 부탁드립니다.\n\n[협의 요청서를 제출하고 결과를 기다리시는 경우] (제출일로부터 10영업일 이내)\n수수료 별도 협의 요청은 영업일 기준 최대 10일 소요될 수 있습니다. 결과는 메일로 안내되니 스팸메일함도 함께 확인해 주시고, 제출일로부터 10영업일이 지나도 회신이 없으면 요청서에 적으신 상품번호(또는 카테고리)와 희망 수수료율을 적어 새 문의로 남겨 주세요.\n(요청에 해당하는 단락만, 맺음 A)", "ack": "남겨 주신 내용으로 담당 부서에 확인을 요청드리겠습니다. 확인까지 시간이 걸릴 수 있는 점 양해 부탁드립니다.\n(담당 MD 유무 모름: \"파트너님 샵의 담당 MD 여부를 확인한 뒤 협의 경로를 안내드리겠습니다.\")", "info": "담당 MD 유무(파트너 응답), 협의 대상 상품번호 또는 카테고리, 희망 수수료율, 요청서 제출일 또는 담당 MD 요청일, 거절 안내 수신일", "kms": "055_정산.md, 078_파트너센터_교육자료_정산__수수료.md, 054_기획전___MD.md, 095_커머스_정책_이관_유형_및_이관_방법.md, 049_예비_파트너.md", "check": "1) 원래 기준은 GP(담당 MD 미배정) / GP 외로 경로가 갈림 — 파트너 문구로 '담당 MD 없음 / 있음'으로 바꿈, 파트너 자가 판단에 맡겨도 되는지 확인\n2) 담당 MD 있는 파트너 안내: 055 '담당 MD 메일 주소 안내' vs 054 '담당 MD 연락처 공개 불가' — 1차는 메일 주소 없이 '담당 MD께 요청'으로만 씀\n3) 'MD 요청 후 5영업일 경과' 기준은 095 처리 절차에서 가져온 값 — 파트너에게 안내해도 되는지\n4) 25년 12월 표준수수료 변경 관련 문의 응대 기준 KMS 본문에 없음"}}, {"code": "PA012004", "draft": true, "name": "프로모션·광고", "mid": "운영", "vol": "269", "mode": "안내 후 조건부 상담원 연결", "utter": "기획전 신청하고 싶어요\n상품 쿠폰 만들었는데 발행 중에 할인율을 바꿀 수 있나요?\n네이버에 저희 브랜드 검색하면 파워링크 광고가 뜨는데 내려 주세요", "raw": "1. 네, 파트너님. 프로모션·광고 관련 문의 주셨네요. 어떤 내용이 궁금하신가요?\n[쿠폰] / [기획전·월간자취] / [특가뱃지·모음전·검색 키워드] / [상품광고·오감리뷰 등 광고] / [네이버 파워링크·쇼핑검색 광고]\n\n(쿠폰 → 2-1 / 기획전 → 2-2 / 특가뱃지·모음전·키워드 → 2-3 / 광고 → 2-4 / 네이버 파워링크 → 2-5)\n\n[2-1. 쿠폰]\n2-1. 쿠폰 관련해 어떤 내용이 궁금하신가요?\n[쿠폰 만들기] / [쿠폰 수정·삭제] / [오늘의집이 발행한 쿠폰] / [예산·정산] / [취소·반품 시 쿠폰 연장]\n2-1-1. (쿠폰 만들기) 오로라 > 쿠폰관리 > 쿠폰 등록에서 직접 발행하실 수 있습니다. 파트너님이 발행하실 수 있는 쿠폰은 상품 쿠폰이며, 장바구니 쿠폰은 발행이 불가합니다.\n- 최초 1회 대표계정으로 쿠폰 약관 동의 후, 어느 계정으로든 등록하실 수 있습니다.\n- 정액/정률 할인으로 2일 ~ 31일간 발행하도록 설정할 수 있고, 1개 쿠폰에 판매중/판매대기 상품을 최대 5천 개까지 적용할 수 있습니다.\n- 쿠폰명은 최대 30자이며, 특수문자와 희소성 표현은 쓸 수 없습니다. 기준에 맞지 않으면 삭제/발행 중지될 수 있습니다.\n- 상품쿠폰은 옵션별로 적용되므로, 여러 옵션 판매를 원하시면 1인당 최대 수량을 5개로 설정해 주세요.\n- 발행종료일은 행사 종료일의 다음날 00시로 설정해 주세요. (예: 9월 1일 ~ 9월 5일 행사 → 발행종료일 9월 6일 00시)\n- 1개 상품에는 1개의 상품 쿠폰만 적용되며 할인율이 더 높은 쿠폰이 적용됩니다. 상품 쿠폰과 장바구니 쿠폰은 중복 적용됩니다.\n→ 3\n2-1-2. (쿠폰 수정·삭제) 오로라 > 쿠폰관리 > 쿠폰 조회/수정에서 쿠폰명, 쿠폰ID로 조회해 수정하실 수 있습니다.\n- 발행 전: 모든 항목 수정 및 삭제 가능\n- 발행 가능: 예산, 발행종료일, 적용상품만 수정 가능하며 삭제는 안 되고 발행 중지만 가능 (그 외 항목을 바꾸시려면 발행 중지 후 새로 등록해 주세요)\n발행 중지는 다운로드만 막는 것이라, 중지 전에 고객이 다운로드한 쿠폰은 만료일까지 사용될 수 있습니다.\n→ 3\n2-1-3. (오늘의집이 발행한 쿠폰) 오늘의집에서 발행한 장바구니 쿠폰은 오늘의집 부담만 있습니다. 파트너님이 등록하신 쿠폰은 오로라 > 쿠폰관리 > 쿠폰 조회/수정에서 확인하실 수 있습니다.\n[적용 제외를 원해요] → 2-1-3-1 / [파트너 부담으로 설정된 장바구니 쿠폰이 있어요] → 2-1-3-2 / [오발행 안내 메일을 받았어요] → 2-1-3-3 / [발행 주체·분담률을 확인하고 싶어요] → 2-1-3-4 / [알겠습니다] → 3\n2-1-3-1. 제외를 원하시는 상품번호, 쿠폰명, 사유를 알려 주시겠어요? [내용 입력] → 상담원 인계 (T3-C)\n2-1-3-2. 오설정된 쿠폰일 수 있어 담당부서 확인이 필요합니다. 쿠폰명과 적용 상품번호를 알려 주시겠어요?\n[내용 입력] → 상담원 인계 (T3-C)\n2-1-3-3. 확인을 위해 등록된 상품번호, 받으신 안내 메일 캡처본, 오발행된 상황을 남겨 주시겠어요? 이미 발행된 쿠폰은 사용될 수 있으며, 해당 쿠폰으로 주문이 발생하면 혜택정산 내역을 첨부해 다시 문의 부탁드립니다.\n[내용 입력] → 상담원 인계 (T3-C)\n2-1-3-4. 발행 주체나 분담률은 쿠폰명과 상품번호로 상담원이 확인해 드릴게요. 쿠폰명 또는 상품번호를 알려 주시겠어요?\n[쿠폰명 또는 상품번호 입력] → 상담원 인계 (T3-D)\n2-1-4. (예산·정산) 발행 중단 기준은 실제 사용된 금액 기준이라, 발행된 쿠폰 금액이 예산을 넘어도 사용 금액이 기준 미만이면 발행이 중단되지 않습니다. 발행이 중단되어도 이미 다운로드된 쿠폰은 만료일까지 사용될 수 있어 예산을 넘어 소진될 수 있습니다.\n오로라에서 발행한 쿠폰은 정산차감 방식으로 파트너 정산 시 자동 반영됩니다.\n→ 3\n2-1-5. (취소·반품 시 연장)\n- 입금신청 ~ 결제완료 상태에서 취소: 재발행, 기한 연장 없음\n- 배송준비중 ~ 구매확정 상태에서 반품, 취소/반품승인일 기준 만료일이 지난 경우: 재발행, 취소/반품승인일 +3일 연장 (1회만)\n- 배송준비중 ~ 구매확정 상태에서 반품, 만료일이 지나지 않은 경우: 재발행, 기한 연장 없음\n→ 3\n\n[2-2. 기획전·월간자취]\n2-2. 어떤 내용이 궁금하신가요?\n[기획전 신청·문의] / [월간자취] / [리퍼마켓] / [패키지 할인] / [라이브 쇼핑·자체 행사 지원]\n(기획전 신청·문의 → 담당 MD가 배정되어 있으신가요? [네, 담당 MD가 있어요] → 2-2-1 / [아니요, 담당 MD가 없어요] → 2-2-2 / [잘 모르겠어요] → 2-2-7)\n2-2-1. (기획전, GP 외) 리퍼마켓, 오늘의딜, 오마트, 스페셜 브랜드위크, 단독상품(Only), 오!쇼룸, 오늘의집 세일 페스타, 오늘의집 LIVE 등은 담당 MD가 운영하는 영역이라, 상세 문의·신청·수정은 담당 MD 대표 메일로 문의해 주세요.\n→ 3\n2-2-2. (기획전, GP) 프로모션(기획전)은 아래 신청서로 직접 신청하실 수 있습니다.\n프로모션(기획전) 신청서: https://dailyhouse.typeform.com/to/A6kQJk9B\n내부 검토 후 결과를 안내드리며, 결과 안내까지 영업일 기준 10일 정도 소요됩니다. 제출 후에는 수정이 불가하니 꼼꼼히 확인 후 제출해 주세요.\n승인된 기획전은 PC는 오늘의집 > 쇼핑 탭 > 기획전, 모바일 앱은 오늘의집 > 쇼핑 전체 메뉴 > 특가/혜택에 노출됩니다.\n[이미 신청했는데 확인·수정이 필요해요] → 신청하신 상품번호(또는 모음전 코드)와 요청 내용을 알려 주시겠어요? [내용 입력] → 상담원 인계 (T3-C)\n[알겠습니다] → 3\n2-2-3. (월간자취) 월간자취는 오늘의집 담당부서에서 대상을 선정해 파트너사 영업 담당자 메일로 참여 안내를 드리고 있습니다. 메일의 바로가기에서 기한 내 신청서를 제출해 주세요. 신청·선정 일정은 해당 월 월간자취 공지 기준으로 안내됩니다.\n- 행사 기간 내 최저가 유지가 필수이며, 판매가 수정 또는 행사기간 상품 쿠폰 발행으로 맞추실 수 있습니다.\n- 선정 시 개별 메일로 안내드리며, 미선정 시 별도 안내는 없습니다. 결과 메일을 받지 못하셨다면 행사기간으로 발행해 둔 쿠폰은 삭제하시면 됩니다.\n- 이전에 선정된 이력이 있는 상품도 신청은 가능하나 선정 확률이 낮아질 수 있습니다. 해외직구 상품도 신청 가능합니다.\n[선정 메일 확인·상품 제외·안내 메일 미수신] → 확인할 상품번호와 요청 내용을 알려 주시겠어요? [내용 입력] → 상담원 인계 (T3-C)\n[알겠습니다] → 3\n2-2-4. (리퍼마켓) 참여 방법은 매월 오로라 > 기타 > 공지사항에서 '리퍼'로 검색해 해당 월 공지에서 확인하실 수 있습니다. 취합 일정 내 리퍼마켓 견적서를 담당 MD에게 접수해 주시면 되며, 카테고리 담당 MD가 있는 경우에만 참여 가능합니다. 기간이 지난 건은 다음 리퍼마켓에 신청 부탁드리며, 진행 확정된 상품만 개별 회신드립니다.\n→ 3\n2-2-5. (패키지 할인) 패키지 할인은 오늘의집이 자체적으로 진행하는 고객 대상 추가 할인으로, 할인 금액은 오늘의집이 100% 부담해 정산금에 영향이 없습니다. 별도 신청이나 대상 상품 추가는 어려우며, 적용 기준은 상세 안내가 어려운 점 양해 부탁드립니다. 할인 내역은 오로라 > 정산관리 > 정산내역 상세의 혜택정산 '패키지 할인' 항목에서 확인하실 수 있습니다.\n[적용 상품에서 제외하고 싶어요] → 제외하실 상품번호를 알려 주시면 유관부서 확인 후 안내드리겠습니다. [상품번호 입력] → 상담원 인계 (T3-C)\n[알겠습니다] → 3\n2-2-6. (라이브 쇼핑·자체 행사) 오늘의집 라이브 쇼핑은 내부 담당부서에서 선정해 진행하며 현재 별도 신청은 받지 않습니다. 파트너님 자체 행사에 대한 페이백·포인트 지급 지원 정책은 없는 점 양해 부탁드립니다.\n→ 3\n2-2-7. (담당 MD 여부 모름) 담당 MD 배정 여부에 따라 기획전 신청 경로가 달라 확인이 필요합니다. 기획전에 참여하려는 상품번호(또는 카테고리)를 알려 주시겠어요?\n[상품번호 또는 카테고리 입력]\n담당 MD 배정 여부 확인을 위해 상담원에게 연결해 드릴게요. → 상담원 인계 (T3-D)\n\n[2-3. 특가뱃지·모음전·검색 키워드]\n2-3. 어떤 내용이 궁금하신가요?\n[특가뱃지] / [only 뱃지] / [모음전 신청·수정·삭제] / [모음전 구성 상품 확인] / [검색 키워드 등록] / [등록된 검색 키워드 확인] / [검색 결과에 관련 없는 상품 노출]\n2-3-1. (특가뱃지) 특가뱃지는 오늘의집 내부 담당부서에서 선정해 진행하며 현재 별도 신청은 받지 않습니다. 특가뱃지는 상시 부착이 아니라 최대 1주일 간격으로 부착되어 가격 변동이 없어도 일시적으로 떨어질 수 있고, 별도 신청 없이 자동으로 탈부착될 수도 있습니다.\n담당 MD가 있는 파트너님은 담당 MD 대표 메일로 문의해 주세요.\n[사라진 지 2영업일이 지났어요 / 뱃지를 떼고 싶어요] → 상품번호와 요청 내용(재부착 또는 제거)·사유를 알려 주시겠어요? [내용 입력] → 상담원 인계 (T3-C)\n[알겠습니다] → 사라진 뒤 2영업일이 지나도 재부착되지 않으면 다시 문의 부탁드립니다. → 3\n2-3-2. (only 뱃지) only 뱃지는 별도 부서에서 검토·선정하고 있어 선정 기준은 상세 안내가 어려운 점 양해 부탁드립니다.\n[해지를 원해요] → 해지하실 상품번호를 알려 주시겠어요? [상품번호 입력] → 상담원 인계 (T3-C)\n[알겠습니다] → 3\n2-3-3. (모음전 신청·수정·삭제) 모음전 신규 생성·수정은 양식을 다운로드해 신청서 폼에 첨부해 주시고, 삭제는 신청서 폼에 삭제할 모음전 URL을 입력해 제출해 주세요.\n모음전 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29684363330713\n- 판매중/품절 상품만, 같은 브랜드·같은 샵 상품만 묶을 수 있습니다.\n- 희망일·지정일 배송, 주문제작, 주문메모가 필요한 상품과 시공·상담·회원전용 상품은 설정할 수 없습니다.\n- 선결제 상품은 배송비가 모두 같아야 하고, 조건부 무료배송 상품은 무료/유료 배송비 기준이 같아야 합니다.\n- 대표 이미지(필수)는 가로 1440px 권장, JPG·JPEG·PNG만 가능합니다(GIF 불가).\n- 모음전 브랜드명을 바꾸시려면 기존 모음전 삭제 후 신규 신청해 주세요.\n신청 후 처리까지 영업일 기준 최대 5일 소요되며, 결과는 신청서에 기재하신 메일로 안내됩니다. 접수된 신청은 취소할 수 없어 수정 요청으로 재신청해 주셔야 합니다.\n(모음전 키워드 등록을 원하면 → 2-3-3-1 / 그 외 → 3)\n2-3-3-1. (모음전 키워드 등록) 담당 MD가 배정되어 있으신가요?\n[네, 담당 MD가 있어요] → 모음전 키워드 등록은 담당 MD 대표 메일로 문의해 주세요. → 3\n[아니요, 담당 MD가 없어요] → 모음전 상품번호와 등록할 키워드(띄어쓰기 포함 최대 100자)를 알려 주시겠어요? [내용 입력] → 상담원 인계 (T3-A)\n[잘 모르겠어요] → 모음전 상품번호와 등록할 키워드(띄어쓰기 포함 최대 100자)를 알려 주시겠어요? [내용 입력] 담당 MD 배정 여부 확인이 필요해 상담원에게 연결해 드릴게요. → 상담원 인계 (T3-D)\n2-3-4. (모음전 구성 상품 확인) 모음전에 구성된 상품은 오로라에서 확인하실 수 없습니다. 모음전 페이지 주소창의 숫자 부분이 모음전 코드입니다. 모음전 코드를 알려 주시겠어요?\n[모음전 코드 입력]\n구성 상품 확인을 위해 상담원에게 연결해 드릴게요. → 상담원 인계 (T3-D)\n2-3-5. (검색 키워드 등록) 검색 키워드는 양식을 다운로드해 신청서 폼으로 신청하실 수 있습니다.\n검색 키워드 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29759702526233\n- 키워드는 띄어쓰기로 구분하며 쉼표·특수문자는 쓸 수 없습니다.\n- 상품명/브랜드/카테고리/옵션에 이미 있는 키워드, 오탈자, 미완성 키워드, 상품 정보와 다른 키워드는 등록되지 않습니다.\n- 타사 브랜드, 최저가·1위·최고 같은 배타적 표현, 특가·쿠폰적용 같은 가격 표현, 무료배송·오늘출발 같은 배송 표현은 등록할 수 없습니다.\n- 띄어쓰기 포함 최대 191자, 최대 2000행까지 등록 가능하며 샵ID와 샵명을 정확히 입력해 주세요(불일치 시 반려).\n- 수정 요청 시에는 등록이 필요한 전체 키워드를 기재해 신청해 주세요.\n신청 후 5영업일 이내 적용되며, 결과는 기재하신 메일로 발송됩니다.\n→ 3\n2-3-6. (등록된 키워드 확인) 상품에 등록된 검색 키워드는 오로라에서 확인하실 수 없어 대신 확인해 드릴게요. 확인하실 상품번호를 알려 주시겠어요?\n[상품번호 입력]\n(5건 미만 → 등록된 키워드 확인을 위해 상담원에게 연결해 드릴게요. → 상담원 인계 (T3-D))\n(5건 이상 → 확인에 시간이 걸릴 수 있어 담당부서에 요청해 드릴게요. → 상담원 인계 (T3-C, 관리자 이관))\n2-3-7. (관련 없는 상품 노출) 오늘의집 검색은 내부 로직에 따라 노출되어 비슷한 상품명·브랜드명의 상품이 함께 노출될 수 있으며, 타사 상품이 파트너님 상품보다 상단에 노출되는 경우가 아니면 비노출 처리는 어렵습니다. PC·모바일 노출 순위도 내부 로직으로 정해지며 구체적인 내용은 공유가 어려운 점 양해 부탁드립니다.\n[검색어와 전혀 관련 없는 상품이 나와요] → 검색 키워드가 잘못 등록되었을 수 있어 확인이 필요합니다. 검색하신 키워드와 노출된 상품번호를 알려 주시겠어요? [내용 입력] → 상담원 인계 (T3-C)\n[알겠습니다] → 3\n\n[2-4. 상품광고·오감리뷰 등 광고]\n2-4. 어떤 광고 관련 문의이신가요?\n[상품광고·배너광고·스타일링샷광고·오하우스애즈] / [스토어 채널 광고(PLP배너·전면배너·앱 푸시 등)·브랜드 광고·오쇼룸] / [오감리뷰·크리에이터 플러스] / [기타 광고·대행사 확인]\n2-4-1. (상품광고 등) 어떤 내용이 궁금하신가요?\n[광고비 충전] / [입금했는데 충전 미반영] / [광고 미노출] / [광고 계정 비활성화] / [그 외]\n- 광고비 충전: 카드 결제 또는 무통장입금으로 충전하실 수 있습니다.\n- 충전 미반영: ad_product@bucketplace.net으로 입금일시, 입금금액 등 입금 증빙과 함께 메일 부탁드립니다.\n- 광고 미노출: 오로라 > 상품관리 > 상품 조회/수정에서 상품번호로 '판매중' 상태인지 확인해 주세요. 품절 등으로 판매가 중단된 상품은 광고 게재가 중단될 수 있습니다. 해당 사유가 아니면 ad_product@bucketplace.net으로 문의 부탁드립니다. 상품광고는 모바일 앱에서만 노출되어 PC에서는 확인되지 않습니다.\n- 계정 비활성화: 오하우스애즈·배너광고는 잔액이 2천원 미만이 되면 자동으로 비활성화됩니다. 광고비를 충전하시면 활성화하실 수 있으며, 잔액이 충분하거나 충전 후에도 비활성화 상태라면 ad_product@bucketplace.net으로 문의 부탁드립니다.\n- 그 외(가상계좌 등): 파트너센터에서는 광고 관련 단순 안내만 가능해, 카카오톡 '오늘의집 광고센터' 또는 ad_product@bucketplace.net으로 문의 부탁드립니다. 광고 상품 정보는 https://ohouse-ad.oopy.io/에서 확인하실 수 있습니다.\n→ 3\n2-4-2. (스토어 채널 광고 등) 담당 MD가 배정되어 있으신가요?\n[네, 담당 MD가 있어요] → 해당 광고는 카카오톡 '오늘의집 커머스 광고센터' 또는 commerce_ad@bucketplace.net으로 문의 부탁드립니다. → 3\n[아니요, 담당 MD가 없어요] → 해당 광고 타입은 MD 배정 이후 진행이 가능합니다. MD 배정 이후 신청을 부탁드립니다. 오늘의집 MD 배정은 월별 운영 계획에 따라 진행되고 있으며, 내부 운영 리소스가 제한적인 상황으로 광고 진행이 제한될 수 있는 점 양해 부탁드립니다. → 3\n[잘 모르겠어요] → 문의하실 광고 종류와 상품번호(또는 카테고리)를 알려 주시겠어요? [내용 입력] 담당 MD 배정 여부 확인을 위해 상담원에게 연결해 드릴게요. → 상담원 인계 (T3-D)\n2-4-3. (오감리뷰) 오감리뷰는 오늘의집 크리에이터가 직접 제품을 경험한 뒤 스타일링샷 이미지와 텍스트 리뷰를 생산하는 체험단 광고 상품입니다. 신청은 오로라 → 오로라 광고 관리 탭 → 크리에이터 플러스에서 하실 수 있으며, 모집은 주 1회 진행됩니다.\n- 루키: 인당 3만 원, 판매가 20만원 이하 상품, 오늘의집 스토어 리뷰, 오늘의집 내부 지면 활용\n- 프로: 인당 20만 원, 판매가 5만원 이상 상품, 스타일링샷 + 스토어 리뷰, 오늘의집 내부 지면·자사몰·SNS 광고 활용 (선택: 숏폼 콘텐츠 인당 15만 원)\n오감리뷰 이미지는 별도 비용 없이 오늘의집 상품 썸네일·상세페이지, 자사몰, 공식 SNS 게시글·광고 소재에 활용하실 수 있으나 타 커머스 플랫폼에는 쓸 수 없고, 출처(예: 오늘의집 000님의 오감리뷰)를 반드시 표기해 주셔야 합니다. 게재보고서에 기재된 게시글만 활용 가능하며, 오프라인 제작물은 사전 동의 요청이 필요합니다.\n자세한 문의는 creatorplus_partner@bucketplace.net으로 부탁드립니다. (크리에이터 플러스 브랜드 페이지: https://ohouse-creatorplus-brand.oopy.io/)\n→ 3\n2-4-4. (기타) 어떤 내용이신가요?\n[챌린지 광고] / [유튜브 콘텐츠 광고] / [오프하우스] / [광고 대행사 확인] / [통합광고계약서 입금 계좌]\n- 챌린지 광고: oh.challenge@bucketplace.net으로 문의 부탁드립니다.\n- 유튜브 콘텐츠 광고: ohouse_youtube@bucketplace.net으로 문의 부탁드립니다.\n- 오프하우스: 파트너사 전용 카카오톡 문의채널(http://pf.kakao.com/_FixnBn) 또는 offhouse@bucketplace.net으로 문의 부탁드립니다.\n- 광고 대행사 확인: https://ohouse-ad.oopy.io/agency에서 공식 대행사 목록을 확인하실 수 있습니다. 연락받으신 대행사명을 알려 주시면 함께 확인해 드릴게요. → (대행사명 확인 후 안내) → 3\n- 통합광고계약서 입금 계좌: 담당부서 확인이 필요해 상담원에게 연결해 드릴게요. → 상담원 인계 (T3-C)\n→ 3\n\n[2-5. 네이버 파워링크·쇼핑검색 광고]\n2-5. 어떤 광고 노출을 중지하고 싶으신가요?\n[네이버 파워링크(키워드 검색 광고)] / [네이버 쇼핑검색 광고]\n2-5-1. (파워링크) 네이버에서 검색 시 파워링크로 상품이나 브랜드가 광고 노출되는 건의 중단을 요청하시는 거죠. 확인을 위해 아래 내용을 알려 주시겠어요?\n1) 중단 범위: 브랜드 전체 / 개별 키워드\n2) 상품번호, 브랜드명\n3) 검색 키워드\n4) 중단 요청 사유\n[내용 입력]\n요청하신 내용은 담당부서에 전달드리며, 요청 후에도 삭제까지 시일이 소요될 수 있는 점 양해 부탁드립니다.\n→ 상담원 인계 (T3-C, 심층문의 매크로로 접수하고 실제 처리는 관리자)\n2-5-2. (쇼핑검색 광고) 네이버 쇼핑검색 광고는 네이버 시스템 로직에 따라 자동으로 설정·노출되는 부분으로 오늘의집 영역이 아닙니다. 노출 중지(광고 제외)를 원하시면 상품번호를 알려 주세요. 광고 자체에 대한 상세 문의는 네이버 측으로 부탁드립니다.\n[상품번호, 중지 사유 입력]\n→ 상담원 인계 (T3-C, 심층문의 매크로로 접수하고 실제 처리는 관리자)\n(네이버 쇼핑 노출/비노출·원부매칭 등 광고가 아닌 네이버 연동 문의면 → 해당 상품 관리 유형으로 전환)\n\n3. 더 궁금하신 점이 있으신가요?\n[아니요] → 상담 종료 (유형: PA012004)\n[네] → 1", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 프로모션·광고 관련 문의<br/>주셨네요. 어떤 내용이 궁금하신가요?\"]:::bot\nN2_1[\"<b>2-1<\/b> 쿠폰 관련해 어떤 내용이 궁금하신가요?\"]:::bot\nN2_1_1[\"<b>2-1-1<\/b> (쿠폰 만들기) 오로라 › 쿠폰관리 › 쿠폰<br/>등록에서 직접 발행하실 수 있습니다.<br/>파트너님이 발행하실 수 있는 쿠폰은 상품<br/>쿠폰이며, 장바구니 쿠폰은 발행이<br/>불가합니다.\"]:::bot\nN2_1_2[\"<b>2-1-2<\/b> (쿠폰 수정·삭제) 오로라 › 쿠폰관리 ›<br/>쿠폰 조회/수정에서 쿠폰명, 쿠폰ID로<br/>조회해 수정하실 수 있습니다.\"]:::bot\nN2_1_3[\"<b>2-1-3<\/b> (오늘의집이 발행한 쿠폰) 오늘의집에서<br/>발행한 장바구니 쿠폰은 오늘의집 부담만<br/>있습니다. 파트너님이 등록하신 쿠폰은 오로라<br/>› 쿠폰관리 › 쿠폰 조회/수정에서 확인하실<br/>수 있습니다.\"]:::bot\nN2_1_3_1[\"<b>2-1-3-1<\/b> 제외를 원하시는 상품번호, 쿠폰명, 사유를<br/>알려 주시겠어요?\"]:::bot\nN2_1_3_2[\"<b>2-1-3-2<\/b> 오설정된 쿠폰일 수 있어 담당부서 확인이<br/>필요합니다. 쿠폰명과 적용 상품번호를 알려<br/>주시겠어요?\"]:::bot\nN2_1_3_3[\"<b>2-1-3-3<\/b> 확인을 위해 등록된 상품번호, 받으신 안내<br/>메일 캡처본, 오발행된 상황을 남겨<br/>주시겠어요? 이미 발행된 쿠폰은 사용될 수<br/>있으며, 해당 쿠폰으로 주문이 발생하면<br/>혜택정산 내역을 첨부해 다시 문의<br/>부탁드립니다.\"]:::bot\nN2_1_3_4[\"<b>2-1-3-4<\/b> 발행 주체나 분담률은 쿠폰명과 상품번호로<br/>상담원이 확인해 드릴게요. 쿠폰명 또는<br/>상품번호를 알려 주시겠어요?\"]:::bot\nN2_1_4[\"<b>2-1-4<\/b> (예산·정산) 발행 중단 기준은 실제 사용된<br/>금액 기준이라, 발행된 쿠폰 금액이 예산을<br/>넘어도 사용 금액이 기준 미만이면 발행이<br/>중단되지 않습니다. 발행이 중단되어도 이미<br/>다운로드된 쿠폰은 만료일까지 사용될 수 있어<br/>예산을 넘어 소진될 수 있습니다.\"]:::bot\nN2_1_5[\"<b>2-1-5<\/b> (취소·반품 시 연장)\"]:::bot\nN2_2[\"<b>2-2<\/b> 어떤 내용이 궁금하신가요?\"]:::bot\nN2_2_1[\"<b>2-2-1<\/b> (기획전, GP 외) 리퍼마켓, 오늘의딜,<br/>오마트, 스페셜 브랜드위크,<br/>단독상품(Only), 오!쇼룸, 오늘의집<br/>세일 페스타, 오늘의집 LIVE 등은 담당<br/>MD가 운영하는 영역이라, 상세<br/>문의·신청·수정은 담당 MD 대표 메일로<br/>문의해 주세요.\"]:::bot\nN2_2_2[\"<b>2-2-2<\/b> (기획전, GP) 프로모션(기획전)은 아래<br/>신청서로 직접 신청하실 수 있습니다.\"]:::bot\nN2_2_3[\"<b>2-2-3<\/b> (월간자취) 월간자취는 오늘의집 담당부서에서<br/>대상을 선정해 파트너사 영업 담당자 메일로<br/>참여 안내를 드리고 있습니다. 메일의<br/>바로가기에서 기한 내 신청서를 제출해<br/>주세요. 신청·선정 일정은 해당 월 월간자취<br/>공지 기준으로 안내됩니다.\"]:::bot\nN2_2_4[\"<b>2-2-4<\/b> (리퍼마켓) 참여 방법은 매월 오로라 ›<br/>기타 › 공지사항에서 '리퍼'로 검색해 해당<br/>월 공지에서 확인하실 수 있습니다. 취합<br/>일정 내 리퍼마켓 견적서를 담당 MD에게<br/>접수해 주시면 되며, 카테고리 담당 MD가<br/>있는 경우에만 참여 가능합니다. 기간이 지난<br/>건은 다음 리퍼마켓에 신청 부탁드리며, 진행<br/>확정된 상품만 개별 회신드립니다.\"]:::bot\nN2_2_5[\"<b>2-2-5<\/b> (패키지 할인) 패키지 할인은 오늘의집이<br/>자체적으로 진행하는 고객 대상 추가<br/>할인으로, 할인 금액은 오늘의집이 100%<br/>부담해 정산금에 영향이 없습니다. 별도<br/>신청이나 대상 상품 추가는 어려우며, 적용<br/>기준은 상세 안내가 어려운 점 양해<br/>부탁드립니다. 할인 내역은 오로라 ›<br/>정산관리 › 정산내역 상세의 혜택정산<br/>'패키지 할인' 항목에서 확인하실 수<br/>있습니다.\"]:::bot\nN2_2_6[\"<b>2-2-6<\/b> (라이브 쇼핑·자체 행사) 오늘의집 라이브<br/>쇼핑은 내부 담당부서에서 선정해 진행하며<br/>현재 별도 신청은 받지 않습니다. 파트너님<br/>자체 행사에 대한 페이백·포인트 지급 지원<br/>정책은 없는 점 양해 부탁드립니다.\"]:::bot\nN2_2_7[\"<b>2-2-7<\/b> (담당 MD 여부 모름) 담당 MD 배정<br/>여부에 따라 기획전 신청 경로가 달라 확인이<br/>필요합니다. 기획전에 참여하려는<br/>상품번호(또는 카테고리)를 알려 주시겠어요?\"]:::bot\nN2_3[\"<b>2-3<\/b> 어떤 내용이 궁금하신가요?\"]:::bot\nN2_3_1[\"<b>2-3-1<\/b> (특가뱃지) 특가뱃지는 오늘의집 내부<br/>담당부서에서 선정해 진행하며 현재 별도<br/>신청은 받지 않습니다. 특가뱃지는 상시<br/>부착이 아니라 최대 1주일 간격으로 부착되어<br/>가격 변동이 없어도 일시적으로 떨어질 수<br/>있고, 별도 신청 없이 자동으로 탈부착될<br/>수도 있습니다.\"]:::bot\nN2_3_2[\"<b>2-3-2<\/b> (only 뱃지) only 뱃지는 별도<br/>부서에서 검토·선정하고 있어 선정 기준은<br/>상세 안내가 어려운 점 양해 부탁드립니다.\"]:::bot\nN2_3_3[\"<b>2-3-3<\/b> (모음전 신청·수정·삭제) 모음전 신규<br/>생성·수정은 양식을 다운로드해 신청서 폼에<br/>첨부해 주시고, 삭제는 신청서 폼에 삭제할<br/>모음전 URL을 입력해 제출해 주세요.\"]:::bot\nN2_3_3_1[\"<b>2-3-3-1<\/b> (모음전 키워드 등록) 담당 MD가 배정되어<br/>있으신가요?\"]:::bot\nN2_3_4[\"<b>2-3-4<\/b> (모음전 구성 상품 확인) 모음전에 구성된<br/>상품은 오로라에서 확인하실 수 없습니다.<br/>모음전 페이지 주소창의 숫자 부분이 모음전<br/>코드입니다. 모음전 코드를 알려 주시겠어요?\"]:::bot\nN2_3_5[\"<b>2-3-5<\/b> (검색 키워드 등록) 검색 키워드는 양식을<br/>다운로드해 신청서 폼으로 신청하실 수<br/>있습니다.\"]:::bot\nN2_3_6[\"<b>2-3-6<\/b> (등록된 키워드 확인) 상품에 등록된 검색<br/>키워드는 오로라에서 확인하실 수 없어 대신<br/>확인해 드릴게요. 확인하실 상품번호를 알려<br/>주시겠어요?\"]:::bot\nN2_3_7[\"<b>2-3-7<\/b> (관련 없는 상품 노출) 오늘의집 검색은<br/>내부 로직에 따라 노출되어 비슷한<br/>상품명·브랜드명의 상품이 함께 노출될 수<br/>있으며, 타사 상품이 파트너님 상품보다<br/>상단에 노출되는 경우가 아니면 비노출 처리는<br/>어렵습니다. PC·모바일 노출 순위도 내부<br/>로직으로 정해지며 구체적인 내용은 공유가<br/>어려운 점 양해 부탁드립니다.\"]:::bot\nN2_4[\"<b>2-4<\/b> 어떤 광고 관련 문의이신가요?\"]:::bot\nN2_4_1[\"<b>2-4-1<\/b> (상품광고 등) 어떤 내용이 궁금하신가요?\"]:::bot\nN2_4_2[\"<b>2-4-2<\/b> (스토어 채널 광고 등) 담당 MD가<br/>배정되어 있으신가요?\"]:::bot\nN2_4_3[\"<b>2-4-3<\/b> (오감리뷰) 오감리뷰는 오늘의집 크리에이터가<br/>직접 제품을 경험한 뒤 스타일링샷 이미지와<br/>텍스트 리뷰를 생산하는 체험단 광고<br/>상품입니다. 신청은 오로라\"]:::bot\nN2_4_4[\"<b>2-4-4<\/b> (기타) 어떤 내용이신가요?\"]:::bot\nN2_5[\"<b>2-5<\/b> 어떤 광고 노출을 중지하고 싶으신가요?\"]:::bot\nN2_5_1[\"<b>2-5-1<\/b> (파워링크) 네이버에서 검색 시 파워링크로<br/>상품이나 브랜드가 광고 노출되는 건의 중단을<br/>요청하시는 거죠. 확인을 위해 아래 내용을<br/>알려 주시겠어요?\"]:::bot\nN2_5_2[\"<b>2-5-2<\/b> (쇼핑검색 광고) 네이버 쇼핑검색 광고는<br/>네이버 시스템 로직에 따라 자동으로<br/>설정·노출되는 부분으로 오늘의집 영역이<br/>아닙니다. 노출 중지(광고 제외)를 원하시면<br/>상품번호를 알려 주세요. 광고 자체에 대한<br/>상세 문의는 네이버 측으로 부탁드립니다.\"]:::bot\nN3[\"<b>3<\/b> 더 궁금하신 점이 있으신가요?\"]:::bot\nS --> N1\nN1 -->|\"쿠폰\"| N2_1\nN1 -->|\"기획전\"| N2_2\nN1 -->|\"특가뱃지·모음전·키워드\"| N2_3\nN1 -->|\"광고\"| N2_4\nN1 -->|\"네이버 파워링크\"| N2_5\nN1 -->|\"2-1. 쿠폰\"| N2_1\nN2_1_1 --> N3\nN2_1_2 --> N3\nN2_1_3 -->|\"적용 제외를 원해요\"| N2_1_3_1\nN2_1_3 -->|\"파트너 부담으로 설정된 장바구니 쿠폰이<br/>있어요\"| N2_1_3_2\nN2_1_3 -->|\"오발행 안내 메일을 받았어요\"| N2_1_3_3\nN2_1_3 -->|\"발행 주체·분담률을 확인하고 싶어요\"| N2_1_3_4\nN2_1_3 -->|\"알겠습니다\"| N3\nN2_1_3_1 -->|\"내용 입력\"| HO_T3C\nN2_1_3_2 -->|\"내용 입력\"| HO_T3C\nN2_1_3_3 -->|\"내용 입력\"| HO_T3C\nN2_1_3_4 -->|\"쿠폰명 또는 상품번호 입력\"| HO_T3D\nN2_1_4 --> N3\nN2_1_5 --> N3\nN2_1_5 -->|\"2-2. 기획전·월간자취\"| N2_2\nN2_2 -->|\"기획전 신청·문의\"| TX2\nN2_2 -->|\"아니요, 담당 MD가 없어요\"| N2_2_2\nN2_2 -->|\"잘 모르겠어요\"| N2_2_7\nN2_2_1 --> N3\nN2_2_2 -->|\"이미 신청했는데 확인·수정이 필요해요\"| HO_T3C\nN2_2_2 -->|\"알겠습니다\"| N3\nN2_2_3 -->|\"선정 메일 확인·상품 제외·안내 메일 미수신\"| HO_T3C\nN2_2_3 -->|\"알겠습니다\"| N3\nN2_2_4 --> N3\nN2_2_5 -->|\"적용 상품에서 제외하고 싶어요\"| HO_T3C\nN2_2_5 -->|\"알겠습니다\"| N3\nN2_2_6 --> N3\nN2_2_7 -->|\"2-3. 특가뱃지·모음전·검색 키워드\"| N2_3\nN2_3_1 -->|\"뱃지를 떼고 싶어요\"| HO_T3C\nN2_3_1 -->|\"알겠습니다\"| TX3\nN2_3_2 -->|\"해지를 원해요\"| HO_T3C\nN2_3_2 -->|\"알겠습니다\"| N3\nN2_3_3 -->|\"모음전 키워드 등록을 원하면\"| N2_3_3_1\nN2_3_3 -->|\"그 외\"| N3\nN2_3_3_1 -->|\"네, 담당 MD가 있어요\"| TX4\nN2_3_3_1 -->|\"아니요, 담당 MD가 없어요\"| HO_T3A\nN2_3_3_1 -->|\"잘 모르겠어요\"| HO_T3D\nN2_3_4 -->|\"모음전 코드 입력\"| N2_3_5\nN2_3_5 --> N3\nN2_3_6 -->|\"5건 미만\"| HO_T3D\nN2_3_6 -->|\"5건 이상\"| HO_T3C\nN2_3_6 -->|\"상품번호 입력\"| N2_3_7\nN2_3_7 -->|\"검색어와 전혀 관련 없는 상품이 나와요\"| HO_T3C\nN2_3_7 -->|\"알겠습니다\"| N3\nN2_3_7 -->|\"2-4. 상품광고·오감리뷰 등 광고\"| N2_4\nN2_4_1 --> N3\nN2_4_1 -->|\"광고비 충전 / 입금했는데 충전 미반영 /<br/>광고 미노출 / 광고 계정 비활성화 / 그<br/>외\"| N2_4_2\nN2_4_2 -->|\"네, 담당 MD가 있어요\"| TX6\nN2_4_2 -->|\"아니요, 담당 MD가 없어요\"| TX7\nN2_4_2 -->|\"잘 모르겠어요\"| HO_T3D\nN2_4_3 --> TX8\nN2_4_3 --> N3\nN2_4_4 --> N3\nN2_4_4 -->|\"2-5. 네이버 파워링크·쇼핑검색 광고\"| N2_5\nN2_5_1 --> HO_T3C\nN2_5_1 -->|\"내용 입력\"| N2_5_2\nN2_5_2 --> HO_T3C\nN2_5_2 -->|\"네이버 쇼핑 노출/비노출·원부매칭 등 광고가<br/>아닌 네이버 연동 문의면\"| SWX9\nN2_5_2 -->|\"상품번호, 중지 사유 입력\"| N3\nN3 -->|\"아니요\"| END\nN3 -->|\"네\"| N1\nN2_1 --> N2_1_1\nN2_3 --> N2_3_1\nN2_4 --> N2_4_1\nN2_5 --> N2_5_1\nN2_1_1 -.-> N2_1_2\nN2_1_2 -.-> N2_1_3\nN2_1_3_4 -.-> N2_1_4\nN2_1_4 -.-> N2_1_5\nN2_2 -.-> N2_2_1\nN2_2_2 -.-> N2_2_3\nN2_2_3 -.-> N2_2_4\nN2_2_4 -.-> N2_2_5\nN2_2_5 -.-> N2_2_6\nN2_3_1 -.-> N2_3_2\nN2_3_2 -.-> N2_3_3\nN2_3_3_1 -.-> N2_3_4\nN2_3_5 -.-> N2_3_6\nN2_4_2 -.-> N2_4_3\nN2_4_3 -.-> N2_4_4\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nHO_T3D([\"상담원 인계<br/>개별 조회 필요\"]):::ho\nTX2[\"담당 MD가 배정되어<br/>있으신가요? [네, 담당<br/>MD가 있어요] →<br/>2-2-1\"]:::txt\nTX3[\"사라진 뒤 2영업일이<br/>지나도 재부착되지 않으면<br/>다시 문의 부탁드립니다.<br/>→ 3\"]:::txt\nTX4[\"모음전 키워드 등록은 담당<br/>MD 대표 메일로 문의해<br/>주세요. → 3\"]:::txt\nHO_T3A([\"상담원 인계<br/>실행 요청\"]):::ho\nTX6[\"해당 광고는 카카오톡<br/>'오늘의집 커머스<br/>광고센터' 또는<br/>commerce_ad@bucketplace.net으로<br/>문의 부탁드립니다. → 3\"]:::txt\nTX7[\"해당 광고 타입은 MD<br/>배정 이후 진행이<br/>가능합니다. MD 배정<br/>이후 신청을 부탁드립니다.<br/>오늘의집 MD 배정은 월별<br/>운영 계획에 따라 진행되고<br/>있으며, 내부 운영<br/>리소스가 제한적인 상황으로<br/>광고 진행이 제한될 수<br/>있는 점 양해<br/>부탁드립니다. → 3\"]:::txt\nTX8[\"오로라 광고 관리 탭 →<br/>크리에이터 플러스에서 하실<br/>수 있으며, 모집은 주<br/>1회 진행됩니다.\"]:::txt\nSWX9[/\"해당 상품 관리 유형으로<br/>전환\"/]:::sw\nEND([\"상담 종료\"]):::fin", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 프로모션·광고 관련 문의 주셨네요. 어떤 내용이 궁금하신가요?", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "쿠폰 관련해 어떤 내용이 궁금하신가요?", "sec": false, "body": []}, {"k": "2-1-1", "id": "2-1-1", "t": "(쿠폰 만들기) 오로라 > 쿠폰관리 > 쿠폰 등록에서 직접 발행하실 수 있습니다. 파트너님이 발행하실 수 있는 쿠폰은 상품 쿠폰이며, 장바구니 쿠폰은 발행이 불가합니다.", "sec": false, "body": ["- 최초 1회 대표계정으로 쿠폰 약관 동의 후, 어느 계정으로든 등록하실 수 있습니다.", "- 정액/정률 할인으로 2일 ~ 31일간 발행하도록 설정할 수 있고, 1개 쿠폰에 판매중/판매대기 상품을 최대 5천 개까지 적용할 수 있습니다.", "- 쿠폰명은 최대 30자이며, 특수문자와 희소성 표현은 쓸 수 없습니다. 기준에 맞지 않으면 삭제/발행 중지될 수 있습니다.", "- 상품쿠폰은 옵션별로 적용되므로, 여러 옵션 판매를 원하시면 1인당 최대 수량을 5개로 설정해 주세요.", "- 발행종료일은 행사 종료일의 다음날 00시로 설정해 주세요. (예: 9월 1일 ~ 9월 5일 행사 → 발행종료일 9월 6일 00시)", "- 1개 상품에는 1개의 상품 쿠폰만 적용되며 할인율이 더 높은 쿠폰이 적용됩니다. 상품 쿠폰과 장바구니 쿠폰은 중복 적용됩니다."]}, {"k": "2-1-2", "id": "2-1-2", "t": "(쿠폰 수정·삭제) 오로라 > 쿠폰관리 > 쿠폰 조회/수정에서 쿠폰명, 쿠폰ID로 조회해 수정하실 수 있습니다.", "sec": false, "body": ["- 발행 전: 모든 항목 수정 및 삭제 가능", "- 발행 가능: 예산, 발행종료일, 적용상품만 수정 가능하며 삭제는 안 되고 발행 중지만 가능 (그 외 항목을 바꾸시려면 발행 중지 후 새로 등록해 주세요)", "발행 중지는 다운로드만 막는 것이라, 중지 전에 고객이 다운로드한 쿠폰은 만료일까지 사용될 수 있습니다."]}, {"k": "2-1-3", "id": "2-1-3", "t": "(오늘의집이 발행한 쿠폰) 오늘의집에서 발행한 장바구니 쿠폰은 오늘의집 부담만 있습니다. 파트너님이 등록하신 쿠폰은 오로라 > 쿠폰관리 > 쿠폰 조회/수정에서 확인하실 수 있습니다.", "sec": false, "body": []}, {"k": "2-1-3-1", "id": "2-1-3-1", "t": "제외를 원하시는 상품번호, 쿠폰명, 사유를 알려 주시겠어요?", "sec": false, "body": []}, {"k": "2-1-3-2", "id": "2-1-3-2", "t": "오설정된 쿠폰일 수 있어 담당부서 확인이 필요합니다. 쿠폰명과 적용 상품번호를 알려 주시겠어요?", "sec": false, "body": []}, {"k": "2-1-3-3", "id": "2-1-3-3", "t": "확인을 위해 등록된 상품번호, 받으신 안내 메일 캡처본, 오발행된 상황을 남겨 주시겠어요? 이미 발행된 쿠폰은 사용될 수 있으며, 해당 쿠폰으로 주문이 발생하면 혜택정산 내역을 첨부해 다시 문의 부탁드립니다.", "sec": false, "body": []}, {"k": "2-1-3-4", "id": "2-1-3-4", "t": "발행 주체나 분담률은 쿠폰명과 상품번호로 상담원이 확인해 드릴게요. 쿠폰명 또는 상품번호를 알려 주시겠어요?", "sec": false, "body": []}, {"k": "2-1-4", "id": "2-1-4", "t": "(예산·정산) 발행 중단 기준은 실제 사용된 금액 기준이라, 발행된 쿠폰 금액이 예산을 넘어도 사용 금액이 기준 미만이면 발행이 중단되지 않습니다. 발행이 중단되어도 이미 다운로드된 쿠폰은 만료일까지 사용될 수 있어 예산을 넘어 소진될 수 있습니다.", "sec": false, "body": ["오로라에서 발행한 쿠폰은 정산차감 방식으로 파트너 정산 시 자동 반영됩니다."]}, {"k": "2-1-5", "id": "2-1-5", "t": "(취소·반품 시 연장)", "sec": false, "body": ["- 입금신청 ~ 결제완료 상태에서 취소: 재발행, 기한 연장 없음", "- 배송준비중 ~ 구매확정 상태에서 반품, 취소/반품승인일 기준 만료일이 지난 경우: 재발행, 취소/반품승인일 +3일 연장 (1회만)", "- 배송준비중 ~ 구매확정 상태에서 반품, 만료일이 지나지 않은 경우: 재발행, 기한 연장 없음"]}, {"k": "2-2", "id": "2-2", "t": "어떤 내용이 궁금하신가요?", "sec": false, "body": []}, {"k": "2-2-1", "id": "2-2-1", "t": "(기획전, GP 외) 리퍼마켓, 오늘의딜, 오마트, 스페셜 브랜드위크, 단독상품(Only), 오!쇼룸, 오늘의집 세일 페스타, 오늘의집 LIVE 등은 담당 MD가 운영하는 영역이라, 상세 문의·신청·수정은 담당 MD 대표 메일로 문의해 주세요.", "sec": false, "body": []}, {"k": "2-2-2", "id": "2-2-2", "t": "(기획전, GP) 프로모션(기획전)은 아래 신청서로 직접 신청하실 수 있습니다.", "sec": false, "body": ["프로모션(기획전) 신청서: https://dailyhouse.typeform.com/to/A6kQJk9B", "내부 검토 후 결과를 안내드리며, 결과 안내까지 영업일 기준 10일 정도 소요됩니다. 제출 후에는 수정이 불가하니 꼼꼼히 확인 후 제출해 주세요.", "승인된 기획전은 PC는 오늘의집 > 쇼핑 탭 > 기획전, 모바일 앱은 오늘의집 > 쇼핑 전체 메뉴 > 특가/혜택에 노출됩니다."]}, {"k": "2-2-3", "id": "2-2-3", "t": "(월간자취) 월간자취는 오늘의집 담당부서에서 대상을 선정해 파트너사 영업 담당자 메일로 참여 안내를 드리고 있습니다. 메일의 바로가기에서 기한 내 신청서를 제출해 주세요. 신청·선정 일정은 해당 월 월간자취 공지 기준으로 안내됩니다.", "sec": false, "body": ["- 행사 기간 내 최저가 유지가 필수이며, 판매가 수정 또는 행사기간 상품 쿠폰 발행으로 맞추실 수 있습니다.", "- 선정 시 개별 메일로 안내드리며, 미선정 시 별도 안내는 없습니다. 결과 메일을 받지 못하셨다면 행사기간으로 발행해 둔 쿠폰은 삭제하시면 됩니다.", "- 이전에 선정된 이력이 있는 상품도 신청은 가능하나 선정 확률이 낮아질 수 있습니다. 해외직구 상품도 신청 가능합니다."]}, {"k": "2-2-4", "id": "2-2-4", "t": "(리퍼마켓) 참여 방법은 매월 오로라 > 기타 > 공지사항에서 '리퍼'로 검색해 해당 월 공지에서 확인하실 수 있습니다. 취합 일정 내 리퍼마켓 견적서를 담당 MD에게 접수해 주시면 되며, 카테고리 담당 MD가 있는 경우에만 참여 가능합니다. 기간이 지난 건은 다음 리퍼마켓에 신청 부탁드리며, 진행 확정된 상품만 개별 회신드립니다.", "sec": false, "body": []}, {"k": "2-2-5", "id": "2-2-5", "t": "(패키지 할인) 패키지 할인은 오늘의집이 자체적으로 진행하는 고객 대상 추가 할인으로, 할인 금액은 오늘의집이 100% 부담해 정산금에 영향이 없습니다. 별도 신청이나 대상 상품 추가는 어려우며, 적용 기준은 상세 안내가 어려운 점 양해 부탁드립니다. 할인 내역은 오로라 > 정산관리 > 정산내역 상세의 혜택정산 '패키지 할인' 항목에서 확인하실 수 있습니다.", "sec": false, "body": []}, {"k": "2-2-6", "id": "2-2-6", "t": "(라이브 쇼핑·자체 행사) 오늘의집 라이브 쇼핑은 내부 담당부서에서 선정해 진행하며 현재 별도 신청은 받지 않습니다. 파트너님 자체 행사에 대한 페이백·포인트 지급 지원 정책은 없는 점 양해 부탁드립니다.", "sec": false, "body": []}, {"k": "2-2-7", "id": "2-2-7", "t": "(담당 MD 여부 모름) 담당 MD 배정 여부에 따라 기획전 신청 경로가 달라 확인이 필요합니다. 기획전에 참여하려는 상품번호(또는 카테고리)를 알려 주시겠어요?", "sec": false, "body": ["담당 MD 배정 여부 확인을 위해 상담원에게 연결해 드릴게요. → 상담원 인계 (T3-D)"]}, {"k": "2-3", "id": "2-3", "t": "어떤 내용이 궁금하신가요?", "sec": false, "body": []}, {"k": "2-3-1", "id": "2-3-1", "t": "(특가뱃지) 특가뱃지는 오늘의집 내부 담당부서에서 선정해 진행하며 현재 별도 신청은 받지 않습니다. 특가뱃지는 상시 부착이 아니라 최대 1주일 간격으로 부착되어 가격 변동이 없어도 일시적으로 떨어질 수 있고, 별도 신청 없이 자동으로 탈부착될 수도 있습니다.", "sec": false, "body": ["담당 MD가 있는 파트너님은 담당 MD 대표 메일로 문의해 주세요."]}, {"k": "2-3-2", "id": "2-3-2", "t": "(only 뱃지) only 뱃지는 별도 부서에서 검토·선정하고 있어 선정 기준은 상세 안내가 어려운 점 양해 부탁드립니다.", "sec": false, "body": []}, {"k": "2-3-3", "id": "2-3-3", "t": "(모음전 신청·수정·삭제) 모음전 신규 생성·수정은 양식을 다운로드해 신청서 폼에 첨부해 주시고, 삭제는 신청서 폼에 삭제할 모음전 URL을 입력해 제출해 주세요.", "sec": false, "body": ["모음전 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29684363330713", "- 판매중/품절 상품만, 같은 브랜드·같은 샵 상품만 묶을 수 있습니다.", "- 희망일·지정일 배송, 주문제작, 주문메모가 필요한 상품과 시공·상담·회원전용 상품은 설정할 수 없습니다.", "- 선결제 상품은 배송비가 모두 같아야 하고, 조건부 무료배송 상품은 무료/유료 배송비 기준이 같아야 합니다.", "- 대표 이미지(필수)는 가로 1440px 권장, JPG·JPEG·PNG만 가능합니다(GIF 불가).", "- 모음전 브랜드명을 바꾸시려면 기존 모음전 삭제 후 신규 신청해 주세요.", "신청 후 처리까지 영업일 기준 최대 5일 소요되며, 결과는 신청서에 기재하신 메일로 안내됩니다. 접수된 신청은 취소할 수 없어 수정 요청으로 재신청해 주셔야 합니다."]}, {"k": "2-3-3-1", "id": "2-3-3-1", "t": "(모음전 키워드 등록) 담당 MD가 배정되어 있으신가요?", "sec": false, "body": []}, {"k": "2-3-4", "id": "2-3-4", "t": "(모음전 구성 상품 확인) 모음전에 구성된 상품은 오로라에서 확인하실 수 없습니다. 모음전 페이지 주소창의 숫자 부분이 모음전 코드입니다. 모음전 코드를 알려 주시겠어요?", "sec": false, "body": ["구성 상품 확인을 위해 상담원에게 연결해 드릴게요. → 상담원 인계 (T3-D)"]}, {"k": "2-3-5", "id": "2-3-5", "t": "(검색 키워드 등록) 검색 키워드는 양식을 다운로드해 신청서 폼으로 신청하실 수 있습니다.", "sec": false, "body": ["검색 키워드 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29759702526233", "- 키워드는 띄어쓰기로 구분하며 쉼표·특수문자는 쓸 수 없습니다.", "- 상품명/브랜드/카테고리/옵션에 이미 있는 키워드, 오탈자, 미완성 키워드, 상품 정보와 다른 키워드는 등록되지 않습니다.", "- 타사 브랜드, 최저가·1위·최고 같은 배타적 표현, 특가·쿠폰적용 같은 가격 표현, 무료배송·오늘출발 같은 배송 표현은 등록할 수 없습니다.", "- 띄어쓰기 포함 최대 191자, 최대 2000행까지 등록 가능하며 샵ID와 샵명을 정확히 입력해 주세요(불일치 시 반려).", "- 수정 요청 시에는 등록이 필요한 전체 키워드를 기재해 신청해 주세요.", "신청 후 5영업일 이내 적용되며, 결과는 기재하신 메일로 발송됩니다."]}, {"k": "2-3-6", "id": "2-3-6", "t": "(등록된 키워드 확인) 상품에 등록된 검색 키워드는 오로라에서 확인하실 수 없어 대신 확인해 드릴게요. 확인하실 상품번호를 알려 주시겠어요?", "sec": false, "body": []}, {"k": "2-3-7", "id": "2-3-7", "t": "(관련 없는 상품 노출) 오늘의집 검색은 내부 로직에 따라 노출되어 비슷한 상품명·브랜드명의 상품이 함께 노출될 수 있으며, 타사 상품이 파트너님 상품보다 상단에 노출되는 경우가 아니면 비노출 처리는 어렵습니다. PC·모바일 노출 순위도 내부 로직으로 정해지며 구체적인 내용은 공유가 어려운 점 양해 부탁드립니다.", "sec": false, "body": []}, {"k": "2-4", "id": "2-4", "t": "어떤 광고 관련 문의이신가요?", "sec": false, "body": []}, {"k": "2-4-1", "id": "2-4-1", "t": "(상품광고 등) 어떤 내용이 궁금하신가요?", "sec": false, "body": ["- 광고비 충전: 카드 결제 또는 무통장입금으로 충전하실 수 있습니다.", "- 충전 미반영: ad_product@bucketplace.net으로 입금일시, 입금금액 등 입금 증빙과 함께 메일 부탁드립니다.", "- 광고 미노출: 오로라 > 상품관리 > 상품 조회/수정에서 상품번호로 '판매중' 상태인지 확인해 주세요. 품절 등으로 판매가 중단된 상품은 광고 게재가 중단될 수 있습니다. 해당 사유가 아니면 ad_product@bucketplace.net으로 문의 부탁드립니다. 상품광고는 모바일 앱에서만 노출되어 PC에서는 확인되지 않습니다.", "- 계정 비활성화: 오하우스애즈·배너광고는 잔액이 2천원 미만이 되면 자동으로 비활성화됩니다. 광고비를 충전하시면 활성화하실 수 있으며, 잔액이 충분하거나 충전 후에도 비활성화 상태라면 ad_product@bucketplace.net으로 문의 부탁드립니다.", "- 그 외(가상계좌 등): 파트너센터에서는 광고 관련 단순 안내만 가능해, 카카오톡 '오늘의집 광고센터' 또는 ad_product@bucketplace.net으로 문의 부탁드립니다. 광고 상품 정보는 https://ohouse-ad.oopy.io/에서 확인하실 수 있습니다."]}, {"k": "2-4-2", "id": "2-4-2", "t": "(스토어 채널 광고 등) 담당 MD가 배정되어 있으신가요?", "sec": false, "body": []}, {"k": "2-4-3", "id": "2-4-3", "t": "(오감리뷰) 오감리뷰는 오늘의집 크리에이터가 직접 제품을 경험한 뒤 스타일링샷 이미지와 텍스트 리뷰를 생산하는 체험단 광고 상품입니다. 신청은 오로라 → 오로라 광고 관리 탭 → 크리에이터 플러스에서 하실 수 있으며, 모집은 주 1회 진행됩니다.", "sec": false, "body": ["- 루키: 인당 3만 원, 판매가 20만원 이하 상품, 오늘의집 스토어 리뷰, 오늘의집 내부 지면 활용", "- 프로: 인당 20만 원, 판매가 5만원 이상 상품, 스타일링샷 + 스토어 리뷰, 오늘의집 내부 지면·자사몰·SNS 광고 활용 (선택: 숏폼 콘텐츠 인당 15만 원)", "오감리뷰 이미지는 별도 비용 없이 오늘의집 상품 썸네일·상세페이지, 자사몰, 공식 SNS 게시글·광고 소재에 활용하실 수 있으나 타 커머스 플랫폼에는 쓸 수 없고, 출처(예: 오늘의집 000님의 오감리뷰)를 반드시 표기해 주셔야 합니다. 게재보고서에 기재된 게시글만 활용 가능하며, 오프라인 제작물은 사전 동의 요청이 필요합니다.", "자세한 문의는 creatorplus_partner@bucketplace.net으로 부탁드립니다. (크리에이터 플러스 브랜드 페이지: https://ohouse-creatorplus-brand.oopy.io/)"]}, {"k": "2-4-4", "id": "2-4-4", "t": "(기타) 어떤 내용이신가요?", "sec": false, "body": ["- 챌린지 광고: oh.challenge@bucketplace.net으로 문의 부탁드립니다.", "- 유튜브 콘텐츠 광고: ohouse_youtube@bucketplace.net으로 문의 부탁드립니다.", "- 오프하우스: 파트너사 전용 카카오톡 문의채널(http://pf.kakao.com/_FixnBn) 또는 offhouse@bucketplace.net으로 문의 부탁드립니다.", "- 광고 대행사 확인: https://ohouse-ad.oopy.io/agency에서 공식 대행사 목록을 확인하실 수 있습니다. 연락받으신 대행사명을 알려 주시면 함께 확인해 드릴게요. → (대행사명 확인 후 안내) → 3", "- 통합광고계약서 입금 계좌: 담당부서 확인이 필요해 상담원에게 연결해 드릴게요. → 상담원 인계 (T3-C)"]}, {"k": "2-5", "id": "2-5", "t": "어떤 광고 노출을 중지하고 싶으신가요?", "sec": false, "body": []}, {"k": "2-5-1", "id": "2-5-1", "t": "(파워링크) 네이버에서 검색 시 파워링크로 상품이나 브랜드가 광고 노출되는 건의 중단을 요청하시는 거죠. 확인을 위해 아래 내용을 알려 주시겠어요?", "sec": false, "body": ["1) 중단 범위: 브랜드 전체 / 개별 키워드", "2) 상품번호, 브랜드명", "3) 검색 키워드", "4) 중단 요청 사유", "요청하신 내용은 담당부서에 전달드리며, 요청 후에도 삭제까지 시일이 소요될 수 있는 점 양해 부탁드립니다."]}, {"k": "2-5-2", "id": "2-5-2", "t": "(쇼핑검색 광고) 네이버 쇼핑검색 광고는 네이버 시스템 로직에 따라 자동으로 설정·노출되는 부분으로 오늘의집 영역이 아닙니다. 노출 중지(광고 제외)를 원하시면 상품번호를 알려 주세요. 광고 자체에 대한 상세 문의는 네이버 측으로 부탁드립니다.", "sec": false, "body": []}, {"k": "3", "id": "3", "t": "더 궁금하신 점이 있으신가요?", "sec": false, "body": []}], "hocond": "T3-C: 오늘의집 발행 쿠폰 적용 제외 요청, 파트너 부담 설정 장바구니 쿠폰·오발행 쿠폰, GP 기획전 신청 후 확인·수정, 월간자취 선정 메일·상품 제외·메일 미수신, 패키지 할인 제외, 특가뱃지 재부착(2영업일 경과)·제거, only 뱃지 해지, 등록 키워드 확인 5건 이상, 무관 상품 검색 노출, 통합광고계약서 입금 계좌, 네이버 파워링크·쇼핑검색 광고 중단. T3-A: 담당 MD가 없는 파트너의 모음전 키워드 등록. T3-D: 쿠폰 발행 주체·분담률 확인, 모음전 구성 상품 확인, 등록 키워드 확인 5건 미만, 담당 MD 유무를 모르는 기획전·모음전 키워드·스토어 채널 광고 문의. 광고 문의처·신청서 안내 건은 챗봇 종결. 상담원 직접 요청 T1", "hoinfo": "세부 분기(쿠폰/기획전/월간자취/특가뱃지/only/모음전/키워드/광고/네이버), 파트너가 답한 담당 MD 유무(있음/없음/모름), 상품번호 또는 카테고리, 쿠폰명·쿠폰ID, 오발행 안내 메일 캡처, 모음전 코드, 등록 요청 키워드, 검색 키워드와 노출 상품번호, 특가뱃지 재부착/제거 구분과 사유, 네이버 광고 중단 범위(브랜드 전체/개별 키워드)·브랜드명·검색 키워드·요청 사유. GP 여부·MD 그룹 대표 메일, 쿠폰 발행 주체·분담률, 모음전 구성 상품, 상품별 등록 키워드는 상담원이 직접 확인합니다.", "kms": "062_쿠폰.md, 054_기획전___MD.md, 057_키워드___모음전___네이버___외부몰.md, 061_광고.md, 043_상품수정.md, 002__안내_11월_월간자취_진행일정_공유드립니다_.md, 092_관리자_이관_유형_및_방법.md, 094_영업_리스크팀_이관_유형_및_방법.md, 095_커머스_정책_이관_유형_및_이관_방법.md, 096_심층문의_이관_유형_및_이관_방법.md", "check": "1) 등록 키워드 5건 이상 확인 이관처: 057은 영업팀, 054는 GP일 때만 영업 취 선정·제외·메일 미수신, 패키지 할인 제외, 뱃지 재부착(2영업일 경과)·제거·해지, 모음전 구성·등록 키워드 확인, 무관 상품 노출, 통합광고계약서 계좌, 네이버 광고 중단, 담당 MD 없는 파트너의 모음전 키워드 등록, 담당 MD 유무 모름은 상담원 배정"}], "auto": "(공통 첫인사)\n\n[쿠폰]\n- 만들기: 오로라 > 쿠폰관리 > 쿠폰 등록에서 직접 발행하실 수 있습니다. 파트너님이 발행하실 수 있는 쿠폰은 상품 쿠폰이며 장바구니 쿠폰은 발행이 불가합니다. 최초 1회 대표계정으로 쿠폰 약관 동의 후 어느 계정으로든 등록하실 수 있고, 정액/정률 할인으로 2일 ~ 31일간 발행하도록 설정할 수 있으며, 1개 쿠폰에 판매중/판매대기 상품을 최대 5천 개까지 적용할 수 있습니다. 쿠폰명은 최대 30자이며 특수문자와 희소성 표현은 쓸 수 없고, 기준에 맞지 않으면 삭제/발행 중지될 수 있습니다. 상품쿠폰은 옵션별로 적용되므로 여러 옵션 판매를 원하시면 1인당 최대 수량을 5개로 설정해 주세요. 발행종료일은 행사 종료일의 다음날 00시로 설정해 주세요(예: 9월 1일 ~ 9월 5일 행사 → 발행종료일 9월 6일 00시). 1개 상품에는 1개의 상품 쿠폰만 적용되며 할인율이 더 높은 쿠폰이 적용되고, 상품 쿠폰과 장바구니 쿠폰은 중복 적용됩니다.\n- 수정·삭제: 오로라 > 쿠폰관리 > 쿠폰 조회/수정에서 쿠폰명, 쿠폰ID로 조회해 수정하실 수 있습니다. 발행 전에는 모든 항목 수정 및 삭제가 가능하고, 발행 가능 상태에서는 예산, 발행종료일, 적용상품만 수정할 수 있으며 삭제는 안 되고 발행 중지만 가능합니다. 발행 중지는 다운로드만 막는 것이라 중지 전에 다운로드한 쿠폰은 만료일까지 사용될 수 있습니다.\n- 예산·정산: 발행 중단 기준은 실제 사용된 금액 기준이라, 발행된 쿠폰 금액이 예산을 넘어도 사용 금액이 기준 미만이면 발행이 중단되지 않습니다. 발행이 중단되어도 이미 다운로드된 쿠폰은 만료일까지 사용될 수 있어 예산을 넘어 소진될 수 있습니다. 오로라에서 발행한 쿠폰은 정산차감 방식으로 정산 시 자동 반영됩니다.\n- 취소·반품 시 연장: 입금신청 ~ 결제완료 상태에서 취소는 재발행·연장 없음 / 배송준비중 ~ 구매확정 상태에서 반품되어 취소·반품승인일 기준 만료일이 지난 경우 재발행·승인일 +3일 연장(1회) / 만료일이 지나지 않은 경우 재발행·연장 없음\n- 오늘의집이 발행한 장바구니 쿠폰은 오늘의집 부담만 있으며, 오늘의집 100% 부담 쿠폰은 파트너님이 별도로 부담하실 비용이 없습니다.\n\n[기획전·월간자취·리퍼마켓·패키지 할인·라이브]\n- 기획전: 담당 MD가 있는 파트너님은 리퍼마켓, 오늘의딜, 오마트, 스페셜 브랜드위크, 단독상품(Only), 오!쇼룸, 오늘의집 세일 페스타, 오늘의집 LIVE 등 담당 MD가 운영하는 영역이라 담당 MD께 문의해 주세요. 담당 MD가 없는 파트너님은 프로모션(기획전) 신청서(https://dailyhouse.typeform.com/to/A6kQJk9B)로 직접 신청하실 수 있으며, 결과 안내까지 영업일 기준 10일 정도 소요되고 제출 후에는 수정이 불가하니 꼼꼼히 확인 후 제출해 주세요. 승인된 기획전은 PC는 오늘의집 > 쇼핑 탭 > 기획전, 모바일 앱은 쇼핑 전체 메뉴 > 특가/혜택에 노출됩니다.\n- 월간자취: 오늘의집 담당부서에서 대상을 선정해 파트너사 영업 담당자 메일로 참여 안내를 드리며, 메일의 바로가기에서 기한 내 신청서를 제출해 주세요. 행사 기간 내 최저가 유지가 필수이며 판매가 수정 또는 행사기간 상품 쿠폰 발행으로 맞추실 수 있습니다. 선정 시 개별 메일로 안내드리고 미선정 시 별도 안내는 없으며, 결과 메일을 받지 못하셨다면 행사기간으로 발행해 둔 쿠폰은 삭제하시면 됩니다. 이전 선정 이력이 있는 상품도 신청은 가능하나 선정 확률이 낮아질 수 있고, 해외직구 상품도 신청 가능합니다.\n- 리퍼마켓: 매월 오로라 > 기타 > 공지사항에서 '리퍼'로 검색해 해당 월 공지에서 참여 방법을 확인해 주세요. 취합 일정 내 리퍼마켓 견적서를 담당 MD에게 접수해 주시면 되며, 카테고리 담당 MD가 있는 경우에만 참여 가능합니다. 진행 확정된 상품만 개별 회신드립니다.\n- 패키지 할인: 오늘의집이 자체적으로 진행하는 고객 대상 추가 할인으로, 할인 금액은 오늘의집이 100% 부담해 정산금에 영향이 없습니다. 별도 신청이나 대상 상품 추가는 어려우며 적용 기준은 상세 안내가 어려운 점 양해 부탁드립니다. 할인 내역은 오로라 > 정산관리 > 정산내역 상세의 혜택정산 '패키지 할인' 항목에서 확인하실 수 있습니다.\n- 라이브 쇼핑은 내부 담당부서에서 선정해 진행하며 현재 별도 신청은 받지 않습니다. 파트너님 자체 행사에 대한 페이백·포인트 지급 지원 정책은 없습니다.\n\n[특가뱃지·only 뱃지]\n특가뱃지는 오늘의집 내부 담당부서에서 선정해 진행하며 현재 별도 신청은 받지 않습니다. 상시 부착이 아니라 최대 1주일 간격으로 부착되어 가격 변동이 없어도 일시적으로 떨어질 수 있고, 별도 신청 없이 자동으로 탈부착될 수도 있습니다. 사라진 뒤 2영업일이 지나도 재부착되지 않으면 상품번호를 적어 새 문의로 남겨 주세요. only 뱃지는 별도 부서에서 검토·선정하고 있어 선정 기준은 상세 안내가 어려운 점 양해 부탁드립니다.\n\n[모음전·검색 키워드]\n- 모음전 신청·수정·삭제: 신규 생성·수정은 양식을 다운로드해 신청서 폼에 첨부해 주시고, 삭제는 신청서 폼에 삭제할 모음전 URL을 입력해 제출해 주세요(모음전 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29684363330713). 판매중/품절 상품만, 같은 브랜드·같은 샵 상품만 묶을 수 있고, 희망일·지정일 배송, 주문제작, 주문메모가 필요한 상품과 시공·상담·회원전용 상품은 설정할 수 없습니다. 선결제 상품은 배송비가 모두 같아야 하고 조건부 무료배송 상품은 무료/유료 배송비 기준이 같아야 합니다. 대표 이미지(필수)는 가로 1440px 권장, JPG·JPEG·PNG만 가능(GIF 불가)합니다. 모음전 브랜드명을 바꾸시려면 기존 모음전 삭제 후 신규 신청해 주세요. 신청 후 처리까지 영업일 기준 최대 5일 소요되며 결과는 신청서에 기재하신 메일로 안내됩니다. 접수된 신청은 취소할 수 없어 수정 요청으로 재신청해 주셔야 합니다.\n- 모음전 키워드 등록: 담당 MD가 있는 파트너님은 담당 MD께 문의해 주세요.\n- 검색 키워드 등록: 양식을 다운로드해 신청서 폼으로 신청하실 수 있습니다(검색 키워드 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29759702526233). 키워드는 띄어쓰기로 구분하며 쉼표·특수문자는 쓸 수 없고, 상품명/브랜드/카테고리/옵션에 이미 있는 키워드, 오탈자, 미완성 키워드, 상품 정보와 다른 키워드는 등록되지 않습니다. 타사 브랜드, 최저가·1위·최고 같은 배타적 표현, 특가·쿠폰적용 같은 가격 표현, 무료배송·오늘출발 같은 배송 표현은 등록할 수 없습니다. 띄어쓰기 포함 최대 191자, 최대 2000행까지 등록 가능하며 샵ID와 샵명을 정확히 입력해 주세요(불일치 시 반려). 수정 요청 시에는 등록이 필요한 전체 키워드를 기재해 신청해 주세요. 신청 후 5영업일 이내 적용되며 결과는 기재하신 메일로 발송됩니다.\n- 검색 결과에 관련 없는 상품이 보일 때: 오늘의집 검색은 내부 로직에 따라 노출되어 비슷한 상품명·브랜드명의 상품이 함께 노출될 수 있으며, 타사 상품이 파트너님 상품보다 상단에 노출되는 경우가 아니면 비노출 처리는 어렵습니다. 검색어와 전혀 관련 없는 상품이 나온다면 검색 키워드와 노출된 상품번호를 적어 새 문의로 남겨 주세요.\n\n[상품광고·배너광고·오하우스애즈]\n- 광고비는 카드 결제 또는 무통장입금으로 충전하실 수 있습니다. 입금했는데 충전이 반영되지 않았다면 ad_product@bucketplace.net 으로 입금일시, 입금금액 등 입금 증빙과 함께 메일 부탁드립니다.\n- 광고 미노출: 오로라 > 상품관리 > 상품 조회/수정에서 상품번호로 '판매중' 상태인지 확인해 주세요. 품절 등으로 판매가 중단된 상품은 광고 게재가 중단될 수 있으며, 상품광고는 모바일 앱에서만 노출되어 PC에서는 확인되지 않습니다. 해당 사유가 아니면 ad_product@bucketplace.net 으로 문의 부탁드립니다.\n- 계정 비활성화: 오하우스애즈·배너광고는 잔액이 2천원 미만이 되면 자동으로 비활성화되며, 광고비를 충전하시면 활성화하실 수 있습니다. 잔액이 충분하거나 충전 후에도 비활성화 상태라면 ad_product@bucketplace.net 으로 문의 부탁드립니다.\n- 그 외 광고 문의는 파트너센터에서 단순 안내만 가능해, 카카오톡 '오늘의집 광고센터' 또는 ad_product@bucketplace.net 으로 문의 부탁드립니다. 광고 상품 정보는 https://ohouse-ad.oopy.io/ 에서 확인하실 수 있습니다.\n\n[스토어 채널 광고·브랜드 광고]\n- 담당 MD가 있는 파트너님: 카카오톡 '오늘의집 커머스 광고센터' 또는 commerce_ad@bucketplace.net 으로 문의 부탁드립니다.\n- 담당 MD가 없는 파트너님: 해당 광고 타입은 MD 배정 이후 진행이 가능합니다. MD 배정은 월별 운영 계획에 따라 진행되며 내부 운영 리소스가 제한적인 상황으로 광고 진행이 제한될 수 있는 점 양해 부탁드립니다.\n\n[오감리뷰·크리에이터 플러스]\n오감리뷰는 오늘의집 크리에이터가 직접 제품을 경험한 뒤 스타일링샷 이미지와 텍스트 리뷰를 생산하는 체험단 광고 상품입니다. 신청은 오로라 광고 관리 탭 > 크리에이터 플러스에서 하실 수 있으며 모집은 주 1회 진행됩니다.\n- 루키: 인당 3만 원, 판매가 20만원 이하 상품, 오늘의집 스토어 리뷰, 오늘의집 내부 지면 활용\n- 프로: 인당 20만 원, 판매가 5만원 이상 상품, 스타일링샷 + 스토어 리뷰, 오늘의집 내부 지면·자사몰·SNS 광고 활용 (선택: 숏폼 콘텐츠 인당 15만 원)\n오감리뷰 이미지는 별도 비용 없이 오늘의집 상품 썸네일·상세페이지, 자사몰, 공식 SNS 게시글·광고 소재에 활용하실 수 있으나 타 커머스 플랫폼에는 쓸 수 없고, 출처(예: 오늘의집 000님의 오감리뷰)를 반드시 표기해 주셔야 합니다. 게재보고서에 기재된 게시글만 활용 가능하며 오프라인 제작물은 사전 동의 요청이 필요합니다. 자세한 문의는 creatorplus_partner@bucketplace.net 으로 부탁드립니다. (크리에이터 플러스 브랜드 페이지: https://ohouse-creatorplus-brand.oopy.io/)\n\n[기타 광고]\n- 챌린지 광고: oh.challenge@bucketplace.net\n- 유튜브 콘텐츠 광고: ohouse_youtube@bucketplace.net\n- 오프하우스: 파트너사 전용 카카오톡 문의채널(http://pf.kakao.com/_FixnBn) 또는 offhouse@bucketplace.net\n- 광고 대행사 확인: https://ohouse-ad.oopy.io/agency 에서 공식 대행사 목록을 확인하실 수 있습니다.\n(분야·요청에 해당하는 단락만, 맺음 A)", "ack": "남겨 주신 내용을 담당 부서에 전달해 확인하겠습니다. 확인까지 시간이 걸릴 수 있는 점 양해 부탁드립니다.\n(오발행 쿠폰: \"이미 발행된 쿠폰은 사용될 수 있으며, 해당 쿠폰으로 주문이 발생하면 혜택정산 내역을 첨부해 다시 문의 부탁드립니다.\")\n(네이버 광고 중단: \"네이버 광고는 네이버 시스템 로직에 따라 노출되는 영역이라 요청 후에도 삭제까지 시일이 소요될 수 있으며, 광고 자체에 대한 상세 문의는 네이버 측으로 부탁드립니다.\")", "info": "분야·요청 내용, 담당 MD 유무(파트너 응답), 상품번호, 쿠폰명·쿠폰ID, 오발행 메일 캡처, 모음전 코드, 등록 요청 키워드, 검색 키워드와 노출 상품번호, 특가뱃지 재부착/제거 구분과 사유, 네이버 광고 중단 범위·브랜드명·검색 키워드·사유", "kms": "062_쿠폰.md,
