판매가와 주문 시 가격이 달라요\"| N8_1\nN8 -->|\"다른 상품의 리뷰가 보여요\"| N8_2\nN8 -->|\"고객 문의 답변하라는 문자가 잘못 온 것<br/>같아요\"| N8_3\nN8_1 -->|\"정보 입력\"| HO_T3C\nN8_2 -->|\"상품번호, 캡처 첨부\"| HO_T3C\nN8_3 -->|\"우리 회사와 관계없는 번호로 받았어요\"| HO_T3C\nN8_3 -->|\"알겠어요\"| N10\nN8_3 -->|\"오로라 › 판매자정보 › 담당자 정보\"| N9\nN9 -->|\"그래도 안 돼요\"| N2_2\nN9 -->|\"해결됐어요\"| N10\nN10 -->|\"아니요\"| END\nN10 -->|\"네\"| SWX5\nN2 --> N2_1\nN6 --> N7\nSW_PA007001[/\"「스토어관리 문의」로 전환\"/]:::sw\nHO_T3B([\"상담원 인계<br/>셀프 처리 실패\"]):::ho\nHO_T2([\"상담원 인계<br/>반복·미해결\"]):::ho\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nEND([\"상담 종료\"]):::fin\nSWX5[/\"용건 다시 받기 (바뀐<br/>용건의 유형으로 진행)\"/]:::sw", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 불편을 드려 죄송합니다. 어떤 증상인지 선택해 주세요.", "sec": false, "body": ["(이 유형은 원래 조회 API를 쓰지 않아 1차에도 흐름이 같음)"]}, {"k": "2", "id": "2", "t": "오류가 발생하는 메뉴(경로)와 화면에 보이는 오류 문구를 알려주시겠어요? 화면 캡처가 있으면 첨부해 주세요.", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "아래 순서로 다시 시도해 주세요. 오늘의집은 구글 크롬 브라우저 사용을 권장드립니다.", "sec": false, "body": ["1) 쿠키·캐시 삭제: 크롬 오른쪽 상단 더보기(점 세 개) > 설정 > 개인정보 보호 및 보안 > 인터넷 사용 기록 삭제 > 고급 > 기간 '전체 기간' > 삭제할 항목 선택 > 데이터 삭제", "2) 구글 크롬 시크릿 창에서 재시도", "3) 다른 PC에서 재시도"]}, {"k": "2-2", "id": "2-2", "t": "확인을 위해 아래 내용을 알려주세요.", "sec": false, "body": ["- 사용 중인 운영체제(OS)와 브라우저", "- 시도하신 방법(쿠키·캐시 삭제 / 시크릿 창 / 다른 PC)", "가능하시면 오류 화면에서 마우스 오른쪽 클릭 > 검사 > 네트워크(Network) 탭에서 빨간 글씨 파일을 눌러 헤더(Headers)·응답(Response) 화면과, 콘솔(Console) 화면을 캡처해 첨부해 주세요."]}, {"k": "2-3", "id": "2-3", "t": "정확한 확인을 위해 상담원에게 연결해 드리겠습니다. 확인 과정에서 상담원이 오로라 화면 확인을 요청드릴 수 있습니다.", "sec": false, "body": []}, {"k": "3", "id": "3", "t": "해당 오류가 발생하는 경우 임시저장을 제외하시고 신규 상품 등록으로 진행 부탁드립니다. 이용에 불편을 드려 죄송합니다.", "sec": false, "body": []}, {"k": "4", "id": "4", "t": "아래 방법으로 다시 시도해 주세요.", "sec": false, "body": ["1) 비밀번호를 메모장에 입력해 복사(Ctrl+C)한 뒤, 엑셀 비밀번호 입력 칸에 붙여넣기", "2) 엑셀 비밀번호 입력 시 한글/영어 전환 상태를 바꿔 각각 1회씩 입력"]}, {"k": "5", "id": "5", "t": "주문 수집·송장번호 입력 후에도 미확인주문으로 보이거나, 배송중으로 바꿨는데 오로라 홈 현황에 반영되지 않는 경우 간혹 반영이 지연될 수 있습니다. 시간 여유를 두고 다시 확인해 주세요.", "sec": false, "body": []}, {"k": "5-1", "id": "5-1", "t": "2-1의 쿠키·캐시 삭제 후 다시 확인해 주시고, 이용 중인 외부솔루션 측에도 오류가 있는지 확인 부탁드립니다.", "sec": false, "body": []}, {"k": "5-2", "id": "5-2", "t": "확인을 위해 해당 주문번호(또는 문의 건)와 화면 캡처를 첨부해 주세요. 담당 부서 확인을 위해 상담원에게 연결해 드리겠습니다.", "sec": false, "body": []}, {"k": "6", "id": "6", "t": "오로라 홈 화면의 현황 건수는 부득이 실제와 맞지 않을 수 있습니다. 개발팀에서도 인지하고 개선 예정이나 즉시 개선은 어려워 반영까지 시일이 걸릴 수 있습니다. 해당 메뉴에 들어가서 실제로 확인되는 건을 기준으로 답변 처리 부탁드립니다.", "sec": false, "body": ["고객센터 문의 건수는 홈 화면에 표시되지 않으니 [오로라 > 문의/리뷰 > 고객센터 문의]에서 확인해 주세요. → 10"]}, {"k": "7", "id": "7", "t": "판매 상태를 일괄 변경할 때 재고가 0개인 상품이 있으면 해당 상품은 품절로 처리될 수 있습니다. 재고가 0개인 상품은 먼저 재고를 수정한 뒤 판매 상태를 바꿔 주세요. → 10", "sec": false, "body": []}, {"k": "8", "id": "8", "t": "어떤 증상인지 선택해 주세요.", "sec": false, "body": []}, {"k": "8-1", "id": "8-1", "t": "확인을 위해 주문번호, 주문옵션번호, 주문 접수된 가격, 현재 보이는 판매가를 알려주세요.", "sec": false, "body": []}, {"k": "8-2", "id": "8-2", "t": "해당 상품번호와 화면 캡처를 첨부해 주세요.", "sec": false, "body": []}, {"k": "8-3", "id": "8-3", "t": "해당 안내 문자는 오로라에 등록된 주문/클레임 담당자 연락처로 발송됩니다. 담당자가 바뀌었다면", "sec": false, "body": []}, {"k": "9", "id": "9", "t": "아래 순서로 쿠키를 삭제한 뒤 다시 접속해 주세요.", "sec": false, "body": ["1) 크롬 오른쪽 상단 더보기 > 설정", "2) 개인 정보 보호 및 보안 > 쿠키 및 기타 사이트 데이터", "3) 모든 사이트 데이터 및 권한 보기 > 모든 데이터 삭제", "4) 오늘의집 파트너센터 링크 재접속", "그래도 접속되지 않으면 방화벽 설정을 확인하시고, 방화벽 해제 후 다시 접속해 주세요."]}, {"k": "10", "id": "10", "t": "더 궁금하신 점이 있으신가요?", "sec": false, "body": []}], "hocond": "기본 조치(쿠키·캐시 삭제/시크릿/타 PC) 후에도 오류 지속 T3-B / 반영 지연 지속·판매가 오노출·타 상품 리뷰 노출·제3자 문자 수신 T3-C / 엑셀 비밀번호 안내 후에도 실패 T2 / 오류로 인한 강한 불만 T4 / 상담원 직접 요청 T1", "hoinfo": "증상, 발생 경로(메뉴), 오류 문구, 화면 캡처·네트워크/콘솔 캡처, OS·브라우저, 시도한 조치(쿠키·캐시 삭제/시크릿/타 PC), 관련 주문번호·주문옵션번호·상품번호, 판매가 오노출 시 주문 접수 가격과 현재 판매가, 제3자 수신 연락처", "kms": "067_오류_Issue__대응.md, 087_오로라__.md, 058_셀러샵.md, 047_파트너센터_활용.md, 096_심층문의_이관_유형_및_이관_방법.md, 092_관리자_이관_유형_및_방법.md", "check": "1) 엑셀 비밀번호 안내 3종/4종 상충(입력 issue), KMS 067에는 2가지만 있어 나머지 방법 출처 확인 필요 / 2) '관리자 접속 허용'(오로라 > 판매자정보 > 계정정보 > 내 계정 > 관리자접속 허용, 10분 유효)은 팀 관리자만 진행하는 절차라 챗봇은 안내하지 않고 인계로 둠, 챗봇이 미리 안내할지 결정 필요 / 3) 반영 지연은 KMS상 '동일 문의 인입량에 따라 양해 안내 또는 심층 이관', 챗봇이 인입량을 판단할 수 없어 1차 양해 후 재문의 시 인계로 설계 / 4) 067의 쿠키·캐시 삭제 경로와 058의 경로 표기가 다름(둘 다 크롬 기준), 하나로 통일할지 확인", "api": "-", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 증상: \n· 발생 메뉴(경로): \n· 화면에 나온 오류 문구 (선택): \n· (해당 시: 화면·메뉴 안 열림, 기타 오류, 다른 상품 리뷰) 화면 캡처: 첨부파일로 올려 주세요\n· 사용 중인 OS·브라우저 (선택): \n· 이미 해 본 조치 (쿠키·캐시 삭제 / 크롬 시크릿 창 / 다른 PC / 아직 안 해 봄): \n· (해당 시: 반영 지연, 가격 다름, 다른 상품 리뷰) 관련 주문번호·주문옵션번호·상품번호: \n· (해당 시: 가격 다름) 주문 접수 가격과 현재 판매가: \n· (해당 시: 관계없는 번호로 문자) 문자를 받은 연락처: \n\n문의 내용: ", "mode": "조건별: 알려진 증상(임시저장·엑셀 비밀번호·홈 건수·품절 전환·첫 반영 지연·접속 쿠키)과 기본 조치를 안 해 본 화면 오류는 자동답변 종결 / 기본 조치 후에도 계속되는 오류·판매가 오노출·다른 상품 리뷰·제3자 문자 수신은 상담원 배정", "segs": [{"c": ["A"], "t": "알려진 증상(임시저장·엑셀 비밀번호·홈 건수·품절 전환·첫 반영 지연·접속 쿠키)과 기본 조치를 안 해 본 화면 오류는 자동답변 종결"}, {"c": ["C"], "t": "기본 조치 후에도 계속되는 오류·판매가 오노출·다른 상품 리뷰·제3자 문자 수신은 상담원 배정"}], "auto": "(공통 첫인사)\n업무 진행에 불편을 드려 죄송합니다.\n\n[화면·메뉴가 안 열리는데 아직 기본 조치를 해 보지 않으신 경우]\n오늘의집은 구글 크롬 브라우저 사용을 권장드립니다. 아래 순서로 다시 시도해 주세요.\n1) 쿠키·캐시 삭제: 크롬 오른쪽 상단 더보기(점 세 개) > 설정 > 개인정보 보호 및 보안 > 인터넷 사용 기록 삭제 > 고급 > 기간 '전체 기간' > 삭제할 항목 선택 > 데이터 삭제\n2) 구글 크롬 시크릿 창에서 재시도\n3) 다른 PC에서 재시도\n그래도 안 되면 발생 메뉴, 오류 문구, 화면 캡처와 함께 시도하신 조치를 적어 새 문의로 남겨 주세요. 가능하시면 오류 화면에서 마우스 오른쪽 클릭 > 검사 > 네트워크(Network) 탭의 빨간 글씨 파일 헤더(Headers)·응답(Response) 화면과 콘솔(Console) 화면을 캡처해 주시면 확인이 빨라집니다.\n\n[상품 임시저장 오류(JSON parse error)]\n해당 오류가 발생하는 경우 임시저장을 제외하시고 신규 상품 등록으로 진행 부탁드립니다.\n\n[엑셀 파일 비밀번호 오류]\n아래 방법으로 다시 시도해 주세요.\n1) 비밀번호를 메모장에 입력해 복사(Ctrl+C)한 뒤 엑셀 비밀번호 입력 칸에 붙여넣기\n2) 엑셀 비밀번호 입력 시 한글/영어 전환 상태를 바꿔 각각 1회씩 입력\n\n[주문·배송 현황이 반영되지 않는 경우]\n주문 수집·송장번호 입력 후에도 미확인주문으로 보이거나, 배송중으로 바꿨는데 오로라 홈 현황에 반영되지 않는 경우 간혹 반영이 지연될 수 있습니다. 시간 여유를 두고 다시 확인해 주세요. 외부솔루션으로 수집한 문의 접수일이 0000-01-01로 나오면 쿠키·캐시 삭제 후 다시 확인해 주시고, 이용 중인 외부솔루션 측에도 오류가 있는지 확인 부탁드립니다. 시간이 지나도 그대로면 주문번호와 화면 캡처를 적어 새 문의로 남겨 주세요.\n\n[홈 화면 건수가 실제와 다른 경우]\n오로라 홈 화면의 현황 건수는 부득이 실제와 맞지 않을 수 있습니다. 개발팀에서도 인지하고 개선 예정이나 즉시 개선은 어려워 반영까지 시일이 걸릴 수 있습니다. 해당 메뉴에 들어가서 실제로 확인되는 건을 기준으로 처리 부탁드립니다. 고객센터 문의 건수는 홈 화면에 표시되지 않으니 오로라 > 문의/리뷰 > 고객센터 문의에서 확인해 주세요.\n\n[판매중으로 바꿨는데 품절로 바뀌는 경우]\n판매 상태를 일괄 변경할 때 재고가 0개인 상품이 있으면 해당 상품은 품절로 처리될 수 있습니다. 재고가 0개인 상품은 먼저 재고를 수정한 뒤 판매 상태를 바꿔 주세요.\n\n[파트너센터 페이지 접속이 안 되는 경우]\n아래 순서로 쿠키를 삭제한 뒤 다시 접속해 주세요.\n1) 크롬 오른쪽 상단 더보기 > 설정\n2) 개인 정보 보호 및 보안 > 쿠키 및 기타 사이트 데이터\n3) 모든 사이트 데이터 및 권한 보기 > 모든 데이터 삭제\n4) 오늘의집 파트너센터 링크 재접속\n그래도 접속되지 않으면 방화벽 설정을 확인하시고, 방화벽 해제 후 다시 접속해 주세요.\n\n[안내 문자를 받으신 경우]\n고객 문의 답변 등 안내 문자는 오로라에 등록된 주문/클레임 담당자 연락처로 발송됩니다. 담당자가 바뀌었다면 오로라 > 판매자정보 > 담당자 정보에서 담당자 정보 수정 버튼을 누른 뒤 저장해 주세요. 회사와 관계없는 번호로 받으셨다면 받으신 연락처를 적어 새 문의로 남겨 주세요.\n(증상에 해당하는 단락만, 맺음 A)", "ack": "남겨 주신 증상과 화면을 확인한 뒤 안내드리겠습니다. 확인 과정에서 오로라 화면 확인을 위해 별도로 요청드릴 수 있습니다.\n(판매가 오노출·다른 상품 리뷰·제3자 문자: \"확인이 필요한 건으로 담당 부서에 전달해 확인하겠습니다.\")", "info": "증상, 발생 경로, 오류 문구, 화면·네트워크·콘솔 캡처 유무, OS·브라우저, 시도한 조치, 관련 주문·상품번호, 가격 오노출 시 주문 접수 가격과 현재 판매가, 제3자 수신 연락처", "kms": "067_오류_Issue__대응.md, 087_오로라__.md, 058_셀러샵.md, 047_파트너센터_활용.md, 096_심층문의_이관_유형_및_이관_방법.md, 092_관리자_이관_유형_및_방법.md", "check": "1) 엑셀 비밀번호 안내 3종/4종 상충 — KMS 067에는 2가지만 있어 나머지 출처 확인\n2) '관리자 접속 허용'(10분 유효)은 팀 관리자만 진행하는 절차라 AI 답변에 넣지 않음\n3) 반영 지연은 KMS상 '같은 문의 인입량에 따라 양해 안내 또는 확인 요청' — AI는 인입량을 판단할 수 없어 1차는 양해 안내, 재문의 시 상담원\n4) 067과 058의 쿠키·캐시 삭제 경로 표기가 다름(둘 다 크롬)"}}, {"code": "PA007003", "draft": false, "name": "연동프로그램", "mid": "시스템", "vol": "85", "mode": "안내 후 조건부 상담원 연결", "utter": "네이버 쇼핑에 우리 상품 안 나오게 해주세요\n사방넷으로 상품 등록하는데 오늘의집에 안 올라가요\n네이버 가격비교 원부에 저희 상품 매칭해 주세요", "raw": "1. 네, 파트너님. 어떤 내용이 궁금하신가요?\n[외부 연동 솔루션] → 2 / [Open API] → 3 / [네이버 쇼핑 노출·비노출] → 4 / [네이버 가격비교(원부)·공식 인증마크] → 5 / [네이버 광고(파워링크·쇼핑검색광고) 중단] → 6 / [다나와·에누리 등 다른 비교 사이트] → 7\n\n2. 오늘의집은 아래 외부솔루션에 한해 이용하실 수 있습니다.\n사방넷, 샵링커, 샵플링, 셀릭, 셀메이트, 셀픽, 이지어드민, 이지위너, 플레이오토\n[외부솔루션으로 상품 등록·수정이 안 돼요] → 2-1 / [알겠어요] → 9\n2-1. 연동솔루션으로 신청하시면 정상 등록되지 않을 수 있어, 번거로우시겠지만 오로라에서 직접 등록 부탁드립니다. 외부솔루션 사용 중 발생한 기능 문제는 오늘의집에서 확인이 어려워 해당 외부솔루션 측으로 문의해 주세요.\n[솔루션 측에서 오늘의집에 문의하라고 했어요] → 2-2 / [알겠어요] → 9\n2-2. 확인을 위해 증상과 외부솔루션 측에서 받은 답변 내용을 알려주시겠어요?\n[증상, 솔루션명, 솔루션 측 답변 입력]\n담당 부서 확인이 필요해 상담원에게 연결해 드리겠습니다. 확인에 시간이 소요될 수 있는 점 양해 부탁드립니다.\n→ 상담원 인계 (T3-C)\n\n3. Open API 관련 문의는 정확한 안내를 위해 상담원에게 연결해 드리겠습니다. 문의하실 내용을 알려주세요.\n[문의 내용 입력]\n→ 상담원 인계 (T5)\n\n4. 오늘의집은 네이버 쇼핑 연동을 기본 제공하고 있어 별도 신청이 필요 없습니다. 검수를 통과해 최종 승인된 상품은 1영업일 이내 네이버 쇼핑에 연동됩니다.\n[노출이 안 돼요] → 4-1 / [비노출(연동 해제)하고 싶어요] → 4-2 / [신청한 건 처리 결과가 궁금해요] → 4-3 / [네이버 이미지가 이상해요] → 4-4\n4-1. 상품 등록 후 네이버 쇼핑 반영까지 최대 1영업일이 걸릴 수 있으니 시간 여유를 두고 확인해 주세요. 그래도 노출되지 않으면 아래 연동 조건을 확인해 주세요.\n- 이미지: 단일 상품은 대표이미지, 옵션 상품은 대표이미지 + 모든 옵션의 개별 이미지 필요. 로고·브랜드명 외 문구 삭제, JPG 형식, 원본 4000x4000 pixel 이하\n- 상품명: 브랜드명 + 상품명 + 옵션명1 + 옵션명2 합계 공백 포함 100자 이내 (브랜드명 15자 + 상품명 50자 + 옵션명 35자)\n- 네이버 쇼핑 클린 프로그램 위반 여부: 모음전으로 오인될 문구, 해외 상품 [해외]·리퍼 상품 [리퍼] 말머리 누락, 상품명 내 가격·단기 혜택 정보 등\n- 모음전 상품은 네이버 연동이 불가합니다.\n- 네이버 노출 상태가 비노출(N)이면 노출되지 않습니다.\n[조건을 다 지켰는데도 안 나와요] → 4-5 / [알겠어요] → 9\n4-2. 네이버 연동을 원하지 않으시면 아래 가이드의 신청서로 접수해 주세요.\n- [정책] 네이버 노출/쿠폰가 노출 등록 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29761391147929\n- 신청 양식([판매활동지원] 네이버노출 변경 신청 양식.xlsx)을 내려받아 작성 후 신청서 폼에 첨부 (xls·xlsx·csv, 최대 2000행)\n- 샵 ID와 샵명을 정확히 입력하고 신청 항목을 정확히 선택해 주세요. 불일치·오선택 시 반려됩니다.\n- 렌탈 상품은 신청할 수 없습니다.\n신청 후 처리까지 영업일 기준 최대 5일 소요되며, 이미 연동된 상품은 처리 후 상품 정보가 사라지기까지 최대 5일이 걸릴 수 있습니다. 처리 결과는 신청 시 적어주신 메일로 안내됩니다.\n네이버 비노출로 바꾸면 가격비교(원부)뿐 아니라 네이버 검색 전체에서 해당 상품이 노출되지 않습니다. → 9\n4-3. 신청 후 처리까지 영업일 기준 최대 5일이 소요될 수 있으며, 처리 결과는 신청 시 적어주신 메일로 안내됩니다. 먼저 메일을 확인해 주세요.\n[처리 불가 안내를 받았어요] → 4-3-1 / [처리됐다는데 익일이 지나도 계속 노출돼요] → 4-5 / [5영업일이 지났는데 결과 메일이 없어요] → 4-3-2 / [알겠어요] → 9\n4-3-1. 처리 불가 상세 사유는 신청 시 적어주신 메일로 안내드렸으니 확인 부탁드리며, 가이드를 확인하신 뒤 새로 신청해 주세요.\n- 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29761391147929 → 9\n4-3-2. 신청 처리 결과 확인을 위해 상품번호와 신청일을 함께 알려주시겠어요?\n[상품번호, 신청일 입력]\n담당 부서 확인을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-D)\n\n4-4. 네이버에 노출되는 이미지는 네이버 가이드에 따라 노출되는 영역입니다. 오늘의집과 네이버의 대표이미지가 다르다면 아래를 확인해 주세요.\n1) 대표 옵션에 옵션 이미지가 등록되어 있으면 해당 이미지가 대표이미지로 노출될 수 있으니 삭제 후 확인\n2) 네이버 노출 가이드상 이미지에 텍스트·로고 부착이 불가해 이미지가 바뀌어 등록될 수 있으니, 텍스트·로고가 없는 이미지로 수정\n그 외 네이버 노출 이미지 수정은 오늘의집에서 작업이 불가해 네이버 측에 문의해 주세요. → 9\n4-5. 확인을 위해 상품번호와 현재 네이버 노출 상태(캡처)를 첨부해 주세요. 담당 부서 확인을 위해 상담원에게 연결해 드리겠습니다.\n[상품번호, 캡처 첨부] → 상담원 인계 (T3-C)\n\n5. 원하시는 내용을 선택해 주세요.\n[원부 매칭·매칭 해제] → 5-1 / [원부 자체 생성·삭제] → 5-2 / [네이버 가격비교 공식 인증마크 부착·해제] → 5-3\n5-1. 원부 매칭은 이미 생성되어 있는 네이버 원부(카탈로그)에 오늘의집 상품이 노출되도록 요청하는 것으로, 상품의 대표옵션으로만 매칭할 수 있습니다. 네이버 노출 상태가 노출(Y)이어야 원부에 노출됩니다.\n상품번호와 원부번호(카탈로그번호)를 알려주세요.\n[상품번호, 원부번호 입력, 매칭/해제 선택]\n담당 부서 전달을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)\n5-2. 원부(카탈로그) 페이지 자체의 생성·삭제는 네이버에서 관리하는 영역이라 오늘의집에서 처리할 수 없습니다. 원부 생성은 담당 MD 또는 네이버 측으로, 원부 페이지 삭제는 네이버 측으로 문의해 주세요.\n원부를 삭제하지 않고 노출만 막고 싶으시면 네이버 비노출(N)로 신청하실 수 있으나, 이 경우 네이버 검색 전체에서 상품이 노출되지 않습니다. → 9\n5-3. 상품번호와 브랜드명을 알려주세요.\n[상품번호, 브랜드명 입력]\n담당 부서 확인을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)\n\n6. 네이버 쇼핑검색광고는 네이버 시스템 로직에 따라 자동 설정·노출되는 영역입니다. 노출 중지를 원하시면 아래 정보를 알려주세요.\n- 광고 종류(파워링크 / 쇼핑검색광고)\n- 상품번호 또는 브랜드명\n- 중지할 검색 키워드(브랜드 전체 또는 개별 키워드)\n- 요청 사유\n[정보 입력]\n담당 부서 전달을 위해 상담원에게 연결해 드리겠습니다. 요청 후에도 삭제까지 시일이 걸릴 수 있는 점 양해 부탁드립니다. 광고 자체에 대한 상세 문의는 네이버 측으로 해 주세요.\n→ 상담원 인계 (T3-C)\n\n7. 원하시는 내용을 선택해 주세요.\n[다나와 노출 요청] → 7-1 / [에누리 등 다른 사이트 노출 요청] → 7-2 / [다나와·에누리·구글 비노출 요청] → 7-3 / [외부몰 상품번호 확인] → 7-4\n7-1. 다나와 노출을 위해 상품명, 상품번호·옵션번호, 카테고리(1단계)를 알려주세요.\n[정보 입력] → 담당 부서 전달을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)\n7-2. 현재 외부 비교 사이트는 다나와에 한해서만 노출 신청이 가능합니다. 에누리 등록 불가 사유는 상세 확인이 어려워, 에누리 노출 관련은 에누리 측에 문의해 주세요. → 9\n7-3. 외부 사이트 비노출을 원하시면 상품 상태를 판매정지로 변경해 주세요.\n[이미 판매정지 상태인데도 노출돼요] → 7-3-1 / [알겠어요] → 9\n7-3-1. 확인하실 상품번호를 알려주세요.\n[상품번호 입력]\n이미 판매정지 상태인데도 노출되고 있어 담당 부서 확인이 필요합니다. 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)\n7-4. 오늘의집 상품의 외부몰 상품번호는 '상품코드-대표옵션번호' 형식입니다. (예: 상품코드 1234567, 대표 옵션번호 12387 → 1234567-12387) → 9\n\n9. 더 궁금하신 점이 있으신가요?\n[아니요] → 상담 종료 (유형: PA007003)\n[네] → 용건 다시 받기 (바뀐 용건의 유형으로 진행)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 어떤 내용이 궁금하신가요?\"]:::bot\nN2[\"<b>2<\/b> 오늘의집은 아래 외부솔루션에 한해 이용하실<br/>수 있습니다.\"]:::bot\nN2_1[\"<b>2-1<\/b> 연동솔루션으로 신청하시면 정상 등록되지 않을<br/>수 있어, 번거로우시겠지만 오로라에서 직접<br/>등록 부탁드립니다. 외부솔루션 사용 중<br/>발생한 기능 문제는 오늘의집에서 확인이<br/>어려워 해당 외부솔루션 측으로 문의해<br/>주세요.\"]:::bot\nN2_2[\"<b>2-2<\/b> 확인을 위해 증상과 외부솔루션 측에서 받은<br/>답변 내용을 알려주시겠어요?\"]:::bot\nN3[\"<b>3<\/b> Open API 관련 문의는 정확한 안내를<br/>위해 상담원에게 연결해 드리겠습니다.<br/>문의하실 내용을 알려주세요.\"]:::bot\nN4[\"<b>4<\/b> 오늘의집은 네이버 쇼핑 연동을 기본 제공하고<br/>있어 별도 신청이 필요 없습니다. 검수를<br/>통과해 최종 승인된 상품은 1영업일 이내<br/>네이버 쇼핑에 연동됩니다.\"]:::bot\nN4_1[\"<b>4-1<\/b> 상품 등록 후 네이버 쇼핑 반영까지 최대<br/>1영업일이 걸릴 수 있으니 시간 여유를 두고<br/>확인해 주세요. 그래도 노출되지 않으면 아래<br/>연동 조건을 확인해 주세요.\"]:::bot\nN4_2[\"<b>4-2<\/b> 네이버 연동을 원하지 않으시면 아래 가이드의<br/>신청서로 접수해 주세요.\"]:::bot\nN4_3[\"<b>4-3<\/b> 신청 후 처리까지 영업일 기준 최대 5일이<br/>소요될 수 있으며, 처리 결과는 신청 시<br/>적어주신 메일로 안내됩니다. 먼저 메일을<br/>확인해 주세요.\"]:::bot\nN4_3_1[\"<b>4-3-1<\/b> 처리 불가 상세 사유는 신청 시 적어주신<br/>메일로 안내드렸으니 확인 부탁드리며,<br/>가이드를 확인하신 뒤 새로 신청해 주세요.\"]:::bot\nN4_3_2[\"<b>4-3-2<\/b> 신청 처리 결과 확인을 위해 상품번호와<br/>신청일을 함께 알려주시겠어요?\"]:::bot\nN4_4[\"<b>4-4<\/b> 네이버에 노출되는 이미지는 네이버 가이드에<br/>따라 노출되는 영역입니다. 오늘의집과<br/>네이버의 대표이미지가 다르다면 아래를 확인해<br/>주세요.\"]:::bot\nN4_5[\"<b>4-5<\/b> 확인을 위해 상품번호와 현재 네이버 노출<br/>상태(캡처)를 첨부해 주세요. 담당 부서<br/>확인을 위해 상담원에게 연결해 드리겠습니다.\"]:::bot\nN5[\"<b>5<\/b> 원하시는 내용을 선택해 주세요.\"]:::bot\nN5_1[\"<b>5-1<\/b> 원부 매칭은 이미 생성되어 있는 네이버<br/>원부(카탈로그)에 오늘의집 상품이 노출되도록<br/>요청하는 것으로, 상품의 대표옵션으로만<br/>매칭할 수 있습니다. 네이버 노출 상태가<br/>노출(Y)이어야 원부에 노출됩니다.\"]:::bot\nN5_2[\"<b>5-2<\/b> 원부(카탈로그) 페이지 자체의 생성·삭제는<br/>네이버에서 관리하는 영역이라 오늘의집에서<br/>처리할 수 없습니다. 원부 생성은 담당 MD<br/>또는 네이버 측으로, 원부 페이지 삭제는<br/>네이버 측으로 문의해 주세요.\"]:::bot\nN5_3[\"<b>5-3<\/b> 상품번호와 브랜드명을 알려주세요.\"]:::bot\nN6[\"<b>6<\/b> 네이버 쇼핑검색광고는 네이버 시스템 로직에<br/>따라 자동 설정·노출되는 영역입니다. 노출<br/>중지를 원하시면 아래 정보를 알려주세요.\"]:::bot\nN7[\"<b>7<\/b> 원하시는 내용을 선택해 주세요.\"]:::bot\nN7_1[\"<b>7-1<\/b> 다나와 노출을 위해 상품명,<br/>상품번호·옵션번호, 카테고리(1단계)를<br/>알려주세요.\"]:::bot\nN7_2[\"<b>7-2<\/b> 현재 외부 비교 사이트는 다나와에 한해서만<br/>노출 신청이 가능합니다. 에누리 등록 불가<br/>사유는 상세 확인이 어려워, 에누리 노출<br/>관련은 에누리 측에 문의해 주세요.\"]:::bot\nN7_3[\"<b>7-3<\/b> 외부 사이트 비노출을 원하시면 상품 상태를<br/>판매정지로 변경해 주세요.\"]:::bot\nN7_3_1[\"<b>7-3-1<\/b> 확인하실 상품번호를 알려주세요.\"]:::bot\nN7_4[\"<b>7-4<\/b> 오늘의집 상품의 외부몰 상품번호는<br/>'상품코드-대표옵션번호' 형식입니다. (예:<br/>상품코드 1234567, 대표 옵션번호<br/>12387\"]:::bot\nN9[\"<b>9<\/b> 더 궁금하신 점이 있으신가요?\"]:::bot\nS --> N1\nN1 -->|\"외부 연동 솔루션\"| N2\nN1 -->|\"Open API\"| N3\nN1 -->|\"네이버 쇼핑 노출·비노출\"| N4\nN1 -->|\"네이버 가격비교(원부)·공식 인증마크\"| N5\nN1 -->|\"네이버 광고(파워링크·쇼핑검색광고) 중단\"| N6\nN1 -->|\"다나와·에누리 등 다른 비교 사이트\"| N7\nN2 -->|\"외부솔루션으로 상품 등록·수정이 안 돼요\"| N2_1\nN2 -->|\"알겠어요\"| N9\nN2_1 -->|\"솔루션 측에서 오늘의집에 문의하라고 했어요\"| N2_2\nN2_1 -->|\"알겠어요\"| N9\nN2_2 --> HO_T3C\nN2_2 -->|\"증상, 솔루션명, 솔루션 측 답변 입력\"| N3\nN3 --> HO_T5\nN3 -->|\"문의 내용 입력\"| N4\nN4 -->|\"노출이 안 돼요\"| N4_1\nN4 -->|\"비노출(연동 해제)하고 싶어요\"| N4_2\nN4 -->|\"신청한 건 처리 결과가 궁금해요\"| N4_3\nN4 -->|\"네이버 이미지가 이상해요\"| N4_4\nN4_1 -->|\"조건을 다 지켰는데도 안 나와요\"| N4_5\nN4_1 -->|\"알겠어요\"| N9\nN4_3 -->|\"처리 불가 안내를 받았어요\"| N4_3_1\nN4_3 -->|\"처리됐다는데 익일이 지나도 계속 노출돼요\"| N4_5\nN4_3 -->|\"5영업일이 지났는데 결과 메일이 없어요\"| N4_3_2\nN4_3 -->|\"알겠어요\"| N9\nN4_3_2 -->|\"상품번호, 신청일 입력\"| N4_4\nN4_5 -->|\"상품번호, 캡처 첨부\"| HO_T3C\nN5 -->|\"원부 매칭·매칭 해제\"| N5_1\nN5 -->|\"원부 자체 생성·삭제\"| N5_2\nN5 -->|\"네이버 가격비교 공식 인증마크 부착·해제\"| N5_3\nN5_1 -->|\"상품번호, 원부번호 입력, 매칭/해제 선택\"| N5_2\nN5_3 -->|\"상품번호, 브랜드명 입력\"| N6\nN6 --> HO_T3C\nN6 -->|\"정보 입력\"| N7\nN7 -->|\"다나와 노출 요청\"| N7_1\nN7 -->|\"에누리 등 다른 사이트 노출 요청\"| N7_2\nN7 -->|\"다나와·에누리·구글 비노출 요청\"| N7_3\nN7 -->|\"외부몰 상품번호 확인\"| N7_4\nN7_1 -->|\"정보 입력\"| HO_T3C\nN7_2 --> N9\nN7_3 -->|\"이미 판매정지 상태인데도 노출돼요\"| N7_3_1\nN7_3 -->|\"알겠어요\"| N9\nN7_3_1 -->|\"상품번호 입력\"| N7_4\nN7_4 --> TX2\nN9 -->|\"아니요\"| END\nN9 -->|\"네\"| SWX4\nN4_2 --> N4_3\nN4_3_1 --> N4_3_2\nN4_4 --> N4_5\nN5_2 --> N5_3\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nHO_T5([\"상담원 인계<br/>답변 불가\"]):::ho\nTX2[\"1234567-12387)<br/>→ 9\"]:::txt\nEND([\"상담 종료\"]):::fin\nSWX4[/\"용건 다시 받기 (바뀐<br/>용건의 유형으로 진행)\"/]:::sw", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 어떤 내용이 궁금하신가요?", "sec": false, "body": []}, {"k": "2", "id": "2", "t": "오늘의집은 아래 외부솔루션에 한해 이용하실 수 있습니다.", "sec": false, "body": ["사방넷, 샵링커, 샵플링, 셀릭, 셀메이트, 셀픽, 이지어드민, 이지위너, 플레이오토"]}, {"k": "2-1", "id": "2-1", "t": "연동솔루션으로 신청하시면 정상 등록되지 않을 수 있어, 번거로우시겠지만 오로라에서 직접 등록 부탁드립니다. 외부솔루션 사용 중 발생한 기능 문제는 오늘의집에서 확인이 어려워 해당 외부솔루션 측으로 문의해 주세요.", "sec": false, "body": []}, {"k": "2-2", "id": "2-2", "t": "확인을 위해 증상과 외부솔루션 측에서 받은 답변 내용을 알려주시겠어요?", "sec": false, "body": ["담당 부서 확인이 필요해 상담원에게 연결해 드리겠습니다. 확인에 시간이 소요될 수 있는 점 양해 부탁드립니다."]}, {"k": "3", "id": "3", "t": "Open API 관련 문의는 정확한 안내를 위해 상담원에게 연결해 드리겠습니다. 문의하실 내용을 알려주세요.", "sec": false, "body": []}, {"k": "4", "id": "4", "t": "오늘의집은 네이버 쇼핑 연동을 기본 제공하고 있어 별도 신청이 필요 없습니다. 검수를 통과해 최종 승인된 상품은 1영업일 이내 네이버 쇼핑에 연동됩니다.", "sec": false, "body": []}, {"k": "4-1", "id": "4-1", "t": "상품 등록 후 네이버 쇼핑 반영까지 최대 1영업일이 걸릴 수 있으니 시간 여유를 두고 확인해 주세요. 그래도 노출되지 않으면 아래 연동 조건을 확인해 주세요.", "sec": false, "body": ["- 이미지: 단일 상품은 대표이미지, 옵션 상품은 대표이미지 + 모든 옵션의 개별 이미지 필요. 로고·브랜드명 외 문구 삭제, JPG 형식, 원본 4000x4000 pixel 이하", "- 상품명: 브랜드명 + 상품명 + 옵션명1 + 옵션명2 합계 공백 포함 100자 이내 (브랜드명 15자 + 상품명 50자 + 옵션명 35자)", "- 네이버 쇼핑 클린 프로그램 위반 여부: 모음전으로 오인될 문구, 해외 상품 [해외]·리퍼 상품 [리퍼] 말머리 누락, 상품명 내 가격·단기 혜택 정보 등", "- 모음전 상품은 네이버 연동이 불가합니다.", "- 네이버 노출 상태가 비노출(N)이면 노출되지 않습니다."]}, {"k": "4-2", "id": "4-2", "t": "네이버 연동을 원하지 않으시면 아래 가이드의 신청서로 접수해 주세요.", "sec": false, "body": ["- [정책] 네이버 노출/쿠폰가 노출 등록 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29761391147929", "- 신청 양식([판매활동지원] 네이버노출 변경 신청 양식.xlsx)을 내려받아 작성 후 신청서 폼에 첨부 (xls·xlsx·csv, 최대 2000행)", "- 샵 ID와 샵명을 정확히 입력하고 신청 항목을 정확히 선택해 주세요. 불일치·오선택 시 반려됩니다.", "- 렌탈 상품은 신청할 수 없습니다.", "신청 후 처리까지 영업일 기준 최대 5일 소요되며, 이미 연동된 상품은 처리 후 상품 정보가 사라지기까지 최대 5일이 걸릴 수 있습니다. 처리 결과는 신청 시 적어주신 메일로 안내됩니다.", "네이버 비노출로 바꾸면 가격비교(원부)뿐 아니라 네이버 검색 전체에서 해당 상품이 노출되지 않습니다. → 9"]}, {"k": "4-3", "id": "4-3", "t": "신청 후 처리까지 영업일 기준 최대 5일이 소요될 수 있으며, 처리 결과는 신청 시 적어주신 메일로 안내됩니다. 먼저 메일을 확인해 주세요.", "sec": false, "body": []}, {"k": "4-3-1", "id": "4-3-1", "t": "처리 불가 상세 사유는 신청 시 적어주신 메일로 안내드렸으니 확인 부탁드리며, 가이드를 확인하신 뒤 새로 신청해 주세요.", "sec": false, "body": ["- 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29761391147929 → 9"]}, {"k": "4-3-2", "id": "4-3-2", "t": "신청 처리 결과 확인을 위해 상품번호와 신청일을 함께 알려주시겠어요?", "sec": false, "body": ["담당 부서 확인을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-D)"]}, {"k": "4-4", "id": "4-4", "t": "네이버에 노출되는 이미지는 네이버 가이드에 따라 노출되는 영역입니다. 오늘의집과 네이버의 대표이미지가 다르다면 아래를 확인해 주세요.", "sec": false, "body": ["1) 대표 옵션에 옵션 이미지가 등록되어 있으면 해당 이미지가 대표이미지로 노출될 수 있으니 삭제 후 확인", "2) 네이버 노출 가이드상 이미지에 텍스트·로고 부착이 불가해 이미지가 바뀌어 등록될 수 있으니, 텍스트·로고가 없는 이미지로 수정", "그 외 네이버 노출 이미지 수정은 오늘의집에서 작업이 불가해 네이버 측에 문의해 주세요. → 9"]}, {"k": "4-5", "id": "4-5", "t": "확인을 위해 상품번호와 현재 네이버 노출 상태(캡처)를 첨부해 주세요. 담당 부서 확인을 위해 상담원에게 연결해 드리겠습니다.", "sec": false, "body": []}, {"k": "5", "id": "5", "t": "원하시는 내용을 선택해 주세요.", "sec": false, "body": []}, {"k": "5-1", "id": "5-1", "t": "원부 매칭은 이미 생성되어 있는 네이버 원부(카탈로그)에 오늘의집 상품이 노출되도록 요청하는 것으로, 상품의 대표옵션으로만 매칭할 수 있습니다. 네이버 노출 상태가 노출(Y)이어야 원부에 노출됩니다.", "sec": false, "body": ["상품번호와 원부번호(카탈로그번호)를 알려주세요.", "담당 부서 전달을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)"]}, {"k": "5-2", "id": "5-2", "t": "원부(카탈로그) 페이지 자체의 생성·삭제는 네이버에서 관리하는 영역이라 오늘의집에서 처리할 수 없습니다. 원부 생성은 담당 MD 또는 네이버 측으로, 원부 페이지 삭제는 네이버 측으로 문의해 주세요.", "sec": false, "body": ["원부를 삭제하지 않고 노출만 막고 싶으시면 네이버 비노출(N)로 신청하실 수 있으나, 이 경우 네이버 검색 전체에서 상품이 노출되지 않습니다. → 9"]}, {"k": "5-3", "id": "5-3", "t": "상품번호와 브랜드명을 알려주세요.", "sec": false, "body": ["담당 부서 확인을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)"]}, {"k": "6", "id": "6", "t": "네이버 쇼핑검색광고는 네이버 시스템 로직에 따라 자동 설정·노출되는 영역입니다. 노출 중지를 원하시면 아래 정보를 알려주세요.", "sec": false, "body": ["- 광고 종류(파워링크 / 쇼핑검색광고)", "- 상품번호 또는 브랜드명", "- 중지할 검색 키워드(브랜드 전체 또는 개별 키워드)", "- 요청 사유", "담당 부서 전달을 위해 상담원에게 연결해 드리겠습니다. 요청 후에도 삭제까지 시일이 걸릴 수 있는 점 양해 부탁드립니다. 광고 자체에 대한 상세 문의는 네이버 측으로 해 주세요."]}, {"k": "7", "id": "7", "t": "원하시는 내용을 선택해 주세요.", "sec": false, "body": []}, {"k": "7-1", "id": "7-1", "t": "다나와 노출을 위해 상품명, 상품번호·옵션번호, 카테고리(1단계)를 알려주세요.", "sec": false, "body": []}, {"k": "7-2", "id": "7-2", "t": "현재 외부 비교 사이트는 다나와에 한해서만 노출 신청이 가능합니다. 에누리 등록 불가 사유는 상세 확인이 어려워, 에누리 노출 관련은 에누리 측에 문의해 주세요. → 9", "sec": false, "body": []}, {"k": "7-3", "id": "7-3", "t": "외부 사이트 비노출을 원하시면 상품 상태를 판매정지로 변경해 주세요.", "sec": false, "body": []}, {"k": "7-3-1", "id": "7-3-1", "t": "확인하실 상품번호를 알려주세요.", "sec": false, "body": ["이미 판매정지 상태인데도 노출되고 있어 담당 부서 확인이 필요합니다. 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)"]}, {"k": "7-4", "id": "7-4", "t": "오늘의집 상품의 외부몰 상품번호는 '상품코드-대표옵션번호' 형식입니다. (예: 상품코드 1234567, 대표 옵션번호 12387 → 1234567-12387) → 9", "sec": false, "body": []}, {"k": "9", "id": "9", "t": "더 궁금하신 점이 있으신가요?", "sec": false, "body": []}], "hocond": "외부솔루션 측이 오늘의집 확인 요청·네이버 비노출 처리 후 지속 노출·원부 매칭/해제·공식 인증마크·네이버 광고 중단·다나와 노출·판매정지 상품 외부 노출 T3-C / 네이버 노출·비노출 신청 5영업일 경과·결과 메일 미수신 T3-D / Open API 문의 T5 / 상담원 직접 요청 T1", "hoinfo": "상품번호(옵션번호), 요청 종류(노출/비노출/원부 매칭/해제/인증마크/광고 중단/다나와), 원부번호(카탈로그번호), 브랜드명, 광고 종류·검색 키워드·요청 사유, 네이버 노출 상태(Y/N)와 실제 노출 캡처, 네이버 노출·비노출 신청일(파트너 입력), 외부솔루션명·증상·솔루션 측 답변. 신청 이력과 상품 판매 상태는 상담원이 직접 확인합니다.", "kms": "057_키워드___모음전___네이버___외부몰.md, 087_오로라__.md, 095_커머스_정책_이관_유형_및_이관_방법.md, 096_심층문의_이관_유형_및_이관_방법.md, 092_관리자_이관_유형_및_방법.md, 060_상담_태그별_주요_문의유형_.md", "check": "1) 처리 기간 상충: 상담원 안내 1~3일 vs KMS 057 '신청 후 5영업일 이내'(연동 상품 정보 소멸 최대 5일, 처리 완료 후 익일까지 지속 시 재인입) / 2) Open API 신청·연동 방법은 KMS에 근거 없음(059·065에 전자상거래업자 부호 관련 API 필드 변경만 있음) → T5 처리 / 3) 네이버 광고 중단 이관처 상충: 057은 '커머스 정책팀 전달', 092·096은 관리자/심층문의 매크로 접수(26-08-31 변경), 최신 기준 확인 / 4) 외부솔루션 오늘의집 확인 요청은 087상 '서비스운영팀 문의', 이관 채널 확정 필요 / 5) 다나와 노출 신청 경로가 상담 이관만 있음, 별도 신청서 여부 확인 / 6) (1차 전환) 4-3 신청 결과 문의를 '최대 5영업일·결과는 메일 안내' 기준으로 응대하므로 1) 처리 기간 상충이 정리돼야 5영업일 경과 판단(T3-D 인계 시점)이 맞음 / 7) (1차 전환) 7-3 판매정지 여부를 파트너 응답으로 나누므로, 판매중 상품을 판매정지로 잘못 알고 인계되는 건은 상담원이 상태 확인 후 판매정지 변경 안내로 종결", "api": "R-13, R-05", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 요청 종류: \n· (해당 시: 네이버·외부 사이트 관련) 상품번호(옵션번호): \n· (해당 시: 솔루션 측이 확인 요청) 솔루션명, 증상, 솔루션 측 답변: \n· (해당 시: 처리 결과) 신청일: \n· (해당 시: 계속 노출됨) 현재 노출 화면 캡처: 첨부파일로 올려 주세요\n· (해당 시: 원부 매칭·해제) 원부번호(카탈로그번호), 매칭/해제 구분: \n· (해당 시: 인증마크) 브랜드명: \n· (해당 시: 네이버 광고 중단) 광고 종류·중단 범위(브랜드 전체/개별 키워드)·검색 키워드·사유: \n· (해당 시: 다나와 노출) 상품명·카테고리(1단계): \n· (해당 시: 외부 사이트 비노출) 오로라 판매 상태 (판매중·일시품절 / 판매정지): \n\n문의 내용: ", "mode": "조건별: 솔루션 목록·네이버 연동 조건·비노출 신청 방법·신청 5영업일 이내 결과 대기·원부 생성·삭제·이미지·에누리·외부몰 상품번호·판매중 상품 외부 비노출 방법은 자동답변 종결 / 솔루션 측 확인 요청·Open API·5영업일 경과·처리 후 지속 노출·원부 매칭·인증마크·네이버 광고 중단·다나와 노출·판매정지 상품 외부 노출은 상담원 배정", "segs": [{"c": ["A"], "t": "솔루션 목록·네이버 연동 조건·비노출 신청 방법·신청 5영업일 이내 결과 대기·원부 생성·삭제·이미지·에누리·외부몰 상품번호·판매중 상품 외부 비노출 방법은 자동답변 종결"}, {"c": ["C"], "t": "솔루션 측 확인 요청·Open API·5영업일 경과·처리 후 지속 노출·원부 매칭·인증마크·네이버 광고 중단·다나와 노출·판매정지 상품 외부 노출은 상담원 배정"}], "auto": "(공통 첫인사)\n\n[외부 연동 솔루션]\n오늘의집은 아래 외부솔루션에 한해 이용하실 수 있습니다: 사방넷, 샵링커, 샵플링, 셀릭, 셀메이트, 셀픽, 이지어드민, 이지위너, 플레이오토\n연동솔루션으로 신청하시면 정상 등록되지 않을 수 있어, 번거로우시겠지만 오로라에서 직접 등록 부탁드립니다. 외부솔루션 사용 중 발생한 기능 문제는 오늘의집에서 확인이 어려워 해당 외부솔루션 측으로 문의해 주세요.\n\n[네이버 쇼핑 노출이 안 되는 경우]\n오늘의집은 네이버 쇼핑 연동을 기본 제공하고 있어 별도 신청이 필요 없으며, 검수를 통과해 최종 승인된 상품은 1영업일 이내 네이버 쇼핑에 연동됩니다. 그래도 노출되지 않으면 아래 연동 조건을 확인해 주세요.\n- 이미지: 단일 상품은 대표이미지, 옵션 상품은 대표이미지 + 모든 옵션의 개별 이미지 필요. 로고·브랜드명 외 문구 삭제, JPG 형식, 원본 4000x4000 pixel 이하\n- 상품명: 브랜드명 + 상품명 + 옵션명1 + 옵션명2 합계 공백 포함 100자 이내 (브랜드명 15자 + 상품명 50자 + 옵션명 35자)\n- 네이버 쇼핑 클린 프로그램 위반 여부: 모음전으로 오인될 문구, 해외 상품 [해외]·리퍼 상품 [리퍼] 말머리 누락, 상품명 내 가격·단기 혜택 정보 등\n- 모음전 상품은 네이버 연동이 불가하며, 네이버 노출 상태가 비노출(N)이면 노출되지 않습니다.\n조건을 모두 지켰는데도 노출되지 않으면 상품번호와 현재 노출 화면을 캡처해 새 문의로 남겨 주세요.\n\n[네이버 비노출(연동 해제)을 원하시는 경우]\n아래 가이드의 신청서로 접수해 주세요.\n- [정책] 네이버 노출/쿠폰가 노출 등록 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29761391147929\n- 신청 양식([판매활동지원] 네이버노출 변경 신청 양식.xlsx)을 내려받아 작성 후 신청서 폼에 첨부 (xls·xlsx·csv, 최대 2000행)\n- 샵 ID와 샵명을 정확히 입력하고 신청 항목을 정확히 선택해 주세요. 불일치·오선택 시 반려됩니다. 렌탈 상품은 신청할 수 없습니다.\n신청 후 처리까지 영업일 기준 최대 5일 소요되며, 이미 연동된 상품은 처리 후 상품 정보가 사라지기까지 최대 5일이 걸릴 수 있습니다. 처리 결과는 신청 시 적어 주신 메일로 안내됩니다. 네이버 비노출로 바꾸면 가격비교(원부)뿐 아니라 네이버 검색 전체에서 해당 상품이 노출되지 않습니다.\n\n[신청한 네이버 노출·비노출 결과를 기다리시는 경우] (신청일로부터 5영업일 이내)\n신청 후 처리까지 영업일 기준 최대 5일이 소요될 수 있으며 결과는 신청 시 적어 주신 메일로 안내됩니다. 5영업일이 지나도 결과 메일이 없으면 상품번호와 신청일을 적어 새 문의로 남겨 주세요.\n\n[네이버에 보이는 이미지가 다른 경우]\n네이버에 노출되는 이미지는 네이버 가이드에 따라 노출되는 영역입니다. 대표 옵션에 옵션 이미지가 등록되어 있으면 해당 이미지가 대표이미지로 노출될 수 있으니 삭제 후 확인해 주시고, 네이버 노출 가이드상 이미지에 텍스트·로고 부착이 불가해 이미지가 바뀌어 등록될 수 있으니 텍스트·로고가 없는 이미지로 수정해 주세요. 그 외 네이버 노출 이미지 수정은 오늘의집에서 작업이 불가해 네이버 측에 문의해 주세요.\n\n[원부(카탈로그) 생성·삭제]\n원부 페이지 자체의 생성·삭제는 네이버에서 관리하는 영역이라 오늘의집에서 처리할 수 없습니다. 원부 생성은 담당 MD 또는 네이버 측으로, 원부 페이지 삭제는 네이버 측으로 문의해 주세요. 원부를 삭제하지 않고 노출만 막으시려면 네이버 비노출(N)로 신청하실 수 있으나, 이 경우 네이버 검색 전체에서 상품이 노출되지 않습니다.\n\n[다른 비교 사이트·외부몰]\n- 현재 외부 비교 사이트는 다나와에 한해서만 노출 신청이 가능합니다. 에누리 노출 관련은 에누리 측에 문의해 주세요.\n- 다나와·에누리·구글 등 외부 사이트에서 판매중(또는 일시품절) 상품을 비노출하시려면 상품 상태를 판매정지로 변경해 주세요.\n- 오늘의집 상품의 외부몰 상품번호는 '상품코드-대표옵션번호' 형식입니다. (예: 상품코드 1234567, 대표 옵션번호 12387 → 1234567-12387)\n(요청 종류에 해당하는 단락만, 맺음 A)", "ack": "남겨 주신 내용을 담당 부서에 전달해 확인하겠습니다. 확인에 시간이 소요될 수 있는 점 양해 부탁드립니다.\n(네이버 광고 중단: \"네이버 광고는 네이버 시스템 로직에 따라 노출되는 영역이라, 요청 후에도 삭제까지 시일이 걸릴 수 있습니다. 광고 자체에 대한 상세 문의는 네이버 측으로 해 주세요.\")\n(원부 매칭: \"원부 매칭은 상품의 대표옵션으로만 가능하며, 네이버 노출 상태가 노출(Y)이어야 원부에 노출됩니다.\")", "info": "상품번호(옵션번호), 요청 종류, 원부번호, 브랜드명, 광고 종류·중단 범위·검색 키워드·사유, 네이버 노출 상태 캡처, 신청일, 솔루션명·증상·솔루션 측 답변, 다나와 노출 상품명·카테고리", "kms": "057_키워드___모음전___네이버___외부몰.md, 087_오로라__.md, 095_커머스_정책_이관_유형_및_이관_방법.md, 096_심층문의_이관_유형_및_이관_방법.md, 092_관리자_이관_유형_및_방법.md", "check": "1) 네이버 노출 처리 기간: 상담원 안내 1~3일 vs KMS 057 5영업일\n2) Open API 신청·연동 방법 KMS 근거 없음 (상담원 배정)\n3) 네이버 광고 중단 처리 부서 상충(057 커머스 정책 vs 092·096)\n4) 다나와 노출 신청 경로가 상담 접수만 있음 — 별도 신청서 여부 확인"}}, {"code": "PA009001", "draft": false, "name": "단순 정보변경", "mid": "정보변경", "vol": "", "mode": "안내 후 조건부 상담원 연결", "utter": "고객센터 전화번호 바꾸려면 어디서 하나요?\n주문 담당자 연락처를 변경하고 싶어요\n셀러샵명 변경 신청한 거 언제 반영돼요?", "raw": "(판별 기준: 서류 첨부 없이 오로라에서 바꿀 수 있는 항목만 이 유형\n- 즉시 반영: 홈페이지, 사업자 전화번호, 대표자 이메일, 고객센터 전화번호, 고객센터 이메일\n- 직접 수정·저장: 담당자 정보(영업 담당자, 주문/클레임 담당자, 회계 담당자)\n- 검수 후 반영이지만 서류 근거 없음: 셀러샵명 {확인 필요: 서류 필요 여부}\n- 그 외(통신판매업 신고번호, 회사명, 업태, 종목, 사업장 주소, 대표자 이름, 공동 대표자 이름, 정산계좌, 사업자번호, 과세유형, 양도양수, 휴·퇴점)는 서류 정보변경 (유형: PA009002))\n1. 네, 파트너님. 변경하실 항목을 선택해 주세요.\n[홈페이지·전화번호·대표자 이메일·고객센터 전화번호·고객센터 이메일] → 2 / [담당자 정보(영업·주문/클레임·회계 담당자)] → 3 / [셀러샵명] → 4 / [요청한 정보변경 결과 확인] → 5 / [그 외 항목(회사명·주소·대표자·정산계좌·사업자번호 등)] → 서류 정보변경으로 전환 (유형: PA009002)\n(해외 파트너사 → 6)\n\n2. 해당 항목은 오로라에서 직접 수정하시면 바로 반영됩니다.\n- 경로: [오로라 > 판매자 정보 > 판매자 정보]에서 수정\n- 즉시 반영 항목: 홈페이지 / 전화번호 / 대표자 이메일 / 고객센터 전화번호 / 고객센터 이메일\n추가 확인이 필요하시면 [정보변경] 정보변경 가이드(https://www.partnerbucketplace.com/hc/ko/articles/29543329706521)를 참고해 주세요.\n[상품 상세 하단 판매자 정보에 전화번호 하이픈이 이상하게 나와요] → 2-1 / [완료] → 9\n2-1. 해당 내용은 개발팀에서 확인한 이슈이나 즉시 개선이 어려운 항목으로, 반영까지 상당한 시일이 소요될 예정입니다. 불편을 드려 죄송합니다. → 9\n\n3. [오로라 > 판매자정보 > 담당자 정보]에서 담당자 정보 수정 버튼을 누른 뒤 수정 사항을 저장해 주세요. 영업 담당자, 주문/클레임 담당자, 회계 담당자 정보를 최신 연락처로 관리하실 수 있습니다.\n주문/클레임 담당자 정보(알림톡)를 입력해 두시면 미확인 주문, 주문 확인 지연, 48시간 이내 미답변 문의 알림톡을 받으실 수 있습니다. → 9\n\n4. 셀러샵명은 [오로라 > 판매자 정보 > 판매자 정보] 하단 [판매자 정보 수정]에서 변경한 뒤 수정사유를 입력해 요청하실 수 있습니다. 요청 후 검수 결과에 따라 변경되며, 검수는 영업일 기준 2일 이내 완료됩니다.\n셀러샵명 기준을 확인해 주세요.\n- 2자 이상 12자 이하 권장, 최대 30자 미만. 국문·영문·숫자와 특수문자 '-(하이픈)', '_(언더바)', '( )(소괄호)'만 사용 가능\n- 이미 사용 중인 셀러샵명은 등록 불가(먼저 입점한 파트너사에 우선권)\n- 오늘의집에서 사용 중인 브랜드명과 같은 이름은 불가\n- 최고·최대·베스트·총알배송 등 판촉 표현 불가(사업자등록증상 사업자명에 포함된 경우 예외), 같은 단어 반복 불가, 오늘의집과 연관된 것으로 오인될 수 있는 이름 불가\n- 렌탈 카테고리는 셀러샵명 앞에 [렌탈]을 반드시 붙여야 합니다.\n[신청했는데 결과가 궁금해요] → 5 / [잘못 신청해서 취소하고 싶어요] → 4-1 / [샵명 앞의 양도양수·퇴점·휴업 표시를 떼고 싶어요] → 4-2 / [렌탈 샵명 변경이 거절됐어요] → 4-3 / [완료] → 9\n4-1. 어떤 내용으로 잘못 신청하셨는지 알려주시겠어요?\n[오신청 내용 입력]\n(오로라에서 신청한 뒤에는 취소 기능이 없음)\n확인을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-A)\n4-2. 셀러샵명 앞 키워드 해제는 담당 부서 확인으로 처리까지 시간이 소요될 수 있는 점 양해 부탁드립니다. 셀러샵명과 떼고 싶은 표시(양도양수중/퇴점/퇴점중/휴업중)를 알려주시겠어요?\n[셀러샵명, 표시 입력]\n상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)\n4-3. 거절된 내용은 담당 부서 확인이 필요해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)\n\n5. 처리 결과는 [오로라 > 판매자정보 > 판매자 정보 수정 처리 현황]에서 직접 확인하실 수 있습니다. 처리 결과를 누르시면 검토 내용(승인/거절 상세)을 보실 수 있습니다. 확인하신 상태를 선택해 주세요.\n[요청중] → 5-1 / [승인(수정대기)] → 5-2 / [수정완료] → 5-3 / [거절] → 5-4 / [확인이 안 돼요] → 5-6\n5-1. '요청중'은 검수 전 상태입니다. 검수는 영업일 기준 2일 이내 완료되며, 결과는 메일로도 안내됩니다. → 9\n5-2. '승인(수정대기)'는 검수 승인이 완료된 상태로, 검수 승인 다음 날 반영됩니다. → 9\n5-3. '수정완료'는 요청하신 정보 수정이 완료된 상태입니다. → 9\n5-4. 요청하신 정보 수정은 '거절'로 확인됩니다. [오로라 > 판매자정보 > 판매자 정보 수정 처리 현황]에서 처리 결과를 누르시면 검토 내용을 확인하실 수 있습니다.\n대표적인 거절 사유는 다음과 같습니다.\n1) 변경된 정보가 반영되지 않은 서류를 첨부했거나 서류가 누락된 경우\n2) 정보변경이 아닌 양도양수에 해당하는 경우(개인↔법인 전환, 개인사업자의 대표자 변경·추가, 법인사업자의 법인등록번호 변경)\n3) 오늘의집 내부 운영 정책과 다른 경우\n[검토 내용으로 이해가 안 돼요 / 다시 확인해 주세요] → 5-5 / [다시 신청할게요] → 9\n5-5. 거절 사유 상세 확인은 담당 부서 확인이 필요해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)\n5-6. 확인을 위해 요청하신 항목과 요청일을 알려주시겠어요?\n[요청 항목, 요청일 입력]\n처리 현황 확인을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-D)\n\n6. 해외 파트너사는 오로라에서 직접 정보를 수정하실 수 없어 담당 부서 확인이 필요합니다. 변경하실 항목과 내용을 알려주세요.\n[변경 항목·내용 입력] → 상담원 인계 (T3-C)\n\n9. 더 궁금하신 점이 있으신가요?\n[아니요] → 상담 종료 (유형: PA009001)\n[네] → 용건 다시 받기 (바뀐 용건의 유형으로 진행)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 변경하실 항목을 선택해<br/>주세요.\"]:::bot\nN2[\"<b>2<\/b> 해당 항목은 오로라에서 직접 수정하시면 바로<br/>반영됩니다.\"]:::bot\nN2_1[\"<b>2-1<\/b> 해당 내용은 개발팀에서 확인한 이슈이나 즉시<br/>개선이 어려운 항목으로, 반영까지 상당한<br/>시일이 소요될 예정입니다. 불편을 드려<br/>죄송합니다.\"]:::bot\nN3[\"<b>3<\/b> [오로라 › 판매자정보 › 담당자 정보]에서<br/>담당자 정보 수정 버튼을 누른 뒤 수정<br/>사항을 저장해 주세요. 영업 담당자,<br/>주문/클레임 담당자, 회계 담당자 정보를<br/>최신 연락처로 관리하실 수 있습니다.\"]:::bot\nN4[\"<b>4<\/b> 셀러샵명은\"]:::bot\nN4_1[\"<b>4-1<\/b> 어떤 내용으로 잘못 신청하셨는지<br/>알려주시겠어요?\"]:::bot\nN4_2[\"<b>4-2<\/b> 셀러샵명 앞 키워드 해제는 담당 부서<br/>확인으로 처리까지 시간이 소요될 수 있는 점<br/>양해 부탁드립니다. 셀러샵명과 떼고 싶은<br/>표시(양도양수중/퇴점/퇴점중/휴업중)를<br/>알려주시겠어요?\"]:::bot\nN4_3[\"<b>4-3<\/b> 거절된 내용은 담당 부서 확인이 필요해<br/>상담원에게 연결해 드리겠습니다.\"]:::bot\nN5[\"<b>5<\/b> 처리 결과는\"]:::bot\nN5_1[\"<b>5-1<\/b> '요청중'은 검수 전 상태입니다. 검수는<br/>영업일 기준 2일 이내 완료되며, 결과는<br/>메일로도 안내됩니다.\"]:::bot\nN5_2[\"<b>5-2<\/b> '승인(수정대기)'는 검수 승인이 완료된<br/>상태로, 검수 승인 다음 날 반영됩니다.\"]:::bot\nN5_3[\"<b>5-3<\/b> '수정완료'는 요청하신 정보 수정이 완료된<br/>상태입니다.\"]:::bot\nN5_4[\"<b>5-4<\/b> 요청하신 정보 수정은 '거절'로 확인됩니다.\"]:::bot\nN5_5[\"<b>5-5<\/b> 거절 사유 상세 확인은 담당 부서 확인이<br/>필요해 상담원에게 연결해 드리겠습니다.\"]:::bot\nN5_6[\"<b>5-6<\/b> 확인을 위해 요청하신 항목과 요청일을<br/>알려주시겠어요?\"]:::bot\nN6[\"<b>6<\/b> 해외 파트너사는 오로라에서 직접 정보를<br/>수정하실 수 없어 담당 부서 확인이<br/>필요합니다. 변경하실 항목과 내용을<br/>알려주세요.\"]:::bot\nN9[\"<b>9<\/b> 더 궁금하신 점이 있으신가요?\"]:::bot\nS --> N1\nN1 -->|\"홈페이지·전화번호·대표자 이메일·고객센터<br/>전화번호·고객센터 이메일\"| N2\nN1 -->|\"담당자 정보(영업·주문/클레 바)', '( )(소괄호)'만 사용 가능", "- 이미 사용 중인 셀러샵명은 등록 불가(먼저 입점한 파트너사에 우선권)", "- 오늘의집에서 사용 중인 브랜드명과 같은 이름은 불가", "- 최고·최대·베스트·총알배송 등 판촉 표현 불가(사업자등록증상 사업자명에 포함된 경우 예외), 같은 단어 반복 불가, 오늘의집과 연관된 것으로 오인될 수 있는 이름 불가", "- 렌탈 카테고리는 셀러샵명 앞에 [렌탈]을 반드시 붙여야 합니다."]}, {"k": "4-1", "id": "4-1", "t": "어떤 내용으로 잘못 신청하셨는지 알려주시겠어요?", "sec": false, "body": ["(오로라에서 신청한 뒤에는 취소 기능이 없음)", "확인을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-A)"]}, {"k": "4-2", "id": "4-2", "t": "셀러샵명 앞 키워드 해제는 담당 부서 확인으로 처리까지 시간이 소요될 수 있는 점 양해 부탁드립니다. 셀러샵명과 떼고 싶은 표시(양도양수중/퇴점/퇴점중/휴업중)를 알려주시겠어요?", "sec": false, "body": ["상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)"]}, {"k": "4-3", "id": "4-3", "t": "거절된 내용은 담당 부서 확인이 필요해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)", "sec": false, "body": []}, {"k": "5", "id": "5", "t": "처리 결과는", "sec": false, "body": []}, {"k": "5-1", "id": "5-1", "t": "'요청중'은 검수 전 상태입니다. 검수는 영업일 기준 2일 이내 완료되며, 결과는 메일로도 안내됩니다. → 9", "sec": false, "body": []}, {"k": "5-2", "id": "5-2", "t": "'승인(수정대기)'는 검수 승인이 완료된 상태로, 검수 승인 다음 날 반영됩니다. → 9", "sec": false, "body": []}, {"k": "5-3", "id": "5-3", "t": "'수정완료'는 요청하신 정보 수정이 완료된 상태입니다. → 9", "sec": false, "body": []}, {"k": "5-4", "id": "5-4", "t": "요청하신 정보 수정은 '거절'로 확인됩니다.", "sec": false, "body": ["대표적인 거절 사유는 다음과 같습니다.", "1) 변경된 정보가 반영되지 않은 서류를 첨부했거나 서류가 누락된 경우", "2) 정보변경이 아닌 양도양수에 해당하는 경우(개인↔법인 전환, 개인사업자의 대표자 변경·추가, 법인사업자의 법인등록번호 변경)", "3) 오늘의집 내부 운영 정책과 다른 경우"]}, {"k": "5-5", "id": "5-5", "t": "거절 사유 상세 확인은 담당 부서 확인이 필요해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)", "sec": false, "body": []}, {"k": "5-6", "id": "5-6", "t": "확인을 위해 요청하신 항목과 요청일을 알려주시겠어요?", "sec": false, "body": ["처리 현황 확인을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-D)"]}, {"k": "6", "id": "6", "t": "해외 파트너사는 오로라에서 직접 정보를 수정하실 수 없어 담당 부서 확인이 필요합니다. 변경하실 항목과 내용을 알려주세요.", "sec": false, "body": []}, {"k": "9", "id": "9", "t": "더 궁금하신 점이 있으신가요?", "sec": false, "body": []}], "hocond": "셀러샵명 오신청 취소 T3-A / 셀러샵명 키워드 해제·렌탈 샵명 거절·정보변경 거절 사유 상세·해외 파트너사 정보변경 T3-C / 처리 현황 화면 확인이 안 되는 정보변경 결과 문의 T3-D / 상담원 직접 요청 T1", "hoinfo": "변경 요청 항목·변경 전/후 값, 정보 수정 요  지연, 48시간 이내 미답변 문의 알림톡을 받으실 수 있습니다.\n\n[셀러샵명]\n셀러샵명은 오로라 > 판매자 정보 > 판매자 정보 하단 [판매자 정보 수정]에서 변경한 뒤 수정사유를 입력해 요청하실 수 있습니다. 요청 후 검수 결과에 따라 변경되며 검수는 영업일 기준 2일 이내 완료됩니다.\n- 2자 이상 12자 이하 권장, 최대 30자 미만. 국문·영문·숫자와 특수문자 '-(하이픈)', '_(언더바)', '( )(소괄호)'만 사용 가능\n- 이미 사용 중인 셀러샵명은 등록 불가(먼저 입점한 파트너사에 우선권), 오늘의집에서 사용 중인 브랜드명과 같은 이름 불가\n- 최고·최대·베스트·총알배송 등 판촉 표현 불가(사업자등록증상 사업자명에 포함된 경우 예외), 같은 단어 반복 불가, 오늘의집과 연관된 것으로 오인될 수 있는 이름 불가\n- 렌탈 카테고리는 셀러샵명 앞에 [렌탈]을 반드시 붙여야 합니다.\n\n[요청한 정보변경 결과 확인]\n처리 결과는 오로라 > 판매자정보 > 판매자 정보 수정 처리 현황에서 직접 확인하실 수 있으며, 처리 결과를 누르시면 검토 내용(승인/거절 상세)을 보실 수 있습니다.\n- 요청중: 검수 전 상태로, 검수는 영업일 기준 2일 이내 완료되며 결과는 메일로도 안내됩니다.\n- 승인(수정대기): 검수 승인 다음 날 반영됩니다.\n- 거절: 대표적인 거절 사유는 1) 변경된 정보가 반영되지 않은 서류를 첨부했거나 서류가 누락된 경우 2) 정보변경이 아닌 양도양수에 해당하는 경우(개인↔법인 전환, 개인사업자의 대표자 변경·추가, 법인사업자의 법인등록번호 변경) 3) 오늘의집 내부 운영 정책과 다른 경우입니다. 검토 내용을 확인하신 뒤 다시 신청해 주세요.\n(변경 항목에 해당하는 단락만, 맺음 A)", "ack": "남겨 주신 내용은 담당 부서 확인이 필요해 확인 후 안내드리겠습니다. 처리까지 시간이 소요될 수 있는 점 양해 부탁드립니다.\n(해외 파트너사: \"해외 파트너사는 오로라에서 직접 정보를 수정하실 수 없어 담당 부서에서 확인 후 반영합니다.\")", "info": "변경 항목·변경 전/후 값, 정보 수정 요청일과 처리 현황 상태(파트너 응답), 셀러샵명 오신청 내용, 셀러샵명 앞 표시(양도양수중/퇴점/휴업중), 해외사업자 여부", "kms": "059_양도양수___정보변경__휴_퇴점_.md, 058_셀러샵.md, 087_오로라__.md, 095_커머스_정책_이관_유형_및_이관_방법.md", "check": "1) 059는 판매자 정보 수정 시 사업자등록증·통신판매신고증 첨부를 일괄 안내 — 즉시 반영 항목도 서류가 필요한지 화면 확인\n2) 셀러샵명 서류 필요 여부 KMS에 없음 — PA009001/PA009002 어디에 둘지\n3) 셀러샵명 변경 경로 상충(058·059 오로라 직접 vs 셀러샵명 변경 요청서) 및 소요 기간(058 최대 2영업일)\n4) 정보 수정 취소 상충(059 '취소 요청 버튼으로 가능' vs '셀러샵명 오신청은 취소 불가, 관리자 확인')"}}, {"code": "PA009002", "draft": false, "name": "서류 정보변경", "mid": "정보변경", "vol": "126", "mode": "안내 후 조건부 상담원 연결", "utter": "퇴점 신청 어떻게 하나요?\n대표자가 바뀌었는데 양도양수를 해야 하나요, 정보변경만 하면 되나요?\n사업장 주소가 바뀌어서 사업자등록증 새로 받았어요. 어떻게 변경해요?", "raw": "1. 네, 파트너님. 어떤 변경이 필요하신가요?\n[사업자 정보 변경(회사명·주소·업태·종목·통신판매업 신고번호·대표자)] → 2 / [정산계좌 변경] → 3 / [사업자등록번호 변경] → 4 / [과세유형 변경] → 5 / [양도양수] → 6 / [휴업] → 7 / [퇴점] → 8 / [정보변경 결과·거절 사유] → 단순 정보변경으로 전환 (유형: PA009001, 5)\n(해외 파트너사 → 단순 정보변경으로 전환 (유형: PA009001, 6))\n\n2. 먼저 아래에 해당하는지 확인해 주세요. 아래 경우는 정보변경이 아닌 양도양수에 해당해 정보변경 요청이 거절될 수 있습니다.\n- 개인사업자 ↔ 법인사업자 전환\n- 개인사업자의 대표자 변경 또는 추가\n- 법인사업자의 법인등록번호 변경\n[해당돼요] → 6 / [해당 안 돼요] → 2-1\n2-1. 오로라에서 직접 수정 요청하실 수 있습니다.\n1) [오로라 > 판매자 정보 > 판매자 정보] 하단 [판매자 정보 수정]에서 변경할 항목 수정\n2) 필수 서류란에 변경된 정보가 반영된 사업자등록증과 통신판매신고증 첨부\n3) 수정사유 입력 후 요청\n검수는 영업일 기준 2일 이내 완료되며, 진행 상황은 [오로라 > 판매자정보 > 판매자 정보 수정 처리 현황]에서 확인하실 수 있습니다. 서류가 누락되거나 변경 정보가 반영되지 않은 서류를 첨부하시면 거절될 수 있습니다.\n- [정보변경] 정보변경 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29543329706521 → 10\n\n3. 정산계좌는 사업자 또는 대표자 명의 계좌만 등록하실 수 있으며, 사업자등록증의 대표자명 또는 회사명과 일치해야 합니다.\n[오로라 > 판매자 정보 > 판매자 정보] 하단 [판매자 정보 수정]에서 계좌 인증 후 통장사본을 첨부하고, 필수 서류란에 사업자등록증을 첨부해 요청해 주세요. 검수 후 승인 또는 거절 처리되며 최대 2영업일 정도 소요됩니다. → 10\n\n4. 사업자등록번호만 바뀌고 대표자는 같은 경우인가요?\n[네, 대표자는 같아요] → 4-1 / [대표자도 바뀌었어요] → 6\n4-1. 사업자등록번호는 오로라에서 직접 수정하실 수 없습니다. [오로라 > 판매자 정보 > 판매자 정보] 하단 [판매자 정보 수정]에서 그 외 변경된 정보를 수정 요청하시면서, 수정사유에 '사업자등록번호가 변경되었음'을 적어 주세요. 변경된 사업자등록증과 통신판매신고증을 꼭 첨부해 주세요. 검수 후 사업자등록번호를 포함한 정보가 변경 처리됩니다.\n(단, 법인사업자이면서 법인등록번호가 바뀐 경우는 양도양수 → 6) → 10\n\n5. 과세유형이 바뀌었다면 [오로라 > 판매자 정보]에서 사업자 정보 수정 요청을 진행해 주세요. 변경된 사업자등록증과 통신판매업 신고증을 첨부하고, 수정 사유 입력란에 과세유형 변경 내용을 적어 주시면 됩니다. 검수 결과에 따라 변경 사항이 반영되며, 진행 상황은 [오로라 > 판매자 정보 수정 처리 현황]에서 확인하실 수 있습니다. → 10\n\n6. 양도양수는 사업자등록번호와 대표자 변경 여부에 따라 구분됩니다. 해당하는 경우를 선택해 주세요.\n[사업자등록번호 같음 + 대표자 변경] → 6-1 / [사업자등록번호 변경 + 대표자 같음] → 4-1 / [법인 + 대표자 같음 + 법인등록번호 변경] → 6-1 / [사업자번호·대표자 모두 같고 정산채권만 양도] → 6-2 / [해외사업자] → 6-3 / [사업자 2개를 하나로 합치고 싶어요] → 6-4\n6-1. 사업자(계약상 지위) 양도양수에 해당합니다. 아래 서류를 모두 내용증명으로 보내 주셔야 하며, 서류가 모두 도착해야 처리가 가능합니다.\n- 보내실 곳: 서울특별시 서초구 서초대로 74길 4(서초동), 삼성생명서초타워 27층 오늘의집 정산담당자 앞\n- 제출서류: 1) 사업자(계약상 지위) 양도양수신청서 2) 계약상 지위 양도양수계약서(신청서 내 샘플 참고) 3) 양도인·양수인 각 인감증명서 사본 4) 양도인·양수인 각 사업자등록증 사본 5) 양수인 통신판매업신고증 사본 6) 양수인 정산계좌 사본\n- 신청서·계약서는 사업자등록증 정보와 동일하게 작성하고, 계약체결일은 [오로라 > 판매자정보 > 계약정보 > 체결일]의 날짜로 적어 주세요.\n- 사업자등록증, 인감증명서(개인사업자는 본인서명사실확인서로 대체 가능)는 최근 3개월 이내 발급분이어야 하며, 인감증명서·본인서명사실확인서는 생년월일과 성별 구분을 제외하고 마스킹해 주세요. 사업자등록증은 사업자등록증명원으로 대체할 수 있습니다.\n- 인터넷 우체국으로 내용증명을 접수하셔도 되지만, 정산담당자 메일로 보내는 방식은 불가합니다.\n- 오하우스애즈/배너광고의 잔여 광고비와 카드 자동충전을 확인하시고, 자동충전이 켜져 있으면 끄고 등록 카드를 삭제해 주세요. (잔액: [오로라 > 광고 관리 > 오하우스애즈/배너광고 > 광고비 관리], 카드 삭제: [오로라 > 광고 관리 > 오하우스애즈/배너광고 > 정보 관리 > 결제수단 관리])\n- 다음 경우에는 양도양수가 불가합니다: 지급보류된 정산채권이 있는 경우 / 판매정지 또는 중단 상품이 있는 경우 / 양수인이 통신판매업 신고가 되어 있지 않은 경우\n처리 결과는 모든 서류 수취 후 5영업일 이내 계약서에 적어주신 양도인 이메일로 회신드립니다. 내용증명 수신 시 바로 효력이 발생해 특정 일자로 지정할 수는 없습니다.\n- 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29540918511641\n[판매정지 상품이 있어서 안 된대요] → 6-5 / [서류를 보냈는데 5영업일이 지나도 회신이 없어요] → 6-6 / [양도양수 중에도 판매할 수 있나요?] → 6-7 / [양도인이 사망했어요 / 가족 간 양도양수예요 / 직매입(파트너하우스) 양도양수예요] → 6-8 / [정산·세금계산서는 어떻게 되나요?] → 6-9 / [알겠어요] → 10\n6-2. 채권 양도양수에 해당합니다. 아래 서류를 모두 내용증명으로 보내 주세요(보내실 곳은 사업자 양도양수와 동일).\n- 제출서류: 1) 채권양도통지서 2) 채권양도양수 계약서(통지서 내 샘플 참고) 3) 채권양도인·채권양수인 각 인감증명서 사본 4) 채권양도인·채권양수인 각 사업자등록증 사본 5) 채권양수인 계좌 사본\n- 지급 보류된 정산채권은 양도할 수 없습니다. 서류 발급 기한·마스킹 기준은 사업자 양도양수와 같습니다.\n처리 결과는 모든 서류 수취 후 5영업일 이내 양도인 이메일로 회신드립니다.\n- 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29541828774681 → 10\n6-3. 해외 사업자는 양도양수가 불가합니다. 다른 사업자로 판매를 원하시면 신규 입점을 신청해 주세요. → 10\n6-4. 사업자 2개로 운영 중인 셀러샵을 하나의 사업자로 합치려면 양도양수를 진행하셔야 합니다. → 6-1\n6-5. 판매정지 상품으로 인한 양도양수 불가는 신고 등 리스크 사유로 판매정지된 상품이 있는 경우에만 해당합니다. 해당 상품의 판매를 다시 하실 예정인가요?\n[네, 소명하고 판매하고 싶어요] [아니요, 상품을 삭제해도 돼요]\n확인을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)\n6-6. 처리 확인은 담당 부서 확인이 필요해 상담원에게 연결해 드리겠습니다. 내용증명 발송일을 알려주세요.\n[발송일 입력] → 상담원 인계 (T3-C)\n6-7. 양도양수 기간 중에도 판매를 원하시면 [오로라 > 상품조회/수정]에서 판매정지 상품을 검색해 판매중으로 직접 바꾸실 수 있습니다. 양도양수 후에는 양수인에게 오로라 계정이 그대로 이관되어 셀러샵·상품 정보·행사 구좌가 모두 유지됩니다. 다만 진행 중 정산 사유로 상품이 일시적으로 비노출될 수 있고 노출 순위가 바뀔 수 있습니다. 여러 셀러샵 중 일부만 이관할 수는 없습니다. 양도양수 후 셀러샵명 등은 직접 변경해 주셔야 합니다. → 10\n6-8. 해당 경우는 준비 서류가 달라 상담원이 안내해 드리겠습니다. → 상담원 인계 (T3-B)\n6-9. 정산은 양도양수 완료 시점을 기준으로 이전 매출은 양도인에게, 이후 매출은 양수인에게 지급됩니다. 세금계산서는 월별로 발행되어 양도인·양수인으로 나눠 발행할 수 없으며, 해당 월은 양수인에게 발행됩니다. 적용 시점은 양도양수 승인 시 양도인 이메일로 안내드리니 이를 참고해 매출을 신고해 주세요. 상품 광고비 잔액은 광고 정산 시점의 사업자 기준으로 정산되어 양수인에게 넘어갈 수 있으니, 원하지 않으시면 양도인이 미리 환불을 요청해 주세요. → 10\n\n7. 휴업 관련 어떤 내용이신가요?\n[휴업 신청] → 7-1 / [휴업 철회·판매 재개] → 7-2\n7-1. 휴업을 원하시는 일자와 사유를 알려주시겠어요?\n[휴업 일자, 사유 입력]\n(예정 시점이 한참 뒤라면 → \"해당 시점에 다시 휴업을 요청해 주세요.\" 안내 후 10)\n휴업 접수를 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-A)\n7-2. 휴업 철회는 담당 부서 확인이 필요해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)\n\n8. 퇴점 관련 어떤 내용이 궁금하신가요?\n[퇴점 신청 방법] → 8-1 / [퇴점 진행 상황] → 8-2 / [퇴점 철회] → 8-3 / [퇴점 후 재입점] → 8-4\n8-1. [파트너센터 > 가이드/양식 > 퇴점신청서]를 작성해 주세요.\n1) 계약 해지 신청서(필수)를 작성해 퇴점신청서에 첨부해 주세요. 사업자명, 대표명, 날인 3가지를 모두 기입해야 합니다.\n2) 광고 환불 신청서(선택)는 광고를 진행해 환불할 잔액이 있는 경우에만 첨부해 주세요. 잔여 광고비는 [오로라 > 광고 관리 > 오하우스애즈/배너광고 > 광고비 관리]에서 확인하실 수 있으며, 검토 후 정산 계좌로 환불됩니다. 카드 자동충전이 켜져 있으면 끄고 [정보 관리 > 결제수단 관리]에서 등록 카드를 삭제해 주세요. 광고 관련 확인은 ad_product@bucketplace.net 으로 문의해 주세요.\n3) 폐업 없이 오늘의집 퇴점만 하시는 경우 퇴점 사유를 [폐업 외]로 선택하시면 사업자등록증을 제출하지 않으셔도 됩니다. 폐업으로 퇴점하시는 경우 잔여 정산 처리를 위해 사업자등록증 제출이 필요합니다.\n진행 절차: 퇴점 신청서 작성 > 7일간 파트너사 잔여 이슈(미해결 주문·배송·취소·교환/환불·문의) 처리 > 7일 후 남은 이슈는 오늘의집이 직권 취소·환불 처리(비용 발생 시 정산 차감 또는 대금 청구) > 계약 해지서 발송\n유의사항\n- 퇴점 완료 후에는 판매자 시스템에 접속할 수 없으니 [정산관리 > 부가세신고]에서 월별 매출 자료를 미리 내려받아 주세요.\n- 정산은 퇴점 여부와 관계없이 구매확정일 +2영업일에 정상 진행되며, 일정 조정은 불가합니다. 폐업으로 인한 퇴점은 정산대금 지급이 보류되어 자료를 요청드릴 수 있습니다.\n- 등록된 상품은 모두 삭제되며, 재입점 시 상품·리뷰 이관은 불가합니다. 퇴점 후 6개월 동안 재입점할 수 없습니다.\n- 퇴점 진행 중에는 상품 등록이 반려됩니다.\n- 계약 기간 1년이 끝나지 않았더라도 사전 협의 후 퇴점이 가능합니다.\n[폐업으로 퇴점하는데 사업자등록증을 낼 수 없어요] → 폐업 예정 일자를 알려주세요. [일자 입력] → 상담원 인계 (T3-C)\n[알겠어요] → 10\n8-2. 퇴점은 신청서 접수 후 7일간 잔여 이슈 처리 기간을 거쳐 계약 해지서 발송 순서로 진행됩니다. 7일 후 남은 이슈는 오늘의집이 직권 취소·환불 처리합니다.\n[진행 상황을 개별로 확인하고 싶어요] → 8-2-1 / [알겠어요] → 10\n8-2-1. 진행 상황 확인을 위해 퇴점 신청일을 알려주시겠어요?\n[퇴점 신청일 입력]\n담당 부서 확인을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-D)\n8-3. 현재 퇴점 상태를 선택해 주세요.\n[퇴점이 완료됐어요] → 8-3-1 / [퇴점이 진행 중이에요] → 8-3-2 / [잘 모르겠어요] → 8-3-2\n8-3-1. 퇴점이 완료된 이후에는 철회가 불가합니다. 재입점은 퇴점 완료 6개월 후 셀러샵 추가 신청서로 가능합니다. → 10\n8-3-2. 철회 사유를 알려주시겠어요?\n[철회 사유 입력]\n(폐업으로 퇴점 중이면 → \"2주 안에 양도양수를 신청하실 수 있는 경우 퇴점 철회가 가능합니다.\" 안내)\n퇴점 철회는 담당 부서 확인이 필요해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)\n8-4. 퇴점 완료 후 최소 6개월이 지나야 재입점 신청이 가능하며, [셀러샵 추가 신청서]로 신청해 주세요(최근 3개월 이내 발급 사업자등록증 필수). 신규 입점과 동일하게 검토되어 거절될 수 있고, 상품은 새로 등록해야 합니다.\n- [정책] 셀러샵 이용 가이드: https://www.partnerbucketplace.com/hc/ko/articles/25553199736345 → 10\n\n10. 더 궁금하신 점이 있으신가요?\n[아니요] → 상담 종료 (유형: PA009002)\n[네] → 용건 다시 받기 (바뀐 용건의 유형으로 진행)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 어떤 변경이 필요하신가요?\"]:::bot\nN2[\"<b>2<\/b> 먼저 아래에 해당하는지 확인해 주세요. 아래<br/>경우는 정보변경이 아닌 양도양수에 해당해<br/>정보변경 요청이 거절될 수 있습니다.\"]:::bot\nN2_1[\"<b>2-1<\/b> 오로라에서 직접 수정 요청하실 수 있습니다.\"]:::bot\nN3[\"<b>3<\/b> 정산계좌는 사업자 또는 대표자 명의 계좌만<br/>등록하실 수 있으며, 사업자등록증의 대표자명<br/>또는 회사명과 일치해야 합니다.\"]:::bot\nN4[\"<b>4<\/b> 사업자등록번호만 바뀌고 대표자는 같은<br/>경우인가요?\"]:::bot\nN4_1[\"<b>4-1<\/b> 사업자등록번호는 오로라에서 직접 수정하실 수<br/>없습니다.\"]:::bot\nN5[\"<b>5<\/b> 과세유형이 바뀌었다면\"]:::bot\nN6[\"<b>6<\/b> 양도양수는 사업자등록번호와 대표자 변경<br/>여부에 따라 구분됩니다. 해당하는 경우를<br/>선택해 주세요.\"]:::bot\nN6_1[\"<b>6-1<\/b> 사업자(계약상 지위) 양도양수에 해당합니다.<br/>아래 서류를 모두 내용증명으로 보내 주셔야<br/>하며, 서류가 모두 도착해야 처리가<br/>가능합니다.\"]:::bot\nN6_2[\"<b>6-2<\/b> 채권 양도양수에 해당합니다. 아래 서류를<br/>모두 내용증명으로 보내 주세요(보내실 곳은<br/>사업자 양도양수와 동일).\"]:::bot\nN6_3[\"<b>6-3<\/b> 해외 사업자는 양도양수가 불가합니다. 다른<br/>사업자로 판매를 원하시면 신규 입점을 신청해<br/>주세요.\"]:::bot\nN6_4[\"<b>6-4<\/b> 사업자 2개로 운영 중인 셀러샵을 하나의<br/>사업자로 합치려면 양도양수를 진행하셔야<br/>합니다.\"]:::bot\nN6_5[\"<b>6-5<\/b> 판매정지 상품으로 인한 양도양수 불가는 신고<br/>등 리스크 사유로 판매정지된 상품이 있는<br/>경우에만 해당합니다. 해당 상품의 판매를<br/>다시 하실 예정인가요?\"]:::bot\nN6_6[\"<b>6-6<\/b> 처리 확인은 담당 부서 확인이 필요해<br/>상담원에게 연결해 드리겠습니다. 내용증명<br/>발송일을 알려주세요.\"]:::bot\nN6_7[\"<b>6-7<\/b> 양도양수 기간 중에도 판매를 원하시면\"]:::bot\nN6_8[\"<b>6-8<\/b> 해당 경우는 준비 서류가 달라 상담원이<br/>안내해 드리겠습니다.\"]:::bot\nN6_9[\"<b>6-9<\/b> 정산은 양도양수 완료 시점을 기준으로 이전<br/>매출은 양도인에게, 이후 매출은 양수인에게<br/>지급됩니다. 세금계산서는 월별로 발행되어<br/>양도인·양수인으로 나눠 발행할 수 없으며,<br/>해당 월은 양수인에게 발행됩니다. 적용<br/>시점은 양도양수 승인 시 양도인 이메일로<br/>안내드리니 이를 참고해 매출을 신고해<br/>주세요. 상품 광고비 잔액은 광고 정산<br/>시점의 사업자 기준으로 정산되어 양수인에게<br/>넘어갈 수 있으니, 원하지 않으시면 양도인이<br/>미리 환불을 요청해 주세요.\"]:::bot\nN7[\"<b>7<\/b> 휴업 관련 어떤 내용이신가요?\"]:::bot\nN7_1[\"<b>7-1<\/b> 휴업을 원하시는 일자와 사유를<br/>알려주시겠어요?\"]:::bot\nN7_2[\"<b>7-2<\/b> 휴업 철회는 담당 부서 확인이 필요해<br/>상담원에게 연결해 드리겠습니다.\"]:::bot\nN8[\"<b>8<\/b> 퇴점 관련 어떤 내용이 궁금하신가요?\"]:::bot\nN8_1{{\"파트너센터 › 가이드/양식<br/>› 퇴점신청서\"}}:::sec\nN8_1_8_2[\"<b>8-2<\/b> 퇴점은 신청서 접수 후 7일간 잔여 이슈<br/>처리 기간을 거쳐 계약 해지서 발송 순서로<br/>진행됩니다. 7일 후 남은 이슈는 오늘의집이<br/>직권 취소·환불 처리합니다.\"]:::bot\nN8_1_8_2_1[\"<b>8-2-1<\/b> 진행 상황 확인을 위해 퇴점 신청일을<br/>알려주시겠어요?\"]:::bot\nN8_1_8_3[\"<b>8-3<\/b> 현재 퇴점 상태를 선택해 주세요.\"]:::bot\nN8_1_8_3_1[\"<b>8-3-1<\/b> 퇴점이 완료된 이후에는 철회가 불가합니다.<br/>재입점은 퇴점 완료 6개월 후 셀러샵 추가<br/>신청서로 가능합니다.\"]:::bot\nN8_1_8_3_2[\"<b>8-3-2<\/b> 철회 사유를 알려주시겠어요?\"]:::bot\nN8_1_8_4[\"<b>8-4<\/b> 퇴점 완료 후 최소 6개월이 지나야 재입점<br/>신청이 가능하며,\"]:::bot\nN8_1_10[\"<b>10<\/b> 더 궁금하신 점이 있으신가요?\"]:::bot\nS --> N1\nN1 -->|\"사업자 정보<br/>변경(회사명·주소·업태·종목·통신판매업<br/>신고번호·대표자)\"| N2\nN1 -->|\"정산계좌 변경\"| N3\nN1 -->|\"사업자등록번호 변경\"| N4\nN1 -->|\"과세유형 변경\"| N5\nN1 -->|\"양도양수\"| N6\nN1 -->|\"휴업\"| N7\nN1 -->|\"퇴점\"| N8\nN1 -->|\"정보변경 결과·거절 사유\"| SW_PA009001\nN1 -->|\"해외 파트너사\"| SW_PA009001\nN2 -->|\"해당돼요\"| N6\nN2 -->|\"해당 안 돼요\"| N2_1\nN3 -->|\"오로라 › 판매자 정보 › 판매자 정보 /<br/>판매자 정보 수정\"| N4\nN4 -->|\"네, 대표자는 같아요\"| N4_1\nN4 -->|\"대표자도 바뀌었어요\"| N6\nN4_1 -->|\"단, 법인사업자이면서 법인등록번호가 바뀐<br/>경우는 양도양수\"| N6\nN4_1 -->|\"오로라 › 판매자 정보 › 판매자 정보 /<br/>판매자 정보 수정\"| N5\nN5 --> N8_1_10\nN6 -->|\"사업자등록번호 같음 + 대표자 변경\"| N6_1\nN6 -->|\"사업자등록번호 변경 + 대표자 같음\"| N4_1\nN6 -->|\"법인 + 대표자 같음 + 법인등록번호 변경\"| N6_1\nN6 -->|\"사업자번호·대표자 모두 같고 정산채권만 양도\"| N6_2\nN6 -->|\"해외사업자\"| N6_3\nN6 -->|\"사업자 2개를 하나로 합치고 싶어요\"| N6_4\nN6_1 -->|\"판매정지 상품이 있어서 안 된대요\"| N6_5\nN6_1 -->|\"서류를 보냈는데 5영업일이 지나도 회신이<br/>없어요\"| N6_6\nN6_1 -->|\"양도양수 중에도 판매할 수 있나요?\"| N6_7\nN6_1 -->|\"직매입(파트너하우스) 양도양수예요\"| N6_8\nN6_1 -->|\"정산·세금계산서는 어떻게 되나요?\"| N6_9\nN6_1 -->|\"알겠어요\"| N8_1_10\nN6_3 --> N8_1_10\nN6_4 --> N6_1\nN6_5 -->|\"네, 소명하고 판매하고 싶어요 / 아니요,<br/>상품을 삭제해도 돼요\"| N6_6\nN6_6 -->|\"발송일 입력\"| HO_T3C\nN6_7 --> N8_1_10\nN6_8 --> HO_T3B\nN6_9 --> N8_1_10\nN7 -->|\"휴업 신청\"| N7_1\nN7 -->|\"휴업 철회·판매 재개\"| N7_2\nN7_1 -->|\"예정 시점이 한참 뒤라면\"| TX3\nN7_1 -->|\"휴업 일자, 사유 입력\"| N7_2\nN7_2 --> HO_T3C\nN8 -->|\"퇴점 신청 방법\"| N8_1\nN8 -->|\"퇴점 진행 상황\"| N8_1_8_2\nN8 -->|\"퇴점 철회\"| N8_1_8_3\nN8 -->|\"퇴점 후 재입점\"| N8_1_8_4\nN8 -->|\"파트너센터 › 가이드/양식 › 퇴점신청서\"| N8_1\nN8_1 -->|\"폐업으로 퇴점하는데 사업자등록증을 낼 수<br/>없어요\"| HO_T3C\nN8_1 -->|\"알겠어요\"| N8_1_10\nN8_1_8_2 -->|\"진행 상황을 개별로 확인하고 싶어요\"| N8_1_8_2_1\nN8_1_8_2 -->|\"알겠어요\"| N8_1_10\nN8_1_8_2_1 -->|\"퇴점 신청일 입력\"| N8_1_8_3\nN8_1_8_3 -->|\"퇴점이 완료됐어요\"| N8_1_8_3_1\nN8_1_8_3 -->|\"퇴점이 진행 중이에요\"| N8_1_8_3_2\nN8_1_8_3 -->|\"잘 모르겠어요\"| N8_1_8_3_2\nN8_1_8_3_1 --> N8_1_10\nN8_1_8_3_2 -->|\"폐업으로 퇴점 중이면\"| TX4\nN8_1_8_3_2 -->|\"철회 사유 입력\"| N8_1_8_4\nN8_1_8_4 -->|\"셀러샵 추가 신청서\"| N8_1_10\nN8_1_10 -->|\"아니요\"| END\nN8_1_10 -->|\"네\"| SWX6\nN2_1 --> N3\nN6_2 --> N6_3\nSW_PA009001[/\"「단순 정보변경」로 전환\"/]:::sw\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nHO_T3B([\"상담원 인계<br/>셀프 처리 실패\"]):::ho\nTX3[\"'해당 시점에 다시 휴업을<br/>요청해 주세요.' 안내 후<br/>10\"]:::txt\nTX4[\"'2주 안에 양도양수를<br/>신청하실 수 있는 경우<br/>퇴점 철회가 가능합니다.'<br/>안내\"]:::txt\nEND([\"상담 종료\"]):::fin\nSWX6[/\"용건 다시 받기 (바뀐<br/>용건의 유형으로 진행)\"/]:::sw", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 어떤 변경이 필요하신가요?", "sec": false, "body": []}, {"k": "2", "id": "2", "t": "먼저 아래에 해당하는지 확인해 주세요. 아래 경우는 정보변경이 아닌 양도양수에 해당해 정보변경 요청이 거절될 수 있습니다.", "sec": false, "body": ["- 개인사업자 ↔ 법인사업자 전환", "- 개인사업자의 대표자 변경 또는 추가", "- 법인사업자의 법인등록번호 변경"]}, {"k": "2-1", "id": "2-1", "t": "오로라에서 직접 수정 요청하실 수 있습니다.", "sec": false, "body": ["1) [오로라 > 판매자 정보 > 판매자 정보] 하단 [판매자 정보 수정]에서 변경할 항목 수정", "2) 필수 서류란에 변경된 정보가 반영된 사업자등록증과 통신판매신고증 첨부", "3) 수정사유 입력 후 요청", "검수는 영업일 기준 2일 이내 완료되며, 진행 상황은 [오로라 > 판매자정보 > 판매자 정보 수정 처리 현황]에서 확인하실 수 있습니다. 서류가 누락되거나 변경 정보가 반영되지 않은 서류를 첨부하시면 거절될 수 있습니다.", "- [정보변경] 정보변경 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29543329706521 → 10"]}, {"k": "3", "id": "3", "t": "정산계좌는 사업자 또는 대표자 명의 계좌만 등록하실 수 있으며, 사업자등록증의 대표자명 또는 회사명과 일치해야 합니다.", "sec": false, "body": []}, {"k": "4", "id": "4", "t": "사업자등록번호만 바뀌고 대표자는 같은 경우인가요?", "sec": false, "body": []}, {"k": "4-1", "id": "4-1", "t": "사업자등록번호는 오로라에서 직접 수정하실 수 없습니다.", "sec": false, "body": []}, {"k": "5", "id": "5", "t": "과세유형이 바뀌었다면", "sec": false, "body": []}, {"k": "6", "id": "6", "t": "양도양수는 사업자등록번호와 대표자 변경 여부에 따라 구분됩니다. 해당하는 경우를 선택해 주세요.", "sec": false, "body": []}, {"k": "6-1", "id": "6-1", "t": "사업자(계약상 지위) 양도양수에 해당합니다. 아래 서류를 모두 내용증명으로 보내 주셔야 하며, 서류가 모두 도착해야 처리가 가능합니다.", "sec": false, "body": ["- 보내실 곳: 서울특별시 서초구 서초대로 74길 4(서초동), 삼성생명서초타워 27층 오늘의집 정산담당자 앞", "- 제출서류: 1) 사업자(계약상 지위) 양도양수신청서 2) 계약상 지위 양도양수계약서(신청서 내 샘플 참고) 3) 양도인·양수인 각 인감증명서 사본 4) 양도인·양수인 각 사업자등록증 사본 5) 양수인 통신판매업신고증 사본 6) 양수인 정산계좌 사본", "- 신청서·계약서는 사업자등록증 정보와 동일하게 작성하고, 계약체결일은 [오로라 > 판매자정보 > 계약정보 > 체결일]의 날짜로 적어 주세요.", "- 사업자등록증, 인감증명서(개인사업자는 본인서명사실확인서로 대체 가능)는 최근 3개월 이내 발급분이어야 하며, 인감증명서·본인서명사실확인서는 생년월일과 성별 구분을 제외하고 마스킹해 주세요. 사업자등록증은 사업자등록증명원으로 대체할 수 있습니다.", "- 인터넷 우체국으로 내용증명을 접수하셔도 되지만, 정산담당자 메일로 보내는 방식은 불가합니다.", "- 오하우스애즈/배너광고의 잔여 광고비와 카드 자동충전을 확인하시고, 자동충전이 켜져 있으면 끄고 등록 카드를 삭제해 주세요. (잔액: [오로라 > 광고 관리 > 오하우스애즈/배너광고 > 광고비 관리], 카드 삭제: [오로라 > 광고 관리 > 오하우스애즈/배너광고 > 정보 관리 > 결제수단 관리])", "- 다음 경우에는 양도양수가 불가합니다: 지급보류된 정산채권이 있는 경우 / 판매정지 또는 중단 상품이 있는 경우 / 양수인이 통신판매업 신고가 되어 있지 않은 경우", "처리 결과는 모든 서류 수취 후 5영업일 이내 계약서에 적어주신 양도인 이메일로 회신드립니다. 내용증명 수신 시 바로 효력이 발생해 특정 일자로 지정할 수는 없습니다.", "- 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29540918511641"]}, {"k": "6-2", "id": "6-2", "t": "채권 양도양수에 해당합니다. 아래 서류를 모두 내용증명으로 보내 주세요(보내실 곳은 사업자 양도양수와 동일).", "sec": false, "body": ["- 제출서류: 1) 채권양도통지서 2) 채권양도양수 계약서(통지서 내 샘플 참고) 3) 채권양도인·채권양수인 각 인감증명서 사본 4) 채권양도인·채권양수인 각 사업자등록증 사본 5) 채권양수인 계좌 사본", "- 지급 보류된 정산채권은 양도할 수 없습니다. 서류 발급 기한·마스킹 기준은 사업자 양도양수와 같습니다.", "처리 결과는 모든 서류 수취 후 5영업일 이내 양도인 이메일로 회신드립니다.", "- 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29541828774681 → 10"]}, {"k": "6-3", "id": "6-3", "t": "해외 사업자는 양도양수가 불가합니다. 다른 사업자로 판매를 원하시면 신규 입점을 신청해 주세요. → 10", "sec": false, "body": []}, {"k": "6-4", "id": "6-4", "t": "사업자 2개로 운영 중인 셀러샵을 하나의 사업자로 합치려면 양도양수를 진행하셔야 합니다. → 6-1", "sec": false, "body": []}, {"k": "6-5", "id": "6-5", "t": "판매정지 상품으로 인한 양도양수 불가는 신고 등 리스크 사유로 판매정지된 상품이 있는 경우에만 해당합니다. 해당 상품의 판매를 다시 하실 예정인가요?", "sec": false, "body": ["확인을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)"]}, {"k": "6-6", "id": "6-6", "t": "처리 확인은 담당 부서 확인이 필요해 상담원에게 연결해 드리겠습니다. 내용증명 발송일을 알려주세요.", "sec": false, "body": []}, {"k": "6-7", "id": "6-7", "t": "양도양수 기간 중에도 판매를 원하시면", "sec": false, "body": []}, {"k": "6-8", "id": "6-8", "t": "해당 경우는 준비 서류가 달라 상담원이 안내해 드리겠습니다. → 상담원 인계 (T3-B)", "sec": false, "body": []}, {"k": "6-9", "id": "6-9", "t": "정산은 양도양수 완료 시점을 기준으로 이전 매출은 양도인에게, 이후 매출은 양수인에게 지급됩니다. 세금계산서는 월별로 발행되어 양도인·양수인으로 나눠 발행할 수 없으며, 해당 월은 양수인에게 발행됩니다. 적용 시점은 양도양수 승인 시 양도인 이메일로 안내드리니 이를 참고해 매출을 신고해 주세요. 상품 광고비 잔액은 광고 정산 시점의 사업자 기준으로 정산되어 양수인에게 넘어갈 수 있으니, 원하지 않으시면 양도인이 미리 환불을 요청해 주세요. → 10", "sec": false, "body": []}, {"k": "7", "id": "7", "t": "휴업 관련 어떤 내용이신가요?", "sec": false, "body": []}, {"k": "7-1", "id": "7-1", "t": "휴업을 원하시는 일자와 사유를 알려주시겠어요?", "sec": false, "body": ["휴업 접수를 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-A)"]}, {"k": "7-2", "id": "7-2", "t": "휴업 철회는 담당 부서 확인이 필요해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)", "sec": false, "body": []}, {"k": "8", "id": "8", "t": "퇴점 관련 어떤 내용이 궁금하신가요?", "sec": false, "body": []}, {"k": "8-1", "id": "8-1", "t": "파트너센터 > 가이드/양식 > 퇴점신청서", "sec": true, "body": ["1) 계약 해지 신청서(필수)를 작성해 퇴점신청서에 첨부해 주세요. 사업자명, 대표명, 날인 3가지를 모두 기입해야 합니다.", "2) 광고 환불 신청서(선택)는 광고를 진행해 환불할 잔액이 있는 경우에만 첨부해 주세요. 잔여 광고비는 [오로라 > 광고 관리 > 오하우스애즈/배너광고 > 광고비 관리]에서 확인하실 수 있으며, 검토 후 정산 계좌로 환불됩니다. 카드 자동충전이 켜져 있으면 끄고 [정보 관리 > 결제수단 관리]에서 등록 카드를 삭제해 주세요. 광고 관련 확인은 ad_product@bucketplace.net 으로 문의해 주세요.", "3) 폐업 없이 오늘의집 퇴점만 하시는 경우 퇴점 사유를 [폐업 외]로 선택하시면 사업자등록증을 제출하지 않으셔도 됩니다. 폐업으로 퇴점하시는 경우 잔여 정산 처리를 위해 사업자등록증 제출이 필요합니다.", "진행 절차: 퇴점 신청서 작성 > 7일간 파트너사 잔여 이슈(미해결 주문·배송·취소·교환/환불·문의) 처리 > 7일 후 남은 이슈는 오늘의집이 직권 취소·환불 처리(비용 발생 시 정산 차감 또는 대금 청구) > 계약 해지서 발송", "유의사항", "- 퇴점 완료 후에는 판매자 시스템에 접속할 수 없으니 [정산관리 > 부가세신고]에서 월별 매출 자료를 미리 내려받아 주세요.", "- 정산은 퇴점 여부와 관계없이 구매확정일 +2영업일에 정상 진행되며, 일정 조정은 불가합니다. 폐업으로 인한 퇴점은 정산대금 지급이 보류되어 자료를 요청드릴 수 있습니다.", "- 등록된 상품은 모두 삭제되며, 재입점 시 상품·리뷰 이관은 불가합니다. 퇴점 후 6개월 동안 재입점할 수 없습니다.", "- 퇴점 진행 중에는 상품 등록이 반려됩니다.", "- 계약 기간 1년이 끝나지 않았더라도 사전 협의 후 퇴점이 가능합니다."]}, {"k": "8-1/8-2", "id": "8-2", "t": "퇴점은 신청서 접수 후 7일간 잔여 이슈 처리 기간을 거쳐 계약 해지서 발송 순서로 진행됩니다. 7일 후 남은 이슈는 오늘의집이 직권 취소·환불 처리합니다.", "sec": false, "body": []}, {"k": "8-1/8-2-1", "id": "8-2-1", "t": "진행 상황 확인을 위해 퇴점 신청일을 알려주시겠어요?", "sec": false, "body": ["담당 부서 확인을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-D)"]}, {"k": "8-1/8-3", "id": "8-3", "t": "현재 퇴점 상태를 선택해 주세요.", "sec": false, "body": []}, {"k": "8-1/8-3-1", "id": "8-3-1", "t": "퇴점이 완료된 이후에는 철회가 불가합니다. 재입점은 퇴점 완료 6개월 후 셀러샵 추가 신청서로 가능합니다. → 10", "sec": false, "body": []}, {"k": "8-1/8-3-2", "id": "8-3-2", "t": "철회 사유를 알려주시겠어요?", "sec": false, "body": ["퇴점 철회는 담당 부서 확인이 필요해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)"]}, {"k": "8-1/8-4", "id": "8-4", "t": "퇴점 완료 후 최소 6개월이 지나야 재입점 신청이 가능하며,", "sec": false, "body": ["- [정책] 셀러샵 이용 가이드: https://www.partnerbucketplace.com/hc/ko/articles/25553199736345 → 10"]}, {"k": "8-1/10", "id": "10", "t": "더 궁금하신 점이 있으신가요?", "sec": false, "body": []}], "hocond": "휴업 접수 T3-A / 판매정지(신고) 상품으로 양도양수 불가·양도양수 5영업일 경과 미회신·휴업 철회·퇴점 철회·폐업 퇴점 사업자등록증 미제출 T3-C / 양도인 사망·가족 간·직매입 양도양수 T3-B / 퇴점 진행 상황 개별 확인 T3-D / 퇴점·양도양수 관련 감정·민원 T4 / 상담원 직접 요청 T1", "hoinfo": "양도양수 유형(계약상 지위/채권/정보변경)·내용증명 발송일·판매정지(신고) 상품 판매 재개 의사(양도양수), 휴업 일자·사유(휴업), 파트너가 답한 퇴점 상태(완료/진행 중/모름)·퇴점 신청일·철회 사유·폐업 예정 일자(퇴점), 변경 항목과 서류 첨부 여부(정보변경). 판매정지(신고) 상품 보유 여부와 퇴점 진행 상태는 상담원이 직접 확인합니다.", "kms": "059_양도양수___정보변경__휴_퇴점_.md, 058_셀러샵.md, 049_예비_파트너.md, 095_커머스_정책_이관_유형_및_이관_방법.md, 094_영업_리스크팀_이관_유형_및_방법.md, 096_심층문의_이관_유형_및_이관_방법.md, 060_상담_태그별_주요_문의유형_.md", "check": "1) 헬프센터 일부 구버전(입력 issue): 과세유형 변경은 059에 구 방식(사업자 및 계좌변경 신청서 + 메일)만 있어 2025-08-07 이후 오로라 직접 수정 방식과 맞는지 확인 / 2) 정산 담당 메일 도메인 상충: 059 과세유형 'settlement@bucketplace.net' vs 059 양도양수 부가세 'settlement@bucketplace.org' / 3) 재양도양수 가이드 링크가 059 내에서 다름(19561277268761 vs 29540918511641) / 4) 휴업 신청은 KMS상 상담원이 내부 시트에 기록 후 종결, 파트너 셀프 신청 경로가 없어 T3-A로 둠 / 5) 양도양수 판매정지 불가는 '리스크 이슈로 인한 정지'에만 해당, 조회 API가 정지 사유(신고 여부)를 구분해 줘야 분기 가능 / 6) 내용증명 주소·광고 문의 메일을 챗봇이 그대로 안내해도 되는지(파트너향 가이드 공개 정보로 판단) 확인 / 7) (1차 전환) 8-3 퇴점 철회는 파트너가 답한 퇴점 상태로 나누므로, 완료 여부를 모르는 경우는 8-3-2로 받아 상담원이 확인 / 8) (1차 전환) 게시판 2차 후보의 '휴업 접수 Write'는 처리 API 명세(W-01~W-06)에 해당 API가 없어 api_cases에 넣지 않음. API 명세 추가 여부 확인 필요 / 9) (1차 전환) 조회 API가 없으면 로그인 샵 정보(R-01) 전달 여부도 확인 필요. 전달되지 않으면 퇴점 진행 확인 인계 시 셀러샵명을 함께 받아야 함", "api": "R-09", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 변경 종류: \n· (해당 시: 양도양수) 양도양수 경우: \n· (해당 시: 양도양수 회신 지연) 내용증명 발송일: \n· (해당 시: 소명 후 판매 / 상품 삭제) 판매정지 상품 때문에 양도양수가 안 된다는 안내를 받았는지와 해당 상품 처리 의사: \n· (해당 시: 휴업 신청) 휴업 일자와 사유: \n· (해당 시: 퇴점 진행 상황·철회) 퇴점 신청일: \n· (해당 시: 퇴점 철회) 퇴점 완료 여부 (완료됨 / 진행 중): \n· (해당 시: 퇴점 철회) 철회 사유: \n· (해당 시: 폐업 퇴점인데 사업자등록증 제출 불가) 폐업 예정일: \n\n문의 내용: ", "mode": "조건별: 정보변경·정산계좌·사업자번호·과세유형·양도양수 서류와 조건·채권 양도양수·해외 불가·양도양수 중 판매와 정산·퇴점 신청 방법·완료 후 철회 불가·재입점 안내는 자동답변 종결 / 휴업 신청·휴업 철회·판매정지 상품으로 양도양수 불가·5영업일 경과 미회신·사망·가족·직매입 양도양수·퇴점 진행 확인·진행 중 퇴점 철회·폐업 등록증 미제출은 상담원 배정", "segs": [{"c": ["A"], "t": "정보변경·정산계좌·사업자번호·과세유형·양도양수 서류와 조건·채권 양도양수·해외 불가·양도양수 중 판매와 정산·퇴점 신청 방법·완료 후 철회 불가·재입점 안내는 자동답변 종결"}, {"c": ["C"], "t": "휴업 신청·휴업 철회·판매정지 상품으로 양도양수 불가·5영업일 경과 미회신·사망·가족·직매입 양도양수·퇴점 진행 확인·진행 중 퇴점 철회·폐업 등록증 미제출은 상담원 배정"}], "auto": "(공통 첫인사)\n\n[사업자 정보 변경]\n먼저 아래에 해당하면 정보변경이 아닌 양도양수에 해당해 정보변경 요청이 거절될 수 있습니다: 개인사업자 ↔ 법인사업자 전환 / 개인사업자의 대표자 변경 또는 추가 / 법인사업자의 법인등록번호 변경\n해당하지 않으면 오로라에서 직접 수정 요청하실 수 있습니다.\n1) 오로라 > 판매자 정보 > 판매자 정보 하단 [판매자 정보 수정]에서 변경할 항목 수정\n2) 필수 서류란에 변경된 정보가 반영된 사업자등록증과 통신판매신고증 첨부\n3) 수정사유 입력 후 요청\n검수는 영업일 기준 2일 이내 완료되며, 진행 상황은 오로라 > 판매자정보 > 판매자 정보 수정 처리 현황에서 확인하실 수 있습니다. 서류가 누락되거나 변경 정보가 반영되지 않은 서류를 첨부하시면 거절될 수 있습니다. (정보변경 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29543329706521)\n\n[정산계좌 변경]\n정산계좌는 사업자 또는 대표자 명의 계좌만 등록하실 수 있으며, 사업자등록증의 대표자명 또는 회사명과 일치해야 합니다. 오로라 > 판매자 정보 > 판매자 정보 하단 [판매자 정보 수정]에서 계좌 인증 후 통장사본을 첨부하고, 필수 서류란에 사업자등록증을 첨부해 요청해 주세요. 검수 후 승인 또는 거절 처리되며 최대 2영업일 정도 소요됩니다.\n\n[사업자등록번호만 바뀌고 대표자는 같은 경우]\n사업자등록번호는 오로라에서 직접 수정하실 수 없습니다. [판매자 정보 수정]에서 그 외 변경된 정보를 수정 요청하시면서 수정사유에 '사업자등록번호가 변경되었음'을 적어 주시고, 변경된 사업자등록증과 통신판매신고증을 꼭 첨부해 주세요. 검수 후 사업자등록번호를 포함한 정보가 변경 처리됩니다. 법인사업자이면서 법인등록번호가 바뀐 경우는 양도양수에 해당합니다.\n\n[과세유형 변경]\n과세유형이 바뀌었다면 오로라 > 판매자 정보에서 사업자 정보 수정 요청을 진행해 주세요. 변경된 사업자등록증과 통신판매업 신고증을 첨부하고, 수정 사유 입력란에 과세유형 변경 내용을 적어 주시면 됩니다. 검수 결과에 따라 변경 사항이 반영되며, 진행 상황은 오로라 > 판매자 정보 수정 처리 현황에서 확인하실 수 있습니다.\n\n[사업자(계약상 지위) 양도양수] (사업자번호 같음 + 대표자 변경 / 법인 + 대표자 같음 + 법인등록번호 변경 / 사업자 2개를 하나로)\n아래 서류를 모두 내용증명으로 보내 주셔야 하며, 서류가 모두 도착해야 처리가 가능합니다.\n- 보내실 곳: 서울특별시 서초구 서초대로 74길 4(서초동), 삼성생명서초타워 27층 오늘의집 정산담당자 앞\n- 제출서류: 1) 사업자(계약상 지위) 양도양수신청서 2) 계약상 지위 양도양수계약서(신청서 내 샘플 참고) 3) 양도인·양수인 각 인감증명서 사본 4) 양도인·양수인 각 사업자등록증 사본 5) 양수인 통신판매업신고증 사본 6) 양수인 정산계좌 사본\n- 신청서·계약서는 사업자등록증 정보와 동일하게 작성하고, 계약체결일은 오로라 > 판매자정보 > 계약정보 > 체결일의 날짜로 적어 주세요.\n- 사업자등록증, 인감증명서(개인사업자는 본인서명사실확인서로 대체 가능)는 최근 3개월 이내 발급분이어야 하며, 인감증명서·본인서명사실확인서는 생년월일과 성별 구분을 제외하고 마스킹해 주세요. 사업자등록증은 사업자등록증명원으로 대체할 수 있습니다.\n- 인터넷 우체국으로 내용증명을 접수하셔도 되지만, 정산담당자 메일로 보내는 방식은 불가합니다.\n- 오하우스애즈/배너광고의 잔여 광고비와 카드 자동충전을 확인하시고, 자동충전이 켜져 있으면 끄고 등록 카드를 삭제해 주세요. (잔액: 오로라 > 광고 관리 > 오하우스애즈/배너광고 > 광고비 관리, 카드 삭제: 같은 메뉴 > 정보 관리 > 결제수단 관리)\n- 지급보류된 정산채권이 있는 경우, 판매정지 또는 중단 상품이 있는 경우, 양수인이 통신판매업 신고가 되어 있지 않은 경우에는 양도양수가 불가합니다.\n처리 결과는 모든 서류 수취 후 5영업일 이내 계약서에 적어 주신 양도인 이메일로 회신드립니다. 내용증명 수신 시 바로 효력이 발생해 특정 일자로 지정할 수는 없습니다. (가이드: https://www.partnerbucketplace.com/hc/ko/articles/29540918511641)\n양도양수 기간 중에도 판매를 원하시면 오로라 > 상품조회/수정에서 판매정지 상품을 검색해 판매중으로 직접 바꾸실 수 있습니다. 양도양수 후에는 양수인에게 오로라 계정이 그대로 이관되어 셀러샵·상품 정보·행사 구좌가 유지되며, 진행 중 정산 사유로 상품이 일시적으로 비노출되거나 노출 순위가 바뀔 수 있습니다. 여러 셀러샵 중 일부만 이관할 수는 없고, 양도양수 후 셀러샵명 등은 직접 변경해 주셔야 합니다.\n정산은 양도양수 완료 시점을 기준으로 이전 매출은 양도인에게, 이후 매출은 양수인에게 지급됩니다. 세금계산서는 월별로 발행되어 양도인·양수인으로 나눠 발행할 수 없으며 해당 월은 양수인에게 발행됩니다. 상품 광고비 잔액은 광고 정산 시점의 사업자 기준으로 정산되어 양수인에게 넘어갈 수 있으니, 원하지 않으시면 양도인이 미리 환불을 요청해 주세요.\n\n[채권 양도양수] (사업자번호·대표자 모두 같고 정산채권만 양도)\n아래 서류를 모두 내용증명으로 보내 주세요(보내실 곳은 사업자 양도양수와 동일).\n- 제출서류: 1) 채권양도통지서 2) 채권양도양수 계약서(통지서 내 샘플 참고) 3) 채권양도인·채권양수인 각 인감증명서 사본 4) 채권양도인·채권양수인 각 사업자등록증 사본 5) 채권양수인 계좌 사본\n- 지급 보류된 정산채권은 양도할 수 없으며, 서류 발급 기한·마스킹 기준은 사업자 양도양수와 같습니다.\n처리 결과는 모든 서류 수취 후 5영업일 이내 양도인 이메일로 회신드립니다. (가이드: https://www.partnerbucketplace.com/hc/ko/articles/29541828774681)\n\n[해외사업자 양도양수]\n해외 사업자는 양도양수가 불가합니다. 다른 사업자로 판매를 원하시면 신규 입점을 신청해 주세요.\n\n[퇴점 신청 방법]\n파트너센터 > 가이드/양식 > 퇴점신청서를 작성해 주세요.\n1) 계약 해지 신청서(필수)를 작성해 퇴점신청서에 첨부해 주세요. 사업자명, 대표명, 날인 3가지를 모두 기입해야 합니다.\n2) 광고 환불 신청서(선택)는 환불할 광고 잔액이 있는 경우에만 첨부해 주세요. 잔여 광고비는 오로라 > 광고 관리 > 오하우스애즈/배너광고 > 광고비 관리에서 확인하실 수 있으며, 검토 후 정산 계좌로 환불됩니다. 광고 관련 확인은 ad_product@bucketplace.net 으로 문의해 주세요.\n3) 폐업 없이 오늘의집 퇴점만 하시는 경우 퇴점 사유를 [폐업 외]로 선택하시면 사업자등록증을 제출하지 않으셔도 됩니다. 폐업으로 퇴점하시는 경우 잔여 정산 처리를 위해 사업자등록증 제출이 필요합니다.\n진행 절차: 퇴점 신청서 작성 > 7일간 파트너사 잔여 이슈(미해결 주문·배송·취소·교환/환불·문의) 처리 > 7일 후 남은 이슈는 오늘의집이 직권 취소·환불 처리(비용 발생 시 정산 차감 또는 대금 청구) > 계약 해지서 발송\n- 퇴점 완료 후에는 판매자 시스템에 접속할 수 없으니 정산관리 > 부가세신고에서 월별 매출 자료를 미리 내려받아 주세요.\n- 정산은 퇴점 여부와 관계없이 구매확정일 +2영업일에 정상 진행되며 일정 조정은 불가합니다. 폐업으로 인한 퇴점은 정산대금 지급이 보류되어 자료를 요청드릴 수 있습니다.\n- 등록된 상품은 모두 삭제되며, 재입점 시 상품·리뷰 이관은 불가합니다. 퇴점 후 6개월 동안 재입점할 수 없고, 퇴점 진행 중에는 상품 등록이 반려됩니다.\n- 계약 기간 1년이 끝나지 않았더라도 사전 협의 후 퇴점이 가능합니다.\n\n[퇴점이 이미 완료된 뒤 철회하시려는 경우]\n퇴점이 완료된 이후에는 철회가 불가합니다. 재입점은 퇴점 완료 6개월 후 셀러샵 추가 신청서로 가능합니다.\n\n[퇴점 후 재입점]\n퇴점 완료 후 최소 6개월이 지나야 재입점 신청이 가능하며, 셀러샵 추가 신청서로 신청해 주세요(최근 3개월 이내 발급 사업자등록증 필수). 신규 입점과 동일하게 검토되어 거절될 수 있고 상품은 새로 등록해야 합니다. (가이드: https://www.partnerbucketplace.com/hc/ko/articles/25553199736345)\n(변경 종류에 해당하는 단락만, 맺음 A)", "ack": "남겨 주신 내용을 담당 부서에 전달해 확인하겠습니다. 확인에 시간이 소요될 수 있는 점 양해 부탁드립니다.\n(휴업 신청: \"남겨 주신 휴업 일자와 사유로 휴업 접수를 진행하겠습니다.\")\n(사망·가족 간·직매입 양도양수: \"해당 경우는 준비 서류가 달라 담당 상담원이 필요한 서류를 안내드리겠습니다.\")\n(진행 중 퇴점 철회, 폐업 퇴점인 경우: \"폐업으로 퇴점 중이시면 2주 안에 양도양수를 신청하실 수 있는 경우 퇴점 철회가 가능합니다.\")", "info": "양도양수 유형·내용증명 발송일·판매정지 상품 처리 의사, 휴업 일자·사유, 퇴점 신청일·완료 여부·철회 사유·폐업 예정일, 변경 항목과 서류 첨부 여부", "kms": "059_양도양수___정보변경__휴_퇴점_.md, 058_셀러샵.md, 049_예비_파트너.md, 095_커머스_정책_이관_유형_및_이관_방법.md, 094_영업_리스크팀_이관_유형_및_방법.md, 096_심층문의_이관_유형_및_이관_방법.md", "check": "1) 과세유형 변경은 059에 구 방식(신청서 + 메일)만 있어 현행 오로라 직접 수정 방식과 맞는지 확인\n2) 정산 담당 메일 도메인 상충: 059 과세유형 'settlement@bucketplace.net' vs 양도양수 부가세·055 'settlement@bucketplace.org'\n3) 재양도양수 가이드 링크가 059 안에서 다름(19561277268761 vs 29540918511641)\n4) 휴업 신청은 KMS상 상담원이 내부 기록 후 종결 — 파트너 셀프 경로가 없어 상담원 배정\n5) 양도양수 불가 사유의 '판매정지 상품'은 리스크 사유 정지(판매정지(신고))에만 해당한다는 KMS 기준과 위 자동답변 문구('판매정지 또는 중단 상품')가 달라 보일 수 있음 — 059 원문 문구 그대로 둠, 정리 필요\n6) 내용증명 주소를 AI 답변에 그대로 넣어도 되는지 (파트너향 공개 가이드 내용으로 판단)"}}, {"code": "PA008001", "draft": false, "name": "정산 수수료", "mid": "정산", "vol": "", "mode": "AI 안내 종결", "utter": "이번 정산에서 수수료가 생각보다 많이 빠졌는데 어떻게 계산된 건가요?\n배송비에도 수수료가 붙나요? 수수료에 부가세 포함이에요?\nMD님이랑 합의한 수수료율이 있는데 정산에는 다르게 적용된 것 같아요", "raw": "1. 네, 파트너님. 정산에 적용된 수수료를 확인해 드릴게요. 어떤 내용이 궁금하신가요?\n[상품별 적용 수수료율] / [배송비·조립비 수수료] / [수수료 부가세 포함 여부] / [특정 정산건의 수수료 금액] / [합의한 수수료율과 다르게 적용됨] / [수수료율 협의·변경을 원함]\n\n(상품별 적용 수수료율 → 2-1 / 배송비·조립비 → 2-2 / 부가세 → 2-3 / 특정 정산건 → 2-4 / 합의 수수료율과 다름 → 2-5 / 협의·변경 → 2-6)\n\n2-1. 상품별로 적용되는 수수료는 오로라 > 상품관리 > 상품 조회/수정 탭에서 확인하실 수 있습니다.\n수수료율은 상품 수수료 > 샵 수수료 > 카테고리 수수료 순으로 우선 적용되며, 파트너님께서 직접 변경하실 수는 없습니다.\n[합의한 수수료율과 다르게 적용됐어요] → 2-5 / [알겠어요] → 3\n\n2-2. 선결제 배송비/조립비와 클레임 배송비에는 상품 수수료와 별도로 발생 건당 3.3%(VAT 포함)의 수수료가 부과됩니다.\n자세한 내용은 [정책] 정산 가이드(https://www.partnerbucketplace.com/hc/ko/articles/26019195503641)에서 확인하실 수 있습니다.\n→ 3\n\n2-3. 오늘의집 상품 판매 시 책정된 수수료는 판매금액에서 공제되며, 해당 수수료에는 부가세가 포함되어 있습니다.\n또한 선결제 배송비/조립비 및 클레임 배송비에는 발생 건당 3.3%(VAT 포함)의 수수료가 부과됩니다.\n→ 3\n\n2-4. 정산건별 수수료는 오로라 > 정산관리 > 정산내역 상세 탭에서 구매확정일로 검색하시면 확인하실 수 있습니다.\n최종 수수료는 상품 수수료 + 선결제 배송/조립비 수수료 + 클레임 배송비 수수료 + 기타정산 수수료 + 매출할인(오늘의집 부담 할인금액)으로 계산됩니다.\n- 상품 수수료: 정산 기준금액 X 상품별로 협의한 수수료율\n- 선결제 배송/조립비 수수료, 클레임 배송비 수수료: 해당 금액 X 3.3%(VAT 포함)\n- 기타정산 수수료: 시스템 오류, 에러 등 수수료에 가감이 필요한 금액\n오늘의집이 부담하는 각종 쿠폰, 포인트 등 할인금액은 최종 수수료에서 차감됩니다.\n[기타정산 사유가 궁금해요] → 2-4-1 / [특정 정산건의 수수료를 확인받고 싶어요] → 2-4-2 / [알겠어요] → 3\n2-4-1. 기타정산은 기타 사유로 정산금액에 가감되는 금액입니다.\n오로라 > 정산관리 > 정산내역 상세 탭 > 엑셀 다운로드 후 상품명에서 사유를 확인하실 수 있으며, 자세한 내용은 정산 담당자 메일(settlement@bucketplace.org)로 문의해 주세요.\n→ 3\n2-4-2. 확인하실 정산건의 구매확정일 또는 주문번호와 궁금하신 수수료 항목을 알려 주시겠어요?\n[구매확정일 또는 주문번호, 문의 내용 입력]\n해당 정산건의 수수료 확인을 위해 담당 상담원에게 연결해 드릴게요.\n→ 상담원 인계 (T3-D)\n\n2-5. 확인을 위해 몇 가지 여쭤볼게요.\n1) 수수료율이 다르게 적용된 상품번호\n2) 합의하신 수수료율과 합의 방식(담당 MD와 협의 / 수수료 협의 요청서 제출)\n3) 합의하신 시점\n[내용 입력]\n4. 말씀해 주신 내용 확인을 위해 담당 상담원에게 연결해 드릴게요. 확인 후 안내드리겠습니다.\n→ 상담원 인계 (T3-C)\n\n2-6. 수수료율 협의·조정 문의로 안내해 드릴게요.\n→ 유형 전환 (유형: PA012002)\n\n3. 더 궁금하신 점이 있으신가요?\n[아니요] → 상담 종료 (유형: PA008001)\n[네] → 1", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 정산에 적용된 수수료를<br/>확인해 드릴게요. 어떤 내용이 궁금하신가요?\"]:::bot\nN2_1[\"<b>2-1<\/b> 상품별로 적용되는 수수료는 오로라 ›<br/>상품관리 › 상품 조회/수정 탭에서 확인하실<br/>수 있습니다.\"]:::bot\nN2_2[\"<b>2-2<\/b> 선결제 배송비/조립비와 클레임 배송비에는<br/>상품 수수료와 별도로 발생 건당<br/>3.3%(VAT 포함)의 수수료가<br/>부과됩니다.\"]:::bot\nN2_3[\"<b>2-3<\/b> 오늘의집 상품 판매 시 책정된 수수료는<br/>판매금액에서 공제되며, 해당 수수료에는<br/>부가세가 포함되어 있습니다.\"]:::bot\nN2_4[\"<b>2-4<\/b> 정산건별 수수료는 오로라 › 정산관리 ›<br/>정산내역 상세 탭에서 구매확정일로 검색하시면<br/>확인하실 수 있습니다.\"]:::bot\nN2_4_1[\"<b>2-4-1<\/b> 기타정산은 기타 사유로 정산금액에 가감되는<br/>금액입니다.\"]:::bot\nN2_4_2[\"<b>2-4-2<\/b> 확인하실 정산건의 구매확정일 또는 주문번호와<br/>궁금하신 수수료 항목을 알려 주시겠어요?\"]:::bot\nN2_5[\"<b>2-5<\/b> 확인을 위해 몇 가지 여쭤볼게요.\"]:::bot\nN4[\"<b>4<\/b> 말씀해 주신 내용 확인을 위해 담당<br/>상담원에게 연결해 드릴게요. 확인 후<br/>안내드리겠습니다.\"]:::bot\nN2_6[\"<b>2-6<\/b> 수수료율 협의·조정 문의로 안내해 드릴게요.\"]:::bot\nN3[\"<b>3<\/b> 더 궁금하신 점이 있으신가요?\"]:::bot\nS --> N1\nN1 -->|\"상품별 적용 수수료율\"| N2_1\nN1 -->|\"배송비·조립비\"| N2_2\nN1 -->|\"부가세\"| N2_3\nN1 -->|\"특정 정산건\"| N2_4\nN1 -->|\"합의 수수료율과 다름\"| N2_5\nN1 -->|\"협의·변경\"| N2_6\nN1 -->|\"상품별 적용 수수료율 / 배송비·조립비<br/>수수료 / 수수료 부가세 포함 여부 / 특정<br/>정산건의 수수료 금액 / 합의한 수수료율과<br/>다르게 적용됨 / 수수료율 협의·변경을 원함\"| N2_1\nN2_1 -->|\"합의한 수수료율과 다르게 적용됐어요\"| N2_5\nN2_1 -->|\"알겠어요\"| N3\nN2_2 --> N3\nN2_3 --> N3\nN2_4 -->|\"기타정산 사유가 궁금해요\"| N2_4_1\nN2_4 -->|\"특정 정산건의 수수료를 확인받고 싶어요\"| N2_4_2\nN2_4 -->|\"알겠어요\"| N3\nN2_4_1 --> N3\nN2_4_2 --> HO_T3D\nN2_4_2 -->|\"구매확정일 또는 주문번호, 문의 내용 입력\"| N2_5\nN2_5 -->|\"내용 입력\"| N4\nN4 --> HO_T3C\nN2_6 --> SW_PA012002\nN3 -->|\"아니요\"| END\nN3 -->|\"네\"| N1\nHO_T3D([\"상담원 인계<br/>개별 조회 필요\"]):::ho\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nSW_PA01200
