<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>파트너센터 상담 흐름도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 좌측 고정 목차(흐름·인계 기준·37개 유형) + 우측 상세. 흐름도는 Mermaid로 그리고, 노드 종류는 색으로 구분 */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --surface-2:#eef0ec; --line:#d9ddd5; --fg:#1d2321; --muted:#5d6762;
  --accent:#1f6f5c; --accent-soft:#dcefe8;
  --bot:#ffffff; --bot-line:#9aa59f;
  --sec:#e6eef9; --sec-line:#6b8fc4;
  --ho:#fdf0dc; --ho-line:#c98a2b; --ho-fg:#7a4d0b;
  --end:#e2f2e4; --end-line:#4f9a5d; --end-fg:#245c2f;
  --sw:#efe7f8; --sw-line:#8d6cc0; --sw-fg:#4f337d;
  --bad:#fbe4e1; --bad-fg:#9b2c1f;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1c2220; --surface-2:#232b28; --line:#33403b; --fg:#e4ebe7; --muted:#9aa8a1;
  --accent:#5cc3a6; --accent-soft:#1d3a32;
  --bot:#1f2624; --bot-line:#5f6d67;
  --sec:#1d2a3d; --sec-line:#6f95cf;
  --ho:#3a2b14; --ho-line:#d39a42; --ho-fg:#f2c98a;
  --end:#1b3321; --end-line:#5fae6d; --end-fg:#a8dcb1;
  --sw:#2c2240; --sw-line:#a689d6; --sw-fg:#d3c2f0;
  --bad:#3d1f1b; --bad-fg:#f0a49a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1c2220; --surface-2:#232b28; --line:#33403b; --fg:#e4ebe7; --muted:#9aa8a1;
  --accent:#5cc3a6; --accent-soft:#1d3a32;
  --bot:#1f2624; --bot-line:#5f6d67;
  --sec:#1d2a3d; --sec-line:#6f95cf;
  --ho:#3a2b14; --ho-line:#d39a42; --ho-fg:#f2c98a;
  --end:#1b3321; --end-line:#5fae6d; --end-fg:#a8dcb1;
  --sw:#2c2240; --sw-line:#a689d6; --sw-fg:#d3c2f0;
  --bad:#3d1f1b; --bad-fg:#f0a49a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.6}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
nav{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px}
nav h1{font-size:16px;margin:0 0 2px;letter-spacing:-.01em}
nav .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
nav .grp{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:16px 0 4px}
nav a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:13px}
nav a:hover{background:var(--surface-2)}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav a .code{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.m-close{background:var(--end-line)} .m-cond{background:var(--sec-line)} .m-collect{background:var(--ho-line)}
main{padding-block:28px 80px;padding-left:max(16px,2.5vw);padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.mobile-pick{display:none;margin-bottom:16px}
.mobile-pick select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
h2{font-size:24px;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}
h3{font-size:16px;margin:28px 0 10px}
.lead{color:var(--muted);max-width:72ch;margin:0 0 18px}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--surface)}
.pill.mono{font-family:var(--f-mono)}
.pill.ho{background:var(--ho);border-color:var(--ho-line);color:var(--ho-fg)}
.pill.end{background:var(--end);border-color:var(--end-line);color:var(--end-fg)}
.pill.sw{background:var(--sw);border-color:var(--sw-line);color:var(--sw-fg)}
.pill.sec{background:var(--sec);border-color:var(--sec-line)}
.pill.bad{background:var(--bad);border-color:var(--bad-fg);color:var(--bad-fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw-box{width:14px;height:10px;border-radius:3px;border:1.5px solid}
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;position:relative;max-height:78vh}
.diagram .inner{padding:16px;min-height:120px}
.diagram svg{display:block;margin:0 auto;height:auto}
.diagram svg foreignObject{overflow:visible}
.diagram svg .nodeLabel,.diagram svg .edgeLabel{white-space:nowrap}
.tools{display:flex;gap:6px;align-items:center;margin:0 0 8px;flex-wrap:wrap}
button{font:inherit;font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--accent)} button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.card p,.card li{margin:0}
.pre{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:8px 0}
details>summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:13px}
details>.body{padding:4px 16px 16px}
.script .ln{padding:3px 0}
.script .node{display:flex;gap:10px;align-items:flex-start;margin:10px 0 2px}
.script .nid{font-family:var(--f-mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;flex:none;margin-top:2px}
.script .bubble{background:var(--surface-2);border-radius:4px 12px 12px 12px;padding:6px 10px;max-width:70ch}
.script .secline{margin:18px 0 4px;font-weight:600;color:var(--sec-line)}
.script .btns{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 4px 44px}
.script .btn{border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:1px 10px;font-size:12px}
.script .note{color:var(--muted);font-size:12.5px;margin-left:44px}
.script .arrow{margin-left:44px;font-size:12.5px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tnum{font-variant-numeric:tabular-nums}
.seg{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.seg:last-child{border-bottom:0}
.seg .tags{display:flex;gap:4px;flex:none;flex-wrap:wrap;max-width:150px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare .card.theirs{border-style:dashed}
.flag{display:flex;gap:8px;padding:10px 12px;border-radius:8px;background:var(--bad);color:var(--bad-fg);margin:8px 0;font-size:13px}
.ok{display:flex;gap:8px;padding:10px 12px;border-radius:8px;background:var(--end);color:var(--end-fg);margin:8px 0;font-size:13px}
.muted{color:var(--muted)}
ol.issues{padding-left:20px} ol.issues li{margin:0 0 10px}
@media (max-width:860px){
  .app{grid-template-columns:1fr} nav{display:none} .mobile-pick{display:block}
  .compare{grid-template-columns:1fr}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<style>body{margin:0}</style>

<script type="application/json" id="data">{"types": [{"code": "PA002002", "draft": false, "name": "주문/취소 기타", "mid": "주문/취소", "vol": "389", "mode": "AI 안내 종결", "utter": "취소 요청 들어온 거 처리 안 하면 자동으로 승인되나요?\n부분 취소하면 무료배송 조건 깨지는데 배송비는 누가 내요?", "raw": "1. 네, 파트너님. 주문·취소 정책을 안내해 드리겠습니다. 궁금하신 내용을 선택해 주세요.\n[취소 가능한 주문 상태] / [부분 취소 시 배송비] / [자동 취소승인 기준] / [정산 시점] / [포인트·쿠폰 원복] / [수량 일부·추가옵션만 취소]\n(특정 주문 건의 금액·상태를 묻는 경우 → 유형 PA002010으로 전환(1차에는 주문번호를 받아 상담원이 확인, T3-D) / 처리(접수·변경) 요청이면 → 해당 처리 유형 PA002003~PA002006으로 전환 / 반품·교환 정책 질문이면 → 유형 PA002011로 전환)\n\n2-1. [취소 가능한 주문 상태]\n파트너님, 주문 상태에 따라 처리 방식이 다릅니다.\n- 입금대기·결제완료: 고객님이 직접 주문 취소할 수 있습니다.\n- 배송준비중: 고객님이 직접 취소할 수 없고, 파트너님 확인 후 처리가 필요합니다.\n- 배송중부터: 취소가 아닌 반품·교환으로 요청됩니다.\n- 구매확정: 반품·교환 접수가 되지 않으며, 구매확정 후 취소로 처리합니다.\n취소·반품·교환 접수는 고객님이 진행하는 항목이라 파트너님이 직접 접수하실 수는 없습니다. 접수가 필요하면 고객님께 접수를 안내해 주시고, 안내 과정에서 분쟁 등으로 도움이 필요하시면 파트너센터로 문의해 주세요.\n→ 3\n\n2-3. [부분 취소 시 배송비]\n파트너님, 부분 취소·반품으로 무료배송 조건이 깨지면 귀책 대상이 비용을 부담합니다. 구매자 귀책이면 고객님이, 판매자 귀책이면 파트너님이 부담합니다.\n구매자 귀책일 때 결제완료 상태라면 초도 배송비가 자동 차감된 뒤 환불되고, 배송준비중~배송완료 상태라면 고객님이 요청 시점에 배송비 결제 방식을 선택합니다. 이 경우 파트너님이 고객님께 따로 받으실 필요는 없습니다.\n예를 들어 30,000원 이상 무료배송 상품(10,000원)을 3개 구매한 고객님이 단순변심으로 1개를 취소·반품하면, 초도 배송비 3,000원을 차감한 7,000원이 환불되고 파트너님께는 23,000원이 정산됩니다.\n초도 배송비는 환불할 때 1회만 부과되며, 제주·도서산간 등 지역별 추가 배송비는 포함되지 않습니다.\n→ 3\n\n2-4. [자동 취소승인 기준]\n파트너님, 처리하지 않은 취소 요청은 아래 기준으로 자동 처리됩니다.\n- 취소: 취소요청일로부터 7영업일째 자동 취소승인 (주문제작 상품은 21영업일째)\n→ 3\n\n2-5. [정산 시점]\n파트너님, 클레임별 정산 반영 시점은 아래와 같습니다.\n- 취소승인: 정산 대상이 아니며, 발생한 클레임 비용은 클레임 완료 즉시 정산에 반영됩니다.\n- 취소불가: 배송중 상태로 바뀐 뒤 배송 상태에 따라 정산 차수에 반영됩니다.\n→ 3\n\n2-6. [포인트·쿠폰 원복]\n파트너님, 취소나 반품이 처리되면 고객님이 사용한 오늘의집 포인트와 쿠폰은 기본적으로 원복됩니다. 포인트·쿠폰의 자세한 내역은 파트너센터에서 확인이 어려워, 고객님께 오늘의집 고객센터(1670-0876)로 문의하시도록 안내 부탁드립니다.\n→ 3\n\n2-7. [수량 일부·추가옵션만 취소]\n파트너님, 같은 옵션의 수량 일부만 취소·반품·교환하는 것은 불가하며, 옵션 전체 수량 단위로만 가능합니다. 서로 다른 옵션을 구매했다면 필요한 옵션만 처리할 수 있습니다.\n본상품과 추가옵션을 함께 주문한 경우 본상품만 취소·환불할 수 없고, 추가옵션도 함께 처리해야 합니다.\n실제 처리가 필요하시면 주문번호를 알려주세요.\n[주문번호 입력] → 유형 PA002003으로 전환\n→ 3\n\n(KMS에 근거가 없는 정책 질문이면 → 2-8)\n2-8. 보다 정확한 안내를 위해 상담원이 확인 후 안내드리겠습니다. → 상담원 인계 (T5)\n(정산이 마이너스라 구매확정 주문을 취소할 수 없다고 하면 → 유형 PA002009로 전환)\n(쿠폰 오등록·가격 오등록 관련이면 → 유형 PA002004로 전환)\n\n3. 더 궁금하신 내용이 있으신가요?\n[다른 정책도 궁금해요] → 1\n[아니요] → 상담 종료 (유형: PA002002)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 주문·취소 정책을 안내해<br/>드리겠습니다. 궁금하신 내용을 선택해<br/>주세요.\"]:::bot\nN2_1{{\"취소 가능한 주문 상태\"}}:::sec\nN2_3{{\"부분 취소 시 배송비\"}}:::sec\nN2_4{{\"자동 취소승인 기준\"}}:::sec\nN2_5{{\"정산 시점\"}}:::sec\nN2_6{{\"포인트·쿠폰 원복\"}}:::sec\nN2_7{{\"수량 일부·추가옵션만 취소\"}}:::sec\nN2_7_2_8[\"<b>2-8<\/b> 보다 정확한 안내를 위해 상담원이 확인 후<br/>안내드리겠습니다.\"]:::bot\nN2_7_3[\"<b>3<\/b> 더 궁금하신 내용이 있으신가요?\"]:::bot\nS --> N1\nN1 -->|\"특정 주문 건의 금액·상태를 묻는 경우\"| SW_PA002010\nN1 -->|\"처리(접수·변경) 요청이면\"| SWX1\nN1 -->|\"반품·교환 정책 질문이면\"| SW_PA002011\nN1 -->|\"취소 가능한 주문 상태\"| N2_1\nN2_1 --> N2_7_3\nN1 -->|\"부분 취소 시 배송비\"| N2_3\nN2_3 --> N2_7_3\nN1 -->|\"자동 취소승인 기준\"| N2_4\nN2_4 --> N2_7_3\nN1 -->|\"정산 시점\"| N2_5\nN2_5 --> N2_7_3\nN1 -->|\"포인트·쿠폰 원복\"| N2_6\nN2_6 --> N2_7_3\nN1 -->|\"수량 일부·추가옵션만 취소\"| N2_7\nN2_7 -->|\"주문번호 입력\"| SW_PA002003\nN2_7 --> N2_7_3\nN2_7 -->|\"KMS에 근거가 없는 정책 질문이면\"| N2_7_2_8\nN2_7_2_8 --> HO_T5\nN2_7_2_8 -->|\"정산이 마이너스라 구매확정 주문을 취소할 수<br/>없다고 하면\"| SW_PA002009\nN2_7_2_8 -->|\"쿠폰 오등록·가격 오등록 관련이면\"| SW_PA002004\nN2_7_3 -->|\"다른 정책도 궁금해요\"| N1\nN2_7_3 -->|\"아니요\"| END\nSW_PA002010[/\"「주문·결제 금액 조회」로 전환\"/]:::sw\nSWX1[/\"「부분취소 처리」~「기타 사유 취소」<br/>중 해당 처리 유형으로<br/>전환\"/]:::sw\nSW_PA002011[/\"「반품/교환 기타」로 전환\"/]:::sw\nSW_PA002003[/\"「부분취소 처리」로 전환\"/]:::sw\nHO_T5([\"상담원 인계<br/>답변 불가\"]):::ho\nSW_PA002009[/\"「구매확정 후 취소·환불」로 전환\"/]:::sw\nSW_PA002004[/\"「대량취소 처리」로 전환\"/]:::sw\nEND([\"상담 종료\"]):::fin", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 주문·취소 정책을 안내해 드리겠습니다. 궁금하신 내용을 선택해 주세요.", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "취소 가능한 주문 상태", "sec": true, "body": ["파트너님, 주문 상태에 따라 처리 방식이 다릅니다.", "- 입금대기·결제완료: 고객님이 직접 주문 취소할 수 있습니다.", "- 배송준비중: 고객님이 직접 취소할 수 없고, 파트너님 확인 후 처리가 필요합니다.", "- 배송중부터: 취소가 아닌 반품·교환으로 요청됩니다.", "- 구매확정: 반품·교환 접수가 되지 않으며, 구매확정 후 취소로 처리합니다.", "취소·반품·교환 접수는 고객님이 진행하는 항목이라 파트너님이 직접 접수하실 수는 없습니다. 접수가 필요하면 고객님께 접수를 안내해 주시고, 안내 과정에서 분쟁 등으로 도움이 필요하시면 파트너센터로 문의해 주세요."]}, {"k": "2-3", "id": "2-3", "t": "부분 취소 시 배송비", "sec": true, "body": ["파트너님, 부분 취소·반품으로 무료배송 조건이 깨지면 귀책 대상이 비용을 부담합니다. 구매자 귀책이면 고객님이, 판매자 귀책이면 파트너님이 부담합니다.", "구매자 귀책일 때 결제완료 상태라면 초도 배송비가 자동 차감된 뒤 환불되고, 배송준비중~배송완료 상태라면 고객님이 요청 시점에 배송비 결제 방식을 선택합니다. 이 경우 파트너님이 고객님께 따로 받으실 필요는 없습니다.", "예를 들어 30,000원 이상 무료배송 상품(10,000원)을 3개 구매한 고객님이 단순변심으로 1개를 취소·반품하면, 초도 배송비 3,000원을 차감한 7,000원이 환불되고 파트너님께는 23,000원이 정산됩니다.", "초도 배송비는 환불할 때 1회만 부과되며, 제주·도서산간 등 지역별 추가 배송비는 포함되지 않습니다."]}, {"k": "2-4", "id": "2-4", "t": "자동 취소승인 기준", "sec": true, "body": ["파트너님, 처리하지 않은 취소 요청은 아래 기준으로 자동 처리됩니다.", "- 취소: 취소요청일로부터 7영업일째 자동 취소승인 (주문제작 상품은 21영업일째)"]}, {"k": "2-5", "id": "2-5", "t": "정산 시점", "sec": true, "body": ["파트너님, 클레임별 정산 반영 시점은 아래와 같습니다.", "- 취소승인: 정산 대상이 아니며, 발생한 클레임 비용은 클레임 완료 즉시 정산에 반영됩니다.", "- 취소불가: 배송중 상태로 바뀐 뒤 배송 상태에 따라 정산 차수에 반영됩니다."]}, {"k": "2-6", "id": "2-6", "t": "포인트·쿠폰 원복", "sec": true, "body": ["파트너님, 취소나 반품이 처리되면 고객님이 사용한 오늘의집 포인트와 쿠폰은 기본적으로 원복됩니다. 포인트·쿠폰의 자세한 내역은 파트너센터에서 확인이 어려워, 고객님께 오늘의집 고객센터(1670-0876)로 문의하시도록 안내 부탁드립니다."]}, {"k": "2-7", "id": "2-7", "t": "수량 일부·추가옵션만 취소", "sec": true, "body": ["파트너님, 같은 옵션의 수량 일부만 취소·반품·교환하는 것은 불가하며, 옵션 전체 수량 단위로만 가능합니다. 서로 다른 옵션을 구매했다면 필요한 옵션만 처리할 수 있습니다.", "본상품과 추가옵션을 함께 주문한 경우 본상품만 취소·환불할 수 없고, 추가옵션도 함께 처리해야 합니다.", "실제 처리가 필요하시면 주문번호를 알려주세요."]}, {"k": "2-7/2-8", "id": "2-8", "t": "보다 정확한 안내를 위해 상담원이 확인 후 안내드리겠습니다. → 상담원 인계 (T5)", "sec": false, "body": []}, {"k": "2-7/3", "id": "3", "t": "더 궁금하신 내용이 있으신가요?", "sec": false, "body": []}], "hocond": "KMS 근거 없는 정책 질문 T5 / 특정 주문의 금액·상태 확인은 PA002010 전환 후 T3-D / 공통: 상담원 직접 요청 T1 / 같은 질문 반복·미해결 T2 / 감정·민원 T4 / 복수 용건 T7 / 운영시간 종료 직전 인계 T8", "hoinfo": "문의한 정책 항목, 챗봇이 안내한 내용, 관련 주문번호(있으면)", "kms": "063_취소.md, 065__주문_.md, 055_정산.md, 080_파트너센터_교육자료__클레임.md, 060_상담_태그별_주요_문의유형_.md", "check": "1) (1차 전환) 특정 주문의 금액·상태 문의는 PA002010으로 넘긴 뒤 1차에 T3-D로 인계됨. PA002002 안에서 주문번호를 받아 바로 인계할지, PA002010으로 전환해 통계를 잡을지 확인 필요.\n2) 10/20 중분류 분리(주문/취소·반품/교환)로 기존 「취소/반품/교환 기타」를 이 유형과 PA002011 반품/교환 기타로 나눔. 월 인입 389는 분리 전 합계", "api": "R-02, R-04", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 궁금한 항목 (선택): \n· 관련 주문번호 (선택): \n\n문의 내용: ", "mode": "조건별: 기준·방법 문의는 자동답변 종결 / 특정 주문 처리·중재 요청이면 해당 처리 유형으로 바꿔 판정 / KMS에 없는 기준 질문은 상담원 배정", "segs": [{"c": ["A"], "t": "기준·방법 문의는 자동답변 종결"}, {"c": ["SW"], "t": "특정 주문 처리·중재 요청이면 해당 처리 유형으로 바꿔 판정"}, {"c": ["C"], "t": "KMS에 없는 기준 질문은 상담원 배정"}], "auto": "(공통 첫인사)\n(문의에 해당하는 항목만 골라 안내. 두 항목 이상이면 순서대로 함께 안내)\n\n[주문 상태별 처리 방식]\n주문 상태에 따라 처리 방식이 다릅니다.\n- 입금대기·결제완료: 고객님이 직접 주문을 취소하실 수 있습니다.\n- 배송준비중: 고객님이 직접 취소하실 수 없어 파트너님 확인 후 처리가 필요합니다.\n- 배송중부터: 취소가 아닌 반품·교환으로 요청됩니다.\n- 구매확정: 반품·교환 접수가 되지 않으며, 구매확정 후 취소로 처리합니다.\n취소·반품·교환 접수는 고객님이 진행하는 항목이라 파트너님이 직접 접수하실 수는 없습니다. 접수가 필요하면 고객님께 접수를 안내해 주시고, 안내 과정에서 분쟁 등으로 중재가 필요하시면 파트너센터로 문의해 주세요.\n\n[부분 취소 배송비]\n부분 취소·반품으로 무료배송 조건이 깨지면 귀책 대상이 비용을 부담합니다. 구매자 귀책이면 고객님이, 판매자 귀책이면 파트너님이 부담합니다.\n구매자 귀책일 때 결제완료 상태라면 초도 배송비가 자동 차감된 뒤 환불되고, 배송준비중~배송완료 상태라면 고객님이 요청 시점에 배송비 결제 방식을 선택합니다. 이 경우 파트너님이 따로 받으실 필요는 없습니다.\n예를 들어 30,000원 이상 무료배송 상품(10,000원)을 3개 구매한 고객님이 단순변심으로 1개를 취소·반품하면, 초도 배송비 3,000원을 차감한 7,000원이 환불되고 파트너님께는 23,000원이 정산됩니다. 초도 배송비는 환불할 때 1회만 부과되며 제주·도서산간 등 지역별 추가 배송비는 포함되지 않습니다.\n\n[자동 취소승인 기준]\n처리하지 않은 취소 요청은 아래 기준으로 자동 처리됩니다.\n- 취소: 취소요청일로부터 7영업일째 자동 취소승인 (주문제작 상품은 21영업일째)\n\n[클레임 정산 시점]\n- 취소승인: 정산 대상이 아니며, 발생한 클레임 비용은 클레임 완료 즉시 정산에 반영됩니다.\n- 취소불가: 배송중 상태로 바뀐 뒤 배송 상태에 따라 정산 차수에 반영됩니다.\n\n[포인트·쿠폰 원복]\n취소나 반품이 처리되면 고객님이 사용한 오늘의집 포인트와 쿠폰은 기본적으로 원복됩니다. 포인트·쿠폰의 자세한 내역은 파트너센터에서 확인이 어려워, 고객님께 오늘의집 고객센터(1670-0876)로 문의하시도록 안내 부탁드립니다.\n\n[수량 일부·추가옵션만 취소]\n같은 옵션의 수량 일부만 취소·반품·교환하는 것은 불가하며, 옵션 전체 수량 단위로만 가능합니다. 서로 다른 옵션을 구매했다면 필요한 옵션만 처리할 수 있습니다.\n본상품과 추가옵션을 함께 주문한 경우 본상품만 취소·환불할 수 없고 추가옵션도 함께 처리해야 합니다.\n실제 처리가 필요하시면 세부 유형 '주문 일부(옵션·수량)만 취소'로 주문번호와 함께 새 문의를 남겨 주세요.\n(맺음 A)", "ack": "문의하신 기준은 담당 상담원이 확인해 정확히 안내드리겠습니다.", "info": "문의한 기준 항목, AI가 답하지 못한 사유(KMS 근거 없음 등), 관련 주문번호(있으면)", "kms": "063_취소.md, 065__주문_.md, 055_정산.md, 080_파트너센터_교육자료__클레임.md", "check": "1) 10/20 중분류 분리(주문/취소·반품/교환)로 기존 「취소/반품/교환 기타」를 이 유형과 PA002011 반품/교환 기타로 나눔. 자동 구매확정 기준 등 반품·교환 쪽 쟁점은 PA002011 행 참고"}}, {"code": "PA002010", "draft": true, "name": "주문·결제 금액 조회", "mid": "주문/취소", "vol": "197", "mode": "안내 후 조건부 상담원 연결", "utter": "이 주문 고객 실제 결제금액이 얼마인가요?\n쿠폰 할인 얼마 들어갔는지 확인해 주세요\n반품 환불금액이 왜 이렇게 나왔는지 알고 싶어요", "raw": "1. 네, 파트너님. 주문 금액 확인을 도와드리겠습니다. 어떤 내용을 확인하시겠어요?\n[결제금액·할인 내역] / [취소·반품 환불금액] / [주문 내역·상태]\n\n2-1. [결제금액·할인 내역]\n파트너님, 주문 건별 실결제금액은 상담원이 확인해 안내드리겠습니다. 할인·쿠폰 부담 주체 등 구매자 관련 항목은 안내드리기 어렵고, 그 밖의 항목은 오로라 > 정산관리 > 정산내역 상세에서 결제일 기준으로 조회한 뒤 주문정산 및 세부할인내역 파일을 내려받아 직접 확인하실 수 있습니다. 실결제금액 확인이 필요하시면 주문번호 또는 주문옵션번호를 알려주세요.\n[주문번호 입력] → 상담원 인계 (T3-D)\n\n2-2. [취소·반품 환불금액]\n파트너님, 환불 정보는 오로라 > 취소/반품/교환 > 취소관리 또는 반품관리에서 취소번호·반품번호를 누르시면 직접 확인하실 수 있습니다.\n부분 취소·반품으로 무료배송 조건이 깨지면 귀책 대상이 배송비를 부담하며, 구매자 귀책이면 초도 배송비가 차감됩니다.\n[확인했어요] → 3\n[금액이 이해가 안 돼요] → 2-2-1\n2-2-1. 해당 주문의 환불 금액은 상담원이 확인해 안내드리겠습니다. 주문번호 또는 주문옵션번호와 취소번호·반품번호(있으면)를 알려주세요.\n[주문번호 입력] → 상담원 인계 (T3-D)\n\n2-3. [주문 내역·상태]\n파트너님, 어떤 내용이 궁금하신가요?\n[오로라에서 주문이 안 보여요] → 2-3-1\n[고객 정보가 안 보여요] → 2-3-2\n[기간별 반품승인 내역을 보고 싶어요] → 2-3-3\n[2022년 이전 주문을 조회하고 싶어요] → 2-3-4\n[특정 주문의 현재 상태를 알고 싶어요] → 2-3-5\n2-3-1. 오로라에는 결제완료 단계부터 주문이 수집되어, 입금대기 중이거나 입금 전 취소된 주문은 확인되지 않습니다. 결제완료·배송준비중 상태에서 고객님이 취소를 접수했다면 오로라 > 취소/반품/교환 > 취소관리에서, 배송중 상태에서 반품을 접수했다면 반품관리에서 확인하실 수 있습니다.\n→ 3\n2-3-2. 고객 정보는 구매확정 후 90일 이내 주문까지 오로라에서 확인하실 수 있습니다.\n→ 3\n2-3-3. 오로라 > 반품관리에서 기간과 반품승인 상태를 설정해 조회하실 수 있으며, 최대 3개월씩 조회됩니다. 1년이 지난 이력은 오로라에서 조회되지 않으니 필요하시면 말씀해 주세요.\n[1년 지난 이력이 필요해요] → 필요한 기간과 요청 사유 입력 → 상담원 인계 (T3-C)\n[알겠어요] → 3\n2-3-4. 2022년 이전 주문은 담당 부서 확인이 필요합니다. 필요한 기간과 요청 사유를 알려주세요. [기간·사유 입력] → 상담원 인계 (T3-C)\n2-3-5. 해당 주문의 현재 상태는 상담원이 확인해 안내드리겠습니다. 주문번호 또는 주문옵션번호를 알려주세요.\n[주문번호 입력] → 상담원 인계 (T3-D)\n\n3. 더 확인하실 내용이 있으신가요?\n[아니요] → 상담 종료 (유형: PA002010)\n[정산금액도 궁금해요] → 정산 유형으로 전환\n[이 주문 취소·환불해야 해요] → 3-1\n3-1. 해당 주문은 구매확정된 주문인가요?\n[네, 구매확정 주문이에요] → 유형 PA002009로 전환\n[아니요·잘 모르겠어요] → 취소·반품 처리 유형으로 전환", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 주문 금액 확인을<br/>도와드리겠습니다. 어떤 내용을<br/>확인하시겠어요?\"]:::bot\nN2_1{{\"결제금액·할인 내역\"}}:::sec\nN2_2{{\"취소·반품 환불금액\"}}:::sec\nN2_2_2_2_1[\"<b>2-2-1<\/b> 해당 주문의 환불 금액은 상담원이 확인해<br/>안내드리겠습니다. 주문번호 또는<br/>주문옵션번호와 취소번호·반품번호(있으면)를<br/>알려주세요.\"]:::bot\nN2_3{{\"주문 내역·상태\"}}:::sec\nN2_3_2_3_1[\"<b>2-3-1<\/b> 오로라에는 결제완료 단계부터 주문이<br/>수집되어, 입금대기 중이거나 입금 전 취소된<br/>주문은 확인되지 않습니다.<br/>결제완료·배송준비중 상태에서 고객님이 취소를<br/>접수했다면 오로라 › 취소/반품/교환 ›<br/>취소관리에서, 배송중 상태에서 반품을<br/>접수했다면 반품관리에서 확인하실 수<br/>있습니다.\"]:::bot\nN2_3_2_3_2[\"<b>2-3-2<\/b> 고객 정보는 구매확정 후 90일 이내<br/>주문까지 오로라에서 확인하실 수 있습니다.\"]:::bot\nN2_3_2_3_3[\"<b>2-3-3<\/b> 오로라 › 반품관리에서 기간과 반품승인<br/>상태를 설정해 조회하실 수 있으며, 최대<br/>3개월씩 조회됩니다. 1년이 지난 이력은<br/>오로라에서 조회되지 않으니 필요하시면 말씀해<br/>주세요.\"]:::bot\nN2_3_2_3_4[\"<b>2-3-4<\/b> 2022년 이전 주문은 담당 부서 확인이<br/>필요합니다. 필요한 기간과 요청 사유를<br/>알려주세요.\"]:::bot\nN2_3_2_3_5[\"<b>2-3-5<\/b> 해당 주문의 현재 상태는 상담원이 확인해<br/>안내드리겠습니다. 주문번호 또는<br/>주문옵션번호를 알려주세요.\"]:::bot\nN2_3_3[\"<b>3<\/b> 더 확인하실 내용이 있으신가요?\"]:::bot\nN2_3_3_1[\"<b>3-1<\/b> 해당 주문은 구매확정된 주문인가요?\"]:::bot\nS --> N1\nN1 -->|\"결제금액·할인 내역\"| N2_1\nN2_1 -->|\"주문번호 입력\"| HO_T3D\nN1 -->|\"취소·반품 환불금액\"| N2_2\nN2_2 -->|\"확인했어요\"| N2_3_3\nN2_2 -->|\"금액이 이해가 안 돼요\"| N2_2_2_2_1\nN2_2_2_2_1 -->|\"주문번호 입력\"| HO_T3D\nN1 -->|\"주문 내역·상태\"| N2_3\nN2_3 -->|\"오로라에서 주문이 안 보여요\"| N2_3_2_3_1\nN2_3 -->|\"고객 정보가 안 보여요\"| N2_3_2_3_2\nN2_3 -->|\"기간별 반품승인 내역을 보고 싶어요\"| N2_3_2_3_3\nN2_3 -->|\"2022년 이전 주문을 조회하고 싶어요\"| N2_3_2_3_4\nN2_3 -->|\"특정 주문의 현재 상태를 알고 싶어요\"| N2_3_2_3_5\nN2_3_2_3_1 --> N2_3_3\nN2_3_2_3_2 --> N2_3_3\nN2_3_2_3_3 -->|\"1년 지난 이력이 필요해요\"| HO_T3C\nN2_3_2_3_3 -->|\"알겠어요\"| N2_3_3\nN2_3_2_3_4 -->|\"기간·사유 입력\"| HO_T3C\nN2_3_2_3_5 -->|\"주문번호 입력\"| HO_T3D\nN2_3_3 -->|\"아니요\"| END\nN2_3_3 -->|\"정산금액도 궁금해요\"| SWX3\nN2_3_3 -->|\"이 주문 취소·환불해야 해요\"| N2_3_3_1\nN2_3_3_1 -->|\"네, 구매확정 주문이에요\"| SW_PA002009\nN2_3_3_1 -->|\"아니요·잘 모르겠어요\"| SWX5\nHO_T3D([\"상담원 인계<br/>개별 조회 필요\"]):::ho\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nEND([\"상담 종료\"]):::fin\nSWX3[/\"정산 유형으로 전환\"/]:::sw\nSW_PA002009[/\"「구매확정 후 취소·환불」로 전환\"/]:::sw\nSWX5[/\"취소·반품 처리 유형으로<br/>전환\"/]:::sw", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 주문 금액 확인을 도와드리겠습니다. 어떤 내용을 확인하시겠어요?", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "결제금액·할인 내역", "sec": true, "body": ["파트너님, 주문 건별 실결제금액은 상담원이 확인해 안내드리겠습니다. 할인·쿠폰 부담 주체 등 구매자 관련 항목은 안내드리기 어렵고, 그 밖의 항목은 오로라 > 정산관리 > 정산내역 상세에서 결제일 기준으로 조회한 뒤 주문정산 및 세부할인내역 파일을 내려받아 직접 확인하실 수 있습니다. 실결제금액 확인이 필요하시면 주문번호 또는 주문옵션번호를 알려주세요."]}, {"k": "2-2", "id": "2-2", "t": "취소·반품 환불금액", "sec": true, "body": ["파트너님, 환불 정보는 오로라 > 취소/반품/교환 > 취소관리 또는 반품관리에서 취소번호·반품번호를 누르시면 직접 확인하실 수 있습니다.", "부분 취소·반품으로 무료배송 조건이 깨지면 귀책 대상이 배송비를 부담하며, 구매자 귀책이면 초도 배송비가 차감됩니다."]}, {"k": "2-2/2-2-1", "id": "2-2-1", "t": "해당 주문의 환불 금액은 상담원이 확인해 안내드리겠습니다. 주문번호 또는 주문옵션번호와 취소번호·반품번호(있으면)를 알려주세요.", "sec": false, "body": []}, {"k": "2-3", "id": "2-3", "t": "주문 내역·상태", "sec": true, "body": ["파트너님, 어떤 내용이 궁금하신가요?"]}, {"k": "2-3/2-3-1", "id": "2-3-1", "t": "오로라에는 결제완료 단계부터 주문이 수집되어, 입금대기 중이거나 입금 전 취소된 주문은 확인되지 않습니다. 결제완료·배송준비중 상태에서 고객님이 취소를 접수했다면 오로라 > 취소/반품/교환 > 취소관리에서, 배송중 상태에서 반품을 접수했다면 반품관리에서 확인하실 수 있습니다.", "sec": false, "body": []}, {"k": "2-3/2-3-2", "id": "2-3-2", "t": "고객 정보는 구매확정 후 90일 이내 주문까지 오로라에서 확인하실 수 있습니다.", "sec": false, "body": []}, {"k": "2-3/2-3-3", "id": "2-3-3", "t": "오로라 > 반품관리에서 기간과 반품승인 상태를 설정해 조회하실 수 있으며, 최대 3개월씩 조회됩니다. 1년이 지난 이력은 오로라에서 조회되지 않으니 필요하시면 말씀해 주세요.", "sec": false, "body": []}, {"k": "2-3/2-3-4", "id": "2-3-4", "t": "2022년 이전 주문은 담당 부서 확인이 필요합니다. 필요한 기간과 요청 사유를 알려주세요.", "sec": false, "body": []}, {"k": "2-3/2-3-5", "id": "2-3-5", "t": "해당 주문의 현재 상태는 상담원이 확인해 안내드리겠습니다. 주문번호 또는 주문옵션번호를 알려주세요.", "sec": false, "body": []}, {"k": "2-3/3", "id": "3", "t": "더 확인하실 내용이 있으신가요?", "sec": false, "body": []}, {"k": "2-3/3-1", "id": "3-1", "t": "해당 주문은 구매확정된 주문인가요?", "sec": false, "body": []}], "hocond": "주문 건별 결제금액·할인 내역·환불금액·주문 상태 개별 확인 T3-D / 2022년 이전·1년 경과 이력 요청 T3-C / 취소·환불로 이어지면 해당 유형 전환 / 공통: 상담원 직접 요청 T1 / 같은 질문 반복·미해결 T2 / 감정·민원 T4 / 복수 용건 T7 / 운영시간 종료 직전 인계 T8", "hoinfo": "주문번호·주문옵션번호(환불금액이면 취소번호·반품번호), 확인하려던 금액 종류(결제·할인·환불·상태), 챗봇이 안내한 셀프 확인 경로, 2022년 이전·1년 경과 이력 조회 시 요청 기간과 사유", "kms": "065__주문_.md, 081_파트너센터_교육자료__주문_배송.md, 063_취소.md, 052_반품.md, 092_관리자_이관_유형_및_방법.md, 060_상담_태그별_주요_문의유형_.md", "check": "1) 실결제금액·할인 내역 안내 범위 기준 없음(오늘의집 부담 할인·포인트·결제수단을 파트너에게 공개해도 되는지). 2) 오로라 주문 상세에 결제·할인 정보가 노출되는지 KMS 명시 없음(081은 어드민 주문상세만 결제정보 표기): 셀프 확인 경로 안내 가능 여부 확인 필요. 3) 1년 경과 반품 이력 조회 요청의 이관처 명시 없음('담당부서 통해 확인'만 기재). 4) (1차 전환) 결제·할인 내역은 셀프 확인 경로가 KMS에 없어 1차에는 모두 T3-D 인계로 둠. 오로라 주문 상세에서 확인 가능하다고 확정되면 셀프 경로 안내로 바꿀지 확인 필요. 5) (1차 전환) 주문 상태를 오로라에서 직접 확인하는 경로가 KMS에 명시되지 않아 2-3-5는 T3-D로 둠. 셀프 경로 안내 문구가 필요한지 확인 필요.", "api": "R-03, R-02", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 주문번호 또는 주문옵션번호: \n· 확인할 내용: \n\n문의 내용: ", "mode": "조건별: 오로라에서 직접 확인하는 경로로 답이 끝나는 건 자동답변 종결 / 금액을 대신 확인해 달라는 요청·2022년 이전 주문·1년 지난 반품 이력은 상담원 배정", "segs": [{"c": ["A"], "t": "오로라에서 직접 확인하는 경로로 답이 끝나는 건 자동답변 종결"}, {"c": ["C"], "t": "금액을 대신 확인해 달라는 요청·2022년 이전 주문·1년 지난 반품 이력은 상담원 배정"}], "auto": "(공통 첫인사)\n\n[취소·반품 환불금액을 확인하시려는 경우]\n환불금액은 오로라 > 취소/반품/교환 > 취소관리(반품은 반품관리)에서 취소번호·반품번호를 누르면 환불정보에서 확인하실 수 있습니다. 환불정보에는 주문금액, 차감금액(할인 재계산, 선불배송비 재계산), 환불예정금액이 표시되며, 반품은 반품비용도 함께 확인하실 수 있습니다.\n부분 취소·반품으로 무료배송 조건이 깨지면 귀책 대상이 배송비를 부담하며, 구매자 귀책이면 초도 배송비가 차감됩니다.\n\n[할인 내역을 확인하시려는 경우]\n주문에 적용된 할인 내역은 오로라 > 정산관리 > 정산내역 상세에서 구매확정일 기준으로 검색한 뒤 혜택정산 > 혜택 상세 엑셀 다운로드로 확인하실 수 있습니다. 파트너님 부담 할인은 '혜택정산', 오늘의집 부담 할인은 '매출할인' 항목으로 표시됩니다.\n\n[오로라에서 주문이 보이지 않는 경우]\n오로라에는 결제완료 단계부터 주문이 수집되어, 입금대기 중이거나 입금 전 취소된 주문은 확인되지 않습니다. 결제완료·배송준비중 상태에서 고객님이 취소를 접수했다면 오로라 > 취소/반품/교환 > 취소관리에서, 배송중 상태에서 반품을 접수했다면 반품관리에서 확인하실 수 있습니다. 고객 정보는 구매확정 후 90일 이내 주문까지 오로라에서 확인하실 수 있습니다.\n\n[기간별 반품·환불 내역을 확인하시려는 경우]\n오로라 > 취소/반품/교환 > 반품관리에서 기간과 반품승인 상태를 설정해 조회하실 수 있으며, 최대 3개월씩 조회됩니다. 1년이 지난 이력은 오로라에서 조회되지 않습니다.\n(맺음 A)", "ack": "요청하신 주문의 금액·내역은 담당 상담원이 확인해 안내드리겠습니다. 2022년 이전 주문이나 1년이 지난 이력은 담당 부서 확인이 필요해 시간이 더 걸릴 수 있습니다.", "info": "주문번호·주문옵션번호, 확인하려는 금액 종류(결제·할인·환불·상태), 2022년 이전·1년 경과 이력이면 요청 기간과 사유", "kms": "065__주문_.md, 081_파트너센터_교육자료__주문_배송.md, 063_취소.md, 052_반품.md, 055_정산.md, 092_관리자_이관_유형_및_방법.md", "check": "1) 고객 실결제금액·할인 내역(오늘의집 부담 쿠폰·포인트·결제수단 할인)을 파트너에게 어디까지 알려도 되는지 기준 없음\n2) 081의 주문 상세 '결제 정보·실결제 금액' 표기가 오로라 화면인지 어드민 화면인지 KMS로 불분명 — 오로라라면 셀프 확인 경로로 추가 가능\n3) 1년 경과 반품 이력 요청의 처리 부서 명시 없음('담당부서 통해 확인'만 기재)"}}, {"code": "PA002003", "draft": false, "name": "부분취소 처리", "mid": "주문/취소", "vol": "", "mode": "안내 후 조건부 상담원 연결", "utter": "주문 중에 한 옵션만 품절이라 그것만 취소해 주세요\n고객이 5개 샀는데 2개만 취소하고 싶대요\n본품은 두고 추가옵션만 빼달라는데 가능한가요?", "raw": "1. 네, 파트너님. 주문 일부 취소를 도와드리겠습니다. 주문번호와 취소할 주문옵션번호를 알려주세요.\n[주문번호·주문옵션번호 입력]\n1-1. 해당 주문의 현재 상태를 선택해 주세요.\n[결제완료·배송준비중] → 2\n[고객님이 이미 일부 옵션 취소를 요청했어요] → 2-0\n[배송중·배송완료] → 유형 PA002007로 전환\n[구매확정] → 유형 PA002009로 전환\n[오늘의집 글로벌(일본·미국) 주문이에요] → '오늘의집 글로벌(일본·미국) 주문은 global_op@partnerbucketplace.com 으로 문의해 주세요.' 안내 → 상담 종료 (유형: PA002003)\n[잘 모르겠어요] → 2 (인계 정보에 '주문 상태 미확인'으로 표시, 상담원이 확인)\n\n2-0. 파트너님, 고객님이 이미 일부 옵션의 취소를 요청하신 주문이라면 오로라 > 취소/반품/교환 > 취소관리에서 취소번호 안의 주문옵션번호별로 [취소승인(환불)]을 부분 처리하실 수 있습니다. 단, 같은 취소번호 안에 본상품과 추가옵션이 함께 있으면 본상품만 승인할 수는 없고 둘 다 처리해야 합니다. 승인하지 않으면 취소요청일로부터 7영업일째 자동 승인됩니다.\n[직접 처리할게요] → 상담 종료 (유형: PA002003)\n[처리가 안 돼요] → 상담원 인계 (T3-B)\n\n2. 어떤 방식으로 일부 취소하시나요?\n[여러 옵션 중 특정 옵션 전체] / [같은 옵션의 수량 일부] / [본상품만(추가옵션은 유지)] / [추가옵션만]\n\n2-1. [여러 옵션 중 특정 옵션 전체] 또는 [추가옵션만]\n3. 취소 사유를 선택해 주세요.\n[품절·재고부족·단종·입고지연] / [고객 변심·오주문] / [가격·쿠폰 오등록] / [리콜·이슈] / [기타]\n([가격·쿠폰 오등록], [리콜·이슈] → 유형 PA002004로 전환)\n4. 이번에 취소할 주문은 모두 몇 건인가요? [건수 입력]\n(주문번호 30건 이상이면 → 유형 PA002004로 전환)\n5. 고객님께 일부 취소를 안내하고 동의를 받으셨나요?\n[네, 동의 받았어요] → 6\n[아니요] → (사유가 품절·재고부족·단종·입고지연이면 → 5-1-1) (그 외 사유면 → 5-1)\n5-1. 고객님 사유의 일부 취소는 고객님 동의 확인이 필요합니다. 고객님께 안내하고 동의를 받으신 뒤 다시 문의해 주시면 접수 도와드리겠습니다. → 상담 종료 (유형: PA002003)\n5-1-1. 품절로 인한 일부 취소는 고객님께 먼저 상황을 안내해 주신 뒤 다시 요청해 주시면 바로 접수 도와드리겠습니다.\n[알겠어요] → 상담 종료 (유형: PA002003) / [직접 안내하기 어려워요] → 상담원이 고객님께 취소 안내 문자를 보낸 뒤 접수하도록 상담원 인계 (T3-A)\n6. 패키지할인이 적용된 주문이라면 파트너 귀책으로 접수됩니다. 파트너 귀책이면 취소 상품에만 할인이 취소되고 나머지 상품은 패키지할인이 유지됩니다.\n7. 부분 취소로 무료배송 조건이 깨지면 귀책 대상이 배송비를 부담합니다. 구매자 귀책이면 남은 상품 기준으로 선불 배송비가 다시 계산되어 환불금에서 차감되고, 판매자 귀책이면 고객님께 추가로 차감되지 않습니다.\n접수 내용을 확인해 주세요.\n- 주문번호 ○○ / 취소 주문옵션번호 ○○\n- 취소 사유: ○○\n이대로 접수할까요?\n[네] → 8 / [수정할게요] → 1\n8. 상담원에게 연결해 일부 취소 접수를 진행하겠습니다. 잠시만 기다려 주세요. → 상담원 인계 (T3-A)\n\n2-2. [같은 옵션의 수량 일부]\n파트너님, 같은 옵션의 수량 일부만 취소하는 것은 시스템상 불가하며, 옵션 전체 수량 단위로만 취소할 수 있습니다.\n이 경우 고객님이 실제로 필요한 수량만큼 다시 결제하시고, 기존 주문은 전체 취소하는 방식으로 처리합니다. 다시 결제된 주문은 배송이 중복되지 않도록 전산상 배송완료 처리 후 별도로 관리해 주세요.\n[패키지할인이 적용된 주문이에요] → 2-2-1\n[알겠어요] → 9\n2-2-1. 패키지할인이 적용된 주문은 수량 일부 취소가 전산상 불가해 고객님과 협의가 필요합니다. 판매자 귀책으로 처리한 뒤 해당 상품 금액을 고객님께 별도로 받거나, 전산상 주문을 유지하고 파트너님이 취소 원하는 수량만큼 부분 환불하는 방법이 있습니다. 후자는 정산 시 수수료가 차감되어 파트너님 손실이 생길 수 있습니다. 고객님이 패키지할인에 대해 자세한 설명을 원하시면 오늘의집 고객센터로 문의하시도록 안내해 주세요.\n9. 고객님께 재결제 방법 안내가 필요하시면 오늘의집에서 고객님께 연락해 안내를 도와드릴 수 있습니다. 요청하시겠어요?\n[네, 안내 요청할게요] → 9-1 / [아니요, 직접 안내할게요] → 상담 종료 (유형: PA002003)\n9-1. 고객님께 안내할 수량(실제 필요한 수량)과 기존 주문옵션번호를 알려주세요. [입력] → 상담원 인계 (T3-B)\n\n2-3. [본상품만(추가옵션은 유지)]\n파트너님, 본상품과 추가옵션을 함께 주문한 경우 본상품만 부분 취소·환불할 수 없고, 추가옵션도 함께 전체 취소해야 합니다.\n추가옵션 상품을 본품으로도 따로 판매 중이시라면, 고객님이 해당 상품 페이지에서 추가옵션 상품을 다시 결제한 뒤 기존 주문을 전체 취소하는 방식으로 처리해 주세요. 따로 판매하지 않으신다면 번거로우시겠지만 고객님과 협의해 별도로 환불해 주셔야 합니다.\n10. 진행 방법을 선택해 주세요.\n[재결제 후 전체 취소로 진행] → 3 (사유·건수·동의 확인 후 T3-A)\n[고객과 협의 중 도움이 필요해요] → 상담원 인계 (T3-C)\n[알겠어요] → 상담 종료 (유형: PA002003)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 주문 일부 취소를<br/>도와드리겠습니다. 주문번호와 취소할<br/>주문옵션번호를 알려주세요.\"]:::bot\nN1_1[\"<b>1-1<\/b> 해당 주문의 현재 상태를 선택해 주세요.\"]:::bot\nN2_0[\"<b>2-0<\/b> 파트너님, 고객님이 이미 일부 옵션의 취소를<br/>요청하신 주문이라면 오로라 ›<br/>취소/반품/교환 › 취소관리에서 취소번호<br/>안의 주문옵션번호별로\"]:::bot\nN2[\"<b>2<\/b> 어떤 방식으로 일부 취소하시나요?\"]:::bot\nN2_1{{\"여러 옵션 중 특정 옵션<br/>전체\"}}:::sec\nN2_1_3[\"<b>3<\/b> 취소 사유를 선택해 주세요.\"]:::bot\nN2_1_4[\"<b>4<\/b> 이번에 취소할 주문은 모두 몇 건인가요?\"]:::bot\nN2_1_5[\"<b>5<\/b> 고객님께 일부 취소를 안내하고 동의를<br/>받으셨나요?\"]:::bot\nN2_1_5_1[\"<b>5-1<\/b> 고객님 사유의 일부 취소는 고객님 동의<br/>확인이 필요합니다. 고객님께 안내하고 동의를<br/>받으신 뒤 다시 문의해 주시면 접수<br/>도와드리겠습니다.\"]:::bot\nN2_1_5_1_1[\"<b>5-1-1<\/b> 품절로 인한 일부 취소는 고객님께 먼저<br/>상황을 안내해 주신 뒤 다시 요청해 주시면<br/>바로 접수 도와드리겠습니다.\"]:::bot\nN2_1_6[\"<b>6<\/b> 패키지할인이 적용된 주문이라면 파트너<br/>귀책으로 접수됩니다. 파트너 귀책이면 취소<br/>상품에만 할인이 취소되고 나머지 상품은<br/>패키지할인이 유지됩니다.\"]:::bot\nN2_1_7[\"<b>7<\/b> 부분 취소로 무료배송 조건이 깨지면 귀책<br/>대상이 배송비를 부담합니다. 구매자 귀책이면<br/>남은 상품 기준으로 선불 배송비가 다시<br/>계산되어 환불금에서 차감되고, 판매자<br/>귀책이면 고객님께 추가로 차감되지 않습니다.\"]:::bot\nN2_1_8[\"<b>8<\/b> 상담원에게 연결해 일부 취소 접수를<br/>진행하겠습니다. 잠시만 기다려 주세요.\"]:::bot\nN2_2{{\"같은 옵션의 수량 일부\"}}:::sec\nN2_2_2_2_1[\"<b>2-2-1<\/b> 패키지할인이 적용된 주문은 수량 일부 취소가<br/>전산상 불가해 고객님과 협의가 필요합니다.<br/>판매자 귀책으로 처리한 뒤 해당 상품 금액을<br/>고객님께 별도로 받거나, 전산상 주문을<br/>유지하고 파트너님이 취소 원하는 수량만큼<br/>부분 환불하는 방법이 있습니다. 후자는 정산<br/>시 수수료가 차감되어 파트너님 손실이 생길<br/>수 있습니다. 고객님이 패키지할인에 대해<br/>자세한 설명을 원하시면 오늘의집 고객센터로<br/>문의하시도록 안내해 주세요.\"]:::bot\nN2_2_9[\"<b>9<\/b> 고객님께 재결제 방법 안내가 필요하시면<br/>오늘의집에서 고객님께 연락해 안내를 도와드릴<br/>수 있습니다. 요청하시겠어요?\"]:::bot\nN2_2_9_1[\"<b>9-1<\/b> 고객님께 안내할 수량(실제 필요한 수량)과<br/>기존 주문옵션번호를 알려주세요.\"]:::bot\nN2_3{{\"본상품만(추가옵션은 유지)\"}}:::sec\nN2_3_10[\"<b>10<\/b> 진행 방법을 선택해 주세요.\"]:::bot\nS --> N1\nN1_1 -->|\"결제완료·배송준비중\"| N2\nN1_1 -->|\"고객님이 이미 일부 옵션 취소를 요청했어요\"| N2_0\nN1_1 -->|\"배송중·배송완료\"| SW_PA002007\nN1_1 -->|\"구매확정\"| SW_PA002009\nN1_1 -->|\"오늘의집 글로벌(일본·미국) 주문이에요\"| END\nN1_1 -->|\"잘 모르겠어요\"| N2\nN1 -->|\"주문번호·주문옵션번호 입력\"| N2_0\nN2_0 -->|\"직접 처리할게요\"| END\nN2_0 -->|\"처리가 안 돼요\"| HO_T3B\nN2_0 -->|\"취소승인(환불)\"| N2\nN2 -->|\"여러 옵션 중 특정 옵션 전체\"| N2_1\nN2_1_3 -->|\"가격·쿠폰 오등록, 리콜·이슈\"| SW_PA002004\nN2_1_3 -->|\"품절·재고부족·단종·입고지연 / 고객<br/>변심·오주문 / 가격·쿠폰 오등록 /<br/>리콜·이슈 / 기타\"| N2_1_4\nN2_1_4 -->|\"주문번호 30건 이상이면\"| SW_PA002004\nN2_1_4 -->|\"건수 입력\"| N2_1_5\nN2_1_5 -->|\"네, 동의 받았어요\"| N2_1_6\nN2_1_5 -->|\"아니요\"| TX5\nN2_1_5_1 --> END\nN2_1_5_1_1 -->|\"알겠어요\"| END\nN2_1_5_1_1 -->|\"직접 안내하기 어려워요\"| HO_T3A\nN2_1_7 -->|\"네\"| N2_1_8\nN2_1_7 -->|\"수정할게요\"| N1\nN2_1_8 --> HO_T3A\nN2 -->|\"같은 옵션의 수량 일부\"| N2_2\nN2_2 -->|\"패키지할인이 적용된 주문이에요\"| N2_2_2_2_1\nN2_2 -->|\"알겠어요\"| N2_2_9\nN2_2_9 -->|\"네, 안내 요청할게요\"| N2_2_9_1\nN2_2_9 -->|\"아니요, 직접 안내할게요\"| END\nN2_2_9_1 -->|\"입력\"| HO_T3B\nN2 -->|\"본상품만(추가옵션은 유지)\"| N2_3\nN2_3_10 -->|\"재결제 후 전체 취소로 진행\"| N2_1_3\nN2_3_10 -->|\"고객과 협의 중 도움이 필요해요\"| HO_T3C\nN2_3_10 -->|\"알겠어요\"| END\nN2_1 --> N2_1_3\nN2_1_6 --> N2_1_7\nN2_2_2_2_1 --> N2_2_9\nN2_3 --> N2_3_10\nN1 -.-> N1_1\nN2_1_5 -.-> N2_1_5_1\nN2_1_5_1 -.-> N2_1_5_1_1\nSW_PA002007[/\"「반품 대리접수」로 전환\"/]:::sw\nSW_PA002009[/\"「구매확정 후 취소·환불」로 전환\"/]:::sw\nEND([\"상담 종료\"]):::fin\nHO_T3B([\"상담원 인계<br/>셀프 처리 실패\"]):::ho\nSW_PA002004[/\"「대량취소 처리」로 전환\"/]:::sw\nTX5[\"(사유가<br/>품절·재고부족·단종·입고지연이면<br/>→ 5-1-1) (그 외<br/>사유면 → 5-1)\"]:::txt\nHO_T3A([\"상담원 인계<br/>실행 요청\"]):::ho\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 주문 일부 취소를 도와드리겠습니다. 주문번호와 취소할 주문옵션번호를 알려주세요.", "sec": false, "body": []}, {"k": "1-1", "id": "1-1", "t": "해당 주문의 현재 상태를 선택해 주세요.", "sec": false, "body": []}, {"k": "2-0", "id": "2-0", "t": "파트너님, 고객님이 이미 일부 옵션의 취소를 요청하신 주문이라면 오로라 > 취소/반품/교환 > 취소관리에서 취소번호 안의 주문옵션번호별로", "sec": false, "body": []}, {"k": "2", "id": "2", "t": "어떤 방식으로 일부 취소하시나요?", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "여러 옵션 중 특정 옵션 전체", "sec": true, "body": []}, {"k": "2-1/3", "id": "3", "t": "취소 사유를 선택해 주세요.", "sec": false, "body": []}, {"k": "2-1/4", "id": "4", "t": "이번에 취소할 주문은 모두 몇 건인가요?", "sec": false, "body": []}, {"k": "2-1/5", "id": "5", "t": "고객님께 일부 취소를 안내하고 동의를 받으셨나요?", "sec": false, "body": []}, {"k": "2-1/5-1", "id": "5-1", "t": "고객님 사유의 일부 취소는 고객님 동의 확인이 필요합니다. 고객님께 안내하고 동의를 받으신 뒤 다시 문의해 주시면 접수 도와드리겠습니다. → 상담 종료 (유형: PA002003)", "sec": false, "body": []}, {"k": "2-1/5-1-1", "id": "5-1-1", "t": "품절로 인한 일부 취소는 고객님께 먼저 상황을 안내해 주신 뒤 다시 요청해 주시면 바로 접수 도와드리겠습니다.", "sec": false, "body": []}, {"k": "2-1/6", "id": "6", "t": "패키지할인이 적용된 주문이라면 파트너 귀책으로 접수됩니다. 파트너 귀책이면 취소 상품에만 할인이 취소되고 나머지 상품은 패키지할인이 유지됩니다.", "sec": false, "body": []}, {"k": "2-1/7", "id": "7", "t": "부분 취소로 무료배송 조건이 깨지면 귀책 대상이 배송비를 부담합니다. 구매자 귀책이면 남은 상품 기준으로 선불 배송비가 다시 계산되어 환불금에서 차감되고, 판매자 귀책이면 고객님께 추가로 차감되지 않습니다.", "sec": false, "body": ["접수 내용을 확인해 주세요.", "- 주문번호 ○○ / 취소 주문옵션번호 ○○", "- 취소 사유: ○○", "이대로 접수할까요?"]}, {"k": "2-1/8", "id": "8", "t": "상담원에게 연결해 일부 취소 접수를 진행하겠습니다. 잠시만 기다려 주세요. → 상담원 인계 (T3-A)", "sec": false, "body": []}, {"k": "2-2", "id": "2-2", "t": "같은 옵션의 수량 일부", "sec": true, "body": ["파트너님, 같은 옵션의 수량 일부만 취소하는 것은 시스템상 불가하며, 옵션 전체 수량 단위로만 취소할 수 있습니다.", "이 경우 고객님이 실제로 필요한 수량만큼 다시 결제하시고, 기존 주문은 전체 취소하는 방식으로 처리합니다. 다시 결제된 주문은 배송이 중복되지 않도록 전산상 배송완료 처리 후 별도로 관리해 주세요."]}, {"k": "2-2/2-2-1", "id": "2-2-1", "t": "패키지할인이 적용된 주문은 수량 일부 취소가 전산상 불가해 고객님과 협의가 필요합니다. 판매자 귀책으로 처리한 뒤 해당 상품 금액을 고객님께 별도로 받거나, 전산상 주문을 유지하고 파트너님이 취소 원하는 수량만큼 부분 환불하는 방법이 있습니다. 후자는 정산 시 수수료가 차감되어 파트너님 손실이 생길 수 있습니다. 고객님이 패키지할인에 대해 자세한 설명을 원하시면 오늘의집 고객센터로 문의하시도록 안내해 주세요.", "sec": false, "body": []}, {"k": "2-2/9", "id": "9", "t": "고객님께 재결제 방법 안내가 필요하시면 오늘의집에서 고객님께 연락해 안내를 도와드릴 수 있습니다. 요청하시겠어요?", "sec": false, "body": []}, {"k": "2-2/9-1", "id": "9-1", "t": "고객님께 안내할 수량(실제 필요한 수량)과 기존 주문옵션번호를 알려주세요.", "sec": false, "body": []}, {"k": "2-3", "id": "2-3", "t": "본상품만(추가옵션은 유지)", "sec": true, "body": ["파트너님, 본상품과 추가옵션을 함께 주문한 경우 본상품만 부분 취소·환불할 수 없고, 추가옵션도 함께 전체 취소해야 합니다.", "추가옵션 상품을 본품으로도 따로 판매 중이시라면, 고객님이 해당 상품 페이지에서 추가옵션 상품을 다시 결제한 뒤 기존 주문을 전체 취소하는 방식으로 처리해 주세요. 따로 판매하지 않으신다면 번거로우시겠지만 고객님과 협의해 별도로 환불해 주셔야 합니다."]}, {"k": "2-3/10", "id": "10", "t": "진행 방법을 선택해 주세요.", "sec": false, "body": []}], "hocond": "옵션 단위 부분 취소 접수(Write) T3-A / 고객 재결제 안내 연락 요청·부분 승인 오류 T3-B / 고객 협의 중재 T3-C / 30건 이상·오등록·리콜은 PA002004 전환 / 공통: 상담원 직접 요청 T1 / 같은 질문 반복·미해결 T2 / 감정·민원 T4 / 복수 용건 T7 / 운영시간 종료 직전 인계 T8", "hoinfo": "주문번호, 취소 대상 주문옵션번호(유지할 옵션 포함), 파트너가 선택한 주문 상태(모르면 '주문 상태 미확인'), 부분 취소 방식(옵션 전체/수량 일부/본상품만), 취소 사유, 건수, 고객 안내·동의 여부, 수량 일부 건은 고객이 실제 필요한 수량. 옵션 구성·패키지할인 여부·글로벌 주문 여부·고객 취소요청 여부는 상담원이 확인", "kms": "063_취소.md, 052_반품.md, 088_프로세스_기준_정리_.md, 066_대량취소_프로세스.md, 080_파트너센터_교육자료__클레임.md", "check": "1) 대량 기준 30건(066·093) vs 50건·50만원(063·052·092·086) 상충. 2) 품절 사유 부분 취소에서 고객 미안내 시 처리(1차 안내 후 재요청 vs 그대로 접수·센터 문자) 미정. 3) 088은 '수량부분취소 절차 안내 요청 시 OB 진행'으로만 적혀 있어, 챗봇이 오늘의집 고객 안내를 먼저 제안해도 되는지 확인 필요. 4) 일부 취소 유형이 사유 유형(PA002005·PA002006)보다 우선한다는 규칙에 따라 품절 사유도 이 유형으로 찍음: 통계 분리 필요 여부 확인. 5) (1차 전환) 주문 상태·패키지할인 여부를 파트너 답변으로 받게 바꿈. 파트너가 잘못 고른 경우 상담원이 인계 후 재확인하는 것으로 충분한지 확인 필요. 6) (1차 전환) 2-0 셀프 승인 안내는 고객 취소요청 여부를 파트너가 알고 있다는 전제로 둠.", "api": "R-02, R-04, W-01", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 주문번호: \n· 취소할 주문옵션번호: \n· 부분 취소 방식 (여러 옵션 중 특정 옵션 전체 / 같은 옵션의 수량 일부 / 본상품만(추가옵션은 유지) / 추가옵션만): \n· 취소 사유 (품절·재고부족·단종·입고지연 / 고객 변심·오주문 / 가격·쿠폰 오등록 / 리콜·이슈 / 기타): \n· 고객 안내·동의 (안내했고 동의받음 / 안내했으나 동의 못 받음·연락 안 됨 / 아직 안내 전): \n· (같은 옵션의 수량 일부일 때) 고객이 실제 필요한 수량: \n· 오늘의집에서 고객님께 재결제 방법 안내 연락 요청 (선택): \n\n문의 내용: ", "mode": "조건별: 수량 일부·본상품만 취소는 자동답변 종결(재결제 안내 연락 요청에 체크하면 자동답변 + 상담원 확인) / 옵션 단위 부분 취소 접수는 상담원 배정 / 오등록·리콜 사유는 PA002004로 바꿔 판정", "segs": [{"c": ["A", "B"], "t": "수량 일부·본상품만 취소는 자동답변 종결(재결제 안내 연락 요청에 체크하면 자동답변 + 상담원 확인)"}, {"c": ["C"], "t": "옵션 단위 부분 취소 접수는 상담원 배정"}, {"c": ["SW"], "t": "오등록·리콜 사유는 PA002004로 바꿔 판정"}], "auto": "(공통 첫인사)\n\n[같은 옵션의 수량 일부만 취소하시려는 경우]\n같은 옵션의 수량 일부만 취소하는 것은 시스템상 불가하며, 옵션 전체 수량 단위로만 취소할 수 있습니다.\n이 경우 고객님이 실제로 필요한 수량만큼 다시 결제하시고, 기존 주문은 전체 취소하는 방식으로 처리합니다. 다시 결제된 주문은 배송이 중복되지 않도록 전산상 배송완료 처리 후 별도로 관리해 주세요.\n패키지할인이 적용된 주문은 수량 일부 취소가 전산상 불가해 고객님과 협의가 필요합니다. 판매자 귀책으로 처리한 뒤 해당 상품 금액을 고객님께 별도로 받거나, 전산상 주문을 유지하고 취소 원하는 수량만큼 파트너님이 부분 환불하는 방법이 있습니다. 후자는 정산 시 수수료가 차감되어 파트너님 손실이 생길 수 있습니다.\n\n[본상품만 취소하고 추가옵션은 유지하시려는 경우]\n본상품과 추가옵션을 함께 주문한 경우 본상품만 부분 취소·환불할 수 없고, 추가옵션도 함께 전체 취소해야 합니다.\n추가옵션 상품을 본품으로도 따로 판매 중이시라면, 고객님이 해당 상품 페이지에서 추가옵션 상품을 다시 결제한 뒤 기존 주문을 전체 취소하는 방식으로 처리해 주세요. 따로 판매하지 않으신다면 번거로우시겠지만 고객님과 협의해 별도로 환불해 주셔야 합니다.\n\n[고객님이 이미 일부 옵션의 취소를 요청하신 경우]\n오로라 > 취소/반품/교환 > 취소관리에서 취소번호 안의 주문옵션번호별로 [취소승인(환불)]을 부분 처리하실 수 있습니다. 같은 취소번호 안에 본상품과 추가옵션이 함께 있으면 본상품만 승인할 수는 없고 둘 다 처리해야 합니다. 승인하지 않으면 취소요청일로부터 7영업일째 자동 승인됩니다.\n\n(재결제 안내 연락 요청에 체크한 경우 맺음  템플릿)\n4) 오늘의집 귀책 일괄 취소(쿠폰 오발행 등) 문의는 이슈별 공지(028)만 있고 상시 응대 기준 없음"}}, {"code": "PA002005", "draft": true, "name": "품절·재고부족 취소", "mid": "주문/취소", "vol": "2,271", "mode": "정보 수집 후 상담원 연결", "utter": "재고가 없어서 주문 취소 부탁드려요\n이 상품 단종됐는데 들어온 주문 3건 취소해 주세요\n입고가 계속 늦어져서 고객 주문 취소 처리하고 싶어요", "raw": "1. 네, 파트너님. 품절로 인한 주문 취소를 도와드리겠습니다. 취소하실 주문은 모두 몇 건인가요?\n[건수 입력]\n(주문번호 30건 이상이면 → 유형 PA002004로 전환, 대량취소 시나리오 1번으로)\n2. 취소 사유를 선택해 주세요.\n[품절] / [재고부족] / [단종] / [입고지연] / [그 외 사유]\n([그 외 사유] → 가격·쿠폰 오등록, 리콜이면 유형 PA002004 / 고객 변심·오주문 등이면 유형 PA002006으로 전환)\n3. 취소하실 주문의 주문번호와 주문옵션번호를 알려주세요. 여러 건이면 한 번에 모두 적어 주세요.\n[주문번호·주문옵션번호 입력]\n(입력된 주문번호가 30건 이상이면 → 유형 PA002004로 전환)\n(한 주문의 일부 옵션만 입력됐거나 파트너가 수량 일부 취소를 말하면 → 유형 PA002003으로 전환)\n3-0. 해당 주문의 현재 상태를 선택해 주세요. 여러 주문의 상태가 다르면 상태별로 나눠 알려 주세요.\n[고객님이 이미 취소를 요청했어요] → 4-2\n[결제완료·배송준비중] → 4-3\n[배송중·배송완료] → 4-4\n[구매확정] → 유형 PA002009로 전환\n[이미 취소완료됐어요] → 4-5\n[오늘의집 글로벌(일본·미국) 주문이에요] → 4-1\n[잘 모르겠어요] → 3-1\n(여러 주문의 상태가 섞여 있으면 상태별로 나눠 안내하고, 접수 대상은 4-3으로 모아 진행)\n3-1. 고객님이 취소를 요청한 주문은 오로라 > 취소/반품/교환 > 취소관리에서 취소상태를 '취소요청'으로, 이미 취소된 주문은 '취소완료'로 검색하시면 확인하실 수 있습니다. 확인이 어려우시면 그대로 접수를 진행하고 상담원이 주문 상태를 확인하겠습니다.\n[취소요청 건이었어요] → 4-2\n[이미 취소완료됐어요] → 4-5\n[그대로 접수할게요] → 4-3 (인계 정보에 '주문 상태 미확인'으로 표시)\n\n4-1. 파트너님, 해당 주문은 오늘의집 글로벌(일본·미국) 주문입니다. 글로벌 주문의 취소는 global_op@partnerbucketplace.com 으로 문의해 주시면 확인 도와드립니다.\n[알겠어요] → 상담 종료 (유형: PA002005)\n[국내 주문도 있어요] → 3\n\n4-2. 파트너님, 고객님이 이미 취소를 요청하신 건은 파트너님이 바로 승인하실 수 있습니다.\n오로라 > 취소/반품/교환 > 취소관리에서 취소상태를 '취소요청'으로 검색한 뒤, 해당 주문을 선택하고 [취소승인(환불)]을 눌러 주세요. 별도 팝업 없이 바로 승인되며, 고객님께 취소완료 알림톡이 발송됩니다. 승인 후에는 되돌릴 수 없으니 대상과 금액을 한 번 더 확인해 주세요.\n승인하지 않으시면 취소요청일로부터 7영업일째 자동으로 취소승인됩니다. (주문제작 상품은 21영업일째)\n5. 직접 처리해 보시겠어요?\n[네, 직접 할게요] → 상담 종료 (유형: PA002005)\n[승인이 안 돼요] → 5-1\n5-1. 불편을 드려 죄송합니다. 승인이 되지 않는 주문번호와 화면에 나온 문구를 알려주시면 상담원이 확인해 드리겠습니다.\n[오류 내용 입력] → 상담원 인계 (T3-B)\n\n4-3. 확인 감사합니다. 접수 전에 고객님 안내 여부를 확인하겠습니다. 고객님께 품절로 인한 취소를 먼저 안내하셨나요?\n[네, 안내했어요] → 6\n[아니요] → 4-3-1\n4-3-1. 파트너님, 품절로 인한 취소는 고객님께 먼저 상황을 안내해 주신 뒤 다시 요청해 주시면 바로 접수 도와드리겠습니다.\n[알겠어요] → 상담 종료 (유형: PA002005) / [직접 안내하기 어려워요] → 4-3-2\n4-3-2. 알겠습니다. 상담원이 고객님께 취소 안내 문자를 보낸 뒤 접수를 진행하겠습니다. → 7\n6. 어떤 방법으로 안내하셨나요?\n[전화] / [문자] / [주문문의 답변] / [기타]\n6-1. 고객님 반응은 어떠셨나요?\n[취소에 동의하셨어요] → 7\n[연락이 닿지 않았어요] → 7 (인계 정보에 '고객 부재'로 표시)\n[취소를 원하지 않으세요] → 6-2\n6-2. 고객님이 취소에 동의하지 않으신 경우에는 상담원이 상황을 확인한 뒤 진행 방법을 안내드리겠습니다. 고객님이 말씀하신 내용과 파트너님 입장을 간단히 적어 주세요.\n[내용 입력] → 상담원 인계 (T3-C)\n\n7. 패키지할인이 적용된 주문이라면 파트너 귀책으로 취소 접수됩니다. 무통장입금 주문은 환불 계좌 확인을 위해 오늘의집에서 고객님께 연락드리는 과정이 있어 처리에 시간이 조금 더 걸릴 수 있습니다.\n접수 내용을 확인해 주세요.\n- 주문번호 / 주문옵션번호: ○○ (총 ○건)\n- 취소 사유: ○○\n- 귀책: 판매자 귀책\n- 고객 안내: ○○ (안내 수단 ○○)\n상품 출고 전 취소라 반품비 등 별도 비용은 발생하지 않습니다. 이대로 접수할까요?\n[네] → 8 / [수정할게요] → 3\n8. 상담원에게 연결해 취소 접수를 진행하겠습니다. 잠시만 기다려 주세요.\n접수가 끝나면 추가 주문이 들어오지 않도록 오로라 > 상품관리 > 옵션재고 관리에서 해당 옵션의 재고를 확인해 주세요.\n→ 상담원 인계 (T3-A)\n\n4-4. 파트너님, 배송중 단계부터는 취소가 아닌 반품으로 처리됩니다. 상품이 실제로 출고되었나요?\n[출고 안 됐어요(송장만 먼저 등록)] → 4-4-1\n[출고됐어요] → 유형 PA002007(반품 대리접수)로 전환\n4-4-1. 이미 배송중·배송완료로 바뀐 주문을 취소하려면 고객님 동의 확인이 필요합니다. 고객님께 취소를 안내하고 동의를 받으셨나요?\n[네, 동의 받았어요] → 6 (안내 수단 확인 후 7 → T3-A)\n[아니요] → 4-4-2\n4-4-2. 고객님께 취소를 안내하고 동의를 받으신 뒤 다시 문의해 주시면 접수 도와드리겠습니다. → 상담 종료 (유형: PA002005)\n\n4-5. 파트너님, 이미 취소가 완료된 주문은 오로라 > 취소/반품/교환 > 취소관리에서 취소상태를 '취소완료'로 검색하시면 확인하실 수 있습니다.\n[다른 주문도 있어요] → 3\n[아니요] → 상담 종료 (유형: PA002005)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 품절로 인한 주문 취소를<br/>도와드리겠습니다. 취소하실 주문은 모두 몇<br/>건인가요?\"]:::bot\nN2[\"<b>2<\/b> 취소 사유를 선택해 주세요.\"]:::bot\nN3[\"<b>3<\/b> 취소하실 주문의 주문번호와 주문옵션번호를<br/>알려주세요. 여러 건이면 한 번에 모두 적어<br/>주세요.\"]:::bot\nN3_0[\"<b>3-0<\/b> 해당 주문의 현재 상태를 선택해 주세요.<br/>여러 주문의 상태가 다르면 상태별로 나눠<br/>알려 주세요.\"]:::bot\nN3_1[\"<b>3-1<\/b> 고객님이 취소를 요청한 주문은 오로라 ›<br/>취소/반품/교환 › 취소관리에서 취소상태를<br/>'취소요청'으로, 이미 취소된 주문은<br/>'취소완료'로 검색하시면 확인하실 수<br/>있습니다. 확인이 어려우시면 그대로 접수를<br/>진행하고 상담원이 주문 상태를<br/>확인하겠습니다.\"]:::bot\nN4_1[\"<b>4-1<\/b> 파트너님, 해당 주문은 오늘의집<br/>글로벌(일본·미국) 주문입니다. 글로벌<br/>주문의 취소는<br/>global_op@partnerbucketplace.com<br/>으로 문의해 주시면 확인 도와드립니다.\"]:::bot\nN4_2[\"<b>4-2<\/b> 파트너님, 고객님이 이미 취소를 요청하신<br/>건은 파트너님이 바로 승인하실 수 있습니다.\"]:::bot\nN5[\"<b>5<\/b> 직접 처리해 보시겠어요?\"]:::bot\nN5_1[\"<b>5-1<\/b> 불편을 드려 죄송합니다. 승인이 되지 않는<br/>주문번호와 화면에 나온 문구를 알려주시면<br/>상담원이 확인해 드리겠습니다.\"]:::bot\nN4_3[\"<b>4-3<\/b> 확인 감사합니다. 접수 전에 고객님 안내<br/>여부를 확인하겠습니다. 고객님께 품절로 인한<br/>취소를 먼저 안내하셨나요?\"]:::bot\nN4_3_1[\"<b>4-3-1<\/b> 파트너님, 품절로 인한 취소는 고객님께 먼저<br/>상황을 안내해 주신 뒤 다시 요청해 주시면<br/>바로 접수 도와드리겠습니다.\"]:::bot\nN4_3_2[\"<b>4-3-2<\/b> 알겠습니다. 상담원이 고객님께 취소 안내<br/>문자를 보낸 뒤 접수를 진행하겠습니다.\"]:::bot\nN6[\"<b>6<\/b> 어떤 방법으로 안내하셨나요?\"]:::bot\nN6_1[\"<b>6-1<\/b> 고객님 반응은 어떠셨나요?\"]:::bot\nN6_2[\"<b>6-2<\/b> 고객님이 취소에 동의하지 않으신 경우에는<br/>상담원이 상황을 확인한 뒤 진행 방법을<br/>안내드리겠습니다. 고객님이 말씀하신 내용과<br/>파트너님 입장을 간단히 적어 주세요.\"]:::bot\nN7[\"<b>7<\/b> 패키지할인이 적용된 주문이라면 파트너<br/>귀책으로 취소 접수됩니다. 무통장입금 주문은<br/>환불 계좌 확인을 위해 오늘의집에서 고객님께<br/>연락드리는 과정이 있어 처리에 시간이 조금<br/>더 걸릴 수 있습니다.\"]:::bot\nN8[\"<b>8<\/b> 상담원에게 연결해 취소 접수를<br/>진행하겠습니다. 잠시만 기다려 주세요.\"]:::bot\nN4_4[\"<b>4-4<\/b> 파트너님, 배송중 단계부터는 취소가 아닌<br/>반품으로 처리됩니다. 상품이 실제로<br/>출고되었나요?\"]:::bot\nN4_4_1[\"<b>4-4-1<\/b> 이미 배송중·배송완료로 바뀐 주문을<br/>취소하려면 고객님 동의 확인이 필요합니다.<br/>고객님께 취소를 안내하고 동의를 받으셨나요?\"]:::bot\nN4_4_2[\"<b>4-4-2<\/b> 고객님께 취소를 안내하고 동의를 받으신 뒤<br/>다시 문의해 주시면 접수 도와드리겠습니다.\"]:::bot\nN4_5[\"<b>4-5<\/b> 파트너님, 이미 취소가 완료된 주문은 오로라<br/>› 취소/반품/교환 › 취소관리에서<br/>취소상태를 '취소완료'로 검색하시면 확인하실<br/>수 있습니다.\"]:::bot\nS --> N1\nN1 -->|\"주문번호 30건 이상이면\"| SW_PA002004\nN1 -->|\"건수 입력\"| N2\nN2 -->|\"그 외 사유\"| SW_PA002004\nN2 -->|\"품절 / 재고부족 / 단종 / 입고지연 /<br/>그 외 사유\"| N3\nN3 -->|\"입력된 주문번호가 30건 이상이면\"| SW_PA002004\nN3 -->|\"한 주문의 일부 옵션만 입력됐거나 파트너가<br/>수량 일부 취소를 말하면\"| SW_PA002003\nN3_0 -->|\"고객님이 이미 취소를 요청했어요\"| N4_2\nN3_0 -->|\"결제완료·배송준비중\"| N4_3\nN3_0 -->|\"배송중·배송완료\"| N4_4\nN3_0 -->|\"구매확정\"| SW_PA002009\nN3_0 -->|\"이미 취소완료됐어요\"| N4_5\nN3_0 -->|\"오늘의집 글로벌(일본·미국) 주문이에요\"| N4_1\nN3_0 -->|\"잘 모르겠어요\"| N3_1\nN3_1 -->|\"취소요청 건이었어요\"| N4_2\nN3_1 -->|\"이미 취소완료됐어요\"| N4_5\nN3_1 -->|\"그대로 접수할게요\"| N4_3\nN3 -->|\"주문번호·주문옵션번호 입력\"| N4_1\nN4_1 -->|\"알겠어요\"| END\nN4_1 -->|\"국내 주문도 있어요\"| N3\nN5 -->|\"네, 직접 할게요\"| END\nN5 -->|\"승인이 안 돼요\"| N5_1\nN5_1 -->|\"오류 내용 입력\"| HO_T3B\nN4_3 -->|\"네, 안내했어요\"| N6\nN4_3 -->|\"아니요\"| N4_3_1\nN4_3_1 -->|\"알겠어요\"| END\nN4_3_1 -->|\"직접 안내하기 어려워요\"| N4_3_2\nN4_3_2 --> N7\nN6_1 -->|\"취소에 동의하셨어요\"| N7\nN6_1 -->|\"연락이 닿지 않았어요\"| N7\nN6_1 -->|\"취소를 원하지 않으세요\"| N6_2\nN6_2 -->|\"내용 입력\"| HO_T3C\nN6 -->|\"전화 / 문자 / 주문문의 답변 / 기타\"| N7\nN7 -->|\"네\"| N8\nN7 -->|\"수정할게요\"| N3\nN8 --> HO_T3A\nN4_4 -->|\"출고 안 됐어요(송장만 먼저 등록)\"| N4_4_1\nN4_4 -->|\"출고됐어요\"| SW_PA002007\nN4_4_1 -->|\"네, 동의 받았어요\"| N6\nN4_4_1 -->|\"아니요\"| N4_4_2\nN4_4_2 --> END\nN4_5 -->|\"다른 주문도 있어요\"| N3\nN4_5 -->|\"아니요\"| END\nN4_2 --> N5\nN3 -.-> N3_0\nN6 -.-> N6_1\nSW_PA002004[/\"「대량취소 처리」로 전환\"/]:::sw\nSW_PA002003[/\"「부분취소 처리」로 전환\"/]:::sw\nSW_PA002009[/\"「구매확정 후 취소·환불」로 전환\"/]:::sw\nEND([\"상담 종료\"]):::fin\nHO_T3B([\"상담원 인계<br/>셀프 처리 실패\"]):::ho\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nHO_T3A([\"상담원 인계<br/>실행 요청\"]):::ho\nSW_PA002007[/\"「반품 대리접수」로 전환\"/]:::sw", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 품절로 인한 주문 취소를 도와드리겠습니다. 취소하실 주문은 모두 몇 건인가요?", "sec": false, "body": []}, {"k": "2", "id": "2", "t": "취소 사유를 선택해 주세요.", "sec": false, "body": []}, {"k": "3", "id": "3", "t": "취소하실 주문의 주문번호와 주문옵션번호를 알려주세요. 여러 건이면 한 번에 모두 적어 주세요.", "sec": false, "body": []}, {"k": "3-0", "id": "3-0", "t": "해당 주문의 현재 상태를 선택해 주세요. 여러 주문의 상태가 다르면 상태별로 나눠 알려 주세요.", "sec": false, "body": ["(여러 주문의 상태가 섞여 있으면 상태별로 나눠 안내하고, 접수 대상은 4-3으로 모아 진행)"]}, {"k": "3-1", "id": "3-1", "t": "고객님이 취소를 요청한 주문은 오로라 > 취소/반품/교환 > 취소관리에서 취소상태를 '취소요청'으로, 이미 취소된 주문은 '취소완료'로 검색하시면 확인하실 수 있습니다. 확인이 어려우시면 그대로 접수를 진행하고 상담원이 주문 상태를 확인하겠습니다.", "sec": false, "body": []}, {"k": "4-1", "id": "4-1", "t": "파트너님, 해당 주문은 오늘의집 글로벌(일본·미국) 주문입니다. 글로벌 주문의 취소는 global_op@partnerbucketplace.com 으로 문의해 주시면 확인 도와드립니다.", "sec": false, "body": []}, {"k": "4-2", "id": "4-2", "t": "파트너님, 고객님이 이미 취소를 요청하신 건은 파트너님이 바로 승인하실 수 있습니다.", "sec": false, "body": ["오로라 > 취소/반품/교환 > 취소관리에서 취소상태를 '취소요청'으로 검색한 뒤, 해당 주문을 선택하고 [취소승인(환불)]을 눌러 주세요. 별도 팝업 없이 바로 승인되며, 고객님께 취소완료 알림톡이 발송됩니다. 승인 후에는 되돌릴 수 없으니 대상과 금액을 한 번 더 확인해 주세요.", "승인하지 않으시면 취소요청일로부터 7영업일째 자동으로 취소승인됩니다. (주문제작 상품은 21영업일째)"]}, {"k": "5", "id": "5", "t": "직접 처리해 보시겠어요?", "sec": false, "body": []}, {"k": "5-1", "id": "5-1", "t": "불편을 드려 죄송합니다. 승인이 되지 않는 주문번호와 화면에 나온 문구를 알려주시면 상담원이 확인해 드리겠습니다.", "sec": false, "body": []}, {"k": "4-3", "id": "4-3", "t": "확인 감사합니다. 접수 전에 고객님 안내 여부를 확인하겠습니다. 고객님께 품절로 인한 취소를 먼저 안내하셨나요?", "sec": false, "body": []}, {"k": "4-3-1", "id": "4-3-1", "t": "파트너님, 품절로 인한 취소는 고객님께 먼저 상황을 안내해 주신 뒤 다시 요청해 주시면 바로 접수 도와드리겠습니다.", "sec": false, "body": []}, {"k": "4-3-2", "id": "4-3-2", "t": "알겠습니다. 상담원이 고객님께 취소 안내 문자를 보낸 뒤 접수를 진행하겠습니다. → 7", "sec": false, "body": []}, {"k": "6", "id": "6", "t": "어떤 방법으로 안내하셨나요?", "sec": false, "body": []}, {"k": "6-1", "id": "6-1", "t": "고객님 반응은 어떠셨나요?", "sec": false, "body": []}, {"k": "6-2", "id": "6-2", "t": "고객님이 취소에 동의하지 않으신 경우에는 상담원이 상황을 확인한 뒤 진행 방법을 안내드리겠습니다. 고객님이 말씀하신 내용과 파트너님 입장을 간단히 적어 주세요.", "sec": false, "body": []}, {"k": "7", "id": "7", "t": "패키지할인이 적용된 주문이라면 파트너 귀책으로 취소 접수됩니다. 무통장입금 주문은 환불 계좌 확인을 위해 오늘의집에서 고객님께 연락드리는 과정이 있어 처리에 시간이 조금 더 걸릴 수 있습니다.", "sec": false, "body": ["접수 내용을 확인해 주세요.", "- 주문번호 / 주문옵션번호: ○○ (총 ○건)", "- 취소 사유: ○○", "- 귀책: 판매자 귀책", "- 고객 안내: ○○ (안내 수단 ○○)", "상품 출고 전 취소라 반품비 등 별도 비용은 발생하지 않습니다. 이대로 접수할까요?"]}, {"k": "8", "id": "8", "t": "상담원에게 연결해 취소 접수를 진행하겠습니다. 잠시만 기다려 주세요.", "sec": false, "body": ["접수가 끝나면 추가 주문이 들어오지 않도록 오로라 > 상품관리 > 옵션재고 관리에서 해당 옵션의 재고를 확인해 주세요."]}, {"k": "4-4", "id": "4-4", "t": "파트너님, 배송중 단계부터는 취소가 아닌 반품으로 처리됩니다. 상품이 실제로 출고되었나요?", "sec": false, "body": []}, {"k": "4-4-1", "id": "4-4-1", "t": "이미 배송중·배송완료로 바뀐 주문을 취소하려면 고객님 동의 확인이 필요합니다. 고객님께 취소를 안내하고 동의를 받으셨나요?", "sec": false, "body": []}, {"k": "4-4-2", "id": "4-4-2", "t": "고객님께 취소를 안내하고 동의를 받으신 뒤 다시 문의해 주시면 접수 도와드리겠습니다. → 상담 종료 (유형: PA002005)", "sec": false, "body": []}, {"k": "4-5", "id": "4-5", "t": "파트너님, 이미 취소가 완료된 주문은 오로라 > 취소/반품/교환 > 취소관리에서 취소상태를 '취소완료'로 검색하시면 확인하실 수 있습니다.", "sec": false, "body": []}], "hocond": "출고 전 취소 접수(Write) T3-A / 고객이 취소에 동의하지 않음(분쟁) T3-C / 고객 취소요청 건 승인 오류 T3-B / 대량 기준 이상·오등록·리콜은 PA002004 전환 후 T3-C / 일부 옵션·수량은 PA002003 전환 / 공통: 상담원 직접 요청 T1 / 같은 질문 반복·미해결 T2 / 감정·민원 T4 / 복수 용건 T7 / 운영시간 종료 직전 인계 T8", "hoinfo": "주문번호·주문옵션번호 목록과 총 건수, 취소 사유(품절/재고부족/단종/입고지연), 파트너가 선택한 주문 상태(모르면 '주문 상태 미확인'), 배송중·배송완료 건의 실제 출고 여부, 고객 선행 안내 여부·안내 수단·고객 반응(동의/부재/미동의), 승인 오류 시 오류 문구. 패키지할인 여부·결제수단(무통장입금 여부)·글로벌 주문 여부는 상담원이 확인", "kms": "063_취소.md, 066_대량취소_프로세스.md, 088_프로세스_기준_정리_.md, 080_파트너센터_교육자료__클레임.md, 086_상담_양식___첨부_파일__.md, 052_반품.md, 050_상품_검수.md, 093_고객센터_협업_유형_및_이관_방법.md", "check": "1) 대량 기준: 066·093은 30건(066은 '현재 30건' 명시), 063·052·092·086은 '50만원 이상 또는 50건 이상': 금액 기준 포함 정리 필요. 2) 고객 선행 안내: Zendesk 실무는 '미안내면 1차 안내 후 재요청'이나 KMS에는 그런 기준이 없고, 088 OB표는 품절을 'OB 없이 문자 발송'으로 처리: A/B안 결정 필요. 3) 재고부족·입고지연의 귀책 분류 KMS 명시 없음(088은 품절·단종·배송지연만 판매자 귀책). 4) 송장만 먼저 등록된 배송중 건 취소는 088 '배송중·배송완료 주문건 클레임 접수 시 고객 동의 확인' 절차를 준용해 작성: 맞는지 확인 필요. 5) 무통장입금 환불계좌 확인 절차는 052 반품 접수 경로에만 있어 취소에도 적용되는지 확인 필요. 6) 상담원 인계 후 접수 완료까지 걸리는 시간 안내 문구 없음. 7) T8 기준 시각 미정(088의 종료 전 30분 추가문의 미접수 기준을 이관 후 17:30~18:00으로 준용할지). 8) (1차 전환) 주문 상태를 파트너 선택으로 받고, 모르면 셀프 확인 경로(취소관리 '취소요청'·'취소완료' 검색) 안내 후 '상태 미확인'으로 접수하게 함. 출고 전 여부를 상담원이 재확인하는 운영으로 충분한지 확인 필요. 9) (1차 전환) 패키지할인·무통장입금 안내는 해당 여부를 알 수 없어 '해당되는 경우' 문구로 항상 노출함. 접수 확인 단계가 길어져도 되는지 확인 필요.", "api": "R-02, R-04, W-01", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 주문번호와 주문옵션번호: \n· 총 건수: \n· 취소 사유 (품절 / 재고부족 / 단종 / 입고지연): \n· 현재 주문 상태 (결제완료·배송준비중 / 송장만 먼저 등록해 배송중(실제 미출고) / 고객님이 이미 취소를 요청함 / 잘 모름): \n· 고객 안내 여부 (안내했고 동의받음 / 안내했으나 연락 안 됨 / 안내했으나 취소 원하지 않음 / 아직 안내 전): \n· (안내한 경우) 안내 수단 (전화 / 문자 / 주문문의 답변 / 기타): \n· (해당 시: 취소 원하지 않음) 고객님 의견과 파트너님 입장: \n\n문의 내용: ", "mode": "조건별: 고객이 이미 취소 요청한 주문만 있으면 자동답변 종결(직접 승인 안내) / 일본·미국 주문은 자동답변 종결(global_op 안내) / 그 외 취소 접수는 상담원 배정", "segs": [{"c": ["A"], "t": "고객이 이미 취소 요청한 주문만 있으면 자동답변 종결(직접 승인 안내)"}, {"c": ["A"], "t": "일본·미국 주문은 자동답변 종결(global_op 안내)"}, {"c": ["C"], "t": "그 외 취소 접수는 상담원 배정"}], "auto": "(공통 첫인사)\n\n[고객님이 이미 취소를 요청하신 주문인 경우]\n고객님이 이미 취소를 요청하신 주문은 파트너님이 바로 승인하실 수 있습니다.\n오로라 > 취소/반품/교환 > 취소관리에서 취소상태를 '취소요청'으로 검색한 뒤 해당 주문을 선택하고 [취소승인(환불)]을 눌러 주세요. 별도 팝업 없이 바로 승인되며 고객님께 취소완료 알림톡이 발송됩니다. 승인 후에는 되돌릴 수 없으니 대상과 금액을 한 번 더 확인해 주세요.\n승인하지 않으시면 취소요청일로부터 7영업일째 자동으로 취소승인됩니다. (주문제작 상품은 21영업일째)\n승인이 되지 않으면 주문번호와 화면에 나온 문구를 적어 새 문의로 남겨 주세요.\n추가 주문이 들어오지 않도록 오로라 > 상품관리 > 옵션재고 관리에서 해당 옵션의 재고 상태도 확인해 주세요.\n\n[오늘의집 글로벌(일본·미국) 주문인 경우]\n오늘의집 글로벌(일본·미국) 주문의 취소는 global_op@partnerbucketplace.com 으로 문의해 주시면 확인 도와드립니다.\n(맺음 A)", "ack": "남겨 주신 주문 정보와 고객님 안내 내용을 확인한 뒤 취소 접수를 진행하겠습니다. 상품 출고 전 취소라 반품비 등 별도 비용은 발생하지 않으며, 접수되면 고객님께 취소 안내 문자가 발송됩니다. 그동안 추가 주문이 들어오지 않도록 오로라 > 상품관리 > 옵션재고 관리에서 해당 옵션의 재고 상태를 확인해 주세요.\n(고객이 취소를 원하지 않는 경우 이 문장으로 교체: \"고객님이 취소를 원하지 않으시는 상황으로 확인되어, 담당 상담원이 상황을 확인한 뒤 진행 방법을 안내드리겠습니다.\")", "info": "주문번호·주문옵션번호 목록과 총 건수, 취소 사유, 파트너가 고른 주문 상태, 고객 안내 여부·수단·고객 반응(동의/부재/미동의), 미동의면 고객 의견·파트너 입장, 송장만 등록된 배송중 건 여부", "kms": "063_취소.md, 066_대량취소_프로세스.md, 088_프로세스_기준_정리_.md, 080_파트너센터_교육자료__클레임.md, 086_상담_양식___첨부_파일__.md, 052_반품.md, 093_고객센터_협업_유형_및_이관_방법.md", "check": "1) 고객 '아직 안내 전' 처리 → 10/21 센터 회신(#39): 기본은 (A) 파트너가 고객에게 먼저 안내 후 재문의, 파트너 미수긍·지원 요청 시 (B) 상담원이 고객에게 문자 안내 후 접수. KMS에는 A안 근거가 없고 088 OB표는 품절을 'OB 없이 문자 발송'으로 처리\n2) 대량 기준 30건 vs 50건·50만원 — PA002004로 돌리는 기준값\n3) 재고부족·입고지연의 귀책 분류 KMS 명시 없음 (088은 품절·단종·배송지연만 판매자 귀책)\n4) 송장만 먼저 등록된 배송중 건 취소는 088 '배송중·배송완료 주문 클레임 접수 시 고객 동의 확인' 절차를 준용 — 맞는지 확인\n5) 7~9월 게시판 접수 추정 약 1,700건(품절·재고부족 취소 코드 기준)으로 게시판 최대 유형. 1차는 대부분 상담원 배정이라 자동 처리율이 낮음 — Write 우선순위 판단 근거"}}, {"code": "PA002006", "draft": true, "name": "기타 사유 취소", "mid": "주문/취소", "vol": "559", "mode": "안내 후 조건부 상담원 연결", "utter": "고객이 단순변심으로 취소 원한다고 연락 왔어요\n고객이 주문을 잘못 넣었다고 취소해 달래요\n리셀러 같은 주문이 들어와서 취소하고 싶어요", "raw": "1. 네, 파트너님. 주문 취소를 도와드리겠습니다. 취소 사유를 선택해 주세요.\n[고객 단순변심] / [고객 오주문] / [주문제작 상품 오주문] / [리셀러 의심 주문] / [가격·쿠폰 오등록] / [배송불가 지역] / [고객 연락두절] / [기타]\n([가격·쿠폰 오등록] → 유형 PA002004로 전환 / 품절·재고부족이면 → 유형 PA002005로 전환)\n2. 취소하실 주문의 주문번호와 주문옵션번호, 그리고 건수를 알려주세요.\n[주문번호·주문옵션번호 입력]\n(주문번호 30건 이상이면 → 유형 PA002004로 전환 / 일부 옵션·수량만이면 → 유형 PA002003으로 전환)\n(사유가 리셀러 의심 → 3-4 / 주문제작 상품 오주문 → 3-5 / 고객 연락두절 → 3-6)\n(그 외 사유 → 2-1)\n2-1. 해당 주문의 현재 상태를 선택해 주세요.\n[고객님이 이미 취소를 요청했어요] → 3-1\n[입금대기·결제완료] → 3-2\n[배송준비중] → 3-3\n[배송중·배송완료] → 유형 PA002007로 전환\n[구매확정] → 유형 PA002009로 전환\n[오늘의집 글로벌(일본·미국) 주문이에요] → '오늘의집 글로벌(일본·미국) 주문은 global_op@partnerbucketplace.com 으로 문의해 주세요.' 안내 → 상담 종료 (유형: PA002006)\n[잘 모르겠어요] → 2-2\n2-2. 고객님이 취소를 요청한 주문은 오로라 > 취소/반품/교환 > 취소관리에서 취소상태를 '취소요청'으로 검색하시면 확인하실 수 있습니다. 확인이 어려우시면 고객님 동의 여부를 확인한 뒤 상담원이 주문 상태를 확인해 접수하겠습니다.\n[취소요청 건이었어요] → 3-1\n[그대로 진행할게요] → 4 (인계 정보에 '주문 상태 미확인'으로 표시)\n\n3-1. 파트너님, 고객님이 이미 취소를 요청하신 건은 오로라 > 취소/반품/교환 > 취소관리에서 해당 주문을 선택하고 [취소승인(환불)]을 누르시면 처리됩니다. 승인하지 않으면 취소요청일로부터 7영업일째 자동 취소승인됩니다. (주문제작 상품은 21영업일째)\n[직접 처리할게요] → 상담 종료 (유형: PA002006)\n[승인이 안 돼요] → 오류 문구 입력 → 상담원 인계 (T3-B)\n\n3-2. 파트너님, 입금대기·결제완료 상태의 주문은 고객님이 직접 취소하실 수 있습니다. 취소 접수는 고객님이 진행하는 항목이라, 고객님께 아래 경로로 취소하시도록 안내 부탁드립니다.\n- 경로: 오늘의집 > 나의 쇼핑 > 주문번호 상세보기 > 주문취소\n고객님이 직접 취소하기 어려운 사정이 있으시면 말씀해 주세요.\n[안내할게요] → 상담 종료 (유형: PA002006)\n[고객이 직접 못 한대요] → 4\n\n3-3. 파트너님, 배송준비중 상태의 주문은 고객님이 직접 취소하실 수 없어 접수가 필요합니다. → 4\n\n4. 고객님과 취소에 대해 협의하고 동의를 받으셨나요?\n[네, 동의 받았어요] → 5\n[아니요] → 4-1\n4-1. 고객님 사유의 취소는 고객님 동의 확인이 필요합니다. 고객님께 안내하고 동의를 받으신 뒤 다시 문의해 주시면 접수 도와드리겠습니다. → 상담 종료 (유형: PA002006)\n5. 패키지할인이 적용된 주문은 파트너 귀책으로 접수됩니다. 구매자 귀책으로 접수하면 주문 상품 전체의 패키지할인이 취소됩니다.\n상품 출고 전 취소는 귀책과 관계없이 반품비 등 별도 비용이 발생하지 않습니다. 다만 일부 상품만 취소해 무료배송 조건이 깨지면 귀책 대상이 배송비를 부담합니다.\n접수 내용을 확인해 주세요.\n- 주문번호 / 주문옵션번호: ○○\n- 취소 사유: ○○ (귀책: ○○)\n- 고객 동의: 확인\n이대로 접수할까요?\n[네] → 6 / [수정할게요] → 2\n6. 상담원에게 연결해 취소 접수를 진행하겠습니다. 잠시만 기다려 주세요. → 상담원 인계 (T3-A)\n\n3-4. [리셀러 의심 주문]\n파트너님, 리셀러 의심 주문은 담당 부서 확인이 필요합니다. 리셀러로 의심하시는 사유를 알려주세요. (예: 같은 배송지로 반복 대량 주문 등)\n[의심 사유 입력]\n→ 상담원 인계 (T3-C)\n\n3-5. [주문제작 상품 오주문]\n파트너님, 주문제작 상품을 고객님이 상담 없이 잘못 주문하신 경우에는 고객님께 취소 후 재주문이 필요하다는 안내가 필요합니다. 고객님께 이미 안내하셨나요?\n[네, 고객이 수긍했어요] → 4 (동의 확인 후 T3-A)\n[아직 안내 전이에요] → 3-5-1\n[고객이 수긍하지 않아요] → 3-5-2\n3-5-1. 오늘의집에서 고객님께 연락해 상황을 설명하고 취소·재주문을 안내해 드릴 수 있습니다. 주문번호와 잘못 주문된 내용(사이즈·수량·금액 등)을 알려주세요. [입력] → 상담원 인계 (T3-B)\n3-5-2. 고객님이 수긍하지 않으시는 사유와 파트너님 입장을 알려주시면 상담원이 확인해 드리겠습니다. [입력] → 상담원 인계 (T3-C)\n\n3-6. [고객 연락두절]\n파트너님, 고객님과 연락이 닿지 않아 취소가 필요한 경우에는 오늘의집에서 고객님께 연락을 시도한 뒤 처리 방법을 안내드립니다. 연락을 시도하신 일시와 횟수, 취소가 필요한 사유를 알려주세요.\n[입력] → 상담원 인계 (T3-C)\n\n(파트너가 취소 진행 중 '취소 요청이 제한된 주문이에요. 오늘의집 고객센터로 문의해 주세요' 문구를 봤다고 하면 → 7)\n7. 확인이 필요한 주문입니다. 주문번호, 주문옵션번호, 취소 사유를 알려주시면 담당 부서 확인 후 안내드리겠습니다. 확인에 시간이 걸릴 수 있는 점 양해 부탁드립니다. [입력] → 상담원 인계 (T3-C)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 주문 취소를<br/>도와드리겠습니다. 취소 사유를 선택해<br/>주세요.\"]:::bot\nN2[\"<b>2<\/b> 취소하실 주문의 주문번호와 주문옵션번호,<br/>그리고 건수를 알려주세요.\"]:::bot\nN2_1[\"<b>2-1<\/b> 해당 주문의 현재 상태를 선택해 주세요.\"]:::bot\nN2_2[\"<b>2-2<\/b> 고객님이 취소를 요청한 주문은 오로라 ›<br/>취소/반품/교환 › 취소관리에서 취소상태를<br/>'취소요청'으로 검색하시면 확인하실 수<br/>있습니다. 확인이 어려우시면 고객님 동의<br/>여부를 확인한 뒤 상담원이 주문 상태를<br/>확인해 접수하겠습니다.\"]:::bot\nN3_1[\"<b>3-1<\/b> 파트너님, 고객님이 이미 취소를 요청하신<br/>건은 오로라 › 취소/반품/교환 ›<br/>취소관리에서 해당 주문을 선택하고\"]:::bot\nN3_2[\"<b>3-2<\/b> 파트너님, 입금대기·결제완료 상태의 주문은<br/>고객님이 직접 취소하실 수 있습니다. 취소<br/>접수는 고객님이 진행하는 항목이라, 고객님께<br/>아래 경로로 취소하시도록 안내 부탁드립니다.\"]:::bot\nN3_3[\"<b>3-3<\/b> 파트너님, 배송준비중 상태의 주문은 고객님이<br/>직접 취소하실 수 없어 접수가 필요합니다.\"]:::bot\nN4[\"<b>4<\/b> 고객님과 취소에 대해 협의하고 동의를<br/>받으셨나요?\"]:::bot\nN4_1[\"<b>4-1<\/b> 고객님 사유의 취소는 고객님 동의 확인이<br/>필요합니다. 고객님께 안내하고 동의를 받으신<br/>뒤 다시 문의해 주시면 접수<br/>도와드리겠습니다.\"]:::bot\nN5[\"<b>5<\/b> 패키지할인이 적용된 주문은 파트너 귀책으로<br/>접수됩니다. 구매자 귀책으로 접수하면 주문<br/>상품 전체의 패키지할인이 취소됩니다.\"]:::bot\nN6[\"<b>6<\/b> 상담원에게 연결해 취소 접수를<br/>진행하겠습니다. 잠시만 기다려 주세요.\"]:::bot\nN3_4{{\"리셀러 의심 주문\"}}:::sec\nN3_5{{\"주문제작 상품 오주문\"}}:::sec\nN3_5_3_5_1[\"<b>3-5-1<\/b> 오늘의집에서 고객님께 연락해 상황을 설명하고<br/>취소·재주문을 안내해 드릴 수 있습니다.<br/>주문번호와 잘못 주문된<br/>내용(사이즈·수량·금액 등)을 알려주세요.\"]:::bot\nN3_5_3_5_2[\"<b>3-5-2<\/b> 고객님이 수긍하지 않으시는 사유와 파트너님<br/>입장을 알려주시면 상담원이 확인해<br/>드리겠습니다.\"]:::bot\nN3_6{{\"고객 연락두절\"}}:::sec\nN3_6_7[\"<b>7<\/b> 확인이 필요한 주문입니다. 주문번호,<br/>주문옵션번호, 취소 사유를 알려주시면 담당<br/>부서 확인 후 안내드리겠습니다. 확인에<br/>시간이 걸릴 주문의 현재 상태를 선택해 주세요.", "sec": false, "body": []}, {"k": "2-2", "id": "2-2", "t": "고객님이 취소를 요청한 주문은 오로라 > 취소/반품/교환 > 취소관리에서 취소상태를 '취소요청'으로 검색하시면 확인하실 수 있습니다. 확인이 어려우시면 고객님 동의 여부를 확인한 뒤 상담원이 주문 상태를 확인해 접수하겠습니다.", "sec": false, "body": []}, {"k": "3-1", "id": "3-1", "t": "파트너님, 고객님이 이미 취소를 요청하신 건은 오로라 > 취소/반품/교환 > 취소관리에서 해당 주문을 선택하고", "sec": false, "body": []}, {"k": "3-2", "id": "3-2", "t": "파트너님, 입금대기·결제완료 상태의 주문은 고객님이 직접 취소하실 수 있습니다. 취소 접수는 고객님이 진행하는 항목이라, 고객님께 아래 경로로 취소하시도록 안내 부탁드립니다.", "sec": false, "body": ["- 경로: 오늘의집 > 나의 쇼핑 > 주문번호 상세보기 > 주문취소", "고객님이 직접 취소하기 어려운 사정이 있으시면 말씀해 주세요."]}, {"k": "3-3", "id": "3-3", "t": "파트너님, 배송준비중 상태의 주문은 고객님이 직접 취소하실 수 없어 접수가 필요합니다. → 4", "sec": false, "body": []}, {"k": "4", "id": "4", "t": "고객님과 취소에 대해 협의하고 동의를 받으셨나요?", "sec": false, "body": []}, {"k": "4-1", "id": "4-1", "t": "고객님 사유의 취소는 고객님 동의 확인이 필요합니다. 고객님께 안내하고 동의를 받으신 뒤 다시 문의해 주시면 접수 도와드리겠습니다. → 상담 종료 (유형: PA002006)", "sec": false, "body": []}, {"k": "5", "id": "5", "t": "패키지할인이 적용된 주문은 파트너 귀책으로 접수됩니다. 구매자 귀책으로 접수하면 주문 상품 전체의 패키지할인이 취소됩니다.", "sec": false, "body": ["상품 출고 전 취소는 귀책과 관계없이 반품비 등 별도 비용이 발생하지 않습니다. 다만 일부 상품만 취소해 무료배송 조건이 깨지면 귀책 대상이 배송비를 부담합니다.", "접수 내용을 확인해 주세요.", "- 주문번호 / 주문옵션번호: ○○", "- 취소 사유: ○○ (귀책: ○○)", "- 고객 동의: 확인", "이대로 접수할까요?"]}, {"k": "6", "id": "6", "t": "상담원에게 연결해 취소 접수를 진행하겠습니다. 잠시만 기다려 주세요. → 상담원 인계 (T3-A)", "sec": false, "body": []}, {"k": "3-4", "id": "3-4", "t": "리셀러 의심 주문", "sec": true, "body": ["파트너님, 리셀러 의심 주문은 담당 부서 확인이 필요합니다. 리셀러로 의심하시는 사유를 알려주세요. (예: 같은 배송지로 반복 대량 주문 등)"]}, {"k": "3-5", "id": "3-5", "t": "주문제작 상품 오주문", "sec": true, "body": ["파트너님, 주문제작 상품을 고객님이 상담 없이 잘못 주문하신 경우에는 고객님께 취소 후 재주문이 필요하다는 안내가 필요합니다. 고객님께 이미 안내하셨나요?"]}, {"k": "3-5/3-5-1", "id": "3-5-1", "t": "오늘의집에서 고객님께 연락해 상황을 설명하고 취소·재주문을 안내해 드릴 수 있습니다. 주문번호와 잘못 주문된 내용(사이즈·수량·금액 등)을 알려주세요.", "sec": false, "body": []}, {"k": "3-5/3-5-2", "id": "3-5-2", "t": "고객님이 수긍하지 않으시는 사유와 파트너님 입장을 알려주시면 상담원이 확인해 드리겠습니다.", "sec": false, "body": []}, {"k": "3-6", "id": "3-6", "t": "고객 연락두절", "sec": true, "body": ["파트너님, 고객님과 연락이 닿지 않아 취소가 필요한 경우에는 오늘의집에서 고객님께 연락을 시도한 뒤 처리 방법을 안내드립니다. 연락을 시도하신 일시와 횟수, 취소가 필요한 사유를 알려주세요."]}, {"k": "3-6/7", "id": "7", "t": "확인이 필요한 주문입니다. 주문번호, 주문옵션번호, 취소 사유를 알려주시면 담당 부서 확인 후 안내드리겠습니다. 확인에 시간이 걸릴 수 있는 점 양해 부탁드립니다.", "sec": false, "body": []}], "hocond": "출고 전 취소 접수(Write) T3-A / 승인 오류·고객 연락 안내 필요(주문제작 오주문) T3-B / 리셀러 의심·고객 미수긍·고객 연락두절·취소 제한 주문 T3-C / 대량·오등록·리콜은 PA002004, 품절은 PA002005, 일부 취소는 PA002003 전환 / 공통: 상담원 직접 요청 T1 / 같은 질문 반복·미해결 T2 / 감정·민원 T4 / 복수 용건 T7 / 운영시간 종료 직전 인계 T8", "hoinfo": "주문번호·주문옵션번호와 건수, 취소 사유와 귀책, 파트너가 선택한 주문 상태(모르면 '주문 상태 미확인'), 고객 협의·동의 여부, 리셀러 의심 사유, 주문제작 오주문 내용(사이즈·수량·금액)과 고객 수긍 여부, 연락두절 시 연락 시도 일시·횟수, 취소 제한 문구 발생 여부. 패키지할인 여부·결제수단(무통장입금 여부)·주문제작 상품 여부는 상담원이 확인", "kms": "063_취소.md, 066_대량취소_프로세스.md, 088_프로세스_기준_정리_.md, 093_고객센터_협업_유형_및_이관_방법.md, 086_상담_양식___첨부_파일__.md, 080_파트너센터_교육자료__클레임.md", "check": "1) 대량 기준 30건 vs 50건·50만원 상충. 2) 고객 변심 취소에서 동의 미확보 시 '동의 후 재문의'로 썼음(063 철회 항목의 '고객 부재/미동의는 불가 또는 동의 확인 후 재문의' 준용): 취소 접수에도 같은 기준인지 확인 필요. 3) 리셀러 의심 판단 기준과 파트너에게 처리 결과를 안내하는지 KMS 명시 없음. 4) 고객 연락두절은 비용 발생 여부에 따라 민원이관/연락처 확인으로 갈리는데, 챗봇이 비용 발생 여부를 물어야 하는지 확인 필요. 5) '취소 요청이 제한된 주문' 팝업의 원인과 파트너 안내 문구 KMS 없음(내부 심층문의 공유만 기재). 6) (1차 전환) 주문 상태를 파트너 선택으로 받고, 모르면 셀프 확인 경로 안내 후 '상태 미확인'으로 동의 확인·접수까지 진행함. 상태를 모르는 파트너가 입금대기·결제완료 건(고객 직접 취소 대상)을 접수로 넘길 수 있어, 상담원이 상태 확인 후 고객 직접 취소로 돌려보내는 운영을 둘지 확인 필요.", "api": "R-02, R-04, W-01", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 취소 사유: \n· 주문번호와 주문옵션번호: \n· 건수: \n· 현재 주문 상태 (입금대기·결제완료 / 배송준비중 / 고객님이 이미 취소를 요청함 / 배송중·배송완료 / 잘 모름): \n· 고객 협의·동의 (동의받음 / 동의 못 받음 / 연락 안 됨): \n· (해당 시: 리셀러 의심) 리셀러 의심 사유: \n· (해당 시: 주문제작 오주문) 잘못 주문된 내용(사이즈·수량·금액)과 고객 수긍 여부: \n· (해당 시: 연락두절) 연락 시도 일시·횟수: \n\n문의 내용: ", "mode": "조건별: 고객 취소요청 상태·입금대기·결제완료 건과 고객 동의 전 건은 자동답변 종결 / 배송준비중 동의 완료 건·리셀러·주문제작 오주문·연락두절·취소 제한 문구는 상담원 배정", "segs": [{"c": ["A"], "t": "고객 취소요청 상태·입금대기·결제완료 건과 고객 동의 전 건은 자동답변 종결"}, {"c": ["C"], "t": "배송준비중 동의 완료 건·리셀러·주문제작 오주문·연락두절·취소 제한 문구는 상담원 배정"}], "auto": "(공통 첫인사)\n\n[고객님이 이미 취소를 요청하신 주문인 경우]\n오로라 > 취소/반품/교환 > 취소관리에서 해당 주문을 선택하고 [취소승인(환불)]을 누르시면 처리됩니다. 승인하지 않으면 취소요청일로부터 7영업일째 자동 취소승인됩니다. (주문제작 상품은 21영업일째) 승인이 되지 않으면 주문번호와 화면 문구를 적어 새 문의로 남겨 주세요.\n\n[주문이 입금대기·결제완료 상태인 경우]\n입금대기·결제완료 상태에서는 고객님이 직접 취소하실 수 있습니다. 취소 접수는 고객님이 진행하는 항목이라, 고객님께 아래 경로로 취소하시도록 안내 부탁드립니다.\n- 경로: 오늘의집 > 나의 쇼핑 > 주문번호 상세보기 > 주문취소\n고객님이 직접 취소하기 어려운 사정이 있으면 그 사정을 적어 새 문의로 남겨 주세요.\n\n[배송준비중인데 고객님 동의를 아직 받지 못한 경우]\n고객님 사유의 취소는 고객님 동의 확인이 필요합니다. 고객님께 안내하고 동의를 받으신 뒤 새 문의로 남겨 주시면 접수 도와드리겠습니다. 상품 출고 전 취소는 귀책과 관계없이 반품비 등 별도 비용이 발생하지 않습니다.\n\n[배송중·배송완료 상태인 경우]\n배송중 단계부터는 취소가 아닌 반품으로 처리됩니다. 반품 접수가 필요하시면 세부 유형 '반품 대신 접수'로 새 문의를 남겨 주세요.\n(맺음 A)", "ack": "남겨 주신 주문 정보와 고객님 동의 내용을 확인한 뒤 취소 접수를 진행하겠습니다.\n(리셀러 의심·연락두절·취소 제한 문구 건은 이 문장으로 교체: \"해당 주문은 담당 부서 확인이 필요해 확인 후 안내드리겠습니다. 확인에 시간이 걸릴 수 있는 점 양해 부탁드립니다.\")\n(주문제작 오주문 건: \"오늘의집에서 고객님께 연락해 상황을 설명하고 취소·재주문을 안내해 드리겠습니다.\")", "info": "주문번호·주문옵션번호와 건수, 취소 사유와 귀책, 파트너가 고른 주문 상태, 고객 동의 여부, 리셀러 의심 사유, 주문제작 오주문 내용과 고객 수긍 여부, 연락두절 시 연락 시도 일시·횟수, 취소 제한 문구 여부", "kms": "063_취소.md, 066_대량취소_프로세스.md, 088_프로세스_기준_정리_.md, 093_고객센터_협업_유형_및_이관_방법.md, 086_상담_양식___첨부_파일__.md, 080_파트너센터_교육자료__클레임.md", "check": "1) 고객 동의 미확보 건을 '동의 후 새 문의' 자동답변으로 종결하는 근거는 063 철회 항목('고객 부재/미동의는 불가 또는 동의 확인 후 재문의') 준용 — 취소 접수에도 같은 기준인지 확인 필요\n2) 대량 기준 30건 vs 50건·50만원\n3) 리셀러 의심 판단 기준과 처리 결과를 파트너에게 안내하는지 KMS 없음\n4) '취소 요청이 제한된 주문' 문구의 원인과 파트너 안내 문구 KMS 없음\n5) 무통장입금 주문 환불계좌 확인 절차를 취소에도 적용하는지 확인"}}, {"code": "PA002007", "draft": true, "name": "반품 대리접수", "mid": "반품/교환", "vol": "640", "mode": "안내 후 조건부 상담원 연결", "utter": "불량이라 반품 접수 대신 해주세요\n고객이 앱에서 반품 신청을 못 한다고 해서요, 대신 접수 가능할까요?\n오배송이라 반품 받아야 하는데 접수 좀 부탁드려요", "raw": "1. 네, 파트너님. 반품 접수를 도와드리겠습니다. 반품할 주문의 주문번호와 주문옵션번호를 알려주세요.\n[주문번호·주문옵션번호 입력]\n1-1. 해당 주문의 현재 상태를 선택해 주세요.\n[배송중·배송완료] → 2\n[결제완료·배송준비중(출고 전)] → '출고 전 주문은 반품이 아닌 취소로 처리됩니다.' 안내 후 사유에 따라 유형 PA002005·PA002006으로 전환\n[구매확정] → 2-3\n[이미 반품이 접수돼 있어요] → 2-4\n[오늘의집 글로벌(일본·미국) 주문이에요] → '오늘의집 글로벌(일본·미국) 주문은 global_op@partnerbucketplace.com 으로 문의해 주세요.' 안내 → 상담 종료 (유형: PA002007)\n[잘 모르겠어요] → 1-2\n1-2. 이미 접수된 반품은 오로라 > 취소/반품/교환 > 반품관리에서 확인하실 수 있습니다. 확인이 어려우시면 그대로 진행하고 상담원이 주문 상태를 확인하겠습니다.\n[이미 반품이 접수돼 있어요] → 2-4\n[그대로 진행할게요] → 2 (인계 정보에 '주문 상태 미확인'으로 표시)\n\n2. 파트너님, 반품 접수는 원래 고객님이 진행하시는 항목입니다. 고객님이 직접 접수하시면 사유에 따라 귀책과 반품배송비가 자동으로 정해집니다. 고객님께 직접 접수를 안내해 주셔도 되고, 직접 접수가 어려운 사정이 있으면 대신 접수를 도와드립니다.\n[고객에게 직접 접수 안내할게요] → 상담 종료 (유형: PA002007)\n[대신 접수해 주세요] → 3\n\n3. 반품 사유를 선택해 주세요.\n[상품 불량·파손] / [오배송] / [상품 누락] / [고객 단순변심] / [사이즈·색상 등 고객 선택 착오] / [기타]\n4. (사유 선택에 따라 귀책 안내)\n(불량·파손·오배송·누락 → '선택하신 사유는 판매자 귀책으로 접수되며, 반품배송비가 고객님께 차감되지 않습니다.')\n(단순변심·선택 착오 → '선택하신 사유는 구매자 귀책으로 접수되며, 반품배송비가 고객님께 청구됩니다.')\n패키지할인이 적용된 주문은 파트너 귀책으로 접수됩니다.\n귀책이 맞나요?\n[네] → 5\n[귀책을 두고 고객님과 의견이 달라요] → 4-1\n4-1. 고객님과 주장이 다른 경우에는 상담원이 사실관계를 확인하고 중재를 도와드립니다. 고객님 주장과 파트너님 입장을 각각 적어 주세요.\n[양측 입장 입력] → 상담원 인계 (T3-C)\n5. 상품 회수 상태를 알려주세요.\n[아직 회수 전이에요] / [이미 회수했어요] / [회수가 필요 없어요]\n6. 고객님과 반품에 대해 협의하고 동의를 받으셨나요?\n[네, 동의 받았어요] → 7\n[아니요] → 6-1\n6-1. 반품 대리접수는 고객님 동의 확인이 필요합니다. 고객님께 안내하고 동의를 받으신 뒤 다시 문의해 주시면 접수 도와드리겠습니다. → 상담 종료 (유형: PA002007)\n7. 무통장입금 주문은 환불 계좌 확인이 필요해 오늘의집에서 고객님께 연락드리며, 연락이 닿지 않으면 시간이 더 걸릴 수 있습니다.\n접수 내용을 확인해 주세요.\n- 주문번호 / 주문옵션번호: ○○\n- 반품 사유: ○○ (귀책: ○○)\n- 회수 상태: ○○\n- 고객 동의: 확인\n접수 후 수거가 완료되면 수거완료일로부터 8영업일째 자동으로 환불승인됩니다. 검수 후 승인 또는 반품불가 처리는 오로라 > 취소/반품/교환 > 반품관리에서 진행해 주세요.\n이대로 접수할까요?\n[네] → 8 / [수정할게요] → 3\n8. 상담원에게 연결해 반품 접수를 진행하겠습니다. 잠시만 기다려 주세요. → 상담원 인계 (T3-A)\n\n2-3. 파트너님, 구매확정된 주문은 반품 접수가 되지 않습니다. 이 경우 파트너님이 상품을 회수해 이상 여부를 확인하신 뒤, 반품이 가능하면 구매확정 후 취소로 처리해 주세요. 구매자 귀책이면 반품배송비는 차감되지 않아 고객님께 별도로 받으셔야 합니다.\n[구매확정 후 취소 방법 알려주세요] → 유형 PA002009로 전환\n[알겠어요] → 상담 종료 (유형: PA002007)\n\n2-4. 파트너님, 이미 반품이 접수된 주문은 오로라 > 취소/반품/교환 > 반품관리에서 처리하실 수 있습니다.\n- 상품을 받으셨으면 [수거완료] 후 검수 결과에 따라 [반품승인(환불)] 또는 [반품불가]를 눌러 주세요.\n- 반품승인·반품불가는 반품번호 단위로만 처리되며 일부 옵션만 부분 처리할 수 없습니다.\n- 자동수거(실패)로 보이면 '자동수거(실패)' 옆 i 표시의 실패 사유를 확인해 주세요. 굿스플로 정책·원송장 택배사 불일치는 수동 운송장 입력, 시스템 장애는 수거 재요청으로 처리합니다.\n[귀책·유형을 바꾸고 싶어요] → 유형 PA002008로 전환\n[알겠어요] → 상담 종료 (유형: PA002007)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 반품 접수를<br/>도와드리겠습니다. 반품할 주문의 주문번호와<br/>주문옵션번호를 알려주세요.\"]:::bot\nN1_1[\"<b>1-1<\/b> 해당 주문의 현재 상태를 선택해 주세요.\"]:::bot\nN1_2[\"<b>1-2<\/b> 이미 접수된 반품은 오로라 ›<br/>취소/반품/교환 › 반품관리에서 확인하실 수<br/>있습니다. 확인이 어려우시면 그대로 진행하고<br/>상담원이 주문 상태를 확인하겠습니다.\"]:::bot\nN2[\"<b>2<\/b> 파트너님, 반품 접수는 원래 고객님이<br/>진행하시는 항목입니다. 고객님이 직접<br/>접수하시면 사유에 따라 귀책과 반품배송비가<br/>자동으로 정해집니다. 고객님께 직접 접수를<br/>안내해 주셔도 되고, 직접 접수가 어려운<br/>사정이 있으면 대신 접수를 도와드립니다.\"]:::bot\nN3[\"<b>3<\/b> 반품 사유를 선택해 주세요.\"]:::bot\nN4[\"<b>4<\/b> (사유 선택에 따라 귀책 안내)\"]:::bot\nN4_1[\"<b>4-1<\/b> 고객님과 주장이 다른 경우에는 상담원이<br/>사실관계를 확인하고 중재를 도와드립니다.<br/>고객님 주장과 파트너님 입장을 각각 적어<br/>주세요.\"]:::bot\nN5[\"<b>5<\/b> 상품 회수 상태를 알려주세요.\"]:::bot\nN6[\"<b>6<\/b> 고객님과 반품에 대해 협의하고 동의를<br/>받으셨나요?\"]:::bot\nN6_1[\"<b>6-1<\/b> 반품 대리접수는 고객님 동의 확인이<br/>필요합니다. 고객님께 안내하고 동의를 받으신<br/>뒤 다시 문의해 주시면 접수<br/>도와드리겠습니다.\"]:::bot\nN7[\"<b>7<\/b> 무통장입금 주문은 환불 계좌 확인이 필요해<br/>오늘의집에서 고객님께 연락드리며, 연락이<br/>닿지 않으면 시간이 더 걸릴 수 있습니다.\"]:::bot\nN8[\"<b>8<\/b> 상담원에게 연결해 반품 접수를<br/>진행하겠습니다. 잠시만 기다려 주세요.\"]:::bot\nN2_3[\"<b>2-3<\/b> 파트너님, 구매확정된 주문은 반품 접수가<br/>되지 않습니다. 이 경우 파트너님이 상품을<br/>회수해 이상 여부를 확인하신 뒤, 반품이<br/>가능하면 구매확정 후 취소로 처리해 주세요.<br/>구매자 귀책이면 반품배송비는 차감되지 않아<br/>고객님께 별도로 받으셔야 합니다.\"]:::bot\nN2_4[\"<b>2-4<\/b> 파트너님, 이미 반품이 접수된 주문은 오로라<br/>› 취소/반품/교환 › 반품관리에서 처리하실<br/>수 있습니다.\"]:::bot\nS --> N1\nN1_1 -->|\"배송중·배송완료\"| N2\nN1_1 -->|\"결제완료·배송준비중(출고 전) · '출고 전<br/>주문은 반품이 아닌 취소로 처리됩니다.'<br/>안내 후 사유에 따라\"| SW_PA002005\nN1_1 -->|\"결제완료·배송준비중(출고 전) · '출고 전<br/>주문은 반품이 아닌 취소로 처리됩니다.'<br/>안내 후 사유에 따라 「품절·재고부족 취소」·\"| SW_PA002006\nN1_1 -->|\"구매확정\"| N2_3\nN1_1 -->|\"이미 반품이 접수돼 있어요\"| N2_4\nN1_1 -->|\"오늘의집 글로벌(일본·미국) 주문이에요\"| END\nN1_1 -->|\"잘 모르겠어요\"| N1_2\nN1_2 -->|\"이미 반품이 접수돼 있어요\"| N2_4\nN1_2 -->|\"그대로 진행할게요\"| N2\nN1 -->|\"주문번호·주문옵션번호 입력\"| N2\nN2 -->|\"고객에게 직접 접수 안내할게요\"| END\nN2 -->|\"대신 접수해 주세요\"| N3\nN3 -->|\"상품 불량·파손 / 오배송 / 상품 누락 /<br/>고객 단순변심 / 사이즈·색상 등 고객 선택<br/>착오 / 기타\"| N4\nN4 -->|\"불량·파손·오배송·누락\"| TX3\nN4 -->|\"단순변심·선택 착오\"| TX4\nN4 -->|\"네\"| N5\nN4 -->|\"귀책을 두고 고객님과 의견이 달라요\"| N4_1\nN4_1 -->|\"양측 입장 입력\"| HO_T3C\nN5 -->|\"아직 회수 전이에요 / 이미 회수했어요 /<br/>회수가 필요 없어요\"| N6\nN6 -->|\"네, 동의 받았어요\"| N7\nN6 -->|\"아니요\"| N6_1\nN6_1 --> END\nN7 -->|\"네\"| N8\nN7 -->|\"수정할게요\"| N3\nN8 --> HO_T3A\nN2_3 -->|\"구매확정 후 취소 방법 알려주세요\"| SW_PA002009\nN2_3 -->|\"알겠어요\"| END\nN2_4 -->|\"귀책·유형을 바꾸고 싶어요\"| SW_PA002008\nN2_4 -->|\"알겠어요\"| END\nN1 -.-> N1_1\nSW_PA002005[/\"「품절·재고부족 취소」로 전환\"/]:::sw\nSW_PA002006[/\"「기타 사유 취소」로 전환\"/]:::sw\nEND([\"상담 종료\"]):::fin\nTX3[\"'선택하신 사유는 판매자<br/>귀책으로 접수되며,<br/>반품배송비가 고객님께<br/>차감되지 않습니다.'\"]:::txt\nTX4[\"'선택하신 사유는 구매자<br/>귀책으로 접수되며,<br/>반품배송비가 고객님께<br/>청구됩니다.'\"]:::txt\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nHO_T3A([\"상담원 인계<br/>실행 요청\"]):::ho\nSW_PA002009[/\"「구매확정 후 취소·환불」로 전환\"/]:::sw\nSW_PA002008[/\"「클레임 상태 변경」로 전환\"/]:::sw", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 반품 접수를 도와드리겠습니다. 반품할 주문의 주문번호와 주문옵션번호를 알려주세요.", "sec": false, "body": []}, {"k": "1-1", "id": "1-1", "t": "해당 주문의 현재 상태를 선택해 주세요.", "sec": false, "body": []}, {"k": "1-2", "id": "1-2", "t": "이미 접수된 반품은 오로라 > 취소/반품/교환 > 반품관리에서 확인하실 수 있습니다. 확인이 어려우시면 그대로 진행하고 상담원이 주문 상태를 확인하겠습니다.", "sec": false, "body": []}, {"k": "2", "id": "2", "t": "파트너님, 반품 접수는 원래 고객님이 진행하시는 항목입니다. 고객님이 직접 접수하시면 사유에 따라 귀책과 반품배송비가 자동으로 정해집니다. 고객님께 직접 접수를 안내해 주셔도 되고, 직접 접수가 어려운 사정이 있으면 대신 접수를 도와드립니다.", "sec": false, "body": []}, {"k": "3", "id": "3", "t": "반품 사유를 선택해 주세요.", "sec": false, "body": []}, {"k": "4", "id": "4", "t": "(사유 선택에 따라 귀책 안내)", "sec": false, "body": ["패키지할인이 적용된 주문은 파트너 귀책으로 접수됩니다.", "귀책이 맞나요?"]}, {"k": "4-1", "id": "4-1", "t": "고객님과 주장이 다른 경우에는 상담원이 사실관계를 확인하고 중재를 도와드립니다. 고객님 주장과 파트너님 입장을 각각 적어 주세요.", "sec": false, "body": []}, {"k": "5", "id": "5", "t": "상품 회수 상태를 알려주세요.", "sec": false, "body": []}, {"k": "6", "id": "6", "t": "고객님과 반품에 대해 협의하고 동의를 받으셨나요?", "sec": false, "body": []}, {"k": "6-1", "id": "6-1", "t": "반품 대리접수는 고객님 동의 확인이 필요합니다. 고객님께 안내하고 동의를 받으신 뒤 다시 문의해 주시면 접수 도와드리겠습니다. → 상담 종료 (유형: PA002007)", "sec": false, "body": []}, {"k": "7", "id": "7", "t": "무통장입금 주문은 환불 계좌 확인이 필요해 오늘의집에서 고객님께 연락드리며, 연락이 닿지 않으면 시간이 더 걸릴 수 있습니다.", "sec": false, "body": ["접수 내용을 확인해 주세요.", "- 주문번호 / 주문옵션번호: ○○", "- 반품 사유: ○○ (귀책: ○○)", "- 회수 상태: ○○", "- 고객 동의: 확인", "접수 후 수거가 완료되면 수거완료일로부터 8영업일째 자동으로 환불승인됩니다. 검수 후 승인 또는 반품불가 처리는 오로라 > 취소/반품/교환 > 반품관리에서 진행해 주세요.", "이대로 접수할까요?"]}, {"k": "8", "id": "8", "t": "상담원에게 연결해 반품 접수를 진행하겠습니다. 잠시만 기다려 주세요. → 상담원 인계 (T3-A)", "sec": false, "body": []}, {"k": "2-3", "id": "2-3", "t": "파트너님, 구매확정된 주문은 반품 접수가 되지 않습니다. 이 경우 파트너님이 상품을 회수해 이상 여부를 확인하신 뒤, 반품이 가능하면 구매확정 후 취소로 처리해 주세요. 구매자 귀책이면 반품배송비는 차감되지 않아 고객님께 별도로 받으셔야 합니다.", "sec": false, "body": []}, {"k": "2-4", "id": "2-4", "t": "파트너님, 이미 반품이 접수된 주문은 오로라 > 취소/반품/교환 > 반품관리에서 처리하실 수 있습니다.", "sec": false, "body": ["- 상품을 받으셨으면 [수거완료] 후 검수 결과에 따라 [반품승인(환불)] 또는 [반품불가]를 눌러 주세요.", "- 반품승인·반품불가는 반품번호 단위로만 처리되며 일부 옵션만 부분 처리할 수 없습니다.", "- 자동수거(실패)로 보이면 '자동수거(실패)' 옆 i 표시의 실패 사유를 확인해 주세요. 굿스플로 정책·원송장 택배사 불일치는 수동 운송장 입력, 시스템 장애는 수거 재요청으로 처리합니다."]}], "hocond": "반품 대리접수(Write) T3-A / 고객↔파트너 귀책 분쟁 T3-C / 출고 전은 PA002005·PA002006, 구매확정은 PA002009, 접수 건 변경은 PA002008 전환 / 공통: 상담원 직접 요청 T1 / 같은 질문 반복·미해결 T2 / 감정·민원 T4 / 복수 용건 T7 / 운영시간 종료 직전 인계 T8", "hoinfo": "주문번호·주문옵션번호, 파트너가 선택한 주문 상태(모르면 '주문 상태 미확인'), 반품 사유와 귀책(판매자/구매자), 회수 상태(회수 전/회수완료/회수 불필요), 고객 동의 여부, 고객이 직접 접수하지 못하는 사유, 분쟁 시 고객 주장·파트너 입장. 패키지할인 여부·결제수단(무통장입금 여부)·글로벌 주문 여부는 상담원이 확인", "kms": "052_반품.md, 063_취소.md, 080_파트너센터_교육자료__클레임.md, 088_프로세스_기준_정리_.md, 093_고객센터_협업_유형_및_이관_방법.md, 090_민원_업무_프로세스_.md", "check": "1) 반품불가 후 자동 구매확정: 052 본문 '8일째' vs 같은 문서 정산 항목 '8영업일째' 혼재. 2) 센터 대리접수 반품의 반품배송비 자동 차감 여부 KMS 명시 없음(교환은 '어드민 대리접수 시 차감·결제 불가' 명시). 3) 반품 대리접수에 고객 동의가 필수인지 KMS 명시 없음: 취소·철회 기준을 준용함. 4) 사유별 귀책 매핑(선택 착오 등)은 고객 앱 사유 목록 기준으로 확인 필요. 5) 052 반품 접수 경로에 남은 '50만원 이상/50건 이상' 대량 기준이 066의 30건과 상충. 6) (1차 전환) 주문 상태를 파트너 선택으로 받음. 상태를 모르면 반품관리 확인 경로 안내 후 '상태 미확인'으로 진행하며, 출고 전 건이 섞여 들어오면 상담원이 취소 유형으로 돌려야 함. 7) (1차 전환) 패키지할인·무통장입금 안내를 해당 여부와 관계없이 노출함.", "api": "R-02, R-04, W-02", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 주문번호와 주문옵션번호: \n· 현재 주문 상태 (배송중 / 배송완료 / 구매확정 / 이미 반품이 접수됨 / 잘 모름): \n· 반품 사유 (상품 불량·파손 / 오배송 / 상품 누락 / 고객 단순변심 / 사이즈·색상 등 고객 선택 착오 / 기타): \n· 회수 상태 (회수 전 / 회수 완료 / 회수 불필요): \n· 고객 동의 (동의받음 / 못 받음): \n· 고객님이 직접 접수하지 못하는 사유 (선택): \n· 귀책을 두고 고객님과 의견이 다른지 (같음 / 다름): \n· (해당 시: 다름) 고객님 주장과 파트너님 입장: \n\n문의 내용: ", "mode": "조건별: 구매확정 건·이미 반품 접수된 건·고객 동의 전 건은 자동답변 종결 / 대리접수 요청은 상담원 배정 / 귀책 분쟁은 상담원 배정", "segs": [{"c": ["A"], "t": "구매확정 건·이미 반품 접수된 건·고객 동의 전 건은 자동답변 종결"}, {"c": ["C"], "t": "대리접수 요청은 상담원 배정"}, {"c": ["C"], "t": "귀책 분쟁은 상담원 배정"}], "auto": "(공통 첫인사)\n\n[이미 반품이 접수된 주문인 경우]\n이미 접수된 반품은 오로라 > 취소/반품/교환 > 반품관리에서 처리하실 수 있습니다.\n- 상품을 받으셨으면 [수거완료] 후 검수 결과에 따라 [반품승인(환불)] 또는 [반품불가]를 눌러 주세요.\n- 반품승인·반품불가는 반품번호 단위로만 처리되며 일부 옵션만 부분 처리할 수 없습니다.\n- 수거완료 후 처리하지 않으면 수거완료일로부터 8영업일째 자동 환불승인됩니다.\n- '자동수거(실패)'로 보이면 옆의 i 표시에서 실패 사유를 확인해 주세요. 굿스플로 정책·원송장 택배사 불일치는 수동 운송장 입력으로, 시스템 장애는 수거 재요청으로 처리합니다.\n\n[구매확정된 주문인 경우]\n구매확정된 주문은 반품 접수가 되지 않습니다. 파트너님이 상품을 회수해 이상 여부를 확인하신 뒤, 반품이 가능하면 구매확정 후 취소로 처리해 주세요.\n- 경로: 오로라 > 주문배송 > 구매확정 내역 > 취소할 주문번호 검색·선택 > [구매확정주문 취소]\n구매자 귀책이면 반품배송비는 차감되지 않아 고객님께 별도로 받으셔야 합니다.\n\n[고객님 동의를 아직 받지 못한 경우]\n반품 접수는 원래 고객님이 진행하는 항목이며, 고객님이 직접 접수하시면 사유에 따라 귀책과 반품배송비가 자동으로 정해집니다. 고객님께 직접 접수를 안내해 주시거나, 고객님 동의를 받으신 뒤 새 문의로 남겨 주시면 대신 접수를 도와드리겠습니다.\n(맺음 A)", "ack": "남겨 주신 사유와 회수 상태를 확인한 뒤 반품 접수를 진행하겠습니다. 접수 후 수거가 완료되면 수거완료일로부터 8영업일째 자동으로 환불승인되니, 검수 후 승인 또는 반품불가 처리는 오로라 > 취소/반품/교환 > 반품관리에서 진행해 주세요.\n(귀책 의견이 다른 건은 이 문장으로 교체: \"고객님과 귀책 의견이 다른 건으로 확인되어, 담당 상담원이 사실관계를 확인하고 중재를 도와드리겠습니다.\")", "info": "주문번호·주문옵션번호, 파트너가 고른 주문 상태, 반품 사유와 귀책(판매자/구매자), 회수 상태, 고객 동의 여부, 고객이 직접 접수하지 못하는 사유, 귀책 분쟁 시 고객 주장·파트너 입장", "kms": "052_반품.md, 063_취소.md, 080_파트너센터_교육자료__클레임.md, 088_프로세스_기준_정리_.md, 093_고객센터_협업_유형_및_이관_방법.md, 090_민원_업무_프로세스_.md", "check": "1) 센터가 대신 접수한 반품의 반품배송비 자동 차감 여부 KMS 명시 없음 (교환은 대리접수 시 차감 불가 명시) — 접수 확인 문구에 차감 안내를 넣지 못함\n2) 반품 대리접수에 고객 동의가 필수인지 KMS 명시 없음 — 취소·철회 기준 준용\n3) 반품불가 후 자동 구매확정 8일째/8영업일째 혼재\n4) 052에 남은 50만원·50건 대량 기준이 066의 30건과 상충"}}, {"code": "PA002008", "draft": true, "name": "클레임 상태 변경", "mid": "반품/교환", "vol": "230", "mode": "안내 후 조건부 상담원 연결", "utter": "교환 건을 반품으로 바꿔주세요\n고객 변심인데 판매자 귀책으로 반품 들어왔어요, 귀책 바꿀 수 있나요?\n고객이 반품 안 하겠다고 해서 반품 철회하고 싶어요", "raw": "1. 네, 파트너님. 접수된 클레임 변경을 도와드리겠습니다. 주문번호와 주문옵션번호를 알려주세요.\n[주문번호·주문옵션번호 입력]\n1-1. 접수된 클레임 유형을 선택해 주세요.\n[취소] / [반품] / [교환]\n(클레임 진행 상태는 오로라 > 취소/반품/교환 > 취소관리·반품관리·교환관리에서 확인하실 수 있습니다.)\n2. 어떤 변경이 필요하신가요?\n[교환을 반품으로 변경] / [귀책 변경: 판매자→구매자] / [귀책 변경: 구매자→판매자] / [사유 변경] / [클레임 철회] / [환불승인 완료 건 되돌리기]\n\n2-1. [교환을 반품으로 변경]\n파트너님, 교환 건을 반품으로 바로 바꾸는 기능은 지원하지 않아, 교환 상태에 따라 교환을 정리한 뒤 반품을 새로 접수해야 합니다.\n- 교환요청·수거예정·수거중·수거완료: 교환불가 처리 후 반품 접수\n- 교환재배송중: 교환완료 처리 후 반품 접수\n- 교환완료: 반품 접수 (재배송이 끝났는데 상태가 안 바뀌었으면 교환완료를 먼저 처리)\n현재 교환 상태를 선택해 주세요. 오로라 > 취소/반품/교환 > 교환관리에서 확인하실 수 있습니다.\n[교환요청·수거예정·수거중·수거완료] / [교환재배송중] / [교환완료] / [잘 모르겠어요]\n([잘 모르겠어요] → 인계 정보에 '교환 상태 미확인'으로 표시하고 3으로 진행)\n3. 반품으로 바꾸는 사유와 귀책을 알려주세요.\n[판매자 귀책(불량·오배송 등)] / [구매자 귀책(변심 등)]\n4. 고객님도 반품으로 변경하는 데 동의하셨나요?\n[네, 동의하셨어요] → 5\n[아니요·확인 전이에요] → (구매자 귀책이면 → 4-1 / 판매자 귀책이면 → 4-2)\n4-1. 구매자 귀책으로 반품 변경할 때는 고객님 동의 확인이 꼭 필요합니다. 오늘의집에서 고객님께 동의 여부를 확인한 뒤 진행하겠습니다. → 5\n4-2. 고객님께 반품 변경을 안내하고 동의를 받으신 뒤 다시 문의해 주시면 진행해 드리겠습니다. → 상담 종료 (유형: PA002008)\n5. 접수 내용을 확인해 주세요.\n- 주문번호 / 주문옵션번호: ○○\n- 현재 교환 상태: ○○\n- 변경: 교환 → 반품 (귀책: ○○)\n- 고객 동의: ○○\n이대로 진행할까요?\n[네] → 상담원 인계 (T3-A) / [수정할게요] → 2\n(고객이 반품 변경이나 귀책을 수긍하지 않는다고 하면 → 2-7)\n\n2-2. [귀책 변경: 판매자→구매자]\n파트너님, 판매자 귀책으로 접수됐지만 실제로는 구매자 귀책인 경우, 파트너님이 반품불가(또는 교환불가) 처리하면서 사유를 적어 주시면 고객님이 확인 후 올바른 사유로 다시 접수하실 수 있습니다.\n- 경로: 오로라 > 취소/반품/교환 > 반품관리(교환은 교환관리) > 해당 주문 선택 > [반품불가] > 불가 사유 입력\n- 반품불가 처리 시 주문은 반품 요청 이전 상태로 돌아가고, 고객님께 불가 사유가 담긴 알림톡이 발송됩니다.\n- 반품상태가 '수거완료'라면 수거완료일로부터 8영업일째 자동 환불승인되니 그 전에 처리해 주세요.\n- 고객님과 협의 없이 임의로 불가 처리해 분쟁이 생기면 판매자 귀책이 될 수 있으니, 먼저 고객님과 협의해 주세요.\n- 이미 회수한 상품을 고객님께 다시 보내게 되면 재발송 비용 문제가 생길 수 있으니, 고객님이 재접수하시면 그때 처리해 주세요.\n[직접 처리할게요] → 상담 종료 (유형: PA002008)\n[이미 불가 처리했는데 고객이 같은 사유로 다시 접수했어요] → 2-2-1\n[바로 처리해 주세요] → 2-2-1\n2-2-1. 이 경우 오늘의집에서 고객님께 구매자 귀책 처리와 비용 발생을 안내해 드립니다. 고객님이 수긍하지 않으시거나 연락이 닿지 않으면 반품 처리 비용을 파트너님 계좌로 받으실 수 있도록 진행합니다. 반품 처리 비용, 입금받으실 계좌번호와 예금주를 알려주세요.\n[비용·계좌·예금주 입력] → 상담원 인계 (T3-C)\n\n2-3. [귀책 변경: 구매자→판매자]\n파트너님, 고객님과 협의해 반품비가 발생하지 않도록 판매자 귀책으로 바꾸시려는 건가요?\n[네] → 2-3-1\n2-3-1. 판매자 귀책으로 바꾸면 고객님께 비용이 발생하지 않아, 기존 접수 건을 반품불가 처리한 뒤 판매자 귀책으로 다시 접수하고 고객님께 안내 문자를 보내 드립니다. 바꾸는 사유를 알려주세요. (예: 출고 전 취소였는데 고객님이 먼저 반품 접수해 배송비가 차감됨, 고객님과 비용 협의 완료)\n[사유 입력] → 상담원 인계 (T3-A)\n\n2-4. [사유 변경]\n파트너님, 반품·교환 사유는 판매자가 직접 수정할 수 없습니다. 사유가 잘못 선택된 경우 고객님과 협의한 뒤 해당 건을 [반품불가] 또는 [교환불가] 처리하고, 고객님이 올바른 사유로 다시 접수하시도록 안내해 주세요. 처리가 계속 늦어지거나 중재가 필요하시면 다시 문의해 주세요.\n[알겠어요] → 상담 종료 (유형: PA002008)\n[중재가 필요해요] → 2-7\n\n2-5. [클레임 철회]\n어떤 철회가 필요하신가요?\n[반품·교환 수거 철회(자동수거 상품)] → 2-5-1\n[취소·교환 요청 자체 철회] → 2-5-2\n2-5-1. 자동수거 상품은 수거 요청이 택배사로 전달되기 전까지 직접 [수거철회]하실 수 있습니다. 오로라 > 취소/반품/교환 > 반품관리(교환은 교환관리)에서 해당 주문을 선택하고 [수거철회]를 눌러 주세요. 수거철회는 주문 단위로만 되며, 여러 옵션 중 하나라도 수거 요청 이후 단계면 철회되지 않습니다. 철회에 실패하면 택배사에 수거 취소를 요청하신 뒤, 반품불가(교환불가) 처리하면 이전 배송 상태로 돌아갑니다.\n[직접 할게요] → 상담 종료 (유형: PA002008)\n[철회가 안 돼요] → 2-5-2\n2-5-2. 취소·교환 요청 자체를 철회하는 것은 파트너센터에서 처리해 드립니다. 철회는 고객님 동의가 꼭 필요합니다. 고객님께 안내하고 동의를 받으셨나요?\n[네, 동의 받았어요] → 철회 사유 입력 → 상담원 인계 (T3-A)\n[아니요] → 2-5-3\n2-5-3. 고객님께 철회를 안내하고 동의를 받으신 뒤 다시 문의해 주시면 처리해 드리겠습니다. → 상담 종료 (유형: PA002008)\n\n2-6. [환불승인 완료 건 되돌리기]\n파트너님, 이미 환불승인이 완료된 건은 처리 이전으로 되돌릴 수 없습니다. 고객님이 같은 상품을 다시 구매하신 뒤, 새 주문번호와 함께 배송상태 변경을 요청해 주시면 결제 후 '배송완료'로 상태를 변경해 드립니다.\n[재구매 주문번호 있어요] → 주문번호 입력 → 상담원 인계 (T3-A)\n[알겠어요] → 상담 종료 (유형: PA002008)\n\n2-7. 고객님이 수긍하지 않으시는 경우에는 상담원이 사실관계를 확인하고 중재를 도와드립니다. 고객님 불만 내용과 파트너님 입장을 각각 적어 주세요.\n[양측 입장 입력] → 상담원 인계 (T3-C)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 접수된 클레임 변경을<br/>도와드리겠습니다. 주문번호와 주문옵션번호를<br/>알려주세요.\"]:::bot\nN1_1[\"<b>1-1<\/b> 접수된 클레임 유형을 선택해 주세요.\"]:::bot\nN2[\"<b>2<\/b> 어떤 변경이 필요하신가요?\"]:::bot\nN2_1{{\"교환을 반품으로 변경\"}}:::sec\nN2_1_3[\"<b>3<\/b> 반품으로 바꾸는 사유와 귀책을 알려주세요.\"]:::bot\nN2_1_4[\"<b>4<\/b> 고객님도 반품으로 변경하는 데 동의하셨나요?\"]:::bot\nN2_1_4_1[\"<b>4-1<\/b> 구매자 귀책으로 반품 변경할 때는 고객님<br/>동의 확인이 꼭 필요합니다. 오늘의집에서<br/>고객님께 동의 여부를 확인한 뒤<br/>진행하겠습니다.\"]:::bot\nN2_1_4_2[\"<b>4-2<\/b> 고객님께 반품 변경을 안내하고 동의를 받으신<br/>뒤 다시 문의해 주시면 진행해 드리겠습니다.\"]:::bot\nN2_1_5[\"<b>5<\/b> 접수 내용을 확인해 주세요.\"]:::bot\nN2_2{{\"귀책 변경: 판매자→구매자\"}}:::sec\nN2_2_2_2_1[\"<b>2-2-1<\/b> 이 경우 오늘의집에서 고객님께 구매자 귀책<br/>처리와 비용 발생을 안내해 드립니다.<br/>고객님이 수긍하지 않으시거나 연락이 닿지<br/>않으면 반품 처리 비용을 파트너님 계좌로<br/>받으실 수 있도록 진행합니다. 반품 처리<br/>비용, 입금받으실 계좌번호와 예금주를<br/>알려주세요.\"]:::bot\nN2_3{{\"귀책 변경: 구매자→판매자\"}}:::sec\nN2_3_2_3_1[\"<b>2-3-1<\/b> 판매자 귀책으로 바꾸면 고객님께 비용이<br/>발생하지 않아, 기존 접수 건을 반품불가<br/>처리한 뒤 판매자 귀책으로 다시 접수하고<br/>고객님께 안내 문자를 보내 드립니다. 바꾸는<br/>사유를 알려주세요. (예: 출고 전<br/>취소였는데 고객님이 먼저 반품 접수해<br/>배송비가 차감됨, 고객님과 비용 협의 완료)\"]:::bot\nN2_4{{\"사유 변경\"}}:::sec\nN2_5{{\"클레임 철회\"}}:::sec\nN2_5_2_5_1[\"<b>2-5-1<\/b> 자동수거 상품은 수거 요청이 택배사로<br/>전달되기 전까지 직접\"]:::bot\nN2_5_2_5_2[\"<b>2-5-2<\/b> 취소·교환 요청 자체를 철회하는 것은<br/>파트너센터에서 처리해 드립니다. 철회는<br/>고객님 동의가 꼭 필요합니다. 고객님께<br/>안내하고 동의를 받으셨나요?\"]:::bot\nN2_5_2_5_3[\"<b>2-5-3<\/b> 고객님께 철회를 안내하고 동의를 받으신 뒤<br/>다시 문의해 주시면 처리해 드리겠습니다.\"]:::bot\nN2_6{{\"환불승인 완료 건 되돌리기\"}}:::sec\nN2_6_2_7[\"<b>2-7<\/b> 고객님이 수긍하지 않으시는 경우에는 상담원이<br/>사실관계를 확인하고 중재를 도와드립니다.<br/>고객님 불만 내용과 파트너님 입장을 각각<br/>적어 주세요.\"]:::bot\nS --> N1\nN1_1 -->|\"취소 / 반품 / 교환\"| N2\nN2 -->|\"교환을 반품으로 변경\"| N2_1\nN2_1 -->|\"잘 모르겠어요\"| HO_x\nN2_1 -->|\"교환요청·수거예정·수거중·수거완료 /<br/>교환재배송중 / 교환완료 / 잘 모르겠어요\"| N2_1_3\nN2_1_3 -->|\"판매자 귀책(불량·오배송 등) / 구매자<br/>귀책(변심 등)\"| N2_1_4\nN2_1_4 -->|\"네, 동의하셨어요\"| N2_1_5\nN2_1_4 -->|\"아니요·확인 전이에요\"| TX1\nN2_1_4 -->|\"판매자 귀책이면\"| N2_1_4_2\nN2_1_4_1 --> N2_1_5\nN2_1_4_2 --> END\nN2_1_5 -->|\"네\"| HO_T3A\nN2_1_5 -->|\"수정할게요\"| N2\nN2_1_5 -->|\"고객이 반품 변경이나 귀책을 수긍하지<br/>않는다고 하면\"| N2_6_2_7\nN2 -->|\"귀책 변경: 판매자→구매자\"| N2_2\nN2_2 -->|\"직접 처리할게요\"| END\nN2_2 -->|\"이미 불가 처리했는데 고객이 같은 사유로<br/>다시 접수했어요\"| N2_2_2_2_1\nN2_2 -->|\"바로 처리해 주세요\"| N2_2_2_2_1\nN2_2_2_2_1 -->|\"비용·계좌·예금주 입력\"| HO_T3C\nN2 -->|\"귀책 변경: 구매자→판매자\"| N2_3\nN2_3 -->|\"네\"| N2_3_2_3_1\nN2_3_2_3_1 -->|\"사유 입력\"| HO_T3A\nN2 -->|\"사유 변경\"| N2_4\nN2_4 -->|\"알겠어요\"| END\nN2_4 -->|\"중재가 필요해요\"| N2_6_2_7\nN2 -->|\"클레임 철회\"| N2_5\nN2_5 -->|\"반품·교환 수거 철회(자동수거 상품)\"| N2_5_2_5_1\nN2_5 -->|\"취소·교환 요청 자체 철회\"| N2_5_2_5_2\nN2_5_2_5_1 -->|\"직접 할게요\"| END\nN2_5_2_5_1 -->|\"철회가 안 돼요\"| N2_5_2_5_2\nN2_5_2_5_1 -->|\"수거철회 / 수거철회\"| N2_5_2_5_2\nN2_5_2_5_2 -->|\"네, 동의 받았어요\"| HO_T3A\nN2_5_2_5_2 -->|\"아니요\"| N2_5_2_5_3\nN2_5_2_5_3 --> END\nN2 -->|\"환불승인 완료 건 되돌리기\"| N2_6\nN2_6 -->|\"재구매 주문번호 있어요\"| HO_T3A\nN2_6 -->|\"알겠어요\"| END\nN2_6_2_7 -->|\"양측 입장 입력\"| HO_T3C\nN1 --> N1_1\nN2_1_4 -.-> N2_1_4_1\nHO_x([\"상담원 인계<br/>\"]):::ho\nTX1[\"(구매자 귀책이면 →<br/>4-1\"]:::txt\nEND([\"상담 종료\"]):::fin\nHO_T3A([\"상담원 인계<br/>실행 요청\"]):::ho\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 접수된 클레임 변경을 도와드리겠습니다. 주문번호와 주문옵션번호를 알려주세요.", "sec": false, "body": []}, {"k": "1-1", "id": "1-1", "t": "접수된 클레임 유형을 선택해 주세요.", "sec": false, "body": ["(클레임 진행 상태는 오로라 > 취소/반품/교환 > 취소관리·반품관리·교환관리에서 확인하실 수 있습니다.)"]}, {"k": "2", "id": "2", "t": "어떤 변경이 필요하신가요?", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "교환을 반품으로 변경", "sec": true, "body": ["파트너님, 교환 건을 반품으로 바로 바꾸는 기능은 지원하지 않아, 교환 상태에 따라 교환을 정리한 뒤 반품을 새로 접수해야 합니다.", "- 교환요청·수거예정·수거중·수거완료: 교환불가 처리 후 반품 접수", "- 교환재배송중: 교환완료 처리 후 반품 접수", "- 교환완료: 반품 접수 (재배송이 끝났는데 상태가 안 바뀌었으면 교환완료를 먼저 처리)", "현재 교환 상태를 선택해 주세요. 오로라 > 취소/반품/교환 > 교환관리에서 확인하실 수 있습니다."]}, {"k": "2-1/3", "id": "3", "t": "반품으로 바꾸는 사유와 귀책을 알려주세요.", "sec": false, "body": []}, {"k": "2-1/4", "id": "4", "t": "고객님도 반품으로 변경하는 데 동의하셨나요?", "sec": false, "body": []}, {"k": "2-1/4-1", "id": "4-1", "t": "구매자 귀책으로 반품 변경할 때는 고객님 동의 확인이 꼭 필요합니다. 오늘의집에서 고객님께 동의 여부를 확인한 뒤 진행하겠습니다. → 5", "sec": false, "body": []}, {"k": "2-1/4-2", "id": "4-2", "t": "고객님께 반품 변경을 안내하고 동의를 받으신 뒤 다시 문의해 주시면 진행해 드리겠습니다. → 상담 종료 (유형: PA002008)", "sec": false, "body": []}, {"k": "2-1/5", "id": "5", "t": "접수 내용을 확인해 주세요.", "sec": false, "body": ["- 주문번호 / 주문옵션번호: ○○", "- 현재 교환 상태: ○○", "- 변경: 교환 → 반품 (귀책:
