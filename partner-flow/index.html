다.\n- 오로라 > 주문/배송 > 주문 배송 현황에서 변경할 주문 체크 > 주문상태 변경 > 배송완료 선택\n- 한 페이지에 최대 200건까지 표시되어 페이지 단위로 한 번에 처리하실 수 있습니다.\n- 배송준비중 → 배송중은 엑셀 일괄 업로드로도 변경하실 수 있습니다(엑셀은 배송준비중 → 배송중만 가능).\n배송준비중에서 배송완료로 한 번에 바꿀 수는 없습니다. 오로라 > 주문배송 > 주문배송현황에서 주문을 선택해 배송중으로 먼저 변경한 뒤 배송완료로 변경해 주세요.\n배송완료는 상품이 고객님께 실제로 전달된 주문에만 처리해 주세요.\n배송중 → 배송완료를 대량으로 처리하셔야 하면 '배송상태 변경 요청서' 양식(주문옵션번호 기준)을 첨부해 새 문의로 남겨 주시면 파트너센터에서 처리해 드립니다.\n\n[일반택배·화물택배 상품인 경우]\n택배 주문은 송장을 등록하시면 배송 현황이 자동 추적되어 배송상태가 반영됩니다.\n- 배송준비중 → 배송중: 오로라 > 주문배송 > 주문배송현황에서 송장 등록, 또는 엑셀 일괄 업로드(주문옵션번호, 택배사 코드, 송장번호 입력)\n- 배송중 → 배송완료: 유효한 송장이 등록되고 택배사에 인계되었다면 배달완료 후 자동으로 배송완료로 바뀝니다. 실제 배달이 끝났는데도 바뀌지 않는 경우, 배달 완료된 주문에 한해 오로라 주문배송 배송중 메뉴에서 기간 설정 후 검색 > 주문 선택 > '선택배송완료'로 처리해 주세요.\n- 송장 등록일 기준 20영업일이 지나면(21영업일째) 자동으로 배송완료 처리됩니다.\n\n[업체직접배송으로 설정했는데 택배로 보내신 경우]\n배송유형 변경과 운송장 입력은 되지 않지만 배송상태 변경은 파트너님이 직접 하실 수 있습니다.\n- 오로라 > 주문배송 > 주문배송현황 > 주문 건 체크 > 주문상태 변경 > 배송완료 선택\n- 운송장 번호는 고객님께 문자로 따로 안내해 주세요.\n배송은 설정하신 배송방식에 맞추어 해 주셔야 하며, 배송방식을 잘못 설정하셨다면 실제 배송 방식에 맞게 수정 바랍니다. 배송방식이 달라 분쟁이 생기면 오늘의집에서 별도 도움드리기 어려울 수 있는 점 참고 부탁드립니다.\n\n직접 변경이 되지 않으면 주문옵션번호와 화면 캡처, 어떤 버튼에서 안 되는지 적어 새 문의로 남겨 주세요. 주문상태는 순서대로만 바뀌어 결제완료 → 배송중처럼 단계를 건너뛰면 버튼이 비활성화되니 함께 확인해 주세요.\n(맺음 A)", "ack": "남겨 주신 주문옵션번호와 변경 내용을 확인한 뒤 처리하겠습니다.\n(택배 설정 후 직접 배송: \"택배로 설정된 상품을 직접 배송하신 건은 파트너센터에서 상태를 변경해 드리며, 고객님께 안내 문자가 발송됩니다. 배송은 설정하신 배송방식에 맞추어 해 주셔야 하며, 배송방식이 달라 분쟁이 생기면 오늘의집에서 별도 도움드리기 어려울 수 있습니다.\")\n(되돌리는 변경: \"상태를 되돌리는 변경은 고객님께 먼저 안내하고 동의를 확인한 뒤 처리됩니다. 고객님과 연락이 닿지 않으면 상태 변경은 진행되지 않는 점 양해 부탁드립니다.\")", "info": "주문옵션번호 목록과 건수, 현재 상태, 변경 희망 상태, 설정 배송방법, 실제 배송방법, 배송방식 변경 사유, 되돌리는 사유와 배송 가능일, 요청서 첨부 여부, 오류 시 캡처·증상", "kms": "048_배송.md, 081_파트너센터_교육자료__주문_배송.md, 065__주문_.md, 086_상담_양식___첨부_파일__.md", "check": "1) 현행 상담원은 대부분 대신 처리하고 셀프 안내는 2.6%뿐 — 셀프 가능 건을 AI 셀프 안내로 종결하는 방향 자체를 확인 필요\n2) 업체직접배송 배송준비중 → 배송완료 직접 변경 가능 여부 문서마다 다름\n3) 셀프와 요청서를 나누는 '대량' 건수 기준 KMS 없음\n4) 대량 배송완료 전달 방식: 048 요청서(주문옵션번호 기준) vs 같은 문서 '주문번호 전달'\n5) 업체직접배송 자동 배송완료 기간 KMS 없음\n6) 요청서 양식 파일을 AI 답변에 첨부할 수 있는지"}}, {"code": "PA004001", "draft": false, "name": "문의게시판", "mid": "문의/리뷰", "vol": "", "mode": "안내 후 조건부 상담원 연결", "utter": "상품문의 답변을 잘못 달았는데 수정해 주세요\n상품문의에 광고글이 계속 올라와요. 지워주실 수 있나요?\n주문문의 답변 수정은 어떻게 하나요?", "raw": "1. 네, 파트너님. 문의 게시판 관련해 어떤 도움이 필요하신가요?\n[상품문의 답변 수정] [주문문의 답변 수정] [고객센터 문의 답변 수정] [문의글 삭제·블라인드] [답변자명 변경] [미답변 건수가 안 맞아요] [기타]\n(리뷰 답글 요청이면 → 유형 PA004002 시나리오로 전환)\n\n2-1. [상품문의 답변 수정]\n2. 상품문의 답변은 파트너님께서 최초 1회만 작성하실 수 있고, 이후 추가 작성이나 수정은 파트너센터에서 처리해 드립니다. 수정할 상품문의 번호를 알려 주세요.\n[문의번호]\n이미 답변을 등록하신 문의인가요?\n[네] → 3\n[아니요] → 2-1-1\n2-1-1. 아직 답변을 등록하지 않으신 문의라면 최초 답변은 오로라 > 문의/리뷰 > 상품문의에서 직접 등록해 주세요.\n→ 상담 종료 (유형: PA004001)\n3. 수정하실 답변 내용을 텍스트로 보내 주시고, 수정 사유도 함께 알려 주세요. 이미지나 파일이면 내용을 글로 옮겨 주시면 됩니다.\n[수정 답변 내용, 사유]\n4. 기존 답변은 그대로 두고, 그 아래에 '파트너사 요청에 의해 변경/수정된 답변입니다' 문구와 함께 보내 주신 내용이 추가되는 방식으로 반영됩니다. 욕설 등 부적절한 표현이 있으면 반영이 어려울 수 있습니다. 상담원이 확인 후 처리해 드리겠습니다.\n→ 상담원 인계 (T3-A)\n\n2-2. [주문문의 답변 수정]\n2. 주문문의에 등록된 답변은 시스템상 수정이 불가합니다. 번거로우시겠지만 고객님께 전화나 문자로 수정 내용을 직접 안내해 주세요. 주문문의 수정·블라인드·삭제도 어려워 고객님께 개별 연락으로 다시 안내 부탁드립니다.\n→ 상담 종료 (유형: PA004001)\n\n2-3. [고객센터 문의 답변 수정]\n2. 고객센터 문의에 등록하신 답변은 수정이 불가합니다. 수정이 필요한 내용을 적어 주시면 고객센터 담당자에게 전달드리겠습니다. 고객센터 문의 번호와 수정할 내용을 알려 주세요.\n[고객센터 문의 번호, 수정 내용]\n→ 상담원 인계 (T3-C)\n\n2-4. [문의글 삭제·블라인드]\n2. 문의 게시글은 기본적으로 삭제가 불가하며, 유관 부서 검토 후 블라인드 처리 여부가 결정됩니다. 어떤 문의글인가요?\n[고객이 쓴 문의글] → 3-1\n[광고성 문의글] → 3-2\n3-1. 아래 내용을 알려 주세요.\n- 문의번호\n- 상품번호\n- 작성자\n- 요청 사유\n[문의번호, 상품번호, 작성자, 사유]\n4. 담당 부서 검토 결과에 따라 블라인드 여부가 정해지는 점 양해 부탁드립니다. 상담원이 접수해 드리겠습니다.\n→ 상담원 인계 (T3-C)\n3-2. 해당 광고성 문의글의 문의번호와 상품번호를 알려 주세요.\n[문의번호, 상품번호]\n→ 상담원 인계 (T3-C)\n\n2-5. [답변자명 변경]\n2. 어느 게시판의 답변자명인가요?\n[상품문의] → 3-1\n[주문문의] → 3-2\n3-1. 상품문의 답변자명은 따로 수정할 수 없고, 판매자 또는 셀러샵명으로 표시됩니다. 실제 샵명과 다르게 보인다면 오늘의집 앱에 로그인하신 뒤 마이페이지 > 프로필 닉네임이 그 이름으로 되어 있는지 확인하시고 닉네임을 변경해 주세요.\n→ 상담 종료 (유형: PA004001)\n3-2. 주문문의 답변자명은 주문 시점의 브랜드명으로 표시됩니다. 이미 표시된 답변자명은 바꿀 수 없고, 브랜드명을 변경하시면 변경 이후 작성된 주문문의부터 새 브랜드명으로 표시됩니다. 브랜드명 변경을 원하시면 상품번호, 기존 브랜드명, 변경 브랜드명을 알려 주세요.\n[상품번호, 기존 브랜드명, 변경 브랜드명] → 상담원 인계 (T3-A)\n[아니요] → 상담 종료 (유형: PA004001)\n\n2-6. [미답변 건수가 안 맞아요]\n2. 오로라 홈 화면의 상품문의·주문문의 현황 건수는 부득이 정합성이 맞지 않을 수 있습니다. 개발팀에서 인지하고 개선 예정이지만 반영까지 시일이 걸릴 수 있어, 해당 메뉴에서 실제로 보이는 건에 답변 부탁드립니다. 고객센터 문의 건수는 홈 화면에 포함되지 않으니 오로라 > 문의/리뷰 > 고객센터 문의에서 따로 확인해 주세요.\n[메뉴에 들어가도 미답변 문의가 안 보여요] → 3\n[알겠어요] → 상담 종료 (유형: PA004001)\n3. 확인이 필요해 담당 부서에 전달드리겠습니다. 해당 상품번호를 알려 주세요.\n[상품번호]\n→ 상담원 인계 (T3-C)\n\n2-7. [기타]\n(미답변 패널티 문의 → \"장기간 답변이 지연되면 단계적으로 상품 판매가 중지될 수 있고, 구매 건은 청약 철회(취소·환불)가 진행될 수 있습니다.\" 안내 후 상담 종료 (유형: PA004001))\n(주문문의 알림 문의 → \"48시간 안에 답변하지 않은 주문문의가 있으면 1일 1회, 2번 카카오톡 알림이 발송됩니다. 알림은 주문/클레임 담당자 번호로 가며, 010으로 시작하는 휴대폰 번호만 받을 수 있습니다. 오로라 > 담당자 정보 > 주문/클레임 담당자 정보에서 번호를 확인·변경해 주세요.\" 안내 후 상담 종료 (유형: PA004001))\n(상품문의와 주문문의 차이 → \"상품문의는 구매 여부와 관계없이 누구나 등록할 수 있고, 주문문의는 해당 상품을 주문한 고객만 등록할 수 있습니다.\" 안내 후 상담 종료 (유형: PA004001))\n(그 외 KMS에 없는 내용 → 상담원 인계 (T5))", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 문의 게시판 관련해 어떤<br/>도움이 필요하신가요?\"]:::bot\nN2_1{{\"상품문의 답변 수정\"}}:::sec\nN2_1_2[\"<b>2<\/b> 상품문의 답변은 파트너님께서 최초 1회만<br/>작성하실 수 있고, 이후 추가 작성이나<br/>수정은 파트너센터에서 처리해 드립니다.<br/>수정할 상품문의 번호를 알려 주세요.\"]:::bot\nN2_1_2_1_1[\"<b>2-1-1<\/b> 아직 답변을 등록하지 않으신 문의라면 최초<br/>답변은 오로라 › 문의/리뷰 › 상품문의에서<br/>직접 등록해 주세요.\"]:::bot\nN2_1_3[\"<b>3<\/b> 수정하실 답변 내용을 텍스트로 보내 주시고,<br/>수정 사유도 함께 알려 주세요. 이미지나<br/>파일이면 내용을 글로 옮겨 주시면 됩니다.\"]:::bot\nN2_1_4[\"<b>4<\/b> 기존 답변은 그대로 두고, 그 아래에<br/>'파트너사 요청에 의해 변경/수정된<br/>답변입니다' 문구와 함께 보내 주신 내용이<br/>추가되는 방식으로 반영됩니다. 욕설 등<br/>부적절한 표현이 있으면 반영이 어려울 수<br/>있습니다. 상담원이 확인 후 처리해<br/>드리겠습니다.\"]:::bot\nN2_2{{\"주문문의 답변 수정\"}}:::sec\nN2_2_2[\"<b>2<\/b> 주문문의에 등록된 답변은 시스템상 수정이<br/>불가합니다. 번거로우시겠지만 고객님께 전화나<br/>문자로 수정 내용을 직접 안내해 주세요.<br/>주문문의 수정·블라인드·삭제도 어려워<br/>고객님께 개별 연락으로 다시 안내<br/>부탁드립니다.\"]:::bot\nN2_3{{\"고객센터 문의 답변 수정\"}}:::sec\nN2_3_2[\"<b>2<\/b> 고객센터 문의에 등록하신 답변은 수정이<br/>불가합니다. 수정이 필요한 내용을 적어<br/>주시면 고객센터 담당자에게 전달드리겠습니다.<br/>고객센터 문의 번호와 수정할 내용을 알려<br/>주세요.\"]:::bot\nN2_4{{\"문의글 삭제·블라인드\"}}:::sec\nN2_4_2[\"<b>2<\/b> 문의 게시글은 기본적으로 삭제가 불가하며,<br/>유관 부서 검토 후 블라인드 처리 여부가<br/>결정됩니다. 어떤 문의글인가요?\"]:::bot\nN2_4_3_1[\"<b>3-1<\/b> 아래 내용을 알려 주세요.\"]:::bot\nN2_4_4[\"<b>4<\/b> 담당 부서 검토 결과에 따라 블라인드 여부가<br/>정해지는 점 양해 부탁드립니다. 상담원이<br/>접수해 드리겠습니다.\"]:::bot\nN2_4_3_2[\"<b>3-2<\/b> 해당 광고성 문의글의 문의번호와 상품번호를<br/>알려 주세요.\"]:::bot\nN2_5{{\"답변자명 변경\"}}:::sec\nN2_5_2[\"<b>2<\/b> 어느 게시판의 답변자명인가요?\"]:::bot\nN2_5_3_1[\"<b>3-1<\/b> 상품문의 답변자명은 따로 수정할 수 없고,<br/>판매자 또는 셀러샵명으로 표시됩니다. 실제<br/>샵명과 다르게 보인다면 오늘의집 앱에<br/>로그인하신 뒤 마이페이지 › 프로필 닉네임이<br/>그 이름으로 되어 있는지 확인하시고 닉네임을<br/>변경해 주세요.\"]:::bot\nN2_5_3_2[\"<b>3-2<\/b> 주문문의 답변자명은 주문 시점의 브랜드명으로<br/>표시됩니다. 이미 표시된 답변자명은 바꿀 수<br/>없고, 브랜드명을 변경하시면 변경 이후<br/>작성된 주문문의부터 새 브랜드명으로<br/>표시됩니다. 브랜드명 변경을 원하시면<br/>상품번호, 기존 브랜드명, 변경 브랜드명을<br/>알려 주세요.\"]:::bot\nN2_6{{\"미답변 건수가 안 맞아요\"}}:::sec\nN2_6_2[\"<b>2<\/b> 오로라 홈 화면의 상품문의·주문문의 현황<br/>건수는 부득이 정합성이 맞지 않을 수<br/>있습니다. 개발팀에서 인지하고 개선<br/>예정이지만 반영까지 시일이 걸릴 수 있어,<br/>해당 메뉴에서 실제로 보이는 건에 답변<br/>부탁드립니다. 고객센터 문의 건수는 홈<br/>화면에 포함되지 않으니 오로라 › 문의/리뷰<br/>› 고객센터 문의에서 따로 확인해 주세요.\"]:::bot\nN2_6_3[\"<b>3<\/b> 확인이 필요해 담당 부서에 전달드리겠습니다.<br/>해당 상품번호를 알려 주세요.\"]:::bot\nN2_7{{\"기타\"}}:::sec\nS --> N1\nN1 -->|\"리뷰 답글 요청이면\"| SW_PA004002\nN1 -->|\"상품문의 답변 수정\"| N2_1\nN2_1_2 -->|\"네\"| N2_1_3\nN2_1_2 -->|\"아니요\"| N2_1_2_1_1\nN2_1_2_1_1 --> END\nN2_1_2 -->|\"문의번호\"| N2_1_3\nN2_1_3 -->|\"수정 답변 내용, 사유\"| N2_1_4\nN2_1_4 --> HO_T3A\nN1 -->|\"주문문의 답변 수정\"| N2_2\nN2_2_2 --> END\nN1 -->|\"고객센터 문의 답변 수정\"| N2_3\nN2_3_2 --> HO_T3C\nN1 -->|\"문의글 삭제·블라인드\"| N2_4\nN2_4_2 -->|\"고객이 쓴 문의글\"| N2_4_3_1\nN2_4_2 -->|\"광고성 문의글\"| N2_4_3_2\nN2_4_3_1 -->|\"문의번호, 상품번호, 작성자, 사유\"| N2_4_4\nN2_4_4 --> HO_T3C\nN2_4_3_2 --> HO_T3C\nN1 -->|\"답변자명 변경\"| N2_5\nN2_5_2 -->|\"상품문의\"| N2_5_3_1\nN2_5_2 -->|\"주문문의\"| N2_5_3_2\nN2_5_3_1 --> END\nN2_5_3_2 -->|\"상품번호, 기존 브랜드명, 변경 브랜드명\"| HO_T3A\nN2_5_3_2 -->|\"아니요\"| END\nN1 -->|\"미답변 건수가 안 맞아요\"| N2_6\nN2_6_2 -->|\"메뉴에 들어가도 미답변 문의가 안 보여요\"| N2_6_3\nN2_6_2 -->|\"알겠어요\"| END\nN2_6_3 --> HO_T3C\nN1 -->|\"기타\"| N2_7\nN2_7 -->|\"미답변 패널티 문의\"| END\nN2_7 -->|\"주문문의 알림 문의\"| END\nN2_7 -->|\"상품문의와 주문문의 차이\"| END\nN2_7 -->|\"그 외 KMS에 없는 내용\"| HO_T5\nN2_1 --> N2_1_2\nN2_2 --> N2_2_2\nN2_3 --> N2_3_2\nN2_4 --> N2_4_2\nN2_5 --> N2_5_2\nN2_6 --> N2_6_2\nSW_PA004002[/\"「고객리뷰」로 전환\"/]:::sw\nEND([\"상담 종료\"]):::fin\nHO_T3A([\"상담원 인계<br/>실행 요청\"]):::ho\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nHO_T5([\"상담원 인계<br/>답변 불가\"]):::ho", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 문의 게시판 관련해 어떤 도움이 필요하신가요?", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "상품문의 답변 수정", "sec": true, "body": []}, {"k": "2-1/2", "id": "2", "t": "상품문의 답변은 파트너님께서 최초 1회만 작성하실 수 있고, 이후 추가 작성이나 수정은 파트너센터에서 처리해 드립니다. 수정할 상품문의 번호를 알려 주세요.", "sec": false, "body": ["이미 답변을 등록하신 문의인가요?"]}, {"k": "2-1/2-1-1", "id": "2-1-1", "t": "아직 답변을 등록하지 않으신 문의라면 최초 답변은 오로라 > 문의/리뷰 > 상품문의에서 직접 등록해 주세요.", "sec": false, "body": []}, {"k": "2-1/3", "id": "3", "t": "수정하실 답변 내용을 텍스트로 보내 주시고, 수정 사유도 함께 알려 주세요. 이미지나 파일이면 내용을 글로 옮겨 주시면 됩니다.", "sec": false, "body": []}, {"k": "2-1/4", "id": "4", "t": "기존 답변은 그대로 두고, 그 아래에 '파트너사 요청에 의해 변경/수정된 답변입니다' 문구와 함께 보내 주신 내용이 추가되는 방식으로 반영됩니다. 욕설 등 부적절한 표현이 있으면 반영이 어려울 수 있습니다. 상담원이 확인 후 처리해 드리겠습니다.", "sec": false, "body": []}, {"k": "2-2", "id": "2-2", "t": "주문문의 답변 수정", "sec": true, "body": []}, {"k": "2-2/2", "id": "2", "t": "주문문의에 등록된 답변은 시스템상 수정이 불가합니다. 번거로우시겠지만 고객님께 전화나 문자로 수정 내용을 직접 안내해 주세요. 주문문의 수정·블라인드·삭제도 어려워 고객님께 개별 연락으로 다시 안내 부탁드립니다.", "sec": false, "body": []}, {"k": "2-3", "id": "2-3", "t": "고객센터 문의 답변 수정", "sec": true, "body": []}, {"k": "2-3/2", "id": "2", "t": "고객센터 문의에 등록하신 답변은 수정이 불가합니다. 수정이 필요한 내용을 적어 주시면 고객센터 담당자에게 전달드리겠습니다. 고객센터 문의 번호와 수정할 내용을 알려 주세요.", "sec": false, "body": []}, {"k": "2-4", "id": "2-4", "t": "문의글 삭제·블라인드", "sec": true, "body": []}, {"k": "2-4/2", "id": "2", "t": "문의 게시글은 기본적으로 삭제가 불가하며, 유관 부서 검토 후 블라인드 처리 여부가 결정됩니다. 어떤 문의글인가요?", "sec": false, "body": []}, {"k": "2-4/3-1", "id": "3-1", "t": "아래 내용을 알려 주세요.", "sec": false, "body": ["- 문의번호", "- 상품번호", "- 작성자", "- 요청 사유"]}, {"k": "2-4/4", "id": "4", "t": "담당 부서 검토 결과에 따라 블라인드 여부가 정해지는 점 양해 부탁드립니다. 상담원이 접수해 드리겠습니다.", "sec": false, "body": []}, {"k": "2-4/3-2", "id": "3-2", "t": "해당 광고성 문의글의 문의번호와 상품번호를 알려 주세요.", "sec": false, "body": []}, {"k": "2-5", "id": "2-5", "t": "답변자명 변경", "sec": true, "body": []}, {"k": "2-5/2", "id": "2", "t": "어느 게시판의 답변자명인가요?", "sec": false, "body": []}, {"k": "2-5/3-1", "id": "3-1", "t": "상품문의 답변자명은 따로 수정할 수 없고, 판매자 또는 셀러샵명으로 표시됩니다. 실제 샵명과 다르게 보인다면 오늘의집 앱에 로그인하신 뒤 마이페이지 > 프로필 닉네임이 그 이름으로 되어 있는지 확인하시고 닉네임을 변경해 주세요.", "sec": false, "body": []}, {"k": "2-5/3-2", "id": "3-2", "t": "주문문의 답변자명은 주문 시점의 브랜드명으로 표시됩니다. 이미 표시된 답변자명은 바꿀 수 없고, 브랜드명을 변경하시면 변경 이후 작성된 주문문의부터 새 브랜드명으로 표시됩니다. 브랜드명 변경을 원하시면 상품번호, 기존 브랜드명, 변경 브랜드명을 알려 주세요.", "sec": false, "body": []}, {"k": "2-6", "id": "2-6", "t": "미답변 건수가 안 맞아요", "sec": true, "body": []}, {"k": "2-6/2", "id": "2", "t": "오로라 홈 화면의 상품문의·주문문의 현황 건수는 부득이 정합성이 맞지 않을 수 있습니다. 개발팀에서 인지하고 개선 예정이지만 반영까지 시일이 걸릴 수 있어, 해당 메뉴에서 실제로 보이는 건에 답변 부탁드립니다. 고객센터 문의 건수는 홈 화면에 포함되지 않으니 오로라 > 문의/리뷰 > 고객센터 문의에서 따로 확인해 주세요.", "sec": false, "body": []}, {"k": "2-6/3", "id": "3", "t": "확인이 필요해 담당 부서에 전달드리겠습니다. 해당 상품번호를 알려 주세요.", "sec": false, "body": []}, {"k": "2-7", "id": "2-7", "t": "기타", "sec": true, "body": []}], "hocond": "상품문의 답변 수정(어드민 추가 작성)·브랜드명 변경 T3-A, 고객센터 문의 답변 수정·문의글 블라인드·광고성 문의글·미답변 정합성 확인 T3-C, KMS 없는 내용 T5", "hoinfo": "상품문의 번호, 파트너가 답한 기존 답변 등록 여부, 수정할 답변 내용(텍스트), 수정 사유 / 블라인드 대상 문의번호·상품번호·작성자·요청 사유 / 고객센터 문의 번호와 수정 내용 / 브랜드명 변경 시 상품번호·기존·변경 브랜드명 / 미답변 정합성 건 상품번호", "kms": "064_리뷰_문의.md, 093_고객센터_협업_유형_및_이관_방법.md, 092_관리자_이관_유형_및_방법.md, 084_파트너센터_교육자료__오로라.md, 087_오로라__.md, 060_상담_태그별_주요_문의유형_.md", "check": "1) 오로라 메뉴 경로 표기 상충: 084 '오로라 > 상품문의'·'오로라 > 주문문의', 064 '오로라 > 문의/후기 > 주문문의', '오로라 > 문의/리뷰 > 고객센터 문의'. 상품문의 답변 등록 경로를 하나로 확인 필요. 2) 미답변 건수 불일치: 064는 비밀글·숨김 확인 후 서비스운영팀 전달, 087은 정합성 양해 후 실제 보이는 건만 답변 안내, 어느 기준에서 인계할지 확인 필요. 3) 상품문의 첫 답변 '대리 등록' 요청은 KMS 근거 없음(파트너 최초 1회 직접 작성만 있음). 4) 블라인드 처리 기준 KMS 없음. 5) 슬랙 채널 표기와 ECA 이관이 함께 적혀 있어 실제 이관 경로(ECA 리뷰관련요청 vs 서비스운영 전달) 확정 필요. 6) 브랜드명 변경 요청은 다른 ECA 유형으로 바꿔 찍어야 하는지 7) (1차 전환) 기존 답변 등록 여부를 파트너 답변으로 판단함. 파트너가 '아니요'라고 했는데 실제로는 답변이 있는 경우의 처리 기준 확인 필요. 8) (W-06 확보 시) 부적절한 표현을 누가 거를지(챗봇 자동 판단 vs 상담원 검토) 확인 필요", "api": "R-11, W-06", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 요청 내용: \n· (해당 시: 상품문의 답변 수정·추가) 상품문의 번호: \n· 수정·추가할 답변 내용: \n· 수정 사유: \n· (해당 시: 고객센터 문의 답변 수정) 고객센터 문의 번호와 수정할 내용: \n· (해당 시: 삭제·블라인드) 문의번호·상품번호·작성자·요청 사유: \n· (주문문의 답변자명을 브랜드명 변경으로 바꾸려는 경우) 상품번호·기존 브랜드명·변경 브랜드명: \n· (해당 시: 메뉴에서도 미답변 문의가 안 보임) 상품번호: \n\n문의 내용: ", "mode": "조건별: 주문문의 답변 수정 불가·답변자명·미답변 건수·알림·패널티·문의 종류 차이는 자동답변 종결 / 상품문의 답변 추가 작성·고객센터 문의 수정·블라인드·브랜드명 변경·메뉴에서도 안 보이는 미답변은 상담원 배정", "segs": [{"c": ["A"], "t": "주문문의 답변 수정 불가·답변자명·미답변 건수·알림·패널티·문의 종류 차이는 자동답변 종결"}, {"c": ["C"], "t": "상품문의 답변 추가 작성·고객센터 문의 수정·블라인드·브랜드명 변경·메뉴에서도 안 보이는 미답변은 상담원 배정"}], "auto": "(공통 첫인사)\n\n[주문문의 답변을 수정하시려는 경우]\n주문문의에 등록된 답변은 시스템상 수정이 불가합니다. 번거로우시겠지만 고객님께 전화나 문자로 수정 내용을 직접 안내해 주세요. 주문문의 수정·블라인드·삭제도 어려워 고객님께 개별 연락으로 다시 안내 부탁드립니다.\n\n[답변자명을 바꾸시려는 경우]\n- 상품문의: 답변자명은 따로 수정할 수 없고 판매자 또는 셀러샵명으로 표시됩니다. 실제 샵명과 다르게 보이면 오늘의집 앱에 로그인하신 뒤 마이페이지 > 프로필 닉네임이 그 이름으로 되어 있는지 확인하시고 닉네임을 변경해 주세요.\n- 주문문의: 주문 시점의 브랜드명으로 표시됩니다. 이미 표시된 답변자명은 바꿀 수 없고, 브랜드명을 변경하시면 변경 이후 작성된 주문문의부터 새 브랜드명으로 표시됩니다. 브랜드명 변경이 필요하시면 세부 유형 '상품명·옵션명·브랜드명 변경 요청'으로 새 문의를 남겨 주세요.\n\n[미답변 건수가 실제와 다른 경우]\n오로라 홈 화면의 상품문의·주문문의 현황 건수는 부득이 실제와 맞지 않을 수 있습니다. 개발팀에서 인지하고 개선 예정이지만 반영까지 시일이 걸릴 수 있어, 해당 메뉴에서 실제로 보이는 건에 답변 부탁드립니다. 고객센터 문의 건수는 홈 화면에 포함되지 않으니 오로라 > 문의/리뷰 > 고객센터 문의에서 따로 확인해 주세요.\n메뉴에 들어가도 미답변 문의가 보이지 않으면 상품번호를 적어 새 문의로 남겨 주세요.\n\n[미답변 알림·패널티]\n48시간 안에 답변하지 않은 주문문의가 있으면 1일 1회, 2번 카카오톡 알림이 발송됩니다. 알림은 주문/클레임 담당자 번호로 가며 010으로 시작하는 휴대폰 번호만 받을 수 있습니다. 오로라 > 담당자 정보 > 주문/클레임 담당자 정보에서 번호를 확인·변경해 주세요.\n장기간 답변이 지연되면 단계적으로 상품 판매가 중지될 수 있고, 구매 건은 청약 철회(취소·환불)가 진행될 수 있습니다.\n\n[상품문의와 주문문의의 차이]\n상품문의는 구매 여부와 관계없이 누구나 등록할 수 있고, 주문문의는 해당 상품을 주문한 고객님만 등록할 수 있습니다.\n(맺음 A)", "ack": "남겨 주신 내용을 확인한 뒤 처리하겠습니다.\n(상품문의 답변 추가: \"상품문의 답변은 기존 답변을 그대로 두고, 그 아래에 '파트너사 요청에 의해 변경/수정된 답변입니다' 문구와 함께 보내 주신 내용이 추가되는 방식으로 반영됩니다. 부적절한 표현이 있으면 반영이 어려울 수 있습니다.\")\n(블라인드: \"문의 게시글은 기본적으로 삭제가 불가하며, 담당 부서 검토 후 블라인드 여부가 결정됩니다.\")\n(고객센터 문의 답변 수정: \"고객센터 문의에 등록하신 답변은 수정이 불가해, 수정할 내용을 고객센터 담당자에게 전달드리겠습니다.\")", "info": "상품문의 번호, 추가할 답변 내용(텍스트)과 수정 사유 / 블라인드 대상 문의번호·상품번호·작성자·사유 / 고객센터 문의 번호와 수정 내용 / 브랜드명 변경 시 상품번호·기존·변경 브랜드명 / 미답변 건 상품번호", "kms": "064_리뷰_문의.md, 093_고객센터_협업_유형_및_이관_방법.md, 092_관리자_이관_유형_및_방법.md, 084_파트너센터_교육자료__오로라.md, 087_오로라__.md, 086_상담_양식___첨부_파일__.md", "check": "1) 상품문의 최초 답변 등록 경로 표기 상충: 084 '오로라 > 상품문의' vs 064 '오로라 > 문의/후기 > …' — 확정 전까지 '최초 답변은 파트너 직접 등록' 안내 단락은 넣지 않음\n2) 미답변 건수 불일치 처리: 064(비밀글·숨김 확인 후 전달) vs 087(정합성 양해 후 보이는 건만 답변) — 087 기준으로 씀\n3) 블라인드 처리 기준 KMS 없음\n4) 상품문의 첫 답변을 대신 등록해 달라는 요청은 KMS 근거 없음 (상담원 배정)\n5) 브랜드명 변경을 이 유형으로 찍을지 PA003004로 찍을지"}}, {"code": "PA004002", "draft": false, "name": "고객리뷰", "mid": "문의/리뷰", "vol": "321", "mode": "안내 후 조건부 상담원 연결", "utter": "리뷰에 답글 달아주세요\n악성 리뷰 블라인드 해주세요. 사실이 아닌 내용이에요\n옵션 합쳐서 상품 새로 등록했는데 기존 리뷰 옮길 수 있나요?", "raw": "1. 네, 파트너님. 고객 리뷰 관련해 어떤 도움이 필요하신가요?\n[리뷰 답글 작성·수정] [리뷰 블라인드·삭제] [리뷰 이관] [비구매 리뷰] [리뷰 노출·기타]\n(리뷰 작성 고객의 정보·연락처를 요청하면 → 유형 PA010001 시나리오로 전환)\n(상품문의 답변이면 → 유형 PA004001 시나리오로 전환)\n\n2-1. [리뷰 답글 작성·수정]\n2. 리뷰 답글 작성·수정은 오늘의집 담당 부서에서 처리해 드립니다. 다만 별점만 남긴 리뷰는 댓글 작성이 불가합니다. 답글을 달 리뷰가 처음부터 글과 함께 작성된 리뷰인가요?\n[네, 글이 있는 리뷰예요] → 3\n[별점만 있는 리뷰예요 / 별점 리뷰에 나중에 글이 추가됐어요] → 2-1-1\n[잘 모르겠어요] → 3\n2-1-1. 별점만 남긴 리뷰는 댓글 작성이 불가합니다. 처음에 별점 리뷰로 등록된 뒤 글이 추가된 경우에도 댓글을 달 수 없는 점 양해 부탁드립니다.\n→ 상담 종료 (유형: PA004002)\n3. 답글을 달 리뷰번호와 작성자, 주문번호(알고 계시면)를 알려 주시고, 작성하실 답글 내용을 텍스트로 보내 주세요. 요청 사유도 함께 알려 주세요. 이미지나 파일이면 내용을 글로 옮겨 주시면 됩니다.\n[리뷰번호, 작성자, 주문번호, 답글 내용, 사유]\n4. 담당 부서에서 내용을 검토한 뒤 답글을 작성해 드립니다. 리뷰 운영 정책에 따라 불필요한 표현이 걸러질 수 있고, 리뷰에 적혀 있지 않은 내용은 댓글로 쓰기 어려워 요청하신 내용이 그대로 반영되지 않을 수 있습니다. 상담원이 접수해 드리겠습니다.\n→ 상담원 인계 (T3-C)\n\n2-2. [리뷰 블라인드·삭제]\n2. 리뷰는 고객님의 자유 의사로 작성된 것이라 삭제는 불가합니다. 다만 사실과 다른 내용, 욕설·심각한 비방, 리뷰 도배 등으로 업무에 방해가 되는 경우 담당 부서에서 오늘의집 리뷰 정책에 따라 검토합니다. 아래 내용을 알려 주세요.\n- 리뷰번호\n- 작성자\n- 주문번호(알고 계시면)\n- 요청 사유(어떤 부분이 사실과 다른지 등)\n[리뷰번호, 작성자, 주문번호, 사유]\n3. 검토 결과에 따라 블라인드 여부가 정해지는 점 양해 부탁드립니다. 참고로 파트너님께서 고객님께 리뷰 삭제·수정을 직접 요청하시면 안 되며, 이로 인해 문제가 생기면 책임이 파트너사에 있습니다. 상담원이 접수해 드리겠습니다.\n→ 상담원 인계 (T3-C)\n\n2-3. [리뷰 이관]\n2. 어떤 리뷰를 옮기시려는 건가요?\n[오늘의집 상품 → 오늘의집 다른 상품] → 3-1\n[다른 쇼핑몰 리뷰 → 오늘의집 상품] → 3-2\n3-1. 같은 셀러샵 안의 상품끼리, 상품명·크기·색상·구성·상품상태·증정품 등 옵션 구성이 모두 같은 경우에만 이관할 수 있습니다. 이관할 리뷰의 옵션이 새 상품에서 판매 중이어야 하고, 구매자 리뷰만 이관되며(비구매 리뷰 제외), 판매정지(신고) 상품은 이관할 수 없습니다. 오감리뷰는 진행 증빙을 첨부하시면 이관할 수 있습니다. 리뷰는 골라서 옮길 수 없고 기존 상품의 리뷰 전체가 이관되며, 스크랩 수는 이관되지 않습니다.\n오늘의집 담당 MD가 배정된 샵이신가요?\n[네, 담당 MD가 있어요] → 3-1-1\n[아니요, 담당 MD가 없어요] → 3-1-2\n[잘 모르겠어요] → 3-3\n3-1-1. 리뷰 이관은 담당 MD님께 문의해 주세요.\n→ 상담 종료 (유형: PA004002)\n3-1-2. 리뷰를 이관하면 기존 상품은 판매정지 처리됩니다. 동의하시면 기존 상품번호, 새 상품번호, 이관 사유(전체 옵션 통합, 일부 옵션 통합 등)를 알려 주세요.\n[동의, 기존 상품번호, 새 상품번호, 사유]\n→ 상담원 인계 (T3-C)\n[동의하지 않아요] → 상담 종료 (유형: PA004002)\n3-2. 타 플랫폼 리뷰는 아래 기준을 충족해야 이관할 수 있습니다.\n- 기존 리뷰가 10개 미만인 상품코드에 1개당 최대 5개까지\n- 오늘의집 판매 옵션명과 같은 옵션\n- 포토리뷰만 가능\n- SNS 후기·대가성 후기(금전, 무상 제공) 제외, 실제 판매 리뷰만 가능\n오늘의집 담당 MD가 배정된 샵이신가요?\n[네, 담당 MD가 있어요] → 3-1-1\n[아니요, 담당 MD가 없어요] → 3-2-1\n[잘 모르겠어요] → 3-3\n3-2-1. 신청 양식을 작성해 Ohouse.review@bucketplace.net 으로 메일 보내 주세요. 메일 제목은 '(파트너리뷰) 파트너명_작성날짜'로 적어 주시면 됩니다. 검토는 순차적으로 진행되며 최대 7영업일 걸릴 수 있고, 반려는 따로 안내되지 않습니다. 옵션이 2개면 '색상: 스톤 쿨 그레이 / 사이즈: 100*150cm'처럼 오늘의집 판매 옵션명과 똑같이 나눠 적어 주세요. 실판매페이지 URL에는 이관할 리뷰를 확인할 수 있는 주소를 적어 주세요.\n(신청 양식 파일 제공 → {확인 필요: 챗봇 양식 첨부 가능 여부})\n→ 상담 종료 (유형: PA004002)\n3-3. 담당 MD 배정 여부에 따라 이관 경로가 달라 확인이 필요합니다. 기존 상품번호와 새 상품번호(다른 쇼핑몰 리뷰면 오늘의집 상품번호)를 알려 주세요. 상담원이 이어서 도와드리겠습니다.\n[기존 상품번호, 새 상품번호]\n→ 상담원 인계 (T3-D)\n\n2-4. [비구매 리뷰]\n2. 비구매 리뷰는 같은 상품을 다른 쇼핑몰에서 구매했거나 체험단으로 작성한 리뷰 등으로, 오늘의집 계정이 있으면 작성할 수 있고 심사 후 등록 여부가 결정됩니다. 어떤 문의이신가요?\n[승인이 안 돼요 / 숨김 처리됐어요] → 3\n[작성 기준이 궁금해요] → 상담 종료 (유형: PA004002)\n3. 리뷰가 작성된 지 5영업일이 지났나요?\n[아니요] → 4-1\n[네 / 숨김 처리됐어요] → 4-2\n4-1. 비구매 리뷰는 심사 후 등록되니 조금만 기다려 주세요.\n→ 상담 종료 (유형: PA004002)\n4-2. 확인을 위해 리뷰번호, 작성자, 요청 내용을 알려 주세요.\n[리뷰번호, 작성자, 요청 내용]\n→ 상담원 인계 (T3-C)\n\n2-5. [리뷰 노출·기타]\n(리뷰 노출 순서 → \"리뷰는 텍스트 길이, 최신 작성일, 도움이돼요 수, 사진 유무, 리뷰 토픽 종류, 부적합 사진 여부 등을 점수화해 정렬됩니다. 그 외 자세한 기준은 공유가 어려운 점 양해 부탁드립니다.\" 안내 후 상담 종료 (유형: PA004002))\n(리뷰가 사라졌어요 → \"리뷰는 기간이 지나 사라지지 않습니다. 고객님이 직접 삭제하시거나 리뷰 정책 위반으로 블라인드된 경우에만 노출되지 않습니다. 주문이 취소·반품되어도 작성된 리뷰는 삭제되지 않습니다. 모음전을 삭제하면 리뷰도 자동 삭제됩니다.\" 안내 후 상담 종료 (유형: PA004002))\n(리뷰 작성 기간 → \"구매확정 후 기간 제한 없이 작성할 수 있고, 환불 후에는 구매리뷰를 작성할 수 없습니다.\" 안내 후 상담 종료 (유형: PA004002))\n(베스트리뷰 순위 변경 → \"베스트리뷰 노출은 파트너사에서 선택하거나 변경하실 수 없는 영역이라 도움드리기 어려운 점 양해 부탁드립니다.\" 안내 후 상담 종료 (유형: PA004002))\n(포토리뷰 마케팅 활용 → \"고객 리뷰를 활용하려면 해당 고객님의 동의가 필요합니다. 고객님과 통화로 동의를 확인하시고 증빙을 꼭 보관해 주세요.\" 안내. [오늘의집에서 대신 확인해 주세요] → 리뷰번호·활용 목적 수집 후 상담원 인계 (T3-C))\n(리뷰 작성 유도 광고 → \"오늘의집 주문 고객에게 리뷰를 유도하는 광고는 권고하지 않습니다. 광고성 알림 수신 동의 등이 필요할 수 있어, 클레임이 생기면 사실관계 확인 후 조치가 진행될 수 있습니다.\" 안내 후 상담 종료 (유형: PA004002))\n(스타일링샷 삭제 요청 → \"스타일링샷은 같은 상품이 아닌 경우(오노출)에만 삭제·비노출 처리가 가능합니다.\" 안내. 오노출이면 상품번호·스타일링샷 링크 수집 후 상담원 인계 (T3-C) / 아니면 상담 종료) {확인 필요: 스타일링샷 ECA 유형 코드}\n(그 외 KMS에 없는 내용 → 상담원 인계 (T5))", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 고객 리뷰 관련해 어떤<br/>도움이 필요하신가요?\"]:::bot\nN2_1{{\"리뷰 답글 작성·수정\"}}:::sec\nN2_1_2[\"<b>2<\/b> 리뷰 답글 작성·수정은 오늘의집 담당<br/>부서에서 처리해 드립니다. 다만 별점만 남긴<br/>리뷰는 댓글 작성이 불가합니다. 답글을 달<br/>리뷰가 처음부터 글과 함께 작성된<br/>리뷰인가요?\"]:::bot\nN2_1_2_1_1[\"<b>2-1-1<\/b> 별점만 남긴 리뷰는 댓글 작성이 불가합니다.<br/>처음에 별점 리뷰로 등록된 뒤 글이 추가된<br/>경우에도 댓글을 달 수 없는 점 양해<br/>부탁드립니다.\"]:::bot\nN2_1_3[\"<b>3<\/b> 답글을 달 리뷰번호와 작성자, 주문번호(알고<br/>계시면)를 알려 주시고, 작성하실 답글<br/>내용을 텍스트로 보내 주세요. 요청 사유도<br/>함께 알려 주세요. 이미지나 파일이면 내용을<br/>글로 옮겨 주시면 됩니다.\"]:::bot\nN2_1_4[\"<b>4<\/b> 담당 부서에서 내용을 검토한 뒤 답글을<br/>작성해 드립니다. 리뷰 운영 정책에 따라<br/>불필요한 표현이 걸러질 수 있고, 리뷰에<br/>적혀 있지 않은 내용은 댓글로 쓰기 어려워<br/>요청하신 내용이 그대로 반영되지 않을 수<br/>있습니다. 상담원이 접수해 드리겠습니다.\"]:::bot\nN2_2{{\"리뷰 블라인드·삭제\"}}:::sec\nN2_2_2[\"<b>2<\/b> 리뷰는 고객님의 자유 의사로 작성된 것이라<br/>삭제는 불가합니다. 다만 사실과 다른 내용,<br/>욕설·심각한 비방, 리뷰 도배 등으로 업무에<br/>방해가 되는 경우 담당 부서에서 오늘의집<br/>리뷰 정책에 따라 검토합니다. 아래 내용을<br/>알려 주세요.\"]:::bot\nN2_2_3[\"<b>3<\/b> 검토 결과에 따라 블라인드 여부가 정해지는<br/>점 양해 부탁드립니다. 참고로 파트너님께서<br/>고객님께 리뷰 삭제·수정을 직접 요청하시면<br/>안 되며, 이로 인해 문제가 생기면 책임이<br/>파트너사에 있습니다. 상담원이 접수해<br/>드리겠습니다.\"]:::bot\nN2_3{{\"리뷰 이관\"}}:::sec\nN2_3_2[\"<b>2<\/b> 어떤 리뷰를 옮기시려는 건가요?\"]:::bot\nN2_3_3_1[\"<b>3-1<\/b> 같은 셀러샵 안의 상품끼리,<br/>상품명·크기·색상·구성·상품상태·증정품 등<br/>옵션 구성이 모두 같은 경우에만 이관할 수<br/>있습니다. 이관할 리뷰의 옵션이 새 상품에서<br/>판매 중이어야 하고, 구매자 리뷰만<br/>이관되며(비구매 리뷰 제외),<br/>판매정지(신고) 상품은 이관할 수 없습니다.<br/>오감리뷰는 진행 증빙을 첨부하시면 이관할 수<br/>있습니다. 리뷰는 골라서 옮길 수 없고 기존<br/>상품의 리뷰 전체가 이관되며, 스크랩 수는<br/>이관되지 않습니다.\"]:::bot\nN2_3_3_1_1[\"<b>3-1-1<\/b> 리뷰 이관은 담당 MD님께 문의해 주세요.\"]:::bot\nN2_3_3_1_2[\"<b>3-1-2<\/b> 리뷰를 이관하면 기존 상품은 판매정지<br/>처리됩니다. 동의하시면 기존 상품번호, 새<br/>상품번호, 이관 사유(전체 옵션 통합, 일부<br/>옵션 통합 등)를 알려 주세요.\"]:::bot\nN2_3_3_2[\"<b>3-2<\/b> 타 플랫폼 리뷰는 아래 기준을 충족해야<br/>이관할 수 있습니다.\"]:::bot\nN2_3_3_2_1[\"<b>3-2-1<\/b> 신청 양식을 작성해<br/>Ohouse.review@bucketplace.net<br/>으로 메일 보내 주세요. 메일 제목은<br/>'(파트너리뷰) 파트너명_작성날짜'로 적어<br/>주시면 됩니다. 검토는 순차적으로 진행되며<br/>최대 7영업일 걸릴 수 있고, 반려는 따로<br/>안내되지 않습니다. 옵션이 2개면 '색상:<br/>스톤 쿨 그레이 / 사이즈:<br/>100*150cm'처럼 오늘의집 판매<br/>옵션명과 똑같이 나눠 적어 주세요.<br/>실판매페이지 URL에는 이관할 리뷰를 확인할<br/>수 있는 주소를 적어 주세요.\"]:::bot\nN2_3_3_3[\"<b>3-3<\/b> 담당 MD 배정 여부에 따라 이관 경로가<br/>달라 확인이 필요합니다. 기존 상품번호와 새<br/>상품번호(다른 쇼핑몰 리뷰면 오늘의집<br/>상품번호)를 알려 주세요. 상담원이 이어서<br/>도와드리겠습니다.\"]:::bot\nN2_4{{\"비구매 리뷰\"}}:::sec\nN2_4_2[\"<b>2<\/b> 비구매 리뷰는 같은 상품을 다른 쇼핑몰에서<br/>구매했거나 체험단으로 작성한 리뷰 등으로,<br/>오늘의집 계정이 있으면 작성할 수 있고 심사<br/>후 등록 여부가 결정됩니다. 어떤<br/>문의이신가요?\"]:::bot\nN2_4_3[\"<b>3<\/b> 리뷰가 작성된 지 5영업일이 지났나요?\"]:::bot\nN2_4_4_1[\"<b>4-1<\/b> 비구매 리뷰는 심사 후 등록되니 조금만<br/>기다려 주세요.\"]:::bot\nN2_4_4_2[\"<b>4-2<\/b> 확인을 위해 리뷰번호, 작성자, 요청 내용을<br/>알려 주세요.\"]:::bot\nN2_5{{\"리뷰 노출·기타\"}}:::sec\nS --> N1\nN1 -->|\"리뷰 작성 고객의 정보·연락처를 요청하면\"| SW_PA010001\nN1 -->|\"상품문의 답변이면\"| SW_PA004001\nN1 -->|\"리뷰 답글 작성·수정\"| N2_1\nN2_1_2 -->|\"네, 글이 있는 리뷰예요\"| N2_1_3\nN2_1_2 -->|\"별점 리뷰에 나중에 글이 추가됐어요\"| N2_1_2_1_1\nN2_1_2 -->|\"잘 모르겠어요\"| N2_1_3\nN2_1_2_1_1 --> END\nN2_1_3 -->|\"리뷰번호, 작성자, 주문번호, 답글 내용,<br/>사유\"| N2_1_4\nN2_1_4 --> HO_T3C\nN1 -->|\"리뷰 블라인드·삭제\"| N2_2\nN2_2_2 -->|\"리뷰번호, 작성자, 주문번호, 사유\"| N2_2_3\nN2_2_3 --> HO_T3C\nN1 -->|\"리뷰 이관\"| N2_3\nN2_3_2 -->|\"오늘의집 상품\"| TX4\nN2_3_2 -->|\"다른 쇼핑몰 리뷰\"| TX5\nN2_3_3_1 -->|\"네, 담당 MD가 있어요\"| N2_3_3_1_1\nN2_3_3_1 -->|\"아니요, 담당 MD가 없어요\"| N2_3_3_1_2\nN2_3_3_1 -->|\"잘 모르겠어요\"| N2_3_3_3\nN2_3_3_1_1 --> END\nN2_3_3_1_2 --> HO_T3C\nN2_3_3_1_2 -->|\"동의하지 않아요\"| END\nN2_3_3_1_2 -->|\"동의, 기존 상품번호, 새 상품번호, 사유\"| N2_3_3_2\nN2_3_3_2 -->|\"네, 담당 MD가 있어요\"| N2_3_3_1_1\nN2_3_3_2 -->|\"아니요, 담당 MD가 없어요\"| N2_3_3_2_1\nN2_3_3_2 -->|\"잘 모르겠어요\"| N2_3_3_3\nN2_3_3_2_1 -->|\"신청 양식 파일 제공\"| TX6\nN2_3_3_2_1 --> END\nN2_3_3_3 --> HO_T3D\nN1 -->|\"비구매 리뷰\"| N2_4\nN2_4_2 -->|\"숨김 처리됐어요\"| N2_4_3\nN2_4_2 -->|\"작성 기준이 궁금해요\"| END\nN2_4_3 -->|\"아니요\"| N2_4_4_1\nN2_4_3 -->|\"숨김 처리됐어요\"| N2_4_4_2\nN2_4_4_1 --> END\nN2_4_4_2 --> HO_T3C\nN1 -->|\"리뷰 노출·기타\"| N2_5\nN2_5 -->|\"리뷰 노출 순서\"| END\nN2_5 -->|\"리뷰가 사라졌어요\"| END\nN2_5 -->|\"리뷰 작성 기간\"| END\nN2_5 -->|\"베스트리뷰 순위 변경\"| END\nN2_5 -->|\"포토리뷰 마케팅 활용\"| HO_T3C\nN2_5 -->|\"리뷰 작성 유도 광고\"| END\nN2_5 -->|\"스타일링샷 삭제 요청\"| HO_T3C\nN2_5 -->|\"그 외 KMS에 없는 내용\"| HO_T5\nN2_1 --> N2_1_2\nN2_2 --> N2_2_2\nN2_3 --> N2_3_2\nN2_4 --> N2_4_2\nN2_3_2 -.-> N2_3_3_1\nSW_PA010001[/\"「고객 OB」로 전환\"/]:::sw\nSW_PA004001[/\"「문의게시판」로 전환\"/]:::sw\nEND([\"상담 종료\"]):::fin\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nTX4[\"오늘의집 다른 상품] →<br/>3-1\"]:::txt\nTX5[\"오늘의집 상품] → 3-2\"]:::txt\nTX6[\"(확인 필요: 챗봇 양식<br/>첨부 가능 여부)\"]:::txt\nHO_T3D([\"상담원 인계<br/>개별 조회 필요\"]):::ho\nHO_T5([\"상담원 인계<br/>답변 불가\"]):::ho", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 고객 리뷰 관련해 어떤 도움이 필요하신가요?", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "리뷰 답글 작성·수정", "sec": true, "body": []}, {"k": "2-1/2", "id": "2", "t": "리뷰 답글 작성·수정은 오늘의집 담당 부서에서 처리해 드립니다. 다만 별점만 남긴 리뷰는 댓글 작성이 불가합니다. 답글을 달 리뷰가 처음부터 글과 함께 작성된 리뷰인가요?", "sec": false, "body": []}, {"k": "2-1/2-1-1", "id": "2-1-1", "t": "별점만 남긴 리뷰는 댓글 작성이 불가합니다. 처음에 별점 리뷰로 등록된 뒤 글이 추가된 경우에도 댓글을 달 수 없는 점 양해 부탁드립니다.", "sec": false, "body": []}, {"k": "2-1/3", "id": "3", "t": "답글을 달 리뷰번호와 작성자, 주문번호(알고 계시면)를 알려 주시고, 작성하실 답글 내용을 텍스트로 보내 주세요. 요청 사유도 함께 알려 주세요. 이미지나 파일이면 내용을 글로 옮겨 주시면 됩니다.", "sec": false, "body": []}, {"k": "2-1/4", "id": "4", "t": "담당 부서에서 내용을 검토한 뒤 답글을 작성해 드립니다. 리뷰 운영 정책에 따라 불필요한 표현이 걸러질 수 있고, 리뷰에 적혀 있지 않은 내용은 댓글로 쓰기 어려워 요청하신 내용이 그대로 반영되지 않을 수 있습니다. 상담원이 접수해 드리겠습니다.", "sec": false, "body": []}, {"k": "2-2", "id": "2-2", "t": "리뷰 블라인드·삭제", "sec": true, "body": []}, {"k": "2-2/2", "id": "2", "t": "리뷰는 고객님의 자유 의사로 작성된 것이라 삭제는 불가합니다. 다만 사실과 다른 내용, 욕설·심각한 비방, 리뷰 도배 등으로 업무에 방해가 되는 경우 담당 부서에서 오늘의집 리뷰 정책에 따라 검토합니다. 아래 내용을 알려 주세요.", "sec": false, "body": ["- 리뷰번호", "- 작성자", "- 주문번호(알고 계시면)", "- 요청 사유(어떤 부분이 사실과 다른지 등)"]}, {"k": "2-2/3", "id": "3", "t": "검토 결과에 따라 블라인드 여부가 정해지는 점 양해 부탁드립니다. 참고로 파트너님께서 고객님께 리뷰 삭제·수정을 직접 요청하시면 안 되며, 이로 인해 문제가 생기면 책임이 파트너사에 있습니다. 상담원이 접수해 드리겠습니다.", "sec": false, "body": []}, {"k": "2-3", "id": "2-3", "t": "리뷰 이관", "sec": true, "body": []}, {"k": "2-3/2", "id": "2", "t": "어떤 리뷰를 옮기시려는 건가요?", "sec": false, "body": []}, {"k": "2-3/3-1", "id": "3-1", "t": "같은 셀러샵 안의 상품끼리, 상품명·크기·색상·구성·상품상태·증정품 등 옵션 구성이 모두 같은 경우에만 이관할 수 있습니다. 이관할 리뷰의 옵션이 새 상품에서 판매 중이어야 하고, 구매자 리뷰만 이관되며(비구매 리뷰 제외), 판매정지(신고) 상품은 이관할 수 없습니다. 오감리뷰는 진행 증빙을 첨부하시면 이관할 수 있습니다. 리뷰는 골라서 옮길 수 없고 기존 상품의 리뷰 전체가 이관되며, 스크랩 수는 이관되지 않습니다.", "sec": false, "body": ["오늘의집 담당 MD가 배정된 샵이신가요?"]}, {"k": "2-3/3-1-1", "id": "3-1-1", "t": "리뷰 이관은 담당 MD님께 문의해 주세요.", "sec": false, "body": []}, {"k": "2-3/3-1-2", "id": "3-1-2", "t": "리뷰를 이관하면 기존 상품은 판매정지 처리됩니다. 동의하시면 기존 상품번호, 새 상품번호, 이관 사유(전체 옵션 통합, 일부 옵션 통합 등)를 알려 주세요.", "sec": false, "body": []}, {"k": "2-3/3-2", "id": "3-2", "t": "타 플랫폼 리뷰는 아래 기준을 충족해야 이관할 수 있습니다.", "sec": false, "body": ["- 기존 리뷰가 10개 미만인 상품코드에 1개당 최대 5개까지", "- 오늘의집 판매 옵션명과 같은 옵션", "- 포토리뷰만 가능", "- SNS 후기·대가성 후기(금전, 무상 제공) 제외, 실제 판매 리뷰만 가능", "오늘의집 담당 MD가 배정된 샵이신가요?"]}, {"k": "2-3/3-2-1", "id": "3-2-1", "t": "신청 양식을 작성해 Ohouse.review@bucketplace.net 으로 메일 보내 주세요. 메일 제목은 '(파트너리뷰) 파트너명_작성날짜'로 적어 주시면 됩니다. 검토는 순차적으로 진행되며 최대 7영업일 걸릴 수 있고, 반려는 따로 안내되지 않습니다. 옵션이 2개면 '색상: 스톤 쿨 그레이 / 사이즈: 100*150cm'처럼 오늘의집 판매 옵션명과 똑같이 나눠 적어 주세요. 실판매페이지 URL에는 이관할 리뷰를 확인할 수 있는 주소를 적어 주세요.", "sec": false, "body": []}, {"k": "2-3/3-3", "id": "3-3", "t": "담당 MD 배정 여부에 따라 이관 경로가 달라 확인이 필요합니다. 기존 상품번호와 새 상품번호(다른 쇼핑몰 리뷰면 오늘의집 상품번호)를 알려 주세요. 상담원이 이어서 도와드리겠습니다.", "sec": false, "body": []}, {"k": "2-4", "id": "2-4", "t": "비구매 리뷰", "sec": true, "body": []}, {"k": "2-4/2", "id": "2", "t": "비구매 리뷰는 같은 상품을 다른 쇼핑몰에서 구매했거나 체험단으로 작성한 리뷰 등으로, 오늘의집 계정이 있으면 작성할 수 있고 심사 후 등록 여부가 결정됩니다. 어떤 문의이신가요?", "sec": false, "body": []}, {"k": "2-4/3", "id": "3", "t": "리뷰가 작성된 지 5영업일이 지났나요?", "sec": false, "body": []}, {"k": "2-4/4-1", "id": "4-1", "t": "비구매 리뷰는 심사 후 등록되니 조금만 기다려 주세요.", "sec": false, "body": []}, {"k": "2-4/4-2", "id": "4-2", "t": "확인을 위해 리뷰번호, 작성자, 요청 내용을 알려 주세요.", "sec": false, "body": []}, {"k": "2-5", "id": "2-5", "t": "리뷰 노출·기타", "sec": true, "body": []}], "hocond": "리뷰 답글·블라인드·비구매 리뷰 지연(5영업일 경과)·숨김·리뷰 이관(담당 MD 없음)·고객 동의 대리 확인·스타일링샷 오노출 T3-C, 리뷰 이관에서 담당 MD 배정 여부를 파트너가 모르면 상품번호를 받아 T3-D, KMS 없는 내용 T5", "hoinfo": "리뷰번호, 작성자, 주문번호(파트너가 알면), 파트너가 답한 별점 리뷰 여부, 답글 내용(텍스트)과 요청 사유 / 블라인드 사유 / 리뷰 이관 시 기존·신규 상품번호, 이관 사유, 기존 상품 판매정지 동의 여부, 파트너가 답한 담당 MD 유무(모름 포함) / 스타일링샷 상품번호·링크", "kms": "064_리뷰_문의.md, 093_고객센터_협업_유형_및_이관_방법.md, 095_커머스_정책_이관_유형_및_이관_방법.md, 084_파트너센터_교육자료__오로라.md, 060_상담_태그별_주요_문의유형_.md", "check": "1) 리뷰 블라인드 판단 기준 KMS 없음(정책 기반 평가라고만 있음), 챗봇은 접수만. 2) 이관 처리기한 1영업일을 파트너에게 소요기간으로 안내해도 되는지(092 공통 문구는 최대 5영업일). 3) GP 여부 조회 API 필요, 'GP'는 내부 용어라 파트너 문구에서는 뺐음. 4) 파트너리뷰 신청 양식 파일을 챗봇에서 제공할 수 있는지. 5) 슬랙 채널 표기와 ECA 이관 병기, 실제 이관 경로 확정 필요. 6) 스타일링샷 문의를 이 유형으로 찍을지 별도 코드가 있는지 7) (1차 전환) GP / GP 외 구분을 파트너 질문 '담당 MD가 배정된 샵인가요?(있음 / 없음)'로 바꿈(게시판과 같은 기준, 054 기준 GP는 MD 미배정 그룹). 파트너 자가 판단에 맡겨도 되는지 확인 필요. 8) (1차 전환) 별점 리뷰 여부를 파트너 답변으로 판단하므로, 모르는 경우는 접수(T3-C) 후 상담원이 확인함. 9) R-11 명세 출력에는 작성자·주문번호가 없어(작성자 개인정보 미반환) 블라인드 접수 때 작성자는 계속 파트너에게 받아야 함", "api": "R-11, R-07", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 요청 내용: \n· (해당 시: 답글·블라인드·비구매 리뷰) 리뷰번호: \n· (해당 시: 블라인드·비구매 리뷰) 작성자 닉네임: \n· (해당 시: 답글, 텍스트로) 답글 내용: \n· (해당 시: 답글·블라인드) 요청 사유: \n· (해당 시: 리뷰 이관) 담당 MD 유무 (있음 / 없음 / 모름): \n· (해당 시: 오늘의집 상품 간 이관) 기존 상품번호·새 상품번호·이관 사유: \n· 이관 시 기존 상품 판매정지 동의: \n· (해당 시: 비구매 리뷰) 리뷰 작성일: \n· (해당 시: 스타일링샷 삭제) 상품번호·스타일링샷 링크: \n\n문의 내용: ", "mode": "조건별: 노출 기준·작성 기간·별점 리뷰 댓글 불가·다른 쇼핑몰 리뷰 이관 기준·비구매 리뷰 5영업일 이내·마케팅 활용 기준·담당 MD가 있는 파트너의 이관 문의는 자동답변 종결 / 답글 작성·블라인드·오늘의집 상품 간 이관(담당 MD 없음)·비구매 리뷰 5영업일 경과·스타일링샷 오노출·담당 MD 유무 모름은 상담원 배정", "segs": [{"c": ["A"], "t": "노출 기준·작성 기간·별점 리뷰 댓글 불가·다른 쇼핑몰 리뷰 이관 기준·비구매 리뷰 5영업일 이내·마케팅 활용 기준·담당 MD가 있는 파트너의 이관 문의는 자동답변 종결"}, {"c": ["C"], "t": "답글 작성·블라인드·오늘의집 상품 간 이관(담당 MD 없음)·비구매 리뷰 5영업일 경과·스타일링샷 오노출·담당 MD 유무 모름은 상담원 배정"}], "auto": "(공통 첫인사)\n\n[리뷰 노출 순서·사라진 리뷰·작성 기간]\n- 리뷰는 텍스트 길이, 최신 작성일, 도움이돼요 수, 사진 유무, 리뷰 토픽 종류, 부적합 사진 여부 등을 점수화해 정렬되며, 그 외 자세한 기준은 공유가 어려운 점 양해 부탁드립니다. 베스트리뷰 노출은 파트너사에서 선택하거나 변경하실 수 없는 영역입니다.\n- 리뷰는 기간이 지나 사라지지 않습니다. 고객님이 직접 삭제하시거나 리뷰 정책 위반으로 블라인드된 경우에만 노출되지 않으며, 주문이 취소·반품되어도 작성된 리뷰는 삭제되지 않습니다. 모음전을 삭제하면 리뷰도 자동 삭제됩니다.\n- 구매확정 후 기간 제한 없이 작성할 수 있고, 환불 후에는 구매리뷰를 작성할 수 없습니다.\n- 별점만 남긴 리뷰는 댓글 작성이 불가하며, 처음에 별점 리뷰로 등록된 뒤 글이 추가된 경우에도 댓글을 달 수 없습니다.\n\n[다른 쇼핑몰 리뷰를 오늘의집 상품으로 옮기시려는 경우]\n타 플랫폼 리뷰는 아래 기준을 충족해야 이관할 수 있습니다.\n- 기존 리뷰가 10개 미만인 상품코드에 1개당 최대 5개까지\n- 오늘의집 판매 옵션명과 같은 옵션\n- 포토리뷰만 가능\n- SNS 후기·대가성 후기(금전, 무상 제공) 제외, 실제 판매 리뷰만 가능\n담당 MD가 있는 파트너님은 담당 MD께 문의해 주세요. 담당 MD가 없는 파트너님은 신청 양식을 작성해 Ohouse.review@bucketplace.net 으로 메일 보내 주세요. 메일 제목은 '(파트너리뷰) 파트너명_작성날짜'로 적어 주시면 됩니다. 검토는 순차적으로 진행되며 최대 7영업일 걸릴 수 있고, 반려는 따로 안내되지 않습니다. 옵션이 2개면 '색상: 스톤 쿨 그레이 / 사이즈: 100*150cm'처럼 오늘의집 판매 옵션명과 똑같이 나눠 적어 주시고, 실판매페이지 URL에는 이관할 리뷰를 확인할 수 있는 주소를 적어 주세요.\n\n[오늘의집 상품 간 리뷰 이관 기준] (담당 MD가 있는 파트너님은 담당 MD께 문의 안내로 마무리)\n같은 셀러샵 안의 상품끼리, 상품명·크기·색상·구성·상품상태·증정품 등 옵션 구성이 모두 같은 경우에만 이관할 수 있습니다. 이관할 리뷰의 옵션이 새 상품에서 판매 중이어야 하고, 구매자 리뷰만 이관되며(비구매 리뷰 제외), 판매정지(신고) 상품은 이관할 수 없습니다. 오감리뷰는 진행 증빙을 첨부하시면 이관할 수 있습니다. 리뷰는 골라서 옮길 수 없고 기존 상품의 리뷰 전체가 이관되며, 스크랩 수는 이관되지 않습니다. 리뷰를 이관하면 기존 상품은 판매정지 처리됩니다.\n\n[비구매 리뷰가 아직 승인되지 않은 경우] (작성일로부터 5영업일 이내)\n비구매 리뷰는 같은 상품을 다른 쇼핑몰에서 구매했거나 체험단으로 작성한 리뷰 등으로, 오늘의집 계정이 있으면 작성할 수 있고 심사 후 등록 여부가 결정됩니다. 심사 후 등록되니 조금만 첨 안내가 나갈 수 있습니다.\n- 당첨 대상 리뷰번호\n- 확인이 필요한 정보(예: 이름, 주소, 연락처)\n- 요청 사유(이벤트명 등)\n[리뷰번호, 확인 정보, 사유]\n4. 고객님이 정보 제공에 동의하시는지 담당 부서에서 확인한 뒤 전달드립니다. 상담원이 접수해 드리겠습니다.\n→ 상담원 인계 (T3-C)\n3-3. 파트너님, 오늘의집 내부 정책 변경으로 인해 리뷰 작성 고객의 정보 제공 및 확인은 어려운 점 양해 부탁드립니다. 대신, 리뷰 작성자께서 정보 제공에 동의하는 경우에 안내 드리겠으니 시간 양해 부탁드립니다. 리뷰번호와 요청 사유를 알려 주세요.\n[리뷰번호, 사유]\n→ 상담원 인계 (T3-C)\n\n2-2. [배송 전 해피콜 연락이 안 돼요]\n2. 오늘의집에서 고객님께 연락을 시도해 드리겠습니다. 아래 내용을 알려 주세요.\n- 주문번호\n- 연락이 필요한 사유(배송 날짜·시간 조율, 추가 비용 안내, 제작 사이즈 확인 등)\n- 연락 시도 내역(부재, 결번 등)\n[주문번호, 사유, 시도 내역]\n3. 연락이 닿으면 파트너님 또는 기사님께서 해피콜을 진행하신다는 점을 안내하고, 연락 가능한 번호를 확인해 결과를 전달드리겠습니다. 끝내 연락이 닿지 않으면 유관 부서 확인 후 안내드리겠습니다. 상담원이 이어서 진행해 드리겠습니다.\n→ 상담원 인계 (T3-A)\n\n2-3. [주문 고객 연락처 확인]\n2. 주문 고객 정보는 구매확정 후 90일 이내 주문까지 오로라에서 확인하실 수 있습니다. 오로라 > 주문배송 > 주문배송현황 > 주문번호 클릭 > 주문상세에서 주문자 정보(주문자·연락처·이메일)와 배송지 정보(수령인·연락처·주소)를 확인해 주세요. 가림 해제 시 고객개인정보 접근 이력에 자동으로 기록됩니다. 주문자와 수취인이 다를 수 있으니 각각 확인 부탁드립니다.\n[확인했어요] → 상담 종료 (유형: PA010001)\n[오로라에서 고객 정보가 보이지 않아요] → 3\n3. 구매확정 후 90일이 지난 주문은 오로라에서 고객 정보를 확인하실 수 없습니다. 주문번호와 고객님께 연락이 필요한 사유를 알려 주시면 상담원이 확인해 드리겠습니다.\n[주문번호, 사유]\n→ 상담원 인계 (T3-D)\n\n2-4. [고객님께 안내·확인할 내용이 있어요]\n2. 오늘의집에서 고객님께 연락드려 안내·확인해 드리겠습니다. 아래 내용을 알려 주세요.\n- 주문번호, 주문옵션번호\n- 고객님께 안내하거나 확인할 내용(예: 주소 오류 확인, 발송 누락 안내, 수량 부분 취소 안내)\n[주문번호, 주문옵션번호, 안내 내용]\n(취소·반품·교환 접수 자체를 요청하면 → 해당 클레임 유형 시나리오로 전환)\n3. 확인 후 상담원이 고객님께 연락드리고 결과를 안내드리겠습니다.\n→ 상담원 인계 (T3-A)\n\n2-5. [반품·교환이 고객 사정으로 막혔어요]\n2. 반품배송비나 귀책을 고객님이 받아들이지 않으시거나, 고객 과실·부재로 처리가 막힌 경우 담당 부서에서 확인해 드립니다. 양쪽 입장을 모두 확인해야 하니 아래 내용을 알려 주세요.\n- 주문번호, 주문옵션번호\n- 고객님 불만 내용\n- 파트너님 입장과 지금까지 고객님께 안내하신 내용·반응\n[주문번호, 주문옵션번호, 고객 불만, 파트너 입장]\n→ 상담원 인계 (T3-C)\n(고객과 주장이 엇갈려 사실관계 확인·중재를 원하는 경우도 같은 항목 수집 후 → 상담원 인계 (T3-C))\n\n(공통) 파트너가 고객과 직접 거래·연락을 원한다고 하면 → \"모든 거래는 오늘의집 플랫폼에서 진행해 주시고, 구매자 연락이 필요하면 파트너센터로 문의해 주세요. 직거래 유도가 확인되면 제재가 진행될 수 있습니다.\" 안내", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 어떤 목적으로 고객님<br/>연락이나 정보가 필요하신가요?\"]:::bot\nN2_1{{\"리뷰 작성 고객 정보\"}}:::sec\nN2_1_2[\"<b>2<\/b> 개인정보 보호법상 고객 정보는 임의로<br/>안내드리기 어렵습니다. 어떤 리뷰 관련<br/>요청이신가요?\"]:::bot\nN2_1_3_1[\"<b>3-1<\/b> 파트너님, 문의주신 부분은 해당 리뷰에<br/>댓글을 작성하는 방식으로 도움드릴 수<br/>있습니다. 해당 리뷰에 작성하실 댓글 내용을<br/>확인하신 후 말씀해 주시면, 담당 부서로<br/>접수하여 댓글 작성이 진행될 수 있도록<br/>도움드리겠습니다. 리뷰번호와 댓글 내용 전달<br/>부탁드립니다.\"]:::bot\nN2_1_3_2[\"<b>3-2<\/b> 당첨 확인을 위해 아래 내용을 알려 주세요.<br/>당첨 대상인 리뷰번호만 보내 주셔야 합니다.<br/>당첨 대상이 아닌 리뷰번호가 섞이면 해당<br/>고객님께도 당첨 안내가 나갈 수 있습니다.\"]:::bot\nN2_1_4[\"<b>4<\/b> 고객님이 정보 제공에 동의하시는지 담당<br/>부서에서 확인한 뒤 전달드립니다. 상담원이<br/>접수해 드리겠습니다.\"]:::bot\nN2_1_3_3[\"<b>3-3<\/b> 파트너님, 오늘의집 내부 정책 변경으로 인해<br/>리뷰 작성 고객의 정보 제공 및 확인은<br/>어려운 점 양해 부탁드립니다. 대신, 리뷰<br/>작성자께서 정보 제공에 동의하는 경우에 안내<br/>드리겠으니 시간 양해 부탁드립니다.<br/>리뷰번호와 요청 사유를 알려 주세요.\"]:::bot\nN2_2{{\"배송 전 해피콜 연락이 안<br/>돼요\"}}:::sec\nN2_2_2[\"<b>2<\/b> 오늘의집에서 고객님께 연락을 시도해<br/>드리겠습니다. 아래 내용을 알려 주세요.\"]:::bot\nN2_2_3[\"<b>3<\/b> 연락이 닿으면 파트너님 또는 기사님께서<br/>해피콜을 진행하신다는 점을 안내하고, 연락<br/>가능한 번호를 확인해 결과를<br/>전달드리겠습니다. 끝내 연락이 닿지 않으면<br/>유관 부서 확인 후 안내드리겠습니다.<br/>상담원이 이어서 진행해 드리겠습니다.\"]:::bot\nN2_3{{\"주문 고객 연락처 확인\"}}:::sec\nN2_3_2[\"<b>2<\/b> 주문 고객 정보는 구매확정 후 90일 이내<br/>주문까지 오로라에서 확인하실 수 있습니다.<br/>오로라 › 주문배송 › 주문배송현황 ›<br/>주문번호 클릭 › 주문상세에서 주문자<br/>정보(주문자·연락처·이메일)와 배송지<br/>정보(수령인·연락처·주소)를 확인해 주세요.<br/>가림 해제 시 고객개인정보 접근 이력에<br/>자동으로 기록됩니다. 주문자와 수취인이 다를<br/>수 있으니 각각 확인 부탁드립니다.\"]:::bot\nN2_3_3[\"<b>3<\/b> 구매확정 후 90일이 지난 주문은 오로라에서<br/>고객 정보를 확인하실 수 없습니다.<br/>주문번호와 고객님께 연락이 필요한 사유를<br/>알려 주시면 상담원이 확인해 드리겠습니다.\"]:::bot\nN2_4{{\"고객님께 안내·확인할<br/>내용이 있어요\"}}:::sec\nN2_4_2[\"<b>2<\/b> 오늘의집에서 고객님께 연락드려 안내·확인해<br/>드리겠습니다. 아래 내용을 알려 주세요.\"]:::bot\nN2_4_3[\"<b>3<\/b> 확인 후 상담원이 고객님께 연락드리고 결과를<br/>안내드리겠습니다.\"]:::bot\nN2_5{{\"반품·교환이 고객 사정으로<br/>막혔어요\"}}:::sec\nN2_5_2[\"<b>2<\/b> 반품배송비나 귀책을 고객님이 받아들이지<br/>않으시거나, 고객 과실·부재로 처리가 막힌<br/>경우 담당 부서에서 확인해 드립니다. 양쪽<br/>입장을 모두 확인해야 하니 아래 내용을 알려<br/>주세요.\"]:::bot\nS --> N1\nN1 -->|\"리뷰 작성 고객 정보\"| N2_1\nN2_1_2 -->|\"불만·부정 리뷰 고객에게 연락하고 싶어요\"| N2_1_3_1\nN2_1_2 -->|\"이벤트·경품 당첨자 확인이에요\"| N2_1_3_2\nN2_1_2 -->|\"예전에 요청했는데 아직 못 받았어요\"| N2_1_3_3\nN2_1_3_1 -->|\"리뷰번호, 댓글 내용 ·\"| SW_PA004002\nN2_1_3_1 -->|\"댓글 말고 고객 정보가 꼭 필요해요\"| N2_1_3_3\nN2_1_3_2 -->|\"리뷰번호, 확인 정보, 사유\"| N2_1_4\nN2_1_4 --> HO_T3C\nN2_1_3_3 --> HO_T3C\nN1 -->|\"배송 전 해피콜 연락이 안 돼요\"| N2_2\nN2_2_2 -->|\"주문번호, 사유, 시도 내역\"| N2_2_3\nN2_2_3 --> HO_T3A\nN1 -->|\"주문 고객 연락처 확인\"| N2_3\nN2_3_2 -->|\"확인했어요\"| END\nN2_3_2 -->|\"오로라에서 고객 정보가 보이지 않아요\"| N2_3_3\nN2_3_3 --> HO_T3D\nN1 -->|\"고객님께 안내·확인할 내용이 있어요\"| N2_4\nN2_4_2 -->|\"취소·반품·교환 접수 자체를 요청하면\"| SWX5\nN2_4_2 -->|\"주문번호, 주문옵션번호, 안내 내용\"| N2_4_3\nN2_4_3 --> HO_T3A\nN1 -->|\"반품·교환이 고객 사정으로 막혔어요\"| N2_5\nN2_5_2 --> HO_T3C\nN2_5_2 -->|\"고객과 주장이 엇갈려 사실관계 확인·중재를<br/>원하는 경우도 같은 항목 수집 후\"| HO_T3C\nN2_5_2 -->|\"공통) 파트너가 고객과 직접 거래·연락을<br/>원한다고 하면\"| TX6\nN2_1 --> N2_1_2\nN2_2 --> N2_2_2\nN2_3 --> N2_3_2\nN2_4 --> N2_4_2\nN2_5 --> N2_5_2\nSW_PA004002[/\"「고객리뷰」로 전환\"/]:::sw\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nHO_T3A([\"상담원 인계<br/>실행 요청\"]):::ho\nEND([\"상담 종료\"]):::fin\nHO_T3D([\"상담원 인계<br/>개별 조회 필요\"]):::ho\nSWX5[/\"해당 클레임 유형<br/>시나리오로 전환\"/]:::sw\nTX6[\"'모든 거래는 오늘의집<br/>플랫폼에서 진행해 주시고,<br/>구매자 연락이 필요하면<br/>파트너센터로 문의해<br/>주세요. 직거래 유도가<br/>확인되면 제재가 진행될 수<br/>있습니다.' 안내\"]:::txt", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 어떤 목적으로 고객님 연락이나 정보가 필요하신가요?", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "리뷰 작성 고객 정보", "sec": true, "body": []}, {"k": "2-1/2", "id": "2", "t": "개인정보 보호법상 고객 정보는 임의로 안내드리기 어렵습니다. 어떤 리뷰 관련 요청이신가요?", "sec": false, "body": []}, {"k": "2-1/3-1", "id": "3-1", "t": "파트너님, 문의주신 부분은 해당 리뷰에 댓글을 작성하는 방식으로 도움드릴 수 있습니다. 해당 리뷰에 작성하실 댓글 내용을 확인하신 후 말씀해 주시면, 담당 부서로 접수하여 댓글 작성이 진행될 수 있도록 도움드리겠습니다. 리뷰번호와 댓글 내용 전달 부탁드립니다.", "sec": false, "body": []}, {"k": "2-1/3-2", "id": "3-2", "t": "당첨 확인을 위해 아래 내용을 알려 주세요. 당첨 대상인 리뷰번호만 보내 주셔야 합니다. 당첨 대상이 아닌 리뷰번호가 섞이면 해당 고객님께도 당첨 안내가 나갈 수 있습니다.", "sec": false, "body": ["- 당첨 대상 리뷰번호", "- 확인이 필요한 정보(예: 이름, 주소, 연락처)", "- 요청 사유(이벤트명 등)"]}, {"k": "2-1/4", "id": "4", "t": "고객님이 정보 제공에 동의하시는지 담당 부서에서 확인한 뒤 전달드립니다. 상담원이 접수해 드리겠습니다.", "sec": false, "body": []}, {"k": "2-1/3-3", "id": "3-3", "t": "파트너님, 오늘의집 내부 정책 변경으로 인해 리뷰 작성 고객의 정보 제공 및 확인은 어려운 점 양해 부탁드립니다. 대신, 리뷰 작성자께서 정보 제공에 동의하는 경우에 안내 드리겠으니 시간 양해 부탁드립니다. 리뷰번호와 요청 사유를 알려 주세요.", "sec": false, "body": []}, {"k": "2-2", "id": "2-2", "t": "배송 전 해피콜 연락이 안 돼요", "sec": true, "body": []}, {"k": "2-2/2", "id": "2", "t": "오늘의집에서 고객님께 연락을 시도해 드리겠습니다. 아래 내용을 알려 주세요.", "sec": false, "body": ["- 주문번호", "- 연락이 필요한 사유(배송 날짜·시간 조율, 추가 비용 안내, 제작 사이즈 확인 등)", "- 연락 시도 내역(부재, 결번 등)"]}, {"k": "2-2/3", "id": "3", "t": "연락이 닿으면 파트너님 또는 기사님께서 해피콜을 진행하신다는 점을 안내하고, 연락 가능한 번호를 확인해 결과를 전달드리겠습니다. 끝내 연락이 닿지 않으면 유관 부서 확인 후 안내드리겠습니다. 상담원이 이어서 진행해 드리겠습니다.", "sec": false, "body": []}, {"k": "2-3", "id": "2-3", "t": "주문 고객 연락처 확인", "sec": true, "body": []}, {"k": "2-3/2", "id": "2", "t": "주문 고객 정보는 구매확정 후 90일 이내 주문까지 오로라에서 확인하실 수 있습니다. 오로라 > 주문배송 > 주문배송현황 > 주문번호 클릭 > 주문상세에서 주문자 정보(주문자·연락처·이메일)와 배송지 정보(수령인·연락처·주소)를 확인해 주세요. 가림 해제 시 고객개인정보 접근 이력에 자동으로 기록됩니다. 주문자와 수취인이 다를 수 있으니 각각 확인 부탁드립니다.", "sec": false, "body": []}, {"k": "2-3/3", "id": "3", "t": "구매확정 후 90일이 지난 주문은 오로라에서 고객 정보를 확인하실 수 없습니다. 주문번호와 고객님께 연락이 필요한 사유를 알려 주시면 상담원이 확인해 드리겠습니다.", "sec": false, "body": []}, {"k": "2-4", "id": "2-4", "t": "고객님께 안내·확인할 내용이 있어요", "sec": true, "body": []}, {"k": "2-4/2", "id": "2", "t": "오늘의집에서 고객님께 연락드려 안내·확인해 드리겠습니다. 아래 내용을 알려 주세요.", "sec": false, "body": ["- 주문번호, 주문옵션번호", "- 고객님께 안내하거나 확인할 내용(예: 주소 오류 확인, 발송 누락 안내, 수량 부분 취소 안내)"]}, {"k": "2-4/3", "id": "3", "t": "확인 후 상담원이 고객님께 연락드리고 결과를 안내드리겠습니다.", "sec": false, "body": []}, {"k": "2-5", "id": "2-5", "t": "반품·교환이 고객 사정으로 막혔어요", "sec": true, "body": []}, {"k": "2-5/2", "id": "2", "t": "반품배송비나 귀책을 고객님이 받아들이지 않으시거나, 고객 과실·부재로 처리가 막힌 경우 담당 부서에서 확인해 드립니다. 양쪽 입장을 모두 확인해야 하니 아래 내용을 알려 주세요.", "sec": false, "body": ["- 주문번호, 주문옵션번호", "- 고객님 불만 내용", "- 파트너님 입장과 지금까지 고객님께 안내하신 내용·반응"]}], "hocond": "고객 OB 필요(해피콜 부재·안내/확인 연락) 시 T3-A, 리뷰 고객정보(이벤트·재요청)·반품교환 확인요청·고객↔파트너 분쟁 T3-C, 오로라에서 고객 정보가 보이지 않는 주문(구매확정 90일 경과 여부 확인 필요)은 주문번호·사유를 받아 T3-D, 부정 리뷰 고객정보는 댓글 방식 안내 후 PA004002로 전환", "hoinfo": "주문번호·주문옵션번호, 연락 사유와 고객에게 전달·확인할 내용, 파트너의 연락 시도 내역(부재·결번) / 오로라에서 고객 정보가 안 보이는 주문의 주문번호와 연락 사유 / 리뷰번호, 확인 요청 정보, 요청 사유(이벤트는 당첨 대상 리뷰번호만) / 반품·교환·분쟁 건은 고객 불만 내용과 파트너 입장, 기존 안내 내용과 고객 반응", "kms": "093_고객센터_협업_유형_및_이관_방법.md, 064_리뷰_문의.md, 048_배송.md, 088_프로세스_기준_정리_.md, 081_파트너센터_교육자료__주문_배송.md, 065__주문_.md, 090_민원_업무_프로세스_.md", "check": "1) 8/26 정책 변경(부정 리뷰 고객정보 미제공, 댓글 방식 안내) 반영함. 다만 064 '리뷰 작성 고객 정보 요청'은 아직 '동의 확인 후 전달'로 되어 있어 093과 표현이 다름, 064 갱신 필요. 2) 구매확정 90일 경과 주문의 고객 연락 요청 처리 기준 KMS 없음. 3) 파트너 대신 고객에게 연락하는 OB 대상 범위(088 OB 표: 수량부분취소·주소오류·상품발송누락만 O)를 챗봇 접수 기준으로 그대로 쓸지 확인 필요. 4) 065 직거래 정책의 '구매자 연락은 파트너센터 통해'와 오로라 고객정보 확인 안내가 같이 있어 안내 순서 확인 필요 5) (1차 전환) 90일 경과 여부를 판정할 수 없어 '오로라에서 보이지 않는다'는 건을 T3-D로 넘김. 상담원이 구매확정일 확인 후 90일 경과로 판명되면 기존처럼 T5 기준(KMS 없음)을 따르는지 확인 필요", "api": "R-02", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 요청 목적: \n· (해당 시: 리뷰 관련 외 전부) 주문번호·주문옵션번호: \n· 고객님께 안내·확인할 내용: \n· (해당 시: 해피콜·연락 안 됨) 연락 시도 내역: 일시·횟수·결과(부재·결번 등): \n· (해당 시: 리뷰 관련) 리뷰번호: \n· (해당 시: 부정 리뷰 고객 연락) 리뷰에 남길 댓글 내용: \n· (해당 시: 당첨자 확인. 당첨 대상 리뷰번호만) 확인이 필요한 정보와 이벤트명: \n· (해당 시: 반품·교환 막힘) 고객님 불만 내용과 파트너님 입장: \n\n문의 내용: ", "mode": "조건별: 주문 고객 연락처 확인 경로·부정 리뷰 고객 연락(댓글 방식 안내)·직거래 문의는 자동답변 종결 / 해피콜 부재·고객 안내 연락·반품교환 막힘·당첨자 확인·재요청은 상담원 배정 / 댓글 내용을 함께 적은 부정 리뷰 건은 PA004002로 바꿔 상담원 배정", "segs": [{"c": ["A"], "t": "주문 고객 연락처 확인 경로·부정 리뷰 고객 연락(댓글 방식 안내)·직거래 문의는 자동답변 종결"}, {"c": ["C"], "t": "해피콜 부재·고객 안내 연락·반품교환 막힘·당첨자 확인·재요청은 상담원 배정"}, {"c": ["C"], "t": "댓글 내용을 함께 적은 부정 리뷰 건은 PA004002로 바꿔 상담원 배정"}], "auto": "(공통 첫인사)\n\n[주문 고객 연락처를 확인하시려는 경우]\n주문 고객 정보는 구매확정 후 90일 이내 주문까지 오로라에서 확인하실 수 있습니다. 오로라 > 주문배송 > 주문배송현황 > 주문번호 클릭 > 주문상세에서 주문자 정보(주문자·연락처·이메일)와 배송지 정보(수령인·연락처·주소)를 확인해 주세요. 가림 해제 시 고객개인정보 접근 이력에 자동으로 기록됩니다. 주문자와 수취인이 다를 수 있으니 각각 확인 부탁드립니다.\n구매확정 후 90일이 지난 주문은 오로라에서 고객 정보를 확인하실 수 없습니다. 고객님께 연락이 필요하면 주문번호와 연락이 필요한 사유를 적어 새 문의로 남겨 주세요.\n\n[불만·부정 리뷰를 남긴 고객님께 연락하고 싶으신 경우]\n개인정보 보호법상 고객 정보는 임의로 안내드리기 어렵습니다. 문의주신 부분은 해당 리뷰에 댓글을 작성하는 방식으로 도움드릴 수 있습니다. 리뷰번호와 작성하실 댓글 내용을 적어 세부 유형 '리뷰 답글·블라인드·리뷰 이관'으로 새 문의를 남겨 주시면, 담당 부서로 접수하여 댓글 작성이 진행될 수 있도록 도움드리겠습니다.\n\n[고객님과 직접 거래·연락을 원하시는 경우]\n모든 거래는 오늘의집 플랫폼에서 진행해 주시고, 구매자 연락이 필요하면 파트너센터로 문의해 주세요. 직거래 유도가 확인되면 제재가 진행될 수 있습니다.\n(맺음 A)", "ack": "남겨 주신 내용을 확인한 뒤 오늘의집에서 고객님께 연락드리겠습니다.\n(해피콜 부재: \"연락이 닿으면 파트너님 또는 기사님께서 해피콜을 진행하신다는 점을 안내하고, 연락 가능한 번호를 확인해 결과를 전달드리겠습니다. 끝내 연락이 닿지 않으면 확인 후 안내드리겠습니다.\")\n(반품·교환 막힘: \"양쪽 입장을 모두 확인해야 하는 건이라 담당 부서에서 확인 후 안내드리겠습니다.\")\n(당첨자 확인·재요청: \"오늘의집 내부 정책 변경으로 리뷰 작성 고객의 정보 제공 및 확인은 어려운 점 양해 부탁드립니다. 대신 리뷰 작성자께서 정보 제공에 동의하는 경우에 안내드리겠으니 시간 양해 부탁드립니다.\")", "info": "주문번호·주문옵션번호, 연락 사유와 고객에게 전달·확인할 내용, 파트너 연락 시도 내역 / 리뷰번호, 확인 요청 정보, 이벤트명(당첨 대상 리뷰번호만) / 반품·교환 막힘이면 고객 불만·파트너 입장, 기존 안내 내용과 고객 반응", "kms": "093_고객센터_협업_유형_및_이관_방법.md, 064_리뷰_문의.md, 048_배송.md, 088_프로세스_기준_정리_.md, 081_파트너센터_교육자료__주문_배송.md, 065__주문_.md, 090_민원_업무_프로세스_.md", "check": "1) 8/26 정책 변경(부정 리뷰 고객정보 미제공, 댓글 방식 안내)을 반영 — 064 '리뷰 작성 고객 정보 요청'은 아직 '동의 확인 후 전달'로 남아 있어 093과 다름, 064 갱신 필요\n2) 구매확정 90일 경과 주문의 고객 연락 요청 처리 기준 KMS 없음\n3) 오늘의집이 대신 연락하는 대상 범위(088 OB표: 수량부분취소·주소오류·상품발송누락 O)를 게시판 접수 기준으로 그대로 쓸지"}}, {"code": "PA011001", "draft": false, "name": "기타", "mid": "기타", "vol": "146", "mode": "안내 후 조건부 상담원 연결", "utter": "안녕하세요\n문의 좀 하려고요\n(입력 없음)", "raw": "(진입 조건: 공통 유형 선택 단계에서 용건을 판별하지 못함 / 인사만 입력 / 무응답)\n\n1. 네, 파트너님. 정확한 안내를 위해 몇 가지 내용을 더 확인하고자 합니다. 어떤 도움이 필요하신지 조금 더 자세히 말씀해 주시겠어요? 주문 관련이면 주문번호나 주문옵션번호를 함께 알려 주시면 더 빠르게 확인해 드릴 수 있습니다.\n(되묻기는 1회만 진행)\n\n[구체적 용건 입력] → 2-1\n[다시 불분명한 입력] → 2-2\n[무응답] → 2-3\n[상담원 연결 요청] → 2-4\n[불만·항의 표현] → 2-5\n[구매자(고객)로 확인됨] → 2-6\n\n2-1. (용건을 판별하면 해당 유형 시나리오로 전환하고 유형을 바꿔 찍음)\n(용건이 2개 이상 → 첫 번째 용건부터 해당 시나리오로 진행, 판별이 어렵거나 동시에 처리해야 하면 → 상담원 인계 (T7))\n(판별은 됐으나 KMS 근거가 없는 내용 → \"보다 정확한 안내를 위해 관련 내용을 다시 한번 확인한 후 안내드리겠습니다. 상담원이 이어서 도와드리겠습니다.\" → 상담원 인계 (T5))\n\n2-2. 2. 설명이 충분하지 않았던 부분이 있었던 것 같습니다. 정확한 확인을 위해 상담원이 이어서 도와드리겠습니다.\n→ 상담원 인계 (T5)\n\n2-3. (무응답 대기 (고객 챗봇과 같은 값, 10/21 결정))\n2. 파트너님, 추가로 문의하실 내용이 없으시면 상담을 종료하겠습니다. 다시 도움이 필요하시면 언제든 문의해 주세요.\n→ 상담 종료 (유형: PA011001)\n\n2-4. 2. 네, 파트너님. 상담원을 연결해 드리겠습니다. 잠시만 기다려 주세요.\n→ 상담원 인계 (T1)\ (고객)로 판단되는 문의인 경우]\n이곳은 오늘의집 판매자(파트너)를 위한 파트너센터입니다. 죄송하게도 해당 내용은 파트너센터에서 확인이 어려운 부분으로, 번거로우시겠지만 오늘의집 고객센터(1670-0876)로 문의 부탁드립니다.\n감사합니다.\n(맺음 A 대신 위 문장으로 마무리, 만족도 평가 영역 노출)", "ack": "남겨 주신 내용은 담당 상담원이 확인해 정확히 안내드리겠습니다.", "info": "AI가 추정한 후보 유형(있으면), 판정 실패 사유(내용 불명확·복수 용건·첨부만 있음 등), 구매자 의심 여부", "kms": "088_프로세스_기준_정리_.md", "check": "1) 게시판은 내용이 필수라 무응답 케이스는 없음. 판정 실패 시 PA011001로 찍을지, 상담원이 판단한 유형으로 바꿔 찍을지 확인\n2) 구매자 문의 판정 기준(로그인 샵 정보가 있는데 구매자 말투인 경우 등) AICX와 정해야 함 — 파트너가 고객 문의를 옮겨 적은 경우 오판 위험"}}, {"code": "PA003001", "draft": false, "name": "상품등록검수", "mid": "상품", "vol": "136", "mode": "안내 후 조건부 상담원 연결", "utter": "판매승인 언제 나나요? 검수 요청한 지 꽤 됐어요\n상품 등록했는데 검수 얼마나 걸려요?\n판매중 상품 가격 수정했는데 수정검수 아직이에요. 언제 처리돼요?", "raw": "[검수 진행상황·소요기간 문의]\n1. 네, 파트너님. 검수 진행 상황 안내를 도와드릴게요. 확인할 상품번호(또는 판매신청서 번호)를 알려주시겠어요?\n[상품번호/신청서번호 입력]\n(신규 등록 판매신청서인지, 판매중 상품의 수정요청서인지 판별 → 신규면 2 / 수정이면 3)\n(번호를 모른다고 하면 → 1-1)\n1-1. [오로라 > 상품관리 > 상품 검수 현황 > 판매검수현황]에서 판매신청서 번호를 확인하실 수 있습니다. 판매중 상품 수정 건은 같은 메뉴 상단 오른쪽의 [수정검수요청 현황] 탭에서 확인됩니다. 번호를 확인하시면 알려주세요.\n\n2. [오로라 > 상품관리 > 상품 검수 현황 > 판매검수현황]에서 보이는 검수 상태와 검수를 요청하신 날짜를 알려주시겠어요?\n[임시저장 / 검수요청 / 1차 검수완료 / 수정필요 / 검수거절 / 2차 검수완료 / 모르겠어요]\n[검수 요청일]\n(상태 선택 시 아래 분기로 / [모르겠어요] → 2-9)\n\n(상태가 임시저장이면 → 2-1 / 검수요청이면 → 2-2 / 1차 검수완료면 → 2-3 / 수정필요면 → 2-4 / 검수거절이면 → 2-5 / 2차 검수완료면 → 2-6)\n2-1. 파트너님, 해당 판매신청서는 아직 임시저장 상태로 검수가 시작되지 않았습니다.\n엑셀로 일괄 등록하신 경우 업로드에 성공해도 바로 검수요청 상태가 되지 않습니다. [상품 검수 현황 > 판매검수현황]에서 상품정보제공고시를 설정한 뒤 [검수요청] 버튼을 눌러주셔야 검수가 시작됩니다.\n단건 등록 중 임시저장하신 경우에도 같은 화면에서 검수요청을 진행해 주세요.\n→ 공통-2 종료 (유형: PA003001)\n\n2-2. 해당 판매신청서는 1차 검수(가격·배송비·옵션)가 진행 중입니다. 신규 상품 검수는 1차·2차 차수별로 평균 영업일 기준 5일 내 처리되며, 상품이 많이 몰리면 승인이 지연될 수 있습니다.\n(파트너가 알려 주신 검수 요청일로부터 5영업일 이내면 → 2-7 / 경과했으면 → 2-8)\n2-3. 해당 판매신청서는 1차 검수가 완료되어 2차 검수(상품명·대표이미지·대표옵션 등 기본 정보)가 진행 중입니다. 신규 상품 검수는 1차·2차 차수별로 평균 영업일 기준 5일 내 처리되며, 상품이 많이 몰리면 승인이 지연될 수 있습니다.\n(파트너가 알려 주신 검수 요청일로부터 5영업일 이내면 → 2-7 / 경과했으면 → 2-8)\n\n2-4. 해당 판매신청서는 수정필요 상태입니다. [오로라 > 상품관리 > 상품 검수 현황 > 판매검수현황 > 검수이력]에서 수정이 필요한 항목과 사유를 확인하신 뒤, 정보를 수정해 다시 검수요청해 주세요. 수정필요 건의 재검수는 영업일 기준 추가 5일이 소요됩니다.\n수정필요·검수거절 판매신청서는 셀러샵 대표 계정 휴대폰 번호로 매일 오전 9~11시 사이 1회 알림톡으로도 안내됩니다.\n[사유를 봤는데 이해가 안 돼요 / 수정할 필요가 없는 내용이에요] → PA003007 시나리오로 이동 (유형 변경: PA003007)\n[확인했어요] → 공통-2 종료 (유형: PA003001)\n\n2-5. 해당 판매신청서는 검수거절 상태입니다. 거절 사유는 [오로라 > 상품관리 > 상품 검수 현황 > 판매검수현황 > 검수이력]에서 확인하실 수 있습니다.\n→ PA003007 시나리오 2번으로 이동 (유형 변경: PA003007)\n\n2-6. 해당 판매신청서는 2차 검수까지 완료되어 판매 가능한 상태입니다. 상품 등록 완료 시에는 별도 알림 없이 판매중 또는 판매대기로 전환됩니다.\n[상품 조회/수정 > 상품 코드 클릭 > 상품상태]에서 지금 상품상태가 판매대기인지 판매중인지 알려주시겠어요?\n[판매대기] → 2-6-1\n[판매중] → 2-6-2\n2-6-1. 등록 시 [검수 완료 후 판매 대기 시작]으로 설정하셔서 판매대기 상태입니다. 원하시는 시점에 직접 판매중으로 전환해 주세요.\n- 단건: [상품 조회/수정 > 상품 코드 클릭 > 상품상태]\n- 일괄: [상품 조회/수정 > 상품ID 앞 네모칸 체크 > 상태 변경(판매중) > 일괄 변경]\n→ 공통-2 종료 (유형: PA003001)\n2-6-2. 현재 판매중 상태입니다. 2차 검수 완료 후 오늘의집 사이트에 노출되기까지 최소 2시간이 걸립니다.\n[사이트에서 안 보여요] → PA003005 시나리오로 이동 (유형 변경: PA003005)\n[확인했어요] → 공통-2 종료 (유형: PA003001)\n\n2-7. 아직 평균 처리 기간 이내라 조금 더 기다려 주시면 순서대로 처리될 예정입니다. 진행 상태는 [오로라 > 상품관리 > 상품 검수 현황]에서 확인하실 수 있습니다. 영업일 기준 5일이 지나도 검수 대기 상태면 다시 문의해 주세요.\n[빨리 처리해 주세요] → 2-7-1\n[알겠어요] → 공통-2 종료 (유형: PA003001)\n2-7-1. 빠른 처리를 원하시는 마음 이해합니다. 다만 검수는 요청 순서대로 진행되고 있어 평균 처리 기간 안에는 별도로 앞당기기 어려운 점 양해 부탁드립니다.\n→ 공통-2 종료 (유형: PA003001) (재요청 시 → 상담원 인계 (T2))\n\n2-8. 알려 주신 검수 요청일 기준으로 영업일 5일이 지났습니다. 처리 지연 건으로 담당 부서에 확인 요청드릴게요. 상담원에게 연결해 드리겠습니다.\n(검수 단계 기록: 검수요청=1차(영업) / 1차 검수완료=2차(운영))\n→ 상담원 인계 (T3-C)\n2-9. 검수 상태 확인이 필요해 담당 상담원이 이어서 도와드리겠습니다. 알려 주신 상품번호(판매신청서·수정요청서 번호)로 확인을 요청드리겠습니다.\n→ 상담원 인계 (T3-D)\n\n3. [오로라 > 상품관리 > 상품 검수 현황 > 수정검수요청 현황]에서 보이는 검수 상태와 수정을 요청하신 날짜를 알려주시겠어요?\n[검수요청 / 검수완료(거절·부분승인) / 모르겠어요]\n[수정 요청일]\n([모르겠어요] → 2-9)\n3-1. 판매중 상품 수정은 항목별로 수정요청서가 따로 생성되어 각각 검수됩니다. 예를 들어 판매가·배송비·상품명을 한 번에 수정하셔도 수정요청서 3건으로 나뉘어, 일부는 승인되고 일부는 거절될 수 있습니다.\n- 가격(정상가·판매가), 배송비, 옵션 추가는 사전검수 항목으로, 승인이 완료된 뒤 고객에게 노출됩니다. 처리까지 최대 5영업일 정도 걸릴 수 있습니다.\n- 상품명, 대표이미지, 정보고시, 옵션명·옵션값 등은 사후검수 항목으로, 수정 즉시 노출되고 기준 미달이면 수정 전 정보로 원복될 수 있습니다.\n검수 결과와 사유는 [오로라 > 상품관리 > 상품 검수 현황 > 수정검수요청 현황(상단 우측 탭) > 검수내역]에서 확인하실 수 있습니다.\n(사전 검수요청 상태이고 파트너가 알려 주신 수정 요청일로부터 5영업일 이내면 → 2-7 / 5영업일 경과면 → 3-2 / 검수완료(거절·부분승인)면 → PA003007 시나리오 3번으로 이동 (유형 변경: PA003007))\n3-2. 알려 주신 수정 요청일 기준으로 영업일 5일이 지났습니다. 처리 지연 건으로 담당 부서에 확인 요청드릴게요. 상담원에게 연결해 드리겠습니다.\n(검수 구분 기록: 수정검수(영업) / 수정검수(운영))\n→ 상담원 인계 (T3-C)\n\n[저장하려는데 '이미 진행중인 검수가 존재합니다' 오류가 떠요]\n4. 해당 상품은 이미 제출되어 검수가 진행 중이라 추가 수정 요청이 되지 않는 상태입니다. 신규 등록 건은 [오로라 > 상품관리 > 상품 검수 현황 > 판매검수현황], 판매중 상품 수정 건은 [수정검수요청 현황(상단 오른쪽 탭)]에서 진행 상태를 확인해 주세요. 진행 중인 검수가 끝난 뒤 다시 수정하실 수 있습니다.\n검수를 직접 취소하신 판매신청서는 다시 사용할 수 없으니, [판매검수 요청 현황] 목록 맨 오른쪽 [복사하기]로 복사한 뒤 수정해 제출해 주세요. 복사하면 상품명 앞에 '사본'이 붙어, 띄어쓰기 포함 50자를 넘으면 복사가 되지 않습니다. 이 경우 판매신청서를 새로 작성해 주셔야 합니다.\n→ 공통-2 종료 (유형: PA003001)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 검수 진행 상황 안내를<br/>도와드릴게요. 확인할 상품번호(또는<br/>판매신청서 번호)를 알려주시겠어요?\"]:::bot\nN1_1{{\"오로라 › 상품관리 ›<br/>상품 검수 현황 ›<br/>판매검수현황\"}}:::sec\nN1_1_2[\"<b>2<\/b> [오로라 › 상품관리 › 상품 검수 현황 ›<br/>판매검수현황]에서 보이는 검수 상태와 검수를<br/>요청하신 날짜를 알려주시겠어요?\"]:::bot\nN1_1_2_1[\"<b>2-1<\/b> 파트너님, 해당 판매신청서는 아직 임시저장<br/>상태로 검수가 시작되지 않았습니다.\"]:::bot\nN1_1_2_2[\"<b>2-2<\/b> 해당 판매신청서는 1차<br/>검수(가격·배송비·옵션)가 진행 중입니다.<br/>신규 상품 검수는 1차·2차 차수별로 평균<br/>영업일 기준 5일 내 처리되며, 상품이 많이<br/>몰리면 승인이 지연될 수 있습니다.\"]:::bot\nN1_1_2_3[\"<b>2-3<\/b> 해당 판매신청서는 1차 검수가 완료되어 2차<br/>검수(상품명·대표이미지·대표옵션 등 기본<br/>정보)가 진행 중입니다. 신규 상품 검수는<br/>1차·2차 차수별로 평균 영업일 기준 5일<br/>내 처리되며, 상품이 많이 몰리면 승인이<br/>지연될 수 있습니다.\"]:::bot\nN1_1_2_4[\"<b>2-4<\/b> 해당 판매신청서는 수정필요 상태입니다.\"]:::bot\nN1_1_2_5[\"<b>2-5<\/b> 해당 판매신청서는 검수거절 상태입니다. 거절<br/>사유는\"]:::bot\nN1_1_2_6[\"<b>2-6<\/b> 해당 판매신청서는 2차 검수까지 완료되어<br/>판매 가능한 상태입니다. 상품 등록 완료<br/>시에는 별도 알림 없이 판매중 또는<br/>판매대기로 전환됩니다.\"]:::bot\nN1_1_2_6_1[\"<b>2-6-1<\/b> 등록 시\"]:::bot\nN1_1_2_6_2[\"<b>2-6-2<\/b> 현재 판매중 상태입니다. 2차 검수 완료 후<br/>오늘의집 사이트에 노출되기까지 최소 2시간이<br/>걸립니다.\"]:::bot\nN1_1_2_7[\"<b>2-7<\/b> 아직 평균 처리 기간 이내라 조금 더 기다려<br/>주시면 순서대로 처리될 예정입니다. 진행<br/>상태는\"]:::bot\nN1_1_2_7_1[\"<b>2-7-1<\/b> 빠른 처리를 원하시는 마음 이해합니다. 다만<br/>검수는 요청 순서대로 진행되고 있어 평균<br/>처리 기간 안에는 별도로 앞당기기 어려운 점<br/>양해 부탁드립니다.\"]:::bot\nN1_1_2_8[\"<b>
