"| N1_1_2_9\nN1_1_3_1 -->|\"사전 검수요청 상태이고 파트너가 알려 주신<br/>수정 요청일로부터 5영업일 이내면\"| N1_1_2_7\nN1_1_3_1 -->|\"5영업일 경과면\"| N1_1_3_2\nN1_1_3_1 -->|\"검수완료(거절·부분승인)면 ·\"| SW_PA003007\nN1_1_3_2 --> HO_T3C\nN1_1_3_2 -->|\"저장하려는데 '이미 진행중인 검수가<br/>존재합니다' 오류가 떠요\"| N1_1_4\nN1_1_4 --> END\nN1_1 --> N1_1_2\nN1_1_2_9 -.-> N1_1_3\nN1_1_3 -.-> N1_1_3_1\nTX0[\"신규면 2\"]:::txt\nEND([\"상담 종료\"]):::fin\nSW_PA003007[/\"「검수 반려·판매정지 사유」로 전환\"/]:::sw\nSW_PA003005[/\"「상품 미노출·수정 미반영」로 전환\"/]:::sw\nHO_T2([\"상담원 인계<br/>반복·미해결\"]):::ho\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nHO_T3D([\"상담원 인계<br/>개별 조회 필요\"]):::ho", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 검수 진행 상황 안내를 도와드릴게요. 확인할 상품번호(또는 판매신청서 번호)를 알려주시겠어요?", "sec": false, "body": []}, {"k": "1-1", "id": "1-1", "t": "오로라 > 상품관리 > 상품 검수 현황 > 판매검수현황", "sec": true, "body": []}, {"k": "1-1/2", "id": "2", "t": "[오로라 > 상품관리 > 상품 검수 현황 > 판매검수현황]에서 보이는 검수 상태와 검수를 요청하신 날짜를 알려주시겠어요?", "sec": false, "body": []}, {"k": "1-1/2-1", "id": "2-1", "t": "파트너님, 해당 판매신청서는 아직 임시저장 상태로 검수가 시작되지 않았습니다.", "sec": false, "body": ["엑셀로 일괄 등록하신 경우 업로드에 성공해도 바로 검수요청 상태가 되지 않습니다. [상품 검수 현황 > 판매검수현황]에서 상품정보제공고시를 설정한 뒤 [검수요청] 버튼을 눌러주셔야 검수가 시작됩니다.", "단건 등록 중 임시저장하신 경우에도 같은 화면에서 검수요청을 진행해 주세요."]}, {"k": "1-1/2-2", "id": "2-2", "t": "해당 판매신청서는 1차 검수(가격·배송비·옵션)가 진행 중입니다. 신규 상품 검수는 1차·2차 차수별로 평균 영업일 기준 5일 내 처리되며, 상품이 많이 몰리면 승인이 지연될 수 있습니다.", "sec": false, "body": []}, {"k": "1-1/2-3", "id": "2-3", "t": "해당 판매신청서는 1차 검수가 완료되어 2차 검수(상품명·대표이미지·대표옵션 등 기본 정보)가 진행 중입니다. 신규 상품 검수는 1차·2차 차수별로 평균 영업일 기준 5일 내 처리되며, 상품이 많이 몰리면 승인이 지연될 수 있습니다.", "sec": false, "body": []}, {"k": "1-1/2-4", "id": "2-4", "t": "해당 판매신청서는 수정필요 상태입니다.", "sec": false, "body": ["수정필요·검수거절 판매신청서는 셀러샵 대표 계정 휴대폰 번호로 매일 오전 9~11시 사이 1회 알림톡으로도 안내됩니다."]}, {"k": "1-1/2-5", "id": "2-5", "t": "해당 판매신청서는 검수거절 상태입니다. 거절 사유는", "sec": false, "body": []}, {"k": "1-1/2-6", "id": "2-6", "t": "해당 판매신청서는 2차 검수까지 완료되어 판매 가능한 상태입니다. 상품 등록 완료 시에는 별도 알림 없이 판매중 또는 판매대기로 전환됩니다.", "sec": false, "body": []}, {"k": "1-1/2-6-1", "id": "2-6-1", "t": "등록 시", "sec": false, "body": ["- 단건: [상품 조회/수정 > 상품 코드 클릭 > 상품상태]", "- 일괄: [상품 조회/수정 > 상품ID 앞 네모칸 체크 > 상태 변경(판매중) > 일괄 변경]"]}, {"k": "1-1/2-6-2", "id": "2-6-2", "t": "현재 판매중 상태입니다. 2차 검수 완료 후 오늘의집 사이트에 노출되기까지 최소 2시간이 걸립니다.", "sec": false, "body": []}, {"k": "1-1/2-7", "id": "2-7", "t": "아직 평균 처리 기간 이내라 조금 더 기다려 주시면 순서대로 처리될 예정입니다. 진행 상태는", "sec": false, "body": []}, {"k": "1-1/2-7-1", "id": "2-7-1", "t": "빠른 처리를 원하시는 마음 이해합니다. 다만 검수는 요청 순서대로 진행되고 있어 평균 처리 기간 안에는 별도로 앞당기기 어려운 점 양해 부탁드립니다.", "sec": false, "body": []}, {"k": "1-1/2-8", "id": "2-8", "t": "알려 주신 검수 요청일 기준으로 영업일 5일이 지났습니다. 처리 지연 건으로 담당 부서에 확인 요청드릴게요. 상담원에게 연결해 드리겠습니다.", "sec": false, "body": ["(검수 단계 기록: 검수요청=1차(영업) / 1차 검수완료=2차(운영))"]}, {"k": "1-1/2-9", "id": "2-9", "t": "검수 상태 확인이 필요해 담당 상담원이 이어서 도와드리겠습니다. 알려 주신 상품번호(판매신청서·수정요청서 번호)로 확인을 요청드리겠습니다.", "sec": false, "body": []}, {"k": "1-1/3", "id": "3", "t": "[오로라 > 상품관리 > 상품 검수 현황 > 수정검수요청 현황]에서 보이는 검수 상태와 수정을 요청하신 날짜를 알려주시겠어요?", "sec": false, "body": []}, {"k": "1-1/3-1", "id": "3-1", "t": "판매중 상품 수정은 항목별로 수정요청서가 따로 생성되어 각각 검수됩니다. 예를 들어 판매가·배송비·상품명을 한 번에 수정하셔도 수정요청서 3건으로 나뉘어, 일부는 승인되고 일부는 거절될 수 있습니다.", "sec": false, "body": ["- 가격(정상가·판매가), 배송비, 옵션 추가는 사전검수 항목으로, 승인이 완료된 뒤 고객에게 노출됩니다. 처리까지 최대 5영업일 정도 걸릴 수 있습니다.", "- 상품명, 대표이미지, 정보고시, 옵션명·옵션값 등은 사후검수 항목으로, 수정 즉시 노출되고 기준 미달이면 수정 전 정보로 원복될 수 있습니다.", "검수 결과와 사유는 [오로라 > 상품관리 > 상품 검수 현황 > 수정검수요청 현황(상단 우측 탭) > 검수내역]에서 확인하실 수 있습니다."]}, {"k": "1-1/3-2", "id": "3-2", "t": "알려 주신 수정 요청일 기준으로 영업일 5일이 지났습니다. 처리 지연 건으로 담당 부서에 확인 요청드릴게요. 상담원에게 연결해 드리겠습니다.", "sec": false, "body": ["(검수 구분 기록: 수정검수(영업) / 수정검수(운영))"]}, {"k": "1-1/4", "id": "4", "t": "해당 상품은 이미 제출되어 검수가 진행 중이라 추가 수정 요청이 되지 않는 상태입니다. 신규 등록 건은", "sec": false, "body": ["검수를 직접 취소하신 판매신청서는 다시 사용할 수 없으니, [판매검수 요청 현황] 목록 맨 오른쪽 [복사하기]로 복사한 뒤 수정해 제출해 주세요. 복사하면 상품명 앞에 '사본'이 붙어, 띄어쓰기 포함 50자를 넘으면 복사가 되지 않습니다. 이 경우 판매신청서를 새로 작성해 주셔야 합니다."]}], "hocond": "검수 요청 후 5영업일 경과(신규·수정검수 모두, 파트너가 알려 준 요청일 기준) 시 T3-C, 파트너가 검수 상태를 모를 때 상품번호(판매신청서·수정요청서 번호)를 받아 T3-D, 기간 내 빠른 처리 재요청 시 T2", "hoinfo": "상품번호·판매신청서(수정요청서) 번호, 신규/수정 구분, 파트너가 알려 준 검수 상태(모름 포함)와 단계(1차 영업·2차 운영 / 수정검수 영업·운영), 파트너가 알려 준 검수 요청일과 계산된 경과 영업일", "kms": "050_상품_검수, 056_상품_관리, 043_상품수정, 075_파트너센터_교육자료_상품검수, 094_영업_리스크팀_이관_유형_및_방법", "check": "5영업일이 1·2차 전체 기준인지 차수별 기준인지 KMS에 없음 / 지연 이관처가 문서마다 다름(050은 영업팀·상품검수팀, 043·056은 수정검수(영업)을 파트너대응 문의 채널로 안내), 상담원 처리 기준 통일 필요 / 수정검수 상태값 중 어떤 값이 '영업·운영' 단계인지 API로 구분 가능한지 확인 필요 / 1차=영업팀, 2차=정책팀(050) vs 판매승인(운영)=상품검수팀 표기 혼재 / (1차 전환) 파트너가 알려 준 검수 요청일을 그대로 믿고 경과 영업일을 계산하므로 오입력 시 오답 가능, 1차에 허용할지 확인 필요(게시판과 같은 쟁점) / (1차 전환) 판매검수현황·수정검수요청 현황 화면에서 파트너가 검수 요청일을 확인할 수 있는지, 수정검수 화면 상태값 명칭이 시나리오 버튼과 같은지 확인 필요", "api": "R-05", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 상품번호 또는 판매신청서 번호: \n· 구분 (신규 등록 / 판매중 상품 수정): \n· 오로라에 보이는 검수 상태: \n· 검수 요청일: \n· '이미 진행중인 검수가 존재합니다' 오류가 떠요 (선택): \n\n문의 내용: ", "mode": "조건별: 임시저장·2차 검수완료·요청일로부터 5영업일 이내·진행중 검수 오류는 자동답변 종결 / 5영업일 경과는 상담원 배정 / 상태 '잘 모름'은 자동답변 + 상담원 확인 / 수정필요·검수거절은 PA003007, 승인 후 미노출은 PA003005로 바꿔 판정", "segs": [{"c": ["A"], "t": "임시저장·2차 검수완료·요청일로부터 5영업일 이내·진행중 검수 오류는 자동답변 종결"}, {"c": ["C"], "t": "5영업일 경과는 상담원 배정"}, {"c": ["B"], "t": "상태 '잘 모름'은 자동답변 + 상담원 확인"}, {"c": ["SW"], "t": "수정필요·검수거절은 PA003007, 승인 후 미노출은 PA003005로 바꿔 판정"}], "auto": "(공통 첫인사)\n(AI는 파트너가 적은 검수 요청일과 오늘 날짜로 영업일 수를 계산해 분기)\n\n[임시저장 상태인 경우]\n해당 판매신청서는 아직 임시저장 상태로 검수가 시작되지 않았습니다. 엑셀로 일괄 등록하신 경우 업로드에 성공해도 바로 검수요청 상태가 되지 않습니다. 오로라 > 상품관리 > 상품 검수 현황 > 판매검수현황에서 상품정보제공고시를 설정한 뒤 [검수요청] 버튼을 눌러 주셔야 검수가 시작됩니다. 단건 등록 중 임시저장하신 경우에도 같은 화면에서 검수요청을 진행해 주세요.\n\n[신규 등록 검수 중이고 요청일로부터 5영업일이 지나지 않은 경우]\n신규 상품 검수는 1차(가격·배송비·옵션)와 2차(상품명·대표이미지·대표옵션 등 기본 정보)로 진행되며, 평균 영업일 기준 5일 내 처리됩니다. 상품이 많이 몰리면 승인이 지연될 수 있습니다. 검수는 요청 순서대로 진행되고 있어 평균 처리 기간 안에는 별도로 앞당기기 어려운 점 양해 부탁드립니다. 요청일로부터 영업일 기준 5일이 지나도 검수 대기 상태면 상품번호와 요청일을 적어 새 문의로 남겨 주세요.\n\n[판매중 상품 수정 검수 중이고 요청일로부터 5영업일이 지나지 않은 경우]\n판매중 상품 수정은 항목별로 수정요청서가 따로 생성되어 각각 검수됩니다. 예를 들어 판매가·배송비·상품명을 한 번에 수정하셔도 수정요청서 3건으로 나뉘어 일부만 승인될 수 있습니다.\n- 가격(정상가·판매가), 배송비, 옵션 추가는 사전검수 항목으로 승인이 완료된 뒤 고객에게 노출되며, 처리까지 최대 5영업일 정도 걸릴 수 있습니다.\n- 상품명, 대표이미지, 정보고시, 옵션명·옵션값 등은 사후검수 항목으로 수정 즉시 노출되고, 기준 미달이면 수정 전 정보로 원복될 수 있습니다.\n검수 결과와 사유는 오로라 > 상품관리 > 상품 검수 현황 > 수정검수요청 현황(상단 오른쪽 탭) > 검수내역에서 확인하실 수 있습니다.\n\n[2차 검수완료 상태인 경우]\n2차 검수까지 완료되어 판매 가능한 상태입니다. 등록 완료 시에는 별도 알림 없이 판매중 또는 판매대기로 전환됩니다.\n- 판매대기라면 등록 시 [검수 완료 후 판매 대기 시작]으로 설정하신 것이라, 원하시는 시점에 직접 판매중으로 바꿔 주세요. 단건은 상품 조회/수정 > 상품 코드 클릭 > 상품상태, 일괄은 상품 조회/수정 > 상품ID 앞 네모칸 체크 > 상태 변경(판매중) > 일괄 변경에서 하실 수 있습니다.\n- 판매중이라면 2차 검수 완료 후 오늘의집 사이트에 노출되기까지 최소 2시간이 걸립니다.\n\n['이미 진행중인 검수가 존재합니다' 오류가 뜨는 경우]\n해당 상품은 이미 제출되어 검수가 진행 중이라 추가 수정 요청이 되지 않는 상태입니다. 진행 중인 검수가 끝난 뒤 다시 수정하실 수 있습니다. 검수를 직접 취소하신 판매신청서는 다시 사용할 수 없으니, 판매검수 요청 현황 목록 맨 오른쪽 [복사하기]로 복사한 뒤 수정해 제출해 주세요. 복사하면 상품명 앞에 '사본'이 붙어 띄어쓰기 포함 50자를 넘으면 복사가 되지 않으며, 이 경우 판매신청서를 새로 작성해 주셔야 합니다.\n\n[검수 상태를 모르시는 경우] → 위 단락 중 신규·수정 구분에 맞는 기간 안내 + 상태 확인 경로 안내 후 맺음 B\n(5영업일 이내·특정 상태면 맺음 A, 상태 '잘 모름'이면 맺음 B)", "ack": "검수 요청 후 영업일 기준 5일이 지나 처리 지연 건으로 담당 부서에 확인을 요청드리겠습니다.", "info": "상품번호·판매신청서(수정요청서) 번호, 신규/수정 구분, 파트너가 고른 검수 상태, 검수 요청일과 계산된 경과 영업일", "kms": "050_상품_검수.md, 056_상품_관리.md, 043_상품수정.md, 075_파트너센터_교육자료_상품검수.md, 094_영업_리스크팀_이관_유형_및_방법.md", "check": "1) 5영업일이 1·2차 전체 기준인지 차수별 기준인지 KMS에 없음 — AI 경과일 계산 기준이 달라짐\n2) 지연 시 처리 부서가 문서마다 다름(050 영업팀·상품검수팀 / 043·056 파트너대응 문의 채널)\n3) 파트너가 적은 요청일을 그대로 믿고 계산하는 방식이라 오입력 시 오답 가능 — 1차 허용 여부 확인"}}, {"code": "PA003002", "draft": false, "name": "상품 관리", "mid": "상품", "vol": "299", "mode": "AI 안내 종결", "utter": "일괄수정 어디서 하나요?\n옵션 삭제는 어떻게 해요? 안 쓰는 옵션이 있어서요\n품절 처리했는데 계속 주문이 들어와요", "raw": "1. 네, 파트너님. 어떤 항목을 등록하거나 수정하려고 하시나요?\n- 버튼: 옵션·재고·품절, 가격, 이미지, 일괄 등록·수정, 배송비·배송 설정, 판매상태·상품 삭제, 상품명 기준(예약판매 등), 기타\n(파트너가 바로 구체 질문을 입력하면 해당 분기로)\n(수정을 대신 해 달라는 요청이면 → PA003004 / 카테고리 변경·추가면 → PA003006 / 판매정지(신고)·검수 거절이면 → PA003007로 유형 변경)\n(직매입(1P/서플라이어) 상품이면 → 9)\n\n[옵션·재고·품절]\n2. 어떤 내용이 궁금하신가요?\n[옵션 삭제] → 2-1 / [품절 처리·재고 0인데 주문 들어옴] → 2-2 / [옵션값 추가] → 2-3 / [옵션값과 가격 같이 바꾸기] → 2-4 / [옵션명 자체 변경·추가] → PA003004로 이동 (유형 변경: PA003004) / ['옵션값은 중복될 수 없습니다' 오류] → 2-5\n2-1. 등록된 필수·추가 구매옵션은 삭제가 되지 않습니다. 더 이상 쓰지 않는 옵션은 [상품관리 > 상품조회/수정]에서 상품 검색 후 [제품수정] > 필수 구매옵션의 [옵션 펼쳐보기]에서 미사용으로 설정해 주세요.\n2-2. 재고 수량을 0으로만 바꾸면 취소가 생길 때 재고가 다시 더해져 주문이 들어올 수 있습니다. 판매를 막으시려면 재고상태를 '품절'로 바꿔주세요.\n- 개별: [상품관리 > 상품조회/수정 > 상품ID 클릭 > 구매옵션 펼치기]에서 재고를 0으로, 재고상태를 품절로 수정\n- 일괄: [상품관리 > 옵션재고 관리]에서 옵션 선택 후 옵션상태·옵션재고상태·재고수량 입력 > 일괄변경 (같은 페이지에서 선택한 옵션만 한 번에 변경됩니다)\n- 엑셀: [상품관리 > 상품 조회/수정 > 엑셀 양식 다운로드 > 옵션정보 수정양식(옵션재고, 품절처리 등)] 작성 후 엑셀 일괄 업로드\n2-3. 기존 옵션명 아래에 옵션값을 추가하시려면 [상품 조회/수정 > 엑셀 양식 > 옵션값 일괄 추가] 양식에 추가할 옵션값만 입력해 업로드해 주세요. 옵션 추가는 사전검수 항목이라 승인 후 노출됩니다. 추가옵션 추가도 가능합니다.\n2-4. 같은 옵션코드의 옵션값과 옵션가격을 동시에 바꾸는 것은 '옵션 수정 어뷰징'에 해당해 허용되지 않습니다. 둘 다 바꾸셔야 하면 기존 옵션을 미사용 처리한 뒤 옵션을 새로 추가해 신규 옵션코드로 등록해 주세요.\n2-5. 옵션값이 중복되면 저장되지 않습니다. 미사용 상태의 옵션값과 중복돼도 저장되지 않으니, 미사용 옵션값 뒤에 (미사용) 또는 (삭제) 같은 단어를 붙여 저장해 주세요.\n→ 공통-2 종료 (유형: PA003002)\n\n[가격]\n3. 정상가·판매가는 필수 구매옵션 란에서 입력·수정하실 수 있습니다. 대표옵션 행의 '대표'를 체크하셔야 대표가격 정보에 대표옵션 가격이 표시됩니다.\n가격(정상가·판매가)은 사전검수 항목이라 수정 즉시 반영되지 않고, 승인 후 고객에게 노출됩니다. 수정 전에 접수된 주문에는 바뀐 가격이 적용되지 않습니다.\n여러 상품은 [상품 조회/수정 > 엑셀 양식 > 가격 일괄 수정] 양식으로 수정하실 수 있습니다.\n[정상가 수정 공문을 받았어요] → 3-1 / [확인했어요] → 공통-2 종료 (유형: PA003002)\n3-1. 정상가 수정 공문을 받으셨다면 오늘의집 판매가는 바꾸실 필요 없고, 할인 전 가격인 정상가를 타사 실 판매가(타사 할인 전 가격이 아님)와 같거나 낮게 수정해 주세요. 정상가 관련 문의는 오늘의집 법무팀(legal@bucketplace.net)에서 답변드리고 있습니다.\n→ 공통-2 종료 (유형: PA003002)\n\n[이미지]\n4. 어떤 이미지 문제인가요?\n[업로드 실패 오류] → 4-1 / [상세페이지 이미지가 엑스박스로 보여요] → 4-2 / [이미지 기준(크기·형식)] → 4-3 / [공지이미지(배송지연·연휴) 등록] → 4-4\n4-1. 등록이 몰리는 시간대에 일시적으로 업로드가 실패할 수 있습니다. 30분~1시간 뒤 다시 시도해 주세요. 계속 실패하면 크롬 브라우저 사용, 쿠키·캐시 삭제, 시크릿 모드 접속 순으로 시도하시고, 크롬이 최신 버전인지도 확인해 주세요.\n(위 방법 후에도 실패한다고 하면 → 상담원 인계 (T5))\n4-2. 보안 프로토콜이 https로 바뀌어 이미지 주소가 http면 노출되지 않습니다. 이미지 서버가 https를 지원하면 주소의 http://를 https://로 바꿔주세요. 지원하지 않으면 이미지 호스트 주소와 원본 파일을 첨부해 다시 문의해 주세요.\n4-3. 대표·서브 이미지는 정사각형, 10MB 이하, JPG·JPEG·PNG만 등록 가능하며 GIF는 쓸 수 없습니다. 이미지 안에 광고 문구·텍스트는 넣을 수 없고, 브랜드·인증 로고는 좌측 상단에 넣을 수 있습니다. 서브이미지는 최대 7장이며 모두 채우지 않으셔도 됩니다. 상세 이미지는 가로 1,440px 권장, 세로 최대 10,000px이고 파일당 6MB를 넘으면 자동 축소되며 20MB를 넘으면 업로드되지 않습니다. 동영상·GIF는 상세페이지에만 [상품 수정 페이지 > 삽입 > 미디어 > 미디어 삽입/수정]으로 넣으실 수 있습니다.\n4-4. 상품별 등록은 [오로라 > 상품관리 > 상품 조회/수정 > 상품 검색 > 상품 설명 > 삽입], 일괄 등록은 [오로라 > 상품관리 > 공지이미지 관리 > 이미지 등록/변경]에서 하실 수 있습니다. 공지 이미지는 1개만 등록되고, 파일을 고르면 바로 반영되며 이전 파일은 다시 볼 수 없으니 미리 보관해 두세요.\n→ 공통-2 종료 (유형: PA003002)\n\n[일괄 등록·수정]\n5. 일괄 등록인가요, 판매중 상품 일괄 수정인가요?\n[일괄 수정] → 5-1 / [일괄 등록] → 5-2 / [업로드 실패 사유 확인] → 5-3\n5-1. [상품 조회/수정 > 엑셀 양식]에서 수정할 항목에 맞는 양식을 내려받아 작성한 뒤 [엑셀 일괄 업로드]로 올려주세요. 양식은 가격, 배송비 정보, 옵션값 추가(이상 사전검수), 상품 단위(상품명·이미지·최대구매수량), 옵션 단위(대표옵션·옵션값·재고·재입고일정·사용상태)(이상 사후검수)로 나뉩니다. 항목이 여러 개면 양식을 각각 올리셔야 하고, 한 번에 최대 2,000행까지 가능합니다. 검수 완료 전에 새 파일을 올리면 가장 최근 파일로 검수됩니다.\n일괄 수정은 오로라에서 직접 진행하셔야 하며 파트너센터에서 대신 처리해 드리지 않습니다.\n5-2. 일괄 등록은 [상품 일괄 등록]에서 1) 엑셀 양식 다운로드 2) 이미지 업로드 3) 카테고리·배송템플릿·브랜드 코드 찾기 4) 양식 작성 후 업로드 순서로 진행합니다. 이미지를 먼저 올려야 엑셀 일괄 업로드 버튼이 활성화됩니다. 카테고리는 최하위 카테고리까지 선택해야 하고, 업로드에 성공해도 임시저장 상태이니 [상품 검수 현황 > 판매검수현황]에서 상품정보제공고시를 설정한 뒤 검수요청을 눌러주세요.\n5-3. [상품 일괄 처리 현황 > 결과 파일 > 다운로드]에서 실패 사유를 확인하신 뒤 새 엑셀 파일로 다시 올려주세요. 실패 여부는 상품 단위로 판단되며, 옵션은 부분 성공이 없어 모든 옵션 정보가 맞아야 업로드됩니다. 이미지 파일명에 쉼표(,)가 있으면 오류가 나니 쉼표를 빼고 다시 올려주세요.\n→ 공통-2 종료 (유형: PA003002)\n\n[배송비·배송 설정]\n6. 어떤 설정이 궁금하신가요?\n[출고지·반품지 주소 변경] → 6-1 / [오늘출발 설정] → 6-2 / [배송템플릿·묶음배송] → 6-3 / [옵션별 착불 배송비] → 6-4\n6-1. [오로라 > 상품관리 > 상품조회/수정 > 엑셀 양식 다운로드 > 배송비정보 수정양식]에 상품코드와 반품교환지·출고지를 입력한 뒤 [엑셀 일괄 업로드 > 배송비 선택]으로 올려주세요. 출고지·반품교환지 변경은 미검수 항목이라 바로 반영됩니다. 계약 택배사가 바뀌었다면 [오로라 > 판매자 정보 > 판매자 정보 > 배송정보]에서 새 계약택배사를 등록한 뒤, 같은 양식의 '반품 택배사 관리코드'에 계약ID를 입력해 주세요.\n(계약 택배사 변경 없이 자동수거 반품지 변경이 필요하다고 하면 → 변경 주소 수집 후 상담원 인계 (T3-C))\n6-2. 일반택배 상품만 가능하며 주문제작·해외직구 상품은 신청할 수 없습니다. 상품 등록·수정 화면 [배송 > 배송기간]에서 출고소요일을 1일로 설정하고 출고소요일 기준시간을 입력한 뒤 오늘출발을 선택해 주세요. 일괄 변경은 배송비정보 수정양식(출고소요일·오늘출발여부·출고소요일 기준시간)으로 가능합니다.\n6-3. 배송템플릿은 [상품관리 > 배송템플릿 관리]에서 최대 50개까지 만들 수 있고, 상품 등록·수정 시 [배송 정보 > 자주 쓰는 템플릿 선택]에서 고르시면 됩니다. 미리 만들어 둔 템플릿만 노출됩니다. 묶음배송은 [상품관리 > 묶음배송 관리]에서 템플릿을 만든 뒤 상품 상세나 배송비정보 수정양식으로 지정해 주세요. 묶음배송 템플릿을 고르면 제품당 비례 배송비는 설정할 수 없습니다.\n6-4. 배송비는 선불·착불과 관계없이 1개만 설정됩니다. 옵션별로 배송비가 다르면 대표 배송비를 설정하고, 상품페이지 배너로 옵션별 착불 요금을 구매자가 충분히 알 수 있게 안내해 주세요.\n→ 공통-2 종료 (유형: PA003002)\n\n[판매상태·상품 삭제]\n7. 등록된 상품은 삭제가 되지 않습니다. 판매를 멈추시려면 판매정지로 바꿔주세요. 판매정지 상품은 검색에 노출되지 않습니다. 임시저장·검수취소 상품도 삭제는 되지 않습니다.\n- 단건: [오로라 > 상품 조회/수정 > 상품 코드 클릭 > 상품상태]\n- 일괄: [오로라 > 상품 조회/수정 > 상태 변경(판매중/판매정지) > 일괄 변경]\n일시품절 상품은 재고가 0이라 일괄 변경으로 판매중 전환이 되지 않습니다. 상품 상세에서 [재고/재고상태]를 먼저 수정해 주세요.\n판매정지(신고) 상품은 직접 전환되지 않습니다.\n[판매정지(신고) 상품이에요] → 7-1\n7-1. 해당 상품은 판매정지(신고) 상태라 직접 전환이 되지 않습니다. → PA003007 시나리오 4번으로 이동 (유형 변경: PA003007)\n→ 공통-2 종료 (유형: PA003002)\n\n[상품명 기준(예약판매 등)]\n8. 어떤 표기가 궁금하신가요?\n[예약판매] → 8-1 / [특수문자] → 8-2 / [글자수] → 8-3 / [쿠폰·특가·무료배송 등 문구] → 8-4\n8-1. 상품명 맨 앞에 [예약판매] 말머리를 쓰시고, 상품명에는 '7/19 발송' 같은 날짜를 적을 수 없습니다. 일부 옵션만 예약판매라면 옵션명에 [예약판매]를 적고, 출고 일정은 상세페이지에 자세히 적어 주세요. 재입고 일정이 정해지지 않았으면 예약판매가 불가합니다. 주문 후 제작하는 상품은 예약판매가 아니라 배송속성을 '주문제작'으로 설정해 주세요.\n8-2. 상품명에는 키보드 특수문자(` ~ ! @ # $ % ^ & * ( ) - = _ + , . / ; ' : \")를 쓸 수 있고, 전체 도형·특수기호(예: ☆ ☞ ㎡)는 쓸 수 없고, ㎡는 m2 또는 m^2로 적어주세요. [대괄호]는 상품명 맨 앞 말머리에만, (소괄호)는 맨 앞을 제외한 곳에만 쓸 수 있습니다.\n8-3. 상품명은 공백 포함 최대 50자, 옵션명은 35자(추가옵션은 100자), 브랜드명은 15자까지이며, 네이버쇼핑 연동을 위해 브랜드명+상품명+옵션명1·2 합계 100자 이내로 등록해 주세요.\n8-4. 특가·쿠폰·무료배송·오늘출발·당일출고·빠른배송, 기획전·모음전·시즌 문구, 최저가·1위·best·최고 같은 배타적 표현은 상품명에 쓸 수 없습니다. 쿠폰·특가·무료배송·오늘출발은 뱃지로 노출됩니다. 사은품은 [대괄호]가 아닌 형태로 적으실 수 있습니다.\n→ 공통-2 종료 (유형: PA003002)\n\n9. 직매입 상품 수정 관련 문의는 furniture_buying@bucketplace.net으로 직접 문의해 주세요.\n→ 공통-2 종료 (유형: PA003002)\n\n[기타 / 위 안내로 해결되지 않음]\n10. (KMS 검색 결과가 있으면 안내 / 없으면) 말씀하신 내용은 제가 정확히 안내드리기 어려워 상담원에게 연결해 드릴게요.\n→ 상담원 인계 (T5)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 어떤 항목을 등록하거나<br/>수정하려고 하시나요?\"]:::bot\nN2[\"<b>2<\/b> 어떤 내용이 궁금하신가요?\"]:::bot\nN2_1[\"<b>2-1<\/b> 등록된 필수·추가 구매옵션은 삭제가 되지<br/>않습니다. 더 이상 쓰지 않는 옵션은\"]:::bot\nN2_2[\"<b>2-2<\/b> 재고 수량을 0으로만 바꾸면 취소가 생길 때<br/>재고가 다시 더해져 주문이 들어올 수<br/>있습니다. 판매를 막으시려면 재고상태를<br/>'품절'로 바꿔주세요.\"]:::bot\nN2_3[\"<b>2-3<\/b> 기존 옵션명 아래에 옵션값을 추가하시려면\"]:::bot\nN2_4[\"<b>2-4<\/b> 같은 옵션코드의 옵션값과 옵션가격을 동시에<br/>바꾸는 것은 '옵션 수정 어뷰징'에 해당해<br/>허용되지 않습니다. 둘 다 바꾸셔야 하면<br/>기존 옵션을 미사용 처리한 뒤 옵션을 새로<br/>추가해 신규 옵션코드로 등록해 주세요.\"]:::bot\nN2_5[\"<b>2-5<\/b> 옵션값이 중복되면 저장되지 않습니다. 미사용<br/>상태의 옵션값과 중복돼도 저장되지 않으니,<br/>미사용 옵션값 뒤에 (미사용) 또는 (삭제)<br/>같은 단어를 붙여 저장해 주세요.\"]:::bot\nN3[\"<b>3<\/b> 정상가·판매가는 필수 구매옵션 란에서<br/>입력·수정하실 수 있습니다. 대표옵션 행의<br/>'대표'를 체크하셔야 대표가격 정보에<br/>대표옵션 가격이 표시됩니다.\"]:::bot\nN3_1[\"<b>3-1<\/b> 정상가 수정 공문을 받으셨다면 오늘의집<br/>판매가는 바꾸실 필요 없고, 할인 전 가격인<br/>정상가를 타사 실 판매가(타사 할인 전<br/>가격이 아님)와 같거나 낮게 수정해 주세요.<br/>정상가 관련 문의는 오늘의집<br/>법무팀(legal@bucketplace.net)에서<br/>답변드리고 있습니다.\"]:::bot\nN4[\"<b>4<\/b> 어떤 이미지 문제인가요?\"]:::bot\nN4_1[\"<b>4-1<\/b> 등록이 몰리는 시간대에 일시적으로 업로드가<br/>실패할 수 있습니다. 30분~1시간 뒤 다시<br/>시도해 주세요. 계속 실패하면 크롬 브라우저<br/>사용, 쿠키·캐시 삭제, 시크릿 모드 접속<br/>순으로 시도하시고, 크롬이 최신 버전인지도<br/>확인해 주세요.\"]:::bot\nN4_2[\"<b>4-2<\/b> 보안 프로토콜이 https로 바뀌어 이미지<br/>주소가 http면 노출되지 않습니다. 이미지<br/>서버가 https를 지원하면 주소의<br/>http://를 https://로<br/>바꿔주세요. 지원하지 않으면 이미지 호스트<br/>주소와 원본 파일을 첨부해 다시 문의해<br/>주세요.\"]:::bot\nN4_3[\"<b>4-3<\/b> 대표·서브 이미지는 정사각형, 10MB<br/>이하, JPG·JPEG·PNG만 등록<br/>가능하며 GIF는 쓸 수 없습니다. 이미지<br/>안에 광고 문구·텍스트는 넣을 수 없고,<br/>브랜드·인증 로고는 좌측 상단에 넣을 수<br/>있습니다. 서브이미지는 최대 7장이며 모두<br/>채우지 않으셔도 됩니다. 상세 이미지는 가로<br/>1,440px 권장, 세로 최대<br/>10,000px이고 파일당 6MB를 넘으면<br/>자동 축소되며 20MB를 넘으면 업로드되지<br/>않습니다. 동영상·GIF는 상세페이지에만\"]:::bot\nN4_4[\"<b>4-4<\/b> 상품별 등록은\"]:::bot\nN5[\"<b>5<\/b> 일괄 등록인가요, 판매중 상품 일괄<br/>수정인가요?\"]:::bot\nN5_1{{\"상품 조회/수정 › 엑셀<br/>양식\"}}:::sec\nN5_1_5_2[\"<b>5-2<\/b> 일괄 등록은\"]:::bot\nN5_3{{\"상품 일괄 처리 현황 ›<br/>결과 파일 › 다운로드\"}}:::sec\nN5_3_6[\"<b>6<\/b> 어떤 설정이 궁금하신가요?\"]:::bot\nN6_1{{\"오로라 › 상품관리 ›<br/>상품조회/수정 › 엑셀<br/>양식 다운로드 ›<br/>배송비정보 수정양식\"}}:::sec\nN6_1_6_2[\"<b>6-2<\/b> 일반택배 상품만 가능하며 주문제작·해외직구<br/>상품은 신청할 수 없습니다. 상품 등록·수정<br/>화면\"]:::bot\nN6_1_6_3[\"<b>6-3<\/b> 배송템플릿은\"]:::bot\nN6_1_6_4[\"<b>6-4<\/b> 배송비는 선불·착불과 관계없이 1개만<br/>설정됩니다. 옵션별로 배송비가 다르면 대표<br/>배송비를 설정하고, 상품페이지 배너로 옵션별<br/>착불 요금을 구매자가 충분히 알 수 있게<br/>안내해 주세요.\"]:::bot\nN6_1_7[\"<b>7<\/b> 등록된 상품은 삭제가 되지 않습니다. 판매를<br/>멈추시려면 판매정지로 바꿔주세요. 판매정지<br/>상품은 검색에 노출되지 않습니다.<br/>임시저장·검수취소 상품도 삭제는 되지<br/>않습니다.\"]:::bot\nN6_1_7_1[\"<b>7-1<\/b> 해당 상품은 판매정지(신고) 상태라 직접<br/>전환이 되지 않습니다.\"]:::bot\nN6_1_8[\"<b>8<\/b> 어떤 표기가 궁금하신가요?\"]:::bot\nN6_1_8_1[\"<b>8-1<\/b> 상품명 맨 앞에\"]:::bot\nN6_1_8_2[\"<b>8-2<\/b> 상품명에는 키보드 특수문자(' ~ ! @ ＃<br/>$ % ^ & * ( ) - = _ + ,<br/>. / ; ' : ')를 쓸 수 있고, 전체<br/>도형·특수기호(예: ☆ ☞ ㎡)는 쓸 수<br/>없고, ㎡는 m2 또는 m^2로 적어주세요.\"]:::bot\nN6_1_8_3[\"<b>8-3<\/b> 상품명은 공백 포함 최대 50자, 옵션명은<br/>35자(추가옵션은 100자), 브랜드명은<br/>15자까지이며, 네이버쇼핑 연동을 위해<br/>브랜드명+상품명+옵션명1·2 합계 100자<br/>이내로 등록해 주세요.\"]:::bot\nN6_1_8_4[\"<b>8-4<\/b> 특가·쿠폰·무료배송·오늘출발·당일출고·빠른배송,<br/>기획전·모음전·시즌 문구,<br/>최저가·1위·best·최고 같은 배타적<br/>표현은 상품명에 쓸 수 없습니다.<br/>쿠폰·특가·무료배송·오늘출발은 뱃지로<br/>노출됩니다. 사은품은\"]:::bot\nN6_1_9[\"<b>9<\/b> 직매입 상품 수정 관련 문의는<br/>furniture_buying@bucketplace.net으로<br/>직접 문의해 주세요.\"]:::bot\nN6_1_10[\"<b>10<\/b> (KMS 검색 결과가 있으면 안내 /<br/>없으면) 말씀하신 내용은 제가 정확히<br/>안내드리기 어려워 상담원에게 연결해<br/>드릴게요.\"]:::bot\nS --> N1\nN1 -->|\"수정을 대신 해 달라는 요청이면\"| SW_PA003004\nN1 -->|\"카테고리 변경·추가면\"| SW_PA003006\nN1 -->|\"판매정지(신고)·검수 거절이면\"| SW_PA003007\nN1 -->|\"직매입(1P/서플라이어) 상품이면\"| N6_1_9\nN1 -->|\"옵션·재고·품절\"| N2\nN2 -->|\"옵션 삭제\"| N2_1\nN2 -->|\"품절 처리·재고 0인데 주문 들어옴\"| N2_2\nN2 -->|\"옵션값 추가\"| N2_3\nN2 -->|\"옵션값과 가격 같이 바꾸기\"| N2_4\nN2 -->|\"옵션명 자체 변경·추가 ·\"| SW_PA003004\nN2 -->|\"'옵션값은 중복될 수 없습니다' 오류\"| N2_5\nN2_1 -->|\"상품관리 › 상품조회/수정 / 제품수정 /<br/>옵션 펼쳐보기\"| N2_2\nN2_3 -->|\"상품 조회/수정 › 엑셀 양식 › 옵션값<br/>일괄 추가\"| N2_4\nN2_5 --> END\nN2_5 -->|\"가격\"| N3\nN3 -->|\"정상가 수정 공문을 받았어요\"| N3_1\nN3 -->|\"확인했어요\"| END\nN3_1 --> END\nN3_1 -->|\"이미지\"| N4\nN4 -->|\"업로드 실패 오류\"| N4_1\nN4 -->|\"상세페이지 이미지가 엑스박스로 보여요\"| N4_2\nN4 -->|\"이미지 기준(크기·형식)\"| N4_3\nN4 -->|\"공지이미지(배송지연·연휴) 등록\"| N4_4\nN4_1 -->|\"위 방법 후에도 실패한다고 하면\"| HO_T5\nN4_3 -->|\"상품 수정 페이지 › 삽입 › 미디어 ›<br/>미디어 삽입/수정\"| N4_4\nN4_4 --> END\nN4_4 -->|\"일괄 등록·수정\"| N5\nN5 -->|\"일괄 수정\"| N5_1\nN5 -->|\"일괄 등록\"| N5_1_5_2\nN5 -->|\"업로드 실패 사유 확인\"| N5_3\nN2_1 -->|\"상품 조회/수정 › 엑셀 양식\"| N5_1\nN2_3 -->|\"상품 일괄 처리 현황 › 결과 파일 ›<br/>다운로드\"| N5_3\nN5_3 --> END\nN5_3 -->|\"배송비·배송 설정\"| N5_3_6\nN5_3_6 -->|\"출고지·반품지 주소 변경\"| N6_1\nN5_3_6 -->|\"오늘출발 설정\"| N6_1_6_2\nN5_3_6 -->|\"배송템플릿·묶음배송\"| N6_1_6_3\nN5_3_6 -->|\"옵션별 착불 배송비\"| N6_1_6_4\nN2_1 -->|\"오로라 › 상품관리 › 상품조회/수정 ›<br/>엑셀 양식 다운로드 › 배송비정보 수정양식\"| N6_1\nN6_1 -->|\"계약 택배사 변경 없이 자동수거 반품지<br/>변경이 필요하다고 하면\"| HO_T3C\nN6_1_6_2 -->|\"배송 › 배송기간\"| N6_1_6_3\nN6_1_6_3 -->|\"상품관리 › 배송템플릿 관리 / 배송 정보<br/>› 자주 쓰는 템플릿 선택 / 상품관리 ›<br/>묶음배송 관리\"| N6_1_6_4\nN6_1_6_4 --> END\nN6_1_6_4 -->|\"판매상태·상품 삭제\"| N6_1_7\nN6_1_7 -->|\"판매정지(신고) 상품이에요\"| N6_1_7_1\nN6_1_7_1 --> SW_PA003007\nN6_1_7_1 --> END\nN6_1_7_1 -->|\"상품명 기준(예약판매 등)\"| N6_1_8\nN6_1_8 -->|\"예약판매\"| N6_1_8_1\nN6_1_8 -->|\"특수문자\"| N6_1_8_2\nN6_1_8 -->|\"글자수\"| N6_1_8_3\nN6_1_8 -->|\"쿠폰·특가·무료배송 등 문구\"| N6_1_8_4\nN6_1_8_1 -->|\"예약판매 / 예약판매\"| N6_1_8_2\nN6_1_8_2 -->|\"대괄호\"| N6_1_8_3\nN6_1_8_4 --> END\nN6_1_8_4 -->|\"대괄호\"| N6_1_9\nN6_1_9 --> END\nN6_1_9 -->|\"기타 / 위 안내로 해결되지 않음\"| N6_1_10\nN6_1_10 --> HO_T5\nN2_2 --> N2_3\nN2_4 --> N2_5\nN4_2 --> N4_3\nN5_1 --> N5_1_5_2\nN6_1_8_3 --> N6_1_8_4\nSW_PA003004[/\"「상품명·옵션명 수정 요청」로 전환\"/]:::sw\nSW_PA003006[/\"「카테고리 추가·변경」로 전환\"/]:::sw\nSW_PA003007[/\"「검수 반려·판매정지 사유」로 전환\"/]:::sw\nEND([\"상담 종료\"]):::fin\nHO_T5([\"상담원 인계<br/>답변 불가\"]):::ho\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 어떤 항목을 등록하거나 수정하려고 하시나요?", "sec": false, "body": ["- 버튼: 옵션·재고·품절, 가격, 이미지, 일괄 등록·수정, 배송비·배송 설정, 판매상태·상품 삭제, 상품명 기준(예약판매 등), 기타", "(파트너가 바로 구체 질문을 입력하면 해당 분기로)"]}, {"k": "2", "id": "2", "t": "어떤 내용이 궁금하신가요?", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "등록된 필수·추가 구매옵션은 삭제가 되지 않습니다. 더 이상 쓰지 않는 옵션은", "sec": false, "body": []}, {"k": "2-2", "id": "2-2", "t": "재고 수량을 0으로만 바꾸면 취소가 생길 때 재고가 다시 더해져 주문이 들어올 수 있습니다. 판매를 막으시려면 재고상태를 '품절'로 바꿔주세요.", "sec": false, "body": ["- 개별: [상품관리 > 상품조회/수정 > 상품ID 클릭 > 구매옵션 펼치기]에서 재고를 0으로, 재고상태를 품절로 수정", "- 일괄: [상품관리 > 옵션재고 관리]에서 옵션 선택 후 옵션상태·옵션재고상태·재고수량 입력 > 일괄변경 (같은 페이지에서 선택한 옵션만 한 번에 변경됩니다)", "- 엑셀: [상품관리 > 상품 조회/수정 > 엑셀 양식 다운로드 > 옵션정보 수정양식(옵션재고, 품절처리 등)] 작성 후 엑셀 일괄 업로드"]}, {"k": "2-3", "id": "2-3", "t": "기존 옵션명 아래에 옵션값을 추가하시려면", "sec": false, "body": []}, {"k": "2-4", "id": "2-4", "t": "같은 옵션코드의 옵션값과 옵션가격을 동시에 바꾸는 것은 '옵션 수정 어뷰징'에 해당해 허용되지 않습니다. 둘 다 바꾸셔야 하면 기존 옵션을 미사용 처리한 뒤 옵션을 새로 추가해 신규 옵션코드로 등록해 주세요.", "sec": false, "body": []}, {"k": "2-5", "id": "2-5", "t": "옵션값이 중복되면 저장되지 않습니다. 미사용 상태의 옵션값과 중복돼도 저장되지 않으니, 미사용 옵션값 뒤에 (미사용) 또는 (삭제) 같은 단어를 붙여 저장해 주세요.", "sec": false, "body": []}, {"k": "3", "id": "3", "t": "정상가·판매가는 필수 구매옵션 란에서 입력·수정하실 수 있습니다. 대표옵션 행의 '대표'를 체크하셔야 대표가격 정보에 대표옵션 가격이 표시됩니다.", "sec": false, "body": ["가격(정상가·판매가)은 사전검수 항목이라 수정 즉시 반영되지 않고, 승인 후 고객에게 노출됩니다. 수정 전에 접수된 주문에는 바뀐 가격이 적용되지 않습니다.", "여러 상품은 [상품 조회/수정 > 엑셀 양식 > 가격 일괄 수정] 양식으로 수정하실 수 있습니다."]}, {"k": "3-1", "id": "3-1", "t": "정상가 수정 공문을 받으셨다면 오늘의집 판매가는 바꾸실 필요 없고, 할인 전 가격인 정상가를 타사 실 판매가(타사 할인 전 가격이 아님)와 같거나 낮게 수정해 주세요. 정상가 관련 문의는 오늘의집 법무팀(legal@bucketplace.net)에서 답변드리고 있습니다.", "sec": false, "body": []}, {"k": "4", "id": "4", "t": "어떤 이미지 문제인가요?", "sec": false, "body": []}, {"k": "4-1", "id": "4-1", "t": "등록이 몰리는 시간대에 일시적으로 업로드가 실패할 수 있습니다. 30분~1시간 뒤 다시 시도해 주세요. 계속 실패하면 크롬 브라우저 사용, 쿠키·캐시 삭제, 시크릿 모드 접속 순으로 시도하시고, 크롬이 최신 버전인지도 확인해 주세요.", "sec": false, "body": []}, {"k": "4-2", "id": "4-2", "t": "보안 프로토콜이 https로 바뀌어 이미지 주소가 http면 노출되지 않습니다. 이미지 서버가 https를 지원하면 주소의 http://를 https://로 바꿔주세요. 지원하지 않으면 이미지 호스트 주소와 원본 파일을 첨부해 다시 문의해 주세요.", "sec": false, "body": []}, {"k": "4-3", "id": "4-3", "t": "대표·서브 이미지는 정사각형, 10MB 이하, JPG·JPEG·PNG만 등록 가능하며 GIF는 쓸 수 없습니다. 이미지 안에 광고 문구·텍스트는 넣을 수 없고, 브랜드·인증 로고는 좌측 상단에 넣을 수 있습니다. 서브이미지는 최대 7장이며 모두 채우지 않으셔도 됩니다. 상세 이미지는 가로 1,440px 권장, 세로 최대 10,000px이고 파일당 6MB를 넘으면 자동 축소되며 20MB를 넘으면 업로드되지 않습니다. 동영상·GIF는 상세페이지에만", "sec": false, "body": []}, {"k": "4-4", "id": "4-4", "t": "상품별 등록은", "sec": false, "body": []}, {"k": "5", "id": "5", "t": "일괄 등록인가요, 판매중 상품 일괄 수정인가요?", "sec": false, "body": []}, {"k": "5-1", "id": "5-1", "t": "상품 조회/수정 > 엑셀 양식", "sec": true, "body": ["일괄 수정은 오로라에서 직접 진행하셔야 하며 파트너센터에서 대신 처리해 드리지 않습니다."]}, {"k": "5-1/5-2", "id": "5-2", "t": "일괄 등록은", "sec": false, "body": []}, {"k": "5-3", "id": "5-3", "t": "상품 일괄 처리 현황 > 결과 파일 > 다운로드", "sec": true, "body": []}, {"k": "5-3/6", "id": "6", "t": "어떤 설정이 궁금하신가요?", "sec": false, "body": []}, {"k": "6-1", "id": "6-1", "t": "오로라 > 상품관리 > 상품조회/수정 > 엑셀 양식 다운로드 > 배송비정보 수정양식", "sec": true, "body": []}, {"k": "6-1/6-2", "id": "6-2", "t": "일반택배 상품만 가능하며 주문제작·해외직구 상품은 신청할 수 없습니다. 상품 등록·수정 화면", "sec": false, "body": []}, {"k": "6-1/6-3", "id": "6-3", "t": "배송템플릿은", "sec": false, "body": []}, {"k": "6-1/6-4", "id": "6-4", "t": "배송비는 선불·착불과 관계없이 1개만 설정됩니다. 옵션별로 배송비가 다르면 대표 배송비를 설정하고, 상품페이지 배너로 옵션별 착불 요금을 구매자가 충분히 알 수 있게 안내해 주세요.", "sec": false, "body": []}, {"k": "6-1/7", "id": "7", "t": "등록된 상품은 삭제가 되지 않습니다. 판매를 멈추시려면 판매정지로 바꿔주세요. 판매정지 상품은 검색에 노출되지 않습니다. 임시저장·검수취소 상품도 삭제는 되지 않습니다.", "sec": false, "body": ["- 단건: [오로라 > 상품 조회/수정 > 상품 코드 클릭 > 상품상태]", "- 일괄: [오로라 > 상품 조회/수정 > 상태 변경(판매중/판매정지) > 일괄 변경]", "일시품절 상품은 재고가 0이라 일괄 변경으로 판매중 전환이 되지 않습니다. 상품 상세에서 [재고/재고상태]를 먼저 수정해 주세요.", "판매정지(신고) 상품은 직접 전환되지 않습니다."]}, {"k": "6-1/7-1", "id": "7-1", "t": "해당 상품은 판매정지(신고) 상태라 직접 전환이 되지 않습니다. → PA003007 시나리오 4번으로 이동 (유형 변경: PA003007)", "sec": false, "body": []}, {"k": "6-1/8", "id": "8", "t": "어떤 표기가 궁금하신가요?", "sec": false, "body": []}, {"k": "6-1/8-1", "id": "8-1", "t": "상품명 맨 앞에", "sec": false, "body": []}, {"k": "6-1/8-2", "id": "8-2", "t": "상품명에는 키보드 특수문자(` ~ ! @ # $ % ^ & * ( ) - = _ + , . / ; ' : \")를 쓸 수 있고, 전체 도형·특수기호(예: ☆ ☞ ㎡)는 쓸 수 없고, ㎡는 m2 또는 m^2로 적어주세요.", "sec": false, "body": []}, {"k": "6-1/8-3", "id": "8-3", "t": "상품명은 공백 포함 최대 50자, 옵션명은 35자(추가옵션은 100자), 브랜드명은 15자까지이며, 네이버쇼핑 연동을 위해 브랜드명+상품명+옵션명1·2 합계 100자 이내로 등록해 주세요.", "sec": false, "body": []}, {"k": "6-1/8-4", "id": "8-4", "t": "특가·쿠폰·무료배송·오늘출발·당일출고·빠른배송, 기획전·모음전·시즌 문구, 최저가·1위·best·최고 같은 배타적 표현은 상품명에 쓸 수 없습니다. 쿠폰·특가·무료배송·오늘출발은 뱃지로 노출됩니다. 사은품은", "sec": false, "body": []}, {"k": "6-1/9", "id": "9", "t": "직매입 상품 수정 관련 문의는 furniture_buying@bucketplace.net으로 직접 문의해 주세요.", "sec": false, "body": []}, {"k": "6-1/10", "id": "10", "t": "(KMS 검색 결과가 있으면 안내 / 없으면) 말씀하신 내용은 제가 정확히 안내드리기 어려워 상담원에게 연결해 드릴게요.", "sec": false, "body": []}], "hocond": "KMS에 없는 기능·오류 문의 T5, 브라우저 조치 후에도 이미지 업로드 실패 T5, 자동수거 반품지 변경(계약 택배사 변경 없음) T3-C, 같은 질문 반복 T2", "hoinfo": "문의 항목(옵션·가격·이미지·일괄·배송·상태·상품명), 상품번호, 오류 메시지·화면 캡처 유무, 파트너가 이미 시도한 조치, 자동수거 반품지 변경이면 변경 주소", "kms": "043_상품수정, 044_상품명_옵션명, 045_이미지_등록_수정_, 056_상품_관리, 050_상품_검수", "check": "예약판매 상품명 날짜 표기 기준 상충(043 내부에서도 '정확한 출고 일정 기재'와 '날짜 기입 불가'가 공존, 044는 상세페이지·옵션명에 날짜) / 상품명 허용 특수문자 상충(044 shift+숫자키 전체 vs 056 7종) / 자동수거 반품지 변경 처리처(KMS는 '심층문의') 상담원 경로 확인 / 일괄 처리 결과 파일 조회 API 가능 여부 / (1차 전환) 판매정지(신고) 여부를 파트너 말로만 판단해 7-1로 보냄. 판매정지(신고) 상태를 파트너가 오로라 어디에서 확인하는지 KMS 경로가 없어 안내하지 않음", "api": "R-05", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 궁금한 항목: \n· 상품번호 (선택): \n· 오류 문구·화면 캡처 (선택): 첨부파일로 올려 주세요\n· 이미 시도해 본 방법 (선택): \n\n문의 내용: ", "mode": "조건별: 등록·수정 방법은 자동답변 종결 / 자동수거 반품지 변경(계약 택배사 변경 없음)·브라우저 조치 후에도 이미지 업로드 실패·KMS에 없는 기능 문의는 상담원 배정 / 대신 수정 요청은 PA003004, 카테고리는 PA003006, 판매정지(신고)는 PA003007로 바꿔 판정", "segs": [{"c": ["A"], "t": "등록·수정 방법은 자동답변 종결"}, {"c": ["C"], "t": "자동수거 반품지 변경(계약 택배사 변경 없음)·브라우저 조치 후에도 이미지 업로드 실패·KMS에 없는 기능 문의는 상담원 배정"}, {"c": ["SW"], "t": "대신 수정 요청은 PA003004, 카테고리는 PA003006, 판매정지(신고)는 PA003007로 바꿔 판정"}], "auto": "(공통 첫인사)\n\n[옵션·재고·품절]\n- 옵션 삭제: 등록된 필수·추가 구매옵션은 삭제가 되지 않습니다. 쓰지 않는 옵션은 상품관리 > 상품조회/수정에서 상품 검색 후 [제품수정] > 필수 구매옵션의 [옵션 펼쳐보기]에서 미사용으로 설정해 주세요.\n- 재고 0인데 주문이 들어올 때: 재고 수량을 0으로만 바꾸면 취소가 생길 때 재고가 다시 더해져 주문이 들어올 수 있습니다. 판매를 막으시려면 재고상태를 '품절'로 바꿔 주세요. 개별은 상품관리 > 상품조회/수정 > 상품ID 클릭 > 구매옵션 펼치기, 일괄은 상품관리 > 옵션재고 관리에서 옵션 선택 후 일괄변경, 엑셀은 상품 조회/수정 > 엑셀 양식 다운로드 > 옵션정보 수정양식으로 하실 수 있습니다.\n- 옵션값 추가: 상품 조회/수정 > 엑셀 양식 > 옵션값 일괄 추가 양식에 추가할 옵션값만 입력해 업로드해 주세요. 사전검수 항목이라 승인 후 노출됩니다.\n- 옵션값과 가격 동시 변경: 같은 옵션코드의 옵션값과 옵션가격을 동시에 바꾸는 것은 '옵션 수정 어뷰징'에 해당해 허용되지 않습니다. 기존 옵션을 미사용 처리한 뒤 옵션을 새로 추가해 주세요.\n- '옵션값은 중복될 수 없습니다' 오류: 미사용 옵션값과 중복돼도 저장되지 않으니, 미사용 옵션값 뒤에 (미사용) 또는 (삭제) 같은 단어를 붙여 저장해 주세요.\n\n[가격]\n정상가·판매가는 필수 구매옵션 란에서 입력·수정하실 수 있고, 대표옵션 행의 '대표'를 체크하셔야 대표가격에 대표옵션 가격이 표시됩니다. 가격은 사전검수 항목이라 승인 후 고객에게 노출되며, 수정 전에 접수된 주문에는 바뀐 가격이 적용되지 않습니다. 여러 상품은 상품 조회/수정 > 엑셀 양식 > 가격 일괄 수정 양식으로 수정하실 수 있습니다.\n정상가 수정 공문을 받으셨다면 오늘의집 판매가는 바꾸실 필요 없고, 할인 전 가격인 정상가를 타사 실 판매가(타사 할인 전 가격이 아님)와 같거나 낮게 수정해 주세요. 정상가 관련 문의는 오늘의집 법무팀(legal@bucketplace.net)에서 답변드리고 있습니다.\n\n[이미지]\n- 업로드 실패: 등록이 몰리는 시간대에 일시적으로 실패할 수 있어 30분~1시간 뒤 다시 시도해 주세요. 계속 실패하면 크롬 브라우저 사용, 쿠키·캐시 삭제, 시크릿 모드 접속 순으로 시도하시고 크롬이 최신 버전인지도 확인해 주세요.\n- 상세 이미지가 엑스박스로 보임: 이미지 주소가 http면 노출되지 않습니다. 이미지 서버가 https를 지원하면 주소의 http://를 https://로 바꿔 주세요.\n- 기준: 대표·서브 이미지는 정사각형, 10MB 이하, JPG·JPEG·PNG만 가능(GIF 불가)하며 광고 문구·텍스트는 넣을 수 없고 브랜드·인증 로고는 좌측 상단에 넣을 수 있습니다. 서브이미지는 최대 7장입니다. 상세 이미지는 가로 1,440px 권장, 세로 최대 10,000px이며 파일당 6MB를 넘으면 자동 축소되고 20MB를 넘으면 업로드되지 않습니다.\n- 공지 이미지: 상품별은 상품 조회/수정 > 상품 검색 > 상품 설명 > 삽입, 일괄은 오로라 > 상품관리 > 공지이미지 관리 > 이미지 등록/변경에서 하실 수 있습니다. 1개만 등록되고 이전 파일은 다시 볼 수 없으니 미리 보관해 두세요.\n\n[일괄 등록·수정]\n- 일괄 수정: 상품 조회/수정 > 엑셀 양식에서 수정할 항목에 맞는 양식을 내려받아 작성한 뒤 [엑셀 일괄 업로드]로 올려 주세요. 항목이 여러 개면 양식을 각각 올리셔야 하고, 한 번에 최대 2,000행까지 가능합니다. 검수 완료 전에 새 파일을 올리면 가장 최근 파일로 검수됩니다. 일괄 수정은 오로라에서 직접 진행하셔야 하며 파트너센터에서 대신 처리해 드리지 않습니다.\n- 일괄 등록: 상품 일괄 등록에서 엑셀 양식 다운로드 → 이미지 업로드 → 카테고리·배송템플릿·브랜드 코드 찾기 → 양식 작성 후 업로드 순서로 진행합니다. 이미지를 먼저 올려야 업로드 버튼이 활성화되고, 카테고리는 최하위까지 선택해야 합니다. 업로드에 성공해도 임시저장 상태이니 상품 검수 현황 > 판매검수현황에서 상품정보제공고시를 설정한 뒤 검수요청을 눌러 주세요.\n- 업로드 실패: 상품 일괄 처리 현황 > 결과 파일 > 다운로드에서 실패 사유를 확인하신 뒤 새 파일로 다시 올려 주세요. 옵션은 부분 성공이 없어 모든 옵션 정보가 맞아야 업로드되며, 이미지 파일명에 쉼표(,)가 있으면 오류가 납니다.\n\n[출고지·반품지·배송 설정]\n- 출고지·반품지 변경: 상품조회/수정 > 엑셀 양식 다운로드 > 배송비정보 수정양식에 상품코드와 반품교환지·출고지를 입력한 뒤 엑셀 일괄 업로드 > 배송비 선택으로 올려 주세요. 미검수 항목이라 바로 반영됩니다. 계약 택배사가 바뀌었다면 오로라 > 판매자 정보 > 판매자 정보 > 배송정보에서 새 계약택배사를 등록한 뒤 같은 양식의 '반품 택배사 관리코드'에 계약ID를 입력해 주세요.\n- 오늘출발: 일반택배 상품만 가능하며 주문제작·해외직구 상품은 신청할 수 없습니다. 배송 > 배송기간에서 출고소요일을 1일로, 출고소요일 기준시간을 입력한 뒤 오늘출발을 선택해 주세요.\n- 배송템플릿·묶음배송: 배송템플릿은 상품관리 > 배송템플릿 관리에서 최대 50개까지 만들 수 있습니다. 묶음배송은 상품관리 > 묶음배송 관리에서 템플릿을 만든 뒤 지정해 주세요. 묶음배송 템플릿을 고르면 제품당 비례 배송비는 설정할 수 없습니다.\n- 옵션별 착불 배송비: 배송비는 선불·착불과 관계없이 1개만 설정됩니다. 대표 배송비를 설정하고, 상품페이지 배너로 옵션별 착불 요금을 안내해 주세요.\n\n[판매상태·상품 삭제]\n등록된 상품은 삭제가 되지 않습니다. 판매를 멈추시려면 판매정지로 바꿔 주세요(판매정지 상품은 검색에 노출되지 않습니다). 단건은 오로라 > 상품 조회/수정 > 상품 코드 클릭 > 상품상태, 일괄은 상품 조회/수정 > 상태 변경(판매중/판매정지) > 일괄 변경에서 하실 수 있습니다. 일시품절 상품은 재고가 0이라 일괄 변경으로 판매중 전환이 되지 않으니 상품 상세에서 재고·재고상태를 먼저 수정해 주세요. 판매정지(신고) 상품은 직접 전환되지 않습니다.\n\n[상품명 표기 기준]\n- 예약판매: 상품명 맨 앞에 [예약판매] 말머리를 쓰시고, 상품명에는 '7/19 발송' 같은 날짜를 적을 수 없습니다. 일부 옵션만 예약판매라면 옵션명에 [예약판매]를 적고, 출고 일정은 상세페이지에 자세히 적어 주세요. 재입고 일정이 정해지지 않았으면 예약판매가 불가하며, 주문 후 제작하는 상품은 배송속성을 '주문제작'으로 설정해 주세요.\n- 특수문자: 키보드 특수문자(` ~ ! @ # $ % ^ & * ( ) - = _ + , . / ; ' : \")를 쓸 수 있고, 도형·특수기호(예: ☆ ☞ ㎡)는 쓸 수 없고 ㎡는 m2 또는 m^2로 적어 주세요. [대괄호]는 맨 앞 말머리에만, (소괄호)는 맨 앞을 제외한 곳에만 쓸 수 있습니다.\n- 글자수: 상품명은 공백 포함 최대 50자, 옵션명은 35자(추가옵션은 100자), 브랜드명은 15자까지이며 브랜드명+상품명+옵션명1·2 합계 100자 이내로 등록해 주세요.\n- 금지 문구: 특가·쿠폰·무료배송·오늘출발·당일출고·빠른배송, 기획전·모음전·시즌 문구, 최저가·1위·best·최고 같은 배타적 표현은 쓸 수 없습니다.\n\n[직매입 상품]\n직매입 상품 수정 관련 문의는 furniture_buying@bucketplace.net 으로 직접 문의해 주세요.\n(문의 항목에 해당하는 단락만 안내, 맺음 A)", "ack": "문의하신 내용은 담당 상담원이 확인해 안내드리겠습니다. 오류 화면이 있으면 확인에 도움이 됩니다.", "info": "문의 항목, 상품번호, 오류 문구·캡처 유무, 파트너가 이미 시도한 조치, 자동수거 반품지 변경이면 변경 주소", "kms": "043_상품수정.md, 044_상품명_옵션명.md, 045_이미지_등록_수정_.md, 056_상품_관리.md, 050_상품_검수.md", "check": "1) 예약판매 상품명 날짜 표기 기준 상충(043 내부, 044)\n2) 상품명 허용 특수문자 상충(044 vs 056)\n3) 자동수거 반품지 변경 처리 부서(KMS는 '심층문의')"}}, {"code": "PA003003", "draft": false, "name": "지식재산권 및 도용", "mid": "상품", "vol": "", "mode": "안내 후 조건부 상담원 연결", "utter": "다른 업체가 저희 상품 사진을 그대로 도용해서 팔고 있어요\n상표권 침해 신고 들어왔다고 판매정지됐어요. 풀어주세요\n타사 홈페이지 이미지 써도 되나요?", "raw": "1. 네, 파트너님. 어떤 상황이신지 알려주시겠어요?\n- 버튼: 다른 업체가 내 상품·이미지·상표를 도용해요, 내 상품이 권리침해 신고로 판매정지됐어요, 이미지·디자인 사용 가능 여부가 궁금해요\n\n[다른 업체가 내 상품·이미지·상표를 도용해요]\n2. 상표권·디자인권·저작권 등 지식재산권 침해 신고는 안전거래센터에서 접수하실 수 있습니다. 파트너센터 홈페이지 맨 아래 [안전거래센터 바로가기]를 눌러 [지식재산권신고] 메뉴를 이용해 주세요. 안전거래센터에서는 위해상품정보, 상품운영정책, 인증정보도 확인하실 수 있습니다.\n신고하실 때 권리를 가지고 있음을 확인할 수 있는 자료(예: 상표·디자인 등록증, 라이선스 사용 계약서, 사진(작업물) 원본 등)를 함께 첨부해 주세요.\n접수해 주시면 담당 부서에서 검토한 뒤 처리 결과를 메일로 회신드립니다.\n[같은 브랜드 상품이 브랜드홈에 노출돼요] → 2-1\n[부정경쟁(부정판매)으로 소송 중이에요 / 퇴점시켜 주세요] → 2-2\n[신고했는데 결과가 안 와요 / 진행상황 알려주세요] → 2-3\n[알겠어요] → 공통-2 종료 (유형: PA003003)\n2-1. 해당 브랜드의 상표권 등 독점적 권리를 가지고 계시면 안전거래센터로 지식재산권 신고를 접수해 주세요. 독점적 권리가 없으시면, 브랜드홈은 같은 브랜드로 설정된 상품이 샵과 관계없이 노출되는 구조라 오늘의집에서 임의로 변경하거나 강제할 수 없습니다. 해당 업체와 조율이 필요한 점 양해 부탁드립니다.\n→ 공통-2 종료 (유형: PA003003)\n2-2. 부정경쟁방지법 등 지식재산권 침해가 인정되면 입점계약서에 따라 퇴점까지 가능하지만, 이는 소송 결과와 판결 내용으로 판단할 수 있어 지금 바로 가능 여부를 말씀드리기는 어렵습니다. 판결문 등 증빙자료를 첨부해 신고센터(https://safetybucketplace.zendesk.com/hc/ko/requests/new)에 신고해 주시면 확인 후 조치하겠습니다.\n→ 공통-2 종료 (유형: PA003003)\n2-3. 신고 진행 상황 확인을 위해 상담원에게 연결해 드릴게요. 신고하신 날짜와 신고 대상 상품번호(또는 상품 링크)를 알려주시겠어요?\n[신고일·대상 입력] → 상담원 인계 (T5)\n\n[내 상품이 권리침해 신고로 판매정지됐어요]\n3. 확인할 상품번호를 알려주시고, 권리침해 신고로 판매정지된 상품이 맞는지 선택해 주시겠어요?\n[상품번호 입력]\n[네, 권리침해 신고로 판매정지됐어요] → 3-1\n[다른 사유로 판매정지·검수 반려됐어요] → PA003007 시나리오 1번으로 이동 (유형 변경: PA003007)\n[잘 모르겠어요] → 3-1\n3-1. 판매정지(신고) 상품은 파트너님이 직접 판매중으로 바꾸실 수 없고, 담당 부서에서 안내 메일을 보내드리고 있습니다. 판매정지 관련 메일을 받으셨나요?\n[네, 받았어요] → 3-2 / [아니요, 못 받았어요] → 3-3 / [소명 자료를 이미 보냈어요] → 3-4\n3-2. 타인의 지식재산권(상표권 등) 침해로 판매가 중단된 경우, 받으신 소명 요청 메일에 회신하는 방식으로 아래 자료 중 해당하는 것을 3영업일 안에 제출해 주세요.\n- 지식재산권을 사용할 권한이 있음을 보여주는 자료(계약서, 협약서 등)\n- 침해 사실이 없다는 공신력 있는 서류(일정 규모 이상 법무법인 의견서, 법원 등 공공기관 판단 문서 등)\n- 그 밖에 권리 침해가 아님을 증명할 수 있는 자료(상표·디자인 등록증, 라이선스 사용 계약서, 사진 원본 등)\n위조 의심·정품 확인 불가로 정지된 경우에는 본사 인보이스나 거래 계약서, 수입신고필증 등 본사부터 파트너사까지 전체 유통 경로가 확인되는 거래 내역을 제출해 주세요.\n제출 서류는 6개월 이내 자료여야 하고, 필요하면 모델명·품번이 확인돼야 하며, 단가·수량·가격을 뺀 모든 글자가 또렷하게 보여야 합니다. 계약서는 상품 내용과 계약 유효일이 확인돼야 합니다. 확인 결과에 따라 추가 자료를 요청드릴 수 있습니다.\n[판매를 더 하지 않을 거예요] → 3-5\n[알겠어요] → 공통-2 종료 (유형: PA003003)\n3-3. 메일을 받지 못하셨다면 담당 부서에 확인을 요청드릴게요. [오로라 > 판매자 정보 > 담당자 정보]의 연락처·메일이 최신인지도 한 번 확인해 주세요. 상담원에게 연결해 드리겠습니다.\n→ 상담원 인계 (T3-C)\n3-4. 소명 내용을 담당 부서에 전달해 확인을 요청드릴게요. 어떤 자료를 언제 보내셨는지 간단히 알려주시겠어요?\n[소명 내용 입력] → 상담원 인계 (T3-C)\n3-5. 판매 의사가 없으시면 해당 상품 삭제에 동의하시는지 확인 후 담당 부서에 전달드릴게요. 상품 삭제에 동의하시나요?\n[네] → 상담원 인계 (T3-C) / [아니요] → 3-2로\n(판매정지(신고) 때문에 양도양수가 거절됐다고 하면: 소명이 어려우면 신규 재입점으로 진행해야 하는 점 안내 후 3-1로)\n\n[이미지·디자인 사용 가능 여부]\n4. 타인이 촬영한 이미지를 쓰시면 저작권 침해에 해당합니다. 타사 홈페이지나 오늘의집 콘텐츠에 게시된 이미지를 쓰시려면 원 저작권자에게 사용 동의나 권한을 받은 뒤 사용해 주세요. 저작물을 무단으로 쓰면 판매 중지될 수 있고 부정경쟁방지 및 영업비밀보호에 관한 법률에 따라 처벌받을 수 있습니다.\n유명 브랜드의 가품·이미테이션, 유명 상표나 디자인을 허가 없이 쓴 상품도 판매할 수 없으며, '루이스X센PH5 st', 'style', 레플리카, replica, 정품급, 미러급 같은 문구는 상품명에 쓸 수 없습니다.\n[특정 사례가 괜찮은지 판단해 주세요] → 4-1 / [알겠어요] → 공통-2 종료 (유형: PA003003)\n4-1. 개별 사례의 침해 여부는 제가 판단해 드리기 어렵습니다. 상담원에게 연결해 드릴게요.\n→ 상담원 인계 (T5)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 어떤 상황이신지<br/>알려주시겠어요?\"]:::bot\nN2[\"<b>2<\/b> 상표권·디자인권·저작권 등 지식재산권 침해<br/>신고는 안전거래센터에서 접수하실 수<br/>있습니다. 파트너센터 홈페이지 맨 아래\"]:::bot\nN2_1[\"<b>2-1<\/b> 해당 브랜드의 상표권 등 독점적 권리를<br/>가지고 계시면 안전거래센터로 지식재산권<br/>신고를 접수해 주세요. 독점적 권리가<br/>없으시면, 브랜드홈은 같은 브랜드로 설정된<br/>상품이 샵과 관계없이 노출되는 구조라<br/>오늘의집에서 임의로 변경하거나 강제할 수<br/>없습니다. 해당 업체와 조율이 필요한 점<br/>양해 부탁드립니다.\"]:::bot\nN2_2[\"<b>2-2<\/b> 부정경쟁방지법 등 지식재산권 침해가 인정되면<br/>입점계약서에 따라 퇴점까지 가능하지만, 이는<br/>소송 결과와 판결 내용으로 판단할 수 있어<br/>지금 바로 가능 여부를 말씀드리기는<br/>어렵습니다. 판결문 등 증빙자료를 첨부해<br/>신고센터(https://safetybucketplace.zendesk.com/hc/ko/requests/new)에<br/>신고해 주시면 확인 후 조치하겠습니다.\"]:::bot\nN2_3[\"<b>2-3<\/b> 신고 진행 상황 확인을 위해 상담원에게<br/>연결해 드릴게요. 신고하신 날짜와 신고 대상<br/>상품번호(또는 상품 링크)를 알려주시겠어요?\"]:::bot\nN3[\"<b>3<\/b> 확인할 상품번호를 알려주시고, 권리침해<br/>신고로 판매정지된 상품이 맞는지 선택해<br/>주시겠어요?\"]:::bot\nN3_1[\"<b>3-1<\/b> 판매정지(신고) 상품은 파트너님이 직접<br/>판매중으로 바꾸실 수 없고, 담당 부서에서<br/>안내 메일을 보내드리고 있습니다. 판매정지<br/>관련 메일을 받으셨나요?\"]:::bot\nN3_2[\"<b>3-2<\/b> 타인의 지식재산권(상표권 등) 침해로 판매가<br/>중단된 경우, 받으신 소명 요청 메일에<br/>회신하는 방식으로 아래 자료 중 해당하는<br/>것을 3영업일 안에 제출해 주세요.\"]:::bot\nN3_3[\"<b>3-3<\/b> 메일을 받지 못하셨다면 담당 부서에 확인을<br/>요청드릴게요.\"]:::bot\nN3_4[\"<b>3-4<\/b> 소명 내용을 담당 부서에 전달해 확인을<br/>요청드릴게요. 어떤 자료를 언제 보내셨는지<br/>간단히 알려주시겠어요?\"]:::bot\nN3_5[\"<b>3-5<\/b> 판매 의사가 없으시면 해당 상품 삭제에<br/>동의하시는지 확인 후 담당 부서에<br/>전달드릴게요. 상품 삭제에 동의하시나요?\"]:::bot\nN4[\"<b>4<\/b> 타인이 촬영한 이미지를 쓰시면 저작권 침해에<br/>해당합니다. 타사 홈페이지나 오늘의집<br/>콘텐츠에 게시된 이미지를 쓰시려면 원<br/>저작권자에게 사용 동의나 권한을 받은 뒤<br/>사용해 주세요. 저작물을 무단으로 쓰면 판매<br/>중지될 수 있고 부정경쟁방지 및<br/>영업비밀보호에 관한 법률에 따라 처벌받을 수<br/>있습니다.\"]:::bot\nN4_1[\"<b>4-1<\/b> 개별 사례의 침해 여부는 제가 판단해 드리기<br/>어렵습니다. 상담원에게 연결해 드릴게요.\"]:::bot\nS --> N1\nN1 -->|\"다른 업체가 내 상품·이미지·상표를 도용해요\"| N2\nN2 -->|\"같은 브랜드 상품이 브랜드홈에 노출돼요\"| N2_1\nN2 -->|\"퇴점시켜 주세요\"| N2_2\nN2 -->|\"진행상황 알려주세요\"| N2_3\nN2 -->|\"알겠어요\"| END\nN2_1 --> END\nN2_2 --> END\nN2_3 -->|\"신고일·대상 입력\"| HO_T5\nN2_3 -->|\"내 상품이 권리침해 신고로 판매정지됐어요\"| N3\nN3 -->|\"네, 권리침해 신고로 판매정지됐어요\"| N3_1\nN3 -->|\"다른 사유로 판매정지·검수 반려됐어요 ·\"| SW_PA003007\nN3 -->|\"잘 모르겠어요\"| N3_1\nN3_1 -->|\"네, 받았어요\"| N3_2\nN3_1 -->|\"아니요, 못 받았어요\"| N3_3\nN3_1 -->|\"소명 자료를 이미 보냈어요\"| N3_4\nN3_2 -->|\"판매를 더 하지 않을 거예요\"| N3_5\nN3_2 -->|\"알겠어요\"| END\nN3_3 --> HO_T3C\nN3_3 -->|\"오로라 › 판매자 정보 › 담당자 정보\"| N3_4\nN3_4 -->|\"소명 내용 입력\"| HO_T3C\nN3_5 -->|\"네\"| HO_T3C\nN3_5 -->|\"아니요\"| N3\nN3_5 -->|\"이미지·디자인 사용 가능 여부\"| N4\nN4 -->|\"특정 사례가 괜찮은지 판단해 주세요\"| N4_1\nN4 -->|\"알겠어요\"| END\nN4_1 --> HO_T5\nEND([\"상담 종료\"]):::fin\nHO_T5([\"상담원 인계<br/>답변 불가\"]):::ho\nSW_PA003007[/\"「검수 반려·판매정지 사유」로 전환\"/]:::sw\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 어떤 상황이신지 알려주시겠어요?", "sec": false, "body": ["- 버튼: 다른 업체가 내 상품·이미지·상표를 도용해요, 내 상품이 권리침해 신고로 판매정지됐어요, 이미지·디자인 사용 가능 여부가 궁금해요"]}, {"k": "2", "id": "2", "t": "상표권·디자인권·저작권 등 지식재산권 침해 신고는 안전거래센터에서 접수하실 수 있습니다. 파트너센터 홈페이지 맨 아래", "sec": false, "body": ["신고하실 때 권리를 가지고 있음을 확인할 수 있는 자료(예: 상표·디자인 등록증, 라이선스 사용 계약서, 사진(작업물) 원본 등)를 함께 첨부해 주세요.", "접수해 주시면 담당 부서에서 검토한 뒤 처리 결과를 메일로 회신드립니다."]}, {"k": "2-1", "id": "2-1", "t": "해당 브랜드의 상표권 등 독점적 권리를 가지고 계시면 안전거래센터로 지식재산권 신고를 접수해 주세요. 독점적 권리가 없으시면, 브랜드홈은 같은 브랜드로 설정된 상품이 샵과 관계없이 노출되는 구조라 오늘의집에서 임의로 변경하거나 강제할 수 없습니다. 해당 업체와 조율이 필요한 점 양해 부탁드립니다.", "sec": false, "body": []}, {"k": "2-2", "id": "2-2", "t": "부정경쟁방지법 등 지식재산권 침해가 인정되면 입점계약서에 따라 퇴점까지 가능하지만, 이는 소송 결과와 판결 내용으로 판단할 수 있어 지금 바로 가능 여부를 말씀드리기는 어렵습니다. 판결문 등 증빙자료를 첨부해 신고센터(https://safetybucketplace.zendesk.com/hc/ko/requests/new)에 신고해 주시면 확인 후 조치하겠습니다.", "sec": false, "body": []}, {"k": "2-3", "id": "2-3", "t": "신고 진행 상황 확인을 위해 상담원에게 연결해 드릴게요. 신고하신 날짜와 신고 대상 상품번호(또는 상품 링크)를 알려주시겠어요?", "sec": false, "body": []}, {"k": "3", "id": "3", "t": "확인할 상품번호를 알려주시고, 권리침해 신고로 판매정지된 상품이 맞는지 선택해 주시겠어요?", "sec": false, "body": []}, {"k": "3-1", "id": "3-1", "t": "판매정지(신고) 상품은 파트너님이 직접 판매중으로 바꾸실 수 없고, 담당 부서에서 안내 메일을 보내드리고 있습니다. 판매정지 관련 메일을 받으셨나요?", "sec": false, "body": []}, {"k": "3-2", "id": "3-2", "t": "타인의 지식재산권(상표권 등) 침해로 판매가 중단된 경우, 받으신 소명 요청 메일에 회신하는 방식으로 아래 자료 중 해당하는 것을 3영업일 안에 제출해 주세요.", "sec": false, "body": ["- 지식재산권을 사용할 권한이 있음을 보여주는 자료(계약서, 협약서 등)", "- 침해 사실이 없다는 공신력 있는 서류(일정 규모 이상 법무법인 의견서, 법원 등 공공기관 판단 문서 등)", "- 그 밖에 권리 침해가 아님을 증명할 수 있는 자료(상표·디자인 등록증, 라이선스 사용 계약서, 사진 원본 등)", "위조 의심·정품 확인 불가로 정지된 경우에는 본사 인보이스나 거래 계약서, 수입신고필증 등 본사부터 파트너사까지 전체 유통 경로가 확인되는 거래 내역을 제출해 주세요.", "제출 서류는 6개월 이내 자료여야 하고, 필요하면 모델명·품번이 확인돼야 하며, 단가·수량·가격을 뺀 모든 글자가 또렷하게 보여야 합니다. 계약서는 상품 내용과 계약 유효일이 확인돼야 합니다. 확인 결과에 따라 추가 자료를 요청드릴 수 있습니다."]}, {"k": "3-3", "id": "3-3", "t": "메일을 받지 못하셨다면 담당 부서에 확인을 요청드릴게요.", "sec": false, "body": []}, {"k": "3-4", "id": "3-4", "t": "소명 내용을 담당 부서에 전달해 확인을 요청드릴게요. 어떤 자료를 언제 보내셨는지 간단히 알려주시겠어요?", "sec": false, "body": []}, {"k": "3-5", "id": "3-5", "t": "판매 의사가 없으시면 해당 상품 삭제에 동의하시는지 확인 후 담당 부서에 전달드릴게요. 상품 삭제에 동의하시나요?", "sec": false, "body": ["(판매정지(신고) 때문에 양도양수가 거절됐다고 하면: 소명이 어려우면 신규 재입점으로 진행해야 하는 점 안내 후 3-1로)"]}, {"k": "4", "id": "4", "t": "타인이 촬영한 이미지를 쓰시면 저작권 침해에 해당합니다. 타사 홈페이지나 오늘의집 콘텐츠에 게시된 이미지를 쓰시려면 원 저작권자에게 사용 동의나 권한을 받은 뒤 사용해 주세요. 저작물을 무단으로 쓰면 판매 중지될 수 있고 부정경쟁방지 및 영업비밀보호에 관한 법률에 따라 처벌받을 수 있습니다.", "sec": false, "body": ["유명 브랜드의 가품·이미테이션, 유명 상표나 디자인을 허가 없이 쓴 상품도 판매할 수 없으며, '루이스X센PH5 st', 'style', 레플리카, replica, 정품급, 미러급 같은 문구는 상품명에 쓸 수 없습니다."]}, {"k": "4-1", "id": "4-1", "t": "개별 사례의 침해 여부는 제가 판단해 드리기 어렵습니다. 상담원에게 연결해 드릴게요.", "sec": false, "body": []}], "hocond": "판매정지(신고) 메일 미수신·소명 완료 후 확인 요청·상품 삭제 동의 시 T3-C, 신고 진행상황·개별 사례 침해 판단 등 KMS 근거 없음 T5, 강한 불만·법적 대응 언급 T4", "hoinfo": "[피신고] 상품번호, 파트너가 답한 판매정지 사유(권리침해 신고 여부, 모름 포함), 신고 메일 수신 여부, 소명 내용·제출일, 상품 삭제 동의 여부, 양도양수 거절 여부 / [신고] 신고일, 신고 대상 상품번호·링크, 침해 유형(상표·디자인·저작권·이미지)", "kms": "047_파트너센터_활용, 043_상품수정, 045_이미지_등록_수정_, 050_상품_검수, 053_브랜드, 056_상품_관리, 059_양도양수___정보변경__휴_퇴점_, 044_상품명_옵션명, 094_영업_리스크팀_이관_유형_및_방법, 095_커머스_정책_이관_유형_및_이관_방법", "check": "KMS 근거 부족: 파트너가 신고자일 때 접수 이후 절차·처리 기간·결과 안내 방식, 이미지·상세페이지 도용 신고 전용 절차, 콘텐츠(con) 신고 기준이 KMS에 없음(상담 매크로 목록에만 '지재권 접수 안내·자료 보완' 존재), 권리보호 담당 부서 확인 필요 / 신고 경로가 2개(안전거래센터 지식재산권신고 vs 부정판매 신고센터 safetybucketplace.zendesk.com), Zendesk 이관 후 URL 유지 여부 확인 / 피신고 소명 이관처 상충(043·094 리스크팀 vs 095 지식재산권 관련 양도양수불가_판매정지(신고)는 커머스정책 담당) / 월 유입량 없음(C2 일부) / (1차 전환) 판매정지 사유를 파트너 선택으로 판단함. '잘 모르겠어요'는 3-1(판매정지 메일 수신 여부)로 보내 메일로 사유를 확인하게 했는데, 다른 사유 판매정지 파트너가 섞여 들어올 수 있어 이 처리로 충분한지 확인 필요", "api": "R-05", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 상황: \n· (해당 시: 판매정지됨) 상품번호: \n· (해당 시: 판매정지됨) 소명 요청 메일을 받았는지 (받음 / 못 받음): \n· (해당 시: 판매정지됨) 소명 자료 제출 여부와 제출일: \n· (해당 시: 판매정지됨) 판매를 계속할지 (소명 후 판매 재개 / 판매 중단·상품 삭제 동의): \n· (해당 시: 진행 상황) 신고일과 신고 대상 상품번호·링크: \n\n문의 내용: ", "mode": "조건별: 신고 방법·사용 가능 기준·소명 제출 방법(메일 받음)·브랜드홈 동일 브랜드 노출은 자동답변 종결 / 메일 미수신·소명 후 확인·상품 삭제 동의·신고 진행 상황·개별 사례 판단은 상담원 배정", "segs": [{"c": ["A"], "t": "신고 방법·사용 가능 기준·소명 제출 방법(메일 받음)·브랜드홈 동일 브랜드 노출은 자동답변 종결"}, {"c": ["C"], "t": "메일 미수신·소명 후 확인·상품 삭제 동의·신고 진행 상황·개별 사례 판단은 상담원 배정"}], "auto": "(공통 첫인사)\n\n[다른 업체가 내 상품·이미지·상표를 도용하는 경우]\n상표권·디자인권·저작권 등 지식재산권 침해 신고는 안전거래센터에서 접수하실 수 있습니다. 파트너센터 홈페이지 맨 아래 [안전거래센터 바로가기]를 눌러 [지식재산권신고] 메뉴를 이용해 주세요. 신고하실 때 권리를 가지고 있음을 확인할 수 있는 자료(예: 상표·디자인 등록증, 라이선스 사용 계약서, 사진(작업물) 원본 등)를 함께 첨부해 주세요.\n같은 브랜드 상품이 브랜드홈에 함께 노출되는 경우, 해당 브랜드의 상표권 등 독점적 권리를 가지고 계시면 위와 같이 지식재산권 신고를 접수해 주세요. 독점적 권리가 없으시면 브랜드홈은 같은 브랜드로 설정된 상품이 샵과 관계없이 노출되는 구조라 오늘의집에서 임의로 변경하거나 강제할 수 없어, 해당 업체와 조율이 필요합니다.\n부정경쟁방지법 등 지식재산권 침해가 인정되면 입점계약서에 따라 퇴점까지 가능하지만, 이는 소송 결과와 판결 내용으로 판단할 수 있습니다. 판결문 등 증빙자료를 첨부해 신고센터(https://safetybucketplace.zendesk.com/hc/ko/requests/new)에 신고해 주시면 확인 후 조치하겠습니다.\n\n[내 상품이 권리침해 신고로 판매정지되었고 소명 요청 메일을 받으신 경우]\n판매정지(신고) 상품은 파트너님이 직접 판매중으로 바꾸실 수 없습니다. 받으신 소명 요청 메일에 회신하는 방식으로 아래 자료 중 해당하는 것을 3영업일 안에 제출해 주세요.\n- 지식재산권을 사용할 권한이 있음을 보여주는 자료(계약서, 협약서 등)\n- 침해 사실이 없다는 공신력 있는 서류(일정 규모 이상 법무법인 의견서, 법원 등 공공기관 판단 문서 등)\n- 그 밖에 권리 침해가 아님을 증명할 수 있는 자료\n위조 의심·정품 확인 불가로 정지된 경우에는 본사 인보이스나 거래 계약서, 수입신고필증 등 본사부터 파트너사까지 전체 유통 경로가 확인되는 거래 내역을 제출해 주세요. 확인 결과에 따라 추가 자료를 요청드릴 수 있습니다.\n\n[이미지·디자인 사용 가능 여부]\n타인이 촬영한 이미지를 쓰시면 저작권 침해에 해당합니다. 타사 홈페이지나 오늘의집 콘텐츠에 게시된 이미지를 쓰시려면 원 저작권자에게 사용 동의나 권한을 받은 뒤 사용해 주세요. 저작물을 무단으로 쓰면 판매 중지될 수 있고 부정경쟁방지 및 영업비밀보호에 관한 법률에 따라 처벌받을 수 있습니다.\n유명 브랜드의 가품·이미테이션, 유명 상표나 디자인을 허가 없이 쓴 상품도 판매할 수 없으며, 'style', 레플리카, replica, 정품급, 미러급 같은 문구는 상품명에 쓸 수 없습니다. 개별 사례의 침해 여부 판단이 필요하시면 상품 정보를 적어 새 문의로 남겨 주세요.\n(맺음 A)", "ack": "남겨 주신 내용을 담당 부서에 전달해 확인을 요청드리겠습니다. 확인 결과에 따라 추가 자료를 요청드릴 수 있습니다.\n(메일 미수신: \"오로라 > 판매자 정보 > 담당자 정보의 연락처·메일이 최신인지도 함께 확인 부탁드립니다.\")", "info": "[판매정지] 상품번호, 소명 메일 수신 여부, 소명 내용·제출일, 판매 재개 의사 또는 삭제 동의 / [신고] 신고일, 신고 대상 상품번호·링크, 침해 유형 / [사용 가능 여부] 문의 사례", "kms": "047_파트너센터_활용.md, 043_상품수정.md, 045_이미지_등록_수정_.md, 050_상품_검수.md, 053_브랜드.md, 044_상품명_옵션명.md, 059_양도양수___정보변경__휴_퇴점_.md, 094_영업_리스크팀_이관_유형_및_방법.md, 095_커머스_정책_이관_유형_및_이관_방법.md", "check": "1) 파트너가 신고자일 때 접수 이후 처리 기간·결과 안내 방식 KMS 없음 (진행 상황 문의는 상담원 배정)\n2) 신고 경로가 2개(안전거래센터 지식재산권신고 vs safetybucketplace.zendesk.com 신고센터) — Zendesk 종료 후 URL이 바뀌므로 신규 주소 반영 필요\n3) 피신고 소명 처리 부서 상충(043·094 리스크팀 vs 095 커머스 정책)\n4) 상품명 금지 예시에서 특정 브랜드명이 들어간 예시('루이스X센PH5 st')는 빼고 일반 문구만 남김"}}, {"code": "PA003007", "draft": true, "name": "검수 반려·판매정지 사유", "mid": "상품", "vol": "175", "mode": "안내 후 조건부 상담원 연결", "utter": "판매정지 풀어주세요\n검수 거절됐는데 이유가 뭔가요? 다시 등록해도 되나요?\n수정필요로 반려됐는데 KC 인증 필요 없는 상품이에요. 다시 봐주세요", "raw": "1. 네, 파트너님. 어떤 경우인지 골라주시겠어요?\n[신규 등록이 수정필요·검수거절됐어요] → 2 / [수정한 내용이 거절·원복됐어요] → 3 / [판매정지(신고) 상태예요] → 4 / [판매정지 상태예요(신고 아님)] → 5 / [잘 모르겠어요] → 1-1\n(1차에는 상품 판매 상태·검수 이력 조회가 없어 파트너가 고른 구분으로 분기)\n1-1. 상품 상태와 검수 결과는 오로라에서 바로 확인하실 수 있습니다.\n- 신규 판매신청서 검수 결과·사유: [오로라 > 상품관리 > 상품 검수 현황 > 판매검수현황 > 검수이력(이력보기)]\n- 판매중 상품 수정 검수 결과·사유: [오로라 > 상품관리 > 상품 검수 현황 > 수정검수요청 현황(상단 우측 탭) > 검수내역]\n- 판매 상태: [오로라 > 상품 조회/수정 > 상품 코드 클릭 > 상품상태]\n확인하신 상태를 골라주시면 이어서 안내드릴게요.\n[신규 등록이 수정필요·검수거절됐어요] → 2 / [수정한 내용이 거절·원복됐어요] → 3 / [판매정지(신고) 상태예요] → 4 / [판매정지 상태예요(신고 아님)] → 5 / [확인해도 모르겠어요] → 1-2\n1-2. 상담원이 상품 상태를 확인해 드릴게요. 확인할 상품번호(또는 판매신청서 번호)와 오로라에 보이는 상태·사유가 있으면 함께 알려주시겠어요?\n[상품번호·상태·사유 입력]\n→ 상담원 인계 (T3-D)\n\n[신규 판매신청서 반려]\n2. 사유는 [오로라 > 상품관리 > 상품 검수 현황 > 판매검수현황 > 검수이력(이력보기)]에서 확인하실 수 있습니다. 검수이력에 보이는 상태를 골라주시겠어요?\n[수정필요] → 2-1 / [검수거절] → 2-2\n2-1. 수정필요 건은 안내된 항목을 수정해 다시 검수요청해 주세요. 재검수는 영업일 기준 추가 5일이 소요됩니다.\n- 2차 검수 단계에서 배송비 칸이 비활성화돼 반품배송비 등을 고칠 수 없다면, 판매신청서를 새로 작성해 제출해 주셔야 합니다. 이때 검수를 취소한 판매신청서는 [오로라 > 상품검수현황 > 판매검수 요청 현황 > 검수취소] 목록 오른쪽 [복사하기]로 복사해 필요한 정보만 바꿔 다시 제출하실 수 있습니다. 복사하면 상품명 앞에 '사본'이 붙어 50자를 넘으면 복사되지 않습니다.\n- '옵션 분리 등록' 안내를 받으셨다면, 카테고리별 옵션 등록 기준에 따라 사이즈·디자인·색상·수량 등 옵션을 각각 별도 상품코드로 나눠 등록하셔야 한다는 뜻입니다.\n[수정할 필요가 없는 내용이에요 / 자료를 전달하고 싶어요] → 2-3\n[확인했어요] → 공통-2 종료 (유형: PA003007)\n2-2. 검수거절은 중복·유사상품, 미운영 카테고리, 안전거래 위반, 부당 거래 행위 등 상품 운영 정책에 맞지 않아 등록이 거절된 상태로, 해당 판매신청서는 수정하거나 다시 검수요청할 수 없습니다.\n다시 판매하시려면 거절 사유를 보완한 뒤 오로라의 복사하기 기능을 이용하거나 새 상품으로 등록해 주세요.\n[거절 사유에 동의하지 않아요] → 2-3 / [알겠어요] → 공통-2 종료 (유형: PA003007)\n2-3. 검수 시 참고할 자료나 의견(예: 라이선스 계약서, KC 인증 대상이 아님, 의료기기 판매업 신고 면제 품목 등)을 담당 부서에 전달해 드릴게요. 상품번호(또는 판매신청서 번호)와 전달할 내용을 적어주시고, 첨부할 서류가 있으면 함께 올려주세요.\n[상품번호·내용·첨부 입력]\n(의료기기 판매업 신고 면제 품목이라는 주장이면: \"재검수 요청해 주시면 참고해 검수할 수 있도록 전달하겠습니다. 다만 의료기기 상품은 검수 때 판매권한 여부를 검토하고 있어 이후에도 요청받으실 수 있습니다.\" 안내 추가)\n(검수 단계 기록: 검수요청=1차(영업) / 1차 검수완료=2차(운영). 1차에는 조회가 없어 파트너가 고른 구분·검수이력 상태로 기록하고, 단계를 알 수 없으면 상담원이 확인. 라이선스 관련은 단계와 관계없이 운영 검토 항목으로 기록)\n→ 상담원 인계 (T3-C)\n\n[판매중 상품 수정 거절·원복]\n3. 수정 검수 결과와 사유는 [오로라 > 상품관리 > 상품 검수 현황 > 수정검수요청 현황(상단 우측 탭) > 검수내역]에서 확인하실 수 있습니다. 수정검수에는 '수정필요' 단계가 없고 승인 또는 거절만 있습니다.\n- 사전검수(가격·배송비·옵션 추가) 거절: 기존 정보가 계속 노출됩니다.\n- 사후검수(상품명·대표이미지·정보고시·옵션명·옵션값 등) 거절: 수정 전 정보로 원복됩니다. 부분승인이면 승인된 항목만 유지되고 거절된 항목은 원복됩니다.\n한 번에 여러 항목을 수정하셔도 항목별로 수정요청서가 나뉘어 일부만 승인될 수 있습니다. 거절 사유를 확인하신 뒤 다시 수정 요청해 주세요.\n(대표이미지·상품명·모델명을 다른 상품으로 바꾼 '판매 중 상품 변경'이면: 판매 재개가 불가한 판매 중단이며 소명 절차가 없다는 점 안내)\n[사유에 동의하지 않아요] → 2-3 / [확인했어요] → 공통-2 종료 (유형: PA003007)\n\n[판매정지(신고)]\n4. 판매정지(신고) 상품은 운영 정책 위반 등으로 예외 조치된 상품이라 파트너님이 직접 판매중으로 바꾸실 수 없습니다. 담당 부서에서 안내 메일을 보내드리고 있는데, 메일을 받으셨나요?\n(파트너가 말한 정지 사유가 권리침해(상표·디자인·저작권) 신고면 → PA003003 시나리오 3-1로 이동 (유형 변경: PA003003))\n[네, 받았어요] → 4-1 / [아니요] → 4-3 / [소명 자료를 이미 보냈어요] → 4-4 / [판매를 그만할 거예요] → 4-5\n4-1. 메일에 안내된 소명 사항을 확인하시고, 메일 회신으로 증빙 자료를 3영업일 안에 제출해 주세요. 사유별 주요 제출 자료는 아래와 같습니다.\n- 필수 인증(KC 등) 미기재: 상품 페이지에 조회 가능한 인증번호 기재 + 인증서·시험성적서 등, KC 인증이면 마크 기재\n- 원산지 미표시: 신선식품은 상품명에 원산지, 가공식품은 상세페이지에 원재료 함량에 따른 원산지 기재\n- 리콜: 안전성 조치 결과 회신 + 상세페이지에 리콜 완료 제품임을 기재(공문, 시험성적서 등)\n- 위해상품 등록(기관 인입): 위해제품이 아니라는 증빙 또는 부적합 내역 해소 증빙\n- 위조 의심·정품 확인 불가: 본사부터 파트너사까지 전체 유통 경로가 확인되는 거래 내역(인보이스, 거래 계약서, 수입신고필증 등)\n- 해외직구·병행수입 유통 경로 확인: 수입신고필증, 인보이스, 공급처가 정품취급처임을 확인할 수 있는 서류\n- 한 페이지에 여러 브랜드 상품 운영: 브랜드별 판매 페이지를 따로 만든 뒤 분리 상품 목록(수정 전후 캡처 포함)\n- 허위과대광고 우려(친환경 광고 등): 광고 내용의 실증 자료(친환경 인증서 등)\n제출 서류는 6개월 이내 자료여야 하며, 단가·수량·가격을 뺀 모든 글자가 또렷하게 보여야 합니다. 확인 결과에 따라 추가 자료를 요청드릴 수 있습니다.\n(메일에 적힌 사유가 취급 불가 상품, 판매 중 상품 변경이면 → 4-2)\n→ 공통-2 종료 (유형: PA003007)\n4-2. 해당 사유(취급 불가 상품 / 판매 중 상품 변경)는 소명 절차가 없는 판매 중단으로, 판매 재개가 불가합니다. 양해 부탁드립니다.\n[납득할 수 없어요] → 상담원 인계 (T4) / [알겠어요] → 공통-2 종료 (유형: PA003007)\n4-3. 메일을 받지 못하셨다면 담당 부서에 확인 요청드릴게요. [오로라 > 판매자 정보 > 담당자 정보]의 연락처가 최신인지도 확인해 주세요. 확인할 상품번호를 알려주시겠어요?\n[상품번호 입력]\n(결번·연락 불가로 인한 판매정지라고 하면: \"[오로라 > 판매자 정보 > 담당자 정보]를 연락 가능한 번호로 최신화하시고, 받으신 메일의 확인 요청 사항과 부재 사유를 소명해 회신해 주세요. 담당 부서 확인 메일을 받으신 뒤 판매중으로 전환됩니다.\" 안내 후 메일 못 받았으면 인계)\n→ 상담원 인계 (T3-C)\n4-4. 소명 내용을 담당 부서에 전달해 확인 요청드릴게요. 상품번호와 정지 사유, 제출하신 소명 내용, 제출일을 간단히 알려주시겠어요?\n[내용 입력] → 상담원 인계 (T3-C)\n4-5. 판매 의사가 없으시면 해당 상품 삭제에 동의하시는지 확인 후 담당 부서에 전달드릴게요. 상품 삭제에 동의하시나요?\n[네] → 4-5-1 / [아니요] → 4-1로\n4-5-1. 삭제할 상품번호를 알려주시겠어요?\n[상품번호 입력] → 상담원 인계 (T3-C)\n(판매정지(신고) 때문에 양도양수가 거절됐다고 하면: 판매 재개를 원하면 4-1 소명 안내, 소명이 어려우면 신규 재입점으로 진행해야 하는 점 안내)\n\n[일반 판매정지]\n5. 일반 판매정지 상품은 파트너님이 직접 판매중으로 바꾸실 수 있습니다.\n- 단건: [오로라 > 상품 조회/수정 > 상품 코드 클릭 > 상품상태]\n- 일괄: [오로라 > 상품 조회/수정 > 상태 변경(판매중) > 일괄 변경]\n재고가 0인 일시품절 상품은 상품 상세에서 [재고/재고상태]를 먼저 수정해 주세요.\n[직접 바꿀 수 없게 되어 있어요] → 4 / [확인했어요] → 공통-2 종료 (유형: PA003007)\n(직접 전환이 안 되면 판매정지(신고)일 수 있어 4로 안내)\n\n[사유 문구 자체의 의미·검수 기준을 묻는 경우]\n6. 검수 기준의 세부 판단은 제가 정확히 안내드리기 어려워 상담원에게 연결해 드릴게요.\n→ 상담원 인계 (T5)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 어떤 경우인지<br/>골라주시겠어요?\"]:::bot\nN1_1[\"<b>1-1<\/b> 상품 상태와 검수 결과는 오로라에서 바로<br/>확인하실 수 있습니다.\"]:::bot\nN1_2[\"<b>1-2<\/b> 상담원이 상품 상태를 확인해 드릴게요.<br/>확인할 상품번호(또는 판매신청서 번호)와<br/>오로라에 보이는 상태·사유가 있으면 함께<br/>알려주시겠어요?\"]:::bot\nN2[\"<b>2<\/b> 사유는\"]:::bot\nN2_1[\"<b>2-1<\/b> 수정필요 건은 안내된 항목을 수정해 다시<br/>검수요청해 주세요. 재검수는 영업일 기준<br/>추가 5일이 소요됩니다.\"]:::bot\nN2_2[\"<b>2-2<\/b> 검수거절은 중복·유사상품, 미운영 카테고리,<br/>안전거래 위반, 부당 거래 행위 등 상품<br/>운영 정책에 맞지 않아 등록이 거절된<br/>상태로, 해당 판매신청서는 수정하거나 다시<br/>검수요청할 수 없습니다.\"]:::bot\nN2_3[\"<b>2-3<\/b> 검수 시 참고할 자료나 의견(예: 라이선스<br/>계약서, KC 인증 대상이 아님, 의료기기<br/>판매업 신고 면제 품목 등)을 담당 부서에<br/>전달해 드릴게요. 상품번호(또는 판매신청서<br/>번호)와 전달할 내용을 적어주시고, 첨부할<br/>서류가 있으면 함께 올려주세요.\"]:::bot\nN3[\"<b>3<\/b> 수정 검수 결과와 사유는\"]:::bot\nN4[\"<b>4<\/b> 판매정지(신고) 상품은 운영 정책 위반<br/>등으로 예외 조치된 상품이라 파트너님이 직접<br/>판매중으로 바꾸실 수 없습니다. 담당<br/>부서에서 안내 메일을 보내드리고 있는데,<br/>메일을 받으셨나요?\"]:::bot\nN4_1[\"<b>4-1<\/b> 메일에 안내된 소명 사항을 확인하시고, 메일<br/>회신으로 증빙 자료를 3영업일 안에 제출해<br/>주세요. 사유별 주요 제출 자료는 아래와<br/>같습니다.\"]:::bot\nN4_2[\"<b>4-2<\/b> 해당 사유(취급 불가 상품 / 판매 중 상품<br/>변경)는 소명 절차가 없는 판매 중단으로,<br/>판매 재개가 불가합니다. 양해 부탁드립니다.\"]:::bot\nN4_3[\"<b>4-3<\/b> 메일을 받지 못하셨다면 담당 부서에 확인<br/>요청드릴게요.\"]:::bot\nN4_4[\"<b>4-4<\/b> 소명 내용을 담당 부서에 전달해 확인<br/>요청드릴게요. 상품번호와 정지 사유,<br/>제출하신 소명 내용, 제출일을 간단히<br/>알려주시겠어요?\"]:::bot\nN4_5[\"<b>4-5<\/b> 판매 의사가 없으시면 해당 상품 삭제에<br/>동의하시는지 확인 후 담당 부서에<br/>전달드릴게요. 상품 삭제에 동의하시나요?\"]:::bot\nN4_5_1[\"<b>4-5-1<\/b> 삭제할 상품번호를 알려주시겠어요?\"]:::bot\nN5[\"<b>5<\/b> 일반 판매정지 상품은 파트너님이 직접<br/>판매중으로 바꾸실 수 있습니다.\"]:::bot\nN6[\"<b>6<\/b> 검수 기준의 세부 판단은 제가 정확히<br/>안내드리기 어려워 상담원에게 연결해<br/>드릴게요.\"]:::bot\nS --> N1\nN1 -->|\"신규 등록이 수정필요·검수거절됐어요\"| N2\nN1 -->|\"수정한 내용이 거절·원복됐어요\"| N3\nN1 -->|\"판매정지(신고) 상태예요\"| N4\nN1 -->|\"판매정지 상태예요(신고 아님)\"| N5\nN1 -->|\"잘 모르겠어요\"| N1_1\nN1_1 -->|\"신규 등록이 수정필요·검수거절됐어요\"| N2\nN1_1 -->|\"수정한 내용이 거절·원복됐어요\"| N3\nN1_1 -->|\"판매정지(신고) 상태예요\"| N4\nN1_1 -->|\"판매정지 상태예요(신고 아님)\"| N5\nN1_1 -->|\"확인해도 모르겠어요\"| N1_2\nN1_2 --> HO_T3D\nN1_2 -->|\"신규 판매신청서 반려\"| N2\nN2 -->|\"수정필요\"| N2_1\nN2 -->|\"검수거절\"| N2_2\nN2_1 -->|\"자료를 전달하고 싶어요\"| N2_3\nN2_1 -->|\"확인했어요\"| END\nN2_2 -->|\"거절 사유에 동의하지 않아요\"| N2_3\nN2_2 -->|\"알겠어요\"| END\nN2_3 --> HO_T3C\nN2_3 -->|\"판매중 상품 수정 거절·원복\"| N3\nN3 -->|\"사유에 동의하지 않아요\"| N2_3\nN3 -->|\"확인했어요\"| END\nN3 -->|\"판매정지(신고)\"| N4\nN4 -->|\"파트너가 말한 정지 사유가<br/>권리침해(상표·디자인·저작권) 신고면 ·\"| SW_PA003003\nN4 -->|\"네, 받았어요\"| N4_1\nN4 -->|\"아니요\"| N4_3\nN4 -->|\"소명 자료를 이미 보냈어요\"| N4_4\nN4 -->|\"판매를 그만할 거예요\"| N4_5\nN4_1 -->|\"메일에 적힌 사유가 취급 불가 상품, 판매<br/>중 상품 변경이면\"| N4_2\nN4_1 --> END\nN4_2 -->|\"납득할 수 없어요\"| HO_T4\nN4_2 -->|\"알겠어요\"| END\nN4_3 --> HO_T3C\nN4_3 -->|\"상품번호 입력\"| N4_4\nN4_4 -->|\"내용 입력\"| HO_T3C\nN4_5 -->|\"네\"| N4_5_1\nN4_5 -->|\"아니요\"| N4\nN4_5_1 -->|\"상품번호 입력\"| HO_T3C\nN4_5_1 -->|\"일반 판매정지\"| N5\nN5 -->|\"직접 바꿀 수 없게 되어 있어요\"| N4\nN5 -->|\"확인했어요\"| END\nN5 -->|\"사유 문구 자체의 의미·검수 기준을 묻는<br/>경우\"| N6\nN6 --> HO_T5\nHO_T3D([\"상담원 인계<br/>개별 조회 필요\"]):::ho\nEND([\"상담 종료\"]):::fin\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nSW_PA003003[/\"「지식재산권 및 도용」로 전환\"/]:::sw\nHO_T4([\"상담원 인계<br/>감정·민원\"]):::ho\nHO_T5([\"상담원 인계<br/>답변 불가\"]):::ho", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 어떤 경우인지 골라주시겠어요?", "sec": false, "body": ["(1차에는 상품 판매 상태·검수 이력 조회가 없어 파트너가 고른 구분으로 분기)"]}, {"k": "1-1", "id": "1-1", "t": "상품 상태와 검수 결과는 오로라에서 바로 확인하실 수 있습니다.", "sec": false, "body": ["- 신규 판매신청서 검수 결과·사유: [오로라 > 상품관리 > 상품 검수 현황 > 판매검수현황 > 검수이력(이력보기)]", "- 판매중 상품 수정 검수 결과·사유: [오로라 > 상품관리 > 상품 검수 현황 > 수정검수요청 현황(상단 우측 탭) > 검수내역]", "- 판매 상태: [오로라 > 상품 조회/수정 > 상품 코드 클릭 > 상품상태]", "확인하신 상태를 골라주시면 이어서 안내드릴게요."]}, {"k": "1-2", "id": "1-2", "t": "상담원이 상품 상태를 확인해 드릴게요. 확인할 상품번호(또는 판매신청서 번호)와 오로라에 보이는 상태·사유가 있으면 함께 알려주시겠어요?", "sec": false, "body": []}, {"k": "2", "id": "2", "t": "사유는", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "수정필요 건은 안내된 항목을 수정해 다시 검수요청해 주세요. 재검수는 영업일 기준 추가 5일이 소요됩니다.", "sec": false, "body": ["- 2차 검수 단계에서 배송비 칸이 비활성화돼 반품배송비 등을 고칠 수 없다면, 판매신청서를 새로 작성해 제출해 주셔야 합니다. 이때 검수를 취소한 판매신청서는 [오로라 > 상품검수현황 > 판매검수 요청 현황 > 검수취소] 목록 오른쪽 [복사하기]로 복사해 필요한 정보만 바꿔 다시 제출하실 수 있습니다. 복사하면 상품명 앞에 '사본'이 붙어 50자를 넘으면 복사되지 않습니다.", "- '옵션 분리 등록' 안내를 받으셨다면, 카테고리별 옵션 등록 기준에 따라 사이즈·디자인·색상·수량 등 옵션을 각각 별도 상품코드로 나눠 등록하셔야 한다는 뜻입니다."]}, {"k": "2-2", "id": "2-2", "t": "검수거절은 중복·유사상품, 미운영 카테고리, 안전거래 위반, 부당 거래 행위 등 상품 운영 정책에 맞지 않아 등록이 거절된 상태로, 해당 판매신청서는 수정하거나 다시 검수요청할 수 없습니다.", "sec": false, "body": ["다시 판매하시려면 거절 사유를 보완한 뒤 오로라의 복사하기 기능을 이용하거나 새 상품으로 등록해 주세요."]}, {"k": "2-3", "id": "2-3", "t": "검수 시 참고할 자료나 의견(예: 라이선스 계약서, KC 인증 대상이 아님, 의료기기 판매업 신고 면제 품목 등)을 담당 부서에 전달해 드릴게요. 상품번호(또는 판매신청서 번호)와 전달할 내용을 적어주시고, 첨부할 서류가 있으면 함께 올려주세요.", "sec": false, "body": ["(의료기기 판매업 신고 면제 품목이라는 주장이면: \"재검수 요청해 주시면 참고해 검수할 수 있도록 전달하겠습니다. 다만 의료기기 상품은 검수 때 판매권한 여부를 검토하고 있어 이후에도 요청받으실 수 있습니다.\" 안내 추가)", "(검수 단계 기록: 검수요청=1차(영업) / 1차 검수완료=2차(운영). 1차에는 조회가 없어 파트너가 고른 구분·검수이력 상태로 기록하고, 단계를 알 수 없으면 상담원이 확인. 라이선스 관련은 단계와 관계없이 운영 검토 항목으로 기록)"]}, {"k": "3", "id": "3", "t": "수정 검수 결과와 사유는", "sec": false, "body": ["- 사전검수(가격·배송비·옵션 추가) 거절: 기존 정보가 계속 노출됩니다.", "- 사후검수(상품명·대표이미지·정보고시·옵션명·옵션값 등) 거절: 수정 전 정보로 원복됩니다. 부분승인이면 승인된 항목만 유지되고 거절된 항목은 원복됩니다.", "한 번에 여러 항목을 수정하셔도 항목별로 수정요청서가 나뉘어 일부만 승인될 수 있습니다. 거절 사유를 확인하신 뒤 다시 수정 요청해 주세요.", "(대표이미지·상품명·모델명을 다른 상품으로 바꾼 '판매 중 상품 변경'이면: 판매 재개가 불가한 판매 중단이며 소명 절차가 없다는 점 안내)"]}, {"k": "4", "id": "4", "t": "판매정지(신고) 상품은 운영 정책 위반 등으로 예외 조치된 상품이라 파트너님이 직접 판매중으로 바꾸실 수 없습니다. 담당 부서에서 안내 메일을 보내드리고 있는데, 메일을 받으셨나요?", "sec": false, "body": []}, {"k": "4-1", "id": "4-1", "t": "메일에 안내된 소명 사항을 확인하시고, 메일 회신으로 증빙 자료를 3영업일 안에 제출해 주세요. 사유별 주요 제출 자료는 아래와 같습니다.", "sec": false, "body": ["- 필수 인증(KC 등) 미기재: 상품 페이지에 조회 가능한 인증번호 기재 + 인증서·시험성적서 등, KC 인증이면 마크 기재", "- 원산지 미표시: 신선식품은 상품명에 원산지, 가공식품은 상세페이지에 원재료 함량에 따른 원산지 기재", "- 리콜: 안전성 조치 결과 회신 + 상세페이지에 리콜 완료 제품임을 기재(공문, 시험성적서 등)", "- 위해상품 등록(기관 인입): 위해제품이 아니라는 증빙 또는 부적합 내역 해소 증빙", "- 위조 의심·정품 확인 불가: 본사부터 파트너사까지 전체 유통 경로가 확인되는 거래 내역(인보이스, 거래 계약서, 수입신고필증 등)", "- 해외직구·병행수입 유통 경로 확인: 수입신고필증, 인보이스, 공급처가 정품취급처임을 확인할 수 있는 서류", "- 한 페이지에 여러 브랜드 상품 운영: 브랜드별 판매 페이지를 따로 만든 뒤 분리 상품 목록(수정 전후 캡처 포함)", "- 허위과대광고 우려(친환경 광고 등): 광고 내용의 실증 자료(친환경 인증서 등)", "제출 서류는 6개월 이내 자료여야 하며, 단가·수량·가격을 뺀 모든 글자가 또렷하게 보여야 합니다. 확인 결과에 따라 추가 자료를 요청드릴 수 있습니다."]}, {"k": "4-2", "id": "4-2", "t": "해당 사유(취급 불가 상품 / 판매 중 상품 변경)는 소명 절차가 없는 판매 중단으로, 판매 재개가 불가합니다. 양해 부탁드립니다.", "sec": false, "body": []}, {"k": "4-3", "id": "4-3", "t": "메일을 받지 못하셨다면 담당 부서에 확인 요청드릴게요.", "sec": false, "body": ["(결번·연락 불가로 인한 판매정지라고 하면: \"[오로라 > 판매자 정보 > 담당자 정보]를 연락 가능한 번호로 최신화하시고, 받으신 메일의 확인 요청 사항과 부재 사유를 소명해 회신해 주세요. 담당 부서 확인 메일을 받으신 뒤 판매중으로 전환됩니다.\" 안내 후 메일 못 받았으면 인계)"]}, {"k": "4-4", "id": "4-4", "t": "소명 내용을 담당 부서에 전달해 확인 요청드릴게요. 상품번호와 정지 사유, 제출하신 소명 내용, 제출일을 간단히 알려주시겠어요?", "sec": false, "body": []}, {"k": "4-5", "id": "4-5", "t": "판매 의사가 없으시면 해당 상품 삭제에 동의하시는지 확인 후 담당 부서에 전달드릴게요. 상품 삭제에 동의하시나요?", "sec": false, "body": []}, {"k": "4-5-1", "id": "4-5-1", "t": "삭제할 상품번호를 알려주시겠어요?", "sec": false, "body": ["(판매정지(신고) 때문에 양도양수가 거절됐다고 하면: 판매 재개를 원하면 4-1 소명 안내, 소명이 어려우면 신규 재입점으로 진행해야 하는 점 안내)"]}, {"k": "5", "id": "5", "t": "일반 판매정지 상품은 파트너님이 직접 판매중으로 바꾸실 수 있습니다.", "sec": false, "body": ["- 단건: [오로라 > 상품 조회/수정 > 상품 코드 클릭 > 상품상태]", "- 일괄: [오로라 > 상품 조회/수정 > 상태 변경(판매중) > 일괄 변경]", "재고가 0인 일시품절 상품은 상품 상세에서 [재고/재고상태]를 먼저 수정해 주세요.", "(직접 전환이 안 되면 판매정지(신고)일 수 있어 4로 안내)"]}, {"k": "6", "id": "6", "t": "검수 기준의 세부 판단은 제가 정확히 안내드리기 어려워 상담원에게 연결해 드릴게요.", "sec": false, "body": []}], "hocond": "재검토·자료 전달 요청 T3-C / 판매정지(신고) 메일 미수신·소명 완료 후 확인·상품 삭제 동의 T3-C / 오로라 확인 경로 안내 후에도 상태를 모르고 개별 확인을 원함 T3-D / 검수 반려 기준 해석 T5 / 소명 불가 사유에 강한 불만 T4", "hoinfo": "상품번호·판매신청서(수정요청서) 번호, 파트너가 고른 구분(신규 수정필요 / 신규 검수거절 / 수정 거절·원복 / 판매정지(신고) / 판매정지 / 잘 모름), 파트너가 오로라에서 확인한 상태·사유(입력한 경우), 검수 단계(1차 영업·2차 운영, 파트너 응답으로 알 수 없으면 상담원 확인), 신고 메일 수신 여부, 파트너 소명·전달 내용과 첨부 여부, 제출일, 상품 삭제 동의 여부", "kms": "050_상품_검수, 043_상품수정, 056_상품_관리, 046_카테고리, 094_영업_리스크팀_이관_유형_및_방법, 075_파트너센터_교육자료_상품검수", "check": "검수거절 후 재등록 가능 여부 상충(050·056 '수정 및 재등록 불가' vs 056 '사유 보완 후 새롭게 상품 등록'), 복사하기는 검수취소 건에만 해당 / 반려 사유별 판단 기준(검수 기준 상세) KMS 없음(교육자료는 이미지뿐) / 검수 사유를 API로 내려받아 챗봇이 읽어줄지, 오로라 경로 안내만 할지 결정 필요 / 판매정지(신고) 사유 중 '판매 중 상품 변경'은 알림톡+오로라에서 사유 확인 가능하다고만 되어 있어 정확한 오로라 메뉴 경로 KMS 없음 / (1차 추가) 1차는 파트너가 고른 구분으로 분기하므로, 파트너가 오로라 상품상태 화면에서 판매정지(신고)와 일반 판매정지를 구분해 볼 수 있는지 확인 필요 / (1차 추가) 검수 단계(1차 영업·2차 운영)를 챗봇이 알 수 없어 인계 시 상담원이 확인해야 함 / (1차 추가) 5번에서 직접 전환이 안 되면 4로 보내는 분기는 KMS 문구(판매정지(신고)는 직접 전환 불가)에서 끌어낸 것이라 운영 확인 필요", "api": "R-05", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 상품번호 또는 판매신청서 번호: \n· 구분: \n· 오로라 검수이력·검수내역에 적힌 사유 (선택): \n· 요청: \n· (해당 시: 재검토·자료 전달, 첨부 가능) 전달할 의견과 자료: \n· (해당 시: 소명 자료를 이미 보냄) 소명 제출일: \n\n문의 내용: ", "mode": "조건별: 사유 확인 경로·수정필요 재검수·검수거절 의미·수정 거절·일반 판매정지 해제·판매정지(신고) 소명 방법 안내는 자동답변 종결 / 재검토·자료 전달·메일 미수신·소명 후 확인·삭제 동의·검수 기준 해석·구분 '잘 모름'은 상담원 배정 / 권리침해 신고 정지는 PA003003으로 바꿔 판정", "segs": [{"c": ["A"], "t": "사유 확인 경로·수정필요 재검수·검수거절 의미·수정 거절·일반 판매정지 해제·판매정지(신고) 소명 방법 안내는 자동답변 종결"}, {"c": ["C"], "t": "재검토·자료 전달·메일 미수신·소명 후 확인·삭제 동의·검수 기준 해석·구분 '잘 모름'은 상담원 배정"}, {"c": ["SW"], "t": "권리침해 신고 정지는 PA003003으로 바꿔 판정"}], "auto": "(공통 첫인사)\n\n[신규 등록이 수정필요인 경우]\n사유는 오로라 > 상품관리 > 상품 검수 현황 > 판매검수현황 > 검수이력(이력보기)에서 확인하실 수 있습니다. 안내된 항목을 수정해 다시 검수요청해 주세요. 재검수는 영업일 기준 추가 5일이 소요됩니다. 수정필요·검수거절 판매신청서는 셀러샵 대표 계정 휴대폰 번호로 매일 오전 9~11시 사이 1회 알림톡으로도 안내됩니다.\n- 2차 검수 단계에서 배송비 칸이 비활성화돼 반품배송비 등을 고칠 수 없다면 판매신청서를 새로 작성해 제출해 주셔야 합니다. 검수를 취소한 판매신청서는 판매검수 요청 현황 > 검수취소 목록 오른쪽 [복사하기]로 복사해 필요한 정보만 바꿔 다시 제출하실 수 있습니다(복사 시 상품명 앞에 '사본'이 붙어 50자를 넘으면 복사되지 않습니다).\n- '옵션 분리 등록' 안내를 받으셨다면, 카테고리별 옵션 등록 기준에 따라 사이즈·디자인·색상·수량 등 옵션을 각각 별도 상품코드로 나눠 등록하셔야 한다는 뜻입니다.\n\n[신규 등록이 검수거절인 경우]\n검수거절은 중복·유사상품, 미운영 카테고리, 안전거래 위반, 부당 거래 행위 등 상품 운영 정책에 맞지 않아 등록이 거절된 상태로, 해당 판매신청서는 수정하거나 다시 검수요청할 수 없습니다. 사유는 검수이력에서 확인하실 수 있습니다. 다시 판매하시려면 거절 사유를 보완한 뒤 오로라의 복사하기 기능을 이용하거나 새 상품으로 등록해 주세요.\n\n[판매중 상품 수정이 거절·원복된 경우]\n수정 검수 결과와 사유는 오로라 > 상품관리 > 상품 검수 현황 > 수정검수요청 현황(상단 오른쪽 탭) > 검수내역에서 확인하실 수 있습니다. 수정검수에는 '수정필요' 단계가 없고 승인 또는 거절만 있습니다.\n- 사전검수(가격·배송비·옵션 추가) 거절: 기존 정보가 계속 노출됩니다.\n- 사후검수(상품명·대표이미지·정보고시·옵션명·옵션값 등) 거절: 수정 전 정보로 원복됩니다. 부분승인이면 승인된 항목만 유지되고 거절된 항목은 원복됩니다.\n한 번에 여러 항목을 수정하셔도 항목별로 수정요청서가 나뉘어 일부만 승인될 수 있습니다. 거절 사유를 확인하신 뒤 다시 수정 요청해 주세요. 대표이미지·상품명·모델명을 다른 상품으로 바꾼 '판매 중 상품 변경'은 판매 재개가 불가한 판매 중단이며 소명 절차가 없습니다.\n\n[판매정지(신고) 상태인 경우]\n판매정지(신고) 상품은 운영 정책 위반 등으로 예외 조치된 상품이라 파트너님이 직접 판매중으로 바꾸실 수 없습니다. 담당 부서에서 보내 드린 소명 요청 메일에 회신하는 방식으로 증빙 자료를 3영업일 안에 제출해 주세요. 사유별 주요 제출 자료는 아래와 같습니다.\n- 필수 인증(KC 등) 미기재: 상품 페이지에 조회 가능한 인증번호 기재 + 인증서·시험성적서 등, KC 인증이면 마크 기재\n- 원산지 미표시: 신선식품은 상품명에 원산지, 가공식품은 상세페이지에 원재료 함량에 따른 원산지 기재\n- 리콜: 안전성 조치 결과 회신 + 상세페이지에 리콜 완료 제품임을 기재(공문, 시험성적서 등)\n- 위해상품 등록(기관 인입): 위해제품이 아니라는 증빙 또는 부적합 내역 해소 증빙\n- 위조 의심·정품 확인 불가: 본사부터 파트너사까지 전체 유통 경로가 확인되는 거래 내역(인보이스, 거래 계약서, 수입신고필증 등)\n- 해외직구·병행수입 유통 경로 확인: 수입신고필증, 인보이스, 공급처가 정품취급처임을 확인할 수 있는 서류\n- 한 페이지에 여러 브랜드 상품 운영: 브랜드별 판매 페이지를 따로 만든 뒤 분리 상품 목록(수정 전후 캡처 포함)\n- 허위과대광고 우려(친환경 광고 등): 광고 내용의 실증 자료(친환경 인증서 등)\n제출 서류는 6개월 이내 자료여야 하며, 단가·수량·가격을 뺀 모든 글자가 또렷하게 보여야 합니다. 취급 불가 상품이나 판매 중 상품 변경 사유는 소명 절차가 없는 판매 중단으로 판매 재개가 불가합니다.\n\n[일반 판매정지 상태인 경우]\n일반 판매정지 상품은 파트너님이 직접 판매중으로 바꾸실 수 있습니다. 단건은 오로라 > 상품 조회/수정 > 상품 코드 클릭 > 상품상태, 일괄은 상품 조회/수정 > 상태 변경(판매중) > 일괄 변경에서 하실 수 있으며, 재고가 0인 일시품절 상품은 상품 상세에서 재고·재고상태를 먼저 수정해 주세요.\n(구분에 해당하는 단락만 안내, 맺음 A)", "ack": "남겨 주신 의견과 자료를 담당 부서에 전달해 검토를 요청드리겠습니다. 검토 결과에 따라 추가 자료를 요청드릴 수 있습니다.\n(의료기기 판매업 신고 면제 품목 주장: \"재검수 때 참고하도록 전달드리겠습니다. 다만 의료기기 상품은 검수 때 판매권한 여부를 검토하고 있어 이후에도 자료를 요청받으실 수 있습니다.\")\n(메일 미수신: \"오로라 > 판매자 정보 > 담당자 정보의 연락처가 최신인지도 함께 확인 부탁드립니다.\")", "info": "상품번호·판매신청서(수정요청서) 번호, 파트너가 고른 구분, 검수이력 사유(붙여넣기), 요청 내용, 전달 의견·첨부 여부, 소명 제출일, 삭제 동의 여부", "kms": "050_상품_검수.md, 043_상품수정.md, 056_상품_관리.md, 046_카테고리.md, 094_영업_리스크팀_이관_유형_및_방법.md, 075_파트너센터_교육자료_상품검수.md", "check": "1) 검수거절 후 재등록 가능 여부 상충(050·056 '재등록 불가' vs 056 '보완해 새롭게 등록')\n2) 반려 사유별 판단 기준(검수 기준 상세) KMS 없음 — 기준 해석 문의는 상담원 배정\n3) 판매정지(신고) 사유 중 '판매 중 상품 변경'의 사유 확인 오로라 메뉴 경로 KMS 없음\n4) 7~9월 게시판 접수 추정 약 210건(검수 반려·판매정지 코드)으로 상품 유형 중 게시판 비중이 큼"}}, {"code": "PA003004", "draft": true, "name": "상품명·옵션명 수정 요청", "mid": "상품", "vol": "119", "mode": "안내 후 조건부 상담원 연결", "utter": "옵션명 바꿔주세요\n옵션명에 '색상' 말고 '사이즈'도 추가하고 싶은데 해주실 수 있나요?\n상품명 오타가 있는데 수정해 주세요", "raw": "1. 네, 파트너님. 어떤 항목을 바꾸고 싶으신가요?\n- 버튼: 상품명, 옵션명(예: 색상·사이즈 같은 옵션 이름), 옵션값(예: 화이트·S·M), 브랜드명\n(옵션명/옵션값을 헷갈리면 버튼 아래 예시로 구분)\n\n[상품명]\n2. 상품명은 파트너님이 오로라에서 직접 수정하실 수 있습니다.\n- 단건: [오로라 > 상품관리 > 상품 조회/수정 > 상품ID 클릭] 후 상품명 수정 > 수정요청\n- 여러 상품: [상품 조회/수정 > 엑셀 양식 > 상품 단위 일괄 수정] 양식 작성 후 엑셀 일괄 업로드\n상품명은 사후검수 항목이라 수정 즉시 고객에게 노출되며, 기준에 맞지 않으면 수정 전으로 원복될 수 있습니다. 결과는 [상품 검수 현황 > 수정검수요청 현황 > 검수내역]에서 확인하실 수 있습니다. 상품명은 공백 포함 50자까지이며 브랜드명·셀러샵명은 넣을 수 없습니다.\n[수정하려니 다른 항목 오류가 나요] → 2-1 / [직접 하기 어려우니 대신 해주세요] → 2-2 / [확인했어요] → 공통-2 종료 (유형: PA003004)\n2-1. 기존 스토어관리(SCM)에서 옮겨온 상품은 새로 추가된 유효성 검사 항목(예: 브랜드명·상품명·옵션명(1+2 합산) 글자수, GIF 등록 불가 등)을 먼저 고치셔야 원래 수정하려던 항목을 수정하실 수 있습니다.\n→ 공통-2 종료 (유형: PA003004)\n2-2. 상품명은 파트너님이 직접 수정하시는 항목이라 파트너센터에서 대신 수정해 드리지 않는 점 양해 부탁드립니다. 수정 과정에서 문제가 생기면 다시 문의해 주세요.\n(재요청 시 → 상담원 인계 (T2))\n\n[옵션명]\n3. 옵션명 수정·추가·삭제는 파트너님이 직접 하실 수 없어 파트너센터에서 처리를 도와드리고 있습니다. 처리에 필요한 내용을 여쭤볼게요.\n3-1. 해당 상품코드(또는 주문번호)를 알려주시겠어요?\n[상품코드 입력]\n(1차에는 옵션 정보·수정검수 진행 여부 조회가 없어 바로 3-2로 진행, 수정검수 진행 여부는 상담원이 확인)\n3-2. 수정, 추가, 삭제 중 어떤 요청인가요?\n[수정 / 추가 / 삭제]\n3-3. 현재 옵션명과 바꾸실 옵션명을 알려주세요. 옵션명이 2개라면 옵션명1과 옵션명2를 나눠서 적어주세요.\n예) 현재 옵션명1: 색상 → 변경 옵션명1: 컬러 / 현재 옵션명2: 없음 → 변경 옵션명2: 사이즈\n[내용 입력]\n(필수 구매옵션 옵션명은 최대 2개까지라는 점 확인. 3개 이상 요청이면: \"필수 구매옵션의 옵션명은 최대 2개까지 등록됩니다. 등록 가능한 옵션 중 두 가지를 골라주세요.\" 안내 후 다시 입력)\n(변경 옵션명이 공백 포함 35자(옵션값1+2 합산)를 넘으면 글자수 안내 후 다시 입력)\n3-4. 확인했습니다. 상품코드 {상품코드}, {수정/추가/삭제}, {현재 옵션명} → {변경 옵션명}으로 요청 내용을 정리했습니다. 담당자 처리를 위해 상담원에게 연결해 드릴게요.\n→ 상담원 인계 (T3-A)\n\n[옵션값]\n4. 옵션값(예: S, M, L)은 파트너님이 직접 바꾸실 수 있습니다.\n- 옵션값 수정: [상품 조회/수정 > 상품ID 클릭]에서 수정하거나, [엑셀 양식 > 옵션 단위 일괄 수정] 양식 사용 (예: S, M, L → 1, 2, 3 변경 가능). 사후검수 항목입니다.\n- 옵션값 추가: [엑셀 양식 > 옵션값 일괄 추가] 양식에 추가할 값만 입력해 업로드. 사전검수 항목이라 승인 후 노출됩니다.\n- 같은 옵션코드의 옵션값과 옵션가격을 동시에 바꾸는 것은 '옵션 수정 어뷰징'으로 허용되지 않습니다. 둘 다 바꾸셔야 하면 기존 옵션을 미사용 처리하고 옵션을 새로 추가해 주세요.\n→ 공통-2 종료 (유형: PA003004)\n\n[브랜드명]\n5. 상품에 등록된 브랜드명 변경은 상품 단위로 담당 부서에서 처리합니다. 요청 전에 상품 상세페이지에 변경 전 브랜드명이 적힌 부분을 먼저 수정해 주시고, 상세페이지에 바꾸실 브랜드의 상품임을 알 수 있는 배너·문구가 있어야 합니다. 배너·문구를 넣기 어려우시면 브랜드 권리 보유 증빙(상표 등록증 등), 브랜드 사용 허가 계약서, 정품 유통 증빙 서류 중 하나를 첨부해 주세요. 샵명과 브랜드명은 같게 설정할 수 없습니다.\n5-1. 변경할 상품코드와 기존 브랜드명, 바꾸실 브랜드명을 알려주시겠어요?\n[내용·첨부 입력]\n(모음전 브랜드명이면: \"모음전은 기존 모음전을 삭제한 뒤 새로 생성해 주셔야 합니다.\" 안내)\n→ 상담원 인계 (T3-C)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 어떤 항목을 바꾸고<br/>싶으신가요?\"]:::bot\nN2[\"<b>2<\/b> 상품명은 파트너님이 오로라에서 직접 수정하실<br/>수 있습니다.\"]:::bot\nN2_1[\"<b>2-1<\/b> 기존 스토어관리(SCM)에서 옮겨온 상품은<br/>새로 추가된 유효성 검사 항목(예:<br/>브랜드명·상품명·옵션명(1+2 합산)<br/>글자수, GIF 등록 불가 등)을 먼저<br/>고치셔야 원래 수정하려던 항목을 수정하실 수<br/>있습니다.\"]:::bot\nN2_2[\"<b>2-2<\/b> 상품명은 파트너님이 직접 수정하시는 항목이라<br/>파트너센터에서 대신 수정해 드리지 않는 점<br/>양해 부탁드립니다. 수정 과정에서 문제가<br/>생기면 다시 문의해 주세요.\"]:::bot\nN3[\"<b>3<\/b> 옵션명 수정·추가·삭제는 파트너님이 직접<br/>하실 수 없어 파트너센터에서 처리를<br/>도와드리고 있습니다. 처리에 필요한 내용을<br/>여쭤볼게요.\"]:::bot\nN3_1[\"<b>3-1<\/b> 해당 상품코드(또는 주문번호)를<br/>알려주시겠어요?\"]:::bot\nN3_2[\"<b>3-2<\/b> 수정, 추가, 삭제 중 어떤 요청인가요?\"]:::bot\nN3_3[\"<b>3-3<\/b> 현재 옵션명과 바꾸실 옵션명을 알려주세요.<br/>옵션명이 2개라면 옵션명1과 옵션명2를<br/>나눠서 적어주세요.\"]:::bot\nN3_4[\"<b>3-4<\/b> 확인했습니다. 상품코드 (상품코드),<br/>(수정/추가/삭제), (현재 옵션명)\"]:::bot\nN4[\"<b>4<\/b> 옵션값(예: S, M, L)은 파트너님이<br/>직접 바꾸실 수 있습니다.\"]:::bot\nN5[\"<b>5<\/b> 상품에 등록된 브랜드명 변경은 상품 단위로<br/>담당 부서에서 처리합니다. 요청 전에 상품<br/>상세페이지에 변경 전 브랜드명이 적힌 부분을<br/>먼저 수정해 주시고, 상세페이지에 바꾸실<br/>브랜드의 상품임을 알 수 있는 배너·문구가<br/>있어야 합니다. 배너·문구를 넣기 어려우시면<br/>브랜드 권리 보유 증빙(상표 등록증 등),<br/>브랜드 사용 허가 계약서, 정품 유통 증빙<br/>서류 중 하나를 첨부해 주세요. 샵명과<br/>브랜드명은 같게 설정할 수 없습니다.\"]:::bot\nN5_1[\"<b>5-1<\/b> 변경할 상품코드와 기존 브랜드명, 바꾸실<br/>브랜드명을 알려주시겠어요?\"]:::bot\nS --> N1\nN1 -->|\"상품명\"| N2\nN2 -->|\"수정하려니 다른 항목 오류가 나요\"| N2_1\nN2 -->|\"직접 하기 어려우니 대신 해주세요\"| N2_2\nN2 -->|\"확인했어요\"| END\nN2_1 --> END\nN2_2 -->|\"재요청 시\"| HO_T2\nN2_2 -->|\"옵션명\"| N3\nN3_1 -->|\"상품코드 입력\"| N3_2\nN3_2 -->|\"수정 / 추가 / 삭제\"| N3_3\nN3_3 -->|\"내용 입력\"| N3_4\nN3_4 --> TX2\nN3_4 --> HO_T3A\nN3_ 내용을 정리했습니다. 담당자 처리를 위해 상담원에게 연결해 드릴게요.", "sec": false, "body": []}, {"k": "4", "id": "4", "t": "옵션값(예: S, M, L)은 파트너님이 직접 바꾸실 수 있습니다.", "sec": false, "body": ["- 옵션값 수정: [상품 조회/수정 > 상품ID 클릭]에서 수정하거나, [엑셀 양식 > 옵션 단위 일괄 수정] 양식 사용 (예: S, M, L → 1, 2, 3 변경 가능). 사후검수 항목입니다.", "- 옵션값 추가: [엑셀 양식 > 옵션값 일괄 추가] 양식에 추가할 값만 입력해 업로드. 사전검수 항목이라 승인 후 노출됩니다.", "- 같은 옵션코드의 옵션값과 옵션가격을 동시에 바꾸는 것은 '옵션 수정 어뷰징'으로 허용되지 않습니다. 둘 다 바꾸셔야 하면 기존 옵션을 미사용 처리하고 옵션을 새로 추가해 주세요."]}, {"k": "5", "id": "5", "t": "상품에 등록된 브랜드명 변경은 상품 단위로 담당 부서에서 처리합니다. 요청 전에 상품 상세페이지에 변경 전 브랜드명이 적힌 부분을 먼저 수정해 주시고, 상세페이지에 바꾸실 브랜드의 상품임을 알 수 있는 배너·문구가 있어야 합니다. 배너·문구를 넣기 어려우시면 브랜드 권리 보유 증빙(상표 등록증 등), 브랜드 사용 허가 계약서, 정품 유통 증빙 서류 중 하나를 첨부해 주세요. 샵명과 브랜드명은 같게 설정할 수 없습니다.", "sec": false, "body": []}, {"k": "5-1", "id": "5-1", "t": "변경할 상품코드와 기존 브랜드명, 바꾸실 브랜드명을 알려주시겠어요?", "sec": false, "body": ["(모음전 브랜드명이면: \"모음전은 기존 모음전을 삭제한 뒤 새로 생성해 주셔야 합니다.\" 안내)"]}], "hocond": "옵션명 수정·추가·삭제는 양식 수집 후 T3-A / 브랜드명 변경은 정보 수집 후 T3-C / 상품명 대리 수정 재요청 T2", "hoinfo": "상품코드(또는 주문번호), 요청 구분(수정·추가·삭제), 기존 옵션명1·2 → 변경 옵션명1·2, 수정검수 진행 여부는 상담원이 확인(챗봇 미확인 표기) / 브랜드명: 상품코드, 기존·변경 브랜드명, 상세페이지 수정 여부, 첨부 증빙", "kms": "044_상품명_옵션명, 043_상품수정, 092_관리자_이관_유형_및_방법, 053_브랜드, 050_상품_검수", "check": "수정검수 진행 중 옵션명 변경 가능 여부 KMS 없음 / 옵션명 '삭제' 시 해당 옵션값 처리 방식 KMS 없음 / 브랜드명 변경은 브랜드 유형(별도 ECA)과 겹침, 유형 코드 확정 필요 / 옵션명 처리 완료 기간 KMS 없음(관리자 이관 공통 안내는 '최대 5영업일') / (1차 추가) 1차는 수정검수 진행 여부를 모른 채 접수하므로, 검수 중인 상품의 옵션명 요청을 상담원이 어떻게 처리할지(대기·반려) 기준 필요 / (1차 추가) 게시판 2차 후보의 '옵션명 변경 Write'는 API 요청 명세(W-01~W-06)에 없어 명세 추가 여부 확인 필요", "api": "R-05", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 변경 항목 (상품명 / 옵션명(예: 색상·사이즈 같은 옵션 이름) / 옵션값(예: 화이트·S·M) / 브랜드명): \n· (해당 시: 옵션명·브랜드명) 상품코드 또는 주문번호: \n· (해당 시: 옵션명) 요청 구분 (수정 / 추가 / 삭제): \n· (해당 시: 옵션명. 필수 구매옵션 옵션명은 최대 2개) 현재 옵션명1·옵션명2 → 바꿀 옵션명1·옵션명2: \n· (해당 시: 브랜드명) 현재 브랜드명 → 바꿀 브랜드명: \n· (해당 시: 브랜드명) 상세페이지에 바꿀 브랜드의 상품임을 알 수 있는 배너·문구가 있는지 (있음 / 없음): \n· (해당 시: 배너·문구 없음 — 상표 등록증 등 브랜드 권리 증빙, 브랜드 사용 허가 계약서, 정품 유통 증빙 중 1개) 증빙 첨부: 첨부파일로 올려 주세요\n· (해당 시: 상품코드 3개 이상) 브랜드명 변경 양식 첨부: 첨부파일로 올려 주세요\n\n문의 내용: ", "mode": "조건별: 상품명·옵션값은 자동답변 종결(직접 수정 경로) / 옵션명 수정·추가·삭제와 브랜드명 변경은 상담원 배정", "segs": [{"c": ["A"], "t": "상품명·옵션값은 자동답변 종결(직접 수정 경로)"}, {"c": ["C"], "t": "옵션명 수정·추가·삭제와 브랜드명 변경은 상담원 배정"}], "auto": "(공통 첫인사)\n\n[상품명을 바꾸시려는 경우]\n상품명은 파트너님이 오로라에서 직접 수정하시는 항목이라 파트너센터에서 대신 수정해 드리지 않습니다.\n- 단건: 오로라 > 상품관리 > 상품 조회/수정 > 상품ID 클릭 후 상품명 수정 > 수정요청\n- 여러 상품: 상품 조회/수정 > 엑셀 양식 > 상품 단위 일괄 수정 양식 작성 후 엑셀 일괄 업로드\n상품명은 사후검수 항목이라 수정 즉시 고객에게 노출되며, 기준에 맞지 않으면 수정 전으로 원복될 수 있습니다. 결과는 상품 검수 현황 > 수정검수요청 현황 > 검수내역에서 확인하실 수 있습니다. 상품명은 공백 포함 50자까지이며 브랜드명·셀러샵명은 넣을 수 없습니다.\n기존 스토어관리(SCM)에서 옮겨온 상품은 새로 추가된 유효성 검사 항목(브랜드명·상품명·옵션명(1+2 합산) 글자수, GIF 등록 불가 등)을 먼저 고치셔야 원래 수정하려던 항목을 수정하실 수 있습니다.\n\n[옵션값을 바꾸시려는 경우]\n옵션값(예: S, M, L)은 파트너님이 직접 바꾸실 수 있습니다.\n- 수정: 상품 조회/수정 > 상품ID 클릭에서 수정하거나 엑셀 양식 > 옵션 단위 일괄 수정 양식 사용 (예: S, M, L → 1, 2, 3). 사후검수 항목입니다.\n- 추가: 엑셀 양식 > 옵션값 일괄 추가 양식에 추가할 값만 입력해 업로드. 사전검수 항목이라 승인 후 노출됩니다.\n- 같은 옵션코드의 옵션값과 옵션가격을 동시에 바꾸는 것은 '옵션 수정 어뷰징'으로 허용되지 않습니다. 둘 다 바꾸셔야 하면 기존 옵션을 미사용 처리하고 옵션을 새로 추가해 주세요.\n(맺음 A)", "ack": "남겨 주신 내용으로 변경 처리를 요청드리겠습니다.\n(옵션명: \"옵션명 수정·추가·삭제는 파트너님이 직접 하실 수 없어 파트너센터에서 처리해 드리고 있습니다.\")\n(브랜드명: \"브랜드명은 상품 단위로 담당 부서에서 변경합니다. 상세페이지에 변경 전 브랜드명이 적힌 부분은 먼저 수정해 주시고, 샵명과 브랜드명은 같게 설정할 수 없는 점 참고 부탁드립니다. 모음전은 브랜드명이 수정되지 않아 기존 모음전을 삭제한 뒤 새로 신청해 주셔야 합니다.\")", "info": "상품코드(또는 주문번호), 요청 구분(수정·추가·삭제), 현재 옵션명1·2 → 변경 옵션명1·2 / 브랜드명: 상품코드(3개 이상이면 양식), 현재·변경 브랜드명, 상세페이지 배너 여부, 증빙 첨부 여부", "kms": "044_상품명_옵션명.md, 043_상품수정.md, 092_관리자_이관_유형_및_방법.md, 086_상담_양식___첨부_파일__.md, 053_브랜드.md", "check": "1) 수정검수 진행 중 옵션명 변경 가능 여부 KMS 없음\n2) 옵션명 '삭제' 시 해당 옵션값 처리 방식 KMS 없음\n3) 브랜드명 변경을 이 유형으로 찍을지 별도 유형인지\n4) 옵션명 처리 완료 기간 KMS 없음 (공통 안내 '최대 5영업일'은 템플릿)"}}, {"code": "PA003005", "draft": true, "name": "상품 미노출·수정 미반영", "mid": "상품", "vol": "115", "mode": "안내 후 조건부 상담원 연결", "utter": "승인됐는데 상품이 안 보여요\n가격 수정했는데 사이트에 반영이 안 됐어요\n상세페이지 바꿨는데 그대로예요", "raw": "1. 네, 파트너님. 어떤 상황인가요?\n[신규 상품이 사이트에 안 보여요] → 2 / [수정한 내용이 반영이 안 돼요] → 4 / [검색 순위가 낮아요] → 5\n(1차에는 판매승인 상태·2차 승인 시각·판매 상태·수정검수 상태 조회가 없어 파트너가 오로라에서 확인한 상태로 분기)\n\n[신규 상품 미노출]\n2. [오로라 > 상품관리 > 상품 검수 현황 > 판매검수현황]에서 해당 상품이 '2차 검수완료'인지, [상품 조회/수정]에서 판매 상태가 무엇인지 확인해 주시겠어요? 확인하신 상태를 골라주세요.\n[아직 검수 중이에요] → PA003001 시나리오 2번으로 이동 (유형 변경: PA003001)\n[판매대기] → 3-1 / [판매정지] → 3-2 / [일시품절] → 3-3 / [2차 검수완료·판매중] → 3 / [확인해도 모르겠어요] → 3-6\n3. 2차 검수 완료 후 오늘의집 사이트에 노출되기까지 최소 2시간이 걸립니다. 2차 승인 완료 시간부터 24시간이 지났나요?\n[24시간이 안 됐어요] → 3-4 / [24시간이 지났어요] → 3-5 / [승인 시각을 모르겠어요] → 3-4\n3-1. 해당 상품은 판매대기 상태라 고객에게 노출되지 않습니다. 원하시는 시점에 직접 판매중으로 바꿔주세요.\n- 단건: [상품 조회/수정 > 상품 코드 클릭 > 상품상태]\n- 일괄: [상품 조회/수정 > 상품ID 앞 네모칸 체크 > 상태 변경(판매중) > 일괄 변경]\n→ 공통-2 종료 (유형: PA003005)\n3-2. 해당 상품은 판매정지 상태라 고객에게 노출되지 않습니다. 일반 판매정지는 3-1과 같은 경로로 직접 판매중으로 바꾸실 수 있고, 판매정지(신고)는 직접 전환되지 않습니다.\n[판매정지(신고)예요] → PA003007 시나리오 4번으로 이동 (유형 변경: PA003007) / [일반 판매정지예요] → 3-1\n3-3. 해당 상품은 재고가 0인 일시품절 상태입니다. 일시품절 상품은 브랜드홈에서 노출되지 않을 수 있습니다. 상품 상세에서 [재고/재고상태]를 수정하신 뒤 판매중으로 바꿔주세요.\n→ 공통-2 종료 (유형: PA003005)\n3-4. 2차 검수 완료 후 오늘의집 사이트에 노출되기까지 최소 2시간이 걸립니다. 2차 승인 완료 시간부터 24시간이 지나도 상품이 보이지 않으면 다시 문의해 주세요.\n→ 공통-2 종료 (유형: PA003005)\n3-5. 2차 승인 후 24시간이 지났는데도 노출되지 않는 상황이라 담당 부서에 확인을 요청드릴게요. 상품번호와 2차 승인 일시(아시는 경우), 어떤 화면에서 안 보이는지, 검색하신 키워드를 알려주시겠어요?\n[상품번호·승인 일시·키워드·화면 입력 (예: 검색 결과, 카테고리, 브랜드홈)]\n→ 상담원 인계 (T3-C)\n3-6. 상담원이 상품 상태를 확인해 드릴게요. 확인할 상품번호와 어떤 화면에서 안 보이는지, 검색하신 키워드를 알려주시겠어요?\n[상품번호·키워드·화면 입력]\n→ 상담원 인계 (T3-D)\n\n[수정 미반영]\n4. 어떤 항목을 수정하셨나요?\n[가격·배송비·옵션 추가] → 4-1 / [상품명·대표이미지·정보고시·옵션명·옵션값] → 4-2 / [상세페이지(상품 설명)] → 4-3 / [출고지·반품지 주소] → 4-4\n4-1. 가격·배송비·옵션 추가는 사전검수 항목이라 수정 즉시 반영되지 않고, 검수 승인 후 고객에게 노출됩니다. 처리까지 최대 5영업일 정도 걸릴 수 있습니다. 수정 전에 접수된 주문에는 바뀐 내용이 적용되지 않고, 승인 이후 접수된 주문부터 적용됩니다. 검수 결과와 거절 사유는 [오로라 > 상품관리 > 상품 검수 현황 > 수정검수요청 현황(상단 우측 탭) > 검수내역]에서 확인하실 수 있습니다.\n[수정 요청한 지 5영업일이 안 됐어요] → \"조금 더 기다려 주시면 순서대로 처리됩니다.\" 후 공통-2 종료 (유형: PA003005)\n[5영업일이 지났어요] → 4-5\n[거절됐어요] → PA003007 시나리오 3번으로 이동 (유형 변경: PA003007)\n[승인됐는데 반영이 안 돼요] → 4-3\n4-2. 상품명·대표이미지·정보고시·옵션명·옵션값 등은 사후검수 항목이라 수정 즉시 노출됩니다. 다만 사후검수에서 기준 미달로 판단되면 수정 전 정보로 원복될 수 있습니다. 원복 여부와 사유는
