", "id": "3-6", "t": "상담원이 상품 상태를 확인해 드릴게요. 확인할 상품번호와 어떤 화면에서 안 보이는지, 검색하신 키워드를 알려주시겠어요?", "sec": false, "body": []}, {"k": "4", "id": "4", "t": "어떤 항목을 수정하셨나요?", "sec": false, "body": []}, {"k": "4-1", "id": "4-1", "t": "가격·배송비·옵션 추가는 사전검수 항목이라 수정 즉시 반영되지 않고, 검수 승인 후 고객에게 노출됩니다. 처리까지 최대 5영업일 정도 걸릴 수 있습니다. 수정 전에 접수된 주문에는 바뀐 내용이 적용되지 않고, 승인 이후 접수된 주문부터 적용됩니다. 검수 결과와 거절 사유는", "sec": false, "body": []}, {"k": "4-2", "id": "4-2", "t": "상품명·대표이미지·정보고시·옵션명·옵션값 등은 사후검수 항목이라 수정 즉시 노출됩니다. 다만 사후검수에서 기준 미달로 판단되면 수정 전 정보로 원복될 수 있습니다. 원복 여부와 사유는", "sec": false, "body": []}, {"k": "4-3", "id": "4-3", "t": "상품 수정 후 페이지에 반영되기까지 최소 2시간이 걸릴 수 있습니다. 잠시 기다리신 뒤 다시 확인해 주세요.", "sec": false, "body": ["상세페이지 이미지가 엑스박스로 보인다면, 이미지 주소가 http인 경우 노출되지 않으니 https 주소로 바꿔 등록해 주세요."]}, {"k": "4-4", "id": "4-4", "t": "출고지·반품교환지 주소는 미검수 항목이라 수정 즉시 반영됩니다. 이미 접수된 주문에는 바뀐 주소가 적용되지 않을 수 있습니다.", "sec": false, "body": ["{확인 필요: 수정 전 접수된 주문의 반품·교환지 변경 적용 여부. 043에 '확인 못했음' 메모}"]}, {"k": "4-5", "id": "4-5", "t": "수정 요청 후 영업일 기준 5일이 지나 처리 지연 건으로 담당 부서에 확인을 요청드릴게요. 상품번호와 수정 요청일을 알려주시겠어요?", "sec": false, "body": []}, {"k": "4-6", "id": "4-6", "t": "반영 확인을 위해 담당 부서에 요청드릴게요. 상품번호와 수정하신 항목, 수정한 날짜, 어디에서 반영이 안 보이는지 알려주시겠어요?", "sec": false, "body": []}, {"k": "5", "id": "5", "t": "오늘의집 검색 노출 순위는 검색 키워드와의 적합성, 브랜드 선호도, 클릭 수, 소비자 실시간 선호도 등 여러 기준으로 정렬되며, 내부 로직으로 결정되어 구체적인 내용은 공유드리기 어려운 점 양해 부탁드립니다. 상세페이지 추천 탭 상품도 시스템에서 자동으로 노출되어 별도 추가는 어렵습니다.", "sec": false, "body": []}], "hocond": "2차 승인 24시간 경과 미노출 T3-C / 사전검수 5영업일 경과 T3-C / 반영 시간(2시간) 경과 후에도 미반영 T3-C / 오로라 확인 경로 안내 후에도 판매 상태를 모르고 개별 확인을 원함 T3-D", "hoinfo": "상품번호, 상황(신규 미노출·수정 미반영), 파트너가 고른 판매 상태(판매중·판매대기·판매정지·일시품절·모름), 2차 승인 일시와 경과 시간(파트너 응답, 모르면 미확인 표기), 미노출 화면(검색·카테고리·브랜드홈)과 검색 키워드, 수정 항목·수정일(수정 요청일), 파트너가 확인한 검수 상태", "kms": "050_상품_검수, 043_상품수정, 045_이미지_등록_수정_, 056_상품_관리, 053_브랜드, 096_심층문의_이관_유형_및_이관_방법", "check": "지연·미노출 이관 경로가 문서마다 다름(050 영업팀·상품검수팀 / 043·056 파트너대응 문의 채널·SV 검수 / 096 관리자 선문의 후 심층문의), 상담원 처리 기준 통일 필요 / '실제 미노출 여부 홈페이지 선확인' 단계를 챗봇이 할 수 없어 상담원 몫 / 수정 전 접수 주문의 반품·교환지 변경 적용 여부 KMS 미확인 메모 / 2시간 기준이 신규 노출(050)과 상세 수정(045)에만 있고 사전검수 승인 후 반영 시간 기준은 없음 / (1차 추가) 1차는 24시간 판정을 파트너 응답에 의존하는데, 2차 승인 완료 시각을 오로라 어디서 확인하는지 KMS 경로 없음 / (1차 추가) 수정검수요청 현황 > 검수내역에서 수정 요청일이 보이는지 확인 필요(5영업일 판정 근거)", "api": "R-05", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 상품번호: \n· 상황 (신규 상품이 사이트에 안 보임 / 수정한 내용이 반영 안 됨 / 검색 순위가 낮음): \n· (해당 시: 신규 미노출) 오로라 판매 상태 (판매중 / 판매대기 / 일시품절 / 판매정지 / 아직 검수 중 / 모름): \n· (해당 시: 신규 미노출, 알면 입력) 2차 승인 완료 일시: \n· (해당 시: 수정 미반영) 수정한 항목 (가격·배송비·옵션 추가 / 상품명·대표이미지·정보고시·옵션명·옵션값 / 상세페이지 / 출고지·반품지 주소): \n· (해당 시: 수정 미반영) 수정한 날짜: \n· (해당 시: 검색 결과·카테고리·브랜드홈 등) 안 보이는 화면과 검색 키워드: \n\n문의 내용: ", "mode": "조건별: 판매대기·일시품절·판매정지·승인 후 24시간 이내·수정 후 2시간 이내·사전 검수 5영업일 이내·검색 순위는 자동답변 종결 / 승인 24시간 경과 미노출·사전 검수 5영업일 경과·2시간 지나도 미반영은 상담원 배정 / 판매 상태 '모름'은 자동답변 + 상담원 확인", "segs": [{"c": ["A"], "t": "판매대기·일시품절·판매정지·승인 후 24시간 이내·수정 후 2시간 이내·사전 검수 5영업일 이내·검색 순위는 자동답변 종결"}, {"c": ["C"], "t": "승인 24시간 경과 미노출·사전 검수 5영업일 경과·2시간 지나도 미반영은 상담원 배정"}, {"c": ["B"], "t": "판매 상태 '모름'은 자동답변 + 상담원 확인"}], "auto": "(공통 첫인사)\n(AI는 파트너가 적은 판매 상태·승인 일시·수정일로 분기)\n\n[판매대기·일시품절·판매정지 상태인 경우]\n- 판매대기: 고객에게 노출되지 않습니다. 원하시는 시점에 직접 판매중으로 바꿔 주세요. 단건은 상품 조회/수정 > 상품 코드 클릭 > 상품상태, 일괄은 상품 조회/수정 > 상품ID 앞 네모칸 체크 > 상태 변경(판매중) > 일괄 변경입니다.\n- 일시품절: 재고가 0인 상태라 브랜드홈에서 노출되지 않을 수 있습니다. 상품 상세에서 재고·재고상태를 수정하신 뒤 판매중으로 바꿔 주세요.\n- 판매정지: 고객에게 노출되지 않습니다. 일반 판매정지는 위 경로로 직접 판매중 전환이 가능하고, 판매정지(신고)는 직접 전환되지 않아 세부 유형 '검수 반려·판매정지 사유'로 새 문의를 남겨 주세요.\n\n[판매중인데 아직 안 보이는 경우] (2차 승인 후 24시간이 지나지 않음)\n2차 검수 완료 후 오늘의집 사이트에 노출되기까지 최소 2시간이 걸립니다. 2차 승인 완료 시간부터 24시간이 지나도 상품이 보이지 않으면, 안 보이는 화면과 검색 키워드를 적어 새 문의로 남겨 주세요.\n\n[수정한 내용이 반영되지 않는 경우]\n- 가격·배송비·옵션 추가: 사전검수 항목이라 수정 즉시 반영되지 않고 검수 승인 후 고객에게 노출됩니다. 처리까지 최대 5영업일 정도 걸릴 수 있으며, 수정 전에 접수된 주문에는 바뀐 내용이 적용되지 않습니다. 거절된 경우 사유는 상품 검수 현황 > 수정검수요청 현황(상단 오른쪽 탭) > 검수내역에서 확인하실 수 있습니다.\n- 상품명·대표이미지·정보고시·옵션명·옵션값: 사후검수 항목이라 수정 즉시 노출되지만, 사후검수에서 기준 미달로 판단되면 수정 전 정보로 원복될 수 있습니다. 원복 여부와 사유는 같은 검수내역에서 확인하실 수 있습니다.\n- 상세페이지: 수정 후 페이지에 반영되기까지 최소 2시간이 걸릴 수 있습니다. 이미지가 엑스박스로 보인다면 이미지 주소가 http인 경우라 https 주소로 바꿔 등록해 주세요.\n- 출고지·반품교환지 주소: 미검수 항목이라 수정 즉시 반영됩니다.\n위 기간이 지나도 반영되지 않으면 수정한 항목·날짜와 어디에서 반영이 안 보이는지 적어 새 문의로 남겨 주세요.\n\n[검색 순위가 낮은 경우]\n오늘의집 검색 노출 순위는 검색 키워드와의 적합성, 브랜드 선호도, 클릭 수, 소비자 실시간 선호도 등 여러 기준으로 정렬되며, 내부 로직으로 결정되어 구체적인 내용은 공유드리기 어려운 점 양해 부탁드립니다. 상세페이지 추천 탭 상품도 시스템에서 자동으로 노출되어 별도 추가는 어렵습니다.\n\n[판매 상태를 모르시는 경우] → 신규 미노출 단락 전체 + 상태 확인 경로(오로라 > 상품 조회/수정의 상품상태, 상품 검수 현황 > 판매검수현황) 안내 후 맺음 B\n(그 외 맺음 A)", "ack": "안내드린 처리 기간이 지나 담당 부서에 노출·반영 확인을 요청드리겠습니다.", "info": "상품번호, 상황, 파트너가 고른 판매 상태, 2차 승인 일시와 경과 시간, 수정 항목·수정일, 안 보이는 화면·검색 키워드", "kms": "050_상품_검수.md, 043_상품수정.md, 045_이미지_등록_수정_.md, 056_상품_관리.md, 053_브랜드.md, 096_심층문의_이관_유형_및_이관_방법.md", "check": "1) 지연·미노출 처리 부서가 문서마다 다름(050 / 043·056 / 096)\n2) 실제 미노출 여부를 홈페이지에서 먼저 확인하는 단계는 AI가 할 수 없어 상담원 몫\n3) 수정 전 접수된 주문의 반품·교환지 변경 적용 여부 미확인(043 메모) — 답변에서 뺌\n4) 사전검수 승인 후 반영 시간 기준 KMS 없음"}}, {"code": "PA003006", "draft": true, "name": "카테고리 추가·변경", "mid": "상품", "vol": "98", "mode": "안내 후 조건부 상담원 연결", "utter": "관리 카테고리 바꾸고 싶어요\n카테고리 추가 신청했는데 언제 승인돼요?\n카테고리 추가가 거절됐는데 이유가 뭔가요?", "raw": "1. 네, 파트너님. 어떤 도움이 필요하신가요?\n- 버튼: 새 카테고리 상품 판매(카테고리 추가), 카테고리 추가 신청 진행상황·결과, 등록한 상품의 관리 카테고리 변경, 전시 카테고리·검색 필터 변경, 신청 취소\n\n[카테고리 추가]\n2. 입점 시 승인된 카테고리 외 상품은 판매할 수 없어, 상품 등록 화면에도 승인된 카테고리만 보입니다. 카테고리 추가 신청을 해주시면 판매 가능 여부와 자료 심사를 거쳐 판매 가능 카테고리를 추가해 드립니다.\n- 신청 방법: [오로라] 카테고리 추가 신청 가이드 https://www.partnerbucketplace.com/hc/ko/articles/26392425310361\n- 신청서 검토와 카테고리 추가까지 영업일 기준 5일이 소요될 수 있으며, 결과는 신청 시 적으신 메일로 회신됩니다.\n[건강기능식품·의료기기·해외 화장품·해외 식품·해외 구매대행 상품이에요] → 2-1 / [확인했어요] → 공통-2 종료 (유형: PA003006)\n2-1. 해당 상품은 판매 권한 추가 신청이 필요합니다. [오로라] 판매권한 추가 신청 가이드(https://www.partnerbucketplace.com/hc/ko/articles/26393487925913)에 따라 접수해 주세요. 검토와 카테고리 추가까지 영업일 기준 5일이 소요될 수 있고, 결과는 별도로 회신됩니다. 해외 상품 판매권한은 신청서에 전자상거래업자 부호 파일을 함께 첨부해 주세요.\n→ 공통-2 종료 (유형: PA003006)\n\n[진행상황·결과]\n3. 신청서 검토와 카테고리 추가까지 영업일 기준 5일이 소요될 수 있으며, 결과는 신청 시 적으신 메일로 회신됩니다. 지금 어떤 상황인지 골라주시겠어요?\n(1차에는 카테고리 추가 신청 진행 상태 조회가 없어 파트너가 고른 상황으로 분기)\n[신청한 지 5영업일이 안 됐어요] → 3-1 / [5영업일이 지났는데 결과가 없어요] → 3-2 / [승인 메일을 받았어요] → 3-3 / [거절 메일을 받았어요] → 3-4\n3-1. 신청서 검토와 카테고리 추가까지 영업일 기준 5일이 소요될 수 있어 아직 검토 중입니다. 결과는 신청 시 적으신 메일로 회신됩니다. 조금만 기다려 주세요.\n→ 공통-2 종료 (유형: PA003006)\n3-2. 신청 후 영업일 기준 5일이 지나 담당 부서에 진행 상황 확인을 요청드릴게요. 신청하신 카테고리와 신청일을 알려주시겠어요?\n[신청 카테고리·신청일 입력]\n→ 상담원 인계 (T3-C)\n3-3. 카테고리 추가가 승인되었다면 이제 상품 등록 시 해당 카테고리를 선택하실 수 있습니다.\n→ 공통-2 종료 (유형: PA003006)\n3-4. 카테고리 추가는 오늘의집 판매 정책과 운영 방향 등 여러 항목을 고려해 담당자가 승인·거절하고 있어, 승인 기준과 거절 사유는 안내드리기 어려운 점 양해 부탁드립니다. 거절된 경우 최초 신청일로부터 1개월 후에 다시 신청하실 수 있습니다.\n(1차에는 거절 사유를 조회할 수 없어 사유별 문구('1개월 내 중복 접수'·'운영하지 않는 카테고리')는 쓰지 않고 공통 거절 안내만 씀)\n[납득이 안 돼요 / 다시 검토해 주세요] → 3-5 / [알겠어요] → 공통-2 종료 (유형: PA003006)\n3-5. 담당 부서에 다시 확인을 요청드릴게요. 신청하신 카테고리와 신청일, 받으신 거절 메일 내용을 알려주시겠어요?\n[내용 입력]\n→ 상담원 인계 (T3-C)\n\n[관리 카테고리 변경]\n4. 카테고리를 바꾸실 상품ID와 현재 카테고리, 바꾸실 카테고리를 최하위 단계까지 알려주시겠어요?\n예) 현재: 수납/정리 > 화장대/테이블정리 > 티슈커버/케이스 > 갑티슈커버/케이스 → 변경: 패브릭 > 홈패브릭/커버 > 가구커버류 > 기타가구커버/덮개\n[내용 입력]\n4-0. 바꾸실 카테고리가 이미 판매 승인된 카테고리인가요? 상품 등록 화면에는 승인된 카테고리만 보이니 참고해 주세요.\n(1차에는 판매가능 카테고리 권한 조회가 없어 파트너 응답으로 분기)\n[승인된 카테고리예요] → 4-1 / [아직 승인되지 않았어요] → 4-2 / [모르겠어요] → 4-3\n4-1. 말씀해 주신 내용으로 담당 부서에 변경을 요청드릴게요. 바꾸실 카테고리의 판매 권한을 확인한 뒤 변경을 진행합니다. 상담원에게 연결해 드리겠습니다.\n→ 상담원 인계 (T3-C)\n4-2. 바꾸실 카테고리가 판매 승인된 카테고리가 아니면 먼저 카테고리 추가가 필요합니다. [오로라] 카테고리 추가 신청 가이드(https://www.partnerbucketplace.com/hc/ko/articles/26392425310361)에 따라 신청해 주세요. 검토와 추가까지 영업일 기준 5일이 소요될 수 있고, 결과는 별도로 회신됩니다. 승인된 뒤 다시 문의해 주시면 관리 카테고리 변경을 도와드리겠습니다.\n→ 공통-2 종료 (유형: PA003006)\n4-3. 바꾸실 카테고리의 판매 권한은 상담원이 확인해 드릴게요. 입력하신 상품ID와 현재·변경 카테고리를 그대로 전달하겠습니다.\n→ 상담원 인계 (T3-D)\n\n[전시 카테고리·검색 필터]\n5. 어떤 요청인가요?\n[전시 카테고리 변경] → 5-1 / [검색 필터 등록·수정] → 5-2\n5-1. 전시 카테고리는 오늘의집 내부 로직에 따라 설정되어 변경이 어렵고, 관리 카테고리는 변경하실 수 있습니다. 관리 카테고리 변경을 원하시면 말씀해 주세요.\n[관리 카테고리 변경할래요] → 4 / [알겠어요] → 공통-2 종료 (유형: PA003006)\n5-2. 검색 필터 등록·수정은 담당 부서에서 처리합니다. 아래 내용을 알려주시겠어요?\n- 변경할 상품코드\n- 전시 카테고리 (예: 데코·식물 > 디퓨저·캔들 > 홈퍼퓸·사쉐)\n- 현재 적용된 필터\n- 변경 요청 필터\n[내용 입력] → 상담원 인계 (T3-C)\n\n[신청 취소]\n6. 카테고리 추가 신청 취소(철회)는 담당 부서에 전달해 처리됩니다. 신청하신 카테고리와 신청일을 알려주시겠어요?\n[내용 입력] → 상담원 인계 (T3-C)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 어떤 도움이 필요하신가요?\"]:::bot\nN2[\"<b>2<\/b> 입점 시 승인된 카테고리 외 상품은 판매할<br/>수 없어, 상품 등록 화면에도 승인된<br/>카테고리만 보입니다. 카테고리 추가 신청을<br/>해주시면 판매 가능 여부와 자료 심사를 거쳐<br/>판매 가능 카테고리를 추가해 드립니다.\"]:::bot\nN2_1[\"<b>2-1<\/b> 해당 상품은 판매 권한 추가 신청이<br/>필요합니다.\"]:::bot\nN3[\"<b>3<\/b> 신청서 검토와 카테고리 추가까지 영업일 기준<br/>5일이 소요될 수 있으며, 결과는 신청 시<br/>적으신 메일로 회신됩니다. 지금 어떤<br/>상황인지 골라주시겠어요?\"]:::bot\nN3_1[\"<b>3-1<\/b> 신청서 검토와 카테고리 추가까지 영업일 기준<br/>5일이 소요될 수 있어 아직 검토 중입니다.<br/>결과는 신청 시 적으신 메일로 회신됩니다.<br/>조금만 기다려 주세요.\"]:::bot\nN3_2[\"<b>3-2<\/b> 신청 후 영업일 기준 5일이 지나 담당<br/>부서에 진행 상황 확인을 요청드릴게요.<br/>신청하신 카테고리와 신청일을 알려주시겠어요?\"]:::bot\nN3_3[\"<b>3-3<\/b> 카테고리 추가가 승인되었다면 이제 상품 등록<br/>시 해당 카테고리를 선택하실 수 있습니다.\"]:::bot\nN3_4[\"<b>3-4<\/b> 카테고리 추가는 오늘의집 판매 정책과 운영<br/>방향 등 여러 항목을 고려해 담당자가<br/>승인·거절하고 있어, 승인 기준과 거절<br/>사유는 안내드리기 어려운 점 양해<br/>부탁드립니다. 거절된 경우 최초 신청일로부터<br/>1개월 후에 다시 신청하실 수 있습니다.\"]:::bot\nN3_5[\"<b>3-5<\/b> 담당 부서에 다시 확인을 요청드릴게요.<br/>신청하신 카테고리와 신청일, 받으신 거절<br/>메일 내용을 알려주시겠어요?\"]:::bot\nN4[\"<b>4<\/b> 카테고리를 바꾸실 상품ID와 현재 카테고리,<br/>바꾸실 카테고리를 최하위 단계까지<br/>알려주시겠어요?\"]:::bot\nN4_0[\"<b>4-0<\/b> 바꾸실 카테고리가 이미 판매 승인된<br/>카테고리인가요? 상품 등록 화면에는 승인된<br/>카테고리만 보이니 참고해 주세요.\"]:::bot\nN4_1[\"<b>4-1<\/b> 말씀해 주신 내용으로 담당 부서에 변경을<br/>요청드릴게요. 바꾸실 카테고리의 판매 권한을<br/>확인한 뒤 변경을 진행합니다. 상담원에게<br/>연결해 드리겠습니다.\"]:::bot\nN4_2[\"<b>4-2<\/b> 바꾸실 카테고리가 판매 승인된 카테고리가<br/>아니면 먼저 카테고리 추가가 필요합니다.\"]:::bot\nN4_3[\"<b>4-3<\/b> 바꾸실 카테고리의 판매 권한은 상담원이<br/>확인해 드릴게요. 입력하신 상품ID와<br/>현재·변경 카테고리를 그대로 전달하겠습니다.\"]:::bot\nN5[\"<b>5<\/b> 어떤 요청인가요?\"]:::bot\nN5_1[\"<b>5-1<\/b> 전시 카테고리는 오늘의집 내부 로직에 따라<br/>설정되어 변경이 어렵고, 관리 카테고리는<br/>변경하실 수 있습니다. 관리 카테고리 변경을<br/>원하시면 말씀해 주세요.\"]:::bot\nN5_2[\"<b>5-2<\/b> 검색 필터 등록·수정은 담당 부서에서<br/>처리합니다. 아래 내용을 알려주시겠어요?\"]:::bot\nN6[\"<b>6<\/b> 카테고리 추가 신청 취소(철회)는 담당<br/>부서에 전달해 처리됩니다. 신청하신<br/>카테고리와 신청일을 알려주시겠어요?\"]:::bot\nS --> N1\nN1 -->|\"카테고리 추가\"| N2\nN2 -->|\"건강기능식품·의료기기·해외 화장품·해외<br/>식품·해외 구매대행 상품이에요\"| N2_1\nN2 -->|\"확인했어요\"| END\nN2_1 --> END\nN2_1 -->|\"진행상황·결과\"| N3\nN3 -->|\"신청한 지 5영업일이 안 됐어요\"| N3_1\nN3 -->|\"5영업일이 지났는데 결과가 없어요\"| N3_2\nN3 -->|\"승인 메일을 받았어요\"| N3_3\nN3 -->|\"거절 메일을 받았어요\"| N3_4\nN3_1 --> END\nN3_2 --> HO_T3C\nN3_2 -->|\"신청 카테고리·신청일 입력\"| N3_3\nN3_3 --> END\nN3_4 -->|\"다시 검토해 주세요\"| N3_5\nN3_4 -->|\"알겠어요\"| END\nN3_5 --> HO_T3C\nN3_5 -->|\"관리 카테고리 변경\"| N4\nN4_0 -->|\"승인된 카테고리예요\"| N4_1\nN4_0 -->|\"아직 승인되지 않았어요\"| N4_2\nN4_0 -->|\"모르겠어요\"| N4_3\nN4_1 --> HO_T3C\nN4_2 --> END\nN4_2 -->|\"오로라\"| N4_3\nN4_3 --> HO_T3D\nN4_3 -->|\"전시 카테고리·검색 필터\"| N5\nN5 -->|\"전시 카테고리 변경\"| N5_1\nN5 -->|\"검색 필터 등록·수정\"| N5_2\nN5_1 -->|\"관리 카테고리 변경할래요\"| N4\nN5_1 -->|\"알겠어요\"| END\nN5_2 -->|\"내용 입력\"| HO_T3C\nN5_2 -->|\"신청 취소\"| N6\nN6 -->|\"내용 입력\"| HO_T3C\nN4 --> N4_0\nEND([\"상담 종료\"]):::fin\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nHO_T3D([\"상담원 인계<br/>개별 조회 필요\"]):::ho", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 어떤 도움이 필요하신가요?", "sec": false, "body": ["- 버튼: 새 카테고리 상품 판매(카테고리 추가), 카테고리 추가 신청 진행상황·결과, 등록한 상품의 관리 카테고리 변경, 전시 카테고리·검색 필터 변경, 신청 취소"]}, {"k": "2", "id": "2", "t": "입점 시 승인된 카테고리 외 상품은 판매할 수 없어, 상품 등록 화면에도 승인된 카테고리만 보입니다. 카테고리 추가 신청을 해주시면 판매 가능 여부와 자료 심사를 거쳐 판매 가능 카테고리를 추가해 드립니다.", "sec": false, "body": ["- 신청 방법: [오로라] 카테고리 추가 신청 가이드 https://www.partnerbucketplace.com/hc/ko/articles/26392425310361", "- 신청서 검토와 카테고리 추가까지 영업일 기준 5일이 소요될 수 있으며, 결과는 신청 시 적으신 메일로 회신됩니다."]}, {"k": "2-1", "id": "2-1", "t": "해당 상품은 판매 권한 추가 신청이 필요합니다.", "sec": false, "body": []}, {"k": "3", "id": "3", "t": "신청서 검토와 카테고리 추가까지 영업일 기준 5일이 소요될 수 있으며, 결과는 신청 시 적으신 메일로 회신됩니다. 지금 어떤 상황인지 골라주시겠어요?", "sec": false, "body": ["(1차에는 카테고리 추가 신청 진행 상태 조회가 없어 파트너가 고른 상황으로 분기)"]}, {"k": "3-1", "id": "3-1", "t": "신청서 검토와 카테고리 추가까지 영업일 기준 5일이 소요될 수 있어 아직 검토 중입니다. 결과는 신청 시 적으신 메일로 회신됩니다. 조금만 기다려 주세요.", "sec": false, "body": []}, {"k": "3-2", "id": "3-2", "t": "신청 후 영업일 기준 5일이 지나 담당 부서에 진행 상황 확인을 요청드릴게요. 신청하신 카테고리와 신청일을 알려주시겠어요?", "sec": false, "body": []}, {"k": "3-3", "id": "3-3", "t": "카테고리 추가가 승인되었다면 이제 상품 등록 시 해당 카테고리를 선택하실 수 있습니다.", "sec": false, "body": []}, {"k": "3-4", "id": "3-4", "t": "카테고리 추가는 오늘의집 판매 정책과 운영 방향 등 여러 항목을 고려해 담당자가 승인·거절하고 있어, 승인 기준과 거절 사유는 안내드리기 어려운 점 양해 부탁드립니다. 거절된 경우 최초 신청일로부터 1개월 후에 다시 신청하실 수 있습니다.", "sec": false, "body": ["(1차에는 거절 사유를 조회할 수 없어 사유별 문구('1개월 내 중복 접수'·'운영하지 않는 카테고리')는 쓰지 않고 공통 거절 안내만 씀)"]}, {"k": "3-5", "id": "3-5", "t": "담당 부서에 다시 확인을 요청드릴게요. 신청하신 카테고리와 신청일, 받으신 거절 메일 내용을 알려주시겠어요?", "sec": false, "body": []}, {"k": "4", "id": "4", "t": "카테고리를 바꾸실 상품ID와 현재 카테고리, 바꾸실 카테고리를 최하위 단계까지 알려주시겠어요?", "sec": false, "body": ["예) 현재: 수납/정리 > 화장대/테이블정리 > 티슈커버/케이스 > 갑티슈커버/케이스 → 변경: 패브릭 > 홈패브릭/커버 > 가구커버류 > 기타가구커버/덮개"]}, {"k": "4-0", "id": "4-0", "t": "바꾸실 카테고리가 이미 판매 승인된 카테고리인가요? 상품 등록 화면에는 승인된 카테고리만 보이니 참고해 주세요.", "sec": false, "body": ["(1차에는 판매가능 카테고리 권한 조회가 없어 파트너 응답으로 분기)"]}, {"k": "4-1", "id": "4-1", "t": "말씀해 주신 내용으로 담당 부서에 변경을 요청드릴게요. 바꾸실 카테고리의 판매 권한을 확인한 뒤 변경을 진행합니다. 상담원에게 연결해 드리겠습니다.", "sec": false, "body": []}, {"k": "4-2", "id": "4-2", "t": "바꾸실 카테고리가 판매 승인된 카테고리가 아니면 먼저 카테고리 추가가 필요합니다.", "sec": false, "body": []}, {"k": "4-3", "id": "4-3", "t": "바꾸실 카테고리의 판매 권한은 상담원이 확인해 드릴게요. 입력하신 상품ID와 현재·변경 카테고리를 그대로 전달하겠습니다.", "sec": false, "body": []}, {"k": "5", "id": "5", "t": "어떤 요청인가요?", "sec": false, "body": []}, {"k": "5-1", "id": "5-1", "t": "전시 카테고리는 오늘의집 내부 로직에 따라 설정되어 변경이 어렵고, 관리 카테고리는 변경하실 수 있습니다. 관리 카테고리 변경을 원하시면 말씀해 주세요.", "sec": false, "body": []}, {"k": "5-2", "id": "5-2", "t": "검색 필터 등록·수정은 담당 부서에서 처리합니다. 아래 내용을 알려주시겠어요?", "sec": false, "body": ["- 변경할 상품코드", "- 전시 카테고리 (예: 데코·식물 > 디퓨저·캔들 > 홈퍼퓸·사쉐)", "- 현재 적용된 필터", "- 변경 요청 필터"]}, {"k": "6", "id": "6", "t": "카테고리 추가 신청 취소(철회)는 담당 부서에 전달해 처리됩니다. 신청하신 카테고리와 신청일을 알려주시겠어요?", "sec": false, "body": []}], "hocond": "관리 카테고리 변경(파트너가 승인된 카테고리라고 답함) T3-C / 바꿀 카테고리 승인 여부를 모름 T3-D / 추가 신청 5영업일 경과·지연 T3-C / 거절 불만·재검토 요청 T3-C / 신청 취소·검색 필터 변경 T3-C", "hoinfo": "상품ID, 현재 카테고리(전체 Depth) → 변경 카테고리(전체 Depth), 변경 카테고리 판매 승인 여부(파트너 응답: 승인됨 / 모름) / 추가 신청: 신청 카테고리·신청일·파트너가 받은 결과(결과 없음 / 거절 메일 내용) / 검색 필터: 상품코드·전시 카테고리·기존 필터·변경 필터 / 신청 취소: 신청 카테고리·신청일", "kms": "046_카테고리, 043_상품수정, 056_상품_관리, 094_영업_리스크팀_이관_유형_및_방법, 092_관리자_이관_유형_및_방법, 095_커머스_정책_이관_유형_및_이관_방법", "check": "거절 사유 안내 범위 모호('1개월 내 중복 접수'·'미운영 카테고리'를 파트너에게 말해도 되는지) / 추가 신청 진행 문의 이관처가 문서마다 다름(092 관리자 vs 095 커머스정책) / 카테고리 추가 신청 내역이 내부 시트로만 관리돼 조회 API가 없을 가능성 높음, 없으면 진행상황 분기는 전부 상담원 인계 / 관리 카테고리 변경 처리 기간 KMS 없음 / (1차 추가) 1차는 신청 경과일·승인 여부를 파트너 응답으로 분기하므로, 파트너가 '승인됨'이라고 했지만 실제로 권한이 없는 경우 상담원이 변경 전에 권한을 확인해야 함 / (1차 추가) 3-3은 원래 조회 결과 문구('승인되었습니다')를 파트너가 승인 메일을 받은 경우의 조건 문구로 바꿨음", "api": "R-06", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 요청: \n· (해당 시: 카테고리 추가) 건강기능식품·의료기기·해외 화장품·해외 식품·해외 구매대행 상품인지: \n· (해당 시: 진행 상황·결과, 신청 취소) 신청 카테고리와 신청일: \n· (해당 시: 진행 상황) 받은 결과 (아직 결과 없음 / 거절 메일 받음 / 재검토 요청): \n· (해당 시: 관리 카테고리 변경) 상품ID, 현재 카테고리 → 바꿀 카테고리(최하위 단계까지): \n· (해당 시: 관리 카테고리 변경) 바꿀 카테고리가 이미 판매 승인된 카테고리인지 (승인됨 / 아님 / 모름): \n· (해당 시: 검색 필터) 상품코드, 전시 카테고리, 현재 필터, 바꿀 필터: \n\n문의 내용: ", "mode": "조건별: 추가 신청 방법·판매권한 신청·전시 카테고리·신청 5영업일 이내·거절 안내·미승인 카테고리로 변경 요청은 자동답변 종결 / 승인된 카테고리로 관리 카테고리 변경·5영업일 경과·재검토·검색 필터·신청 취소·승인 여부 모름은 상담원 배정", "segs": [{"c": ["A"], "t": "추가 신청 방법·판매권한 신청·전시 카테고리·신청 5영업일 이내·거절 안내·미승인 카테고리로 변경 요청은 자동답변 종결"}, {"c": ["C"], "t": "승인된 카테고리로 관리 카테고리 변경·5영업일 경과·재검토·검색 필터·신청 취소·승인 여부 모름은 상담원 배정"}], "auto": "(공통 첫인사)\n\n[새 카테고리 상품을 판매하시려는 경우]\n입점 시 승인된 카테고리 외 상품은 판매할 수 없어 상품 등록 화면에도 승인된 카테고리만 보입니다. 카테고리 추가 신청을 해 주시면 판매 가능 여부와 자료 심사를 거쳐 판매 가능 카테고리를 추가해 드립니다.\n- 신청 방법: [오로라] 카테고리 추가 신청 가이드 https://www.partnerbucketplace.com/hc/ko/articles/26392425310361\n- 신청서 검토와 카테고리 추가까지 영업일 기준 5일이 소요될 수 있으며, 결과는 신청 시 적으신 메일로 회신됩니다.\n건강기능식품·의료기기·해외 화장품·해외 식품·해외 구매대행 상품은 판매 권한 추가 신청이 필요합니다. [오로라] 판매권한 추가 신청 가이드(https://www.partnerbucketplace.com/hc/ko/articles/26393487925913)에 따라 접수해 주시고, 해외 상품 판매권한은 신청서에 전자상거래업자 부호 파일을 함께 첨부해 주세요.\n\n[추가 신청 결과를 기다리시는 경우] (신청일로부터 5영업일 이내)\n신청서 검토와 카테고리 추가까지 영업일 기준 5일이 소요될 수 있어 아직 검토 중입니다. 결과는 신청 시 적으신 메일로 회신되니 조금만 기다려 주세요. 5영업일이 지나도 결과가 없으면 신청 카테고리와 신청일을 적어 새 문의로 남겨 주세요.\n\n[추가 신청이 거절된 경우]\n카테고리 추가는 오늘의집 판매 정책과 운영 방향 등 여러 항목을 고려해 담당자가 승인·거절하고 있어, 승인 기준과 거절 사유는 안내드리기 어려운 점 양해 부탁드립니다. 거절된 경우 최초 신청일로부터 1개월 후에 다시 신청하실 수 있습니다.\n\n[아직 판매 승인되지 않은 카테고리로 관리 카테고리를 바꾸시려는 경우]\n바꾸실 카테고리가 판매 승인된 카테고리가 아니면 먼저 카테고리 추가가 필요합니다. 위 카테고리 추가 신청 가이드에 따라 신청해 주시고, 승인된 뒤 상품ID와 현재·변경 카테고리를 적어 새 문의로 남겨 주시면 관리 카테고리 변경을 도와드리겠습니다.\n\n[전시 카테고리를 바꾸시려는 경우]\n전시 카테고리는 오늘의집 내부 로직에 따라 설정되어 변경이 어렵고, 관리 카테고리는 변경하실 수 있습니다.\n(맺음 A)", "ack": "남겨 주신 내용을 담당 부서에 전달해 처리를 요청드리겠습니다.\n(관리 카테고리 변경: \"바꾸실 카테고리의 판매 권한을 확인한 뒤 변경을 진행하겠습니다.\")\n(5영업일 경과: \"신청 후 영업일 기준 5일이 지나 담당 부서에 진행 상황 확인을 요청드리겠습니다.\")", "info": "상품ID, 현재 카테고리(전체 단계) → 변경 카테고리(전체 단계), 변경 카테고리 판매 승인 여부(파트너 응답) / 추가 신청: 신청 카테고리·신청일·받은 결과 / 검색 필터: 상품코드·전시 카테고리·현재·변경 필터 / 신청 취소 대상", "kms": "046_카테고리.md, 043_상품수정.md, 056_상품_관리.md, 094_영업_리스크팀_이관_유형_및_방법.md, 092_관리자_이관_유형_및_방법.md, 095_커머스_정책_이관_유형_및_이관_방법.md", "check": "1) 거절 사유 중 '1개월 내 중복 접수'·'미운영 카테고리'를 파트너에게 그대로 안내해도 되는지 모호 — 조회 없이는 사유를 모르므로 1차는 공통 거절 안내만 씀\n2) 진행 상황 문의 처리 부서가 문서마다 다름(092 vs 095)\n3) 관리 카테고리 변경 처리 기간 KMS 없음\n4) 7~9월 게시판 접수 추정 약 150건으로 채팅 대비 게시판 비중이 높은 유형(약 48%)"}}, {"code": "PA006001", "draft": false, "name": "입점 문의", "mid": "입점", "vol": "91", "mode": "안내 후 조건부 상담원 연결", "utter": "오늘의집에 입점하려면 어떻게 신청해요?\n입점 거절됐다는데 이유가 뭔가요?\n개인사업자도 입점 가능한가요? 신청 전에 가능 여부 먼저 알 수 있을까요?", "raw": "(전제: 예비파트너는 오로라 계정이 없는 비회원으로 채팅에 들어옴. 샵 자동 식별 없음. 게시판은 로그인 회원만 쓸 수 있어, 예비파트너 문의는 채팅에서 응대하고 개별 확인·처리가 필요하면 사업자등록번호 등 필요한 정보를 받아 상담원에게 인계함 (10/20 변경))\n1. 네, 파트너님. 입점 관련해 어떤 내용이 궁금하신가요?\n[입점 신청 방법] → 2-1 / [입점 자격·조건] → 2-2 / [입점 거절 사유] → 2-3 / [재입점·재신청 가능 시기] → 2-4 / [글로벌(일본·미국) 판매 신청] → 2-5 / [인테리어·시공·이사 업체 입점] → 2-6\n\n2-1. 오늘의집 입점은 아래 순서로 신청하실 수 있습니다.\n1) 오로라(https://orora.ohou.se) 접속 후 [오늘의집 입점 신청] 클릭\n2) 사업자등록번호 인증 후 정보 입력, [다음] 클릭 (해외사업자는 '해외사업자입니다.' 체크 후 사업자등록번호와 국가 입력)\n3) 대표 계정부터 상품 정보까지 입력 후 [입점신청 완료] 클릭\n4) 한 달 이내에 대표 계정의 ID(메일)와 휴대폰번호로 입점 결과(승인/보류/거절)가 안내됩니다.\n입점 절차는 입점신청 > 입점심사 > 자료제출 > 자료심사 > 계약체결 > 입점완료 순서로 진행됩니다. 자세한 내용은 오늘의집 입점안내(https://www.partnerbucketplace.com/hc/ko/articles/19259629646361)에서 확인하실 수 있습니다.\n[로그인 아이디가 이미 사용 중인 이메일이라고 나와요] → 2-1-1\n[판매할 카테고리를 모르겠어요] → 2-1-2\n[알겠어요] → 9\n\n2-1-1. 판매자샵 로그인 아이디(메일 주소)는 중복으로 사용할 수 없습니다. 다른 판매자샵의 로그인 아이디로 쓰고 있는 메일이라면 다른 메일 주소로 신청해 주세요. → 9\n\n2-1-2. 카테고리별 표준수수료율 공지에서 확인하실 수 있습니다. 카테고리를 잘못 선택해 신청하시면 입점이 거절될 수 있으니 반드시 확인 후 신청해 주세요. → 9\n\n2-2. 국내 사업자등록증과 통신판매업신고증이 있는 판매자는 누구나 입점 신청하실 수 있습니다.\n입점 가능 여부를 신청 전에 미리 확인해 드리지는 않습니다. 신청 내역을 기준으로 검토하며, 검토 결과에 따라 입점 여부가 결정됩니다.\n다른 궁금하신 점이 있으신가요?\n[입점 전 수수료 협의] → 2-2-1 / [입점 전 광고 진행] → 2-2-2 / [양도양수 목적 입점] → 2-2-3 / [구매안전서비스 이용확인증] → 2-2-4 / [없어요] → 9\n\n2-2-1. 입점 전 수수료 협의는 불가합니다. 입점 후 별도 신청을 통해 수수료 협의를 요청하실 수 있으며, 협의 요청 시에도 내부 논의 후 불가할 수 있습니다. → 9\n\n2-2-2. 오늘의집 상품광고는 입점된 업체의 상품을 대상으로 운영되며, 미입점 업체는 상품 판매가 불가하여 입점 후 진행하실 수 있습니다.\n입점 신청: https://orora.ohou.se/application/license → 9\n\n2-2-3. 오늘의집은 양도양수를 목적으로 계정을 생성하지 않습니다. 양도양수는 이미 입점된 업체에서 양도양수 신청서를 제출하시면 담당 부서에서 처리합니다.\n- 사업자(계약상 지위) 양도양수 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29540918511641\n- 채권 양도양수 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29541828774681 → 9\n\n2-2-4. 구매안전서비스 이용확인증은 오늘의집에서 자체 발행하지 않습니다. 거래 은행을 통해 발급받으실 수 있습니다. → 9\n\n2-3. 입점 결과(승인/보류/거절)는 대표 계정의 ID(메일)와 휴대폰번호로 안내됩니다. 거절 안내를 받으셨다면 아래 내용을 참고해 주세요.\n(1차에는 사업자등록번호로 입점심사 상태를 조회하지 않아 거절 여부를 확인하지 않고 일반 기준만 안내)\n3-1. 입점 거절은 오늘의집 내부 정책에 따라 결정되며, 상세 사유는 안내드리기 어려운 점 양해 부탁드립니다.\n입점이 거절된 경우 거절 일자로부터 3개월 이후 다시 신청하실 수 있습니다. 기존에 신청하신 내용과 다른 내용이 추가되었을 때 재신청이 가능하며, 재신청 시에도 신규 신청과 동일하게 검토되어 거절될 수 있습니다.\n[알겠어요] → 9\n[아직 거절인지 모르겠어요 / 심사 상태를 확인하고 싶어요] → 입점 현황으로 전환 (유형: PA006002)\n[구체적인 사유를 꼭 알고 싶어요 / 납득이 안 돼요] → 3-2\n[MD에게 입점 제안을 받았어요] → 3-3\n\n3-2. 말씀하신 내용은 담당 부서 확인이 필요합니다. 사업자등록번호와 거절 일자, 확인을 원하시는 내용을 알려 주시면 상담원이 확인해 드리겠습니다. 확인에 시간이 소요될 수 있는 점 양해 부탁드립니다.\n[정보 입력] → 상담원 인계 (T3-C)\n\n3-3. 입점 제안을 한 MD의 이름을 알려주시겠어요?\n[MD 이름 입력]\n(파트너가 '거절 후 3개월 이내인데 MD 제안 메일을 받았다, 지금 신청 가능한지' 묻는 경우 → 3-4 / 선승인·거절 수정 요청이면 → 3-5)\n3-4. 거절 후 3개월 이내 재신청 가능 여부는 입점을 제안한 MD께 직접 문의해 주세요. → 9\n3-5. 말씀하신 내용은 담당 부서 확인이 필요합니다. 사업자등록번호와 함께 제안 MD 이름과 요청 내용(선승인 / 거절 수정)을 알려 주시면 상담원이 확인해 드리겠습니다.\n[정보 입력] → 상담원 인계 (T3-C)\n\n2-4. 어떤 경우인지 알려주시겠어요?\n[입점 거절 후 재신청] → 4-1 / [퇴점 후 재입점] → 4-2\n4-1. 입점이 거절된 경우 거절 일자로부터 3개월 이후 입점 신청이 가능합니다. 기존 신청 내용과 다른 내용이 추가되었을 때 재신청할 수 있으며, 신규 신청과 동일하게 검토되어 거절될 수 있습니다. → 9\n4-2. 퇴점 완료 후 최소 6개월이 지나야 재입점 신청이 가능합니다. 재입점은 입점 신청이 아닌 셀러샵 추가 신청서로 신청해 주세요.\n- 셀러샵 추가 신청서: https://dailyhouse.typeform.com/to/gaEgKtCN?typeform-source=www.partnerbucketplace.com\n신청 시 최근 3개월 이내 발급한 사업자등록증을 꼭 첨부해 주세요. 재입점 시 상품은 새로 등록해야 하며, 기존 상품과 리뷰는 이관되지 않습니다.\n[6개월이 지났는데 '이미 입점된 사업자 번호입니다'라고 나와요] → 4-3 / [퇴점 완료일이 6개월 지났는지 확인하고 싶어요] → 4-4 / [알겠어요] → 9\n4-3. 퇴점 후 재입점은 입점 신청이 아닌 셀러샵 추가 신청으로 진행됩니다. 위 셀러샵 추가 신청서 링크로 신청 부탁드립니다. → 9\n4-4. 퇴점 완료일 확인은 담당 부서 확인이 필요합니다. 사업자등록번호를 알려 주시면 상담원이 퇴점 완료일을 확인해 드리겠습니다.\n[정보 입력] → 상담원 인계 (T3-C)\n\n2-5. 글로벌 서비스는 아래 가이드의 '신청 폼' 링크로 판매 신청서를 제출하실 수 있습니다.\n- [일반] 오늘의집 글로벌 커머스 미국 서비스 런칭 안내: https://www.partnerbucketplace.com/hc/ko/articles/55637771099673\n검토 결과에 따라 참여가 어려울 수 있는 점 양해 부탁드립니다. 오늘의집 일본 서비스·오늘의집US 관련 상세 문의는 global_op@partnerbucketplace.com 으로 샵명·샵 ID와 함께 [JP 문의] 또는 [US 문의]를 적어 보내 주세요. → 9\n\n2-6. 인테리어 시공·이사 업체는 파트너센터가 아닌 별도 채널에서 안내하고 있습니다.\n- 시공/이사(전문가): https://pro.ohou.se/ 의 [자주묻는질문]/[카카오톡 문의하기], 오늘의집 고객센터 1670-0876 (09:00~18:00) 2번\n- 인테리어/생활 O2O(입주청소 등) 사장님센터: https://o2o-partner.ohou.se/intro 에서 별도 가입, 사장님센터 고객센터 1660-4161 (평일 09:00~18:00) → 9\n\n9. 더 궁금하신 점이 있으신가요?\n[아니요] → 상담 종료 (유형: PA006001)\n[네] → 용건 다시 받기 (바뀐 용건의 유형으로 진행)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 입점 관련해 어떤 내용이<br/>궁금하신가요?\"]:::bot\nN2_1[\"<b>2-1<\/b> 오늘의집 입점은 아래 순서로 신청하실 수<br/>있습니다.\"]:::bot\nN2_1_1[\"<b>2-1-1<\/b> 판매자샵 로그인 아이디(메일 주소)는<br/>중복으로 사용할 수 없습니다. 다른<br/>판매자샵의 로그인 아이디로 쓰고 있는<br/>메일이라면 다른 메일 주소로 신청해 주세요.\"]:::bot\nN2_1_2[\"<b>2-1-2<\/b> 카테고리별 표준수수료율 공지에서 확인하실 수<br/>있습니다. 카테고리를 잘못 선택해 신청하시면<br/>입점이 거절될 수 있으니 반드시 확인 후<br/>신청해 주세요.\"]:::bot\nN2_2[\"<b>2-2<\/b> 국내 사업자등록증과 통신판매업신고증이 있는<br/>판매자는 누구나 입점 신청하실 수 있습니다.\"]:::bot\nN2_2_1[\"<b>2-2-1<\/b> 입점 전 수수료 협의는 불가합니다. 입점 후<br/>별도 신청을 통해 수수료 협의를 요청하실 수<br/>있으며, 협의 요청 시에도 내부 논의 후<br/>불가할 수 있습니다.\"]:::bot\nN2_2_2[\"<b>2-2-2<\/b> 오늘의집 상품광고는 입점된 업체의 상품을<br/>대상으로 운영되며, 미입점 업체는 상품<br/>판매가 불가하여 입점 후 진행하실 수<br/>있습니다.\"]:::bot\nN2_2_3[\"<b>2-2-3<\/b> 오늘의집은 양도양수를 목적으로 계정을<br/>생성하지 않습니다. 양도양수는 이미 입점된<br/>업체에서 양도양수 신청서를 제출하시면 담당<br/>부서에서 처리합니다.\"]:::bot\nN2_2_4[\"<b>2-2-4<\/b> 구매안전서비스 이용확인증은 오늘의집에서 자체<br/>발행하지 않습니다. 거래 은행을 통해<br/>발급받으실 수 있습니다.\"]:::bot\nN2_3[\"<b>2-3<\/b> 입점 결과(승인/보류/거절)는 대표 계정의<br/>ID(메일)와 휴대폰번호로 안내됩니다. 거절<br/>안내를 받으셨다면 아래 내용을 참고해<br/>주세요.\"]:::bot\nN3_1[\"<b>3-1<\/b> 입점 거절은 오늘의집 내부 정책에 따라<br/>결정되며, 상세 사유는 안내드리기 어려운 점<br/>양해 부탁드립니다.\"]:::bot\nN3_2[\"<b>3-2<\/b> 말씀하신 내용은 담당 부서 확인이<br/>필요합니다. 사업자등록번호와 거절 일자,<br/>확인을 원하시는 내용을 알려 주시면 상담원이<br/>확인해 드리겠습니다. 확인에 시간이 소요될<br/>수 있는 점 양해 부탁드립니다.\"]:::bot\nN3_3[\"<b>3-3<\/b> 입점 제안을 한 MD의 이름을<br/>알려주시겠어요?\"]:::bot\nN3_4[\"<b>3-4<\/b> 거절 후 3개월 이내 재신청 가능 여부는<br/>입점을 제안한 MD께 직접 문의해 주세요.\"]:::bot\nN3_5[\"<b>3-5<\/b> 말씀하신 내용은 담당 부서 확인이<br/>필요합니다. 사업자등록번호와 함께 제안 MD<br/>이름과 요청 내용(선승인 / 거절 수정)을<br/>알려 주시면 상담원이 확인해 드리겠습니다.\"]:::bot\nN2_4[\"<b>2-4<\/b> 어떤 경우인지 알려주시겠어요?\"]:::bot\nN4_1[\"<b>4-1<\/b> 입점이 거절된 경우 거절 일자로부터 3개월<br/>이후 입점 신청이 가능합니다. 기존 신청<br/>내용과 다른 내용이 추가되었을 때 재신청할<br/>수 있으며, 신규 신청과 동일하게 검토되어<br/>거절될 수 있습니다.\"]:::bot\nN4_2[\"<b>4-2<\/b> 퇴점 완료 후 최소 6개월이 지나야 재입점<br/>신청이 가능합니다. 재입점은 입점 신청이<br/>아닌 셀러샵 추가 신청서로 신청해 주세요.\"]:::bot\nN4_3[\"<b>4-3<\/b> 퇴점 후 재입점은 입점 신청이 아닌 셀러샵<br/>추가 신청으로 진행됩니다. 위 셀러샵 추가<br/>신청서 링크로 신청 부탁드립니다.\"]:::bot\nN4_4[\"<b>4-4<\/b> 퇴점 완료일 확인은 담당 부서 확인이<br/>필요합니다. 사업자등록번호를 알려 주시면<br/>상담원이 퇴점 완료일을 확인해 드리겠습니다.\"]:::bot\nN2_5[\"<b>2-5<\/b> 글로벌 서비스는 아래 가이드의 '신청 폼'<br/>링크로 판매 신청서를 제출하실 수 있습니다.\"]:::bot\nN2_6[\"<b>2-6<\/b> 인테리어 시공·이사 업체는 파트너센터가 아닌<br/>별도 채널에서 안내하고 있습니다.\"]:::bot\nN9[\"<b>9<\/b> 더 궁금하신 점이 있으신가요?\"]:::bot\nS --> N1\nN1 -->|\"입점 신청 방법\"| N2_1\nN1 -->|\"입점 자격·조건\"| N2_2\nN1 -->|\"입점 거절 사유\"| N2_3\nN1 -->|\"재입점·재신청 가능 시기\"| N2_4\nN1 -->|\"글로벌(일본·미국) 판매 신청\"| N2_5\nN1 -->|\"인테리어·시공·이사 업체 입점\"| N2_6\nN2_1 -->|\"로그인 아이디가 이미 사용 중인 이메일이라고<br/>나와요\"| N2_1_1\nN2_1 -->|\"판매할 카테고리를 모르겠어요\"| N2_1_2\nN2_1 -->|\"알겠어요\"| N9\nN2_1_1 --> N9\nN2_1_2 --> N9\nN2_2 -->|\"입점 전 수수료 협의\"| N2_2_1\nN2_2 -->|\"입점 전 광고 진행\"| N2_2_2\nN2_2 -->|\"양도양수 목적 입점\"| N2_2_3\nN2_2 -->|\"구매안전서비스 이용확인증\"| N2_2_4\nN2_2 -->|\"없어요\"| N9\nN2_2_1 --> N9\nN2_2_4 --> N9\nN3_1 -->|\"알겠어요\"| N9\nN3_1 -->|\"심사 상태를 확인하고 싶어요\"| SW_PA006002\nN3_1 -->|\"납득이 안 돼요\"| N3_2\nN3_1 -->|\"MD에게 입점 제안을 받았어요\"| N3_3\nN3_2 -->|\"정보 입력\"| HO_T3C\nN3_3 -->|\"파트너가 '거절 후 3개월 이내인데 MD<br/>제안 메일을 받았다, 지금 신청 가능한지'<br/>묻는 경우\"| N3_4\nN3_3 -->|\"선승인·거절 수정 요청이면\"| N3_5\nN3_3 -->|\"MD 이름 입력\"| N3_4\nN3_4 --> N9\nN3_5 -->|\"정보 입력\"| HO_T3C\nN2_4 -->|\"입점 거절 후 재신청\"| N4_1\nN2_4 -->|\"퇴점 후 재입점\"| N4_2\nN4_1 --> N9\nN4_2 -->|\"6개월이 지났는데 '이미 입점된 사업자<br/>번호입니다'라고 나와요\"| N4_3\nN4_2 -->|\"퇴점 완료일이 6개월 지났는지 확인하고<br/>싶어요\"| N4_4\nN4_2 -->|\"알겠어요\"| N9\nN4_3 --> N9\nN4_4 -->|\"정보 입력\"| HO_T3C\nN9 -->|\"아니요\"| END\nN9 -->|\"네\"| SWX3\nN2_2_2 --> N2_2_3\nN2_2_3 --> N2_2_4\nN2_3 --> N3_1\nN2_5 --> N2_6\nN2_6 --> N9\nSW_PA006002[/\"「입점 현황」로 전환\"/]:::sw\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nEND([\"상담 종료\"]):::fin\nSWX3[/\"용건 다시 받기 (바뀐<br/>용건의 유형으로 진행)\"/]:::sw", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 입점 관련해 어떤 내용이 궁금하신가요?", "sec": false, "body": []}, {"k": "2-1", "id": "2-1", "t": "오늘의집 입점은 아래 순서로 신청하실 수 있습니다.", "sec": false, "body": ["1) 오로라(https://orora.ohou.se) 접속 후 [오늘의집 입점 신청] 클릭", "2) 사업자등록번호 인증 후 정보 입력, [다음] 클릭 (해외사업자는 '해외사업자입니다.' 체크 후 사업자등록번호와 국가 입력)", "3) 대표 계정부터 상품 정보까지 입력 후 [입점신청 완료] 클릭", "4) 한 달 이내에 대표 계정의 ID(메일)와 휴대폰번호로 입점 결과(승인/보류/거절)가 안내됩니다.", "입점 절차는 입점신청 > 입점심사 > 자료제출 > 자료심사 > 계약체결 > 입점완료 순서로 진행됩니다. 자세한 내용은 오늘의집 입점안내(https://www.partnerbucketplace.com/hc/ko/articles/19259629646361)에서 확인하실 수 있습니다."]}, {"k": "2-1-1", "id": "2-1-1", "t": "판매자샵 로그인 아이디(메일 주소)는 중복으로 사용할 수 없습니다. 다른 판매자샵의 로그인 아이디로 쓰고 있는 메일이라면 다른 메일 주소로 신청해 주세요. → 9", "sec": false, "body": []}, {"k": "2-1-2", "id": "2-1-2", "t": "카테고리별 표준수수료율 공지에서 확인하실 수 있습니다. 카테고리를 잘못 선택해 신청하시면 입점이 거절될 수 있으니 반드시 확인 후 신청해 주세요. → 9", "sec": false, "body": []}, {"k": "2-2", "id": "2-2", "t": "국내 사업자등록증과 통신판매업신고증이 있는 판매자는 누구나 입점 신청하실 수 있습니다.", "sec": false, "body": ["입점 가능 여부를 신청 전에 미리 확인해 드리지는 않습니다. 신청 내역을 기준으로 검토하며, 검토 결과에 따라 입점 여부가 결정됩니다.", "다른 궁금하신 점이 있으신가요?"]}, {"k": "2-2-1", "id": "2-2-1", "t": "입점 전 수수료 협의는 불가합니다. 입점 후 별도 신청을 통해 수수료 협의를 요청하실 수 있으며, 협의 요청 시에도 내부 논의 후 불가할 수 있습니다. → 9", "sec": false, "body": []}, {"k": "2-2-2", "id": "2-2-2", "t": "오늘의집 상품광고는 입점된 업체의 상품을 대상으로 운영되며, 미입점 업체는 상품 판매가 불가하여 입점 후 진행하실 수 있습니다.", "sec": false, "body": ["입점 신청: https://orora.ohou.se/application/license → 9"]}, {"k": "2-2-3", "id": "2-2-3", "t": "오늘의집은 양도양수를 목적으로 계정을 생성하지 않습니다. 양도양수는 이미 입점된 업체에서 양도양수 신청서를 제출하시면 담당 부서에서 처리합니다.", "sec": false, "body": ["- 사업자(계약상 지위) 양도양수 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29540918511641", "- 채권 양도양수 가이드: https://www.partnerbucketplace.com/hc/ko/articles/29541828774681 → 9"]}, {"k": "2-2-4", "id": "2-2-4", "t": "구매안전서비스 이용확인증은 오늘의집에서 자체 발행하지 않습니다. 거래 은행을 통해 발급받으실 수 있습니다. → 9", "sec": false, "body": []}, {"k": "2-3", "id": "2-3", "t": "입점 결과(승인/보류/거절)는 대표 계정의 ID(메일)와 휴대폰번호로 안내됩니다. 거절 안내를 받으셨다면 아래 내용을 참고해 주세요.", "sec": false, "body": ["(1차에는 사업자등록번호로 입점심사 상태를 조회하지 않아 거절 여부를 확인하지 않고 일반 기준만 안내)"]}, {"k": "3-1", "id": "3-1", "t": "입점 거절은 오늘의집 내부 정책에 따라 결정되며, 상세 사유는 안내드리기 어려운 점 양해 부탁드립니다.", "sec": false, "body": ["입점이 거절된 경우 거절 일자로부터 3개월 이후 다시 신청하실 수 있습니다. 기존에 신청하신 내용과 다른 내용이 추가되었을 때 재신청이 가능하며, 재신청 시에도 신규 신청과 동일하게 검토되어 거절될 수 있습니다."]}, {"k": "3-2", "id": "3-2", "t": "말씀하신 내용은 담당 부서 확인이 필요합니다. 사업자등록번호와 거절 일자, 확인을 원하시는 내용을 알려 주시면 상담원이 확인해 드리겠습니다. 확인에 시간이 소요될 수 있는 점 양해 부탁드립니다.", "sec": false, "body": []}, {"k": "3-3", "id": "3-3", "t": "입점 제안을 한 MD의 이름을 알려주시겠어요?", "sec": false, "body": []}, {"k": "3-4", "id": "3-4", "t": "거절 후 3개월 이내 재신청 가능 여부는 입점을 제안한 MD께 직접 문의해 주세요. → 9", "sec": false, "body": []}, {"k": "3-5", "id": "3-5", "t": "말씀하신 내용은 담당 부서 확인이 필요합니다. 사업자등록번호와 함께 제안 MD 이름과 요청 내용(선승인 / 거절 수정)을 알려 주시면 상담원이 확인해 드리겠습니다.", "sec": false, "body": []}, {"k": "2-4", "id": "2-4", "t": "어떤 경우인지 알려주시겠어요?", "sec": false, "body": []}, {"k": "4-1", "id": "4-1", "t": "입점이 거절된 경우 거절 일자로부터 3개월 이후 입점 신청이 가능합니다. 기존 신청 내용과 다른 내용이 추가되었을 때 재신청할 수 있으며, 신규 신청과 동일하게 검토되어 거절될 수 있습니다. → 9", "sec": false, "body": []}, {"k": "4-2", "id": "4-2", "t": "퇴점 완료 후 최소 6개월이 지나야 재입점 신청이 가능합니다. 재입점은 입점 신청이 아닌 셀러샵 추가 신청서로 신청해 주세요.", "sec": false, "body": ["- 셀러샵 추가 신청서: https://dailyhouse.typeform.com/to/gaEgKtCN?typeform-source=www.partnerbucketplace.com", "신청 시 최근 3개월 이내 발급한 사업자등록증을 꼭 첨부해 주세요. 재입점 시 상품은 새로 등록해야 하며, 기존 상품과 리뷰는 이관되지 않습니다."]}, {"k": "4-3", "id": "4-3", "t": "퇴점 후 재입점은 입점 신청이 아닌 셀러샵 추가 신청으로 진행됩니다. 위 셀러샵 추가 신청서 링크로 신청 부탁드립니다. → 9", "sec": false, "body": []}, {"k": "4-4", "id": "4-4", "t": "퇴점 완료일 확인은 담당 부서 확인이 필요합니다. 사업자등록번호를 알려 주시면 상담원이 퇴점 완료일을 확인해 드리겠습니다.", "sec": false, "body": []}, {"k": "2-5", "id": "2-5", "t": "글로벌 서비스는 아래 가이드의 '신청 폼' 링크로 판매 신청서를 제출하실 수 있습니다.", "sec": false, "body": ["- [일반] 오늘의집 글로벌 커머스 미국 서비스 런칭 안내: https://www.partnerbucketplace.com/hc/ko/articles/55637771099673", "검토 결과에 따라 참여가 어려울 수 있는 점 양해 부탁드립니다. 오늘의집 일본 서비스·오늘의집US 관련 상세 문의는 global_op@partnerbucketplace.com 으로 샵명·샵 ID와 함께 [JP 문의] 또는 [US 문의]를 적어 보내 주세요. → 9"]}, {"k": "2-6", "id": "2-6", "t": "인테리어 시공·이사 업체는 파트너센터가 아닌 별도 채널에서 안내하고 있습니다.", "sec": false, "body": ["- 시공/이사(전문가): https://pro.ohou.se/ 의 [자주묻는질문]/[카카오톡 문의하기], 오늘의집 고객센터 1670-0876 (09:00~18:00) 2번", "- 인테리어/생활 O2O(입주청소 등) 사장님센터: https://o2o-partner.ohou.se/intro 에서 별도 가입, 사장님센터 고객센터 1660-4161 (평일 09:00~18:00) → 9"]}, {"k": "9", "id": "9", "t": "더 궁금하신 점이 있으신가요?", "sec": false, "body": []}], "hocond": "거절 사유 상세 확인 요청 T3-C / MD 제안 선승인·거절 수정 요청 T3-C / 퇴점 완료일 확인 T3-C / 공통: 상담원 직접 요청 T1 / 같은 질문 반복·미해결 T2 / 감정·민원 T4 / 복수 용건 T7 / 운영시간 종료 직전 인계 T8", "hoinfo": "(비회원이라 계정 정보 없음) 사업자등록번호, 거절 일자, 요청 내용(사유 상세 / 선승인 / 거절 수정 / 퇴점 완료일 확인), 제안 MD 이름(MD 제안 건)", "kms": "049_예비_파트너.md, 042_시공_서비스__사장님센터.md, 058_셀러샵.md, 047_파트너센터_활용.md, 095_커머스_정책_이관_유형_및_이관_방법.md, 094_영업_리스크팀_이관_유형_및_방법.md, 060_상담_태그별_주요_문의유형_.md", "check": "1) 047_파트너센터_활용: '채팅 상담은 입점 파트너사에 한해 가능, 미입점은 문의등록으로', 예비파트너를 채팅·챗봇으로 받을지 정책 확정 필요 / 2) 비회원 사업자번호 조회 시 본인 확인 수단 없음, 타인 사업자번호로 심사 결과(거절 여부)를 조회할 수 있는 문제, 노출 범위 결정 필요 / 3) 글로벌 안내: 049는 '미국 서비스 가이드' 링크인데 문구는 '일본 서비스 참여가 어려울 수 있다'로 섞여 있음, 현행 문구 확인 필요 / 4) 퇴점 후 재입점 시 퇴점 완료일 6개월 경과 조회 API 없음 / 5) (1차 추가, 10/20 해소) 감정·항의가 강한 예비파트너(T4 해당)도 공통 규칙대로 채팅에서 상담원에게 인계함 / 6) (1차 추가, 10/20 해소) 예비파트너 문의 게시판이 없어져 게시판 링크·진입 경로 확정은 필요 없음 / 7) (1차 추가) 퇴점 완료일 확인은 R-12·R-09 출력 필드에 없어 API 확보 후에도 상담원 인계(T3-C)로 남음 / 8) (1차 추가) 2-5 글로벌 안내의 '샵명·샵 ID'는 예비파트너에게 없을 수 있어 문구 확인 필요 / 9) (10/20 변경) 예비파트너 게시판·이메일 답변 폐지로 채팅에서 인계함. 비회원이라 상담원이 사업자등록번호만으로 본인 여부를 확인해야 함: 신청 정보와 대조할 확인 방법(대표 휴대폰 번호 등) 정의 필요", "api": "R-12", "board": {"guide": "해당 없음: 예비파트너는 비회원이라 게시판에 접수할 수 없음 (10/20 예비파트너 문의등록 양식 폐지). 채팅(4-1)에서 응대", "mode": "해당 없음 (채팅에서 응대)", "segs": [{"c": ["NA"], "t": "해당 없음 (채팅에서 응대)"}], "auto": "-", "ack": "-", "info": "-", "kms": "049_예비_파트너.md, 042_시공_서비스__사장님센터.md, 058_셀러샵.md, 047_파트너센터_활용.md, 095_커머스_정책_이관_유형_및_이관_방법.md, 094_영업_리스크팀_이관_유형_및_방법.md", "check": "(10/20 게시판 폐지로 아래 항목은 채팅 4-1 기준으로 확인)\n1) 글로벌 안내: 049 링크는 '미국 서비스 런칭 안내'인데 본문은 일본 서비스 참여 문구와 섞여 있음 — 현행 문구 확인\n2) 파트너가 '거절됐다'고 적은 내용을 그대로 믿고 거절 안내를 보내는 구조 — 실제로는 보류·심사중일 수 있어 1차 허용 여부 확인\n3) 7~9월 게시판 접수 추정 약 210건으로 거의 전부 게시판(채팅 6%)\n4) 예비파트너 채팅 응대 범위(047 '채팅은 입점 파트너사만')와 맞춰 게시판을 예비파트너 주 채널로 둠"}}, {"code": "PA006002", "draft": false, "name": "입점 현황", "mid": "입점", "vol": "", "mode": "안내 후 조건부 상담원 연결", "utter": "입점 심사 언제 끝나요?\n입점 신청한 지 3주 됐는데 아직 연락이 없어요\n입점 승인 났는데 다음에 뭘 해야 하나요?", "raw": "(전제: 예비파트너는 오로라 계정이 없는 비회원으로 채팅에 들어옴. 샵 자동 식별 없음. 게시판은 로그인 회원만 쓸 수 있어, 예비파트너 문의는 채팅에서 응대하고 개별 확인·처리가 필요하면 사업자등록번호 등 필요한 정보를 받아 상담원에게 인계함 (10/20 변경))\n1. 네, 파트너님. 입점 심사 진행 상황은 오로라에서 보이는 단계에 따라 안내드릴게요. 지금 어느 단계인가요?\n(1차에는 사업자등록번호로 MD입점심사·자료심사 상태를 조회하지 않아 파트너가 고른 단계로 분기)\n[입점 심사중] → 2-1 / [보류] → 2-2 / [자료제출] → 2-3 / [계약] → 2-4 / [계약체결 완료] → 2-5 / [거절 안내를 받았어요] → 입점 문의로 전환 (유형: PA006001, 3-1) / [아직 신청을 안 했어요] → 입점 문의로 전환 (유형: PA006001, 2-1) / [잘 모르겠어요 / 제 신청 상태를 확인해 주세요] → 2-7\n\n2-1. 입점 심사 중인 경우, 입점 신청은 '심사 시작'일로부터 최대 1개월의 검토 기간이 소요되며, 카테고리별 담당 MD가 확인 후 승인/거절 여부를 판단합니다.\n결과는 입점 신청 시 작성하신 메일과 알림톡으로 안내됩니다. 기다리시는 시간이 길게 느껴지실 수 있어 죄송하며, 순차적으로 확인 후 진행될 예정이오니 양해 부탁드립니다.\n[1개월이 지났는데도 결과가 없어요] → 3-1 / [알겠어요] → 9\n\n2-2. 보류 상태인 경우, 보류 또는 대기 상태에서 30일이 지나면 거절 처리됩니다. (예: 신청일로부터 10일 뒤 보류로 전환된 경우, 신청일 + 10일 + 30일 = 40일째에 거절)\n보완이 필요한 사항을 확인하신 후 입점신청서를 수정해 주세요.\n[수정 방법을 알려주세요 / 직접 수정이 안 돼요] → 입점 이슈로 전환 (유형: PA006003)\n[알겠어요] → 9\n\n2-3. 입점이 승인되어 자료제출 단계인 경우, 정보 입력과 서류 제출은 입점 승인일로부터 10일 이내에 완료하시길 권장드립니다.\n상품 판매에 필요한 필수 서류이므로 모든 서류가 준비된 후 한 번에 제출해 주세요. 일부만 제출하시면 서류심사가 진행되지 않습니다.\n[담당자 정보가 수정되지 않아요] → 2-3-1 / [알겠어요] → 9\n2-3-1. 오른쪽의 '대표 계정 정보와 동일' 체크박스가 체크되어 있는지 확인해 주세요. 체크되어 있으면 담당자 정보를 수정할 수 없습니다. → 9\n\n2-4. 자료 승인이 완료되어 계약 단계인 경우, 입점 약관(계약) 동의는 자료 승인 후 3일 이내 서명을 권장드립니다. 기한이 지나도 승인 내역이 파기되지는 않지만, 계약 동의 전까지는 판매 활동이 불가합니다.\n오늘의집 입점 계약은 표준계약서 기반 전자계약으로만 진행되며, 서면 계약은 불가합니다. → 9\n\n2-5. 계약 체결까지 완료되었다면, 계약체결 직후부터 오로라에 로그인하여 바로 상품을 등록하실 수 있습니다.\n계약 내용은 [오로라 > 판매자 정보 > 계약 정보 > 계약 내용]에서 확인하실 수 있습니다. 별도 다운로드나 PDF 파일은 제공되지 않으며, 인쇄(Ctrl+P) 기능으로 인쇄 또는 PDF 저장이 가능합니다. → 9\n\n2-7. 지금은 진행 상황을 바로 확인해 드리기 어렵습니다. 입점 심사 진행 상황은 사업자등록번호와 함께 신청일을 알려 주시면 상담원이 확인해 드리겠습니다.\n[정보 입력] → 상담원 인계 (T3-D)\n\n3-1. 확인이 지연되어 죄송합니다. 심사 기간 관련 확인은 담당 부서 확인이 필요합니다. 사업자등록번호와 함께 신청일을 알려 주시면 상담원이 확인해 드리겠습니다.\n[정보 입력] → 상담원 인계 (T3-D)\n\n(대화 중 [입점 신청을 취소하고 싶어요] → 4-1)\n4-1. 입점 계약 체결 전까지는 오로라 로그인 후 오른쪽 상단 [입점철회] 버튼으로 직접 취소하실 수 있습니다. 철회 후 재신청은 철회일로부터 최소 3개월 이후에 가능하니 신중히 선택해 주세요. → 9\n\n9. 더 궁금하신 점이 있으신가요?\n[아니요] → 상담 종료 (유형: PA006002)\n[네] → 용건 다시 받기 (바뀐 용건의 유형으로 진행)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 입점 심사 진행 상황은<br/>오로라에서 보이는 단계에 따라 안내드릴게요.<br/>지금 어느 단계인가요?\"]:::bot\nN2_1[\"<b>2-1<\/b> 입점 심사 중인 경우, 입점 신청은 '심사<br/>시작'일로부터 최대 1개월의 검토 기간이<br/>소요되며, 카테고리별 담당 MD가 확인 후<br/>승인/거절 여부를 판단합니다.\"]:::bot\nN2_2[\"<b>2-2<\/b> 보류 상태인 경우, 보류 또는 대기 상태에서<br/>30일이 지나면 거절 처리됩니다. (예:<br/>신청일로부터 10일 뒤 보류로 전환된 경우,<  2) 보류 30일 거절 기준의 예시(신청일+10+30)는 보류 전환일 기준인데, 조회 API가 보류 전환일을 내려주는지 확인 필요 / 3) 조회 API가 반환하는 상태값 목록(대기/보류/승인/거절, 자료심사 단계값) 미정, 분기 매핑 확정 필요 / 4) 047 '채팅은 입점 파트너사만' 기준과 예비파트너 챗봇 응대 범위 정합 필요 / 5) (1차 추가, 10/20 변경) 1개월 경과 지연·조회 실패는 사업자등록번호·신청일을 받아 상담원 인계(T3-D), 항의는 공통 규칙(T4)대로 인계함 / 6) (1차 추가) 1차는 파트너가 오로라에서 보이는 단계를 고른다는 전제라, 예비파트너가 오로라에서 단계 화면을 볼 수 있는지 확인 필요(게시판 행 확인 필요 3과 같음) / 7) (1차 추가, 10/20 해소) 예비파트너 문의 게시판이 없어져 게시판 링크·진입 경로 확정은 필요 없음 / 8) (1차 추가) 계약체결 완료 파트너는 이미 입점 파트너라 로그인 후 일반 채팅 대상인지 확인 필요 / 9) (10/20 변경) 예비파트너 게시판·이메일 답변 폐지로 채팅에서 인계함. 비회원이라 상담원이 사업자등록번호만으로 본인 여부를 확인해야 함: 신청 정보와 대조할 확인 방법(대표 휴대폰 번호 등) 정의 필요", "api": "R-12", "board": {"guide": "해당 없음: 예비파트너는 비회원이라 게시판에 접수할 수 없음 (10/20 예비파트너 문의등록 양식 폐지). 채팅(4-1)에서 응대", "mode": "해당 없음 (채팅에서 응대)", "segs": [{"c": ["NA"], "t": "해당 없음 (채팅에서 응대)"}], "auto": "-", "ack": "-", "info": "-", "kms": "049_예비_파트너.md, 069_Admin_어드민_.md, 095_커머스_정책_이관_유형_및_이관_방법.md", "check": "(10/20 게시판 폐지로 아래 항목은 채팅 4-1 기준으로 확인)\n1) 심사 기산일 상충: 049 FAQ '신청일 기준 최대 1개월' vs 049 본문 '심사 시작일로부터 최대 한 달' — AI 1개월 경과 판정 기준이 달라짐\n2) 비회원은 본인 확인 수단이 없어 타인 사업자번호로 심사 결과를 묻는 문제 — 상태 확인 요청은 1차 상담원 배정으로 둠, 상담원 답변 범위도 정해야 함\n3) 예비파트너는 오로라 단계 화면을 볼 수 있다는 전제로 단계 선택을 받음 — 실제로 보이는지 확인"}}, {"code": "PA006003", "draft": false, "name": "입점 이슈", "mid": "입점", "vol": "53", "mode": "안내 후 조건부 상담원 연결", "utter": "입점신청서 주소를 잘못 써서 수정해 주세요\n입점 신청할 때 공동대표 체크를 잘못했어요\n입점신청서에 첨부한 파일을 다시 보내고 싶어요", "raw": "(전제: 예비파트너는 오로라 계정이 없는 비회원으로 채팅에 들어옴. 샵 자동 식별 없음. 게시판은 로그인 회원만 쓸 수 있어, 예비파트너 문의는 채팅에서 응대하고 개별 확인·처리가 필요하면 사업자등록번호 등 필요한 정보를 받아 상담원에게 인계함 (10/20 변경))\n1. 네, 파트너님. 어떤 내용을 수정하고 싶으신가요?\n(1차에는 사업자등록번호로 입점심사 상태를 조회하지 않아 사업자등록번호를 먼저 받지 않음)\n[입점신청서 내용·첨부파일 수정] → 3 / ['공동대표·건강기능식품·의료기기·동물용 의료기기·해외상품 판매' 체크 해제] → 4 / [자료제출 단계 담당자 정보 수정] → 5 / [자료제출·자료심사 서류 관련] → 6 / [MD 제안을 받아 신청했어요] → 7 / [셀러샵명을 바꾸고 싶어요] → 8\n\n3. 입점신청서 수정은 오늘의집에서 도와드립니다. 사업자등록번호와 함께 수정이 필요한 항목, 수정할 내용, 사유를 알려 주시면 상담원이 확인해 드리겠습니다. 수정할 서류가 있다면 채팅에 첨부해 주세요.\n(첨부파일은 입점신청서에 1개만 첨부 가능, 10MB 이하 jpg·jpeg·png·pdf·zip)\n정보를 수정하시면 심사 순서가 후순위로 재배치되어 일정이 추가로 소요될 수 있는 점 참고 부탁드립니다.\n(1차에는 단계 조회가 없어 '보류 상태 직접 수정' 안내(원 시나리오 3-1)는 쓰지 않음. 확인 필요 1 결정 후 추가)\n[정보 입력] → 상담원 인계 (T3-A)\n\n4. 체크 해제가 필요한 항목을 선택해 주세요.\n[공동대표] → 4-1 / [건강기능식품 판매] [의료기기 판매] [동물용 의료기기 판매] [해외상품 판매] → 4-2\n4-1. 사업자등록증상 대표 표기가 어떻게 되어 있나요?\n[단독대표] [각자대표] [공동대표]\n(각자대표는 공동대표가 아님 → '공동대표 입니다.' 체크 해제 대상 → 4-2)\n([공동대표] 선택 시 → 체크 해제 불필요 안내 후 9)\n4-2. 문의하신 입점신청서 내 [선택 항목] 체크 해제는 파트너님이 직접 수정하실 수 없는 영역으로, 담당 부서에서 수정할 수 있도록 전달드리겠습니다. 이후 자료심사 과정에서 해당 자료에 대한 추가 요청은 발생하지 않을 예정입니다.\n빠른 검토를 위해 '제출하기'로 재심사를 요청해 주시면 [선택 항목] 여부와 관계없이 절차가 진행될 수 있도록 도와드리겠습니다.\n(안내 시 [선택 항목]에는 파트너가 요청한 항목만 넣음)\n사업자등록번호와 함께 체크 해제할 항목과 사업자등록증상 대표 표기를 알려 주시면 상담원이 확인해 드리겠습니다.\n[정보 입력] → 상담원 인계 (T3-C)\n\n5. 오른쪽의 '대표 계정 정보와 동일' 체크박스가 체크되어 있는지 확인해 주세요. 체크되어 있으면 담당자 정보를 수정할 수 없으니 체크를 해제한 뒤 수정해 주세요.\n[해결됐어요] → 9 / [그래도 안 돼요] → 5-1\n5-1. 사업자등록번호를 알려 주시고 화면 캡처를 채팅에 첨부해 주시면 상담원이 확인해 드리겠습니다.\n[정보 입력] → 상담원 인계 (T3-B)\n\n6. 상품 판매에 필요한 필수 서류이므로 모든 서류가 준비된 후 제출해 주세요. 모든 서류가 있어야 서류심사가 가능합니다.\n[이미 제출한 서류를 고치거나, 자료심사 결과를 확인하고 싶어요] → 6-1 / [알겠어요] → 9\n6-1. 자료심사 이후 자료제출 관련 내용은 담당 부서 확인이 필요합니다. 사업자등록번호와 함께 수정할 서류와 내용을 알려 주시고, 서류를 채팅에 첨부해 주시면 상담원이 확인해 드리겠습니다.\n[정보 입력] → 상담원 인계 (T3-C)\n\n7. 입점을 제안받아 신청하신 건은 담당 부서 확인이 필요합니다. 사업자등록번호와 함께 입점을 제안한 MD의 이름과 요청하실 내용을 알려 주시면 상담원이 확인해 드리겠습니다.\n[정보 입력] → 상담원 인계 (T3-C)\n\n8. 셀러샵명 운영 기준에 맞지 않는 셀러샵명은 임의로 수정될 수 있습니다. 아래 가이드를 확인하시어 셀러샵명 변경을 요청해 주세요.\n- [오로라] 셀러샵 이용 가이드: https://www.partnerbucketplace.com/hc/ko/articles/25553199736345\n(입점 완료 후 셀러샵명 변경이면 → 단순 정보변경으로 전환 (유형: PA009001)) → 9\n\n9. 더 궁금하신 점이 있으신가요?\n[아니요] → 상담 종료 (유형: PA006003)\n[네] → 용건 다시 받기 (바뀐 용건의 유형으로 진행)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 어떤 내용을 수정하고<br/>싶으신가요?\"]:::bot\nN3[\"<b>3<\/b> 입점신청서 수정은 오늘의집에서 도와드립니다.<br/>사업자등록번호와 함께 수정이 필요한 항목,<br/>수정할 내용, 사유를 알려 주시면 상담원이<br/>확인해 드리겠습니다. 수정할 서류가 있다면<br/>채팅에 첨부해 주세요.\"]:::bot\nN4[\"<b>4<\/b> 체크 해제가 필요한 항목을 선택해 주세요.\"]:::bot\nN4_1[\"<b>4-1<\/b> 사업자등록증상 대표 표기가 어떻게 되어<br/>있나요?\"]:::bot\nN4_2[\"<b>4-2<\/b> 저 받지 않음)"]}, {"k": "3", "id": "3", "t": "입점신청서 수정은 오늘의집에서 도와드립니다. 사업자등록번호와 함께 수정이 필요한 항목, 수정할 내용, 사유를 알려 주시면 상담원이 확인해 드리겠습니다. 수정할 서류가 있다면 채팅에 첨부해 주세요.", "sec": false, "body": ["(첨부파일은 입점신청서에 1개만 첨부 가능, 10MB 이하 jpg·jpeg·png·pdf·zip)", "정보를 수정하시면 심사 순서가 후순위로 재배치되어 일정이 추가로 소요될 수 있는 점 참고 부탁드립니다.", "(1차에는 단계 조회가 없어 '보류 상태 직접 수정' 안내(원 시나리오 3-1)는 쓰지 않음. 확인 필요 1 결정 후 추가)"]}, {"k": "4", "id": "4", "t": "체크 해제가 필요한 항목을 선택해 주세요.", "sec": false, "body": []}, {"k": "4-1", "id": "4-1", "t": "사업자등록증상 대표 표기가 어떻게 되어 있나요?", "sec": false, "body": []}, {"k": "4-2", "id": "4-2", "t": "문의하신 입점신청서 내", "sec": false, "body": ["빠른 검토를 위해 '제출하기'로 재심사를 요청해 주시면 [선택 항목] 여부와 관계없이 절차가 진행될 수 있도록 도와드리겠습니다.", "(안내 시 [선택 항목]에는 파트너가 요청한 항목만 넣음)", "사업자등록번호와 함께 체크 해제할 항목과 사업자등록증상 대표 표기를 알려 주시면 상담원이 확인해 드리겠습니다."]}, {"k": "5", "id": "5", "t": "오른쪽의 '대표 계정 정보와 동일' 체크박스가 체크되어 있는지 확인해 주세요. 체크되어 있으면 담당자 정보를 수정할 수 없으니 체크를 해제한 뒤 수정해 주세요.", "sec": false, "body": []}, {"k": "5-1", "id": "5-1", "t": "사업자등록번호를 알려 주시고 화면 캡처를 채팅에 첨부해 주시면 상담원이 확인해 드리겠습니다.", "sec": false, "body": []}, {"k": "6", "id": "6", "t": "상품 판매에 필요한 필수 서류이므로 모든 서류가 준비된 후 제출해 주세요. 모든 서류가 있어야 서류심사가 가능합니다.", "sec": false, "body": []}, {"k": "6-1", "id": "6-1", "t": "자료심사 이후 자료제출 관련 내용은 담당 부서 확인이 필요합니다. 사업자등록번호와 함께 수정할 서류와 내용을 알려 주시고, 서류를 채팅에 첨부해 주시면 상담원이 확인해 드리겠습니다.", "sec": false, "body": []}, {"k": "7", "id": "7", "t": "입점을 제안받아 신청하신 건은 담당 부서 확인이 필요합니다. 사업자등록번호와 함께 입점을 제안한 MD의 이름과 요청하실 내용을 알려 주시면 상담원이 확인해 드리겠습니다.", "sec": false, "body": []}, {"k": "8", "id": "8", "t": "셀러샵명 운영 기준에 맞지 않는 셀러샵명은 임의로 수정될 수 있습니다. 아래 가이드를 확인하시어 셀러샵명 변경을 요청해 주세요.", "sec": false, "body": ["- [오로라] 셀러샵 이용 가이드: https://www.partnerbucketplace.com/hc/ko/articles/25553199736345"]}, {"k": "9", "id": "9", "t": "더 궁금하신 점이 있으신가요?", "sec": false, "body": []}], "hocond": "신청서 내용·첨부파일 수정 T3-A / 체크 해제 T3-C / 자료심사 이후 서류 수정·결과 확인 T3-C / MD 제안 건 T3-C / 담당자 정보 체크박스로 해결 안 됨 T3-B / 오로라에 로그인한 입점 파트너의 셀러샵명 변경은 PA009001로 전환 / 공통: 상담원 직접 요청 T1 / 같은 질문 반복·미해결 T2 / 감정·민원 T4 / 복수 용건 T7 / 운영시간 종료 직  7\n\n2. 브랜드홈은 상품 등록 시 입력한 브랜드명으로 생성되며, 해당 브랜드의 판매중 상품이 8개 이상일 때 검색에 노출됩니다. 판매정지 상품은 개수에 포함되지 않습니다. 오로라에서 해당 브랜드의 판매중 상품 수를 확인해 주세요.\n(1차에는 브랜드별 판매중 상품 수 조회가 없어 기준 안내 후 파트너가 확인한 상품 수로 분기)\n[기준 이상인데도 안 보여요] → 2-1 / [기준보다 적어요] → 2-2 / [브랜드홈을 새로 만들거나 없애고 싶어요] → 2-4 / [다른 브랜드 상품·소식이 섞여 보여요] → 2-5 / [알겠어요] → 9\n2-1. 동일한 브랜드명을 쓰는 브랜드가 여럿 있으면 일반적으로 상품 수가 많은 브랜드 하나만 노출되며, 별도 수기 노출 처리는 불가합니다. 일시품절 상품은 오늘의집 검색에는 노출되어도 브랜드홈에는 노출되지 않을 수 있고, 모음전은 브랜드홈에 노출되지 않습니다.\n[그래도 안 보여요] → 2-8 / [다른 업체가 같은 브랜드명으로 상품을 올렸어요] → 2-7 / [알겠어요] → 9\n2-2. 브랜드홈은 해당 브랜드의 판매중 상품이 8개 이상일 때 검색에 노출되어, 판매중 상품이 기준보다 적으면 노출되지 않습니다. 판매정지 상품은 개수에 포함되지 않습니다. → 9\n2-4. 브랜드홈 자체를 따로 추가하거나 삭제할 수는 없으며, 상품에 등록된 브랜드명을 기준으로 생성·삭제됩니다.\n- 새 브랜드홈이 필요하면: 상품 일부를 새 브랜드명으로 수정하거나, 새 상품 등록 시 새 브랜드로 설정\n- 브랜드홈을 없애려면: 해당 브랜드명으로 등록된 상품을 다른 브랜드명으로 변경 → 9\n2-5. 어떤 경우인지 알려주시겠어요?\n[관련 없는 다른 브랜드의 소식·상품이 보여요] → 2-6 / [다른 업체가 같은 브랜드명으로 상품을 올렸어요] → 2-7\n2-6. 확인이 필요한 화면 캡처를 첨부해 주시면 담당 부서 확인을 위해 상담원에게 연결해 드리겠습니다.\n[캡처 첨부] → 상담원 인계 (T3-C)\n2-7. 해당 브랜드의 상표권 등 독점적 권리를 보유하고 계신가요?\n[네] → 안전거래센터(파트너센터 홈페이지 맨 하단 [안전거래센터 바로가기])에서 지식재산권 신고를 접수해 주세요. → 9\n[아니요] → 브랜드홈은 같은 브랜드로 설정되면 샵과 관계없이 함께 노출됩니다. 상품의 브랜드 설정 권한은 각 파트너사에 있어 오늘의집에서 임의로 변경할 수 없으며, 노출을 원하지 않으시면 해당 업체와 조율이 필요합니다. → 9\n2-8. 상담원이 브랜드홈 노출 상태를 확인해 드릴게요. 확인하실 브랜드명(또는 해당 브랜드로 등록한 상품번호)과 확인하신 판매중 상품 수를 알려주시겠어요?\n[브랜드명 또는 상품번호, 상품 수 입력]\n→ 상담원 인계 (T3-D)\n\n3. 브랜드홈의 로고·커버이미지·소개글은 아래 가이드 하단의 [브랜드홈 변경 신청서 바로가기]로 신청하실 수 있습니다.\n- [정책] 브랜드홈 변경 가이드: https://www.partnerbucketplace.com/hc/ko/articles/47359666845593\n신청 후 5영업일 이내 적용되며, 처리 결과는 신청 시 적어주신 메일로 안내됩니다. 중복 신청 시 마지막 신청 건으로 반영됩니다. 다른 파트너사의 상품이 같은 브랜드홈에 함께 노출되고 있으면 수정이 불가합니다.\n- 로고: SVG 파일만 가능, 배경을 제거한 이미지만 가능, 최소 20px 이상. 브랜드홈 커버에서는 흰색 글자로 표시되므로 흰색 로고는 검정색으로 바꿔 신청해 주세요. 상세페이지의 작은 로고는 등록한 색상 그대로 표시됩니다.\n- 커버이미지: 400×300 권장, JPG·PNG만 가능(SVG 불가). 로고가 들어간 커버이미지에는 로고를 따로 등록할 수 없어, 로고 포함 커버이미지만 등록하거나 로고 없는 커버이미지 + 로고 파일 중 하나로 신청해 주세요. 흰색 배경이면 로고가 보이지 않을 수 있습니다.\n- 소개글: 공백·줄바꿈 포함 최대 240자, shift+숫자키로 입력 가능한 특수문자만 가능, 최저가·1위·best·최고 등 배타적 표현과 타 브랜드를 연상시키는 표현 불가\n[로고가 흰색 네모로 보여요] → 3-1 / [이 로고로 등록 가능한지 봐주세요] → 3-2 / [MD's Pick 등 다른 영역을 설정하고 싶어요] → 3-3 / [알겠어요] → 9\n3-1. 로고가 배경 없는(누끼) 형식이 아니고 흰색 배경이 있는 파일이라 생긴 현상입니다. 브랜드홈에서 로고는 흰색 글자로 표시되어 흰 배경과 겹치면 흰색 네모로 보일 수 있습니다. 로고가 누끼 형식이어도 커버이미지가 흰색이면 정상 노출되지 않을 수 있으니, 배경을 제거한 SVG 로고로 다시 신청해 주세요. → 9\n3-2. 확인하실 로고 이미지 파일을 첨부해 주세요. 등록 가능 여부 확인을 위해 상담원에게 연결해 드리겠습니다.\n[파일 첨부] → 상담원 인계 (T3-B)\n3-3. 담당 MD가 있는 경우 담당 MD께 문의해 주세요. 담당 MD가 없는 경우 현재 파트너센터에서 적용이 어려운 점 양해 부탁드립니다. → 9\n\n4. 브랜드명 수정은 브랜드홈 이름을 바꾸는 방식이 아니라 상품에 등록된 브랜드명을 상품 단위로 수정하는 방식입니다. 먼저 아래 기준을 확인해 주세요.\n- 공백 포함 최대 15자, 셀러샵명과 동일하게 설정 불가\n- 영문명과 한글명 동의어를 함께 적는 것은 불가 (한 가지로 요청)\n- 맞춤법·외래어 표기법 준수, 최저가·1위·best·최고 등 배타적 표현과 타 브랜드 연상 표현 불가\n- 상세페이지에 변경 전 브랜드명이 있으면 먼저 수정하고, 변경할 브랜드의 상품임을 알 수 있는 배너·문구가 있어야 합니다.\n4-1. 수정할 상품번호, 현재 브랜드명, 변경할 브랜드명을 알려주시겠어요?\n[상품번호, 기존 브랜드명, 변경 브랜드명 입력]\n4-2. 상세페이지에 변경할 브랜드의 상품임을 알 수 있는 배너나 문구가 있나요?\n[네] → 4-3\n[아니요] → 아래 자료 중 한 가지를 첨부해 주세요. 1) 브랜드 권리 보유 증빙(상표등록증 등) 2) 브랜드 사용 허가 관련 계약서 3) 정품 유통 증빙 서류 [파일 첨부] → 4-3\n4-3. 브랜드명 수정은 담당 부서에서 처리합니다. 접수를 위해 상담원에게 연결해 드리겠습니다.\n(모음전 브랜드명 수정이면 → \"모음전 브랜드명은 수정되지 않아 기존 모음전을 삭제한 후 새로 신청해 주셔야 합니다.\" 안내 후 9)\n(참고 안내: 브랜드명을 바꿔도 상품 스크랩 수는 유지되며, 기존 브랜드홈의 스크랩 수는 새 브랜드홈으로 넘어가지 않습니다.)\n→ 상담원 인계 (T3-C)\n\n5. 셀러샵은 1개 사업자당 최대 5개까지 운영할 수 있으며, 입점 시 1개가 기본 생성됩니다. 추가는 아래 발급 조건에 해당하는 경우에만 신청할 수 있고, 내부 검수에서 반려될 수 있습니다.\n- 발급 가능: 브랜드별 사용 / 정산계좌별 사용 / 관리부서별·사업유형별 사용(담당 MD와 협의 후 신청) / 렌탈 카테고리 / 재입점(퇴점 6개월 이후)\n- 발급 불가: 카테고리별 사용 / 담당 MD별 사용 / 중복상품 등록(동일 브랜드·동일 카테고리를 두 개 이상 샵에서 판매) / 출고지·반품교환지가 다른 경우 / 배송유형이 다른 경우(일반택배/화물택배, 일반택배/냉장 등)\n가능 조건과 불가 조건이 동시에 해당하면 가능 조건이 우선 적용됩니다.\n[신청 방법] → 5-1 / [신청했는데 결과가 안 와요] → 5-2 / [반려됐어요] → 5-3\n5-1. [셀러샵 추가 신청서]로 신청해 주세요.\n- 필요서류: 사업자등록증(재입점은 최근 3개월 이내 발급본 필수), 통장사본\n- 발급까지 최대 5영업일 소요, 결과는 메일로 안내\n- 인증번호 수령 등으로 요청 담당자와 전화 통화가 진행되니 '요청 담당자 연락처'에 통화 가능한 휴대폰 번호를 적어 주세요.\n- 한번 발급된 셀러샵은 삭제할 수 없으며, 기존 셀러샵의 상품·리뷰는 추가 셀러샵으로 이관되지 않습니다.\n- 브랜드별로 정산계좌가 달라 추가하시는 경우 '정산 계좌별 사용'으로 선택해 주세요.\n가이드: https://www.partnerbucketplace.com/hc/ko/articles/25553199736345 → 9\n5-2. 셀러샵 추가는 신청일로부터 최대 5영업일 이내 검토 후 결과 메일을 보내드립니다. 스팸함을 포함해 메일을 확인해 주세요.\n(파트너가 진행 상황 확인을 원하거나 5영업일이 지났으면 → 신청일 확인 후 상담원 인계 (T3-C))\n5-3. 셀러샵 추가 결과는 담당 부서의 내부 결정에 따르며, 반려 사유는 신청 시 적어주신 메일로 안내드리고 있습니다. 메일(스팸함 포함)을 확인해 주세요.\n'신규 브랜드 상품 확인 안 됨' 사유로 반려된 경우, 판매하실 신규 브랜드 상품을 확인할 수 있는 링크를 첨부해 신청서를 다시 보내 주세요.\n[사유를 더 자세히 알고 싶어요] → 5-4 / [알겠어요] → 9\n5-4. 상세 사유 확인은 담당 부서 확인이 필요해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)\n\n6. 어떤 상황인지 알려주시겠어요?\n[처음 로그인하는데 안 돼요] → 6-1 / [인증번호가 안 와요] → 6-2 / [로그인 아이디(메일)를 모르겠어요] → 6-3 / [대표 계정 담당자가 퇴사해서 로그인을 못 해요] → 6-4\n(1차에는 셀러샵 계정·퇴점 여부 조회가 없음. 파트너가 퇴점한 셀러샵이라고 하면 → \"퇴점이 완료된 셀러샵은 판매자 시스템 접속이 불가합니다.\" 안내 후 9)\n6-1. 오로라 최초 로그인 시에는 비밀번호를 1회 초기화(비밀번호 변경)한 뒤 로그인해 주세요. 셀러샵 추가 후 첫 로그인은 신청서에 적으신 요청 담당자 메일로 받은 임시 비밀번호로 로그인한 뒤 비밀번호를 수정해 주세요.\n[그래도 안 돼요] → 상담원 인계 (T3-B) / [해결됐어요] → 9\n6-2. 인증번호 유효시간은 3분입니다. 아래 순서로 다시 시도해 주세요.\n1) 스팸메일함과 수신 거부 설정 확인\n2) 쿠키·캐시 삭제\n3) 구글 크롬 시크릿 창에서 재시도\n4) 다른 PC에서 재시도\n메일 도메인 서버 사정으로 인증메일이 늦게 올 수 있으니, 이 경우 휴대폰 인증으로 로그인해 주세요.\n[메일·휴대폰 모두 안 와요] → 6-2-1 / [로그인한 아이디 메일을 지금은 안 써요] → 6-4 / [해결됐어요] → 9\n6-2-1. 확인을 위해 상담원에게 연결해 드리겠습니다. 시도하신 로그인 아이디를 알려주세요.\n[아이디 입력] → 상담원 인계 (T3-C)\n6-3. 로그인 화면의 '비밀번호를 잊으셨나요?'로 비밀번호를 재설정해 주세요.\n[아이디 자체를 모르겠어요] → 6-3-1 / [해결됐어요] → 9\n6-3-1. 상담원이 셀러샵에 등록된 로그인 아이디를 확인해 드릴게요. 셀러샵명(또는 샵 번호)과 연락 가능한 담당자 연락처를 알려주시겠어요?\n[셀러샵명·연락처 입력]\n→ 상담원 인계 (T3-D)\n6-4. 대표 계정 변경은 대표 계정 소유자 또는 대표자 확인이 필요해 상담원에게 연결해 드리겠습니다. 연락 가능한 대표자 또는 담당자 연락처를 알려주세요.\n[연락처 입력] → 상담원 인계 (T3-B)\n\n7. 원하시는 작업을 선택해 주세요.\n[관리 계정 추가] → 7-1 / [대표 계정 변경] → 7-2 / [로그인 아이디(메일) 변경] → 7-3 / [인증수단 추가] → 7-4 / [샵 번호 확인] → 7-5\n7-1. [오로라 > 판매자 정보 > 계정 정보 > 관리계정]에서 [추가 계정 만들기]를 눌러 계정을 추가하실 수 있습니다. 셀러샵에 추가된 담당자만 해당 셀러샵을 이용할 수 있습니다.\n[메일 주소가 하이픈(-)으로 끝나서 등록이 안 돼요] → 7-1-1 / [완료] → 9\n7-1-1. 현재 로그인 ID 메일 주소가 하이픈(-)으로 끝나면 올바르지 않은 이메일 형식으로 처리되어 등록되지 않습니다. 개선 전까지는 다른 메일 주소로 등록해 주세요. → 9\n7-2. 대표 계정으로 로그인한 뒤 [오로라 > 판매자 정보 > 계정 정보 > 관리계정]에서 [대표 계정 변경]을 눌러 변경하실 수 있습니다. 해당 셀러샵에 관리계정으로 등록된 담당자 중에서만 대표 계정으로 지정할 수 있으니, 새 담당자라면 먼저 [추가 계정 만들기]로 계정을 만든 뒤 지정해 주세요.\n[대표 계정으로 로그인을 못 해요] → 6-4 / [완료] → 9\n7-3. 로그인 아이디는 직접 바꾸는 대신 아래처럼 진행해 주세요.\n1) [판매자정보 > 계정 정보 > 관리 계정 > 추가 계정 만들기]에서 바꾸고 싶은 메일로 계정 만들기\n2) [판매자정보 > 계정 정보 > 관리 계정] on/off 열에서 기존 계정을 off\n기존 계정이 대표 계정이라 off가 안 되면 [대표 계정 변경]으로 새 계정을 대표로 바꾼 뒤 off 해 주세요. → 9\n7-4. 계정별 메일·휴대폰번호가 인증수단으로 등록되므로, 인증수단을 늘리려면 [오로라 > 판매자 정보 > 계정 정보 > 관리계정 > 추가 계정 만들기]로 계정을 추가해 주세요. → 9\n7-5. [오로라 > 판매자정보 > 판매자정보 > 셀러샵 > 샵명]에서 셀러샵 번호(ID)를 확인하실 수 있습니다. 대표 계정 또는 관리 계정으로 등록된 셀러샵끼리는 샵 간 전환해서 이용하실 수 있습니다. → 9\n\n(담당자 정보·고객센터 정보·셀러샵명 변경 문의 → 단순 정보변경으로 전환 (유형: PA009001))\n(오로라 화면 오류 → 스토어관리 이슈로 전환 (유형: PA007002))\n(시스템 불편·불만 표현 → \"말씀해 주신 내용은 담당 부서로 전달하겠습니다.\" 후 상담원 인계 (T4))\n\n9. 더 궁금하신 점이 있으신가요?\n[아니요] → 상담 종료 (유형: PA007001)\n[네] → 용건 다시 받기 (바뀐 용건의 유형으로 진행)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 어떤 내용이 궁금하신가요?\"]:::bot\nN2[\"<b>2<\/b> 브랜드홈은 상품 등록 시 입력한 브랜드명으로<br/>생성되며, 해당 브랜드의 판매중 상품이 8개<br/>이상일 때 검색에 노출됩니다. 판매정지<br/>상품은 개수에 포함되지 않습니다. 오로라에서<br/>해당 브랜드의 판매중 상품 수를 확인해<br/>주세요.\"]:::bot\nN2_1[\"<b>2-1<\/b> 동일한 브랜드명을 쓰는 브랜드가 여럿 있으면<br/>일반적으로 상품 수가 많은 브랜드 하나만<br/>노출되며, 별도 수기 노출 처리는<br/>불가합니다. 일시품절 상품은 오늘의집<br/>검색에는 노출되어도 브랜드홈에는 노출되지<br/>않을 수 있고, 모음전은 브랜드홈에 노출되지<br/>않습니다.\"]:::bot\nN2_2[\"<b>2-2<\/b> 브랜드홈은 해당 브랜드의 판매중 상품이 8개<br/>이상일 때 검색에 노출되어, 판매중 상품이<br/>기준보다 적으면 노출되지 않습니다. 판매정지<br/>상품은 개수에 포함되지 않습니다.\"]:::bot\nN2_4[\"<b>2-4<\/b> 브랜드홈 자체를 따로 추가하거나 삭제할 수는<br/>없으며, 상품에 등록된 브랜드명을 기준으로<br/>생성·삭제됩니다.\"]:::bot\nN2_5[\"<b>2-5<\/b> 어떤 경우인지 알려주시겠어요?\"]:::bot\nN2_6[\"<b>2-6<\/b> 확인이 필요한 화면 캡처를 첨부해 주시면<br/>담당 부서 확인을 위해 상담원에게 연결해<br/>드리겠습니다.\"]:::bot\nN2_7[\"<b>2-7<\/b> 해당 브랜드의 상표권 등 독점적 권리를<br/>보유하고 계신가요?\"]:::bot\nN2_8[\"<b>2-8<\/b> 상담원이 브랜드홈 노출 상태를 확인해<br/>드릴게요. 확인하실 브랜드명(또는 해당<br/>브랜드로 등록한 상품번호)과 확인하신 판매중<br/>상품 수를 알려주시겠어요?\"]:::bot\nN3[\"<b>3<\/b> 브랜드홈의 로고·커버이미지·소개글은 아래<br/>가이드 하단의\"]:::bot\nN3_1[\"<b>3-1<\/b> 로고가 배경 없는(누끼) 형식이 아니고 흰색<br/>배경이 있는 파일이라 생긴 현상입니다.<br/>브랜드홈에서 로고는 흰색 글자로 표시되어 흰<br/>배경과 겹치면 흰색 네모로 보일 수<br/>있습니다. 로고가 누끼 형식이어도<br/>커버이미지가 흰색이면 정상 노출되지 않을 수<br/>있으니, 배경을 제거한 SVG 로고로 다시<br/>신청해 주세요.\"]:::bot\nN3_2[\"<b>3-2<\/b> 확인하실 로고 이미지 파일을 첨부해 주세요.<br/>등록 가능 여부 확인을 위해 상담원에게<br/>연결해 드리겠습니다.\"]:::bot\nN3_3[\"<b>3-3<\/b> 담당 MD가 있는 경우 담당 MD께 문의해<br/>주세요. 담당 MD가 없는 경우 현재<br/>파트너센터에서 적용이 어려운 점 양해<br/>부탁드립니다.\"]:::bot\nN4[\"<b>4<\/b> 브랜드명 수정은 브랜드홈 이름을 바꾸는<br/>방식이 아니라 상품에 등록된 브랜드명을 상품<br/>단위로 수정하는 방식입니다. 먼저 아래<br/>기준을 확인해 주세요.\"]:::bot\nN4_1[\"<b>4-1<\/b> 수정할 상품번호, 현재 브랜드명, 변경할<br/>브랜드명을 알려주시겠어요?\"]:::bot\nN4_2[\"<b>4-2<\/b> 상세페이지에 변경할 브랜드의 상품임을 알 수<br/>있는 배너나 문구가 있나요?\"]:::bot\nN4_3[\"<b>4-3<\/b> 브랜드명 수정은 담당 부서에서 처리합니다.<br/>접수를 위해 상담원에게 연결해 드리겠습니다.\"]:::bot\nN5[\"<b>5<\/b> 셀러샵은 1개 사업자당 최대 5개까지 운영할<br/>수 있으며, 입점 시 1개가 기본<br/>생성됩니다. 추가는 아래 발급 조건에<br/>해당하는 경우에만 신청할 수 있고, 내부<br/>검수에서 반려될 수 있습니다.\"]:::bot\nN5_1{{\"셀러샵 추가 신청서\"}}:::sec\nN5_1_5_2[\"<b>5-2<\/b> 셀러샵 추가는 신청일로부터 최대 5영업일<br/>이내 검토 후 결과 메일을 보내드립니다.<br/>스팸함을 포함해 메일을 확인해 주세요.\"]:::bot\nN5_1_5_3[\"<b>5-3<\/b> 셀러샵 추가 결과는 담당 부서의 내부 결정에<br/>따르며, 반려 사유는 신청 시 적어주신<br/>메일로 안내드리고 있습니다. 메일(스팸함<br/>포함)을 확인해 주세요.\"]:::bot\nN5_1_5_4[\"<b>5-4<\/b> 상세 사유 확인은 담당 부서 확인이 필요해<br/>상담원에게 연결해 드리겠습니다.\"]:::bot\nN5_1_6[\"<b>6<\/b> 어떤 상황인지 알려주시겠어요?\"]:::bot\nN5_1_6_1[\"<b>6-1<\/b> 오로라 최초 로그인 시에는 비밀번호를 1회<br/>초기화(비밀번호 변경)한 뒤 로그인해<br/>주세요. 셀러샵 추가 후 첫 로그인은<br/>신청서에 적으신 요청 담당자 메일로 받은<br/>임시 비밀번호로 로그인한 뒤 비밀번호를<br/>수정해 주세요.\"]:::bot\nN5_1_6_2[\"<b>6-2<\/b> 인증번호 유효시간은 3분입니다. 아래 순서로<br/>다시 시도해 주세요.\"]:::bot\nN5_1_6_2_1[\"<b>6-2-1<\/b> 확인을 위해 상담원에게 연결해 드리겠습니다.<br/>시도하신 로그인 아이디를 알려주세요.\"]:::bot\nN5_1_6_3[\"<b>6-3<\/b> 로그인 화면의 '비밀번호를 잊으셨나요?'로<br/>비밀번호를 재설정해 주세요.\"]:::bot\nN5_1_6_3_1[\"<b>6-3-1<\/b> 상담원이 셀러샵에 등록된 로그인 아이디를<br/>확인해 드릴게요. 셀러샵명(또는 샵 번호)과<br/>연락 가능한 담당자 연락처를 알려주시겠어요?\"]:::bot\nN5_1_6_4[\"<b>6-4<\/b> 대표 계정 변경은 대표 계정 소유자 또는<br/>대표자 확인이 필요해 상담원에게 연결해<br/>드리겠습니다. 연락 가능한 대표자 또는<br/>담당자 연락처를 알려주세요.\"]:::bot\nN5_1_7[\"<b>7<\/b> 원하시는 작업을 선택해 주세요.\"]:::bot\nN7_1{{\"오로라 › 판매자 정보 ›<br/>계정 정보 › 관리계정\"}}:::sec\nN7_1_7_1_1[\"<b>7-1-1<\/b> 현재 로그인 ID 메일 주소가<br/>하이픈(-)으로 끝나면 올바르지 않은 이메일<br/>형식으로 처리되어 등록되지 않습니다. 개선<br/>전까지는 다른 메일 주소로 등록해 주세요.\"]:::bot\nN7_1_7_2[\"<b>7-2<\/b> 대표 계정으로 로그인한 뒤\"]:::bot\nN7_1_7_3[\"<b>7-3<\/b> 로그인 아이디는 직접 바꾸는 대신 아래처럼<br/>진행해 주세요.\"]:::bot\nN7_1_7_4[\"<b>7-4<\/b> 계정별 메일·휴대폰번호가 인증수단으로<br/>등록되므로, 인증수단을 늘리려면\"]:::bot\nN7_5{{\"오로라 › 판매자정보 ›<br/>판매자정보 › 셀러샵 ›<br/>샵명\"}}:::sec\nN7_5_9[\"<b>9<\/b> 더 궁금하신 점이 있으신가요?\"]:::bot\nS --> N1\nN1 -->|\"브랜드홈 노출·생성\"| N2\nN1 -->|\"브랜드홈 로고·커버이미지·소개글 변경\"| N3\nN1 -->|\"브랜드명 수정\"| N4\nN1 -->|\"셀러샵 추가\"| N5\nN1 -->|\"오로라 로그인·인증번호\"| N5_1_6\nN1 -->|\"계정 추가·대표 계정 변경·아이디 변경\"| N5_1_7\nN2 -->|\"기준 이상인데도 안 보여요\"| N2_1\nN2 -->|\"기준보다 적어요\"| N2_2\nN2 -->|\"브랜드홈을 새로 만들거나 없애고 싶어요\"| N2_4\nN2 -->|\"다른 브랜드 상품·소식이 섞여 보여요\"| N2_5\nN2 -->|\"알겠어요\"| N7_5_9\nN2_1 -->|\"그래도 안 보여요\"| N2_8\nN2_1 -->|\"다른 업체가 같은 브랜드명으로 상품을<br/>올렸어요\"| N2_7\nN2_1 -->|\"알겠어요\"| N7_5_9\nN2_2 --> N7_5_9\nN2_5 -->|\"관련 없는 다른 브랜드의 소식·상품이 보여요\"| N2_6\nN2_5 -->|\"다른 업체가 같은 브랜드명으로 상품을<br/>올렸어요\"| N2_7\nN2_6 -->|\"캡처 첨부\"| HO_T3C\nN2_7 -->|\"네\"| TX1\nN2_7 -->|\"아니요\"| TX2\nN2_8 --> HO_T3D\nN2_8 -->|\"브랜드명 또는 상품번호, 상품 수 입력\"| N3\nN3 -->|\"로고가 흰색 네모로 보여요\"| N3_1\nN3 -->|\"이 로고로 등록 가능한지 봐주세요\"| N3_2\nN3 -->|\"MD's Pick 등 다른 영역을 설정하고<br/>싶어요\"| N3_3\nN3 -->|\"알겠어요\"| N7_5_9\nN3_1 --> N7_5_9\nN3_2 -->|\"파일 첨부\"| HO_T3B\nN3_3 --> N7_5_9\nN3 -->|\"브랜드홈 변경 신청서 바로가기\"| N4\nN4_1 -->|\"상품번호, 기존 브랜드명, 변경 브랜드명<br/>입력\"| N4_2\nN4_2 -->|\"네\"| N4_3\nN4_2 -->|\"아니요\"| TX5\nN4_3 -->|\"모음전 브랜드명 수정이면\"| TX6\nN4_3 --> HO_T3C\nN5 -->|\"신청 방법\"| N5_1\nN5 -->|\"신청했는데 결과가 안 와요\"| N5_1_5_2\nN5 -->|\"반려됐어요\"| N5_1_5_3\nN3 -->|\"셀러샵 추가 신청서\"| N5_1\nN5_1_5_2 -->|\"파트너가 진행 상황 확인을 원하거나<br/>5영업일이 지났으면\"| HO_T3C\nN5_1_5_3 -->|\"사유를 더 자세히 알고 싶어요\"| N5_1_5_4\nN5_1_5_3 -->|\"알겠어요\"| N7_5_9\nN5_1_5_4 --> HO_T3C\nN5_1_6 -->|\"처음 로그인하는데 안 돼요\"| N5_1_6_1\nN5_1_6 -->|\"인증번호가 안 와요\"| N5_1_6_2\nN5_1_6 -->|\"로그인 아이디(메일)를 모르겠어요\"| N5_1_6_3\nN5_1_6 -->|\"대표 계정 담당자가 퇴사해서 로그인을 못<br/>해요\"| N5_1_6_4\nN5_1_6 -->|\"1차에는 셀러샵 계정·퇴점 여부 조회가<br/>없음. 파트너가 퇴점한 셀러샵이라고 하면\"| TX7\nN5_1_6_1 -->|\"그래도 안 돼요\"| HO_T3B\nN5_1_6_1 -->|\"해결됐어요\"| N7_5_9\nN5_1_6_2 -->|\"메일·휴대폰 모두 안 와요\"| N5_1_6_2_1\nN5_1_6_2 -->|\"로그인한 아이디 메일을 지금은 안 써요\"| N5_1_6_4\nN5_1_6_2 -->|\"해결됐어요\"| N7_5_9\nN5_1_6_2_1 -->|\"아이디 입력\"| HO_T3C\nN5_1_6_3 -->|\"아이디 자체를 모르겠어요\"| N5_1_6_3_1\nN5_1_6_3 -->|\"해결됐어요\"| N7_5_9\nN5_1_6_3_1 --> HO_T3D\nN5_1_6_3_1 -->|\"셀러샵명·연락처 입력\"| N5_1_6_4\nN5_1_6_4 -->|\"연락처 입력\"| HO_T3B\nN5_1_7 -->|\"관리 계정 추가\"| N7_1\nN5_1_7 -->|\"대표 계정 변경\"| N7_1_7_2\nN5_1_7 -->|\"로그인 아이디(메일) 변경\"| N7_1_7_3\nN5_1_7 -->|\"인증수단 추가\"| N7_1_7_4\nN5_1_7 -->|\"샵 번호 확인\"| N7_5\nN3 -->|\"오로라 › 판매자 정보 › 계정 정보 ›<br/>관리계정\"| N7_1\nN7_1 -->|\"메일 주소가 하이픈(-)으로 끝나서 등록이<br/>안 돼요\"| N7_1_7_1_1\nN7_1 -->|\"완료\"| N7_5_9\nN7_1_7_1_1 --> N7_5_9\nN7_1_7_2 -->|\"대표 계정으로 로그인을 못 해요\"| N5_1_6_4\nN7_1_7_2 -->|\"완료\"| N7_5_9\nN7_1_7_2 -->|\"오로라 › 판매자 정보 › 계정 정보 ›<br/>관리계정 / 대표 계정 변경 / 추가 계정<br/>만들기\"| N7_1_7_3\nN7_1_7_4 --> N7_5_9\nN7_1_7_2 -->|\"오로라 › 판매자정보 › 판매자정보 ›<br/>셀러샵 › 샵명\"| N7_5\nN7_5 -->|\"담당자 정보·고객센터 정보·셀러샵명 변경<br/>문의\"| SW_PA009001\nN7_5 -->|\"오로라 화면 오류\"| SW_PA007002\nN7_5 -->|\"시스템 불편·불만 표현\"| HO_T4\nN7_5_9 -->|\"아니요\"| END\nN7_5_9 -->|\"네\"| SWX12\nN2_4 --> N2_5\nN4 --> N4_1\nN5_1 --> N5_1_5_2\nN7_1_7_3 --> N7_1_7_4\nHO_T3C([\"상담원 인계<br/>담당 부서 이관\"]):::ho\nTX1[\"안전거래센터(파트너센터<br/>홈페이지 맨 하단<br/>[안전거래센터<br/>바로가기])에서 지식재산권<br/>신고를 접수해 주세요. →<br/>9\"]:::txt\nTX2[\"브랜드홈은 같은 브랜드로<br/>설정되면 샵과 관계없이<br/>함께 노출됩니다. 상품의<br/>브랜드 설정 권한은 각<br/>파트너사에 있어<br/>오늘의집에서 임의로 변경할<br/>수 없으며, 노출을 원하지<br/>않으시면 해당 업체와<br/>조율이 필요합니다. → 9\"]:::txt\nHO_T3D([\"상담원 인계<br/>개별 조회 필요\"]):::ho\nHO_T3B([\"상담원 인계<br/>셀프 처리 실패\"]):::ho\nTX5[\"아래 자료 중 한 가지를<br/>첨부해 주세요. 1)<br/>브랜드 권리 보유<br/>증빙(상표등록증 등) 2)<br/>브랜드 사용 허가 관련<br/>계약서 3) 정품 유통<br/>증빙 서류 [파일 첨부]<br/>→ 4-3\"]:::txt\nTX6[\"'모음전 브랜드명은<br/>수정되지 않아 기존<br/>모음전을 삭제한 후 새로<br/>신청해 주셔야 합니다.'<br/>안내 후 9\"]:::txt\nTX7[\"'퇴점이 완료된 셀러샵은<br/>판매자 시스템 접속이<br/>불가합니다.' 안내 후 9\"]:::txt\nSW_PA009001[/\"「단순 정보변경」로 전환\"/]:::sw\nSW_PA007002[/\"「스토어관리 이슈」로 전환\"/]:::sw\nHO_T4([\"상담원 인계<br/>감정·민원\"]):::ho\nEND([\"상담 종료\"]):::fin\nSWX12[/\"용건 다시 받기 (바뀐<br/>용건의 유형으로 진행)\"/]:::sw", "nodes": [{"k": "1", "id": "1", "t": "네, 파트너님. 어떤 내용이 궁금하신가요?", "sec": false, "body": []}, {"k": "2", "id": "2", "t": "브랜드홈은 상품 등록 시 입력한 브랜드명으로 생성되며, 해당 브랜드의 판매중 상품이 8개 이상일 때 검색에 노출됩니다. 판매정지 상품은 개수에 포함되지 않습니다. 오로라에서 해당 브랜드의 판매중 상품 수를 확인해 주세요.", "sec": false, "body": ["(1차에는 브랜드별 판매중 상품 수 조회가 없어 기준 안내 후 파트너가 확인한 상품 수로 분기)"]}, {"k": "2-1", "id": "2-1", "t": "동일한 브랜드명을 쓰는 브랜드가 여럿 있으면 일반적으로 상품 수가 많은 브랜드 하나만 노출되며, 별도 수기 노출 처리는 불가합니다. 일시품절 상품은 오늘의집 검색에는 노출되어도 브랜드홈에는 노출되지 않을 수 있고, 모음전은 브랜드홈에 노출되지 않습니다.", "sec": false, "body": []}, {"k": "2-2", "id": "2-2", "t": "브랜드홈은 해당 브랜드의 판매중 상품이 8개 이상일 때 검색에 노출되어, 판매중 상품이 기준보다 적으면 노출되지 않습니다. 판매정지 상품은 개수에 포함되지 않습니다. → 9", "sec": false, "body": []}, {"k": "2-4", "id": "2-4", "t": "브랜드홈 자체를 따로 추가하거나 삭제할 수는 없으며, 상품에 등록된 브랜드명을 기준으로 생성·삭제됩니다.", "sec": false, "body": ["- 새 브랜드홈이 필요하면: 상품 일부를 새 브랜드명으로 수정하거나, 새 상품 등록 시 새 브랜드로 설정", "- 브랜드홈을 없애려면: 해당 브랜드명으로 등록된 상품을 다른 브랜드명으로 변경 → 9"]}, {"k": "2-5", "id": "2-5", "t": "어떤 경우인지 알려주시겠어요?", "sec": false, "body": []}, {"k": "2-6", "id": "2-6", "t": "확인이 필요한 화면 캡처를 첨부해 주시면 담당 부서 확인을 위해 상담원에게 연결해 드리겠습니다.", "sec": false, "body": []}, {"k": "2-7", "id": "2-7", "t": "해당 브랜드의 상표권 등 독점적 권리를 보유하고 계신가요?", "sec": false, "body": []}, {"k": "2-8", "id": "2-8", "t": "상담원이 브랜드홈 노출 상태를 확인해 드릴게요. 확인하실 브랜드명(또는 해당 브랜드로 등록한 상품번호)과 확인하신 판매중 상품 수를 알려주시겠어요?", "sec": false, "body": []}, {"k": "3", "id": "3", "t": "브랜드홈의 로고·커버이미지·소개글은 아래 가이드 하단의", "sec": false, "body": ["- [정책] 브랜드홈 변경 가이드: https://www.partnerbucketplace.com/hc/ko/articles/47359666845593", "신청 후 5영업일 이내 적용되며, 처리 결과는 신청 시 적어주신 메일로 안내됩니다. 중복 신청 시 마지막 신청 건으로 반영됩니다. 다른 파트너사의 상품이 같은 브랜드홈에 함께 노출되고 있으면 수정이 불가합니다.", "- 로고: SVG 파일만 가능, 배경을 제거한 이미지만 가능, 최소 20px 이상. 브랜드홈 커버에서는 흰색 글자로 표시되므로 흰색 로고는 검정색으로 바꿔 신청해 주세요. 상세페이지의 작은 로고는 등록한 색상 그대로 표시됩니다.", "- 커버이미지: 400×300 권장, JPG·PNG만 가능(SVG 불가). 로고가 들어간 커버이미지에는 로고를 따로 등록할 수 없어, 로고 포함 커버이미지만 등록하거나 로고 없는 커버이미지 + 로고 파일 중 하나로 신청해 주세요. 흰색 배경이면 로고가 보이지 않을 수 있습니다.", "- 소개글: 공백·줄바꿈 포함 최대 240자, shift+숫자키로 입력 가능한 특수문자만 가능, 최저가·1위·best·최고 등 배타적 표현과 타 브랜드를 연상시키는 표현 불가"]}, {"k": "3-1", "id": "3-1", "t": "로고가 배경 없는(누끼) 형식이 아니고 흰색 배경이 있는 파일이라 생긴 현상입니다. 브랜드홈에서 로고는 흰색 글자로 표시되어 흰 배경과 겹치면 흰색 네모로 보일 수 있습니다. 로고가 누끼 형식이어도 커버이미지가 흰색이면 정상 노출되지 않을 수 있으니, 배경을 제거한 SVG 로고로 다시 신청해 주세요. → 9", "sec": false, "body": []}, {"k": "3-2", "id": "3-2", "t": "확인하실 로고 이미지 파일을 첨부해 주세요. 등록 가능 여부 확인을 위해 상담원에게 연결해 드리겠습니다.", "sec": false, "body": []}, {"k": "3-3", "id": "3-3", "t": "담당 MD가 있는 경우 담당 MD께 문의해 주세요. 담당 MD가 없는 경우 현재 파트너센터에서 적용이 어려운 점 양해 부탁드립니다. → 9", "sec": false, "body": []}, {"k": "4", "id": "4", "t": "브랜드명 수정은 브랜드홈 이름을 바꾸는 방식이 아니라 상품에 등록된 브랜드명을 상품 단위로 수정하는 방식입니다. 먼저 아래 기준을 확인해 주세요.", "sec": false, "body": ["- 공백 포함 최대 15자, 셀러샵명과 동일하게 설정 불가", "- 영문명과 한글명 동의어를 함께 적는 것은 불가 (한 가지로 요청)", "- 맞춤법·외래어 표기법 준수, 최저가·1위·best·최고 등 배타적 표현과 타 브랜드 연상 표현 불가", "- 상세페이지에 변경 전 브랜드명이 있으면 먼저 수정하고, 변경할 브랜드의 상품임을 알 수 있는 배너·문구가 있어야 합니다."]}, {"k": "4-1", "id": "4-1", "t": "수정할 상품번호, 현재 브랜드명, 변경할 브랜드명을 알려주시겠어요?", "sec": false, "body": []}, {"k": "4-2", "id": "4-2", "t": "상세페이지에 변경할 브랜드의 상품임을 알 수 있는 배너나 문구가 있나요?", "sec": false, "body": []}, {"k": "4-3", "id": "4-3", "t": "브랜드명 수정은 담당 부서에서 처리합니다. 접수를 위해 상담원에게 연결해 드리겠습니다.", "sec": false, "body": ["(참고 안내: 브랜드명을 바꿔도 상품 스크랩 수는 유지되며, 기존 브랜드홈의 스크랩 수는 새 브랜드홈으로 넘어가지 않습니다.)"]}, {"k": "5", "id": "5", "t": "셀러샵은 1개 사업자당 최대 5개까지 운영할 수 있으며, 입점 시 1개가 기본 생성됩니다. 추가는 아래 발급 조건에 해당하는 경우에만 신청할 수 있고, 내부 검수에서 반려될 수 있습니다.", "sec": false, "body": ["- 발급 가능: 브랜드별 사용 / 정산계좌별 사용 / 관리부서별·사업유형별 사용(담당 MD와 협의 후 신청) / 렌탈 카테고리 / 재입점(퇴점 6개월 이후)", "- 발급 불가: 카테고리별 사용 / 담당 MD별 사용 / 중복상품 등록(동일 브랜드·동일 카테고리를 두 개 이상 샵에서 판매) / 출고지·반품교환지가 다른 경우 / 배송유형이 다른 경우(일반택배/화물택배, 일반택배/냉장 등)", "가능 조건과 불가 조건이 동시에 해당하면 가능 조건이 우선 적용됩니다."]}, {"k": "5-1", "id": "5-1", "t": "셀러샵 추가 신청서", "sec": true, "body": ["- 필요서류: 사업자등록증(재입점은 최근 3개월 이내 발급본 필수), 통장사본", "- 발급까지 최대 5영업일 소요, 결과는 메일로 안내", "- 인증번호 수령 등으로 요청 담당자와 전화 통화가 진행되니 '요청 담당자 연락처'에 통화 가능한 휴대폰 번호를 적어 주세요.", "- 한번 발급된 셀러샵은 삭제할 수 없으며, 기존 셀러샵의 상품·리뷰는 추가 셀러샵으로 이관되지 않습니다.", "- 브랜드별로 정산계좌가 달라 추가하시는 경우 '정산 계좌별 사용'으로 선택해 주세요.", "가이드: https://www.partnerbucketplace.com/hc/ko/articles/25553199736345 → 9"]}, {"k": "5-1/5-2", "id": "5-2", "t": "셀러샵 추가는 신청일로부터 최대 5영업일 이내 검토 후 결과 메일을 보내드립니다. 스팸함을 포함해 메일을 확인해 주세요.", "sec": false, "body": []}, {"k": "5-1/5-3", "id": "5-3", "t": "셀러샵 추가 결과는 담당 부서의 내부 결정에 따르며, 반려 사유는 신청 시 적어주신 메일로 안내드리고 있습니다. 메일(스팸함 포함)을 확인해 주세요.", "sec": false, "body": ["'신규 브랜드 상품 확인 안 됨' 사유로 반려된 경우, 판매하실 신규 브랜드 상품을 확인할 수 있는 링크를 첨부해 신청서를 다시 보내 주세요."]}, {"k": "5-1/5-4", "id": "5-4", "t": "상세 사유 확인은 담당 부서 확인이 필요해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)", "sec": false, "body": []}, {"k": "5-1/6", "id": "6", "t": "어떤 상황인지 알려주시겠어요?", "sec": false, "body": []}, {"k": "5-1/6-1", "id": "6-1", "t": "오로라 최초 로그인 시에는 비밀번호를 1회 초기화(비밀번호 변경)한 뒤 로그인해 주세요. 셀러샵 추가 후 첫 로그인은 신청서에 적으신 요청 담당자 메일로 받은 임시 비밀번호로 로그인한 뒤 비밀번호를 수정해 주세요.", "sec": false, "body": []}, {"k": "5-1/6-2", "id": "6-2", "t": "인증번호 유효시간은 3분입니다. 아래 순서로 다시 시도해 주세요.", "sec": false, "body": ["1) 스팸메일함과 수신 거부 설정 확인", "2) 쿠키·캐시 삭제", "3) 구글 크롬 시크릿 창에서 재시도", "4) 다른 PC에서 재시도", "메일 도메인 서버 사정으로 인증메일이 늦게 올 수 있으니, 이 경우 휴대폰 인증으로 로그인해 주세요."]}, {"k": "5-1/6-2-1", "id": "6-2-1", "t": "확인을 위해 상담원에게 연결해 드리겠습니다. 시도하신 로그인 아이디를 알려주세요.", "sec": false, "body": []}, {"k": "5-1/6-3", "id": "6-3", "t": "로그인 화면의 '비밀번호를 잊으셨나요?'로 비밀번호를 재설정해 주세요.", "sec": false, "body": []}, {"k": "5-1/6-3-1", "id": "6-3-1", "t": "상담원이 셀러샵에 등록된 로그인 아이디를 확인해 드릴게요. 셀러샵명(또는 샵 번호)과 연락 가능한 담당자 연락처를 알려주시겠어요?", "sec": false, "body": []}, {"k": "5-1/6-4", "id": "6-4", "t": "대표 계정 변경은 대표 계정 소유자 또는 대표자 확인이 필요해 상담원에게 연결해 드리겠습니다. 연락 가능한 대표자 또는 담당자 연락처를 알려주세요.", "sec": false, "body": []}, {"k": "5-1/7", "id": "7", "t": "원하시는 작업을 선택해 주세요.", "sec": false, "body": []}, {"k": "7-1", "id": "7-1", "t": "오로라 > 판매자 정보 > 계정 정보 > 관리계정", "sec": true, "body": []}, {"k": "7-1/7-1-1", "id": "7-1-1", "t": "현재 로그인 ID 메일 주소가 하이픈(-)으로 끝나면 올바르지 않은 이메일 형식으로 처리되어 등록되지 않습니다. 개선 전까지는 다른 메일 주소로 등록해 주세요. → 9", "sec": false, "body": []}, {"k": "7-1/7-2", "id": "7-2", "t": "대표 계정으로 로그인한 뒤", "sec": false, "body": []}, {"k": "7-1/7-3", "id": "7-3", "t": "로그인 아이디는 직접 바꾸는 대신 아래처럼 진행해 주세요.", "sec": false, "body": ["1) [판매자정보 > 계정 정보 > 관리 계정 > 추가 계정 만들기]에서 바꾸고 싶은 메일로 계정 만들기", "2) [판매자정보 > 계정 정보 > 관리 계정] on/off 열에서 기존 계정을 off", "기존 계정이 대표 계정이라 off가 안 되면 [대표 계정 변경]으로 새 계정을 대표로 바꾼 뒤 off 해 주세요. → 9"]}, {"k": "7-1/7-4", "id": "7-4", "t": "계정별 메일·휴대폰번호가 인증수단으로 등록되므로, 인증수단을 늘리려면", "sec": false, "body": []}, {"k": "7-5", "id": "7-5", "t": "오로라 > 판매자정보 > 판매자정보 > 셀러샵 > 샵명", "sec": true, "body": []}, {"k": "7-5/9", "id": "9", "t": "더 궁금하신 점이 있으신가요?", "sec": false, "body": []}], "hocond": "브랜드명 수정·타 브랜드 소식 노출·셀러샵 추가 진행 확인/지연/반려 상세·인증번호 메일·휴대폰 모두 미수신 T3-C / 로고 등록 가능 여부 확인·최초 로그인 실패 지속·대표 계정 담당자 부재 T3-B / 기준 안내 후에도 브랜드홈 미노출 개별 확인·로그인 아이디 확인 T3-D / 시스템 불만 T4 / 상담원 직접 요청 T1", "hoinfo": "브랜드명·상품번호·파트너가 확인한 판매중 상품 수(브랜드홈), 기존/변경 브랜드명과 증빙 첨부 여부(브랜드명 수정), 셀러샵 추가 신청일·발급 사유·반려 사유(셀러샵), 시도한 로그인 ID·시도한 조치(쿠키 삭제/시크릿/타 PC/휴대폰 인증)·대표자 연락처(로그인), 셀러샵명(또는 샵 번호)·담당자 연락처(아이디 확인), 로고 파일(로고 확인)", "kms": "053_브랜드.md, 058_셀러샵.md, 087_오로라__.md, 077_파트너센터_교육자료_파트너__셀러샵.md, 096_심층문의_이관_유형_및_이관_방법.md, 092_관리자_이관_유형_및_방법.md, 095_커머스_정책_이관_유형_및_이관_방법.md, 060_상담_태그별_주요_문의유형_.md", "check": "1) 브랜드홈 노출 기준: KMS 053은 '8개 이상(판매중만)'으로 일관되나 상담 응대에는 9개 기준 혼재, 시나리오에 {확인 필요} 표시 / 2) '1계정+인증수단 5개' 구 기준은 현 KMS에서 찾지 못함(현행은 계정 추가로 인증수단 추가), 응대 매크로 정리 필요 / 3) 셀러샵 추가 진행 확인은 KMS상 관리자 이관 유형인데 5영업일 경과 시 정책팀 이관, 인계 후 분기는 상담원 몫으로 둠 / 4) 로그인 ID 조회 결과를 챗봇이 파트너에게 보여줘도 되는지(마스킹 범위) 결정 필요 / 5) SSO로 로그인한 상태에서 들어오는 전제와 '로그인 불가' 문의가 충돌, 다른 담당자 계정 문제로 들어오는 경우만 해당되는지 확인 / 6) 브랜드홈 변경 신청서는 KMS상 '파트너센터로 신청'과 '가이드 하단 신청서 링크'가 함께 있어 링크 안내로 통일했음 / 7) (1차 추가) 오로라에서 브랜드별 판매중 상품 수를 확인하는 정확한 메뉴 경로 KMS 없음(원래 2-3 문구는 경로 없이 '오로라에서 확인') / 8) (1차 추가) 상담원이 로그인 아이디를 확인해 알려줄 때 본인 확인 기준 KMS 없음 / 9) (1차 추가) 퇴점 여부를 파트너 말에 의존하므로, 퇴점 샵이 로그인 문의로 들어오면 상담원 인계까지 갈 수 있음", "api": "R-09", "board": {"guide": "아래 내용을 함께 적어 주시면 더 빠르게 확인해 드릴 수 있어요.\n· 궁금한 항목: \n· (해당 시: 브랜드홈·브랜드명) 브랜드명 또는 상품번호: \n· (해당 시: 브랜드명 수정) 기존 브랜드명 → 바꿀 브랜드명, 상세페이지 배너 여부, 증빙 첨부: 첨부파일로 올려 주세요\n· (해당 시: 다른 브랜드가 섞여 보임) 화면 캡처: 첨부파일로 올려 주세요\n· (해당 시: 로고 등록 가능 여부 확인) 로고 파일: \n· (해당 시: 셀러샵 추가 결과) 셀러샵 추가 신청일과 받은 결과: \n· (해당 시: 로그인·인증번호. 쿠키 삭제 / 시크릿 창 / 다른 PC / 휴대폰 인증) 로그인 시도 아이디와 시도한 조치: \n· (해당 시: 대표 계정 담당자 퇴사) 연락 가능한 대표자·담당자 연락처: \n\n문의 내용: ", "mode": "조건별: 브랜드홈 기준·변경 신청 방법·셀러샵 추가 조건·5영업일 이내 결과 대기·로그인·인증·계정 관리 방법은 자동답변 종결 / 브랜드명 수정·다른 브랜드 노출·셀러샵 5영업일 경과·반려 상세·인증 모두 미수신·대표 계정 담당자 부재·로고 확인은 상담원 배정", "segs": [{"c": ["A"], "t": "브랜드홈 기준·변경 신청 방법·셀러샵 추가 조건·5영업일 이내 결과 대기·로그인·인증·계정 관리 방법은 자동답변 종결"}, {"c": ["C"], "t": "브랜드명 수정·다른 브랜드 노출·셀러샵 5영업일 경과·반려 상세·인증 모두 미수신·대표 계정 담당자 부재·로고 확인은 상담원 배정"}], "auto": "(공통 첫인사)\n\n[브랜드홈 노출·생성]\n브랜드홈은 상품 등록 시 입력한 브랜드명으로 생성되며, 해당 브랜드의 판매중 상품이 8개 이상일 때 검색에 노출됩니다. 판매정지 상품은 개수에 포함되지 않고, 일시품절 상품은 오늘의집 검색에는 노출되어도 브랜드홈에는 노출되지 않을 수 있으며, 모음전은 브랜드홈에 노출되지 않습니다. 같은 브랜드명을 쓰는 브랜드가 여럿 있으면 일반적으로 상품 수가 많은 브랜드 하나만 노출되며 별도 수기 노출 처리는 불가합니다.\n브랜드홈 자체를 따로 추가하거나 삭제할 수는 없습니다. 새 브랜드홈이 필요하면 상품 일부를 새 브랜드명으로 수정하거나 새 상품 등록 시 새 브랜드로 설정하시고, 브랜드홈을 없애려면 해당 브랜드명으로 등록된 상품을 다른 브랜드명으로 변경해 주세요.\n다른 업체가 같은 브랜드명으로 상품을 올린 경우, 상표권 등 독점적 권리를 보유하고 계시면 안전거래센터(파트너센터 홈페이지 맨 하단 [안전거래센터 바로가기])에서 지식재산권 신고를 접수해 주세요. 권리가 없으시면 상품의 브랜드 설정 권한은 각 파트너사에 있어 오늘의집에서 임의로 변경할 수 없어 해당 업체와 조율이 필요합니다.\n\n[브랜드홈 로고·커버이미지·소개글 변경]\n아래 가이드 하단의 [브랜드홈 변경 신청서 바로가기]로 신청하실 수 있습니다.\n- [정책] 브랜드홈 변경 가이드: https://www.partnerbucketplace.com/hc/ko/articles/47359666845593\n신청 후 5영업일 이내 적용되며 처리 결과는 신청 시 적어 주신 메일로 안내됩니다. 중복 신청 시 마지막 신청 건으로 반영되며, 다른 파트너사의 상품이 같은 브랜드홈에 함께 노출되고 있으면 수정이 불가합니다.\n- 로고: SVG 파일만, 배경을 제거한 이미지만, 최소 20px 이상. 브랜드홈 커버에서는 흰색 글자로 표시되므로 흰색 로고는 검정색으로 바꿔 신청해 주세요. 로고가 흰색 네모로 보인다면 흰 배경이 있는 파일이라 생긴 현상이니 배경을 제거한 SVG 로고로 다시 신청해 주세요.\n- 커버이미지: 400×300 권장, JPG·PNG만 가능(SVG 불가). 로고가 들어간 커버이미지에는 로고를 따로 등록할 수 없어, 로고 포함 커버이미지만 또는 로고 없는 커버이미지 + 로고 파일로 신청해 주세요.\n- 소개글: 공백·줄바꿈 포함 최대 240자, shift+숫자키로 입력 가능한 특수문자만 가능, 최저가·1위·best·최고 등 배타적 표현과 타 브랜드를 연상시키는 표현 불가\nMD's Pick 등 다른 영역 설정은 담당 MD가 있으면 담당 MD께 문의해 주시고, 담당 MD가 없으면 현재 파트너센터에서 적용이 어려운 점 양해 부탁드립니다.\n\n[셀러샵 추가]\n셀러샵은 1개 사업자당 최대 5개까지 운영할 수 있으며 입점 시 1개가 기본 생성됩니다. 추가는 아래 발급 조건에 해당하는 경우에만 신청할 수 있고, 내부 검수에서 반려될 수 있습니다.\n- 발급 가능: 브랜드별 사용 / 정산계좌별 사용 / 관리부서별·사업유형별 사용(담당 MD와 협의 후 신청) / 렌탈 카테고리 / 재입점(퇴점 6개월 이후)\n- 발급 불가: 카테고리별 사용 / 담당 MD별 사용 / 중복상품 등록(동일 브랜드·동일 카테고리를 두 개 이상 샵에서 판매) / 출고지·반품교환지가 다른 경우 / 배송유형이 다른 경우\n가능 조건과 불가 조건이 동시에 해당하면 가능 조건이 우선 적용됩니다.\n신청은 셀러샵 추가 신청서로 해 주세요(가이드: https://www.partnerbucketplace.com/hc/ko/articles/25553199736345). 필요서류는 사업자등록증(재입점은 최근 3개월 이내 발급본 필수)과 통장사본이며, 발급까지 최대 5영업일 소요되고 결과는 메일로 안내됩니다. 인증번호 수령 등으로 요청 담당자와 통화가 진행되니 '요청 담당자 연락처'에 통화 가능한 휴대폰 번호를 적어 주세요. 한번 발급된 셀러샵은 삭제할 수 없고 기존 셀러샵의 상품·리뷰는 이관되지 않습니다.\n신청 후 5영업일이 지나지 않았다면 스팸함을 포함해 결과 메일을 확인해 주세요. 반려 사유도 신청 시 적어 주신 메일로 안내드리며, '신규 브랜드 상품 확인 안 됨' 사유로 반려된 경우 판매하실 신규 브랜드 상품을 확인할 수 있는 링크를 첨부해 신청서를 다시 보내 주세요.\n\n[다른 담당자 계정 로그인·인증번호]\n- 오로라 최초 로그인 시에는 비밀번호를 1회 초기화(비밀번호 변경)한 뒤 로그인해 주세요. 셀러샵 추가 후 첫 로그인은 신청서에 적으신 요청 담당자 메일로 받은 임시 비밀번호로 로그인한 뒤 비밀번호를 수정해 주세요.\n- 인증번호 유효시간은 3분입니다. 스팸메일함과 수신 거부 설정 확인 → 쿠키·캐시 삭제 → 구글 크롬 시크릿 창에서 재시도 → 다른 PC에서 재시도 순으로 해 보시고, 메일 도메인 서버 사정으로 인증메일이 늦게 올 수 있으니 이 경우 휴대폰 인증으로 로그인해 주세요.\n- 로그인 아이디를 모르시면 로그인 화면의 '비밀번호를 잊으셨나요?'로 비밀번호를 재설정해 주세요.\n- 퇴점이 완료된 셀러샵은 판매자 시스템 접속이 불가합니다.\n\n[계정 추가·대표 계정·아이디 변경·인증수단·샵 번호]\n- 관리 계정 추가: 오로라 > 판매자 정보 > 계정 정보 > 관리계정에서 [추가 계정 만들기]. 메일 주소가 하이픈(-)으로 끝나면 올바르지 않은 형식으로 처리되어 등록되지 않으니 다른 메일 주소로 등록해 주세요.\n- 대표 계정 변경: 대표 계정으로 로그인한 뒤 같은 메뉴에서 [대표 계정 변경]. 관리계정으로 등록된 담당자 중에서만 지정할 수 있어, 새 담당자라면 먼저 계정을 만든 뒤 지정해 주세요.\n- 로그인 아이디 변경: 아이디는 직접 바꾸는 대신 바꾸고 싶은 메일로 관리 계정을 만든 뒤, 관리 계정 on/off 열에서 기존 계정을 off 해 주세요. 기존 계정이 대표 계정이라 off가 안 되면 [대표 계정 변경]으로 새 계정을 대표로 바꾼 뒤 off 해 주세요.\n- 인증수단 추가: 계정별 메일·휴대폰번호가 인증수단으로 등록되므로 관리 계정을 추가해 주세요.\n- 샵 번호: 오로라 > 판매자정보 > 판매자정보 > 셀러샵 > 샵명에서 셀러샵 번호(ID)를 확인하실 수 있습니다.\n(궁금한 항목에 해당하는 단락만, 맺음 A)", "ack": "남겨 주신 내용을 확인한 뒤 처리하겠습니다.\n(브랜드명 수정: \"브랜드명 수정은 브랜드홈 이름을 바꾸는 방식이 아니라 상품에 등록된 브랜드명을 상품 단위로 수정하는 방식으로, 담당 부서에서 처리합니다. 브랜드명은 공백 포함 최대 15자이며 셀러샵명과 같게 설정할 수 없습니다.\")\n(대표 계정 담당자 퇴사: \"대표 계정 변경은 대표 계정 소유자 또는 대표자 확인이 필요해, 남겨 주신 연락처로 확인 연락을 드릴 수 있습니다.\")", "info": "브랜드명·상품번호, 기존/변경 브랜드명·배너 여 이거나, 배송중으로 바꿨는데 오로라 홈 현황에 반영되지 않는 경우 간혹 반영이 지연될 수 있습니다. 시간 여유를 두고 다시 확인해 주세요.\n[외부솔루션으로 수집한 문의 접수일이 0000-01-01로 나와요] → 5-1 / [시간이 지나도 그대로예요] → 5-2 / [알겠어요] → 10\n5-1. 2-1의 쿠키·캐시 삭제 후 다시 확인해 주시고, 이용 중인 외부솔루션 측에도 오류가 있는지 확인 부탁드립니다.\n[외부솔루션 문제는 아니래요 / 계속 그래요] → 5-2 / [해결됐어요] → 10\n5-2. 확인을 위해 해당 주문번호(또는 문의 건)와 화면 캡처를 첨부해 주세요. 담당 부서 확인을 위해 상담원에게 연결해 드리겠습니다.\n[주문번호, 캡처 첨부] → 상담원 인계 (T3-C)\n\n6. 오로라 홈 화면의 현황 건수는 부득이 실제와 맞지 않을 수 있습니다. 개발팀에서도 인지하고 개선 예정이나 즉시 개선은 어려워 반영까지 시일이 걸릴 수 있습니다. 해당 메뉴에 들어가서 실제로 확인되는 건을 기준으로 답변 처리 부탁드립니다.\n고객센터 문의 건수는 홈 화면에 표시되지 않으니 [오로라 > 문의/리뷰 > 고객센터 문의]에서 확인해 주세요. → 10\n\n7. 판매 상태를 일괄 변경할 때 재고가 0개인 상품이 있으면 해당 상품은 품절로 처리될 수 있습니다. 재고가 0개인 상품은 먼저 재고를 수정한 뒤 판매 상태를 바꿔 주세요. → 10\n\n8. 어떤 증상인지 선택해 주세요.\n[상세페이지 판매가와 주문 시 가격이 달라요] → 8-1 / [다른 상품의 리뷰가 보여요] → 8-2 / [고객 문의 답변하라는 문자가 잘못 온 것 같아요] → 8-3\n8-1. 확인을 위해 주문번호, 주문옵션번호, 주문 접수된 가격, 현재 보이는 판매가를 알려주세요.\n[정보 입력] → 담당 부서 확인을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)\n8-2. 해당 상품번호와 화면 캡처를 첨부해 주세요.\n[상품번호, 캡처 첨부] → 담당 부서 확인을 위해 상담원에게 연결해 드리겠습니다. → 상담원 인계 (T3-C)\n8-3. 해당 안내 문자는 오로라에 등록된 주문/클레임 담당자 연락처로 발송됩니다. 담당자가 바뀌었다면 [오로라 > 판매자정보 > 담당자 정보]에서 담당자 정보 수정 버튼을 누른 뒤 저장해 주세요.\n[우리 회사와 관계없는 번호로 받았어요] → 수신한 연락처를 알려주세요. [연락처 입력] → 상담원 인계 (T3-C)\n[알겠어요] → 10\n\n9. 아래 순서로 쿠키를 삭제한 뒤 다시 접속해 주세요.\n1) 크롬 오른쪽 상단 더보기 > 설정\n2) 개인 정보 보호 및 보안 > 쿠키 및 기타 사이트 데이터\n3) 모든 사이트 데이터 및 권한 보기 > 모든 데이터 삭제\n4) 오늘의집 파트너센터 링크 재접속\n그래도 접속되지 않으면 방화벽 설정을 확인하시고, 방화벽 해제 후 다시 접속해 주세요.\n[그래도 안 돼요] → 2-2 / [해결됐어요] → 10\n\n10. 더 궁금하신 점이 있으신가요?\n[아니요] → 상담 종료 (유형: PA007002)\n[네] → 용건 다시 받기 (바뀐 용건의 유형으로 진행)", "mmd": "flowchart TD\nS([\"파트너 발화로 이 유형 판정\"]):::start\nN1[\"<b>1<\/b> 네, 파트너님. 불편을 드려 죄송합니다.<br/>어떤 증상인지 선택해 주세요.\"]:::bot\nN2[\"<b>2<\/b> 오류가 발생하는 메뉴(경로)와 화면에 보이는<br/>오류 문구를 알려주시겠어요? 화면 캡처가<br/>있으면 첨부해 주세요.\"]:::bot\nN2_1[\"<b>2-1<\/b> 아래 순서로 다시 시도해 주세요. 오늘의집은<br/>구글 크롬 브라우저 사용을 권장드립니다.\"]:::bot\nN2_2[\"<b>2-2<\/b> 확인을 위해 아래 내용을 알려주세요.\"]:::bot\nN2_3[\"<b>2-3<\/b> 정확한 확인을 위해 상담원에게 연결해<br/>드리겠습니다. 확인 과정에서 상담원이 오로라<br/>화면 확인을 요청드릴 수 있습니다.\"]:::bot\nN3[\
