<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O!Night 퀴즈</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --oh:#35C5F0; --oh-d:#0E9FCE; --oh-dd:#0A7CA4; --oh-soft:#EAF7FD;
  --ink:#0E2B38; --ink2:#4E6B77; --ink3:#8AA0AA;
  --paper:#F7FAFB; --rule:#E3EAEE; --deep:#08303F; --ember:#C8562F;
  --good:#2E9E5B; --bad:#C4453E;
}
*{box-sizing:border-box}
html{background:var(--deep)}
body{
  margin:0; min-height:100svh; background:var(--deep); color:#fff;
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased; letter-spacing:-.012em;
  word-break:keep-all; overflow-wrap:break-word;
}
h1,h2,p{margin:0}
.wrap{max-width:640px; margin:0 auto; padding:26px 18px 60px}
.top{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.top .eyebrow{font-size:12.5px; font-weight:800; letter-spacing:.04em; color:rgba(255,255,255,.45)}
.top h1{font-size:24px; font-weight:800; letter-spacing:-.04em}
#roomTag{font-size:12px; font-weight:800; letter-spacing:.06em; border-radius:999px;
  padding:5px 11px; vertical-align:middle; margin-left:6px}
#roomTag.test{background:#F0B84B; color:var(--deep)}
#roomTag.live{background:#C4453E; color:#fff}
.top .rc{margin-left:auto; font-size:12.5px; font-weight:700; color:rgba(255,255,255,.5)}

/* 참가자 선택 */
.who{margin-top:20px; position:relative}
.who label{display:block; font-size:12px; font-weight:800; letter-spacing:.06em; color:rgba(255,255,255,.5); margin-bottom:7px}
.who input{
  width:100%; font:inherit; font-size:16px; font-weight:600; color:var(--ink);
  background:#fff; border:0; border-radius:12px; padding:14px 15px;
}
.who input:focus{outline:2px solid var(--oh)}
.combolist{
  position:absolute; left:0; right:0; top:100%; margin-top:6px; z-index:9; background:#fff;
  border-radius:12px; box-shadow:0 12px 30px rgba(0,0,0,.35); max-height:240px; overflow-y:auto; padding:6px;
}
.combolist button{
  display:flex; align-items:baseline; gap:8px; width:100%; text-align:left; background:none; border:0;
  font:inherit; font-size:14.5px; color:var(--ink); padding:11px; border-radius:9px; cursor:pointer;
}
.combolist button:hover,.combolist button.hi{background:var(--oh-soft)}
.combolist button i{font-style:normal; font-size:12.5px; color:var(--ink3)}
.whorow{display:flex; gap:9px; align-items:stretch}
.whorow input{flex:1}
.btn.sm{padding:14px 20px; font-size:14px}
.joined{
  display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.08);
  border-radius:12px; padding:14px 15px; font-size:16px; font-weight:800;
}
.joined .lock{font-size:12px; font-weight:700; color:rgba(255,255,255,.45)}
.joined .btn{margin-left:auto; padding:9px 15px; font-size:13px}
.pill{cursor:pointer; border:0}
.pill:disabled{cursor:default; opacity:.55}
.detail{
  margin-top:16px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
  border-radius:18px; padding:20px 18px;
}
.detail .dh{display:flex; align-items:baseline; gap:10px}
.detail .dh .t{font-size:15px; font-weight:800}
.detail .dh .x{margin-left:auto; background:none; border:0; color:rgba(255,255,255,.5); font-size:20px; cursor:pointer; line-height:1}
.detail .q{margin:12px 0 0; font-size:16px; font-weight:700; line-height:1.5}
.detail .a{margin:9px 0 0; font-size:14px; color:#8FE3A8; font-weight:700}
.detail .row .s{color:rgba(255,255,255,.45)}
.detail .row.out{opacity:.5}
.miss{font-size:12px; font-weight:700; color:rgba(255,255,255,.4)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.chip{font-size:12px; font-weight:700; background:rgba(255,255,255,.08); border-radius:999px; padding:6px 11px}
.chip.no{color:rgba(255,255,255,.35)}
.chip.won{background:rgba(143,227,168,.18); color:#8FE3A8}

/* 카드 */
.card{
  margin-top:18px; background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14); border-radius:20px; padding:26px 22px;
}
.tag{
  display:inline-flex; align-items:center; gap:8px; font-size:11.5px; font-weight:800;
  letter-spacing:.1em; color:#fff; background:var(--ember); border-radius:999px; padding:7px 14px;
}
.tag.wait{background:rgba(255,255,255,.16)}
.tag.done{background:rgba(255,255,255,.16)}
.ask{margin:16px 0 0; font-size:clamp(20px,4.6vw,27px); font-weight:800; letter-spacing:-.035em; line-height:1.45}
.sub{margin:10px 0 0; font-size:14px; line-height:1.6; color:rgba(255,255,255,.55)}
.inrow{display:flex; gap:9px; margin-top:20px}
.inrow input{
  flex:1; min-width:0; font:inherit; font-size:17px; color:var(--ink); background:#fff;
  border:0; border-radius:12px; padding:15px;
}
.inrow input:focus{outline:2px solid var(--oh)}
.btn{
  border:0; cursor:pointer; font:inherit; font-size:15px; font-weight:800; color:#fff;
  background:var(--ember); border-radius:12px; padding:15px 24px; white-space:nowrap;
}
.btn:disabled{opacity:.45; cursor:default}
.btn.ghost{background:rgba(255,255,255,.12)}
.msg{margin:13px 0 0; font-size:14.5px; font-weight:700; min-height:1.2em}
.msg.bad{color:#FF9C93}
.msg.good{color:#8FE3A8}

/* 정답자 */
.win{margin:22px 0 0; padding-top:18px; border-top:1px solid rgba(255,255,255,.14)}
.win .t{font-size:11.5px; font-weight:800; letter-spacing:.12em; color:rgba(255,255,255,.45)}
.row{display:flex; align-items:center; gap:11px; padding:11px 0; font-size:15px}
.row .n{
  flex:0 0 24px; height:24px; border-radius:8px; background:rgba(255,255,255,.14);
  display:grid; place-items:center; font-size:12px; font-weight:800;
}
.row.me .n{background:var(--oh); color:var(--deep)}
.row .w{font-weight:700}
.row .s{margin-left:auto; font-size:12.5px; color:rgba(255,255,255,.45); font-variant-numeric:tabular-nums}
.empty{margin:12px 0 0; font-size:13.5px; color:rgba(255,255,255,.45)}

/* 진행 현황 */
.prog{margin-top:18px; display:flex; gap:6px; flex-wrap:wrap}
.pill{
  font-size:11.5px; font-weight:800; padding:7px 11px; border-radius:999px;
  background:rgba(255,255,255,.08); color:rgba(255,255,255,.5);
}
.pill.on{background:var(--ember); color:#fff}
.pill.done{background:rgba(143,227,168,.18); color:#8FE3A8}

/* 총무 */
.admin{margin-top:22px; background:rgba(0,0,0,.28); border-radius:18px; padding:20px 18px}
.admin .h{font-size:11.5px; font-weight:800; letter-spacing:.12em; color:rgba(255,255,255,.5); margin-bottom:14px}
.qr{border-top:1px solid rgba(255,255,255,.12); padding:14px 0}
.qr:first-of-type{border-top:0}
.l1{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.l1 .idx{font-size:12px; font-weight:800; color:rgba(255,255,255,.5)}
.qr input,.qr select,.qr textarea{
  font:inherit; font-size:13.5px; color:var(--ink); background:#fff; border:0;
  border-radius:9px; padding:9px 11px; min-width:0;
}
.qr .ti{flex:1; min-width:120px}
.qr textarea{width:100%; margin-top:8px; resize:vertical; min-height:56px; line-height:1.55}
.qr .an{width:100%; margin-top:8px}
.st{margin-left:auto; font-size:12px; color:rgba(255,255,255,.5)}
.acts{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap}
.acts button{
  font:inherit; font-size:12.5px; font-weight:700; border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.08); color:#fff; border-radius:9px; padding:9px 13px; cursor:pointer;
}
.acts button:hover{background:rgba(255,255,255,.18)}
.acts button.go{background:var(--ember); border-color:transparent}
.acts button.warn{border-color:rgba(255,140,130,.4); color:#FF9C93}
.foot{margin-top:26px; font-size:12.5px; line-height:1.7; color:rgba(255,255,255,.35)}
.foot a{color:rgba(255,255,255,.6)}
.toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px);
  background:#fff; color:var(--ink); font-size:14px; font-weight:700;
  padding:12px 20px; border-radius:11px; opacity:0; pointer-events:none;
  transition:opacity .2s ease, transform .2s ease; z-index:60;
}
.toast.on{opacity:1; transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">O!Night in Changgo 43</div>
      <h1>퀴즈 타임 <span id="roomTag"></span></h1>
    </div>
    <span class="rc" id="rc"></span>
  </div>

  <div class="who">
    <label for="who">참가자</label>
    <div id="whoBox"></div>
    <div class="combolist" id="list" hidden></div>
  </div>

  <div class="prog" id="prog"></div>
  <div id="detail"></div>
  <div id="body"></div>
  <div id="admin"></div>

  <p class="foot">
    답은 화면에 입력합니다. 다른 사람 답은 보이지 않고, 정답을 맞힌 분만 아래 목록에 순서대로 올라갑니다.<br>
    <a href="../">← 회식 페이지로</a>
  </p>
</div>
<div class="toast" id="toast"></div>

<script>
const API = "https://changgo43-order.enzojoo.workers.dev";
const MEMBERS = [{"n":"Andy Alikov","h":"alikov.andrei"},{"n":"Becca","h":"bh.yoo"},{"n":"Becky","h":"sohee.bae"},{"n":"Better","h":"better.kim"},{"n":"BK","h":"byungkwon.yang"},{"n":"Breeze","h":"sky"},{"n":"Bryan","h":"jeonghyeon.kim"},{"n":"Chai","h":"chai"},{"n":"Charley Hwang","h":"h.hwang"},{"n":"Chloe","h":"chloe.oh"},{"n":"Claire","h":"claire.lee"},{"n":"Dana","h":"dayoon.kang"},{"n":"Della","h":"hyejin.lee"},{"n":"Dragon","h":"ky.han"},{"n":"Ella","h":"sm.lee"},{"n":"Enzo","h":"yb.joo"},{"n":"Goya","h":"ye.choe"},{"n":"Graham","h":"graham"},{"n":"Hardy","h":"hj.lee"},{"n":"Hayden","h":"hayden.lee"},{"n":"Heather","h":"sh.yoon"},{"n":"Holly","h":"holly.lee"},{"n":"Irwin","h":"js.oh"},{"n":"Jenny","h":"moonj.kim"},{"n":"Jisoo Jeon","h":"jisoo.jeon"},{"n":"John","h":"john"},{"n":"Julie","h":"yw.kim159"},{"n":"Kei","h":"kei.oh"},{"n":"Khan","h":"khan.lee"},{"n":"Kiana","h":"cy.lee"},{"n":"Modo","h":"jh.han"},{"n":"pyoroy","h":"sg.pyo"},{"n":"Raul Hyun","h":"er.hyun"},{"n":"Renee","h":"ea.ryu"},{"n":"Scott","h":"js.lee"},{"n":"Seosu","h":"sy.seo"},{"n":"Terry","h":"hangyul.lee"},{"n":"Winni","h":"minkyu.kim"},{"n":"Wiz","h":"yeji.kim"},{"n":"Wonjae","h":"wonjae.kim"},{"n":"Yeon","h":"sy02"}];
const ADMIN_KEY = (location.hash.match(/admin=([A-Za-z0-9]+)/) || [])[1] || "";
/* #room=test 를 붙이면 실전과 완전히 분리된 리허설 방을 쓴다.
   참가자 링크에는 이 값이 없으므로 리허설이 보이지 않는다. */
function roomFromHash(){ return /room=test/.test(location.hash) ? "test" : "main"; }
const ROOM = roomFromHash();
/* 주소창에서 해시만 바꾸면 페이지가 다시 로드되지 않아, 이전 방 상태가 남는다.
   방이 바뀌면 강제로 새로고침해서 화면과 실제 방을 항상 일치시킨다. */
window.addEventListener("hashchange", function(){
  if (roomFromHash() !== ROOM) location.reload();
});
const QTYPE = { ai:"AI 활용능력", title:"노래 제목 맞히기", lyrics:"가사 맞히기", observe:"관찰력 게임" };

const elWhoBox = document.getElementById("whoBox"),
      elList = document.getElementById("list"),
      elBody = document.getElementById("body"),
      elAdmin = document.getElementById("admin"),
      elProg = document.getElementById("prog"),
      elRc = document.getElementById("rc"),
      elToast = document.getElementById("toast");

function showToast(t){ elToast.textContent=t; elToast.classList.add("on"); setTimeout(function(){ elToast.classList.remove("on"); },1900); }
function esc(t){ return String(t).replace(/</g,"&lt;"); }

/* ---------- 참가 등록 ----------
   이름을 고르고 [완료]를 눌러야 참가로 잡힌다. 누가 실제로 왔는지 여기서 갈린다.
   답을 한 번이라도 제출하면 이름을 바꿀 수 없다. */
let me = null, locked = false, editing = true;
try { const sv=JSON.parse(localStorage.getItem("cg43_quiz_me")||"null"); if(sv&&sv.n){ me=sv; editing=false; } } catch(e){}
function nickOf(){ return me ? me.n : ""; }

function renderWho(){
  if (!editing && me){
    elWhoBox.innerHTML = '<div class="joined"><span>'+esc(me.n)+'</span>'
      + (locked ? '<span class="lock">참여 중 · 변경 불가</span>'
                : '<button class="btn ghost sm" type="button" id="edit">수정</button>')
      + '</div>';
  } else {
    elWhoBox.innerHTML = '<div class="whorow">'
      + '<input id="who" type="text" placeholder="이름을 검색하세요" autocomplete="off" value="'
      +   (me ? esc(me.n).replace(/"/g,"&quot;") : "") + '">'
      + '<button class="btn sm" type="button" id="done">완료</button></div>';
    const inp=document.getElementById("who");
    inp.addEventListener("focus", function(){ openList(inp.value); });
    inp.addEventListener("input", function(){ openList(inp.value); });
    inp.addEventListener("keydown", onKey);
  }
}
elWhoBox.addEventListener("click", function(e){
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="edit"){ if(locked){ showToast("이미 참여하셔서 변경할 수 없습니다"); return; } editing=true; renderWho(); }
  if(b.id==="done") register();
});
function register(){
  const inp=document.getElementById("who"); if(!inp) return;
  const v=inp.value.trim();
  if(!v){ showToast("이름을 입력해 주세요"); return; }
  const hit=MEMBERS.filter(function(m){ return m.n===v; })[0];
  me = hit || { n:v, h:"" };
  fetch(API+"/quiz/join",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({nick:me.n, handle:me.h, room:ROOM})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.ok){ showToast(d.error||"등록 실패"); return; }
      locked = !!d.locked; editing=false;
      try{ localStorage.setItem("cg43_quiz_me", JSON.stringify(me)); }catch(e){}
      showToast(me.n+"님 참가 등록 완료");
      renderWho(); closeList(); lastHtml=""; load();
    })
    .catch(function(){ showToast("등록에 실패했습니다"); });
}

let shown = [], hi = -1;
function openList(q){
  const k=(q||"").trim().toLowerCase();
  shown = MEMBERS.filter(function(m){ return !k || m.n.toLowerCase().indexOf(k)>=0 || m.h.toLowerCase().indexOf(k)>=0; });
  elList.innerHTML = shown.length
    ? shown.map(function(m,i){ return '<button type="button" data-i="'+i+'"><span>'+m.n+'</span><i>@'+m.h+'</i></button>'; }).join("")
    : '<div style="padding:12px;color:#8AA0AA;font-size:14px">명단에 없으면 그대로 입력해도 됩니다</div>';
  elList.hidden=false; hi=-1;
}
function closeList(){ elList.hidden=true; hi=-1; }
function onKey(e){
  if (elList.hidden || !shown.length){ if(e.key==="Enter"){ e.preventDefault(); register(); } return; }
  if (e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault(); hi += (e.key==="ArrowDown"?1:-1);
    if(hi<0) hi=shown.length-1; if(hi>=shown.length) hi=0;
    elList.querySelectorAll("button").forEach(function(b,i){ b.classList.toggle("hi", i===hi); });
    const c=elList.querySelectorAll("button")[hi]; if(c) c.scrollIntoView({block:"nearest"});
  } else if (e.key==="Enter"){
    e.preventDefault();
    if(hi>=0){ document.getElementById("who").value=shown[hi].n; closeList(); }
    register();
  } else if (e.key==="Escape") closeList();
}
elList.addEventListener("mousedown", function(e){
  const b=e.target.closest("button[data-i]");
  if(b){ e.preventDefault(); document.getElementById("who").value=shown[parseInt(b.dataset.i,10)].n; closeList(); register(); }
});
document.addEventListener("click", function(e){ if(!elList.hidden && !e.target.closest(".who")) closeList(); });
renderWho();
(function(){
  const tag = document.getElementById("roomTag");
  if (!ADMIN_KEY){ tag.style.display = "none"; return; }      // 참가자에게는 안 보임
  if (ROOM === "test"){ tag.textContent = "리허설"; tag.className = "test"; }
  else { tag.textContent = "실전"; tag.className = "live"; }
})();

/* ---------- 화면 ---------- */
let lastHtml="", msg=null, rounds=null;

function renderProg(q){
  elRc.textContent = q.totalRounds ? ("총 " + q.totalRounds + "라운드") : "";
  elProg.innerHTML = q.meta.map(function(m){
    const on = q.active && q.active.i===m.i;
    const open = m.done || (m.tried>0 && !(on && q.active.started));   // 끝난 라운드만 열람 가능
    return '<button class="pill'+(on?" on":(m.done?" done":""))+'" data-r="'+m.i+'"'
      + (open?"":" disabled")+'>R'+(m.i+1)+' '+m.count+'/'+q.win+'</button>';
  }).join("");
}

/* ---------- 지난 라운드 상세 ---------- */
const elDetail = document.getElementById("detail");
let openRound = null;
elProg.addEventListener("click", function(e){
  const b=e.target.closest(".pill[data-r]"); if(!b || b.disabled) return;
  const i=parseInt(b.dataset.r,10);
  if(openRound===i){ openRound=null; elDetail.innerHTML=""; return; }
  openRound=i; showRound(i);
});
elDetail.addEventListener("click", function(e){
  if(e.target.closest(".x")){ openRound=null; elDetail.innerHTML=""; }
});
function showRound(i){
  elDetail.innerHTML='<div class="detail"><div class="dh"><span class="t">불러오는 중…</span></div></div>';
  fetch(API+"/quiz/round?i="+i+"&room="+ROOM)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.ok){ elDetail.innerHTML='<div class="detail"><div class="dh"><span class="t">'+esc(d.error)+'</span>'
        + '<button class="x" type="button">×</button></div></div>'; return; }
      elDetail.innerHTML='<div class="detail">'
        + '<div class="dh"><span class="t">ROUND '+(d.i+1)+' · '+(QTYPE[d.type]||d.type)+'</span>'
        +   '<button class="x" type="button">×</button></div>'
        + '<p class="q">'+esc(d.question||"(문제 없음)")+'</p>'
        + '<p class="a">정답 · '+esc(String(d.answers||"").split("|").join(" / "))+'</p>'
        + '<div class="win"><div class="t">정답 입력 '+d.submissions.length+'명 (상위 '+d.win+'명 통과)</div>'
        + (d.submissions.length
            ? d.submissions.map(function(w,k){
                return '<div class="row'+(k>=d.win?" out":"")+'"><span class="n">'+(k+1)+'</span>'
                  + '<span class="w">'+esc(w.nick)+'</span>'
                  + '<span class="s">'+(w.ms>=0?(w.ms/1000).toFixed(1)+"초":"")
                  + (k>=d.win?" · 정원 초과":"")+'</span></div>'; }).join("")
            : '<p class="empty">정답자가 없습니다.</p>')
        + '</div></div>';
    })
    .catch(function(){ elDetail.innerHTML=""; });
}

/* 내가 몇 조인지 (선발된 라운드 번호 = 조 번호) */
function myGroup(q, nick){
  if(!nick || !q.groups) return null;
  for(const k of Object.keys(q.groups)){
    const list=q.groups[k];
    if(list.some(function(w){ return w.nick===nick; }))
      return { no: parseInt(k,10)+1, members:list };
  }
  return null;
}

function render(q){
  const nick = nickOf();
  renderProg(q);
  const mine = myGroup(q, nick);
  let h="";

  /* 이미 선발된 사람에게는 문제 대신 본인 조를 보여준다.
     같은 공간에 있어서, 통과자에게 정답 여부를 알려주면 옆으로 새기 때문에
     참여 자체를 막는다. 대신 소속을 확인하는 화면으로 바꾼다. */
  if (mine){
    elBody.innerHTML =
      '<div class="card"><span class="tag done">선발 완료</span>'
      + '<p class="ask">'+mine.no+'조로 확정되었습니다 🎉</p>'
      + '<p class="sub">남은 라운드는 편하게 지켜봐 주세요.</p>'
      + '<div class="win"><div class="t">'+mine.no+'조 ('+mine.members.length+'명)</div>'
      +   mine.members.map(function(w,i){
            return '<div class="row'+(w.nick===nick?" me":"")+'"><span class="n">'+(i+1)+'</span>'
              + '<span class="w">'+esc(w.nick)+'</span></div>'; }).join("")
      + '</div></div>';
    lastHtml="__mine__"+mine.no+mine.members.length;
    return;
  }

  if (!q.active){
    h = '<div class="card"><span class="tag wait">대기 중</span>'
      + '<p class="sub">아직 시작된 라운드가 없습니다. 이 화면을 켜둔 채로 기다려 주세요.</p></div>';
  } else if (!q.round){
    const t = q.meta[q.active.i] ? q.meta[q.active.i].title : "";
    h = '<div class="card"><span class="tag wait">곧 시작합니다</span>'
      + '<p class="ask">'+esc(t)+'</p>'
      + '<p class="sub">문제가 곧 나타납니다. 화면을 그대로 두세요.</p></div>';
  } else {
    const r=q.round, full=q.winners.length>=q.win;
    h = '<div class="card"><span class="tag">ROUND '+(r.i+1)+' · '+(QTYPE[r.type]||r.type)+'</span>'
      + '<p class="ask">'+esc(r.question)+'</p>';
    if (!nick) h += '<p class="sub">위에서 이름을 고르고 <b>완료</b>를 눌러 참가 등록해 주세요.</p>';
    else if (full) h += '<p class="sub">'+q.win+'명이 모두 찼습니다. 다음 라운드를 기다려 주세요.</p>';
    else h += '<div class="inrow"><input id="ans" type="text" maxlength="60" autocomplete="off" placeholder="정답 입력">'
           +  '<button class="btn" type="button" id="send">제출</button></div>'
           +  '<p class="msg'+(msg?(msg.ok?" good":" bad"):"")+'">'+(msg?esc(msg.text):"")+'</p>';
    h += '<div class="win"><div class="t">정답자 '+q.winners.length+' / '+q.win+'</div>'
      + (q.winners.length
          ? q.winners.map(function(w,i){
              return '<div class="row'+(w.nick===nick?" me":"")+'"><span class="n">'+(i+1)+'</span>'
                + '<span class="w">'+esc(w.nick)+'</span>'
                + '<span class="s">'+(w.ms>=0?(w.ms/1000).toFixed(1)+"초":"")+'</span></div>'; }).join("")
          : '<p class="empty">아직 정답자가 없습니다.</p>')
      + '</div></div>';
  }
  if (h!==lastHtml){
    const keep = document.getElementById("ans");
    const val = keep ? keep.value : "";
    elBody.innerHTML=h; lastHtml=h;
    const nx = document.getElementById("ans");
    if (nx && val){ nx.value = val; }
  }
}

document.addEventListener("click", function(e){ if(e.target && e.target.id==="send") submit(); });
document.addEventListener("keydown", function(e){
  if(e.key==="Enter" && document.activeElement && document.activeElement.id==="ans") submit();
});
function submit(){
  const el=document.getElementById("ans"); if(!el) return;
  const nick=nickOf();
  if(!nick){ showToast("먼저 이름을 등록해 주세요"); return; }
  const v=el.value.trim(); if(!v) return;
  el.value=""; el.blur();
  fetch(API+"/quiz/answer",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({nick:nick,answer:v,room:ROOM})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.blocked) msg={ok:false,text:d.blocked};
      else if(d.correct){ locked=true; renderWho();
        msg = d.inTop
          ? {ok:true,text:"정답입니다! "+d.rank+"번째로 통과하셨어요 🎉"}
          : {ok:false,text:"정답이지만 이미 "+d.win+"명이 찼습니다. 다음 라운드를 노려주세요"}; }
      else msg={ok:false,text:"정답이 아닙니다! 다시 확인해 주세요"};
      lastHtml=""; load();
    })
    .catch(function(){ msg={ok:false,text:"전송 실패. 다시 시도해 주세요"}; lastHtml=""; render(lastQ||{meta:[],active:null,winners:[]}); });
}

/* ---------- 총무 ---------- */
function adminCall(body, then){
  body.key=ADMIN_KEY; body.room=ROOM;
  return fetch(API+"/quiz/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){ return r.json(); })
    .then(function(d){ if(!d.ok) showToast(d.error||"실패"); if(then) then(d); lastHtml=""; load(); });
}
function collect(){
  return Array.from(elAdmin.querySelectorAll(".qr")).map(function(el){
    return { type:el.querySelector(".ty").value, title:el.querySelector(".ti").value,
             question:el.querySelector(".qu").value, answers:el.querySelector(".an").value };
  });
}
let adminHtml="";
function renderAdmin(q){
  if(!ADMIN_KEY) return;
  if(rounds !== null && q.totalRounds && rounds.length !== q.totalRounds) rounds = null;
  if(rounds===null){
    rounds=[];
    adminCall({action:"rounds"}, function(d){
      rounds = (d.rounds&&d.rounds.length) ? d.rounds
        : Array.from({length:9},function(_,i){ return {type:"ai",title:(i+1)+"라운드",question:"",answers:""}; });
      adminHtml=""; renderAdmin(q);
    });
    return;
  }
  const act=q.active;
  const joined = q.joined || [];
  const picked = q.picked || [];
  const absent = MEMBERS.filter(function(m){ return joined.indexOf(m.n)<0; });
  const rest = joined.filter(function(n){ return picked.indexOf(n)<0; });
  const h='<div class="admin">'
    + '<div class="h">참석 현황 · 등록 '+joined.length+'명 / 명단 '+MEMBERS.length+'명</div>'
    + '<div class="chips">'
    +   joined.map(function(n){
          return '<span class="chip'+(picked.indexOf(n)>=0?" won":"")+'">'+esc(n)+'</span>'; }).join("")
    +   absent.map(function(m){ return '<span class="chip no">'+esc(m.n)+' (미참여)</span>'; }).join("")
    + '</div>'
    + '<div class="acts" style="margin-top:12px">'
    +   '<button id="finalize" class="go">남은 '+rest.length+'명 마지막 조로 확정</button>'
    +   '<button id="resetJoined" class="warn">참석 등록 초기화</button></div>'
    + '<div class="h" style="margin-top:22px">총무용 · 라운드 편집</div>'
    + rounds.map(function(r,i){
        const w=(q.groups&&q.groups[i])||[];
        const on=act&&act.i===i;
        return '<div class="qr" data-i="'+i+'"><div class="l1"><span class="idx">R'+(i+1)+'</span>'
          + '<select class="ty">'+['ai','title','lyrics','observe'].map(function(t){
              return '<option value="'+t+'"'+(r.type===t?' selected':'')+'>'+QTYPE[t]+'</option>'; }).join("")+'</select>'
          + '<input class="ti" value="'+String(r.title||"").replace(/"/g,"&quot;")+'" placeholder="라운드 이름">'
          + '<span class="st">'+(on?(act.started?"● 진행 중":"○ 준비됨"):"")+' '+w.length+'/'+(q.win||4)+'</span></div>'
          + '<textarea class="qu" placeholder="문제">'+esc(r.question||"")+'</textarea>'
          + '<input class="an" value="'+String(r.answers||"").replace(/"/g,"&quot;")+'" placeholder="정답 · 여러 표기는 | 로 구분">'
          + '<div class="miss" style="margin-top:7px">'
          +   '여러 표기 <b>A|B</b> · 포함되면 인정 <b>*키워드</b> · 둘 다 있어야 인정 <b>가수+제목</b>'
          + '</div>'
          + '<div class="acts"><button data-a="arm">준비</button><button data-a="start" class="go">시작</button>'
          +   '<button data-a="stop">종료</button><button data-a="post">슬랙 재게시</button>'
          +   '<button data-a="clear" class="warn">정답자 초기화</button></div></div>';
      }).join("")
    + '<div class="acts" style="margin-top:16px"><button id="addR">라운드 추가</button>'
    +   '<button id="delR">마지막 라운드 삭제</button>'
    +   '<button id="save" class="go">전체 저장</button>'
    +   '<button id="clearAll" class="warn">전체 정답자 초기화</button></div></div>';
  if(h!==adminHtml){ elAdmin.innerHTML=h; adminHtml=h; }
}
elAdmin.addEventListener("click", function(e){
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="save"){ rounds=collect(); adminCall({action:"save",rounds:rounds},function(){ showToast("저장했습니다"); adminHtml=""; }); return; }
  if(b.id==="addR"){ rounds=collect(); rounds.push({type:"ai",title:(rounds.length+1)+"라운드",question:"",answers:""});
    adminCall({action:"save",rounds:rounds},function(){ adminHtml=""; showToast("라운드 추가"); }); return; }
  if(b.id==="delR"){ rounds=collect();
    if(rounds.length<=1){ showToast("최소 1라운드는 있어야 합니다"); return; }
    if(!confirm("마지막 라운드를 지울까요?")) return;
    rounds.pop(); adminCall({action:"save",rounds:rounds},function(){ adminHtml=""; showToast("삭제했습니다"); }); return; }
  if(b.id==="clearAll"){ if(confirm("모든 라운드의 정답자를 지울까요?")) adminCall({action:"clearAll"}); return; }
  if(b.id==="finalize"){ if(confirm("남은 인원을 마지막 조로 확정하고 슬랙에 올릴까요?"))
      adminCall({action:"finalize"}, function(d){ if(d.ok) showToast(d.rest.length+"명 확정"); }); return; }
  if(b.id==="resetJoined"){ if(confirm("참석 등록을 모두 지울까요?")) adminCall({action:"resetJoined"}); return; }
  const row=b.closest(".qr"); if(!row) return;
  const i=parseInt(row.dataset.i,10), a=b.dataset.a;
  if(a==="arm"){ rounds=collect(); adminCall({action:"save",rounds:rounds},function(){ adminCall({action:"arm",i:i}); }); }
  else if(a==="start") adminCall({action:"start"});
  else if(a==="stop") adminCall({action:"stop"});
  else if(a==="post") adminCall({action:"post",i:i}, function(d){ if(d.ok) showToast("슬랙에 올렸습니다"); });
  else if(a==="clear"){ if(confirm("R"+(i+1)+" 정답자를 지울까요?")) adminCall({action:"clear",i:i}); }
});

/* ---------- 폴링 ---------- */
let timer=null, lastQ=null;
function load(){
  const nick=nickOf();
  fetch(API+"/quiz/state?nick="+encodeURIComponent(nick)+"&room="+ROOM)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d||!d.ok) return;
      lastQ=d.quiz; render(d.quiz); renderAdmin(d.quiz);
      next(pollMs(d.quiz));
    })
    .catch(function(){ next(4000); });
}
/* 화면을 보고 있을 때는 빠르게, 주머니 속(백그라운드)일 때는 느리게 돈다.
   라운드가 걸리면 1.2초로 당겨서 문제가 거의 동시에 뜨게 한다. */
function pollMs(q){
  if (document.hidden) return 30000;
  return (q && q.active) ? 1200 : 4000;
}
function next(ms){ clearTimeout(timer); timer=setTimeout(load, ms); }
document.addEventListener("visibilitychange", function(){ if(!document.hidden) load(); });
window.addEventListener("focus", load);
window.addEventListener("pageshow", load);
load();
</script>
</body>
</html>
